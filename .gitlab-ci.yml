# LJVIS2 source pipeline: standard-service-delivery@0.2.3, promotion: ci (release:pin jobs, no Kargo).
# Fourteen ARM64 images and fourteen release components (config + thirteen workloads).
# Pin: auto to dev on protected main; manual to test and prelive. No live in deploy[]
# until the live cluster runs the ljvis2 live ApplicationSet.
# Liquibase is a build-only image; resql-ljvis bakes the same RELEASE_VERSION
# into databaseMigration.
#
# The profile owns build, SBOM, Trivy, secret detection, package:charts and release:pin jobs.
# Do not add per-image image-build/dependency-track-sbom/trivy-image-scan/release-pin
# components next to it: they create a second job for every image.
# RELEASE_VERSION is MAJOR.MINOR.<pipeline IID> (ADR-031); MAJOR.MINOR comes from the
# first-parent subjects (feat: minor) or a "Release-As: X.Y" body line.
#
# Consumer-owned: DSL validation, frontend checks.
# Required subgroup variables: SERVICECODE, GITOPS_TOKEN, DTRACK_API_KEY.
# Inherited: HARBOR_*, SONAR_*, DTRACK_URL, ARGOCD_KUBERNETES_NONLIVE_*.
stages:
  - test
  - build
  - scan
  - package
  - deploy-dev
  - deploy-test
  - deploy-prelive
  - deploy-live

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - when: never

include:
  - component: gitlab.kemitaws.ee/platform-internal/ci-components/standard-service-delivery@0.2.3
    inputs:
      service_code: ljvis2
      promotion: ci
      # MR titles are not Conventional Commits yet; versions stay 0.3.<IID> until Release-As.
      commit_lint: false
      # First 0.2.x main pipeline scans the full history; report only until the
      # findings are reviewed and baselined in .gitleaksignore, then remove this.
      secret_detection_allow_failure: true
      architecture: arm64
      # The image-build matrix uses the repository root except for frontend.
      build_context: >-
        $(case "${name}" in frontend) printf '%s' frontend ;; *) printf '%s' . ;; esac)
      sonar_name: ljvis2
      sonar_sources: frontend,DSL
      sonar_quality_gate: false
      sonar_architecture: amd64
      sonar_extra_args: >-
        -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/draft/**,**/test/**
      builds:
        - name: ruuter
          image_repository: ruuter/images
          dockerfile: docker/ruuter/Dockerfile
        - name: ruuter-internal
          image_repository: ruuter-internal/images
          dockerfile: docker/ruuter-internal/Dockerfile
        - name: xtr
          image_repository: xtr/images
          dockerfile: docker/xtr/Dockerfile
        - name: frontend
          image_repository: frontend/images
          dockerfile: frontend/Dockerfile
        - name: s3-proxy
          image_repository: s3-proxy/images
          dockerfile: docker/s3-proxy/Dockerfile
        - name: liquibase
          image_repository: liquibase/images
          dockerfile: docker/liquibase/Dockerfile
        - name: resql-ljvis
          image_repository: resql-ljvis/images
          dockerfile: docker/resql-ljvis/Dockerfile
        - name: data-mapper
          image_repository: data-mapper/images
          dockerfile: docker/data-mapper/Dockerfile
        - name: tim
          image_repository: tim/images
          dockerfile: docker/tim/Dockerfile.release
        - name: nysiis
          image_repository: nysiis/images
          dockerfile: docker/nysiis/Dockerfile
        - name: pdf-creator
          image_repository: pdf-creator/images
          dockerfile: docker/pdf-creator/Dockerfile
        - name: cronmanager
          image_repository: cronmanager/images
          dockerfile: docker/cronmanager/Dockerfile
        - name: erru-xml-adapter
          image_repository: erru-xml-adapter/images
          dockerfile: docker/erru-xml-adapter/Dockerfile
        - name: erru-xml-adapter-old
          image_repository: erru-xml-adapter-old/images
          dockerfile: docker/erru-xml-adapter-old/Dockerfile
      components:
        - name: ljvis2-config
        - name: resql-ljvis
        - name: data-mapper
        - name: xtr
        - name: ruuter
        - name: ruuter-internal
        - name: s3-proxy
        - name: frontend
        - name: tim
        - name: nysiis
        - name: pdf-creator
        - name: cronmanager
        - name: erru-xml-adapter
        - name: erru-xml-adapter-old
      deploy:
        - environment: dev
          mode: auto
        - environment: test
          mode: manual
        - environment: prelive
          mode: manual
# ---------------------------------------------------------------------------- test

# Sonar cannot parse the Bürokratt DSL; validate graph and SQL references explicitly.
"validate:dsl":
  stage: test
  image: harbor.kemitaws.ee/base-images/devops-aio:1.0.0
  tags: ["arm64"]
  interruptible: true
  script:
    - set -euo pipefail
    - pip3 install --quiet pyyaml
    - python3 scripts/validate-dsl.py
    - bash scripts/test-xtee-mock.sh
    - bash scripts/test-erru-register-mocks.sh

.frontend:
  stage: test
  image: harbor.kemitaws.ee/dockerhub/library/node:22-alpine
  tags: ["arm64"]
  interruptible: true
  # Temporary onboarding state: these checks report failures but do not gate release yet.
  allow_failure: true
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules/]
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit

"frontend:lint":
  extends: .frontend
  script:
    - npm audit --audit-level=high || true
    - npm run lint

"frontend:test":
  extends: .frontend
  script:
    - npm run test -- --run --reporter=verbose

# Protected-ref image build already runs npm build; MR pipelines check it separately.
"frontend:build":
  extends: .frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      when: never
    - when: on_success
  script:
    - npm run build

"release:pin:dev":
  environment:
    name: dev
    url: https://dev.liiklusvalve.ee

"release:pin:test":
  environment:
    name: test
    url: https://demo.liiklusvalve.ee

"release:pin:prelive":
  environment:
    name: prelive
    url: https://prelive.liiklusvalve.ee
