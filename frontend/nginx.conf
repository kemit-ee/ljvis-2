# Korrelatsiooni-ID üldise veavastuse jaoks. Ruuter lisab igale vastusele päise `x-trace-id`
# ja sama ID (8 esimest märki, `t=…`) on logiridadel. Klient saab selle ise `traceparent` päisega
# ette anda, seetõttu lubame JSON-i ainult kuueteistkümnendmärgid.
map $upstream_http_x_trace_id $ljvis_trace_id {
    "~^[0-9a-fA-F]{32}$" $upstream_http_x_trace_id;
    default "";
}

server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ära avalda nginx-i versiooni (Server-päis ja vealehtede jalus).
    server_tokens off;

    include /etc/nginx/ljvis-security-headers.conf;

    location /tim/ {
        proxy_pass http://tim:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags ~ SameSite=Lax;
    }

    # Reverse-proxy TARA-Mock so the browser can reach the OIDC
    # authorize page (Docker-internal hostname is not resolvable).
    location /tara/ {
        proxy_pass https://tara-mock:8080/;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # TARA-Mock uses <base href="/"> so form action="back" resolves to /back
    location /back {
        proxy_pass https://tara-mock:8080/back;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Teavituste WebSocket — vajab HTTP/1.1 upgrade'i. Täpne match, et see
    # oleks `location /api/` prefiksist ülimuslik. Toodangus peab ka nginx-i
    # ees olev ALB/ingress selle tee upgrade'i läbi laskma.
    location = /api/notifications/connect {
        # Ühtne 500 vastus, vt @api_internal_error.
        proxy_intercept_errors on;
        error_page 500 = @api_internal_error;
        proxy_pass http://ruuter:8080/ljvis/notifications/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public synthetic X-Road sandbox; the real services stay on ruuter-internal.
    location /developer/ {
        proxy_pass http://ruuter:8080/xtee-mock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # Ühtne 500 vastus, vt @api_internal_error.
        proxy_intercept_errors on;
        error_page 500 = @api_internal_error;
        proxy_pass http://ruuter:8080/ljvis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Ühtne vastus igale Ruuteri 500-le. Muud staatused ja kehad lähevad kliendile muutmata.
    # Vea leiab Ruuteri logist trace id järgi.
    location @api_internal_error {
        default_type application/json;
        add_header X-Trace-Id $ljvis_trace_id always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/ljvis-security-headers.conf;
        return 500 '{"response":{"error":"INTERNAL_ERROR","traceId":"$ljvis_trace_id"}}';
    }

    # Runtime config (TARA redirect path) is written at container start to a
    # writable dir (the pod runs as uid 101, html root is read-only for it).
    location = /config.json {
        alias /var/run/ljvis-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/ljvis-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
