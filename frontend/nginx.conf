# --- Küpsised ----------------------------------------------------------------------------
# Taustateenustele edastatakse ainult seansiküpsis, mida rakendus vajab. __Host- eesliitega
# variant on eelistatud, kui see on olemas. Edastatakse alati täpselt üks küpsis.
# Kui seansiküpsise nimi muutub, tuleb muuta ka neid map-e.
map $http_cookie $ljvis_plain_cookie {
    default "";
    "~(?:^|;)\s*(?<ljvis_plain>customJwtCookie=[^;]*)" $ljvis_plain;
}
map $http_cookie $ljvis_session_cookie {
    default $ljvis_plain_cookie;
    "~(?:^|;)\s*(?<ljvis_host>__Host-customJwtCookie=[^;]*)" $ljvis_host;
}

# --- Päringupiirang --------------------------------------------------------
# Võti 1: seanss (JWT viimased 64 märki). Ametnikud võivad olla ühise NAT-i taga, seepärast
# ei saa peamine piirang olla IP-põhine. Ilma küpsiseta päringule see piirang ei rakendu.
#   5 päringut/s püsivalt (300/min), mida käsitsi kasutaja ei ületa; kuni 60 päringu
#   puhang teenindatakse kohe (vormi avamine, nimekirja lisapäringud on kümned päringud),
#   61.–100. lükatakse järjekorda tempoga 5/s, sealt edasi 429.
# Võti 2: kliendi IP, lai üldine ülempiir.
#   100 päringut/s ja puhang 300 mahutab ka suure asutuse ühe avaliku IP taga.
map $ljvis_session_cookie $ljvis_session_key {
    default "";
    "~=.*?(?<ljvis_sig>.{1,64})$" $ljvis_sig;
}
limit_req_zone $ljvis_session_key zone=ljvis_session:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ljvis_ip:10m rate=100r/s;

server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ära avalda nginx-i versiooni (Server-päis ja vealehtede jalus).
    server_tokens off;

    include /etc/nginx/ljvis-security-headers.conf;

    # Samu päiseid saadab ka mõni taustateenus (nt TIM). Eemaldame upstream'i koopiad, et
    # igal vastusel oleks üks väärtus. Upstream'i CSP jääb alles: brauser rakendab mõlemat
    # poliitikat korraga.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # nginx on pöördproksi taga (ALB, gateway): tegelik kliendi IP tuleb X-Forwarded-For
    # päisest. Usaldatakse ainult privaatvõrgu vahendajaid; lugemine käib paremalt vasakule
    # esimese mitteusaldatud aadressini.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_req_log_level warn;

    # Liiga suure päise korral (tavaliselt küpsised) palutakse brauseril küpsised kustutada
    # ja kuvatakse link rakenduse uuesti avamiseks.
    # Clear-Site-Data toimib ainult turvalises kontekstis (HTTPS või localhost).
    error_page 494 =400 @header_too_large;
    location @header_too_large {
        include /etc/nginx/ljvis-security-headers.conf;
        add_header Clear-Site-Data '"cookies"' always;
        add_header Cache-Control "no-store" always;
        default_type "text/html; charset=utf-8";
        return 400 '<!doctype html><html lang="et"><head><meta charset="utf-8"><title>LJVIS2</title></head><body><h1>Päring oli liiga suur</h1><p>Brauseri küpsised kustutati. <a href="/">Ava rakendus uuesti</a>.</p></body></html>';
    }

    location /tim/ {
        limit_req zone=ljvis_session burst=100 delay=60;
        limit_req zone=ljvis_ip burst=300 nodelay;
        proxy_pass http://tim:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $ljvis_session_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags ~ SameSite=Lax;
    }

    # Reverse-proxy TARA-Mock so the browser can reach the OIDC
    # authorize page (Docker-internal hostname is not resolvable).
    # Ainult kohalik arendus. Mock kasutab <base href> ja laeb jQuery välisest allikast,
    # seega rakenduse CSP-d siin ei saadeta (oma add_header katkestab päranduse).
    location /tara/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass https://tara-mock:8080/;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # TARA-Mock uses <base href="/"> so form action="back" resolves to /back
    location /back {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass https://tara-mock:8080/back;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Teavituste WebSocket — vajab HTTP/1.1 upgrade'i. Täpne match, et see
    # oleks `location /api/` prefiksist ülimuslik. Toodangus peab ka nginx-i
    # ees olev ALB/ingress selle tee upgrade'i läbi laskma.
    location = /api/notifications/connect {
        limit_req zone=ljvis_session burst=100 delay=60;
        limit_req zone=ljvis_ip burst=300 nodelay;
        proxy_pass http://ruuter:8080/ljvis/notifications/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $ljvis_session_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public synthetic X-Road sandbox; the real services stay on ruuter-internal.
    location /developer/ {
        limit_req zone=ljvis_ip burst=300 nodelay;
        proxy_pass http://ruuter:8080/xtee-mock/;
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=ljvis_session burst=100 delay=60;
        limit_req zone=ljvis_ip burst=300 nodelay;
        proxy_pass http://ruuter:8080/ljvis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $ljvis_session_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Runtime config (TARA redirect path) is written at container start to a
    # writable dir (the pod runs as uid 101, html root is read-only for it).
    location = /config.json {
        alias /var/run/ljvis-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/ljvis-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
