server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /tim/ {
        proxy_pass http://tim:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags ~ SameSite=Lax;
    }

    # Reverse-proxy TARA-Mock so the browser can reach the OIDC
    # authorize page (Docker-internal hostname is not resolvable).
    location /tara/ {
        proxy_pass https://tara-mock:8080/;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # TARA-Mock uses <base href="/"> so form action="back" resolves to /back
    location /back {
        proxy_pass https://tara-mock:8080/back;
        proxy_ssl_verify off;
        proxy_set_header Host tara-mock:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Teavituste WebSocket — vajab HTTP/1.1 upgrade'i. Täpne match, et see
    # oleks `location /api/` prefiksist ülimuslik. Toodangus peab ka nginx-i
    # ees olev ALB/ingress selle tee upgrade'i läbi laskma.
    location = /api/notifications/connect {
        proxy_pass http://ruuter:8086/ljvis/notifications/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://ruuter:8086/ljvis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
