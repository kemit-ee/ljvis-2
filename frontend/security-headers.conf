# Turvapäised. Kaasatakse nginx.conf-is server-tasemel ja igas
# location-is, kus on oma add_header (nginx ei päri vanema taseme päiseid, kui lapsel on
# vähemalt üks add_header). `always` lisab päised ka 4xx/5xx vastustele.
# Paigaldatud keskkondades kaasab sama faili ka ljvis2-devops repo frontendi ConfigMap.
#
# CSP: skriptid ainult samast päritolust (SPA ei kasuta inline-skripte); inline-stiilid on
# lubatud, sest TEDI/React-komponendid seavad style-atribuute. Veebisoketid (teavitused) on
# sama päritolu all ja kaetud 'self'-iga. frame-ancestors 'none': saiti ei kuvata raamis.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Brauser eirab HSTS-i HTTP üle, seega kohalikku arendust see ei mõjuta.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
