# Turvapäised (turvaauditi 2026-11: CSP puudus). Kaasatakse nginx.conf-is server-tasemel
# ja igas location-is, kus on oma add_header (nginx ei päri vanema taseme päiseid, kui
# lapsel on vähemalt üks add_header).
#
# CSP: skriptid ainult samast päritolust (SPA ei kasuta inline-skripte); inline-stiilid on
# lubatud, sest TEDI/React-komponendid seavad style-atribuute. Veebisoketid (teavitused) on
# sama päritolu all, seega connect-src 'self' ws: wss:. frame-ancestors 'none' takistab
# saidi kuvamist võõral lehel (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
