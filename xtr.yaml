dsl_path: /app/DSL
port: 8080

xroad_instance: ee-dev
xroad_protocol_version: "4.0"

client_data:
  member_class: GOV
  member_code: "70001231"
  subsystem_code: ljvis2

security_server:
  url: "https://cammy.ml.ee/"
  keystore_path: /app/ssl/keystore.p12
  keystore_password_env: XTR_KEYSTORE_PASSWORD
  trust_ca_path: /app/xtr-config/ca-bundle-with-cammy.pem

limits:
  max_request_bytes: 1048576
  max_response_bytes: 16777216
  request_timeout_secs: 30

# WSDL + .soap.yaml enables inbound SOAP and schema-aware outbound JSON.
wsdl_watch_dir: /app/wsdl
inbound:
  port: 8081
  public_base_url: http://localhost:9011
