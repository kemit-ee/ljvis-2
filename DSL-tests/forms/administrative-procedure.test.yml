# Haldusmenetluse andmeplokk (PPA andmevormid + TRAM-kaart): ligipääsureegel elab ühes kohas
# (templates/administrative-procedure/check-access) — TRAM/KLIM ametnik, süsteemi- või asutuse admin.
# GET loeb ja POST edit/save kirjutab uuele snapshot-reale ainult siis, kui reegel lubab ja vormi
# lugemiskontroll (check-read-access) nõustub.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
tests:
- name: TRAM officer reads the block of a form it may read
  setup:
    mocks:
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body: {userinfo: {claims: {personalCode: SESSION1}}}
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: SESSION1
        firstname: Real
        lastname: Person
        organisationid: 5
        organisationcode: TRAM
        permissions: [tram_driver_form.read]
    - url_matches: /control-forms/check-read-access
      method: POST
      status: 200
      body: [{allowed: true, status: confirmed}]
    - url_matches: /control-forms/administrative-procedure/get
      method: POST
      status: 200
      body: [{klimClarificationDate: '2026-03-01', penaltyExpiredOrProcessed: true, adminProcedureDecision: otsus}]
  request:
    method: GET
    path: /ljvis/v1/control-forms/administrative-procedure?formType=tram-card&id=9
    headers: {cookie: test}
  expect:
    status: 200
  verify_mocks:
  - url_matches: /control-forms/administrative-procedure/get
    count: 1
    body_matches:
      formType: tram-card
      formKey: '9'
  - url_matches: /control-forms/check-read-access
    count: 1
    body_matches:
      form_type: tram-card
      form_key: '9'

