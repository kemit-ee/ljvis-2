# Tekstiväljade pikkuse piirid API-s. 409 tähendab, et pikkusekontroll läbiti ja
# päring jõudis salvestamiseni; 422 max_length_exceeded tähendab, et see peatati enne andmebaasi.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
tests:
- name: nested text of 4000 characters in a JSON field is accepted
  setup:
    mocks:
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body: {userinfo: {claims: {personalCode: SESSION1}}}
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: SESSION1
        firstname: Real
        lastname: Person
        permissions: [vehicle_technical_form.write, vehicle_technical_form.read, control_form.edit_locked]
    - url_matches: /control-forms/vehicle-technical/get
      method: POST
      status: 200
      body: [{id: 5, status: saved, compoundFormKey: 9, createdBy: SESSION1, revision: 4}]
    - url_matches: /control-forms/compound-form/get
      method: POST
      status: 200
      body: [{id: 9, inspectorPersonalCode: SESSION1}]
    - url_matches: /control-forms/vehicle-technical/update
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/v1/control-forms/vehicle-technical/edit/save
    headers: {cookie: test, content-type: application/json}
    body: {"id": "5", "revision": 3, "resultType": "ok", "violations": "[{\"code\": \"A\", \"note\": \"\"}]"}
  expect:
    status: 409
  verify_mocks:
  - url_matches: /control-forms/vehicle-technical/update
    count: 1

- name: nested text of 4001 characters in a JSON field is refused
  setup:
    mocks:
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body: {userinfo: {claims: {personalCode: SESSION1}}}
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: SESSION1
        firstname: Real
        lastname: Person
        permissions: [vehicle_technical_form.write, vehicle_technical_form.read, control_form.edit_locked]
    - url_matches: /control-forms/vehicle-technical/get
      method: POST
      status: 200
      body: [{id: 5, status: saved, compoundFormKey: 9, createdBy: SESSION1, revision: 4}]
    - url_matches: /control-forms/compound-form/get
      method: POST
      status: 200
      body: [{id: 9, inspectorPersonalCode: SESSION1}]
    - url_matches: /control-forms/vehicle-technical/update
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/v1/control-forms/vehicle-technical/edit/save
    headers: {cookie: test, content-type: application/json}
    body: {"id": "5", "revision": 3, "resultType": "ok", "violations": "[{\"code\": \"A\", \"note\": \"\"}]"}
  expect:
    status: 422
  verify_mocks:
  - url_matches: /control-forms/vehicle-technical/update
    count: 0

