mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  NYSIIS_ENDPOINT: '{MOCK}/nysiis'
  NYSIIS_API_KEY: test-key
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
  ERRU_NU_TRANSPORT: xtr
  ERRU_XTR_BRIDGE: '{MOCK}/xtr'
tests:
- name: XTR transport - Hub acknowledgement persists sent
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - nu.read
        - nu.create
        - nu.send
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 503
      body: {}
    - url_matches: /erru/nu/get-source
      method: POST
      status: 200
      body:
      - eligible: true
    - url_matches: /erru/nu/begin-send
      method: POST
      status: 200
      body:
      - result: '{"version":"3.5","technicalId":"11111111-2222-4333-8444-555555555555","workflowId":"11111111-2222-4333-8444-555555555556","sentAt":"2026-09-11T12:00:00Z","nuTo":"DE","businessCaseId":"NU-TEST","tmFirstName":"Test","tmFamilyName":"Manager","tmFirstNameSearchKey":"TAST","tmFamilyNameSearchKey":"MANAGAR"}'
    - url_matches: /erru/nu/validate
      method: POST
      status: 200
      body:
      - result: '{"valid":true}'
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /erru/nu/get
      method: POST
      status: 200
      body:
      - id: 1
        version: 2
        status: initiated
        direction: outgoing
        businessCaseId: NU-TEST
        nuTo: DE
        originatingAuthority: EE-PPA
        requestSource: CA
        requestPurpose: Issue
        sourceGoodReputeFormKey: 10
        tmFirstName: Test
        tmFamilyName: Manager
        tmDateOfBirth: '1980-01-01'
        unfitStartDate: '2026-01-01'
    - url_matches: /nysiis
      method: POST
      status: 200
      body:
        searchKey: KEY
    - url_matches: /xtr/soap-out/erru/erru/NotifyUnfitness_Request
      method: POST
      status: 200
      body:
        header: null
        response:
          Header:
            "@workflowId": 11111111-2222-4333-8444-555555555556
          Body: {}
    - url_matches: /erru/nu/mark-dispatch
      method: POST
      status: 200
      body:
      - result: '{"status":"sent"}'
  request:
    method: POST
    path: /ljvis/v1/erru/nu/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      expectedVersion: 2
  expect:
    status: 200
  verify_mocks:
  - url_matches: /internal/nu/validate
    count: 0
  - url_matches: /internal/nu/send
    count: 0
  - url_matches: /erru/nu/begin-send
    count: 1
  - url_matches: /xtr/soap-out/erru/erru/NotifyUnfitness_Request
    count: 1
    body_matches:
      Header:
        "@version": '3.5'
        "@technicalId": 11111111-2222-4333-8444-555555555555
        "@workflowId": 11111111-2222-4333-8444-555555555556
        "@sentAt": '2026-09-11T12:00:00Z'
        "@from": EE
        "@to": DE
      Body:
        "@businessCaseId": NU-TEST
  - url_matches: /erru/nu/mark-dispatch
    count: 1
    body_matches:
      outcome: accepted
- name: XTR transport - SOAP Fault is a definite rejection
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - nu.read
        - nu.create
        - nu.send
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 503
      body: {}
    - url_matches: /erru/nu/get-source
      method: POST
      status: 200
      body:
      - eligible: true
    - url_matches: /erru/nu/begin-send
      method: POST
      status: 200
      body:
      - result: '{"version":"3.5","technicalId":"11111111-2222-4333-8444-555555555555","workflowId":"11111111-2222-4333-8444-555555555556","sentAt":"2026-09-11T12:00:00Z","nuTo":"DE","businessCaseId":"NU-TEST","tmFirstName":"Test","tmFamilyName":"Manager","tmFirstNameSearchKey":"TAST","tmFamilyNameSearchKey":"MANAGAR"}'
    - url_matches: /erru/nu/validate
      method: POST
      status: 200
      body:
      - result: '{"valid":true}'
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /erru/nu/get
      method: POST
      status: 200
      body:
      - id: 1
        version: 2
        status: initiated
        direction: outgoing
        businessCaseId: NU-TEST
        nuTo: DE
        originatingAuthority: EE-PPA
        requestSource: CA
        requestPurpose: Issue
        sourceGoodReputeFormKey: 10
        tmFirstName: Test
        tmFamilyName: Manager
        tmDateOfBirth: '1980-01-01'
        unfitStartDate: '2026-01-01'
    - url_matches: /nysiis
      method: POST
      status: 200
      body:
        searchKey: KEY
    - url_matches: /xtr/soap-out/erru/erru/NotifyUnfitness_Request
      method: POST
      status: 502
      body:
        error: upstream_soap_fault
        code: s:Client
        string: InvalidData
    - url_matches: /erru/nu/mark-dispatch
      method: POST
      status: 200
      body:
      - result: '{"status":"error"}'
  request:
    method: POST
    path: /ljvis/v1/erru/nu/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      expectedVersion: 2
  expect:
    status: 502
  verify_mocks:
  - url_matches: /internal/nu/validate
    count: 0
  - url_matches: /internal/nu/send
    count: 0
  - url_matches: /erru/nu/begin-send
    count: 1
  - url_matches: /xtr/soap-out/erru/erru/NotifyUnfitness_Request
    count: 1
    body_matches:
      Header:
        "@version": '3.5'
        "@technicalId": 11111111-2222-4333-8444-555555555555
        "@workflowId": 11111111-2222-4333-8444-555555555556
        "@sentAt": '2026-09-11T12:00:00Z'
        "@from": EE
        "@to": DE
      Body:
        "@businessCaseId": NU-TEST
  - url_matches: /erru/nu/mark-dispatch
    count: 1
    body_matches:
      outcome: rejected
