        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ncr/get
      method: POST
      status: 200
      body:
      - id: 9
        version: 4
        status: answer_drafted
        direction: incoming
        businessCaseId: LV-NCR-2026-TEST0001
        ncrFrom: LV
        ncrTo: EE
        originatingAuthority: LV-CSDD
        respondingAuthority: EE-TRAM
        responseStatusCode: NotFound
        responseStatusMessage: ''
        transportUndertakingName: Test OU
        communityLicenceNumber: EE-1
        responseNumberOfVehicles: 4
        responseCommunityLicenceStatus: Active
        responseAddress: '{"address":"Tee 1","postCode":"10111","city":"Tallinn","country":"EE"}'
        responsePenaltiesImposed: '[]'
    - url_matches: /internal/ncr-response/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ncr/begin-response
      method: POST
      status: 200
      body: *id001
    - url_matches: /internal/ncr-response/send
      method: POST
      status: 200
      body:
        status: accepted
        httpStatus: 200
        technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
    - url_matches: /erru/ncr/append-transition
      method: POST
      status: 200
      body:
      - id: 9
        status: answered
  request: *id002
  expect:
    status: 200
  verify_mocks:
  - url_matches: /internal/ncr-response/send
    count: 1
    body_matches:
      statusCode: NotFound
      transportUndertakingName: ''
      address: ''
- name: definite Hub rejection becomes error and may be retried
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - ncr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ncr/get
      method: POST
      status: 200
      body:
      - *id003
    - url_matches: /internal/ncr-response/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ncr/begin-response
      method: POST
      status: 200
      body: *id001
    - url_matches: /internal/ncr-response/send
      method: POST
      status: 200
      body:
        status: rejected
        httpStatus: 400
    - url_matches: /erru/ncr/append-transition
      method: POST
      status: 200
      body:
      - id: 9
        status: error
  request: *id002
  expect:
    status: 502
  verify_mocks:
  - url_matches: /erru/ncr/append-transition
    count: 1
    body_matches:
      newStatus: error
