mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
  NYSIIS_ENDPOINT: '{MOCK}/nysiis'
  NYSIIS_API_KEY: test-key
  INTERNAL_COMMUNICATION_KEY: test-token
tests:
- name: resend to one member state keeps the status and sends a new envelope
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - cgr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - &id001
        id: 1
        version: 5
        status: responded
        direction: outgoing
        businessCaseId: CGR-EE-2026-00001
        cgrTo: ZZ
        originatingAuthority: EE-TRAM
        requestSource: CA
        requestPurpose: Issue
        tmFirstName: Mari
        tmFamilyName: Maasikas
        tmDateOfBirth: '1980-05-01'
        tmPlaceOfBirth: Tallinn
        tmFirstNameSearchKey: MAR
        tmFamilyNameSearchKey: MASACAS
        certificateNumber: ''
        certificateIssueDate: ''
        certificateIssueCountry: ''
        memberStates: '[{"memberStateCode":"DE","statusCode":"Found"},{"memberStateCode":"PL","statusCode":"NotAvailable"}]'
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body:
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-12-22T10:00:00Z'
        status: responded
        version: 6
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: accepted
        httpStatus: 202
        technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
  request: &id002
    method: POST
    path: /ljvis/v1/erru/cgr/resend
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      memberStateCode: pl
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/cgr/begin-send
    count: 1
    body_matches:
      key: '1'
      targetMemberState: PL
  - url_matches: /internal/cgr/send
    count: 1
    body_matches:
      cgrTo: PL
      technicalId: 11111111-1111-1111-1111-111111111111
      workflowId: 22222222-2222-2222-2222-222222222222
      businessCaseId: CGR-EE-2026-00001
      tmFirstNameSearchKey: MAR
      tmFamilyNameSearchKey: MASACAS
  - url_matches: /erru/cgr/append-transition
    count: 0
- name: rejected resend changes no status and is retryable
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - cgr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body:
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-12-22T10:00:00Z'
        status: responded
        version: 6
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: rejected
        httpStatus: 400
  request: *id002
  expect:
    status: 502
  verify_mocks:
  - url_matches: /internal/cgr/send
    count: 1
  - url_matches: /erru/cgr/append-transition
    count: 0
- name: uncertain resend is reported as send_unknown and changes no status
  setup:
    mocks:
