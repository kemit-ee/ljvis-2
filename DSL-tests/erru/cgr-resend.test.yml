        - cgr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body:
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-12-22T10:00:00Z'
        status: responded
        version: 6
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: unknown
  request: *id002
  expect:
    status: 502
  verify_mocks:
  - url_matches: /internal/cgr/send
    count: 1
  - url_matches: /erru/cgr/append-transition
    count: 0
