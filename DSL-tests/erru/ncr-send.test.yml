      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - ncr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ncr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/ncr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ncr/begin-send
      method: POST
      status: 200
      body: *id002
    - url_matches: /internal/ncr/send
      method: POST
      status: 200
      body:
        status: unknown
    - url_matches: /erru/ncr/append-transition
      method: POST
      status: 200
      body:
      - id: 5
        status: send_unknown
  request: *id003
  expect:
    status: 502
  verify_mocks:
  - url_matches: /erru/ncr/append-transition
    count: 1
    body_matches:
      newStatus: send_unknown
