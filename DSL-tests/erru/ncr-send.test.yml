mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
  INTERNAL_COMMUNICATION_KEY: test-token
tests:
- name: 'accepted by the Hub: sent, with the reserved envelope and the full check data'
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - ncr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ncr/get
      method: POST
      status: 200
      body:
      - &id001
        id: 5
        version: 2
        status: initiated
        direction: outgoing
        businessCaseId: NCR-EE-2026-00001
        ncrFrom: EE
        ncrTo: LV
        originatingAuthority: TRAM
        requestSource: RSI
        requestPurpose: Control
        transportUndertakingName: Test OU
        communityLicenceNumber: LV-1
        vehicleRegistrationNumber: 123ABC
        vehicleRegistrationCountry: LV
        checkResult: Fail
        checkDate: '2026-10-01'
        minorInfringement: '{"dateOfInfringement":"2026-10-01","numberOfInfringements":2}'
        seriousInfringements: '[]'
    - url_matches: /internal/ncr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ncr/begin-send
      method: POST
      status: 200
      body: &id002
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-12-23T10:00:00Z'
        status: sending
        version: 3
    - url_matches: /internal/ncr/send
      method: POST
      status: 200
      body: &id004
        status: accepted
        httpStatus: 202
        technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
    - url_matches: /erru/ncr/append-transition
      method: POST
      status: 200
      body:
      - id: 5
        status: sent
        workflowId: 22222222-2222-2222-2222-222222222222
  request: &id003
    method: POST
    path: /ljvis/v1/erru/ncr/send
    headers:
      cookie: test
      content-type: application/json
    body:
      businessCaseId: NCR-EE-2026-00001
  expect:
    status: 200
  verify_mocks:
  - url_matches: /internal/ncr/validate
    count: 1
  - url_matches: /erru/ncr/begin-send
    count: 1
    body_matches:
      businessCaseId: NCR-EE-2026-00001
  - url_matches: /internal/ncr/send
    count: 1
    body_matches:
      ncrTo: LV
      businessCaseId: NCR-EE-2026-00001
      technicalId: 11111111-1111-1111-1111-111111111111
      workflowId: 22222222-2222-2222-2222-222222222222
      originatingAuthority: Estonian Transport Administration
      requestSource: RSI
      requestPurpose: Control
      checkResult: Fail
      checkDate: '2026-10-01'
      vehicleRegistrationNumber: 123ABC
  - url_matches: /erru/ncr/append-transition
    count: 1
    body_matches:
      newStatus: sent
- name: definite Hub rejection becomes error and may be retried
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - ncr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ncr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/ncr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ncr/begin-send
      method: POST
      status: 200
      body: *id002
    - url_matches: /internal/ncr/send
      method: POST
      status: 200
      body:
        status: rejected
        httpStatus: 400
    - url_matches: /erru/ncr/append-transition
      method: POST
      status: 200
      body:
      - id: 5
        status: error
  request: *id003
  expect:
    status: 502
  verify_mocks:
  - url_matches: /erru/ncr/append-transition
    count: 1
    body_matches:
      newStatus: error
- name: uncertain transport outcome is send_unknown, never error
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
