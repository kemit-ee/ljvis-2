mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
  NYSIIS_ENDPOINT: '{MOCK}/nysiis'
  INTERNAL_COMMUNICATION_KEY: test-token
tests:
- name: 'accepted by the Hub: sent, with the reserved envelope and criteria'
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - cgr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - &id001
        id: 1
        version: 1
        status: initiated
        direction: outgoing
        businessCaseId: CGR-EE-2026-00001
        cgrTo: ZZ
        originatingAuthority: EE-TRAM
        requestSource: CA
        requestPurpose: Issue
        tmFirstName: Mari
        tmFamilyName: Maasikas
        tmDateOfBirth: '1980-05-01'
        tmPlaceOfBirth: Tallinn
        tmFirstNameSearchKey: MAR
        tmFamilyNameSearchKey: MASACAS
        certificateNumber: ''
        certificateIssueDate: ''
        certificateIssueCountry: ''
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body: &id002
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-12-22T10:00:00Z'
        status: sending
        version: 2
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: accepted
        httpStatus: 202
        technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
    - url_matches: /erru/cgr/append-transition
      method: POST
      status: 200
      body:
      - id: 1
        status: sent
        workflowId: 22222222-2222-2222-2222-222222222222
  request: &id003
    method: POST
    path: /ljvis/v1/erru/cgr/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /internal/cgr/validate
    count: 1
  - url_matches: /erru/cgr/begin-send
    count: 1
    body_matches:
      key: '1'
      tmFirstNameSearchKey: MAR
      targetMemberState: ''
  - url_matches: /internal/cgr/send
    count: 1
    body_matches:
      cgrTo: ZZ
      businessCaseId: CGR-EE-2026-00001
      technicalId: 11111111-1111-1111-1111-111111111111
      workflowId: 22222222-2222-2222-2222-222222222222
      originatingAuthority: EE-TRAM
      requestSource: CA
      requestPurpose: Issue
      tmFirstName: Mari
      tmFamilyName: Maasikas
      tmDateOfBirth: '1980-05-01'
      tmFirstNameSearchKey: MAR
      tmFamilyNameSearchKey: MASACAS
  - url_matches: /erru/cgr/append-transition
    count: 1
    body_matches:
      newStatus: sent
- name: definite Hub rejection becomes error and may be retried
  setup:
    mocks:
    - url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - cgr.send
    - url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body: *id002
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: rejected
        httpStatus: 400
    - url_matches: /erru/cgr/append-transition
      method: POST
      status: 200
      body:
      - id: 1
        status: error
  request: *id003
  expect:
    status: 502
  verify_mocks:
  - url_matches: /internal/cgr/send
    count: 1
  - url_matches: /erru/cgr/append-transition
    count: 1
    body_matches:
      newStatus: error
- name: uncertain transport outcome is send_unknown, never error
  setup:
    mocks:
