      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/cgr/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/cgr/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/cgr/begin-send
      method: POST
      status: 200
      body: *id002
    - url_matches: /internal/cgr/send
      method: POST
      status: 200
      body:
        status: unknown
        code: transport_failure
    - url_matches: /erru/cgr/append-transition
      method: POST
      status: 200
      body:
      - id: 1
        status: send_unknown
  request: *id003
  expect:
    status: 502
  verify_mocks:
  - url_matches: /internal/cgr/send
    count: 1
  - url_matches: /erru/cgr/append-transition
    count: 1
    body_matches:
      newStatus: send_unknown
