      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/ctud/get
      method: POST
      status: 200
      body:
      - *id001
    - url_matches: /internal/ctud/validate
      method: POST
      status: 200
      body:
        status: valid
    - url_matches: /erru/ctud/begin-send
      method: POST
      status: 200
      body: *id002
    - url_matches: /internal/ctud/send
      method: POST
      status: 200
      body:
        status: unknown
    - url_matches: /erru/ctud/append-transition
      method: POST
      status: 200
      body:
      - id: 1
        status: send_unknown
  request: *id003
  expect:
    status: 502
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 1
    body_matches:
      newStatus: send_unknown
