mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  NYSIIS_ENDPOINT: '{MOCK}/nysiis'
  NYSIIS_API_KEY: test-key
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
tests:
- name: concurrent revision rejects prepared send
  setup:
    mocks:
    - &id001
      url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - &id002
      url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - nu.read
        - nu.create
        - nu.send
    - &id003
      url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - &id004
      url_matches: /erru/nu/get-source
      method: POST
      status: 200
      body:
      - eligible: true
    - url_matches: /erru/nu/begin-send
      method: POST
      status: 200
      body:
      - result: '{"code":"version_conflict"}'
    - &id005
      url_matches: /erru/nu/validate
      method: POST
      status: 200
      body:
      - result: '{"valid":true}'
    - &id006
      url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - &id007
      url_matches: /erru/nu/get
      method: POST
      status: 200
      body:
      - id: 1
        version: 2
        status: initiated
        direction: outgoing
        businessCaseId: NU-TEST
        nuTo: DE
        originatingAuthority: EE-PPA
        requestSource: CA
        requestPurpose: Issue
        sourceGoodReputeFormKey: 10
        tmFirstName: Test
        tmFamilyName: Manager
        tmDateOfBirth: '1980-01-01'
        unfitStartDate: '2026-01-01'
    - &id008
      url_matches: /nysiis
      method: POST
      status: 200
      body:
        searchKey: KEY
    - url_matches: /internal/nu/validate
      method: POST
      status: 200
      body:
        status: valid
  request: &id009
    method: POST
    path: /ljvis/v1/erru/nu/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      expectedVersion: 2
  expect:
    status: 409
    body:
      response: '{"code":"version_conflict"}'
  verify_mocks:
  - url_matches: /internal/nu/send
    count: 0
  - url_matches: /erru/nu/begin-send
    count: 1
    body_matches:
      expectedVersion: 2
- name: changed source rejects prepared send
  setup:
    mocks:
    - *id001
    - *id002
    - *id003
    - *id004
    - url_matches: /erru/nu/begin-send
      method: POST
      status: 200
      body:
      - result: '{"code":"source_changed"}'
    - *id005
    - *id006
    - *id007
    - *id008
    - url_matches: /internal/nu/validate
      method: POST
      status: 200
      body:
        status: valid
  request: *id009
  expect:
    status: 409
    body:
      response: '{"code":"source_changed"}'
  verify_mocks:
  - url_matches: /internal/nu/send
    count: 0
  - url_matches: /erru/nu/begin-send
    count: 1
    body_matches:
      expectedVersion: 2
- name: stale browser version rejected before NYSIIS
  setup:
    mocks:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
  request:
    method: POST
    path: /ljvis/v1/erru/nu/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      expectedVersion: 1
  expect:
    status: 409
  verify_mocks:
  - url_matches: /nysiis
    count: 0
  - url_matches: /hub
    count: 0
- name: missing version returns validation error
  setup:
    mocks:
    - *id002
    - *id006
  request:
    method: POST
    path: /ljvis/v1/erru/nu/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
      expectedVersion: null
  expect:
    status: 422
  verify_mocks:
  - url_matches: /hub
    count: 0
