mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_TIM: '{MOCK}/tim'
  ERRU_XML_ADAPTER: '{MOCK}/adapter'
  INTERNAL_COMMUNICATION_KEY: test-token
tests:
- name: send converts RSI_FAILED_REASON items to rsiCheckedItemType
  setup:
    mocks:
    - &id001
      url_matches: /user/get_user_organisation_by_personal_code
      method: POST
      status: 200
      body: []
    - &id002
      url_matches: /user/get_user_permissions_by_personal_code
      method: POST
      status: 200
      body:
      - personalcode: TEST
        firstname: Test
        lastname: User
        permissions:
        - rsi.read
        - rsi.send
    - &id003
      url_matches: /jwt/userinfo
      method: GET
      status: 200
      body:
        userinfo:
          claims:
            personalCode: TEST
    - &id004
      url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
    - url_matches: /erru/rsi/get
      method: POST
      status: 200
      body:
      - id: 1
        status: initiated
        direction: outgoing
        businessCaseId: EE-RSI-2026-00001
        rsiTo: LV
        originatingAuthority: KLIM
        vehicleRegistrationNumber: ABC123
        vehicleRegistrationCountry: LV
        vehicleCategory: N3
        inspectionLocation: Tallinn
        inspectionDatetime: '2026-09-01T10:00:00'
        inspectionAuthorityOrName: Politsei- ja Piirivalveamet
        inspectionPassed: false
        ptiRequested: false
        vehicleProhibitionOrRestriction: false
        checkedItems: '[{"partCode":"0","status":"checked","defects":[]},{"partCode":"1","status":"non_compliant","defects":[{"defectCode":"1.1.3.a","severity":"OV"},{"defectCode":"1.1.4","severity":"VO"}],"nationalDefects":[{"defectCode":"CAA_1.1.3","severity":"OV"}]},{"partCode":"2","status":"not_checked","defects":[]},{"partCode":"20","status":"non_compliant","defects":[{"defectCode":"30","severity":"EOV"}]}]'
        version: 1
    - url_matches: /internal/rsi/send
      method: POST
      status: 200
      body:
        status: accepted
        httpStatus: 202
        technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /erru/rsi/append-transition
      method: POST
      status: 200
      body:
      - id: 1
        status: sent
        workflowId: WF-1
    - url_matches: /erru/rsi/begin-send
      method: POST
      status: 200
      body:
      - technicalId: 11111111-1111-1111-1111-111111111111
        workflowId: 22222222-2222-2222-2222-222222222222
        sentAt: '2026-10-21T15:00:00Z'
    - url_matches: /internal/rsi/validate
      method: POST
      status: 200
      body:
        status: valid
  request:
    method: POST
    path: /ljvis/v1/erru/rsi/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '1'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /internal/rsi/send
    count: 1
    body_matches:
      checkedItems: '[{"itemType":0,"itemFailed":false},{"itemType":1,"itemFailed":true,"failedChecks":[{"failedReason":"1.1.3.a","failedAssessment":"Major"},{"failedReason":"1.1.4","failedAssessment":"Minor"}]},{"itemType":20,"itemFailed":true,"failedChecks":[{"failedReason":"30","failedAssessment":"Dangerous"}]}]'
      technicalId: 11111111-1111-1111-1111-111111111111
      workflowId: 22222222-2222-2222-2222-222222222222
  - url_matches: /erru/rsi/begin-send
    count: 1
    body_matches:
      key: '1'
      expectedVersion: 1
  - url_matches: /erru/rsi/append-transition
    count: 1
    body_matches:
      newStatus: sent
- name: send rejects legacy TECHNICAL_CHECK codes and failed items without a reason
  setup:
    mocks:
    - *id001
    - *id002
    - *id003
    - *id004
    - url_matches: /erru/rsi/get
      method: POST
      status: 200
      body:
      - id: 2
        status: initiated
        direction: outgoing
        businessCaseId: EE-RSI-2026-00002
        rsiTo: LV
        checkedItems: '[{"partCode":"CAA_1","status":"non_compliant","defects":[{"defectCode":"CAA_1.1.3","severity":"OV"}]},{"partCode":"4","status":"non_compliant","defects":[]}]'
    - url_matches: /internal/rsi/validate
      method: POST
      status: 200
      body:
        status: valid
  request:
    method: POST
    path: /ljvis/v1/erru/rsi/send
    headers:
      cookie: test
      content-type: application/json
    body:
      id: '2'
  expect:
    status: 422
  verify_mocks:
  - url_matches: /internal/rsi/send
    count: 0
  - url_matches: /erru/rsi/append-transition
    count: 0
