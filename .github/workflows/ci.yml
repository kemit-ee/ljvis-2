name: CI

# Triggered on every push/PR that touches meaningful paths.
# Each job is atomic and independently readable.
# To disable a single check without breaking the quality gate,
# add `if: false` to that job — the quality gate treats skipped as passing.

on:
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI
  push:
    branches: [main, dev]
    paths:
      - 'DSL/**'
      - 'DSL-tests/**'
      - 'docker/**'
      - 'pdf-creator/**'
      - 'constants.ini'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/**'
      # - 'charts/**'  # re-enable when helm charts branch is merged
  pull_request:
    branches: [main, dev]
    paths:
      - 'DSL/**'
      - 'DSL-tests/**'
      - 'docker/**'
      - 'pdf-creator/**'
      - 'constants.ini'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/**'
      # - 'charts/**'  # re-enable when helm charts branch is merged

# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. DSL validation ──────────────────────────────────────────────────────
  # Fast syntax check — runs on every commit, catches broken YAML/SQL before
  # the heavier test jobs even start.
  validate-dsl:
    name: Validate DSL
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruuter YAML files
        run: |
          pip3 install pyyaml -q
          python3 - <<'EOF'
          import yaml, glob, sys
          all_yml = [p for p in (glob.glob('DSL/Ruuter/**/*.yml', recursive=True)
                                 + glob.glob('DSL/Ruuter.internal/**/*.yml', recursive=True))
                     if '/mock/' not in p]
          errors = []
          for path in all_yml:
              try:
                  with open(path) as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  errors.append(f'{path}: {e}')
          if errors:
              for e in errors:
                  print(f'❌  {e}')
              sys.exit(1)
          print(f'✅  {len(all_yml)} YAML files valid (mock files excluded)')
          EOF

      - name: Check for unreachable DSL steps
        run: |
          pip3 install pyyaml -q
          python3 - <<'EOF'
          import yaml, glob, sys

          def collect_next_refs(obj):
              refs = set()
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == 'next' and isinstance(v, str):
                          refs.add(v)
                      else:
                          refs.update(collect_next_refs(v))
              elif isinstance(obj, list):
                  for item in obj:
                      refs.update(collect_next_refs(item))
              return refs

          def has_next_key(obj):
              if isinstance(obj, dict):
                  if 'next' in obj:
                      return True
                  return any(has_next_key(v) for v in obj.values())
              elif isinstance(obj, list):
                  return any(has_next_key(item) for item in obj)
              return False

          errors = []
          for path in sorted(p for p in glob.glob('DSL/Ruuter/**/*.yml', recursive=True) if '/mock/' not in p):
              with open(path) as fh:
                  data = yaml.safe_load(fh)
              if not isinstance(data, dict):
                  continue
              steps = {k: v for k, v in data.items() if k != 'declaration'}
              if not steps:
                  continue
              step_names = list(steps.keys())
              entry = step_names[0]
              adjacency = {}
              for i, name in enumerate(step_names):
                  refs = collect_next_refs(steps[name]) - {'end'}
                  if not has_next_key(steps[name]) and i + 1 < len(step_names):
                      refs = {step_names[i + 1]}
                  adjacency[name] = refs
              visited, queue = set(), [entry]
              while queue:
                  cur = queue.pop()
                  if cur in visited:
                      continue
                  visited.add(cur)
                  queue.extend(ref for ref in adjacency.get(cur, set()) if ref in steps and ref not in visited)
              dead = [s for s in steps if s not in visited]
              if dead:
                  errors.append(f'{path}: unreachable steps: {dead}')
              all_refs = set()
              for body in steps.values():
                  all_refs.update(collect_next_refs(body) - {'end'})
              dangling = [r for r in all_refs if r not in steps]
              if dangling:
                  errors.append(f'{path}: dangling next references: {dangling}')
          if errors:
              for e in errors:
                  print(f'❌  {e}')
              sys.exit(1)
          total = len([p for p in glob.glob('DSL/Ruuter/**/*.yml', recursive=True) if '/mock/' not in p])
          print(f'✅  {total} DSL files — no unreachable steps (mock files excluded)')
          EOF

      - name: Check SQL files are non-empty
        run: |
          empty=$(find DSL/Resql DSL/Liquibase/changelog -name '*.sql' -empty 2>/dev/null)
          if [ -n "$empty" ]; then
            echo "❌ Empty SQL files found:"
            echo "$empty"
            exit 1
          fi
          count=$(find DSL/Resql DSL/Liquibase/changelog -name '*.sql' | wc -l | tr -d ' ')
          echo "✅ $count SQL files non-empty"

  # ── 1b. Guard audit (Ruuter boot + /_/unguarded) ───────────────────────────
  # Boots the pinned Ruuter image against each DSL tree. Catches broken YAML,
  # dangling next:/template: targets (boot fails) AND any HTTP route with zero
  # applicable guards (/_/unguarded). Replaces `dsl-lint --require-guard`, which
  # is not shipped in the runtime image.
  guard-audit:
    name: Guard Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Ruuter image
        id: img
        run: echo "ref=$(grep -m1 '^FROM ' docker/ruuter/Dockerfile | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Audit both DSL trees
        run: |
          set -euo pipefail
          IMG='${{ steps.img.outputs.ref }}'
          docker pull -q "$IMG"
          # require_guards=1 → also assert 0 unguarded routes (public gateway).
          # Ruuter.internal is IP-restricted, not guard-restricted → boot check only.
          fail=0
          for tree in "DSL/Ruuter/ljvis:ruuter.yaml:1" "DSL/Ruuter.internal/ljvis:ruuter-internal.yaml:0"; do
            dir=$(echo "$tree" | cut -d: -f1); cfg=$(echo "$tree" | cut -d: -f2); require_guards=$(echo "$tree" | cut -d: -f3)
            echo "── $dir ──"
            cid=$(docker run -d --rm -p 8080 \
              -v "$PWD/$dir:/app/DSL/ljvis:ro" \
              -v "$PWD/constants.ini:/app/constants.ini:ro" \
              -v "$PWD/$cfg:/app/ruuter.yaml:ro" \
              -e RUUTER_ADMIN_ENABLED=true "$IMG")
            port=$(docker port "$cid" 8080 | head -1 | sed 's/.*://')
            ok=0
            for i in $(seq 1 30); do
              if docker logs "$cid" 2>&1 | grep -q 'Server listening'; then ok=1; break; fi
              if ! docker ps -q --no-trunc | grep -q "$cid"; then break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "❌ $dir — Ruuter did not reach 'Server listening'"; docker logs "$cid" 2>&1 | grep -iE 'error|panic' | tail -20
              docker rm -f "$cid" >/dev/null 2>&1 || true; fail=1; continue
            fi
            if [ "$require_guards" = 1 ]; then
              # only the ljvis project — the base image also bundles demo/samples projects
              unguarded=$(curl -sf "http://localhost:$port/_/unguarded" \
                | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["projects"]["ljvis"]["unguarded"]))')
              docker rm -f "$cid" >/dev/null 2>&1 || true
              if [ "$unguarded" != 0 ]; then
                echo "❌ $dir — $unguarded unguarded route(s)"; fail=1
              else
                echo "✅ $dir — boots clean, 0 unguarded routes"
              fi
            else
              docker rm -f "$cid" >/dev/null 2>&1 || true
              echo "✅ $dir — boots clean (guard check skipped: IP-restricted)"
            fi
          done
          exit $fail

  # ── 1c. Ruuter dsl-lint / dsl-test ─────────────────────────────────────────
  # Static validation against the ACTUAL Ruuter DSL parser, pinned to the same
  # version as the runtime image (docker/ruuter/Dockerfile). Catches what the
  # Python checks above and the Guard Audit boot cannot: unrecognised step
  # keys, unresolved [#constant] references, template: targets that resolve to
  # no DSL — plus --require-guard (HTTP route with zero applicable guards).
  # dsl-test runs the DSL-tests/ scenario suite through the real router.
  #
  # The tool binaries are not shipped in the runtime image, so they are built
  # from the pinned Ruuter tag on this runner (glibc/openssl match) and cached
  # by tag — a cache hit skips the Rust build entirely.
  dsl-lint:
    name: DSL Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned Ruuter version
        id: ruuter
        run: |
          tag=$(grep -m1 '^FROM turnerrainer/ruuter:' docker/ruuter/Dockerfile \
                | sed -E 's|^FROM turnerrainer/ruuter:([^@[:space:]]+).*|\1|')
          [ -n "$tag" ] || { echo "::error::could not resolve Ruuter tag from docker/ruuter/Dockerfile"; exit 1; }
          echo "ref=v$tag" >> "$GITHUB_OUTPUT"
          echo "dsl-lint / dsl-test pinned to Ruuter v$tag"

      # Cache the two built binaries directly — keyed on the Ruuter tag, so a
      # tool build only happens when the pinned Ruuter version changes.
      # BUMP the -vN suffix if the local patch below changes.
      - name: Restore cached dsl-lint / dsl-test
        id: toolcache
        uses: actions/cache@v4
        with:
          path: .ruuter-tools
          key: ruuter-dsl-tools-${{ runner.os }}-${{ steps.ruuter.outputs.ref }}-v1

      - name: Build dsl-lint / dsl-test from pinned Ruuter
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ruuter.outputs.ref }}" \
            https://github.com/turnerrainer/Ruuter.git "$RUNNER_TEMP/ruuter"
          cd "$RUNNER_TEMP/ruuter"
          # turnerrainer/Ruuter#80 — dsl-lint's KNOWN_STEP_KEYS is missing
          # `ws_tag` (the runtime parser accepts it). Patch until a Ruuter
          # release carries the fix, then this becomes a no-op.
          grep -q '"ws_tag"' src/bin/dsl_lint.rs \
            || sed -i 's/^    "ws_send",$/    "ws_send",\n    "ws_tag",/' src/bin/dsl_lint.rs
          cargo build --release --bin dsl-lint --bin dsl-test
          mkdir -p "$GITHUB_WORKSPACE/.ruuter-tools"
          cp target/release/dsl-lint target/release/dsl-test "$GITHUB_WORKSPACE/.ruuter-tools/"

      # --dsl points at the tree whose sub-dirs are project names (ljvis/),
      # matching the container's `config_path: /app/DSL` + `/app/DSL/ljvis`
      # mount — so routes resolve as /ljvis/... and --require-guard loads the
      # real guard tree.
      - name: dsl-lint — public gateway (guards required)
        run: |
          .ruuter-tools/dsl-lint --dsl DSL/Ruuter --constants constants.ini --require-guard

      - name: dsl-lint — internal router
        run: |
          .ruuter-tools/dsl-lint --dsl DSL/Ruuter.internal --constants constants.ini

      - name: dsl-test — DSL-tests/ scenario suite
        run: |
          .ruuter-tools/dsl-test --dsl DSL/Ruuter --tests DSL-tests --constants constants.ini

  # ── 2. Security scanning (Trivy) ────────────────────────────────────────────
  # Runs after E2E so the security checks are the final CI validation stage.
  # Secret findings are blocking on main, but remain advisory on dev.
  security-scan:
    name: Security Scan (Trivy)
    needs: e2e
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.74.0
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp
          sudo install /tmp/trivy /usr/local/bin/trivy

      - name: Trivy — secret detection (whole repo)
        continue-on-error: ${{ github.ref == 'refs/heads/dev' || github.base_ref == 'dev' }}
        run: trivy fs . --scanners secret --format table --exit-code 1



  # ── 3. Backend E2E tests (full stack: DB + auth + API) ─────────────────────
  # Isolated stack via docker-compose.ci.yml — never conflicts with dev stack.
  # Bootstrap seeds admin + all DSL/Liquibase/test/*.sql fixtures via plain psql
  # (those changesets are ignore:true, so `liquibase update` never applies them).
  e2e:
    name: E2E Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run E2E tests
        run: bash tests/postman/run-all.sh tests/postman/ci-stack-environment.json

      - name: ZAP — baseline scan (stack already running)
        run: |
          mkdir -p zap-reports
          docker run --rm \
            --network host \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:9086 \
              -r zap-report.html \
              -J zap-report.json \
              -I || true

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs liquibase --tail=50
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs tara-mock --tail=30
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs tim --tail=50
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs ruuter --tail=50
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs resql-ljvis --tail=50
          docker compose -f docker-compose.ci.yml -p ljvis-ci logs bootstrap --tail=20

      - name: Tear down CI stack
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ljvis-ci down -v

      - name: Upload ZAP report
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-reports/

  # ── 5. Frontend lint ────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-22.04
    ### TODO remove after all frontend error is fixed
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

  # ── 6. Frontend unit tests ──────────────────────────────────────────────────
  frontend-unit-tests:
    name: Frontend — Unit Tests
    runs-on: ubuntu-22.04
    ### TODO remove after frontend error is fixed
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test -- --run --reporter=verbose

  # ── 7. Frontend build ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-22.04
    ### TODO remove after frontend fixes is ready
    continue-on-error: true
    needs: [frontend-lint, frontend-unit-tests]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── UI Tests (Playwright) ───────────────────────────────────────────────────
  # Brauseripõhised kontrollvormide testid. Tõstab ise üles docker-compose.ci.yml
  # pinu (tests/playwright/run.sh) ja käivitab frontendi vite-dev serveri selle
  # vastu. Esialgu MITTE blokeeriv (continue-on-error + väljas quality-gate'ist)
  # kuni stabiilne.
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright bundles its own Chromium; Google's chrome-stable apt repo on
      # the runner image is unused here and intermittently serves a stale
      # Packages.gz ("Hash Sum mismatch"), failing every apt-get update. Drop it.
      - name: Drop unused google-chrome apt repo
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright deps
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests/playwright

      - name: Run UI tests
        run: bash tests/playwright/run.sh

      - name: Show CI stack logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml -p ljvis-pw logs ruuter --tail=50 || true
          docker compose -f docker-compose.ci.yml -p ljvis-pw logs tim --tail=30 || true
          docker compose -f docker-compose.ci.yml -p ljvis-pw logs resql-ljvis --tail=30 || true

      - name: Tear down CI stack
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ljvis-pw down -v || true

      - name: Upload Playwright results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tulemus
          path: tests/playwright/tulemus/
          retention-days: 14

  # ── Quality Gate ────────────────────────────────────────────────────────────
  # Aggregates every required check. Add new jobs to `needs:` here as they
  # are introduced. Treats `skipped` as passing (allows disabling individual
  # jobs with `if: false` without breaking the gate).
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-22.04
    if: always()
    needs:
      - validate-dsl
      - guard-audit
      - dsl-lint
      - security-scan
      - e2e
      - frontend-lint
      - frontend-unit-tests
      - frontend-build

    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  validate-dsl:        ${{ needs.validate-dsl.result }}"
          echo "  guard-audit:         ${{ needs.guard-audit.result }}"
          echo "  dsl-lint:            ${{ needs.dsl-lint.result }}"
          echo "  security-scan:       ${{ needs.security-scan.result }}"
          echo "  e2e:                 ${{ needs.e2e.result }}"
          echo "  frontend-lint:       ${{ needs.frontend-lint.result }}"
          echo "  frontend-unit-tests: ${{ needs.frontend-unit-tests.result }}"
          echo "  frontend-build:      ${{ needs.frontend-build.result }}"
          echo ""

          failed=""
          for result in \
            "${{ needs.validate-dsl.result }}" \
            "${{ needs.guard-audit.result }}" \
            "${{ needs.dsl-lint.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-unit-tests.result }}" \
            "${{ needs.frontend-build.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed="true"
            fi
          done

          if [ -n "$failed" ]; then
            echo "❌ Quality gate FAILED — one or more checks did not pass."
            exit 1
          fi
          echo "✅ Quality gate PASSED"
