    # ── EPIC 04: Consumer read surface schemas ─────────────────────────

    ConsumerValuesCurrentRequest:
      type: object
      required: [classifierCode]
      properties:
        classifierCode:
          type: string
          description: The immutable code of the classifier whose currently-valid values are requested.
          example: "RTK"

    ConsumerValuesCurrentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerClassifierValueItem'
      example:
        data:
          - code: "EE"
            name: "Eesti"
            validFrom: "2020-01-01"
            validUntil: null
          - code: "DE"
            name: "Saksamaa"
            validFrom: "2020-01-01"
            validUntil: null

    ConsumerValuesResolveRequest:
      type: object
      required: [classifierCode, valueCode]
      properties:
        classifierCode:
          type: string
          description: The immutable code of the classifier.
          example: "RTK"
        valueCode:
          type: string
          description: The value code to resolve within the classifier.
          example: "EE"

    ConsumerValuesResolveResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: Whether the value code exists (current or historical) within the classifier.
        value:
          $ref: '#/components/schemas/ConsumerClassifierValueItem'
          description: Value metadata when exists is true; absent when false.
      example:
        exists: true
        value:
          code: "EE"
          name: "Eesti"
          validFrom: "2020-01-01"
          validUntil: null

    ConsumerCatalogueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerCatalogueItem'
      example:
        data:
          - code: "RTK"
            name: "Riigid ja territooriumid"
          - code: "SOIDUKIKATEGOORIA"
            name: "Sõidukikategooriad"

    ConsumerClassifierValueItem:
      type: object
      required: [code, name, validFrom]
      properties:
        code:
          type: string
          description: Immutable value code within the classifier.
        name:
          type: string
          description: Human-readable name of the value.
        validFrom:
          type: string
          format: date
          description: Start of validity (inclusive).
        validUntil:
          type: string
          format: date
          nullable: true
          description: End of validity (exclusive); null means open-ended.
      example:
        code: "EE"
        name: "Eesti"
        validFrom: "2020-01-01"
        validUntil: null

    ConsumerCatalogueItem:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Immutable classifier code.
        name:
          type: string
          description: Current human-readable name of the classifier.
      example:
        code: "RTK"
        name: "Riigid ja territooriumid"

    UserInfo:
      type: object
      properties:
        id:
          type: string
        personalcode:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        organisationid:
          type: string
        organisationname:
          type: string
        email:
          type: string
        status:
          type: string
        permissions:
          type: string
          description: Comma-separated permission codes.

    OrganisationItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string

    PermissionItem:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string

    LogEntry:
      type: object
      properties:
        id:
          type: string
        eventType:
          type: string
        eventCategory:
          type: string
        actorName:
          type: string
        actorPersonalCode:
          type: string
        description:
          type: string
        logContent:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
      example:
        id: "c0000001-0000-0000-0000-000000000001"
        eventType: "user.view"
        eventCategory: "user_management"
        actorName: "Marko Mägi"
        actorPersonalCode: "60001019906"
        description: "Kasutaja vaatamine: Kairi Sepp (60001017727)"
        logContent:
          targetPersonalCode: "60001017727"
          targetName: "Kairi Sepp"
        createdAt: "2026-06-01T10:00:00Z"
        createdBy: "Marko Mägi"

    LogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        total:
          type: number

    LogVerifyResponse:
      type: object
      required: [ok, checked]
      description: |
        Result of walking the audit-log hash chain over a range.
        `ok=true` means every row's `prev_row_hash` matched the previous
        row's `row_hash`. `ok=false` means the chain broke at
        `firstBreachEventId` — subsequent rows are not verified.
      properties:
        ok:
          type: boolean
          description: True if the whole range is intact.
        checked:
          type: integer
          minimum: 0
          description: Number of rows walked.
        from:
          type: string
          description: First event_id walked (either genesis or client-provided).
        to:
          type: string
          description: Last event_id walked (either tail or client-provided).
        firstBreachEventId:
          type: string
          nullable: true
          description: On failure, the event_id where the chain broke. Null when ok=true.
        reason:
          type: string
          enum: [prev_row_hash_mismatch, row_hash_recomputed_mismatch, missing_row]
          nullable: true
          description: On failure, why the chain broke. Null when ok=true.

    ForeignViolationFormSaveRequest:
      type: object
      required: [sanctionCode, recommendedMeasureCode, dataEntryDate, inspectorFirstName, inspectorLastName, inspectorOrganisationId, inspectorUnit, inspectorProfession]
      properties:
        formKey:
          type: string
          nullable: true
          description: Existing form key for updates; null for first save.
        reportingCountryCode:
          type: string
          description: Reporting country code from `countries` classifier. Required.
        reportingAuthorityName:
          type: string
          maxLength: 600
          description: Name of the reporting authority. Required.
        inspectionDate:
          type: string
          format: date
          description: Date of inspection. Must not be in the future. Required.
        inspectionTime:
          type: string
          nullable: true
          description: Time of inspection in HH:MM format.
        inspectionAddressLine1:
          type: string
          nullable: true
          description: Inspection location address (street/settlement).
        inspectionAddressLine2:
          type: string
          nullable: true
          description: Inspection location address (road/parking).
        inspectionRegion:
          type: string
          nullable: true
          description: Inspection location region/county (free text, not Estonian dropdown).
        inspectionCity:
          type: string
          nullable: true
          description: Inspection location city/municipality.
        inspectionCountryCode:
          type: string
          nullable: true
          description: Inspection country code from `countries` classifier.
        companyRegCode:
          type: string
          nullable: true
          description: Carrier company registration code.
        companyName:
          type: string
          nullable: true
          description: Carrier company name.
        companyCountryCode:
          type: string
          nullable: true
          description: Carrier company country from `countries` classifier.
        companyAddressLine1:
          type: string
          nullable: true
          description: Carrier company address.
        companyAddressLine2:
          type: string
          nullable: true
          description: Carrier company address (additional line).
        companyCity:
          type: string
          nullable: true
          description: Carrier company city.
        companyPostalCode:
          type: string
          nullable: true
          description: Carrier company postal code.
        driverFirstName:
          type: string
          nullable: true
          description: Driver first name.
        driverLastName:
          type: string
          nullable: true
          description: Driver last name.
        vehicleRegNr:
          type: string
          nullable: true
          description: Vehicle registration number (stored in uppercase).
        vehicleMake:
          type: string
          nullable: true
          description: Vehicle make.
        vehicleModel:
          type: string
          nullable: true
          description: Vehicle model.
        vehicleCountryCode:
          type: string
          nullable: true
          description: Vehicle registration country from `countries` classifier.
        vehicleVin:
          type: string
          maxLength: 17
          nullable: true
          description: Vehicle VIN (max 17 characters).
        vehicleFirstRegistration:
          type: string
          format: date
          nullable: true
          description: Vehicle first registration date.
        vehicleBodyType:
          type: string
          nullable: true
          description: Vehicle body type.
        licenceCopyNumber:
          type: string
          nullable: true
          description: Community licence certified copy number.
        violationDescription:
          type: string
          nullable: true
          description: Free text description of the violation.
        minorViolationsCount:
          type: integer
          nullable: true
          description: Number of minor violations detected.
        sanctionCode:
          type: string
          description: |
            Applied sanction. Required. One of: Korras, Hoiatus, Kabotažzveo ajutine keelamine,
            Trahv, Liiklemiskeeld, Sõiduki kasutamise takistamine, Muu.
        sanctionNotes:
          type: string
          nullable: true
          description: Additional sanction notes. Shown only when sanction is not "Korras".
        violations:
          type: array
          items:
            type: string
          nullable: true
          description: Array of EU Regulation 1071/2009 violation codes (from `EU_INFRINGEMENT` classifier).
        recommendedMeasureCode:
          type: string
          description: |
            Recommended measure from the other country. Required. One of: Puuduvad, Hoiatus,
            Kõigi või osa Ühenduse tegevusloa kinnitatud ärakirjade teatud ajaks peatamine,
            Kõigi või osa Ühenduse tegevusloa kinnitatud ärakirjade kehtetuks tunnistamine,
            Ühenduse tegevusloa teatud ajaks peatamine, Ühenduse tegevusloa kehtetuks tunnistamine,
            Juhitunnistuse väljastamisest keeldumine, Juhitunnistuse kehtetuks tunnistamine, Muu.
        recommendedMeasureNotes:
          type: string
          nullable: true
          description: Required when recommendedMeasureCode is "Muu".
        notes:
          type: string
          nullable: true
          description: Free text notes.
        dataEntryDate:
          type: string
          format: date
          description: Data entry date. Defaults to today; editable. Required.
        inspectorFirstName:
          type: string
          description: Inspector first name (pre-filled from user profile). Required.
        inspectorLastName:
          type: string
          description: Inspector last name (pre-filled from user profile). Required.
        inspectorOrganisationId:
          type: string
          description: Inspector organisation (pre-filled from user profile). Required.
        inspectorUnit:
          type: string
          description: Inspector structural unit from `STRUCTURE_UNIT` classifier filtered by organisation. Required.
        inspectorProfession:
          type: string
          description: Inspector job title (pre-filled from user profile). Required.

