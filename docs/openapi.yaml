# Updated to match actual Ruuter paths
openapi: 3.0.3

info:
  title: LJVIS 2 API
  version: 0.2.0
  description: |
    API contract for the LJVIS 2 application. Paths reflect the actual
    Ruuter DSL structure. Every endpoint is authorised via JWT cookie
    issued by TIM after TARA authentication. Error responses follow
    RFC 7807 Problem Details. Pagination follows the project pagination
    object convention with totalCount, page, pageSize.
  contact:
    name: TBD
    email: tbd@example.ee

servers:
  - url: https://dev.liiklusvalve.ee
    description: Development
  - url: https://staging.liiklusvalve.ee
    description: Staging
  - url: https://liiklusvalve.ee
    description: Production

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication and session management.
  - name: users-admin
    description: User account management — admin scope (all organisations).
  - name: users-local
    description: User account management — local scope (own organisation).
  - name: user-groups-admin
    description: User group management — admin scope.
  - name: user-groups-local
    description: User group management — local scope.
  - name: user-groups-write
    description: User group write operations and search.
  - name: classifiers
    description: Classifier catalogue management — list, detail view, and header editing.
  - name: classifier-values
    description: Classifier value management — list, add, and update validity.
  - name: organisations
    description: Organisation catalogue lookups.
  - name: permissions
    description: Permission catalogue lookups.
  - name: logs
    description: Audit log read operations.

paths:

  # ── Auth ──────────────────────────────────────────────────────────

  /auth/jwt/userinfo:
    get:
      tags: [auth]
      operationId: getAuthJwtUserinfo
      summary: Get current user info from JWT cookie.
      description: |
        Returns the authenticated user's profile and permissions list
        from the JWT cookie. Returns 401 if cookie is missing or expired.
      parameters:
        - in: header
          name: cookie
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Authenticated user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                id: "a0000001-0000-0000-0000-000000000001"
                personalcode: "60001019906"
                firstname: "Marko"
                lastname: "Mägi"
                organisationid: "b0000001-0000-0000-0000-000000000001"
                organisationname: "Politsei- ja Piirivalveamet"
                email: "marko.magi@ppa.ee"
                status: "active"
                permissions: "user_group.list.admin,user.list.admin,classifier.list"
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: postAuthLogout
      summary: Log out and clear JWT cookie.
      description: Blacklists the TIM session and clears the JWT cookie via Set-Cookie header.
      parameters:
        - in: header
          name: cookie
          schema:
            type: string
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: string
                example: logged out

  # ── Classifiers ────────────────────────────────────────────────────

  /v1/classifiers/values/check-code-exists:
    post:
      tags: [classifier-values]
      operationId: postClassifierValuesCheckCodeExists
      summary: Check whether a value code exists in a classifier.
      description: |
        Returns a boolean indicating whether the given code already exists
        within the specified classifier. Used before value creation for
        uniqueness validation. Requires classifier_value.edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifierValuesCheckCodeExistsRequest'
      responses:
        '200':
          description: Existence check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassifierValuesCheckCodeExistsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/values/insert:
    post:
      tags: [classifier-values]
      operationId: postClassifierValuesInsert
      summary: Add a new value to a classifier.
      description: |
        Creates a classifier value with code, name, and initial validity
        period. Code must be unique within the classifier (pre-INSERT
        check). Requires classifier_value.edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifierValuesCreateRequest'
      responses:
        '201':
          description: Classifier value created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifierValueDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict — value code already exists in this classifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/values/update:
    post:
      tags: [classifier-values]
      operationId: postClassifierValuesUpdate
      summary: Update a classifier value's validity period.
      description: |
        Inserts a new validity state row with the provided validFrom and
        optional validUntil. Supports ending (set validUntil to a chosen date),
        extending (push validUntil into the future), and re-opening an ended
        value (clear validUntil or set it to a future date). Code and name are
        immutable. Requires classifier_value.edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifierValuesUpdateRequest'
      responses:
        '200':
          description: Value validity updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifierValueDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/read/get-values:
    post:
      tags: [classifier-values]
      operationId: postClassifierReadGetValues
      summary: List classifier values with pagination.
      description: |
        Paginated value list for a given classifier. The activeOnly flag
        controls whether ended values are included. Sortable by code, name,
        validFrom, validUntil. Requires classifier.read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifierValuesListRequest'
      responses:
        '200':
          description: Classifier value page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassifierValuesListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/read/get:
    post:
      tags: [classifiers]
      operationId: postClassifierReadGet
      summary: Get a single classifier header.
      description: |
        Returns one classifier header with id, code, current name, and
        current description from the latest snapshot. Accepts classifierId
        or code (exactly one must be provided). Requires classifier.read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifiersGetRequest'
      responses:
        '200':
          description: Classifier header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifierHeader'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/read/list:
    post:
      tags: [classifiers]
      operationId: postClassifierReadList
      summary: List classifiers with search and pagination.
      description: |
        Paginated classifier list with search across code and name. Default
        sort by name in Estonian alphabetical order, case-insensitive.
        Requires classifier.list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifiersListRequest'
      responses:
        '200':
          description: Classifier page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassifiersListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/edit/update:
    post:
      tags: [classifiers]
      operationId: postClassifierEditUpdate
      summary: Update classifier name and description.
      description: |
        Inserts a new name/description state row for the classifier and
        rebuilds the latest snapshot. Rejects any request that carries a
        modified code (immutable). Requires classifier.edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminClassifiersUpdateRequest'
      responses:
        '200':
          description: Updated classifier header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifierHeader'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/read/get-value:
    post:
      tags: [classifiers]
      operationId: postClassifierReadGetValue
      summary: Get a single classifier value by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classifierValueId]
              properties:
                classifierValueId:
                  type: string
      responses:
        '200':
          description: Classifier value detail.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassifierValueDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── Classifier consumer read surface ──────────────────────────────

  /v1/classifiers/values/current:
    post:
      tags: [classifiers]
      operationId: postClassifiersValuesCurrent
      summary: Get currently-valid values for a classifier.
      description: |
        Returns the set of currently-valid values for a given classifier
        code. "Currently valid" ≡ isValid = true in classifier_value_latest
        (valid_from ≤ today AND (valid_until IS NULL OR valid_until > today)).
        Used by every downstream epic that renders a classifier-backed dropdown.
        Permission code: proposed (see epic_integration_points.md §7 gap 1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerValuesCurrentRequest'
      responses:
        '200':
          description: Currently-valid values for the requested classifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerValuesCurrentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/values/resolve:
    post:
      tags: [classifiers]
      operationId: postClassifiersValuesResolve
      summary: Validate a classifier code + value code tuple.
      description: |
        Validates that a given classifierCode + valueCode tuple refers to a
        value that exists (currently valid or historically) within that
        classifier. Used by write paths in consuming epics to verify incoming
        codes. Separated from values/current because historical business
        records may legitimately reference ended values (NFR-DATA-14).
        Permission code: proposed (see epic_integration_points.md §7 gap 1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerValuesResolveRequest'
      responses:
        '200':
          description: Resolution result with optional value metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerValuesResolveResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/classifiers/catalogue:
    get:
      tags: [classifiers]
      operationId: getClassifiersCatalogue
      summary: List all classifier codes with their current name.
      description: |
        Parameterless list of all classifier codes in the catalogue plus
        their current name. Intended for tooling / admin shells only; not
        for per-request dropdown population. Parameterless → GET allowed.
        Permission code: proposed (see epic_integration_points.md §7 gap 1).
      responses:
        '200':
          description: Full classifier catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerCatalogueResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── Organisations & Permissions ───────────────────────────────────

  /v1/organisations/list:
    post:
      tags: [organisations]
      operationId: postOrganisationsList
      summary: List all organisations.
      description: |
        Returns the full organisation catalogue, sorted by name in Estonian
        alphabetical order, case-insensitive. Used to populate organisation
        pickers in user and user-group create / edit flows. Requires
        organisation.list.
        Exception to `application_general_rules.md` §3.2 R2 per §3.1:
        returns the whole small immutable catalogue in a single response
        without a `pagination` object; the UI renders a checkbox list,
        not a TEDI `Pagination` component.
      responses:
        '200':
          description: Organisation catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganisationsListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/permissions/list:
    post:
      tags: [permissions]
      operationId: postPermissionsList
      summary: List all permissions.
      description: |
        Returns the immutable permission catalogue (codes + descriptions)
        used to populate the permission picker in user-group create and
        edit flows. The user-group detail view-mode does NOT call this
        endpoint — it renders permissions from the user-groups/get response.
        Requires permission.list (admin-only).
        Exception to `application_general_rules.md` §3.2 R2 per §3.1:
        returns the whole immutable catalogue in a single response
        without a `pagination` object; the UI renders a checkbox list,
        not a TEDI `Pagination` component.
      responses:
        '200':
          description: Permission catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPermissionsListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── User Groups — admin ────────────────────────────────────────────

  /v1/user-groups/write/insert:
    post:
      tags: [user-groups-write]
      operationId: postUserGroupsWriteInsert
      summary: Create a new user group.
      description: |
        Creates a user group atomically together with its organisation
        links and permission links. The response includes a server-computed
        coversAllOrganisations flag derived at read time from the active
        user_group_organisation rows; the value is not stored on user_group.
        Requires user_group.create (admin-only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserGroupsCreateRequest'
      responses:
        '201':
          description: User group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserGroupsCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Validation error (empty name, no organisations selected, unknown id, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/admin/read/get:
    post:
      tags: [user-groups-admin]
      operationId: postUserGroupsAdminReadGet
      summary: Get user group detail (admin).
      description: |
        Returns a single user group with its active organisations, active
        permissions, and current member count. Local account managers see
        only groups linked to their own organisation. Requires
        user_group.read.admin OR user_group.read.local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserGroupsGetRequest'
      responses:
        '200':
          description: User group detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserGroupsGetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/admin/list:
    post:
      tags: [user-groups-admin]
      operationId: postUserGroupsAdminList
      summary: List user groups — admin scope (all organisations).
      description: |
        Paginated user-group list with search across group name and linked
        organisation names. Local account managers receive only groups linked
        to their own organisation (scope-filtering uses the
        user_group_organisation snapshot rows; the coversAllOrganisations
        flag in each row is computed at read time from those rows and is not
        stored on user_group). Requires user_group.list.admin OR
        user_group.list.local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserGroupsListRequest'
      responses:
        '200':
          description: User group page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserGroupsListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/write/update-name:
    post:
      tags: [user-groups-write]
      operationId: postUserGroupsWriteUpdateName
      summary: Update user group name.
      description: |
        Updates one accordion's worth of fields on an existing user group:
        name, organisation links, or permission codes. Fields set to null are
        not modified. Organisation and permission changes use INSERT-only state
        rows (added rows go active, removed rows get a removed state row).
        Requires user_group.update (admin-only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserGroupsUpdateRequest'
      responses:
        '200':
          description: Updated user group state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserGroupsUpdateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cascade member removal preview — unlinked orgs have active members; re-send with confirmMemberRemoval=true to proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserGroupsUpdateCascadePreview'
        '422':
          description: Validation error (empty name, no organisations selected, unknown id, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/write/set-organisations:
    post:
      tags: [user-groups-write]
      operationId: postUserGroupsWriteSetOrganisations
      summary: Set organisations on a user group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, organisationIds]
              properties:
                id:
                  type: string
                organisationIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
                example: ok
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/write/set-permissions:
    post:
      tags: [user-groups-write]
      operationId: postUserGroupsWriteSetPermissions
      summary: Set permissions on a user group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, permissionIds]
              properties:
                id:
                  type: string
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
                example: ok
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/user-groups/admin/read/get-organisations:
    post:
      tags: [user-groups-admin]
      operationId: postUserGroupsAdminReadGetOrganisations
      summary: Get organisations linked to a user group (admin).
