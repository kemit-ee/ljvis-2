          format: int64
        status:
          type: string
          enum: [active, pending_deactivation, inactive]
        firstName:
          type: string
        lastName:
          type: string
        personalCode:
          type: string
          pattern: "^[1-6][0-9]{10}$"
        organisationName:
          type: string
        userGroups:
          type: array
          description: Display names of active user group memberships.
          items:
            type: string
      example:
        userId: 42
        status: "active"
        firstName: "Siim"
        lastName: "Tamm"
        personalCode: "39001010001"
        organisationName: "Politsei- ja Piirivalveamet"
        userGroups: ["PPA ametnik", "Inspector"]

    # ── EPIC 04: Consumer read surface schemas ─────────────────────────

    ConsumerValuesCurrentRequest:
      type: object
      required: [classifierCode]
      properties:
        classifierCode:
          type: string
          description: The immutable code of the classifier whose currently-valid values are requested.
          example: "RTK"

    ConsumerValuesCurrentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerClassifierValueItem'
      example:
        data:
          - code: "EE"
            name: "Eesti"
            validFrom: "2020-01-01"
            validUntil: null
          - code: "DE"
            name: "Saksamaa"
            validFrom: "2020-01-01"
            validUntil: null

    ConsumerValuesResolveRequest:
      type: object
      required: [classifierCode, valueCode]
      properties:
        classifierCode:
          type: string
          description: The immutable code of the classifier.
          example: "RTK"
        valueCode:
          type: string
          description: The value code to resolve within the classifier.
          example: "EE"

    ConsumerValuesResolveResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: Whether the value code exists (current or historical) within the classifier.
        value:
          $ref: '#/components/schemas/ConsumerClassifierValueItem'
          description: Value metadata when exists is true; absent when false.
      example:
        exists: true
        value:
          code: "EE"
          name: "Eesti"
          validFrom: "2020-01-01"
          validUntil: null

    ConsumerCatalogueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerCatalogueItem'
      example:
        data:
          - code: "RTK"
            name: "Riigid ja territooriumid"
          - code: "SOIDUKIKATEGOORIA"
            name: "Sõidukikategooriad"

    ConsumerClassifierValueItem:
      type: object
      required: [code, name, validFrom]
      properties:
        code:
          type: string
          description: Immutable value code within the classifier.
        name:
          type: string
          description: Human-readable name of the value.
        validFrom:
          type: string
          format: date
          description: Start of validity (inclusive).
        validUntil:
          type: string
          format: date
          nullable: true
          description: End of validity (exclusive); null means open-ended.
      example:
        code: "EE"
        name: "Eesti"
        validFrom: "2020-01-01"
        validUntil: null

    ConsumerCatalogueItem:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Immutable classifier code.
        name:
          type: string
          description: Current human-readable name of the classifier.
      example:
        code: "RTK"
        name: "Riigid ja territooriumid"

    UserInfo:
      type: object
      properties:
        id:
          type: string
        personalcode:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        organisationid:
          type: string
        organisationname:
          type: string
        email:
          type: string
        status:
          type: string
        permissions:
          type: string
          description: Comma-separated permission codes.

    OrganisationItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string

    PermissionItem:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string

    LogEntry:
      type: object
      properties:
        id:
          type: string
        eventType:
          type: string
        eventCategory:
          type: string
        actorName:
          type: string
        actorPersonalCode:
          type: string
        description:
          type: string
        logContent:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
      example:
        id: "c0000001-0000-0000-0000-000000000001"
        eventType: "user.view"
        eventCategory: "user_management"
        actorName: "Marko Mägi"
        actorPersonalCode: "60001019906"
        description: "Kasutaja vaatamine: Kairi Sepp (60001017727)"
        logContent:
          targetPersonalCode: "60001017727"
          targetName: "Kairi Sepp"
        createdAt: "2026-06-01T10:00:00Z"
        createdBy: "Marko Mägi"

    LogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        total:
          type: number
