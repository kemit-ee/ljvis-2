  # ── Users ──────────────────────────────────────────────────────────

  /v1/users/{scope}:
    get:
      tags: [users-admin]
      operationId: getUser
      summary: Get user detail (admin or local scope).
      description: |
        Returns a single user with personal data, organisation, structural
        unit, job title, contact info, access period, current state, and
        active group memberships. Requires user.read.admin OR user.read.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: User UUID.
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersGetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [users-admin]
      operationId: postUsers
      summary: Create a new user account.
      description: |
        Creates an immutable identity row (user_account), an initial
        user_account_data_state snapshot, and an initial active state row.
        Returns the DB-confirmed read-back of the created user. Requires
        user.edit.admin OR user.edit.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersCreateRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersGetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Conflict — personal code already exists (ERR-409-002).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Validation error (empty required field, invalid personal code checksum, invalid email, accessEnd before accessStart, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [users-admin]
      operationId: putUser
      summary: Update user personal data and access period.
      description: |
        Inserts a new user_account_data_state snapshot with updated fields.
        id must be included in the request body. Requires
        user.edit.admin OR user.edit.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersUpdateRequest'
      responses:
        '200':
          description: Updated user detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersGetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Validation error (empty required field, invalid email, accessEnd before accessStart, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/users/{scope}/search:
    get:
      tags: [users-admin]
      operationId: getUsers
      summary: Search/list users (admin or local scope).
      description: |
        Paginated user list with free-text search over first name and last
        name. scope=admin covers all organisations; scope=local is own org.
        Requires user.list.admin OR user.list.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
        - in: query
          name: q
          schema: { type: string }
          description: Search term.
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: sorting
          schema: { type: string }
      responses:
        '200':
          description: User page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/users/{scope}/groups:
    get:
      tags: [users-admin]
      operationId: getUserGroups2
      summary: Get user group memberships for a user.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: User UUID.
      responses:
        '200':
          description: Active group memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersUserGroupsGetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [users-admin]
      operationId: putUserGroups
      summary: Bulk save user group memberships for a user.
      description: |
        Atomically adds and removes group memberships for a user.
        userId must be included in the request body. Requires
        user.edit.admin OR user.edit.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersUserGroupsSaveRequest'
      responses:
        '200':
          description: Updated active memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersUserGroupsSaveResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict — user inactive or membership already active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Validation error — group not linked to user's organisation (ERR-422-013).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/users/{scope}/check-personal-code:
    post:
      tags: [users-admin]
      operationId: postUsersCheckPersonalCode
      summary: Check whether a personal code is already registered.
      description: |
        Boolean pre-INSERT existence check used before creating a new user
        to prevent duplicates. Requires user.edit.admin OR user.edit.local.
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, enum: [admin, local] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersCheckPersonalCodeExistsRequest'
      responses:
        '200':
          description: Existence check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersCheckPersonalCodeExistsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }


  # ── Audit Logs ─────────────────────────────────────────────────────

  /v1/logs:
    get:
      tags: [logs]
      operationId: getLogs
      summary: List audit log entries (paginated).
      description: |
        Paginated audit log list with free-text search over event type,
        description, and actor name. Requires audit.read.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: sorting
          schema: { type: string }
      responses:
        '200':
          description: Audit log page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/logs/log:
    get:
      tags: [logs]
      operationId: getLog
      summary: Get a single audit log entry.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: Audit log entry ID.
      responses:
        '200':
          description: Audit log entry detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/logs/export:
    get:
      tags: [logs]
      operationId: getLogsExport
      summary: Export audit log entries as CSV.
      description: |
        Accepts filter/sort as query params and returns a CSV file.
        Requires audit.read.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
        - in: query
          name: sorting
          schema: { type: string }
      responses:
        '200':
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/logs/verify:
    get:
      tags: [logs]
      operationId: getLogsVerify
      x-permissions:
        anyOf: [audit.verify]
      summary: Verify the audit-log hash chain.
      description: |
        Walks the audit hash chain from `from` (or the genesis row) to
        `to` (or the current tail) and returns either an "ok" result or
        the first breach location. See `docs/audit-logging.md` §Hash chain
        integrity for the invariant.

        Cheap read; no writes. Intended for scheduled integrity monitors
        and for pentest / audit spot-checks. Requires audit.verify (a
        privileged reader permission, separate from audit.read).
      parameters:
        - in: query
          name: from
          schema: { type: string }
          description: Start event_id (inclusive). Omit to start from the genesis row.
        - in: query
          name: to
          schema: { type: string }
          description: End event_id (inclusive). Omit to walk to the current tail.
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogVerifyResponse'
              examples:
                intact:
                  summary: Chain is intact.
                  value:
                    ok: true
                    checked: 15234
                    from: "01JAB2C3D4E5F6G7H8J9K0M1N2"
                    to: "01JAB2C9Z9Z9Z9Z9Z9Z9Z9Z9ZZ"
                breach:
                  summary: Chain breach detected.
                  value:
                    ok: false
                    checked: 5721
                    firstBreachEventId: "01JAB2C7X7X7X7X7X7X7X7X7X7"
                    reason: prev_row_hash_mismatch
                    from: "01JAB2C3D4E5F6G7H8J9K0M1N2"
                    to: "01JAB2C9Z9Z9Z9Z9Z9Z9Z9Z9ZZ"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── Foreign violation forms ─────────────────────────────────

  /api/v1/control-forms/foreign-violation:
    post:
      tags: [foreign-violation-forms]
      operationId: postForeignViolationForm
      summary: Create a new foreign violation form.
      description: |
        Creates a new form (generates form number `vr-YYYY-NNNNN/V`) and appends
        the first snapshot row. Previous data is not overwritten on subsequent saves —
        each PUT adds a new snapshot. Requires `foreign_violation_form.write`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForeignViolationFormSaveRequest'
      responses:
        '201':
          description: Form created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignViolationFormSaveResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation error — required fields missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/control-forms/foreign-violation/{formKey}:
    get:
      tags: [foreign-violation-forms]
      operationId: getForeignViolationForm
      summary: Get the latest snapshot of a foreign violation form.
      description: |
        Returns the latest snapshot row for the given form key.
        Requires `foreign_violation_form.read`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: formKey
          required: true
          schema: { type: string }
          description: Form unique identifier (e.g. `vr-2026-00001%2FV` URL-encoded).
      responses:
        '200':
          description: Form snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignViolationFormSnapshot'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [foreign-violation-forms]
      operationId: putForeignViolationForm
      summary: Save (update) an existing foreign violation form.
      description: |
        Appends a new snapshot row — previous data is not overwritten.
        Form is editable only while status is `saved`; in `confirmed` or `published`
        all fields become read-only. Requires `foreign_violation_form.write`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: formKey
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForeignViolationFormSaveRequest'
      responses:
        '200':
          description: Form saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignViolationFormSaveResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation error — required fields missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/control-forms/foreign-violation/{formKey}/files:
    get:
      tags: [foreign-violation-forms]
      operationId: getForeignViolationFormFiles
      summary: List file attachments for a form.
      description: |
        Returns the list of file metadata attached to the given form key.
        Requires `foreign_violation_form.read`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: formKey
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of file metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileMetadata'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [foreign-violation-forms]
      operationId: postForeignViolationFormFiles
      summary: Upload a file attachment to a form snapshot.
      description: |
        Uploads a file and attaches its metadata to the form snapshot.
        File is stored in S3; metadata is stored in `foreign_violation_form.files`.
        Allowed formats: jpg, jpeg, png, gif, bmp, tif, tiff, pdf, doc, docx, xls, xlsx,
        odt, rtf, msg, eml, txt, zip, ddd. Max size: 10 MB.
        Requires `foreign_violation_form.write`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: formKey
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded and metadata saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Unsupported file type or file exceeds 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/control-forms/foreign-violation/{formKey}/files/{fileId}:
    get:
      tags: [foreign-violation-forms]
      operationId: getForeignViolationFormFile
      summary: Download a specific file attachment.
      description: |
        Returns the binary content of the requested file from S3.
        Requires `foreign_violation_form.read`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: formKey
          required: true
          schema: { type: string }
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File binary content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/classifiers/violation-types:
    get:
      tags: [foreign-violation-forms]
      operationId: getClassifierViolationTypes
      summary: Get EU Regulation 1071/2009 violation types grouped by severity.
      description: |
        Returns classifier values from `EU_INFRINGEMENT` (153 values) filtered by
        severity group (MSI, VSI, SI). Requires `classifier.read`.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: regulation
          required: true
          schema:
            type: string
            enum: [1071_2009]
          description: Regulation code filter.
      responses:
        '200':
          description: Violation types grouped by severity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationTypesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/classifiers/countries:
    get:
      tags: [foreign-violation-forms]
      operationId: getClassifierCountries
      summary: Get countries classifier.
      description: |
        Returns all values from the `countries` classifier.
        Requires `classifier.read`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of country values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassifierValueSimple'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: customJwtCookie
      description: |
        JWT issued by TIM after TARA authentication, delivered as an
        HttpOnly, Secure, SameSite=Strict cookie. The cookie is set by
        TIM's `/tim/authenticate` callback; clients never see or
        manipulate the raw token.

        Cookie name is deployment-configurable via `CUSTOM_JWT_COOKIE_NAME`
        (see `docs/admin-deployment-guide.md`). The default is
        `customJwtCookie`.

        Standard RFC 7519 claims: iss, sub, aud, exp, iat, jti.
        Project-specific claims: personalCode, organisationId, permissions[].

        Design guide: `docs/rest-api-design-guide.md` §6.
        CSRF stance: `docs/rest-api-design-guide.md` §6.2.

  responses:
    BadRequest:
      description: Invalid request payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/bad-request"
            title: "Bad Request"
            status: 400
            detail: "Field 'page' must be a non-negative integer."
            instance: "/v1/user-groups/admin/search"
    Conflict:
      description: Conflict with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/conflict"
            title: "Conflict"
            status: 409
            detail: "User is already an active member of this group."
            instance: "/v1/user-groups/users"
    Forbidden:
      description: Insufficient permissions for the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Missing required permission: user_group.update"
            instance: "/v1/user-groups"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/internal-server-error"
            title: "Internal Server Error"
            status: 500
            detail: "Database transaction failed; the operation was rolled back."
            instance: "/v1/user-groups"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/not-found"
            title: "Not Found"
            status: 404
            detail: "User group with id 999 does not exist."
            instance: "/v1/user-groups/admin"
    ServiceUnavailable:
      description: Downstream dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/service-unavailable"
            title: "Service Unavailable"
            status: 503
            detail: "Audit log service is unreachable; retry later."
            instance: "/v1/user-groups"
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://ljvis.kemit.ee/problems/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "JWT is missing or expired."
            instance: "/v1/user-groups/admin/search"

  schemas:

    AdminClassifierValuesCheckCodeExistsRequest:
      type: object
      required: [classifierId, code]
      properties:
        classifierId:
          type: integer
          format: int64
          description: ID of the classifier to check within.
        code:
          type: string
          maxLength: 100
          description: Value code to check for existence.
      example:
        classifierId: 1
        code: "DE"

    AdminClassifierValuesCheckCodeExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: True if a value with this code already exists in the classifier.
      example:
        exists: false

    AdminClassifierValuesCreateRequest:
      type: object
      required: [classifierId, code, name, validFrom]
      properties:
        classifierId:
          type: integer
          format: int64
          description: ID of the classifier to add the value to.
        code:
          type: string
          maxLength: 100
          description: Business code of the new value. Must be unique within the classifier. Immutable after creation.
        name:
          type: string
          maxLength: 500
          description: Display name of the value. Immutable after creation.
        validFrom:
          type: string
          format: date
          description: Start date of validity (inclusive). ISO 8601 date.
        validUntil:
          type: string
          format: date
          nullable: true
          description: End date of validity (exclusive). Null means open-ended.
      example:
        classifierId: 1
        code: "DE"
        name: "Saksamaa"
        validFrom: "2026-01-01"
        validUntil: null

    AdminClassifierValuesUpdateRequest:
      type: object
      required: [classifierValueId, validFrom]
      properties:
        classifierValueId:
          type: integer
          format: int64
          description: ID of the classifier value whose validity period to update.
        validFrom:
          type: string
          format: date
          description: Start date of validity (inclusive). ISO 8601 date.
        validUntil:
          type: string
          format: date
          nullable: true
          description: End date of validity (exclusive). Must be strictly greater than validFrom when provided. Null or future date re-opens an ended value.
      example:
        classifierValueId: 99
        validFrom: "2020-01-01"
        validUntil: "2026-06-01"

    AdminClassifierValuesListRequest:
      type: object
      required: [classifierId]
      properties:
        classifierId:
          type: integer
          format: int64
          description: ID of the classifier whose values to list.
        activeOnly:
          type: boolean
          default: true
          description: When true, only currently valid values are returned. When false, ended values are included.
        sortField:
          type: string
          nullable: true
          enum: [code, name, validFrom, validUntil]
          description: Column to sort by.
        sortDirection:
          type: string
          enum: [asc, desc]
          default: asc
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      example:
        classifierId: 1
        activeOnly: true
        sortField: "code"
        sortDirection: "asc"
        page: 1
        pageSize: 20

    AdminClassifierValuesListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassifierValueListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      example:
        data:
          - classifierValueId: 10
            code: "EE"
            name: "Eesti"
            validFrom: "2020-01-01"
            validUntil: null
            isValid: true
          - classifierValueId: 11
            code: "DE"
            name: "Saksamaa"
            validFrom: "2020-01-01"
            validUntil: null
            isValid: true
        pagination:
          totalCount: 249
          page: 1
          pageSize: 20

    AdminClassifiersGetRequest:
      type: object
      description: |
        Exactly one of classifierId or code must be provided (XOR).
      properties:
        classifierId:
          type: integer
          format: int64
          description: Technical identifier of the classifier.
        code:
          type: string
          description: Stable business code of the classifier (e.g. RTK).
      example:
        classifierId: 1

    AdminClassifiersListRequest:
      type: object
      properties:
        searchTerm:
          type: string
          nullable: true
          description: Free-text search applied (OR) over classifier code and name. Null means no search.
        sortField:
          type: string
          nullable: true
          enum: [code, name]
          description: Column to sort by.
        sortDirection:
          type: string
          enum: [asc, desc]
          default: asc
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      example:
        searchTerm: "RTK"
        sortField: "name"
        sortDirection: "asc"
        page: 1
        pageSize: 20

    AdminClassifiersListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassifierHeader'
        pagination:
          $ref: '#/components/schemas/Pagination'
      example:
        data:
          - classifierId: 1
            code: "RTK"
            name: "Riikide ja territooriumide klassifikaator"
            description: "ISO 3166"
          - classifierId: 2
            code: "SEVERITY"
            name: "Rikkumise raskusaste"
            description: null
        pagination:
          totalCount: 12
          page: 1
          pageSize: 20

    AdminClassifiersUpdateRequest:
      type: object
      required: [classifierId, name]
      properties:
        classifierId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
          description: New classifier display name. Non-empty after trim.
        description:
          type: string
          nullable: true
          maxLength: 250
          description: New classifier description. Empty or null allowed.
        code:
          type: string
          description: Classifier code for validation only. Rejected if different from the stored value (immutable).
      example:
        classifierId: 1
        name: "Riikide ja territooriumide klassifikaator"
        description: "ISO 3166 alusel"
        code: "RTK"

    ClassifierHeader:
      type: object
      required: [classifierId, code, name]
      properties:
        classifierId:
          type: integer
          format: int64
        code:
          type: string
          description: Stable business code. Immutable after creation.
        name:
          type: string
          description: Current display name from the latest classifier_name_state row.
        description:
          type: string
          nullable: true
          description: Current description from the latest classifier_name_state row.
      example:
        classifierId: 1
        code: "RTK"
        name: "Riikide ja territooriumide klassifikaator"
        description: "ISO 3166"

    ClassifierValueDetail:
      type: object
      required: [classifierValueId, classifierId, code, name, validFrom, isValid]
      properties:
        classifierValueId:
          type: integer
          format: int64
        classifierId:
          type: integer
          format: int64
        code:
          type: string
          description: Business code of the value within the classifier. Immutable.
        name:
          type: string
          description: Display name of the value. Immutable.
        validFrom:
          type: string
          format: date
          description: Start date of validity (inclusive). ISO 8601 date.
        validUntil:
          type: string
          format: date
          nullable: true
          description: End date of validity (exclusive). Null means open-ended.
        isValid:
          type: boolean
          description: Computed flag — true when validFrom is on or before today and validUntil is null or after today.
      example:
        classifierValueId: 137
        classifierId: 1
        code: "DE"
        name: "Saksamaa"
        validFrom: "2026-01-01"
        validUntil: null
        isValid: true

    ClassifierValueListItem:
      type: object
      required: [classifierValueId, code, name, validFrom, isValid]
      properties:
        classifierValueId:
          type: integer
          format: int64
        code:
          type: string
          description: Business code of the value within the classifier.
        name:
          type: string
          description: Display name of the value.
        validFrom:
          type: string
          format: date
          description: Start date of validity (inclusive). ISO 8601 date.
        validUntil:
          type: string
          format: date
          nullable: true
          description: End date of validity (exclusive). Null means open-ended.
        isValid:
          type: boolean
          description: Computed flag — true when validFrom is on or before today and validUntil is null or after today.
      example:
        classifierValueId: 10
        code: "EE"
        name: "Eesti"
        validFrom: "2020-01-01"
        validUntil: null
        isValid: true

    AdminOrganisationsListResponse:
      type: object
      required: [data]
      description: |
        Unpaginated list response. Exception to
        `application_general_rules.md` §3.2 R2 per §3.1: the organisation
        catalogue is small and immutable, so the whole catalogue is
        returned in a single call and the UI renders a checkbox list
        (no TEDI `Pagination` component).
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organisation'
      example:
        data:
          - { id: 3, name: "Maksu- ja Tolliamet" }
          - { id: 7, name: "Politsei- ja Piirivalveamet" }
          - { id: 5, name: "Transpordiamet" }

    AdminPermissionsListResponse:
      type: object
      required: [data]
      description: |
        Unpaginated list response. Exception to
        `application_general_rules.md` §3.2 R2 per §3.1: the permission
        catalogue is immutable (Liquibase-seeded, NFR-DATA-17), so the
        whole catalogue is returned in a single call and the UI renders
        a checkbox list (no TEDI `Pagination` component).
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      example:
        data:
          - { code: "user.list.admin",              description: "Kasutajate nimekirja vaatamine (koik asutused)" }
          - { code: "user.read.local",              description: "Kasutaja detailvaate vaatamine (oma asutus)" }
          - { code: "user_group.update",            description: "Kasutajagrupi nime / asutuste / oiguste muutmine (admin-ainult)" }

    AdminUserGroupsCreateRequest:
      type: object
      required: [name, organisationIds]
      properties:
        name:
          type: string
          maxLength: 50
          description: User group display name. Trimmed before persistence; must be non-empty after trim.
        organisationIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: IDs of organisations to link to the new group. Must be non-empty.
        permissionCodes:
          type: array
          items:
            type: string
          description: Permission codes to assign. May be empty.
      example:
        name: "PPA analyytik"
        organisationIds: [7]
        permissionCodes: ["user.list.local", "user.read.local"]

    AdminUserGroupsCreateResponse:
      type: object
      required: [userGroupId, name, coversAllOrganisations, organisations, permissions, createdAt, redirectTo]
      description: |
        DB-confirmed read-back of the newly created group (Ruuter §2.5 NATO
        read-back principle). All fields are read from the database after
        commit, never echoed from the request body.
      properties:
        userGroupId:
          type: integer
          format: int64
        name:
          type: string
          description: Latest name from user_group_name_state (the row inserted at creation).
        coversAllOrganisations:
          type: boolean
          description: Computed server-side at read time as count(active user_group_organisation rows) == count(*) FROM organisation. Not stored on user_group.
        organisations:
          type: array
          nullable: true
          description: Active organisation links read back from user_group_organisation. May be null when coversAllOrganisations is true.
          items:
            $ref: '#/components/schemas/UserGroupOrganisation'
        permissions:
          type: array
          description: Active permission links read back from user_group_permission joined to the permission catalogue.
          items:
            $ref: '#/components/schemas/UserGroupPermission'
        createdAt:
          type: string
          format: date-time
          description: Row creation timestamp from user_group.
        redirectTo:
          type: string
          description: Front-end path the client should navigate to after successful creation.
      example:
        userGroupId: 42
        name: "PPA analyytik"
        coversAllOrganisations: false
        organisations:
          - { organisationId: 7, organisationName: "Politsei- ja Piirivalveamet" }
        permissions:
          - { code: "user.list.local", description: "Kasutajate nimekirja vaatamine (oma asutus)" }
          - { code: "user.read.local", description: "Kasutaja detailvaate vaatamine (oma asutus)" }
        createdAt: "2026-04-28T14:23:11Z"
        redirectTo: "/kasutajagrupid/42"

    AdminUserGroupsGetRequest:
      type: object
      required: [userGroupId]
      properties:
        userGroupId:
          type: integer
          format: int64
      example:
        userGroupId: 12

    AdminUserGroupsGetResponse:
      type: object
      required: [userGroupId, name, coversAllOrganisations, organisations, permissions, userCount]
      properties:
        userGroupId:
          type: integer
          format: int64
        name:
          type: string
        coversAllOrganisations:
          type: boolean
          description: True when the group is linked to every organisation in the catalogue. Computed server-side at read time as count(active user_group_organisation rows for this group) == count(*) FROM organisation; not stored on user_group. FE may render the literal label "Koik asutused" without aggregating organisation names.
        organisations:
          type: array
          nullable: true
          description: Active organisation links. May be null when coversAllOrganisations is true.
          items:
            $ref: '#/components/schemas/UserGroupOrganisation'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserGroupPermission'
        userCount:
          type: integer
          description: Number of active members visible to the caller (scope-filtered for local account managers).
      example:
        userGroupId: 12
        name: "PPA ametnik"
        coversAllOrganisations: false
        organisations:
          - { organisationId: 7, organisationName: "Politsei- ja Piirivalveamet" }
        permissions:
          - { code: "user.read.local", description: "Kasutaja detailvaate vaatamine (oma asutus)" }
        userCount: 42

    AdminUserGroupsListRequest:
      type: object
      properties:
        searchTerm:
          type: string
          nullable: true
          description: Free-text search applied (OR) over the latest user_group_name_state.name row (resolved per group via ORDER BY created_at DESC LIMIT 1) and the names of actively linked organisations. Null means no search.
        sortField:
          type: string
          nullable: true
          enum: [userGroupName]
          description: Sortable field. Only userGroupName is supported.
        sortDirection:
          type: string
          enum: [asc, desc]
          default: asc
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      example:
        searchTerm: "PPA"
        sortField: "userGroupName"
        sortDirection: "asc"
        page: 1
        pageSize: 20

    AdminUserGroupsListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserGroupListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      example:
        data:
          - userGroupId: 12
            userGroupName: "PPA ametnik"
            coversAllOrganisations: false
            organisationNames: ["Politsei- ja Piirivalveamet"]
          - userGroupId: 20
            userGroupName: "Susteemiulene audit"
            coversAllOrganisations: true
            organisationNames: null
        pagination:
          totalCount: 42
          page: 1
          pageSize: 20

    AdminUserGroupsUpdateRequest:
      type: object
      required: [userGroupId]
      properties:
        userGroupId:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
          maxLength: 50
          description: New display name. Null means do not modify.
        organisationIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: New full list of linked organisation ids. Null means do not modify; non-null replaces the active set.
        permissionCodes:
          type: array
          nullable: true
          items:
            type: string
          description: New full list of permission codes. Null means do not modify; non-null replaces the active set.
        confirmMemberRemoval:
          type: boolean
          nullable: true
          description: >
            Set to true to confirm cascading removal of members whose organisation
            is being unlinked. Required only when the initial call returned HTTP 409.
      example:
        userGroupId: 12
        name: null
        organisationIds: [3, 5, 7]
        permissionCodes: null
        confirmMemberRemoval: null

    AdminUserGroupsUpdateResponse:
      type: object
      required: [userGroupId, name, coversAllOrganisations, organisationIds, permissionCodes]
      properties:
        userGroupId:
          type: integer
          format: int64
        name:
          type: string
        coversAllOrganisations:
          type: boolean
        organisationIds:
          type: array
          items:
            type: integer
            format: int64
        permissionCodes:
          type: array
          items:
            type: string
        cascadeRemovedUserAccountIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: IDs of user accounts whose membership was cascade-removed. Null/absent if no cascade occurred.
      example:
        userGroupId: 12
        name: "PPA analyytik"
        coversAllOrganisations: true
        organisationIds: [3, 5, 7]
        permissionCodes: ["user.read.admin", "user.read.local"]
        cascadeRemovedUserAccountIds: null

    AdminUserGroupsUpdateCascadePreview:
      type: object
      description: Returned with HTTP 409 when org removal would affect active members.
      required: [type, title, status, affectedMemberCount, affectedOrganisationIds]
      properties:
        type:
          type: string
          example: "urn:ljvis:error:cascade-member-removal-preview"
        title:
          type: string
          example: "Cascading member removal requires confirmation"
        status:
          type: integer
          example: 409
        affectedMemberCount:
          type: integer
        affectedOrganisationIds:
          type: array
          items:
            type: integer
            format: int64
      example:
        type: "urn:ljvis:error:cascade-member-removal-preview"
        title: "Cascading member removal requires confirmation"
        status: 409
        affectedMemberCount: 5
        affectedOrganisationIds: [3, 7]

    AdminUserGroupsUsersAddRequest:
      type: object
      required: [userGroupId, userAccountIds]
      properties:
        userGroupId:
          type: integer
          format: int64
        userAccountIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
      example:
        userGroupId: 12
        userAccountIds: [101, 102, 103]

    AdminUserGroupsUsersAddResponse:
      type: object
      required: [userGroupId, addedUserAccountIds]
      properties:
        userGroupId:
          type: integer
          format: int64
        addedUserAccountIds:
          type: array
          items:
            type: integer
            format: int64
      example:
        userGroupId: 12
        addedUserAccountIds: [101, 102, 103]

    AdminUserGroupsUsersListRequest:
      type: object
      required: [userGroupId]
      properties:
        userGroupId:
          type: integer
          format: int64
        searchTerm:
          type: string
          nullable: true
          description: Free-text search over user_account.first_name and user_account.last_name (OR).
        sortField:
          type: string
          nullable: true
          enum: [status, firstName, lastName, personalCode, organisationName]
        sortDirection:
          type: string
          enum: [asc, desc]
          default: asc
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      example:
        userGroupId: 12
        searchTerm: null
