openapi: 3.0.3
info:
  title: LJVIS2 X-tee arendaja-mock
  version: 1.0.0
  description: 'Sünteetiline sandbox. Päris turvaserveri teenusekoodide vastavus: x-xroad-service ja x-provider-path.
    Ei salvesta ega kutsu päristeenuseid.'
servers:
- url: https://dev.liiklusvalve.ee/developer
- url: http://localhost:3001/developer
- url: http://localhost:8086/xtee-mock
paths:
  /xroad/v1/isiku-kontroll:
    post:
      operationId: IsikuKontroll
      summary: IsikuKontroll
      x-xroad-service:
        code: IsikuKontroll
        version: v1
      x-provider-path: /ljvis/xroad/provide/isiku-kontroll
      parameters:
      - in: header
        name: X-Road-Client
        required: true
        schema:
          type: string
        example: ee-dev/GOV/70001490/liiklusregister
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      responses:
        '200':
          description: Edukas vastus; JSON.parse(response) annab domeenivastuse. Tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              example:
                response: '{"kontrollid":{"item":[{"asutus":"Mockvedaja OÜ","juhi_nimi":"Test","juhi_perekonnanimi":"Juht","kontrolli_nimetus":"KOONDVORM","kuupaev":"2026-06-15","nimetus":"MOCK-KV-001","rikkumise_liik":"extraordinary_inspection","rikkumised":null,"rikkumised_lopetatud":null,"soiduki_reg_nr":"MOCK123"},{"asutus":"Mockvedaja
                  OÜ","juhi_nimi":"Test","juhi_perekonnanimi":"Juht","kontrolli_nimetus":"TOOINSPEKTION","kuupaev":"2026-06-14","nimetus":"MOCK-TI-002","rikkumise_liik":null,"rikkumised":null,"rikkumised_lopetatud":"Mock
                  lõpetamine","soiduki_reg_nr":null}]}}'
              x-decoded-response-schema:
                type: object
                properties:
                  kontrollid:
                    type: object
                    properties:
                      item:
                        type: array
                        items:
                          type: object
                          properties:
                            kuupaev:
                              type: string
                            nimetus:
                              type: string
                            asutus:
                              type: string
                            soiduki_reg_nr:
                              type: string
                              nullable: true
                            rikkumise_liik:
                              type: string
                              nullable: true
                            kontrolli_nimetus:
                              type: string
                            juhi_nimi:
                              type: string
                            juhi_perekonnanimi:
                              type: string
                            rikkumised:
                              type: string
                              nullable: true
                            rikkumised_lopetatud:
                              type: string
                              nullable: true
                          required:
                          - kuupaev
                          - nimetus
                          - asutus
                          - soiduki_reg_nr
                          - rikkumise_liik
                          - kontrolli_nimetus
                          - juhi_nimi
                          - juhi_perekonnanimi
                          - rikkumised
                          - rikkumised_lopetatud
                          additionalProperties: false
                    required:
                    - item
                    additionalProperties: false
                required:
                - kontrollid
                additionalProperties: false
        '400':
          description: MISSING_PARAMETER, INVALID_PARAMETER
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "isikukood is required"}'
                error1:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "isikukood must be 11 digits starting with
                      1-6"}'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "FORBIDDEN", "message": "X-Road-Client header is missing or has invalid
                      format (expected: instance/memberClass/memberCode/subsystem)"}'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "SERVER_ERROR", "message": "Internal error"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isikukood:
                  type: string
                  pattern: ^[1-6][0-9]{10}$
              required:
              - isikukood
              additionalProperties: true
            example:
              isikukood: '60001019906'
  /xroad/v1/isiku-ettevote-kontrollid:
    post:
      operationId: IsikuEttevoteKontrollid
      summary: IsikuEttevoteKontrollid
      x-xroad-service:
        code: IsikuEttevoteKontrollid
        version: v1
      x-provider-path: /ljvis/xroad/provide/isiku-ettevote-kontrollid
      parameters:
      - in: header
        name: X-Road-Client
        required: true
        schema:
          type: string
        example: ee-dev/GOV/70001490/liiklusregister
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      responses:
        '200':
          description: Edukas vastus; JSON.parse(response) annab domeenivastuse. Tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              example:
                response: '{"kontrollid":{"item":[{"asutus":"Mockvedaja OÜ","ettevote_reg_nr":"00000001","juhi_nimi":"Test","juhi_perekonnanimi":"Juht","kontrolli_nimetus":"KOONDVORM","kuupaev":"2026-06-15","nimetus":"MOCK-KV-001","rikkumise_liik":"extraordinary_inspection","rikkumised":null,"rikkumised_lopetatud":null,"soiduki_reg_nr":"MOCK123"},{"asutus":"Mockvedaja
                  OÜ","ettevote_reg_nr":"00000001","juhi_nimi":"Test","juhi_perekonnanimi":"Juht","kontrolli_nimetus":"TOOINSPEKTION","kuupaev":"2026-06-14","nimetus":"MOCK-TI-002","rikkumise_liik":null,"rikkumised":null,"rikkumised_lopetatud":"Mock
                  lõpetamine","soiduki_reg_nr":null}]}}'
              x-decoded-response-schema:
                type: object
                properties:
                  kontrollid:
                    type: object
                    properties:
                      item:
                        type: array
                        items:
                          type: object
                          properties:
                            kuupaev:
                              type: string
                            nimetus:
                              type: string
                            asutus:
                              type: string
                            soiduki_reg_nr:
                              type: string
                              nullable: true
                            rikkumise_liik:
                              type: string
                              nullable: true
                            kontrolli_nimetus:
                              type: string
                            juhi_nimi:
                              type: string
                            juhi_perekonnanimi:
                              type: string
                            rikkumised:
                              type: string
                              nullable: true
                            rikkumised_lopetatud:
                              type: string
                              nullable: true
                            ettevote_reg_nr:
                              type: string
                          required:
                          - kuupaev
                          - nimetus
                          - asutus
                          - soiduki_reg_nr
                          - rikkumise_liik
                          - kontrolli_nimetus
                          - juhi_nimi
                          - juhi_perekonnanimi
                          - rikkumised
                          - rikkumised_lopetatud
                          - ettevote_reg_nr
                          additionalProperties: false
                    required:
                    - item
                    additionalProperties: false
                required:
                - kontrollid
                additionalProperties: false
        '400':
          description: MISSING_PARAMETER, INVALID_PARAMETER
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "isikukood is required"}'
                error1:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "isikukood must be 11 digits starting with
                      1-6"}'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "FORBIDDEN", "message": "X-Road-Client header is missing or has invalid
                      format (expected: instance/memberClass/memberCode/subsystem)"}'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "SERVER_ERROR", "message": "Internal error"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isikukood:
                  type: string
                  pattern: ^[1-6][0-9]{10}$
              required:
              - isikukood
              additionalProperties: true
            example:
              isikukood: '60001019906'
  /xroad/v1/erakorraline-yv-query:
    post:
      operationId: ErakorralineYVquery
      summary: ErakorralineYVquery
      x-xroad-service:
        code: ErakorralineYVquery
        version: v1
      x-provider-path: /ljvis/xroad/provide/erakorraline-yv-query
      parameters:
      - in: header
        name: X-Road-Client
        required: true
        schema:
          type: string
        example: ee-dev/GOV/70001490/liiklusregister
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      responses:
        '200':
          description: Edukas vastus; JSON.parse(response) annab domeenivastuse. Tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              example:
                response: '{"targeted_for_inspection":{"item":[{"inspection_date":"2026-06-15","inspection_id":"900001","inspection_no":"MOCK-KV-001","inspection_notes":"Sünteetiline
                  näidiskontroll","inspection_refine_options":{"item":["REGNR","VINTIN","AXLES","PLACES","REBUILT"]},"inspection_type":"extraordinary_inspection","inspection_unit":"Mockvedaja
                  OÜ","inspector":null,"issues":{"item":[{"code":"B01","value":"defect_minor"}]},"licence_plate_no":"MOCK123","notes":{"item":[]},"trailer_no":null},{"inspection_date":"2026-06-14","inspection_id":"900002","inspection_no":"MOCK-KV-002","inspection_notes":null,"inspection_refine_options":{"item":[]},"inspection_type":"extraordinary_inspection_ta","inspection_unit":"Mockvedaja
                  OÜ","inspector":null,"issues":{"item":[]},"licence_plate_no":"MOCK456","notes":{"item":[]},"trailer_no":null}]}}'
              x-decoded-response-schema:
                type: object
                properties:
                  targeted_for_inspection:
                    type: object
                    properties:
                      item:
                        type: array
                        items:
                          type: object
                          properties:
                            licence_plate_no:
                              type: string
                            trailer_no:
                              type: string
                              nullable: true
                            inspection_id:
                              type: string
                            inspection_no:
                              type: string
                            inspection_date:
                              type: string
                            inspection_type:
                              type: string
                            inspection_unit:
                              type: string
                            inspection_notes:
                              type: string
                              nullable: true
                            inspector:
                              type: string
                              nullable: true
                            issues:
                              type: object
                              properties:
                                item:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      code:
                                        type: string
                                      value:
                                        type: string
                                    required:
                                    - code
                                    - value
                                    additionalProperties: false
                              required:
                              - item
                              additionalProperties: false
                            notes:
                              type: object
                              properties:
                                item:
                                  type: array
                                  items: {}
                              required:
                              - item
                              additionalProperties: false
                            inspection_refine_options:
                              type: object
                              properties:
                                item:
                                  type: array
                                  items:
                                    type: string
                              required:
                              - item
                              additionalProperties: false
                          required:
                          - licence_plate_no
                          - trailer_no
                          - inspection_id
                          - inspection_no
                          - inspection_date
                          - inspection_type
                          - inspection_unit
                          - inspection_notes
                          - inspector
                          - issues
                          - notes
                          - inspection_refine_options
                          additionalProperties: false
                    required:
                    - item
                    additionalProperties: false
                required:
                - targeted_for_inspection
                additionalProperties: false
        '400':
          description: MISSING_PARAMETER, INVALID_PARAMETER
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "alates is required"}'
                error1:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "kuni is required"}'
                error2:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "alates must not be after kuni"}'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "FORBIDDEN", "message": "X-Road-Client header is missing or has invalid
                      format (expected: instance/memberClass/memberCode/subsystem)"}'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "SERVER_ERROR", "message": "Internal error"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alates:
                  type: string
                kuni:
                  type: string
              required:
              - alates
              - kuni
              additionalProperties: true
            example:
              alates: '2026-06-01'
              kuni: '2026-06-30'
  /xroad/v1/erakorraline-yv-confirm:
    post:
      operationId: ErakorralineYVconfirm
      summary: ErakorralineYVconfirm
      x-xroad-service:
        code: ErakorralineYVconfirm
        version: v1
      x-provider-path: /ljvis/xroad/provide/erakorraline-yv-confirm
      parameters:
      - in: header
        name: X-Road-Client
        required: true
        schema:
          type: string
        example: ee-dev/GOV/70001490/liiklusregister
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      responses:
        '200':
          description: Edukas vastus; JSON.parse(response) annab domeenivastuse. Tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              example:
                response: '{"confirmed":1}'
              x-decoded-response-schema:
                type: object
                properties:
                  confirmed:
                    type: integer
                required:
                - confirmed
                additionalProperties: false
        '400':
          description: MISSING_PARAMETER, INVALID_PARAMETER
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "confirmed.item must be a non-empty array"}'
                error1:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "Each item requires inspection_id, code
                      and value"}'
                error2:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "code must be one of: INSPECTION_DATE,
                      ENFORCEMENT_DECISION, CLOSURE_BASIS"}'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "FORBIDDEN", "message": "X-Road-Client header is missing or has invalid
                      format (expected: instance/memberClass/memberCode/subsystem)"}'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "NOT_FOUND", "message": "inspection_id not found or form is not in confirmed
                      status"}'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "SERVER_ERROR", "message": "Internal error"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed:
                  type: object
                  properties:
                    item:
                      type: array
                      items:
                        type: object
                        properties:
                          inspection_id:
                            type: string
                          code:
                            type: string
                            enum:
                            - INSPECTION_DATE
                            - ENFORCEMENT_DECISION
                            - CLOSURE_BASIS
                          value:
                            type: string
                        required:
                        - inspection_id
                        - code
                        - value
                        additionalProperties: false
                      minItems: 1
                  required:
                  - item
                  additionalProperties: false
              required:
              - confirmed
              additionalProperties: true
            example:
              confirmed:
                item:
                - inspection_id: '900001'
                  code: INSPECTION_DATE
                  value: '2026-06-16'
  /xroad/v1/register-job-inspection:
    post:
      operationId: RegisterJobInspection
      summary: RegisterJobInspection
      x-xroad-service:
        code: RegisterJobInspection
        version: v1
      x-provider-path: /ljvis/xroad/provide/register-job-inspection
      parameters:
      - in: header
        name: X-Road-Client
        required: true
        schema:
          type: string
        example: ee-dev/GOV/70001490/liiklusregister
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      responses:
        '200':
          description: Edukas vastus; JSON.parse(response) annab domeenivastuse. Tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              example:
                response: '{"message": "Success"}'
              x-decoded-response-schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                additionalProperties: false
        '400':
          description: MISSING_PARAMETER, INVALID_PARAMETER
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "kontrollija is required"}'
                error1:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "kontrolli_id is required"}'
                error2:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "kontrolli_kp is required"}'
                error3:
                  value:
                    response: '{"error": "INVALID_PARAMETER", "message": "kontrolli_kp must be a valid date"}'
                error4:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "tooandja_nimi is required"}'
                error5:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "tooandja_reg_kood is required"}'
                error6:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "kontrollimised is required"}'
                error7:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "rikkumised is required"}'
                error8:
                  value:
                    response: '{"error": "MISSING_PARAMETER", "message": "koostatatud_ettekirjutus is required"}'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "FORBIDDEN", "message": "X-Road-Client header is missing or has invalid
                      format (expected: instance/memberClass/memberCode/subsystem)"}'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                - response
                additionalProperties: false
              examples:
                error0:
                  value:
                    response: '{"error": "SERVER_ERROR", "message": "Internal error"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kontrollija:
                  type: string
                kontrolli_id:
                  type: integer
                kontrolli_kp:
                  type: string
                tooandja_nimi:
                  type: string
                tooandja_reg_kood:
                  type: string
                soidukite_arv:
                  type: integer
                koostatatud_ettekirjutus:
                  type: boolean
                kontrollimised:
                  type: object
                  additionalProperties: true
                rikkumised:
                  type: object
                  additionalProperties: true
                vaarteomenetlus:
                  type: string
              required:
              - kontrollija
              - kontrolli_id
              - kontrolli_kp
              - tooandja_nimi
              - tooandja_reg_kood
              - koostatatud_ettekirjutus
              - kontrollimised
              - rikkumised
              additionalProperties: true
            example:
              kontrollija: Mock Kontrollija
              kontrolli_id: 900001
              kontrolli_kp: '2026-06-15'
              tooandja_nimi: Mockvedaja OÜ
              tooandja_reg_kood: '00000001'
              soidukite_arv: 2
              koostatatud_ettekirjutus: false
              kontrollimised: &id001
                kontrollitud_soitjate_veol: false
              rikkumised: &id002
                rikkumised_loend: []
              vaarteomenetlus: MOCK-VM-001
  /xroad/v1/register-job-inspection-v3:
    post:
      operationId: RegisterJobInspection_v3
      summary: RegisterJobInspection_v3
      x-xroad-service:
