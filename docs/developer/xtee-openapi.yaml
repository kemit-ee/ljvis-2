  /xroad/v2/findUsage:
    get:
      operationId: findUsage
      summary: findUsage
      x-xroad-service:
        code: findUsage
        version: v2
      x-provider-path: /ljvis/xroad/v2/findUsage
      parameters:
      - in: header
        name: X-Mock-Scenario
        required: false
        schema:
          type: string
          enum:
          - empty
          - server-error
        description: Ainult mockis; heartbeat ignoreerib.
      - in: header
        name: X-Road-UserId
        required: true
        schema:
          type: string
        example: '60001019906'
      - in: query
        name: userCode
        required: true
        schema:
          type: string
      - in: query
        name: periodStart
        required: false
        schema:
          type: string
      - in: query
        name: periodEnd
        required: false
        schema:
          type: string
      - in: query
        name: offset
        required: false
        schema:
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Edukas vastus; tühi loend on edukas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUsages:
                    type: integer
                  usages:
                    type: array
                    items:
                      type: object
                      properties:
                        logtime:
                          type: string
                        action:
                          type: string
                        receiverCode:
                          type: string
                        receiverName:
                          type: string
                          nullable: true
                        receiverSystem:
                          type: string
                          nullable: true
                      required:
                      - logtime
                      - action
                      - receiverCode
                      - receiverName
                      - receiverSystem
                      additionalProperties: false
                required:
                - totalUsages
                - usages
                additionalProperties: false
              example:
                totalUsages: 3
                usages:
                - logtime: '2026-06-15T12:00:00Z'
                  action: Mock kontrollipäring
                  receiverCode: '70001490'
                  receiverName: Mock tarbija
                  receiverSystem: liiklusregister
                - logtime: '2026-06-14T12:00:00Z'
                  action: Mock töökontroll
                  receiverCode: '70001969'
                  receiverName: null
                  receiverSystem: null
                - logtime: '2026-06-13T12:00:00Z'
                  action: Mock korduspäring
                  receiverCode: '70001490'
                  receiverName: Mock tarbija
                  receiverSystem: liiklusregister
        '400':
          description: MISSING_HEADER, MISSING_PARAMETER, FORBIDDEN
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
              examples:
                error0:
                  value:
                    error: MISSING_HEADER
                    message: X-Road-UserId header is required
                error1:
                  value:
                    error: MISSING_PARAMETER
                    message: userCode query parameter is required
                error2:
                  value:
                    error: FORBIDDEN
                    message: X-Road-UserId must match userCode
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
              examples:
                error0:
                  value:
                    error: SERVER_ERROR
                    message: Internal error
