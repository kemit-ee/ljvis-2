LJVIS_RESQL=http://resql-ljvis:8090/ljvis
LJVIS_XTR=http://xtr:8080

LJVIS_RUUTER=http://ruuter:8080/ljvis
LJVIS_RUUTER_INTERNAL=http://ruuter-internal:8080/ljvis

LJVIS_DMAPPER=http://data-mapper:3005
LJVIS_DMAPPER_HBS=http://data-mapper:3005/ljvis

LJVIS_TIM=http://tim:8085
TIM_ADMIN_TOKEN=dev-admin-token

LJVIS_PROJECT_LAYER=ljvis

DOMAIN=localhost

S3_PROXY=http://s3-proxy:3010

# ERRU CTUD outbound endpoint. In dev/CI this points at the in-repo mock hub so the
# whole send/response cycle is exercised without access to MOVEHUB / s-TESTA. In
# production it must point at the XTR ERRU request-response interface instead
# (http://xtr:8080/erru/ctud-request). send.yml itself is production code and does
# not branch on the environment — only this constant changes.
ERRU_CTUD_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/hub/ctud-request

# NYSIIS phonetic search-key sidecar (docker/nysiis) — wraps the official EC
# CommonServices jar. Same URL in every environment; there is no mock variant because the
# ERRU network requires byte-identical keys to the EC implementation everywhere, including
# dev/CI (see docker/nysiis/README.md).
NYSIIS_ENDPOINT=http://nysiis:8080/nysiis

# Estonian transport-undertaking lookup used when answering an INBOUND CTUD request.
# Production must point this at the X-tee MTR checkCommunityLicence service (via XTR);
# in dev/CI it points at the in-repo stub so the inbound flow is fully testable.
ERRU_MTR_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/mtr/check-community-licence

# ERRU CGR outbound endpoint. In dev/CI this points at the in-repo mock hub so the
# broadcast send/response cycle is exercised without access to MOVEHUB / s-TESTA. In
# production it must point at the XTR ERRU request-response interface instead
# (http://xtr:8080/erru/cgr-request). send.yml and resend.yml do not branch on the
# environment — only this constant changes.
ERRU_CGR_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/hub/cgr-request

# Transport manager good-repute lookup used when answering an INBOUND CGR request.
# The inbound handler first checks forms.good_repute_form (local UNFIT register); only
# when the person is NOT in that register does it call this endpoint to ask MTR whether
# the person is a transport manager of any Estonian undertaking. Production must point
# this at the X-tee MTR CheckTransportManagerGoodRepute service (via XTR); in dev/CI it
# points at the in-repo stub so the inbound flow is fully testable.
ERRU_CGR_MTR_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/mtr/check-transport-manager-good-repute

# ERRU RSI outbound endpoint. In dev/CI this points at the in-repo mock hub so the
# async send/ACK cycle is exercised without access to MOVEHUB / s-TESTA. In production
# it must point at the XTR ERRU request-response interface instead. Unlike CGR/CTUD,
# RSI is asynchronous — the mock only returns an ACK; the actual OK/NotFound response
# is exercised separately via the inbound-response endpoint (Newman or ERRU hub callback).
ERRU_RSI_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/hub/rsi-request

# Estonian vehicle register lookup used when answering an INBOUND RSI notification.
# Production must point this at the X-tee Liiklusregister paring2 service (via XTR);
# in dev/CI it points at the in-repo stub so the inbound-request flow is fully testable.
ERRU_RSI_LIIKLUSREGISTER_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/xtee/liiklusregister-paring2

# ERRU NCR outbound endpoints (LJVIS2-64). Unlike RSI, the ACK is SYNCHRONOUS — the mock
# returns it in the same call as the send. The substantive response (OK/NotFound + penalty
# outcomes) still arrives later via the separate inbound-response endpoint, same as RSI.
# ncr-request is used by request send (initiated->sent->acknowledged); ncr-response is used
# by response send (answer_drafted->answered). Both must point at XTR in production.
ERRU_NCR_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/hub/ncr-request
ERRU_NCR_RESPONSE_ENDPOINT=http://ruuter:8080/ljvis/v1/erru/mock/hub/ncr-response

# Inspecting authority name (globalBodyRequestType/@originatingAuthority) stamped on
# NCR requests the automatic dispatch cron builds (DSL/Ruuter.internal/.../cron/
# erru-ncr-autodispatch.yml). Manual "Lisa NCR vorm" takes this from the officer's form.
ERRU_NCR_ORIGINATING_AUTHORITY=Politsei- ja Piirivalveamet

# e-Toimik subsystem (LJVIS2-56): etoimik-arendus (ee-dev) | etoimik (ee-test/prod)
ETOIMIK_SUBSYSTEM_CODE=etoimik-arendus
# e-Toimik AnnaIsikuKvalifikatsioonid version. LJVIS2-56 spec requires v6
# (see §28/§44/§99); v4/v5/v6 all authorised for our subsystem in ee-dev.
ETOIMIK_SERVICE_VERSION=v6

# X-Road security server used for DIRECT REST calls that bypass the XTR SOAP-wrapper
XROAD_SECURITY_SERVER=
# X-Road instance this environment talks to (ee-dev / ee-test / ee)
XROAD_INSTANCE=ee-test
