# X-Road security server used for DIRECT REST calls that bypass the XTR SOAP-wrapper
# (XTR only speaks XRoad SOAP — see https://github.com/buerokratt/XTR — so REST-native
# X-Road services such as Rahvastikuregister's dde/v1/isikud are called by Ruuter itself).
# Base URL of this LJVIS subsystem's own local X-Road Security Server, e.g. https://ss1.example.ee:8443
XROAD_SECURITY_SERVER=
# X-Road instance this environment talks to (ee-dev / ee-test / ee)
XROAD_INSTANCE=ee-test
