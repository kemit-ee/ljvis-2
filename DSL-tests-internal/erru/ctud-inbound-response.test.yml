mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  INTERNAL_COMMUNICATION_KEY: test-secret
tests:
- name: a response completes the outgoing request and is audited
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 7
        version: 3
        status: sent
        businessCaseId: CTUD-1
    - url_matches: /erru/ctud/append-transition
      method: POST
      status: 200
      body:
      - id: 7
        status: responded
    - &id001
      url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: &id002
      x-internal-service-token: test-secret
      content-type: application/json
    body: &id003
      workflowId: 22222222-2222-2222-2222-222222222222
      businessCaseId: CTUD-1
      respondingAuthority: DE-BAG
      responseStatusCode: Found
      responseStatusMessage: ''
      responseContent: '{"transportUndertakingName":"Rhein"}'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 1
    body_matches:
      key: 7
      newStatus: responded
      respondingAuthority: DE-BAG
      responseStatusCode: Found
  - url_matches: /log/insert_audit_event
    count: 1
    body_matches:
      event_type: ctud.inbound_response.receive
- name: an answer that arrives before the acknowledgement completes sending
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 7
        version: 2
        status: sending
        businessCaseId: CTUD-1
    - url_matches: /erru/ctud/append-transition
      method: POST
      status: 200
      body:
      - id: 7
        status: responded
    - *id001
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body: *id003
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 1
    body_matches:
      newStatus: responded
- name: a duplicate delivery of a responded request is idempotent
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 7
        version: 4
        status: responded
        businessCaseId: CTUD-1
    - *id001
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body: *id003
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 0
  - url_matches: /log/insert_audit_event
    count: 0
- name: a Timeout answer set by the Hub is a normal response
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 7
        version: 3
        status: sent
        businessCaseId: CTUD-1
    - url_matches: /erru/ctud/append-transition
      method: POST
      status: 200
      body:
      - id: 7
        status: responded
    - *id001
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
      businessCaseId: CTUD-1
      respondingAuthority: DE-BAG
      responseStatusCode: Timeout
      responseStatusMessage: ''
      responseContent: ''
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 1
    body_matches:
      responseStatusCode: Timeout
- name: an unknown workflow is 404
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body: *id003
  expect:
    status: 404
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 0
- name: missing workflowId is 400
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body:
      responseStatusCode: Found
  expect:
    status: 400
  verify_mocks:
  - url_matches: /erru/ctud/get-by-workflow-id
    count: 0
- name: missing responseStatusCode is 400
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers: *id002
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
  expect:
    status: 400
  verify_mocks:
  - url_matches: /erru/ctud/get-by-workflow-id
    count: 0
- name: request without the service token is forbidden
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers:
      content-type: application/json
    body: *id003
  expect:
    status: 403
  verify_mocks: []
- name: a businessCaseId that does not belong to the workflow is refused and stores nothing
  setup:
    mocks:
    - url_matches: /erru/ctud/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 7
        version: 3
        status: sent
        businessCaseId: CTUD-1
    - url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/erru/ctud/inbound-response
    headers:
      x-internal-service-token: test-secret
      content-type: application/json
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
      businessCaseId: CTUD-OTHER
      responseStatusCode: Found
  expect:
    status: 409
  verify_mocks:
  - url_matches: /erru/ctud/append-transition
    count: 0
  - url_matches: /log/insert_audit_event
    count: 0
