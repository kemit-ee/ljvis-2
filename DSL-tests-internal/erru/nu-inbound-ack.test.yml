mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  INTERNAL_COMMUNICATION_KEY: test-secret
tests:
- name: an acknowledgement is merged into the outgoing message and audited
  setup:
    mocks:
    - &id001
      url_matches: /erru/nu/validate
      method: POST
      status: 200
      body:
      - result: '{"valid":true}'
    - url_matches: /erru/nu/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 3
        version: 4
        status: sent
        businessCaseId: NU-1
    - url_matches: /erru/nu/apply-ack
      method: POST
      status: 200
      body:
      - result: '{"status":"acknowledged","id":3,"businessCaseId":"NU-1"}'
    - &id002
      url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: &id003
      x-internal-service-token: test-secret
      content-type: application/json
    body: &id004
      workflowId: 22222222-2222-2222-2222-222222222222
      technicalId: 11111111-1111-1111-1111-111111111111
      from: EU
      businessCaseId: NU-1
      memberStates: '[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK"}]'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/nu/apply-ack
    count: 1
    body_matches:
      workflowId: 22222222-2222-2222-2222-222222222222
      technicalId: 11111111-1111-1111-1111-111111111111
      fromCountry: EU
      memberStates: '[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK"}]'
  - url_matches: /log/insert_audit_event
    count: 1
    body_matches:
      event_type: nu.inbound_ack.receive
- name: a replay appends nothing and writes no second audit event
  setup:
    mocks:
    - *id001
    - url_matches: /erru/nu/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 3
        version: 4
        status: sent
        businessCaseId: NU-1
    - url_matches: /erru/nu/apply-ack
      method: POST
      status: 200
      body:
      - result: '{"status":"already_acknowledged","id":3,"businessCaseId":"NU-1"}'
    - *id002
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body: *id004
  expect:
    status: 200
  verify_mocks:
  - url_matches: /erru/nu/apply-ack
    count: 1
  - url_matches: /log/insert_audit_event
    count: 0
- name: an unknown workflow is 404 and applies nothing
  setup:
    mocks:
    - *id001
    - url_matches: /erru/nu/get-by-workflow-id
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body: *id004
  expect:
    status: 404
  verify_mocks:
  - url_matches: /erru/nu/apply-ack
    count: 0
- name: member states that fail the ack rules are refused
  setup:
    mocks:
    - url_matches: /erru/nu/validate
      method: POST
      status: 200
      body:
      - result: '{"type":"VALIDATION_ERROR","field":"memberStates","code":"invalid_value"}'
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body: *id004
  expect:
    status: 422
  verify_mocks:
  - url_matches: /erru/nu/get-by-workflow-id
    count: 0
  - url_matches: /erru/nu/apply-ack
    count: 0
- name: a businessCaseId that does not belong to the workflow is refused
  setup:
    mocks:
    - *id001
    - url_matches: /erru/nu/get-by-workflow-id
      method: POST
      status: 200
      body:
      - id: 3
        version: 4
        status: sent
        businessCaseId: NU-1
    - *id002
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
      technicalId: 11111111-1111-1111-1111-111111111111
      from: EU
      businessCaseId: NU-OTHER
      memberStates: '[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK"}]'
  expect:
    status: 409
  verify_mocks:
  - url_matches: /erru/nu/apply-ack
    count: 0
  - url_matches: /log/insert_audit_event
    count: 0
- name: missing workflowId is 400
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body:
      technicalId: 11111111-1111-1111-1111-111111111111
      memberStates: '[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK"}]'
  expect:
    status: 400
  verify_mocks:
  - url_matches: /erru/nu/validate
    count: 0
- name: missing technicalId is 400
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
      memberStates: '[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK"}]'
  expect:
    status: 400
  verify_mocks:
  - url_matches: /erru/nu/validate
    count: 0
- name: missing memberStates is 400
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers: *id003
    body:
      workflowId: 22222222-2222-2222-2222-222222222222
      technicalId: 11111111-1111-1111-1111-111111111111
  expect:
    status: 400
  verify_mocks:
  - url_matches: /erru/nu/validate
    count: 0
- name: request without the service token is forbidden
  setup:
    mocks: []
  request:
    method: POST
    path: /ljvis/erru/nu/inbound-ack
    headers:
      content-type: application/json
    body: *id004
  expect:
    status: 403
  verify_mocks: []
