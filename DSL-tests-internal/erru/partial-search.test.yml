mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_RUUTER_INTERNAL: '{MOCK}/internal'
  ERRU_MTR_ENDPOINT: '{MOCK}/registry'
  ERRU_CGR_MTR_ENDPOINT: '{MOCK}/registry'
  INTERNAL_COMMUNICATION_KEY: test-token
tests:
- name: 'CGR 7A name only: Found'
  setup: &id009
    mocks:
    - &id002
      url_matches: /erru/cgr/append-inbound
      method: POST
      status: 200
      body: &id018
      - id: 1
    - &id003
      url_matches: /erru/cgr/search-good-repute
      method: POST
      status: 200
      body: &id001 []
    - &id038
      url_matches: /registry
      method: POST
      status: 200
      body:
        response:
          transportManager:
            firstName: Leah
            lastName: Brauer
            birthDate: '1931-05-06'
            birthPlace: null
            cpcDocumentNumber: CPC001133
            cpcDocumentIssueCountry: DE
            cpcDocumentIssueDate: '2017-09-14'
          companies: *id001
    - &id004
      url_matches: /erru/cgr/append-transition
      method: POST
      status: 200
      body: *id001
    - &id005
      url_matches: /log/insert_audit_event
      method: POST
      status: 200
      body: *id001
  request: &id006
    method: POST
    path: /ljvis/erru/cgr/inbound-request
    headers: &id010
      x-internal-service-token: test-token
      content-type: application/json
    body:
      technicalId: 11111111-1111-1111-1111-111111111111
      workflowId: 22222222-2222-2222-2222-222222222222
      sentAt: '2026-01-01T10:00:00Z'
      from: AT
      businessCaseId: PARTIAL-SEARCH
      originatingAuthority: EU Auth
      requestSource: CA
      requestPurpose: Issue
      tmFirstName: LEAH
      tmFamilyName: BRAUER
      tmDateOfBirth: '1931-05-06'
  expect: &id007
    status: 200
  verify_mocks:
  - &id008
    url_matches: /registry
    count: 1
    body_matches:
      firstName: LEAH
      lastName: BRAUER
      birthDate: '1931-05-06'
      cpcDocumentNumber: ''
      cpcDocumentIssueCountry: ''
      cpcDocumentIssueDate: ''
  - url_matches: /erru/cgr/append-transition
    count: 1
    body_matches:
      newStatus: answered
      memberStates: '[{"memberStateCode":"EE","statusCode":"Found","statusMessage":"","transportManagerDetails":{"respondingAuthority":"EE-TRAM","searchMethod":"NYSIIS","nameDetails":{"firstName":"Leah","familyName":"Brauer","dateOfBirth":"1931-05-06","placeOfBirth":null},"addressDetails":null,"certificateDetails":{"certificateNumber":"CPC001133","certificateIssueDate":"2017-09-14","certificateIssueCountry":"DE","certificateValidity":"Valid","fitness":{"fitnessStatus":"Fit","unfitStartDate":null,"unfitEndDate":null}},"transportUndertakings":{"totalManagedUndertakings":0,"totalManagedVehicles":0,"undertaking":[]}}}]'
- name: 'CGR 7A name only: NotFound'
  setup: &id011
    mocks:
    - *id002
    - *id003
    - url_matches: /registry
      method: POST
      status: 200
      body:
        response:
          transportManager: null
          companies: *id001
    - *id004
    - *id005
  request: *id006
  expect: *id007
  verify_mocks:
  - *id008
  - &id014
    url_matches: /erru/cgr/append-transition
    count: 1
    body_matches:
      newStatus: answered
      memberStates: '[{"memberStateCode":"EE","statusCode":"NotFound","statusMessage":"Transport
        manager not found in Estonian register","transportManagerDetails":null}]'
