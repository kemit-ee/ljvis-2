# POST /notification/create (Ruuter.internal) — desktop-kanali teavituse saajad
# (notification_template_mapping.desktop_recipient_personal_codes) tardistatakse
# notification.recipient_personal_codes veergu loomise hetkel, vt create.yml.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_RUUTER: '{MOCK}/ruuter'
  INTERNAL_COMMUNICATION_KEY: test-secret
tests:
- name: desktop mapping with recipients is stamped onto the notification
  setup:
    mocks:
    - url_matches: /notification/get_template_mapping
      method: POST
      status: 200
      body:
      - notificationType: ncr_violation
        channel: desktop
        active: true
        desktopRecipientPersonalCodes:
        - '38001010000'
        - '38001010001'
    - url_matches: /notification/insert_notification
      method: POST
      status: 200
      body:
      - id: '11111111-1111-1111-1111-111111111111'
    - url_matches: /v1/ws-broadcast/send
      method: POST
      status: 200
      body: {}
  request:
    method: POST
    path: /ljvis/notification/create
    headers:
      content-type: application/json
    body:
      type: ncr_violation
      required_permission: ncr.read
      related_entity_type: ncr
      related_entity_id: '123'
      event_key: 'ncr-technical-id-123'
      title_et: Uus rikkumine
      body_et: ''
      created_by: system
  expect:
    status: 200
  verify_mocks:
  - url_matches: /notification/insert_notification
    count: 1
    body_matches:
      type: ncr_violation
      required_permission: ncr.read
      event_key: 'ncr-technical-id-123'
      recipient_personal_codes: '38001010000,38001010001'

- name: type without desktop mapping is stamped with no recipients
  setup:
    mocks:
    - url_matches: /notification/get_template_mapping
      method: POST
      status: 200
      body: []
    - url_matches: /notification/insert_notification
      method: POST
      status: 200
      body:
      - id: '22222222-2222-2222-2222-222222222222'
    - url_matches: /v1/ws-broadcast/send
      method: POST
      status: 200
      body: {}
  request:
    method: POST
    path: /ljvis/notification/create
    headers:
      content-type: application/json
    body:
      type: nu_violation
      required_permission: nu.read
      related_entity_type: nu
      related_entity_id: '456'
      title_et: Uus teade
      body_et: ''
      created_by: system
  expect:
    status: 200
  verify_mocks:
  - url_matches: /notification/insert_notification
    count: 1
    body_matches:
      type: nu_violation
      required_permission: nu.read
      recipient_personal_codes: ''

- name: missing required_permission is rejected before any lookup
  request:
    method: POST
    path: /ljvis/notification/create
    headers:
      content-type: application/json
    body:
      type: ncr_violation
      required_permission: ''
      title_et: Uus rikkumine
  expect:
    status: 400
  verify_mocks:
  - url_matches: /notification/get_template_mapping
    count: 0
  - url_matches: /notification/insert_notification
    count: 0
