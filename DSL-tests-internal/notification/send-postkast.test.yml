# POST /notification/send-postkast (Ruuter.internal) - `kontrollkaardiUrl` malli muutuja:
# iga Postkasti saadetav teavitus kannab lingi konkreetsele kontrollkaardile.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_RUUTER_INTERNAL: '{MOCK}/internal'
  PK_NOTIFICATIONS_ENDPOINT: '{MOCK}/pk/notifications'
  DOMAIN: dev.liiklusvalve.ee
tests:
- name: known entity type sends the environment based control card URL to Postkast
  setup:
    mocks:
    - url_matches: /notification/get_template_mapping
      method: POST
      status: 200
      body:
      - active: true
        channel: postkast
        originalTemplateId: vrteade
        defaultLanguage: et
    - url_matches: /notification/insert_outbound_log
      method: POST
      status: 200
      body:
      - id: 11
        notificationKey: k-11
    - url_matches: /notification/insert_outbound_recipient
      method: POST
      status: 200
      body: []
    - url_matches: /pk/notifications
      method: POST
      status: 200
      body:
        sendingOperationId: op-1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /notification/update_outbound_log_status
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/notification/send-postkast
    headers:
      x-internal-service-token: dev-internal-service-token
      content-type: application/json
    body:
      notification_type: carrier_notification
      recipient_email: vedaja@example.com
      template_variables:
        formNumber: TRAM-7
      related_entity_type: tram_control_card
      related_entity_id: '7'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /pk/notifications
    count: 1
    body_matches:
      templateId: vrteade
      parameters:
      - kontrollkaardiUrl: https://dev.liiklusvalve.ee/control-forms/tram-control-card/7
        formNumber: TRAM-7
        recipient: vedaja@example.com

- name: unknown entity type sends an empty kontrollkaardiUrl and still sends
  setup:
    mocks:
    - url_matches: /notification/get_template_mapping
      method: POST
      status: 200
      body:
      - active: true
        channel: postkast
        originalTemplateId: vrteade
        defaultLanguage: et
    - url_matches: /notification/insert_outbound_log
      method: POST
      status: 200
      body:
      - id: 12
        notificationKey: k-12
    - url_matches: /notification/insert_outbound_recipient
      method: POST
      status: 200
      body: []
    - url_matches: /pk/notifications
      method: POST
      status: 200
      body:
        sendingOperationId: op-2
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /notification/update_outbound_log_status
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/notification/send-postkast
    headers:
      x-internal-service-token: dev-internal-service-token
      content-type: application/json
    body:
      notification_type: carrier_notification
      recipient_email: vedaja@example.com
      related_entity_type: something_else
      related_entity_id: '9'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /pk/notifications
    count: 1
    body_matches:
      parameters:
      - kontrollkaardiUrl: ''
        recipient: vedaja@example.com

- name: Postkast rejection stores the readable reason in the outbound log
  setup:
    mocks:
    - url_matches: /notification/get_template_mapping
      method: POST
      status: 200
      body:
      - active: true
        channel: postkast
        originalTemplateId: vrteade
        defaultLanguage: et
    - url_matches: /notification/insert_outbound_log
      method: POST
      status: 200
      body:
      - id: 11
        notificationKey: k-11
    - url_matches: /notification/insert_outbound_recipient
      method: POST
      status: 200
      body: []
    - url_matches: /pk/notifications
      method: POST
      status: 400
      body:
        code: templateNotFound
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
    - url_matches: /notification/update_outbound_log_status
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/notification/send-postkast
    headers:
      x-internal-service-token: dev-internal-service-token
      content-type: application/json
    body:
      notification_type: carrier_violation
      recipient_email: vedaja@example.com
      template_variables:
        formNumber: SP-1
      related_entity_type: drive_rest_driver_form
      related_entity_id: '1'
  expect:
    status: 200
  verify_mocks:
  - url_matches: /notification/update_outbound_log_status
    count: 1
    body_matches:
      status: error
      failure_reason: "PK HTTP 400: {'code':'templateNotFound'}"
