# POST /cron/archive-aged-forms (ADR-012) — ajapõhine arhiveerimine.
# Seaded tulevad päringuparameetritest (CronManager URL); vaikimisi on väljas.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_RESQL_ARHIIV: '{MOCK}/arhiiv'
tests:
- name: disabled by default - nothing is selected, copied or purged
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
  expect:
    status: 200
    body:
      enabled: false
      purged: 0
  verify_mocks:
  - url_matches: /archive/select_aged_snapshots
    count: 0

- name: retentionYears below the safe minimum is rejected
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
    query:
      enabled: 'true'
      retentionYears: '1'
  expect:
    status: 400
  verify_mocks:
  - url_matches: /archive/select_aged_snapshots
    count: 0

- name: archive-only (purge=false) copies and verifies but never deletes
  setup:
    mocks:
    - url_matches: /archive/select_aged_snapshots
      method: POST
      status: 200
      body:
      - formType: compound-form
        id: 11
        formKey: 5
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /archive/purge_confirmed
      method: POST
      status: 200
      body:
      - purged: 1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
    query:
      enabled: 'true'
      retentionYears: '7'
      purge: 'false'
  expect:
    status: 200
    body:
      mode: archive-only
      copied: 1
      purged: 0
  verify_mocks:
  - url_matches: /archive/select_aged_snapshots
    count: 1
    body_matches:
      retention_years: 7
  - url_matches: /archive/purge_confirmed
    count: 0

- name: purge=true deletes from the live database after 100% verification
  setup:
    mocks:
    - url_matches: /archive/select_aged_snapshots
      method: POST
      status: 200
      body:
      - formType: compound-form
        id: 11
        formKey: 5
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /archive/purge_confirmed
      method: POST
      status: 200
      body:
      - purged: 1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
    query:
      enabled: 'true'
      retentionYears: '7'
      purge: 'true'
  expect:
    status: 200
    body:
      mode: archive+purge
      purged: 1
  verify_mocks:
  - url_matches: /archive/purge_confirmed
    count: 1

- name: purge=true is skipped when the archive does not confirm every row
  setup:
    mocks:
    - url_matches: /archive/select_aged_snapshots
      method: POST
      status: 200
      body:
      - formType: compound-form
        id: 11
        formKey: 5
        payload: {}
      - formType: compound-form
        id: 12
        formKey: 5
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /archive/purge_confirmed
      method: POST
      status: 200
      body:
      - purged: 2
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
    query:
      enabled: 'true'
      purge: 'true'
  expect:
    status: 200
    body:
      mode: verify-failed
      purged: 0
  verify_mocks:
  - url_matches: /archive/purge_confirmed
    count: 0

- name: dryRun only counts - no copy, no purge
  setup:
    mocks:
    - url_matches: /archive/select_aged_snapshots
      method: POST
      status: 200
      body:
      - formType: good-repute
        id: 3
        formKey: 3
        payload: {}
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-aged-forms
    query:
      enabled: 'true'
      purge: 'true'
      dryRun: 'true'
  expect:
    status: 200
    body:
      mode: dry-run
      wouldCopy: 1
  verify_mocks:
  - url_matches: /deleted-forms/insert_snapshots
    count: 0
  - url_matches: /archive/purge_confirmed
    count: 0
