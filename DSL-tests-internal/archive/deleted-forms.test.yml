# POST /cron/archive-deleted-forms (ADR-010) - kustutatud vormide arhiveerimine.
# Purge toimub siin alati (pole lülitit); anonymize (ADR-014/LJVIS2-51) vaikimisi true.
mode: mock-http
constants:
  LJVIS_RESQL: '{MOCK}/resql'
  LJVIS_RESQL_ARHIIV: '{MOCK}/arhiiv'
tests:
- name: nothing to archive - no insert, verify, purge or anonymize calls
  setup:
    mocks:
    - url_matches: /archive/select_deleted_snapshots
      method: POST
      status: 200
      body: []
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-deleted-forms
    headers:
      x-internal-service-token: dev-internal-service-token
  expect:
    status: 200
    body:
      response:
        copied: 0
        verified: 0
        purged: 0
  verify_mocks:
  - url_matches: /deleted-forms/insert_snapshots
    count: 0
  - url_matches: /archive/purge_confirmed
    count: 0
  - url_matches: /archive/anonymize_confirmed
    count: 0

- name: purge confirmed then anonymize runs automatically (anonymize defaults to true)
  setup:
    mocks:
    - url_matches: /archive/select_deleted_snapshots
      method: POST
      status: 200
      body:
      - formType: good-repute
        id: 21
        formKey: 9
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /archive/purge_confirmed
      method: POST
      status: 200
      body:
      - purged: 1
    - url_matches: /archive/anonymize_confirmed
      method: POST
      status: 200
      body:
      - anonymized: 1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-deleted-forms
    headers:
      x-internal-service-token: dev-internal-service-token
  expect:
    status: 200
    body:
      response:
        copied: 1
        verified: 1
        purged: 1
        anonymized: 1
  verify_mocks:
  - url_matches: /archive/anonymize_confirmed
    count: 1

- name: anonymize=false skips the anonymization step after purge
  setup:
    mocks:
    - url_matches: /archive/select_deleted_snapshots
      method: POST
      status: 200
      body:
      - formType: good-repute
        id: 22
        formKey: 10
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /archive/purge_confirmed
      method: POST
      status: 200
      body:
      - purged: 1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-deleted-forms
    headers:
      x-internal-service-token: dev-internal-service-token
    query:
      anonymize: 'false'
  expect:
    status: 200
    body:
      response:
        copied: 1
        verified: 1
        purged: 1
        anonymized: 0
  verify_mocks:
  - url_matches: /archive/anonymize_confirmed
    count: 0

- name: purge skipped when archive does not confirm every row - anonymize never called
  setup:
    mocks:
    - url_matches: /archive/select_deleted_snapshots
      method: POST
      status: 200
      body:
      - formType: good-repute
        id: 23
        formKey: 11
        payload: {}
      - formType: good-repute
        id: 24
        formKey: 11
        payload: {}
    - url_matches: /deleted-forms/insert_snapshots
      method: POST
      status: 200
      body:
      - inserted: 1
    - url_matches: /deleted-forms/count_present
      method: POST
      status: 200
      body:
      - present: 1
    - url_matches: /xroad/log_integration
      method: POST
      status: 200
      body: []
  request:
    method: POST
    path: /ljvis/cron/archive-deleted-forms
    headers:
      x-internal-service-token: dev-internal-service-token
  expect:
    status: 200
    body:
      response:
        copied: 2
        verified: 1
        purged: 0
  verify_mocks:
  - url_matches: /archive/purge_confirmed
    count: 0
  - url_matches: /archive/anonymize_confirmed
    count: 0
