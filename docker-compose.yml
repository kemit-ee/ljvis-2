services:
  database:
    container_name: database
    image: postgres:14.1
    environment:
      - POSTGRES_USER=ljvis
      - POSTGRES_PASSWORD=01234
      - POSTGRES_DB=users_db
    ports:
      - 54321:5432
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ljvisnetwork

  liquibase:
    container_name: liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      - database
    volumes:
      - ./DSL/Liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ./DSL/Liquibase/changelog:/liquibase/changelog
      - ./DSL/Liquibase/changelog.yaml:/liquibase/changelog.yaml
    command: --defaultsFile=/liquibase/liquibase.properties update
    networks:
      - ljvisnetwork

  resql-users:
    container_name: resql-users
    build:
      context: .
      dockerfile: docker/resql-users/Dockerfile
    platform: linux/amd64
    depends_on:
      - database
    environment:
      - server.port=8087
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database:5432/users_db
      - sqlms.datasources.[0].username=ljvis
      - sqlms.datasources.[0].password=01234
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8087:8087
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - ljvisnetwork

  resql-ljvis:
    container_name: resql-ljvis
    build:
      context: .
      dockerfile: docker/resql-ljvis/Dockerfile
    platform: linux/amd64
    depends_on:
      - database
    environment:
      - server.port=8090
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database:5432/ljvis_db
      - sqlms.datasources.[0].username=ljvis
      - sqlms.datasources.[0].password=01234
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8090:8090
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - ljvisnetwork

  ruuter:
    container_name: ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    platform: linux/amd64
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:3001,http://localhost:3004,http://localhost:8080
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8086
      - application.externalAuthAllowed=
    volumes:
      - ./DSL/Ruuter:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8086:8086
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  data-mapper:
    container_name: data-mapper
    build:
      context: .
      dockerfile: docker/data-mapper/Dockerfile
    platform: linux/amd64
    environment:
      - PORT=3005
      - CONTENT_FOLDER=/data
    volumes:
      - ./DSL:/data
      - ./DSL/DMapper/ljvis/hbs:/workspace/app/views/ljvis
    ports:
      - 3005:3005
    networks:
      - ljvisnetwork

  ruuter-internal:
    container_name: ruuter-internal
    build:
      context: .
      dockerfile: docker/ruuter-internal/Dockerfile
    platform: linux/amd64
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:8089,http://localhost:3001,http://localhost:3004,http://localhost:8080
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8089
    volumes:
      - ./DSL/Ruuter.internal:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8089:8089
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:14.1
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 9876:5432
    networks:
      - ljvisnetwork

  tim:
    container_name: tim
    image: ghcr.io/buerokratt/tim:pre-apha-2.7.1
    platform: linux/amd64
    depends_on:
      - tim-postgresql
    environment:
      - SECURITY_ALLOWLIST_JWT=ruuter,ruuter-internal,data-mapper,resql-users,resql-ljvis,tim,tim-postgresql,127.0.0.1,::1
      - JWT_INTEGRATION_SIGNATURE_KEY_STORE_PASSWORD=defaultpassword
      # Keycloak OAuth2 (replace URLs with TARA for production)
      - security.oauth2.client.client-id=ljvis
      - security.oauth2.client.client-secret=2651c2f9-169e-442e-8552-765526058fd4
      - security.oauth2.client.scope=openid
      - security.oauth2.client.registered-redirect-uri=http://localhost:3001/tim/authenticate
      - security.oauth2.client.user-authorization-uri=https://test-keycloak.dev.wisercat-estonia.ee/auth/realms/master/protocol/openid-connect/auth
      - security.oauth2.client.access-token-uri=https://test-keycloak.dev.wisercat-estonia.ee/auth/realms/master/protocol/openid-connect/token
      - security.oauth2.resource.jwk.key-set-uri=https://test-keycloak.dev.wisercat-estonia.ee/auth/realms/master/protocol/openid-connect/certs
      - frontpage.redirect.url=http://localhost:3001
      - auth.success.redirect.whitelist=http://localhost:3001
      - jwt-integration.signature.cookieName=customJwtCookie
      - jwt-integration.signature.secureCookie=false
      - server.servlet.session.cookie.same-site=lax
    ports:
      - 8085:8085
    networks:
      - ljvisnetwork
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "0.5"
    mem_limit: "512M"

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    depends_on:
      - ruuter
    networks:
      - ljvisnetwork

networks:
  ljvisnetwork:
    name: ljvisnetwork
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
