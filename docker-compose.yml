services:
  database:
    container_name: database
    image: postgres:17
    environment:
      - POSTGRES_USER=ljvis
      - POSTGRES_PASSWORD=01234
      - POSTGRES_DB=ljvis_db
    ports:
      - 54321:5432
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ljvis -d ljvis_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ljvisnetwork

  liquibase:
    container_name: liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./DSL/Liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ./DSL/Liquibase/changelog:/liquibase/changelog
      - ./DSL/Liquibase/changelog.yaml:/liquibase/changelog.yaml
    environment:
      - AUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    command: --defaultsFile=/liquibase/liquibase.properties update -DAUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    networks:
      - ljvisnetwork

  resql-ljvis:
    container_name: resql-ljvis
    build:
      context: .
      dockerfile: docker/resql-ljvis/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      - RESQL_DB_PASSWORD=01234
    ports:
      - 8090:8090
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - ljvisnetwork

  ruuter:
    container_name: ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    depends_on:
      nysiis:
        condition: service_healthy
    environment:
      - RUST_LOG=ruuter_on_rust::steps::http=debug,info
    volumes:
      - ./DSL/Ruuter/ljvis:/app/DSL/ljvis:ro
      - ./constants.ini:/app/constants.ini:ro
      - ./ruuter.yaml:/app/ruuter.yaml:ro
    ports:
      - 8086:8080
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  data-mapper:
    container_name: data-mapper
    build:
      context: .
      dockerfile: docker/data-mapper/Dockerfile
    ports:
      - 3005:3005
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/healthz > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - ljvisnetwork

  ruuter-internal:
    container_name: ruuter-internal
    build:
      context: .
      dockerfile: docker/ruuter-internal/Dockerfile
    environment:
      - RUST_LOG=ruuter_on_rust::steps::http=debug,info
    volumes:
      - ./DSL/Ruuter.internal/ljvis:/app/DSL/ljvis:ro
      - ./constants.ini:/app/constants.ini:ro
      - ./ruuter-internal.yaml:/app/ruuter.yaml:ro
    ports:
      - 8089:8080
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  # ─── LOCAL DEV / CI ONLY — never deployed to production (Helm charts) ───────
  tara-mock:
    container_name: tara-mock
    build:
      context: .
      dockerfile: docker/tara-mock/Dockerfile
    volumes:
      - tara-mock-vault:/service/vault
      - ./docker/tara-mock/identities.json:/service/identities.json:ro
      # config.json sets taraMockHost=tara-mock so OIDC discovery URLs use
      # the Docker-internal hostname that TIM can resolve.
      - ./docker/tara-mock/config.json:/service/config.json:ro
    networks:
      - ljvisnetwork
    ports:
      - 8888:8080
  # ─────────────────────────────────────────────────────────────────────────────

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:17
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 9876:5432
    networks:
      - ljvisnetwork

  tim:
    container_name: tim
    build:
      context: .
      dockerfile: docker/tim/Dockerfile
    depends_on:
      - tim-postgresql
      - tara-mock
    environment:
      - TIM_DATABASE_URL=postgres://tim:123@tim-postgresql:5432/tim
      - TIM_ADMIN_TOKEN=${TIM_ADMIN_TOKEN:-dev-admin-token}
      - TIM_TARA_CLIENT_ID=ljvis
      - TIM_TARA_CLIENT_SECRET=ljvis-secret
      - RUST_LOG=info
    volumes:
      - tara-mock-vault:/tara-mock-vault:ro
      - tim-jwt-key:/opt/tim/keys
    ports:
      - 8085:8085
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  s3-proxy:
    container_name: s3-proxy
    build:
      context: .
      dockerfile: docker/s3-proxy/Dockerfile
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-protokollid}
      - S3_MAX_SIZE_MB=${S3_MAX_SIZE_MB:-20}
      - S3_MAX_FILENAME_LENGTH=${S3_MAX_FILENAME_LENGTH:-200}
      - S3_ALLOWED_MIME_TYPES=${S3_ALLOWED_MIME_TYPES:-application/pdf,image/jpeg,image/png,application/vnd.etsi.asic-e+zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      - PORT=3010
    networks:
      - ljvisnetwork
    cpus: "0.25"
    mem_limit: "128M"


  nysiis:
    container_name: nysiis
    build:
      context: .
      dockerfile: docker/nysiis/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - ljvisnetwork
    cpus: "0.25"
    mem_limit: "128M"

  xtr:
    container_name: xtr
    image: turnerrainer/xtr:rc
    environment:
      - RUST_LOG=debug
      - XTR_KEYSTORE_PASSWORD=${XTR_KEYSTORE_PASSWORD:-defaultpassword}
      - SSL_CERT_FILE=/app/xtr-config/ca-bundle-with-cammy.pem
    volumes:
      - ./xtr.yaml:/app/xtr.yaml:ro
      - ./DSL/xtr:/app/DSL:ro
      - ./.ssl:/app/ssl:ro
      - ./docker/xtr:/app/xtr-config:ro
    ports:
      - 9010:8080
    networks:
      - ljvisnetwork
    cpus: "0.5"
    mem_limit: "512M"

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    depends_on:
      - ruuter
    networks:
      - ljvisnetwork

  cronmanager:
    container_name: cronmanager
    image: turnerrainer/cronmanager:alpha
    environment:
      - CRONMANAGER_CONFIG=/app/cronmanager.yaml
      # Quartz-cron triggers (DSL/CronManager/*.yaml) run in this timezone.
      - TZ=Europe/Tallinn
    volumes:
      - ./cronmanager.yaml:/app/cronmanager.yaml:ro
      - ./DSL/CronManager:/app/DSL/jobs:ro
    depends_on:
      - ruuter-internal
    ports:
      - 8087:8080
    networks:
      - ljvisnetwork
    cpus: "0.25"
    mem_limit: "128M"

volumes:
  tara-mock-vault:
  tim-jwt-key:

networks:
  ljvisnetwork:
    name: ljvisnetwork
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
