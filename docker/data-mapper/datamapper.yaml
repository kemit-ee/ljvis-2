# DataMapper config for ljvis-2.
#
# The base image (turnerrainer/datamapper:alpha) ships its own
# datamapper.yaml with port: 3000 explicitly set — the PORT env var
# is only honoured when the loaded config does NOT already set
# `port:`, so we need our own file here to run on the port ljvis-2's
# constants.ini / compose files expect (3005).
port: 3005

# Templates are baked in under /app/DSL by this project's Dockerfile
# (see docker/data-mapper/Dockerfile). Renderer resolves
# "<project>/<view>" via two candidates:
#   <dsl_path>/<project>/<view>.hbs
#   <dsl_path>/<project>/hbs/<view>.hbs   <- matches ljvis-2's layout
dsl_path: /app/DSL

# 0.2.0-alpha+ rejects request bodies whose top-level array exceeds this
# many elements (default 10000). DSL/Resql/ljvis/POST/log/list_logs_csv.sql
# caps its audit-log export at LIMIT 10000 — right at the default boundary —
# so map_logs_list_csv could get rejected by a coincidental off-by-one.
# Set well above that cap instead of relying on the exact default matching.
limits:
  max_body_array_length: 20000
