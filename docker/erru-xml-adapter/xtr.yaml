# erru-xml-adapter (XTR): ERRU MOVEHUB 3.5 SOAP-sild. Asendab Java-adapteri (docker/erru-xml-adapter-old).
# Plaan: docs/planning/erru-xml-adapter-xtr-migratsioon.md. Eraldi XTR-instants (mitte X-tee `xtr`).
dsl_path: /app/DSL
port: 8080                       # sisemine JSON-lane (/soap-out/…): ainult Ruuteri jaoks
xroad_instance: ee-dev           # ERRU ei kasuta X-tee identiteeti; XTR nõuab väljade olemasolu
client_data:
  member_class: GOV
  member_code: "70001231"
  subsystem_code: ljvis2
wsdl_watch_dir: /app/wsdl
# ErrorNotification detail (SOAP Faulti sees) peab jõudma Ruuterini: ainult see instants.
expose_soap_fault_detail: true
wsdl:
  allow_http_upstream: true      # dev/CI: Hubi mock on HTTP; päris Hubi vastu on https + 2-way SSL
  upstream_host_allowlist: [erru-hub-mock]
inbound:
  port: 8081                     # Hub-poolne port: /soap-in/… ja /health (stesta-gateway suunab siia)
  public_base_url: http://localhost:9091
limits:
  max_request_bytes: 2097152     # 2 MiB (sama piir mis Java-adapteril)
  max_response_bytes: 16777216
  request_timeout_secs: 30
