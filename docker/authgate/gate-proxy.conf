# Ühine proxy-seadistus. Token eemaldatakse enne edastamist: teenus (nt XTR REST-lane,
# mis edastab kõik sissetulevad päised turvaserverisse) ei tohi seda kunagi näha.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header x-internal-service-token "";
proxy_set_header Host $http_host;
proxy_read_timeout ${GATE_TIMEOUT};
proxy_send_timeout ${GATE_TIMEOUT};
proxy_pass http://gate_backend;
