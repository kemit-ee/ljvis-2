server:
  bind: "0.0.0.0:8090"
  max_body_bytes: 1048576
  request_timeout_seconds: 30

sql_dir: "/DSL"

project_datasource_map:
  ljvis: ljvis
  # ADR-010: eraldi kustutatud-vormide arhiivibaas. SQL: DSL/Resql/arhiiv/**
  arhiiv: arhiiv

# Resql 0.4+ keeldub mitte-loopback bind'iga käivitumast ilma autentimiseta. Bearer-värav:
# iga päring peale /health ja /healthz peab saatma `Authorization: Bearer <env väärtus>`
# (Ruuteri DSL-id: constants.ini RESQL_INTER_SERVICE_TOKEN). Env peab olema seatud, muidu boot ebaõnnestub.
security:
  inter_service_token_env: "RESQL_INTER_SERVICE_TOKEN"

allow_datasource_header: false

datasources:
  - name: ljvis
    url: "postgres://database:5432/ljvis_db"
    username: "ljvis"
    password_env: "RESQL_DB_PASSWORD"
    max_connections: 10
    acquire_timeout_seconds: 5
  - name: arhiiv
    url: "postgres://database:5432/ljvis_arhiiv_db"
    username: "ljvis"
    password_env: "RESQL_DB_PASSWORD"
    max_connections: 5
    acquire_timeout_seconds: 5

cors:
  allowed_origins: ""

logging:
  level: "info,resql=debug"
  format: "text"
