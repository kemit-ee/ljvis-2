server:
  bind: "0.0.0.0"
  port: 8085
  request_timeout_seconds: 30
  # Browser-facing base URL (via nginx reverse proxy on port 3001).
  # TIM computes its OIDC callback as {public_base_url}/auth/callback/{provider}.
  public_base_url: "http://localhost:3001/tim"

database:
  url_env: "TIM_DATABASE_URL"
  min_connections: 2
  max_connections: 10
  auto_migrate: true
  acquire_timeout_seconds: 30

jwt:
  private_key_path: "/opt/tim/keys/jwt-private.pem"
  key_id: "tim-rs-1"
  issuer: "TIM"
  # Cookie name must match what the browser and DSL set / read.
  cookie_name: "customJwtCookie"
  audience:
    validation_enabled: false

security:
  admin_token_env: "TIM_ADMIN_TOKEN"
  require_admin_token: true
  cors_allowed_origins: []

oauth2:
  session_store: "memory"
  session_ttl_seconds: 86400
  providers:
    tara:
      name: "TARA"
      # Docker-internal hostname; entrypoint imports the self-signed CA
      # so TLS verification succeeds.
      discovery_url: "https://tara-mock:8080/oidc/.well-known/openid-configuration"
      client_id_env: "TIM_TARA_CLIENT_ID"
      client_secret_env: "TIM_TARA_CLIENT_SECRET"
      scopes: ["openid"]
      # given_name/family_name on TARA ID-tokenis tipptaseme väljad — vt TIM
      # repo tests/it_oauth2_tara.rs (tara_profile_attributes_are_not_flattened_into_top_level)
      # ja tests/fixtures/tara-claims-canonical.json: profile_attributes.given_name/
      # family_name on tahtlik decoy väärtusega "Ignored", et vale mapping testis
      # kohe läbi kukuks. Sama viga oli ka ljvis2-devops dev/test/prelive tim.yaml-is.
      claim_mappings:
        first_name: "given_name"
        last_name: "family_name"
        email: ""
      token_validation:
        clock_skew_seconds: 60
        cache_ttl_seconds: 3600
      allowed_redirect_uris:
        - "http://localhost:3001/auth/callback"


