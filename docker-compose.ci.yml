# Isolated CI / local functional-test stack.
#
# Completely separate from docker-compose.yml — different network, named volumes,
# and host ports (9xxx) so it never conflicts with a running dev environment.
#
# Usage (CI):
#   Start:   docker compose -f docker-compose.ci.yml -p ljvis-ci up -d --build
#   Test:    newman run tests/postman/ljvis-e2e-collection.json \
#              -e tests/postman/ci-stack-environment.json
#   Cleanup: docker compose -f docker-compose.ci.yml -p ljvis-ci down -v
#
# Usage (local clean test run — does not touch docker-compose.yml data):
#   Start:   docker compose -f docker-compose.ci.yml -p ljvis-local up -d --build
#   Test:    newman run tests/postman/ljvis-e2e-collection.json \
#              -e tests/postman/ci-stack-environment.json
#   Cleanup: docker compose -f docker-compose.ci.yml -p ljvis-local down -v

services:

  # ── Database ──────────────────────────────────────────────────────────────
  database:
    image: postgres:17
    environment:
      - POSTGRES_USER=ljvis
      - POSTGRES_PASSWORD=01234
      - POSTGRES_DB=postgres
    volumes:
      - ci-db-data:/var/lib/postgresql/data
      - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ljvis -d ljvis_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ljvis-ci
    ports:
      - "5433:5432"

  # ── Schema migrations (production Liquibase — schema + permissions only) ──
  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    restart: "no"
    volumes:
      - ./DSL/Liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ./DSL/Liquibase/changelog:/liquibase/changelog
      - ./DSL/Liquibase/changelog.yaml:/liquibase/changelog.yaml
    environment:
      - AUDIT_SALT=${AUDIT_SALT:-ci-test-audit-salt-change-me-32chars}
    command: --defaultsFile=/liquibase/liquibase.properties update -DAUDIT_SALT=${AUDIT_SALT:-ci-test-audit-salt-change-me-32chars}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ljvis-ci

  # ── Test data bootstrap (plain psql — NOT Liquibase) ──────────────────────
  # Runs once after migrations, seeds the minimum data required for e2e tests:
  # one organisation, one super-admin user group, and one admin user. Then
  # applies two specific NCR business fixtures from DSL/Liquibase/test/ (those
  # changesets are marked `ignore:true` so `liquibase update` never touches
  # them; per .ai/coding_guidelines_and_lessons_learned.md they are plain SQL
  # meant to be run exactly like seed_test_data.sql). They seed data for flows
  # that have no inbound API yet (Stage 11 does not exist), so there is no
  # other way to create them (LJVIS2-63 Newman tests).
  #
  # Deliberately NOT every file in DSL/Liquibase/test/ — most others are
  # either (a) legacy pre-"v2 denormalized snapshot" seeds that duplicate /
  # conflict with tests/bootstrap/seed_test_data.sql (extra orgs, extra
  # permissions, and a user account for the personal code that organisations
  # .collection.json / permissions.collection.json deliberately rely on
  # staying UNREGISTERED for their 403 tests), or (b) dev-only placeholder
  # classifiers not present in the production changelog, which would break
  # classifiers.collection.json's exact `total` assertions. Add another file
  # here only after confirming it doesn't change any other collection's
  # exact-count assertions.
  bootstrap:
    image: postgres:17
    restart: "no"
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      - PGPASSWORD=01234
    volumes:
      - ./tests/bootstrap/seed_test_data.sql:/seed.sql:ro
      - ./DSL/Liquibase/test:/liquibase-test:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        psql -h database -U ljvis -d ljvis_db -f /seed.sql
        psql -h database -U ljvis -d ljvis_db -f /liquibase-test/20260818100001-erru-ncr-inbound-fixture-seed.sql
        psql -h database -U ljvis -d ljvis_db -f /liquibase-test/20260818100002-erru-ncr-sp-form-fixture-seed.sql
    networks:
      - ljvis-ci

  # ── Application services ──────────────────────────────────────────────────
  resql-ljvis:
    build:
      context: .
      dockerfile: docker/resql-ljvis/Dockerfile
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - RESQL_DB_PASSWORD=01234
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/healthz > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - ljvis-ci
    ports:
      - "9087:8090"

  data-mapper:
    build:
      context: .
      dockerfile: docker/data-mapper/Dockerfile
    restart: unless-stopped
    depends_on:
      - bootstrap
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/healthz > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - ljvis-ci
    ports:
      - "9005:3005"

  ruuter:
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    restart: unless-stopped
    depends_on:
      resql-ljvis:
        condition: service_healthy
      nysiis:
        condition: service_healthy
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - ./DSL/Ruuter/ljvis:/app/DSL/ljvis
      - ./tests/dsl:/app/DSL/ljvis/POST/auth/dev:ro
      - ./constants.ini:/app/constants.ini:ro
      - ./ruuter.yaml:/app/ruuter.yaml:ro
    networks:
      - ljvis-ci
    ports:
      - "9086:8080"
    cpus: "0.5"
    mem_limit: "512M"

  ruuter-internal:
    build:
      context: .
      dockerfile: docker/ruuter-internal/Dockerfile
    restart: unless-stopped
    depends_on:
      - bootstrap
    environment:
      - RUST_LOG=info
    volumes:
      - ./DSL/Ruuter.internal/ljvis:/app/DSL/ljvis:ro
      - ./constants.ini:/app/constants.ini:ro
      - ./ruuter-internal.yaml:/app/ruuter.yaml:ro
    networks:
      - ljvis-ci
    ports:
      - "9089:8080"
    cpus: "0.5"
    mem_limit: "512M"

  nysiis:
    build:
      context: .
      dockerfile: docker/nysiis/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - ljvis-ci
    cpus: "0.25"
    mem_limit: "128M"

  # ── Auth stack (TARA-Mock + TIM) ──────────────────────────────────────────
  tara-mock:
    build:
      context: .
      dockerfile: docker/tara-mock/Dockerfile
    volumes:
      - ci-tara-vault:/service/vault
      - ./docker/tara-mock/identities.json:/service/identities.json:ro
      # config.json sets taraMockHost=tara-mock so OIDC discovery URLs use
      # the Docker-internal hostname that TIM can resolve.
      - ./docker/tara-mock/config.json:/service/config.json:ro
    networks:
      - ljvis-ci
    ports:
      - "9888:8080"

  tim-postgresql:
    image: postgres:17
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ci-tim-db:/var/lib/postgresql/data
    networks:
      - ljvis-ci

  tim:
    build:
      context: .
      dockerfile: docker/tim/Dockerfile
    restart: unless-stopped
    depends_on:
      - tim-postgresql
      - tara-mock
    environment:
      - TIM_DATABASE_URL=postgres://tim:123@tim-postgresql:5432/tim
      - TIM_ADMIN_TOKEN=dev-admin-token
      - TIM_TARA_CLIENT_ID=ljvis
      - TIM_TARA_CLIENT_SECRET=ljvis-secret
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ci-tara-vault:/tara-mock-vault:ro
      - ci-tim-jwt-key:/opt/tim/keys
    networks:
      - ljvis-ci
    ports:
      - "9085:8085"
    cpus: "0.5"
    mem_limit: "512M"

volumes:
  ci-db-data:
  ci-tara-vault:
  ci-tim-db:
  ci-tim-jwt-key:

networks:
  ljvis-ci:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
