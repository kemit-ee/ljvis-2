# CronManager runtime config for ljvis-2 (turnerrainer/cronmanager:alpha).
# Mounted read-only into the container at /app/cronmanager.yaml (see
# docker-compose.yml). Job DSLs live in DSL/CronManager/, mounted at
# dsl_path below. See .ai/future-plans/cronmanager-scheduled-jobs.md.

port: 8080
dsl_path: /app/DSL/jobs
app_root_path: /app

# Server-to-server only — no browser ever calls this API directly.
allowed_origins: []

limits:
  max_request_bytes: 1048576        # 1 MiB
  max_response_bytes: 16777216      # 16 MiB
  request_timeout_secs: 30
  shell_timeout_secs: 300

# Job execution history disabled for now (no Postgres DSN configured) —
# jobs still run, nothing is persisted. Revisit once /jobs history is
# needed for ops visibility.

security:
  # 0.2.0-alpha+ blocks HTTP jobs whose host resolves to a private IP (SSRF
  # guard). Every job here targets ruuter-internal on the Docker/K8s network,
  # so the guard must be off; job URLs come only from the DSL baked into the
  # image, never from callers.
  block_private_networks: false
  # /jobs and /running list every job and its last result — require the admin
  # token instead of serving them anonymously (0.2.x default is public).
  expose_jobs_publicly: false
  expose_running_publicly: false
