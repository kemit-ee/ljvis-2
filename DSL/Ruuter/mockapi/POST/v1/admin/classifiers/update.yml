declaration:
  call: declare
  version: 0.1
  description: "API route for POST /mockapi/v1/admin/classifiers/update"
  method: post
  accepts: json
  returns: json
  namespace: admin

write_name_state:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/classifier/v1/mock_update"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
      name:         "${incoming.body.name}"
      description:  "${incoming.body.description}"
      createdBy:    "${incoming.body.createdBy}"
  result: db_response
respond_result:
  return: "${db_response.response.body}"
