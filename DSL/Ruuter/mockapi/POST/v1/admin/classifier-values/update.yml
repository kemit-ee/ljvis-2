declaration:
  call: declare
  version: 0.1
  description: "API route for POST /mockapi/v1/admin/classifier-values/update"
  method: post
  accepts: json
  returns: json
  namespace: admin

write_validity_state:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/classifier_value/v1/mock_update"
    headers:
      type: json
    body:
      classifierValueId: "${incoming.body.classifierValueId}"
      validFrom:         "${incoming.body.validFrom}"
      validUntil:        "${incoming.body.validUntil}"
      createdBy:         "${incoming.body.createdBy}"
  result: db_response
respond_result:
  return: "${db_response.response.body}"
