declaration:
  call: declare
  version: 0.1
  description: "API route for POST /mockapi/v1/admin/classifier-values/create"
  method: post
  accepts: json
  returns: json
  namespace: admin

create_value:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/classifier_value/v1/mock_create"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
      code:         "${incoming.body.code}"
      name:         "${incoming.body.name}"
      createdBy:    "${incoming.body.createdBy}"
  result: db_response
respond_result:
  return: "${db_response.response.body}"
