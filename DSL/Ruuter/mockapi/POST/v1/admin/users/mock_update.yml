declaration:
  call: declare
  version: 0.1
  description: "API route for POST /mockapi/v1/admin/users/mock_update"
  method: post
  accepts: json
  returns: json
  namespace: admin

update_user:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user/v1/mock_update"
    headers:
      type: json
    body:
      userId:         "${incoming.body.userId}"
      firstName:      "${incoming.body.firstName}"
      lastName:       "${incoming.body.lastName}"
      organisationId: "${incoming.body.organisationId}"
      structuralUnit: "${incoming.body.structuralUnit}"
      jobTitle:       "${incoming.body.jobTitle}"
      email:          "${incoming.body.email}"
      phone:          "${incoming.body.phone}"
      accessStart:    "${incoming.body.accessStart}"
      accessEnd:      "${incoming.body.accessEnd}"
      createdBy:      "mock_user"
  result: update_response
build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/mock_build"
    headers:
      type: json
    body:
      userId:    "${incoming.body.userId}"
      createdBy: "mock_user"
  result: snapshot_response
respond_result:
  return: "${snapshot_response.response.body[0]}"
