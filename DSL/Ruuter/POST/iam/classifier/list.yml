# list.yml — klassifikaatorite pagineeritud nimekiri

checkJwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/verify"
    body:
      jwt: ${incoming.headers.Authorization}
  result: jwt
  next: checkPermission

checkPermission:
  switch:
    - condition: "${jwt.response.body.permissions.includes('classifier.list')}"
      next: call_db
  next: forbidden

call_db:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/dev/iam/classifier/list"
    body:
      searchTerm: ${incoming.body.searchTerm}
      sortField: ${incoming.body.sortField}
      sortDirection: ${incoming.body.sortDirection}
      page: ${incoming.body.page}
      pageSize: ${incoming.body.pageSize}
  result: db_response
  next: respond

respond:
  wrapper: false
  return: ${db_response.response.body}
  next: end

forbidden:
  status: 403
  return: "Access denied"
  next: end
