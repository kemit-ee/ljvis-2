# list.yml — klassifikaatori väärtuste pagineeritud nimekiri

checkJwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/verify"
    body:
      jwt: ${incoming.headers.Authorization}
  result: jwt
  next: checkPermission

checkPermission:
  switch:
    - condition: "${jwt.response.body.permissions.includes('classifier.read')}"
      next: validate
  next: forbidden

validate:
  switch:
    - condition: ${!incoming.body || !incoming.body.classifierId}
      next: bad_request
  next: call_db

call_db:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/dev/iam/classifier_value/list"
    body:
      classifierId: ${incoming.body.classifierId}
      activeOnly: ${incoming.body.activeOnly}
      sortField: ${incoming.body.sortField}
      sortDirection: ${incoming.body.sortDirection}
      page: ${incoming.body.page}
      pageSize: ${incoming.body.pageSize}
  result: db_response
  next: respond

respond:
  wrapper: false
  return: ${db_response.response.body}
  next: end

bad_request:
  status: 400
  return: "Missing required field(s)"
  next: end

forbidden:
  status: 403
  return: "Access denied"
  next: end
