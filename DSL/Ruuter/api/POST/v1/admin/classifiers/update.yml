declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/classifiers/update"
  method: post
  accepts: json
  returns: json
  namespace: admin

require_edit_permission:
  switch:
    - condition: ${incoming.headers['X-Authorization-Roles'] != null && incoming.headers['X-Authorization-Roles'].includes('classifier.edit')}
      next: check_exists
    - condition: true
      next: forbidden
check_exists:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ljvis2/iam/classifier/v1/get_latest_name_state"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
  result: exists_response
ensure_exists:
  switch:
    - condition: ${exists_response.response.body == null || exists_response.response.body.length == 0}
      next: not_found
    - condition: true
      next: write_name_state
write_name_state:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ljvis2/iam/classifier/v1/update"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
      name:         "${incoming.body.name}"
      description:  "${incoming.body.description}"
      createdBy:    "${incoming.body.createdBy}"
  result: write_response
ensure_write_succeeded:
  switch:
    - condition: ${write_response.response.body == null || write_response.response.body.length == 0}
      next: write_failed
    - condition: true
      next: rebuild_snapshot
rebuild_snapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ljvis2/state_updater/classifier_latest/build"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
      createdBy:    "${incoming.body.createdBy}"
  result: snapshot_response
ensure_snapshot_succeeded:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: verify_snapshot
verify_snapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ljvis2/iam/classifier/v1/get"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
  result: verify_response
ensure_verify_succeeded:
  switch:
    - condition: ${verify_response.response.body == null || verify_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: respond
respond_result:
    return: "${verify_response.response.body}"
forbidden:
  status: 403
  return: ${common_error_messages.forbidden}
not_found:
  status: 404
  return: ${common_error_messages.not_found}
write_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
snapshot_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
