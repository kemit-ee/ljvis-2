check_exists:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/classifier/v1/get_latest_name_state
  args:
    classifierId: "${incoming.body.classifierId}"
  result: exists_response
switch:
  - condition: "${exists_response.response.body == null || exists_response.response.body.length == 0}"
    next: not_found
  - condition: "true"
    next: write_name_state
write_name_state:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/classifier/v1/update
  args:
    classifierId: "${incoming.body.classifierId}"
    name:         "${incoming.body.name}"
    description:  "${incoming.body.description}"
    createdBy:    "${incoming.body.createdBy}"
  result: write_response
switch:
  - condition: "${write_response.response.body == null || write_response.response.body.length == 0}"
    next: write_failed
  - condition: "true"
    next: rebuild_snapshot
rebuild_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/classifier_latest/build
  args:
    classifierId: "${incoming.body.classifierId}"
    createdBy:    "${incoming.body.createdBy}"
  result: snapshot_response
switch:
  - condition: "${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}"
    next: snapshot_failed
  - condition: "true"
    next: verify_snapshot
verify_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/classifier/v1/get
  args:
    classifierId: "${incoming.body.classifierId}"
  result: verify_response
switch:
  - condition: "${verify_response.response.body == null || verify_response.response.body.length == 0}"
    next: snapshot_failed
  - condition: "true"
    next: respond
respond:
  return: "${verify_response.response.body}"
not_found:
  status: 404
  return: ${common_error_messages.not_found}
write_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
snapshot_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
