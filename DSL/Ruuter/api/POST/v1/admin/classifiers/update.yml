# update.yml — klassifikaatori nime/selgituse uuendamine (append-only)

checkJwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/verify"
    body:
      jwt: ${incoming.headers.Authorization}
  result: jwt
  next: checkPermission

checkPermission:
  switch:
    - condition: "${jwt.response.body.permissions.includes('classifier.edit')}"
      next: validate
  next: forbidden

validate:
  switch:
    - condition: ${!incoming.body || !incoming.body.classifierId}
      next: bad_request
    - condition: ${!incoming.body.name}
      next: bad_request
    - condition: ${!incoming.body.createdBy}
      next: bad_request
  next: call_db

call_db:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/dev/v1/iam/classifier/update"
    body:
      classifierId: ${incoming.body.classifierId}
      name: ${incoming.body.name}
      description: ${incoming.body.description}
      code: ${incoming.body.code}
      createdBy: ${incoming.body.createdBy}
  result: db_response
  next: respond

respond:
  wrapper: false
  return: ${db_response.response.body}
  next: end

bad_request:
  status: 400
  return: "Missing required field(s)"
  next: end

forbidden:
  status: 403
  return: "Access denied"
  next: end
