declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/classifiers/get"
  method: post
  accepts: json
  returns: json
  namespace: admin

get_classifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ljvis2/iam/classifier/v1/get"
    headers:
      type: json
    body:
      classifierId: "${incoming.body.classifierId}"
  result: db_response
check_found:
  switch:
    - condition: ${db_response.response.body == null || db_response.response.body.length == 0}
      next: not_found
    - condition: true
      next: return_result
not_found:
  status: 404
  return: "${common_error_messages.not_found}"
return_result:
  return: "${db_response.response.body[0]}"
