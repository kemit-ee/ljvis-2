get_classifier:
  call: http://[#LOCAL_RESQL]/ljvis2/v1/iam/classifier/get
  args:
    classifierId: "${incoming.body.classifierId}"
  result: db_response
switch:
  - condition: "${db_response.response.body == null || db_response.response.body.length == 0}"
    next: not_found
  - condition: "true"
    next: respond
respond:
  return: "${db_response.response.body}"
not_found:
  status: 404
  return: ${common_error_messages.not_found}
