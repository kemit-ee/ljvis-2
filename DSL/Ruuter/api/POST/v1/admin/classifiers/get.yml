# get.yml — klassifikaatori detailvaade ID või koodi järgi

checkJwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/verify"
    body:
      jwt: ${incoming.headers.Authorization}
  result: jwt
  next: checkPermission

checkPermission:
  switch:
    - condition: "${jwt.response.body.permissions.includes('classifier.read')}"
      next: validate
  next: forbidden

validate:
  switch:
    - condition: ${!incoming.body || (!incoming.body.classifierId && !incoming.body.code)}
      next: bad_request
    - condition: ${incoming.body.classifierId && incoming.body.code}
      next: bad_request
  next: call_db

call_db:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/dev/v1/iam/classifier/get"
    body:
      classifierId: ${incoming.body.classifierId}
      code: ${incoming.body.code}
  result: db_response
  next: respond

respond:
  wrapper: false
  return: ${db_response.response.body}
  next: end

bad_request:
  status: 400
  return: "Provide exactly one of classifierId or code"
  next: end

forbidden:
  status: 403
  return: "Access denied"
  next: end
