declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/user-groups/update"
  method: post
  accepts: json
  returns: json
  namespace: admin

update_group:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/update"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
      name:        "${incoming.body.name}"
      createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: update_response
verify_update:
  switch:
    - condition: ${update_response.response.body == null || update_response.response.body.length == 0}
      next: update_failed
    - condition: true
      next: build_snapshot
update_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_group_latest/build"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
      createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
