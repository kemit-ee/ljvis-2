update_group:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/mock_update
  args:
    userGroupId: "${incoming.body.userGroupId}"
    name:        "${incoming.body.name}"
    createdBy:   "mock_user"
  result: update_response
build_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/user_group_latest/mock_build
  args:
    userGroupId: "${incoming.body.userGroupId}"
    createdBy:   "mock_user"
  result: snapshot_response
return: "${snapshot_response.response.body[0]}"
