create_group:
  call: http://[#LOCAL_RESQL]/ljvis2/v1/iam/user_group/create
  args:
    name:      "${incoming.body.name}"
    createdBy: "${incoming.headers['X-Authorization-Sub']}"
  result: create_response
verify_create:
  switch:
    - condition: "${create_response.response.body == null || create_response.response.body.length == 0}"
      next: create_failed
    - condition: "true"
      next: build_snapshot
create_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
build_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/user_group_latest/build
  args:
    userGroupId: "${create_response.response.body[0].userGroupId}"
    createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: "${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}"
      next: snapshot_failed
    - condition: "true"
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
