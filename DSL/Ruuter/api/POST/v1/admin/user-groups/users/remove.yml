declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/user-groups/users/remove"
  method: post
  accepts: json
  returns: json
  namespace: admin

remove_user:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/remove_user"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
      userId:      "${incoming.body.userId}"
      createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: remove_response
verify_remove:
  switch:
    - condition: ${remove_response.response.body == null || remove_response.response.body.length == 0}
      next: remove_failed
    - condition: true
      next: build_snapshot
remove_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/build"
    headers:
      type: json
    body:
      userId:    "${incoming.body.userId}"
      createdBy: "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
