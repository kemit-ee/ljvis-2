declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/user-groups/users/add"
  method: post
  accepts: json
  returns: json
  namespace: admin

add_user:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/add_user"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
      userId:      "${incoming.body.userId}"
      createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: add_response
verify_add:
  switch:
    - condition: ${add_response.response.body == null || add_response.response.body.length == 0}
      next: add_failed
    - condition: true
      next: build_snapshot
add_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/build"
    headers:
      type: json
    body:
      userId:    "${incoming.body.userId}"
      createdBy: "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
