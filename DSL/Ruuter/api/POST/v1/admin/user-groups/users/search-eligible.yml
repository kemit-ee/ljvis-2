get_group_orgs:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/get
  args:
    userGroupId: "${incoming.body.userGroupId}"
  result: group_response
search_users:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/search_eligible_users
  args:
    userGroupId:     "${incoming.body.userGroupId}"
    query:           "${incoming.body.query}"
    organisationIds: "${group_response.response.body[0].organisations}"
  result: db_response
return: "${db_response.response.body}"
