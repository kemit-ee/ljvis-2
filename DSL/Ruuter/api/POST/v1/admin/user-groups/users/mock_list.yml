declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/user-groups/users/mock_list"
  method: post
  accepts: json
  returns: json
  namespace: admin

get_users:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/mock_list_users"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
      page:        "${incoming.body.page}"
      pageSize:    "${incoming.body.pageSize}"
  result: db_response
respond_result:
  return: "${db_response.response.body}"
