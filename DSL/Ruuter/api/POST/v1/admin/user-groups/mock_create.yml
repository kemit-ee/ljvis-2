create_group:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/mock_create
  args:
    name:      "${incoming.body.name}"
    createdBy: "mock_user"
  result: create_response
build_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/user_group_latest/mock_build
  args:
    userGroupId: "${create_response.response.body[0].userGroupId}"
    createdBy:   "mock_user"
  result: snapshot_response
return: "${snapshot_response.response.body[0]}"
