declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/user-groups/mock_get"
  method: post
  accepts: json
  returns: json
  namespace: admin

get_group:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group/v1/mock_get"
    headers:
      type: json
    body:
      userGroupId: "${incoming.body.userGroupId}"
  result: db_response
respond_result:
  return: "${db_response.response.body[0]}"
