require_edit_permission:
  switch:
    - condition: "${incoming.headers['X-Authorization-Roles'] != null && incoming.headers['X-Authorization-Roles'].includes('classifier_value.edit')}"
      next: check_exists
    - condition: "true"
      next: forbidden
check_exists:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/classifier_value/v1/get_latest_validity_state
  args:
    classifierValueId: "${incoming.body.classifierValueId}"
  result: exists_response
ensure_exists:
  switch:
    - condition: "${exists_response.response.body == null || exists_response.response.body.length == 0}"
      next: not_found
    - condition: "true"
      next: write_validity_state
write_validity_state:
  call: http://[#LOCAL_RESQL]/ljvis2/iam/classifier_value/v1/update
  args:
    classifierValueId: "${incoming.body.classifierValueId}"
    validFrom:         "${incoming.body.validFrom}"
    validUntil:        "${incoming.body.validUntil}"
    createdBy:         "${incoming.body.createdBy}"
  result: write_response
ensure_write_succeeded:
  switch:
    - condition: "${write_response.response.body == null || write_response.response.body.length == 0}"
      next: write_failed
    - condition: "true"
      next: rebuild_snapshot
rebuild_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/classifier_value_latest/build
  args:
    classifierValueId: "${incoming.body.classifierValueId}"
    createdBy:         "${incoming.body.createdBy}"
  result: snapshot_response
ensure_snapshot_succeeded:
  switch:
    - condition: "${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}"
      next: snapshot_failed
    - condition: "true"
      next: respond
respond:
  return: "${snapshot_response.response.body}"
forbidden:
  status: 403
  return: ${common_error_messages.forbidden}
not_found:
  status: 404
  return: ${common_error_messages.not_found}
write_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
snapshot_failed:
  status: 500
  return: ${common_error_messages.internal_server_error}
