# create.yml — lisab klassifikaatorisse uue väärtuse

checkJwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/verify"
    body:
      jwt: ${incoming.headers.Authorization}
  result: jwt
  next: checkPermission

checkPermission:
  switch:
    - condition: "${jwt.response.body.permissions.includes('classifier_value.edit')}"
      next: validate
  next: forbidden

validate:
  switch:
    - condition: ${!incoming.body || !incoming.body.classifierId}
      next: bad_request
    - condition: ${!incoming.body.code}
      next: bad_request
    - condition: ${!incoming.body.name}
      next: bad_request
    - condition: ${!incoming.body.validFrom}
      next: bad_request
    - condition: ${!incoming.body.createdBy}
      next: bad_request
  next: call_db

call_db:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/dev/iam/classifier_value/create"
    body:
      classifierId: ${incoming.body.classifierId}
      code: ${incoming.body.code}
      name: ${incoming.body.name}
      validFrom: ${incoming.body.validFrom}
      validUntil: ${incoming.body.validUntil}
      createdBy: ${incoming.body.createdBy}
  result: db_response
  next: respond

respond:
  wrapper: false
  return: ${db_response.response.body}
  next: end

bad_request:
  status: 400
  return: "Missing required field(s)"
  next: end

forbidden:
  status: 403
  return: "Access denied"
  next: end
