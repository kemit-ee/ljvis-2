declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/users/mock_check-personal-code-exists"
  method: post
  accepts: json
  returns: json
  namespace: admin

check_code:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user/v1/mock_check_personal_code_exists"
    headers:
      type: json
    body:
      personalCode: "${incoming.body.personalCode}"
  result: db_response
respond_result:
  return: "${db_response.response.body[0]}"
