declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/users/list"
  method: post
  accepts: json
  returns: json
  namespace: admin

get_list:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user/v1/list"
    headers:
      type: json
    body:
      page:           "${incoming.body.page}"
      pageSize:       "${incoming.body.pageSize}"
      search:         "${incoming.body.search}"
      organisationId: >-
        ${incoming.headers['X-Authorization-Roles'] != null &&
         incoming.headers['X-Authorization-Roles'].includes('user.list.local') &&
         !incoming.headers['X-Authorization-Roles'].includes('user.list.admin')
          ? incoming.headers['X-Authorization-Organisation-Id']
          : null}
  result: db_response
respond_result:
  return: "${db_response.response.body}"
