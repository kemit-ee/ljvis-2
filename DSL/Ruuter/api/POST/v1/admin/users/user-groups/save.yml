declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/users/user-groups/save"
  method: post
  accepts: json
  returns: json
  namespace: admin

save_groups:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user_group_membership/v1/save"
    headers:
      type: json
    body:
      userId:      "${incoming.body.userId}"
      actions:     "${incoming.body.actions}"
      createdBy:   "${incoming.headers['X-Authorization-Sub']}"
  result: save_response
verify_save:
  switch:
    - condition: ${save_response.response.body == null || save_response.response.body.length == 0}
      next: save_failed
    - condition: true
      next: build_snapshot
save_failed:
  status: 500
  return: "${common_error_messages.internal_error}"

build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/build"
    headers:
      type: json
    body:
      userId:    "${incoming.body.userId}"
      createdBy: "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
