save_groups:
  call: http://[#LOCAL_RESQL]/ljvis2/v1/iam/user_group_membership/mock_save
  args:
    userId:      "${incoming.body.userId}"
    userGroupId: "${incoming.body.userGroupId}"
    action:      "${incoming.body.action}"
    createdBy:   "mock_user"
  result: save_response
build_snapshot:
  call: http://[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/mock_build
  args:
    userId:    "${incoming.body.userId}"
    createdBy: "mock_user"
  result: snapshot_response
return: "${snapshot_response.response.body[0]}"
