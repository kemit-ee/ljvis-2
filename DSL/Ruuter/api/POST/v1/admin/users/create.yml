declaration:
  call: declare
  version: 0.1
  description: "API route for POST /api/v1/admin/users/create"
  method: post
  accepts: json
  returns: json
  namespace: admin

create_user:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/iam/user/v1/create"
    headers:
      type: json
    body:
      personalCode:   "${incoming.body.personalCode}"
      firstName:      "${incoming.body.firstName}"
      lastName:       "${incoming.body.lastName}"
      organisationId: "${incoming.body.organisationId}"
      structuralUnit: "${incoming.body.structuralUnit}"
      jobTitle:       "${incoming.body.jobTitle}"
      email:          "${incoming.body.email}"
      phone:          "${incoming.body.phone}"
      accessStart:    "${incoming.body.accessStart}"
      accessEnd:      "${incoming.body.accessEnd}"
      createdBy:      "${incoming.headers['X-Authorization-Sub']}"
  result: create_response
verify_create:
  switch:
    - condition: ${create_response.response.body == null || create_response.response.body.length == 0}
      next: create_failed
    - condition: true
      next: build_snapshot
create_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
build_snapshot:
  call: http.post
  args:
    url: "[#LOCAL_RESQL]/ljvis2/state_updater/user_account_latest/build"
    headers:
      type: json
    body:
      userId:    "${create_response.response.body[0].userId}"
      createdBy: "${incoming.headers['X-Authorization-Sub']}"
  result: snapshot_response
verify_snapshot:
  switch:
    - condition: ${snapshot_response.response.body == null || snapshot_response.response.body.length == 0}
      next: snapshot_failed
    - condition: true
      next: return_result
snapshot_failed:
  status: 500
  return: "${common_error_messages.internal_error}"
return_result:
  return: "${snapshot_response.response.body[0]}"
