declaration:

  version: "1.0"
  description: "Update user group name"
  method: put
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: name
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: updateName

updateName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/update_user_group_name"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      name: ${name}
      created_by: ${actor_personal_code}
  result: res
  next: buildAuditLog

buildAuditLog:
  assign:
    description: "Kasutajagrupi nime muutmine, vana nimi:'${group_name}', uus nimi:'${name}'"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[\"name\"],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  body:
    event_type: "user_group.update"
    event_category: "user_group_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
