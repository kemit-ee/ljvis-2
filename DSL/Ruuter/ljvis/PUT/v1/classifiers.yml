declaration:

  version: "1.0"
  description: "Update classifier"
  namespace: classifiers
  allowlist:
    body:
      - field: id
        type: number
      - field: name
        type: string
      - field: description
        type: string

get_user_context:
  template: "templates/check-user-authority"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    description: "${incoming.body.description}"
    created_by: "${auth_user.personalcode || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifier

getClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "templates/classifier/calculate-classifier-changed-fields"
  requestType: GET
  body:
    classifier_id: ${id}
    name: ${name}
    description: ${description}
  result: changedFieldsResult
  next: validateClassifier

validateClassifier:
  template: "templates/classifier/validate-classifier-fields"
  requestType: GET
  body:
    name: ${name}
    description: ${description}
  result: field_error
  next: checkClassifier

checkClassifier:
  switch:
    - condition: ${field_error != 'valid'}
      next: propagate_error
  next: updateClassifier

updateClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/update_classifier"
    headers:
      type: json
    body:
      classifier_id: ${id}
      name: ${name}
      description: ${description}
      created_by: ${created_by}
  result: updatedRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    changed_fields: ${changedFieldsResult}
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Klassifikaator '${classifier_code}' (ID ${id}), muudetud väljad: ${changed_fields}"
    log_content: "{\"classifierId\":${id},\"classifierCode\":\"${classifier_code}\",\"changedFields\":${changed_fields}}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "classifier.update"
    event_category: "classifier_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${updatedRes.response.body}
  next: end

propagate_error:
  status: 422
  return: ${field_error}
  next: end
