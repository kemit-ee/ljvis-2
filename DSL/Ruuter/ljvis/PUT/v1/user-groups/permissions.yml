declaration:

  version: "1.0"
  description: "Replace all permission links for a user group"
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: addedPermissionIds
        type: array
        description: "Array of added permission IDs"
      - field: removedPermissionIds
        type: array
        description: "Array of removed permission IDs"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    added_permission_ids: "${(incoming.body.addedPermissionIds ?? []).join(',')}"
    removed_permission_ids: "${(incoming.body.removedPermissionIds ?? []).join(',')}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: setPerms

setPerms:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_permissions"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      added_permission_ids: ${added_permission_ids}
      removed_permission_ids: ${removed_permission_ids}
      created_by: ${actor_personal_code}
  result: setPermsRes
  next: listAllPermissions

listAllPermissions:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/permission/list_permissions"
    headers:
      type: json
    body: {}
  result: allPermsRes
  next: returnSuccess

returnSuccess:
  assign:
    description: "Kasutajagrupi ${group_name} muutmine: õigused"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user_group.update"
    event_category: "user_group_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccessResult

returnSuccessResult:
  return: "ok"
  next: end
