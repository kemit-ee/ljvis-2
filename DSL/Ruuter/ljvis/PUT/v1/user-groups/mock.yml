declaration:
  description: "Arenduse mock: PUT /v1/user-groups/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: "2"
          name: "Updated Group Name"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
