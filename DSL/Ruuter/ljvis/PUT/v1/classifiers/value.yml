declaration:

  version: "1.0"
  description: "Update a classifier value validity period"
  namespace: classifiers
  allowlist:
    body:
      - field: classifierId
        type: string
      - field: classifierValueId
        type: string
      - field: code
        type: string
      - field: name
        type: string
      - field: validFrom
        type: string
      - field: validUntil
        type: string
      - field: formTypes
        type: array
        description: "ADR-011: FORM_TYPE koodid, millele väärtus piiratakse; [] = kõik vormid; puudumisel piirangut ei muudeta"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    classifier_id: "${incoming.body.classifierId}"
    classifier_value_id: "${incoming.body.classifierValueId}"
    code: "${incoming.body.code}"
    name: "${incoming.body.name}"
    valid_from: "${incoming.body.validFrom}"
    valid_until: "${incoming.body.validUntil ?? ''}"
    form_types_provided: ${incoming.body.formTypes != null}
    form_type_codes: "${(incoming.body.formTypes ?? []).join(',')}"
    created_by: "${auth_user.personalcode || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifierCode

getClassifierCode:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${classifier_id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "templates/classifier/calculate-validity-changed-fields"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    classifier_value_id: ${classifier_value_id}
    valid_from: ${valid_from}
    valid_until: ${valid_until}
  result: changedFieldsResult
  next: getOldFormScope

# ADR-011: vana vormipiirang auditikirje jaoks (get_classifier_value tagastab formTypes sorteeritult)
getOldFormScope:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_value"
    headers:
      type: json
    body:
      classifier_value_id: ${classifier_value_id}
  result: oldValueRes
  next: setOldFormScope

setOldFormScope:
  assign:
    old_form_type_codes: "${(oldValueRes.response.body[0].formTypes ?? []).join(',')}"
  next: updateClassifierValue

updateClassifierValue:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/update_classifier_value"
    headers:
      type: json
    body:
      classifier_value_id: ${classifier_value_id}
      name: ${name}
      valid_from: ${valid_from}
      valid_until: ${valid_until}
      created_by: ${created_by}
  result: updatedRes
  next: checkUpdateResult

checkUpdateResult:
  switch:
    - condition: ${updatedRes.response.status >= 200 && updatedRes.response.status < 300 && updatedRes.response.body != null && updatedRes.response.body.length > 0}
      next: checkFormScopeProvided
    - condition: ${updatedRes.response.status == 400}
      next: returnInvalidPeriod
  next: returnSaveFailed

checkFormScopeProvided:
  switch:
    - condition: ${form_types_provided}
      next: setFormScope
  next: keepFormScope

keepFormScope:
  assign:
    form_type_codes: ${old_form_type_codes}
  next: buildAuditEvent

setFormScope:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/set_classifier_value_form_scope"
    headers:
      type: json
    body:
      classifier_value_id: ${classifier_value_id}
      form_type_codes: ${form_type_codes}
      created_by: ${created_by}
  result: formScopeRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    changed_fields: ${changedFieldsResult}
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Klassifikaator '${classifier_code}' (ID ${classifier_id}), väärtus '${code}' (ID ${classifier_value_id}), muudetud väljad: ${changed_fields}, vormipiirang: '${old_form_type_codes}' → '${form_type_codes}'"
    log_content: "{\"classifierId\":${classifier_id},\"classifierCode\":\"${classifier_code}\",\"classifierValueId\":${classifier_value_id},\"code\":\"${code}\",\"changedFields\":${changed_fields},\"validFrom\":\"${valid_from}\",\"validUntil\":\"${valid_until}\",\"formTypesOld\":\"${old_form_type_codes}\",\"formTypes\":\"${form_type_codes}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "classifier_value.update"
    event_category: "classifier_management"
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${updatedRes.response.body}
  next: end

# Andmebaasi piirang ck_cv_period (valid_until > valid_from) lükkas muudatuse
# tagasi — varem tagastati siin 200 ja UI teatas õnnestumisest.
returnInvalidPeriod:
  status: 422
  return:
    type: VALIDATION_ERROR
    field: validUntil
    code: invalid_period
  next: end

returnSaveFailed:
  status: 500
  return:
    type: SERVER_ERROR
    code: save_failed
  next: end
