declaration:
  description: "Arenduse mock: PUT /v1/classifiers/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: "1"
          code: "AMETIKOHT"
          name: "Ametikoht (uuendatud)"
          description: "Ametikohad (uuendatud)"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
