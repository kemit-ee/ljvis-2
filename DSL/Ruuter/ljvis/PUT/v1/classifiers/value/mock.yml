declaration:
  description: "Arenduse mock: PUT /v1/classifiers/value/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - classifierValueId: "101"
          classifierId: "1"
          classifierCode: "AMETIKOHT"
          code: "ARENDAJA"
          name: "Arendaja"
          validFrom: "2024-01-01"
          validUntil: "2026-12-31"
          isValid: true
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
