declaration:

  version: "0.1"
  description: "Update an existing user"
  method: put
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: id
        type: string
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: personalCode
        type: string
      - field: organisationId
        type: string
      - field: structuralUnitName
        type: string
      - field: jobTitleName
        type: string
      - field: email
        type: string
      - field: phone
        type: string
      - field: accessStart
        type: string
      - field: accessEnd
        type: string
      - field: status
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_account_id: "${incoming.body.id}"
    first_name: "${incoming.body.firstName}"
    last_name: "${incoming.body.lastName}"
    personal_code: "${incoming.body.personalCode}"
    organisation_id: "${incoming.body.organisationId}"
    structural_unit: "${incoming.body.structuralUnitName}"
    job_title: "${incoming.body.jobTitleName}"
    email: "${incoming.body.email}"
    phone: "${incoming.body.phone ?? ''}"
    access_start: "${incoming.body.accessStart}"
    access_end: "${incoming.body.accessEnd ?? ''}"
    created_by: "${auth_user.personalcode}"
    status: "${incoming.body.status ?? ''}"
  next: getCurrentUserGroups

getCurrentUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_groups"
    headers:
      type: json
    body:
      user_id: ${user_account_id}
  result: currentGroupsRes
  next: extractRemovedGroupIds

extractRemovedGroupIds:
  assign:
    removed_group_ids: "${JSON.stringify((currentGroupsRes.response.body ?? []).map(g => Number(g.userGroupId)))}"
  next: validateId

validateId:
  switch:
    - condition: ${user_account_id == null || user_account_id == ''}
      next: return_invalid_id
  next: validateUser

return_invalid_id:
  assign:
    field_error:
      type: VALIDATION_ERROR
      field: id
      code: required
  next: propagate_error

validateUser:
  template: "[#LJVIS_PROJECT_LAYER]/user/validate-user-fields"
  requestType: templates
  body:
    first_name: ${first_name}
    last_name: ${last_name}
    personal_code: ${personal_code}
    organisation_id: ${organisation_id}
    job_title_name: ${job_title}
    email: ${email}
    access_start: ${access_start}
  result: field_error
  next: checkUser

checkUser:
  switch:
    - condition: ${field_error != 'valid'}
      next: propagate_error
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/user/calculate-user-changed-fields"
  requestType: templates
  body:
    user_account_id: ${user_account_id}
    first_name: ${first_name}
    last_name: ${last_name}
    organisation_id: ${organisation_id}
    structural_unit_name: ${structural_unit}
    job_title_name: ${job_title}
    email: ${email}
    phone: ${phone}
    access_start: ${access_start}
    access_end: ${access_end}
  result: changedFieldsResult
  next: extractResult

extractResult:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
    changed_fields_result: ${parsed_result.changed_fields}
    old_organisation_id: ${parsed_result.old_organisation_id}
    clear_groups: ${changed_fields_result.includes('organisation_id')}
  next: updateUser

updateUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/update_user_account"
    headers:
      type: json
    body:
      user_account_id: ${user_account_id}
      personal_code: ${personal_code}
      first_name: ${first_name}
      last_name: ${last_name}
      organisation_id: ${organisation_id}
      email: ${email}
      phone: ${phone}
      structural_unit: ${structural_unit}
      job_title: ${job_title}
      access_start: ${access_start}
      access_end: ${access_end}
      status: ${status}
      created_by: ${created_by}
      clear_groups: ${clear_groups}
  result: updateRes
  next: checkAnyChanges

checkAnyChanges:
  switch:
    - condition: ${changed_fields_result.length > 0}
      next: setAnyChanges
  next: setNoChanges

setAnyChanges:
  assign:
    changed_fields: ${changed_fields_result}
    changed_fields_str: ${changed_fields_result.join(',')}
    view_description: "Kasutaja muutmine: ${first_name} ${last_name} (${personal_code}), muudetud: ${changed_fields_str}"
  next: checkOrgChanges

setNoChanges:
  assign:
    changed_fields: ${changed_fields_result}
    view_description: "Kasutaja muutmine: ${first_name} ${last_name} (${personal_code})"
  next: checkOrgChanges

checkOrgChanges:
  switch:
    - condition: ${changed_fields_result.includes('organisation_id')}
      next: handleOrgChanges
  next: handleNoOrgChanges

handleOrgChanges:
  assign:
    changed_fields_json: ${JSON.stringify(changed_fields)}
    view_log_content: "{\"targetPersonalCode\":\"${personal_code}\",\"targetName\":\"${first_name} ${last_name}\",\"changedFields\":${changed_fields_json},\"previousOrganisationId\":${old_organisation_id},\"newOrganisationId\":${organisation_id},\"removedGroupIds\":${removed_group_ids}}"
  next: buildAuditLog

handleNoOrgChanges:
  assign:
    changed_fields_json: ${JSON.stringify(changed_fields)}
    view_log_content: "{\"targetPersonalCode\":\"${personal_code}\",\"targetName\":\"${first_name} ${last_name}\",\"changedFields\":${changed_fields_json},\"previousOrganisationId\":null,\"newOrganisationId\":null,\"removedGroupIds\":null}"
  next: buildAuditLog

buildAuditLog:
  assign:
    actor_name: "${auth_user.firstname} ${auth_user.lastname}"
    actor_personal_code: ${auth_user.personalcode}
    description: ${view_description}
    log_content: ${view_log_content}
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  body:
    event_type: "user.update"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${updateRes.response.body}
  next: end

propagate_error:
  status: 422
  return: ${field_error}
  next: end
