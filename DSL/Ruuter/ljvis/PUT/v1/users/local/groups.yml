declaration:

  version: "0.1"
  description: "Replace all group memberships for a user"
  method: put
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: userId
        type: string
        description: "User ID"
      - field: addedGroupIds
        type: array
        description: "Array of added user group IDs"
      - field: removedGroupIds
        type: array
        description: "Array of removed user group IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_account_id: "${incoming.body.userId}"
    added_group_ids: "${(incoming.body.addedGroupIds ?? []).join(',')}"
    removed_group_ids: "${(incoming.body.removedGroupIds ?? []).join(',')}"
    added_group_ids_json: "${JSON.stringify((incoming.body.addedGroupIds ?? []).map(Number))}"
    removed_group_ids_json: "${JSON.stringify((incoming.body.removedGroupIds ?? []).map(Number))}"
    created_by: "${auth_user.personalcode}"
  next: checkRemovedGroups

checkRemovedGroups:
  switch:
    - condition: "${removed_group_ids == ''}"
      next: checkAddedGroups
  next: removeGroups

removeGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/set_user_groups"
    headers:
      type: json
    body:
      user_account_id: ${user_account_id}
      group_ids: ${removed_group_ids}
      status: "removed"
      created_by: ${created_by}
  result: removeRes
  next: checkAddedGroups

checkAddedGroups:
  switch:
    - condition: "${added_group_ids == ''}"
      next: getUser
  next: insertGroups

insertGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/set_user_groups"
    headers:
      type: json
    body:
      user_account_id: ${user_account_id}
      group_ids: ${added_group_ids}
      status: "active"
      created_by: ${created_by}
  result: insertRes
  next: getUser

getUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${user_account_id}
      organisation_id: "${auth_user.organisationid}"
  result: userRes
  next: buildAuditLog

buildAuditLog:
  assign:
    actor_name: "${auth_user.firstname} ${auth_user.lastname}"
    actor_personal_code: ${auth_user.personalcode}
    first_name: "${userRes.response.body[0].firstName || ''}"
    last_name: "${userRes.response.body[0].lastName || ''}"
    personal_code: "${userRes.response.body[0].personalCode || ''}"
    log_content: "{\"targetPersonalCode\":\"${personal_code}\",\"targetName\":\"${first_name} ${last_name}\",\"addedGroupIds\":${added_group_ids_json},\"removedGroupIds\":${removed_group_ids_json}}"
  next: buildDescription

buildDescription:
  assign:
    description: "Kasutaja ${first_name} ${last_name} (${personal_code}) gruppide muutmine"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  body:
    event_type: "user.set_groups"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end
