declaration:

  version: "1.0"
  description: "Validate all required user form fields including format checks"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: first_name
        type: string
      - field: last_name
        type: string
      - field: personal_code
        type: string
      - field: organisation_id
        type: string
      - field: structural_unit_id
        type: string
      - field: job_title_name
        type: string
      - field: email
        type: string
      - field: access_start
        type: string

check_first_name:
  switch:
    - condition: ${incoming.body.first_name == null || incoming.body.first_name == ''}
      next: return_invalid_first_name
  next: check_last_name

check_last_name:
  switch:
    - condition: ${incoming.body.last_name == null || incoming.body.last_name == ''}
      next: return_invalid_last_name
  next: check_personal_code

check_personal_code:
  switch:
    - condition: ${incoming.body.personal_code == null || incoming.body.personal_code == ''}
      next: return_invalid_personal_code
  next: check_organisation_id

check_organisation_id:
  switch:
    - condition: ${incoming.body.organisation_id == null || incoming.body.organisation_id == ''}
      next: return_invalid_organisation_id
  next: check_job_title_name

check_job_title_name:
  switch:
    - condition: ${incoming.body.job_title_name == null || incoming.body.job_title_name == ''}
      next: return_invalid_job_title_name
  next: check_email

check_email:
  switch:
    - condition: ${incoming.body.email == null || incoming.body.email == ''}
      next: return_invalid_email
  next: check_access_start

check_access_start:
  switch:
    - condition: ${incoming.body.access_start == null || incoming.body.access_start == ''}
      next: return_invalid_access_start
  next: validate_personal_code_format

validate_personal_code_format:
  template: "[#LJVIS_PROJECT_LAYER]/validate/estonian-personal-code"
  requestType: templates
  body:
    personal_code: ${incoming.body.personal_code}
  result: pc_result
  next: check_personal_code_format

check_personal_code_format:
  switch:
    - condition: ${pc_result != 'valid'}
      next: propagate_pc_error
  next: validate_email_format

validate_email_format:
  template: "[#LJVIS_PROJECT_LAYER]/validate/email"
  requestType: templates
  body:
    email: ${incoming.body.email}
  result: email_result
  next: check_email_format

check_email_format:
  switch:
    - condition: ${email_result != 'valid'}
      next: propagate_email_error
  next: return_valid

return_valid:
  return: "valid"
  next: end

return_invalid_first_name:
  assign:
    error_field: firstName
    error_code: required
  next: emit_invalid

return_invalid_last_name:
  assign:
    error_field: lastName
    error_code: required
  next: emit_invalid

return_invalid_personal_code:
  assign:
    error_field: personalCode
    error_code: required
  next: emit_invalid

return_invalid_organisation_id:
  assign:
    error_field: organisationId
    error_code: required
  next: emit_invalid


return_invalid_job_title_name:
  assign:
    error_field: jobTitleName
    error_code: required
  next: emit_invalid

return_invalid_email:
  assign:
    error_field: email
    error_code: required
  next: emit_invalid

return_invalid_access_start:
  assign:
    error_field: accessStart
    error_code: required
  next: emit_invalid

emit_invalid:
  assign:
    field_error:
      type: VALIDATION_ERROR
      field: ${error_field}
      code: ${error_code}
  next: emit_send

emit_send:
  status: 422
  return: ${field_error}
  next: end

propagate_pc_error:
  status: 422
  return: ${pc_result}
  next: end

propagate_email_error:
  status: 422
  return: ${email_result}
  next: end
