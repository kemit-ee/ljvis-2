declaration:

  version: "0.1"
  description: "Calculate changed fields for a labour inspection form update, diffing against its latest saved snapshot"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: formId
        type: string
      - field: inspectorName
        type: string
      - field: inspectionDate
        type: string
      - field: inspectionType
        type: string
      - field: companyName
        type: string
      - field: companyRegCode
        type: string
      - field: vehicleCount
        type: string
      - field: totalDriversCount
        type: string
      - field: controlsMatrix
        type: string
      - field: prescriptionComposed
        type: string
      - field: punishedPersonIdCode
        type: string
      - field: punishedPersonFirstName
        type: string
      - field: punishedPersonLastName
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: violations
        type: string

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/get"
    headers:
      type: json
    body:
      id: ${incoming.body.formId}
  result: res
  next: buildAuditData

buildAuditData:
  assign:
    old_inspector_name: "${res.response.body[0].inspectorName || ''}"
    old_inspection_date: "${res.response.body[0].inspectionDate || ''}"
    old_inspection_type: "${res.response.body[0].inspectionType || ''}"
    old_company_name: "${res.response.body[0].companyName || ''}"
    old_company_reg_code: "${res.response.body[0].companyRegCode || ''}"
    old_vehicle_count: "${res.response.body[0].vehicleCount || ''}"
    old_total_drivers_count: "${res.response.body[0].totalDriversCount || ''}"
    old_controls_matrix: "${res.response.body[0].controlsMatrix || ''}"
    old_prescription_composed: "${res.response.body[0].prescriptionComposed || ''}"
    old_punished_person_id_code: "${res.response.body[0].punishedPersonIdCode || ''}"
    old_punished_person_first_name: "${res.response.body[0].punishedPersonFirstName || ''}"
    old_punished_person_last_name: "${res.response.body[0].punishedPersonLastName || ''}"
    old_proceeding_reference_number: "${res.response.body[0].proceedingReferenceNumber || ''}"
    old_violations: "${res.response.body[0].violations || ''}"
    new_inspector_name: ${incoming.body.inspectorName}
    new_inspection_date: ${incoming.body.inspectionDate}
    new_inspection_type: ${incoming.body.inspectionType}
    new_company_name: ${incoming.body.companyName}
    new_company_reg_code: ${incoming.body.companyRegCode}
    new_vehicle_count: ${incoming.body.vehicleCount}
    new_total_drivers_count: ${incoming.body.totalDriversCount}
    new_controls_matrix: ${incoming.body.controlsMatrix}
    new_prescription_composed: ${incoming.body.prescriptionComposed}
    new_punished_person_id_code: ${incoming.body.punishedPersonIdCode}
    new_punished_person_first_name: ${incoming.body.punishedPersonFirstName}
    new_punished_person_last_name: ${incoming.body.punishedPersonLastName}
    new_proceeding_reference_number: ${incoming.body.proceedingReferenceNumber}
    new_violations: ${incoming.body.violations}
    inspector_name_changed: ${new_inspector_name != old_inspector_name}
    inspection_date_changed: ${new_inspection_date != old_inspection_date}
    inspection_type_changed: ${new_inspection_type != old_inspection_type}
    company_name_changed: ${new_company_name != old_company_name}
    company_reg_code_changed: ${new_company_reg_code != old_company_reg_code}
    vehicle_count_changed: ${new_vehicle_count != old_vehicle_count}
    total_drivers_count_changed: ${new_total_drivers_count != old_total_drivers_count}
    controls_matrix_changed: ${new_controls_matrix != old_controls_matrix}
    prescription_composed_changed: ${new_prescription_composed != old_prescription_composed}
    punished_person_id_code_changed: ${new_punished_person_id_code != old_punished_person_id_code}
    punished_person_first_name_changed: ${new_punished_person_first_name != old_punished_person_first_name}
    punished_person_last_name_changed: ${new_punished_person_last_name != old_punished_person_last_name}
    proceeding_reference_number_changed: ${new_proceeding_reference_number != old_proceeding_reference_number}
    violations_changed: ${new_violations != old_violations}
    changed_fields: "[]"
  next: checkInspectorName

checkInspectorName:
  switch:
    - condition: ${inspector_name_changed}
      next: addInspectorName
  next: checkInspectionDate

addInspectorName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_name\"]" : "[\"inspector_name\"]"}'
  next: checkInspectionDate

checkInspectionDate:
  switch:
    - condition: ${inspection_date_changed}
      next: addInspectionDate
  next: checkInspectionType

addInspectionDate:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspection_date\"]" : "[\"inspection_date\"]"}'
  next: checkInspectionType

checkInspectionType:
  switch:
    - condition: ${inspection_type_changed}
      next: addInspectionType
  next: checkCompanyName

addInspectionType:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspection_type\"]" : "[\"inspection_type\"]"}'
  next: checkCompanyName

checkCompanyName:
  switch:
    - condition: ${company_name_changed}
      next: addCompanyName
  next: checkCompanyRegCode

addCompanyName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"company_name\"]" : "[\"company_name\"]"}'
  next: checkCompanyRegCode

checkCompanyRegCode:
  switch:
    - condition: ${company_reg_code_changed}
      next: addCompanyRegCode
  next: checkVehicleCount

addCompanyRegCode:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"company_reg_code\"]" : "[\"company_reg_code\"]"}'
  next: checkVehicleCount

checkVehicleCount:
  switch:
    - condition: ${vehicle_count_changed}
      next: addVehicleCount
  next: checkTotalDriversCount

addVehicleCount:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"vehicle_count\"]" : "[\"vehicle_count\"]"}'
  next: checkTotalDriversCount

checkTotalDriversCount:
  switch:
    - condition: ${total_drivers_count_changed}
      next: addTotalDriversCount
  next: checkControlsMatrix

addTotalDriversCount:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"total_drivers_count\"]" : "[\"total_drivers_count\"]"}'
  next: checkControlsMatrix

checkControlsMatrix:
  switch:
    - condition: ${controls_matrix_changed}
      next: addControlsMatrix
  next: checkPrescriptionComposed

addControlsMatrix:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"controls_matrix\"]" : "[\"controls_matrix\"]"}'
  next: checkPrescriptionComposed

checkPrescriptionComposed:
  switch:
    - condition: ${prescription_composed_changed}
      next: addPrescriptionComposed
  next: checkPunishedPersonIdCode

addPrescriptionComposed:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"prescription_composed\"]" : "[\"prescription_composed\"]"}'
  next: checkPunishedPersonIdCode

checkPunishedPersonIdCode:
  switch:
    - condition: ${punished_person_id_code_changed}
      next: addPunishedPersonIdCode
  next: checkPunishedPersonFirstName

addPunishedPersonIdCode:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"punished_person_id_code\"]" : "[\"punished_person_id_code\"]"}'
  next: checkPunishedPersonFirstName

checkPunishedPersonFirstName:
  switch:
    - condition: ${punished_person_first_name_changed}
      next: addPunishedPersonFirstName
  next: checkPunishedPersonLastName

addPunishedPersonFirstName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"punished_person_first_name\"]" : "[\"punished_person_first_name\"]"}'
  next: checkPunishedPersonLastName

checkPunishedPersonLastName:
  switch:
    - condition: ${punished_person_last_name_changed}
      next: addPunishedPersonLastName
  next: checkProceedingReferenceNumber

addPunishedPersonLastName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"punished_person_last_name\"]" : "[\"punished_person_last_name\"]"}'
  next: checkProceedingReferenceNumber

checkProceedingReferenceNumber:
  switch:
    - condition: ${proceeding_reference_number_changed}
      next: addProceedingReferenceNumber
  next: checkViolations

addProceedingReferenceNumber:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"proceeding_reference_number\"]" : "[\"proceeding_reference_number\"]"}'
  next: checkViolations

checkViolations:
  switch:
    - condition: ${violations_changed}
      next: addViolations
  next: returnResult

addViolations:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"violations\"]" : "[\"violations\"]"}'
  next: returnResult

returnResult:
  return: "{\"changed_fields\":${changed_fields}}"
  next: end
