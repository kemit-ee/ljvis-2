declaration:
  version: "1.0"
  description: "Single source of truth for CGR request field validation (LJVIS2-138) — shared by the create (POST), revise (PUT) and inbound-request paths so the ERRU rules are defined once. Mirrors the erru.cgr_request CHECK constraints (chk_cgr_search_choice, chk_cgr_cgr_to_format). Returns '{\"valid\":true}' when all checks pass, otherwise the standard VALIDATION_ERROR shape ready to forward to the client as-is.\n\nSame Ruuter caveat as validate-ctud-request.yml: every condition reads incoming.body directly (never a pre-assigned variable) and every emptiness test is truthiness-first, because ScriptingHelper.filterEmptyOptional discards an assign that evaluates to '', turning it into undefined."
  namespace: service
  allowlist:
    body:
      - field: cgrTo
        type: string
      - field: originatingAuthority
        type: string
      - field: requestSource
        type: string
      - field: requestPurpose
        type: string
      - field: tmFirstName
        type: string
      - field: tmFamilyName
        type: string
      - field: tmDateOfBirth
        type: string
      - field: tmPlaceOfBirth
        type: string
      - field: certificateNumber
        type: string
      - field: certificateIssueDate
        type: string
      - field: certificateIssueCountry
        type: string

validate:
  switch:
    # ── Header and parties. cgrTo is OPTIONAL — empty means broadcast to all
    # member states (stored as ZZ); when given it must be a 2-letter code. ────
    - condition: ${!!(('' + (incoming.body.cgrTo || '')).trim()) && ('' + (incoming.body.cgrTo || '')).trim().length !== 2}
      next: returnCgrToInvalidError
    - condition: ${!(('' + (incoming.body.originatingAuthority || '')).trim())}
      next: returnOriginatingAuthorityRequiredError
    - condition: ${('' + (incoming.body.originatingAuthority || '')).trim().length > 50}
      next: returnOriginatingAuthorityMaxLengthError
    - condition: ${!(('' + (incoming.body.requestSource || '')).trim())}
      next: returnRequestSourceRequiredError
    - condition: ${!(('' + (incoming.body.requestPurpose || '')).trim())}
      next: returnRequestPurposeRequiredError
    # ── Searched transport manager: XSD choice — 7A (name+DOB) or 7B (certificate),
    # or both. Each block, if used at all, must be complete. ────────────────────
    - condition: "${(('' + (incoming.body.tmFirstName || '')).trim() || ('' + (incoming.body.tmFamilyName || '')).trim() || ('' + (incoming.body.tmDateOfBirth || '')).trim()) ? (!(('' + (incoming.body.tmFirstName || '')).trim()) || !(('' + (incoming.body.tmFamilyName || '')).trim()) || !(('' + (incoming.body.tmDateOfBirth || '')).trim())) : false}"
      next: returnNameBlockIncompleteError
    - condition: "${(('' + (incoming.body.certificateNumber || '')).trim() || ('' + (incoming.body.certificateIssueDate || '')).trim() || ('' + (incoming.body.certificateIssueCountry || '')).trim()) ? (!(('' + (incoming.body.certificateNumber || '')).trim()) || !(('' + (incoming.body.certificateIssueDate || '')).trim()) || !(('' + (incoming.body.certificateIssueCountry || '')).trim())) : false}"
      next: returnCertificateBlockIncompleteError
    - condition: "${!(('' + (incoming.body.tmFirstName || '')).trim() && ('' + (incoming.body.tmFamilyName || '')).trim() && ('' + (incoming.body.tmDateOfBirth || '')).trim()) && !(('' + (incoming.body.certificateNumber || '')).trim() && ('' + (incoming.body.certificateIssueDate || '')).trim() && ('' + (incoming.body.certificateIssueCountry || '')).trim())}"
      next: returnSearchChoiceRequiredError
    - condition: ${('' + (incoming.body.tmFirstName || '')).trim().length > 100}
      next: returnTmFirstNameMaxLengthError
    - condition: ${('' + (incoming.body.tmFamilyName || '')).trim().length > 100}
      next: returnTmFamilyNameMaxLengthError
    - condition: ${('' + (incoming.body.tmPlaceOfBirth || '')).trim().length > 200}
      next: returnTmPlaceOfBirthMaxLengthError
    - condition: ${('' + (incoming.body.certificateNumber || '')).trim().length > 100}
      next: returnCertificateNumberMaxLengthError
    - condition: ${!!(('' + (incoming.body.certificateIssueCountry || '')).trim()) && ('' + (incoming.body.certificateIssueCountry || '')).trim().length !== 2}
      next: returnCertificateIssueCountryInvalidError
  next: returnValid

returnValid:
  return: '{"valid":true}'
  next: end

returnCgrToInvalidError:
  return: '{"type":"VALIDATION_ERROR","field":"cgrTo","code":"invalid_country_code"}'
  next: end

returnOriginatingAuthorityRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"originatingAuthority","code":"required"}'
  next: end

returnOriginatingAuthorityMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"originatingAuthority","code":"max_length_exceeded"}'
  next: end

returnRequestSourceRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"requestSource","code":"required"}'
  next: end

returnRequestPurposeRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"requestPurpose","code":"required"}'
  next: end

returnNameBlockIncompleteError:
  return: '{"type":"VALIDATION_ERROR","field":"tmFirstName","code":"name_block_incomplete"}'
  next: end

returnCertificateBlockIncompleteError:
  return: '{"type":"VALIDATION_ERROR","field":"certificateNumber","code":"certificate_block_incomplete"}'
  next: end

returnSearchChoiceRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"tmFirstName","code":"search_choice_required"}'
  next: end

returnTmFirstNameMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"tmFirstName","code":"max_length_exceeded"}'
  next: end

returnTmFamilyNameMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"tmFamilyName","code":"max_length_exceeded"}'
  next: end

returnTmPlaceOfBirthMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"tmPlaceOfBirth","code":"max_length_exceeded"}'
  next: end

returnCertificateNumberMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"certificateNumber","code":"max_length_exceeded"}'
  next: end

returnCertificateIssueCountryInvalidError:
  return: '{"type":"VALIDATION_ERROR","field":"certificateIssueCountry","code":"invalid_country_code"}'
  next: end
