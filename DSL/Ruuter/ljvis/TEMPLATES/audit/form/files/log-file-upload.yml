declaration:

  version: "0.1"
  description: "Audit: file upload event. Generic — works for any form type."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_type
        type: string
      - field: form_number
        type: string
      - field: file_name
        type: string
      - field: s3_key
        type: string
      - field: actor_personal_code
        type: string
      - field: actor_name
        type: string

buildAudit:
  assign:
    description: "Laaditi üles fail ${incoming.body.file_name} vormi ${incoming.body.form_number} (${incoming.body.form_type})"
    log_content: "{\"formType\":\"${incoming.body.form_type}\",\"formNumber\":\"${incoming.body.form_number}\",\"fileName\":\"${incoming.body.file_name}\",\"s3Key\":\"${incoming.body.s3_key}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.file.upload"
    event_category: "control_form_management"
    actor_name: ${incoming.body.actor_name}
    actor_personal_code: ${incoming.body.actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
