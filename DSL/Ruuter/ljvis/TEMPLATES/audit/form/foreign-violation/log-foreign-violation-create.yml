declaration:
  call: declare
  version: 0.1
  description: "Audit: foreign violation form create event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_number
        type: string

buildAudit:
  assign:
    description: "Loodi välisriigi rikkumise vorm ${incoming.body.form_number}"
    log_content: "{\"formNumber\":\"${incoming.body.form_number}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.foreign_violation.create"
    event_category: "control_form_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
