declaration:

  version: "1.0"
  description: "Audit: foreign violation locked form update event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_number
        type: string
      - field: changed_fields
        type: string

buildAudit:
  assign:
    changed_fields_json: ${JSON.stringify(incoming.body.changed_fields)}
    description: "Muudeti vormi ${incoming.body.form_number}, muudetud väljad: ${changed_fields_json}"
    log_content: "{\"formNumber\":\"${incoming.body.form_number}\",\"changedFields\":${changed_fields_json}}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.edit_locked"
    event_category: "control_form_lifecycle"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
