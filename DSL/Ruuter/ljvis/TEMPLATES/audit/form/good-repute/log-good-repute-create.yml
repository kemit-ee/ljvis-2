declaration:

  version: "1.0"
  description: "Audit: good repute form create event"
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: good_repute_form_key
        type: number
      - field: personal_code
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "Loodi hea maine vorm, vormi võti: ${incoming.body.good_repute_form_key}, veokorraldusjuht ${incoming.body.personal_code}"
    log_content: "{\"goodReputeFormKey\":\"${incoming.body.good_repute_form_key}\",\"personalCode\":\"${incoming.body.personal_code}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.good_repute_form.create"
    event_category: "control_form"
    actor_name: ${incoming.body.actor_name}
    actor_personal_code: ${incoming.body.actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
