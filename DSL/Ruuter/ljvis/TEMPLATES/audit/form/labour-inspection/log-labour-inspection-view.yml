declaration:
  call: declare
  version: 0.1
  description: "Audit: labour inspection form (labour_inspection_form) view event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_number
        type: string

buildAudit:
  assign:
    description: "Vaadati Tööinspektsiooni kontrollakti ${incoming.body.form_number}"
    log_content: "{\"formNumber\":\"${incoming.body.form_number}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.labour_inspection.view"
    event_category: "control_form_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
