declaration:
  call: declare
  version: 0.1
  description: "Audit: labour inspection form (labour_inspection_form) create event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_number
        type: string
      - field: version
        type: string

buildAudit:
  assign:
    form_number_display: "${incoming.body.form_number}/${incoming.body.version || 1}"
    description: "Loodi Tööinspektsiooni kontrollakt ${form_number_display}"
    log_content: "{\"formNumber\":\"${form_number_display}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.labour_inspection.create"
    event_category: "control_form_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
