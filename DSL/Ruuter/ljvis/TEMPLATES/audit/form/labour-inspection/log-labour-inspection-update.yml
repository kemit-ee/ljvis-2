declaration:
  call: declare
  version: 0.1
  description: "Audit: labour inspection form (labour_inspection_form) update event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: form_number
        type: string
      - field: version
        type: string
      - field: changed_fields
        type: string

buildAudit:
  assign:
    form_number_display: "${incoming.body.form_number}/${incoming.body.version || 1}"
    changed_fields_json: ${JSON.stringify(incoming.body.changed_fields)}
    description: "Muudeti Tööinspektsiooni kontrollakti ${form_number_display}, muudetud väljad: ${changed_fields_json}"
    log_content: "{\"formNumber\":\"${form_number_display}\",\"changedFields\":${changed_fields_json}}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.labour_inspection.update"
    event_category: "control_form_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
