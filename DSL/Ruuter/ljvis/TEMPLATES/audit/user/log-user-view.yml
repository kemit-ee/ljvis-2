declaration:

  version: "1.0"
  description: "Audit: single user view event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: first_name
        type: string
      - field: last_name
        type: string
      - field: personal_code
        type: string
      - field: scope
        type: string
      - field: organisation_id
        type: string

buildAudit:
  assign:
    description: "Kasutaja vaatamine: ${incoming.body.first_name} ${incoming.body.last_name} (${incoming.body.personal_code})"
    log_content: "{\"targetPersonalCode\":\"${incoming.body.personal_code}\",\"targetName\":\"${incoming.body.first_name} ${incoming.body.last_name}\",\"scope\":\"${incoming.body.scope}\",\"organisationId\":${incoming.body.organisation_id}}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "user.view"
    event_category: "user_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
