declaration:

  version: "1.0"
  description: "Audit: classifier update event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: classifier_id
        type: string
      - field: classifier_code
        type: string
      - field: changed_fields
        type: string

buildAudit:
  assign:
    description: "Klassifikaator '${incoming.body.classifier_code}' (ID ${incoming.body.classifier_id}), muudetud väljad: ${incoming.body.changed_fields}"
    log_content: "{\"classifierId\":${incoming.body.classifier_id},\"classifierCode\":\"${incoming.body.classifier_code}\",\"changedFields\":${incoming.body.changed_fields}}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "classifier.update"
    event_category: "classifier_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
