declaration:

  version: "1.0"
  description: "Write one audit event to the database. Actor data is passed in by the caller (already sourced from JWT). Generates a ULID event_id before the INSERT. Extracts trace_id and span_id from the incoming traceparent header. Derives the actor's organisation_id from actor_personal_code (for the audit.read.local scope) — NULL for system actors."
  namespace: service
  allowlist:
    body:
      - field: event_type
        type: string
      - field: event_category
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string
      - field: description
        type: string
      - field: log_content
        type: string

generateEventId:
  assign:
    event_id: "${new Date().getTime().toString(36).toUpperCase().padStart(10,'0') + Math.random().toString(36).substring(2,18).toUpperCase().padStart(16,'0')}"
    traceparent: "${incoming.headers.traceparent || ''}"
    trace_id: "${(incoming.headers.traceparent || '').split('-')[1] || ''}"
    span_id: "${(incoming.headers.traceparent || '').split('-')[2] || ''}"
    organisation_id: ""
  next: resolveOrganisation

resolveOrganisation:
  switch:
    - condition: ${(incoming.body.actor_personal_code || '') === ''}
      next: logToResql
  next: lookupOrganisation

lookupOrganisation:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_organisation_by_personal_code"
    headers:
      type: json
    body:
      personal_code: ${incoming.body.actor_personal_code}
  result: orgRes
  next: assignOrganisation

assignOrganisation:
  assign:
    organisation_id: "${(Array.isArray(orgRes.response.body) && orgRes.response.body[0] && orgRes.response.body[0].organisation_id != null) ? String(orgRes.response.body[0].organisation_id) : ''}"
  next: logToResql

logToResql:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_id: ${event_id}
      event_type: ${incoming.body.event_type}
      event_category: ${incoming.body.event_category}
      actor_name: "${incoming.body.actor_name || ''}"
      actor_personal_code: "${incoming.body.actor_personal_code || ''}"
      description: ${incoming.body.description}
      log_content: ${incoming.body.log_content}
      organisation_id: ${organisation_id}
      created_by: "${incoming.body.actor_name || ''}"
      trace_id: ${trace_id}
      span_id: ${span_id}
  result: res
  next: end
