declaration:
  call: declare
  version: 0.1
  description: "Audit: CTUD request sent to ERRU (LJVIS2-144). Logged on every send attempt, successful or not. The description carries the request identifier, the target country, the reached status (responded or error), the target country's response code and the searched undertaking name and licence number, which makes it traceable whose undertaking data was requested. response_code is empty when the send failed. CTUD carries no personal data, so no personal code of a searched subject is logged."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: ctud_to
        type: string
      - field: result_status
        type: string
      - field: response_code
        type: string
      - field: transport_undertaking_name
        type: string
      - field: community_licence_number
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "CTUD päringu saatmine: päringu tunnus ${incoming.body.business_case_id || '-'}, sihtriik ${incoming.body.ctud_to || '-'}, tulemus ${incoming.body.result_status || '-'}, vastuse kood ${incoming.body.response_code || '-'}, otsitud veoettevõtja ${incoming.body.transport_undertaking_name || '-'}, tegevusloa number ${incoming.body.community_licence_number || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['ctudTo', incoming.body.ctud_to || null], ['resultStatus', incoming.body.result_status || null], ['responseCode', incoming.body.response_code || null], ['transportUndertakingName', incoming.body.transport_undertaking_name || null], ['communityLicenceNumber', incoming.body.community_licence_number || null]]))}"
  next: writeAudit

writeAudit:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "ctud.request.send"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
