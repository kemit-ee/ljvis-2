declaration:
  version: "1.0"
  description: "Audit: NCR case list viewed (LJVIS2-65). Logged on EVERY list load because the list
    exposes transport undertaking and handler names (personal-data footprint). The description
    carries the applied filters (including the handler personal code), the number of rows shown and
    the page number. Actor is supplied by the caller, which has already resolved it via TIM userinfo."
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: filters
        type: string
      - field: result_count
        type: string
      - field: page
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "NCR teadete loendi vaatamine: filtrid ${incoming.body.filters || '-'}, kuvatud juhtumeid ${incoming.body.result_count || '0'}, lehekülg ${incoming.body.page || '1'}"
    log_content: "${JSON.stringify(Object.fromEntries([['filters', incoming.body.filters || null], ['resultCount', incoming.body.result_count || null], ['page', incoming.body.page || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "ncr.list.view"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
