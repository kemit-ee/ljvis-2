declaration:
  version: "1.0"
  description: "Audit: single RSI message viewed (LJVIS2-147). Logged on EVERY open of the message, because the view may show the driver's personal data (name, licence number). The description carries the message identifier, the vehicle registration number, the driver name (if present) and the viewer's personal code."
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: vehicle_registration_number
        type: string
      - field: driver_first_name
        type: string
      - field: driver_family_name
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "RSI tehnokontrolli teate vaatamine: teade ${incoming.body.business_case_id || '-'}, sõiduk ${incoming.body.vehicle_registration_number || '-'}, juht ${((incoming.body.driver_first_name || '') + ' ' + (incoming.body.driver_family_name || '')).trim() || '-'}, isikukood ${incoming.body.actor_personal_code || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['vehicleRegistrationNumber', incoming.body.vehicle_registration_number || null], ['driverFirstName', incoming.body.driver_first_name || null], ['driverFamilyName', incoming.body.driver_family_name || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "rsi.query.view"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
