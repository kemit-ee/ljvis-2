declaration:
  version: "1.0"
  description: >-
    WebSocket endpoint teavituste reaalajas uuenduste jaoks.
    Frontend ühendab: ws://<host>/ljvis/notifications/connect (nginx `/api/` proxy).

    Iga sissetulev frame (frontend saadab {"type":"hello"} avamisel ja
    {"type":"ping"} iga 30 s) autendib ühenduse uuesti templates/check-user-authority
    kaudu (TIM jwt/userinfo → sessiooni aegumise/tühistamise kontroll). Kehtiva
    sessiooni korral vastab {"type":"ack"}, muidu {"type":"unauthorized"} (frontend
    lõpetab seepeale reconnect'i).

    Iga autenditud frame märgistab ühenduse `ws_tag`-iga: `perms` sild sisaldab
    kasutaja õigusi komadega piiritletult (`,rsi.read,notification.admin,`).

    Push: Ruuter.internal notification/create.yml kutsub peale teavituse loomist
    POST /v1/ws-broadcast/send, mis teeb ws_send broadcast_where tag=perms
    contains=",<required_permission>," — sisutu {"type":"notification_update"}
    signaal AINULT nendele ühendustele, kellel on teavituse nõutav õigus. WS-üle
    EI edastata kasutajaandmeid; iga frontend teeb oma autenditud
    GET /v1/notifications/unread-count päringu.
  namespace: notification

route:
  template: "templates/check-user-authority"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  result: u
  next: checkAuth

checkAuth:
  switch:
    - condition: ${u !== "false" && u != null && u.personalcode != null}
      next: stampPerms
  next: denyAuth

# Märgista ühendus kasutaja õigustega. Eraldajad (`,…,`) võimaldavad
# broadcast_where `contains: ",<perm>,"` täpset token-sobitust.
stampPerms:
  ws_tag:
    set:
      perms: "${',' + (u.permissions || []).join(',') + ','}"
  next: ackOk

ackOk:
  ws_send:
    payload:
      type: "ack"
      connection_id: "${incoming.connection_id}"
  next: end

denyAuth:
  ws_send:
    payload:
      type: "unauthorized"
  next: end
