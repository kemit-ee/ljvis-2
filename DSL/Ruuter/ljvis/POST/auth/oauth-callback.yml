declaration:
  version: "1.0"
  description: >
    OAuth2 callback handler. Receives the authorization code from the
    frontend AuthCallback component, exchanges it via TIM's session-based
    callback, then generates a JWT cookie for the browser.
    This follows TIM-on-Rust's API-first design: TIM returns JSON
    (session_id + user_profile), and this DSL converts that into a
    browser-compatible Set-Cookie response.
  namespace: service
  allowlist:
    body:
      - field: code
        type: string
        description: "Authorization code from IdP"
      - field: state
        type: string
        description: "OAuth2 state parameter"
      - field: intent
        type: string
        description: "Login intent: 'officer' or 'citizen'"

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.code == null || incoming.body.state == null}
      next: missing_params
  next: call_tim_callback

# Step 1: Exchange code via TIM's callback endpoint.
# TIM validates state (single-use), exchanges code for tokens at the
# IdP's token_endpoint, verifies the ID token (signature, iss, aud,
# exp, nonce), creates a session, and returns JSON with session_id
# and user_profile.
call_tim_callback:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/auth/callback/tara"
    query:
      code: ${incoming.body.code}
      state: ${incoming.body.state}
  result: callback_result
  next: check_callback

check_callback:
  switch:
    - condition: ${200 <= callback_result.response.status && callback_result.response.status < 300}
      next: extract_raw_user_id
  next: callback_error

# Step 2a: Strip the "EE" country prefix that TARA adds to the sub claim.
# TARA returns user_id as "EE60001019906" (OIDC sub), but our DB stores
# personal codes as plain numeric strings ("60001019906").
# sub is kept as-is (OIDC standard); personalCode and authenticatedAs
# get the stripped value so the DB lookup in check-user-authority succeeds.
# NOTE: two separate assign steps — Ruuter evaluates each step's assignments
# independently, so raw_user_id must be resolved before personal_code_clean
# can reference it.
extract_raw_user_id:
  assign:
    raw_user_id: ${callback_result.response.body.user_profile.user_id}
  next: normalize_personal_code

normalize_personal_code:
  assign:
    personal_code_clean: "${raw_user_id.startsWith('EE') ? raw_user_id.substring(2) : raw_user_id}"
  next: generate_jwt

# Step 2b: Generate a JWT with the user's profile.
# TIM's callback returns user_profile with user_id, first_name, etc.
# We pass these as JWT claims, matching the shape expected by
# check-user-authority and /jwt/userinfo.
generate_jwt:
  call: http.post
  args:
    url: "[#LJVIS_TIM]/jwt/custom/generate"
    headers:
      type: json
      X-TIM-Admin-Token: "[#TIM_ADMIN_TOKEN]"
    body:
      content:
        sub: ${raw_user_id}
        personalCode: ${personal_code_clean}
        authenticatedAs: ${personal_code_clean}
        authMethod: "TARA"
      expirationInMinutes: 480
      JWTName: "customJwtCookie"
  result: jwt_result
  next: check_jwt

check_jwt:
  switch:
    - condition: ${200 <= jwt_result.response.status && jwt_result.response.status < 300}
      next: lookup_user_for_audit
  next: jwt_error

# Step 3: Look up LJVIS2 user account to stamp actor_user_account_id in the audit event.
# If personal_code_clean does not match an active user (e.g. citizen without LJVIS2 account),
# the RESQL returns no rows and no audit event is written — satisfying the constraint that
# citizen sessions must not produce a LJVIS2 official's last-login record.
lookup_user_for_audit:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_organisation_by_personal_code"
    headers:
      type: json
    body:
      personal_code: ${personal_code_clean}
  result: audit_user_res
  next: check_user_for_audit

check_user_for_audit:
  switch:
    - condition: ${incoming.body.intent === 'officer' && Array.isArray(audit_user_res.response.body) && audit_user_res.response.body.length > 0 && audit_user_res.response.body[0].userAccountId != null}
      next: log_login_success
  next: return_token

# Step 4: Write auth.login.success audit event for LJVIS2 officials only.
# actor_personal_code is intentionally omitted — personal codes must not be stored as plaintext.
# actor_user_account_id links the event to the exact user_account snapshot row.
# NOTE: uses ruuter-internal (POST /auth/log-login) instead of the audit template because
# at this point the JWT cookie has not been set yet — the audit guard would reject the call.
log_login_success:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/auth/log-login"
    headers:
      type: json
    body:
      actor_name: "${callback_result.response.body.user_profile.first_name} ${callback_result.response.body.user_profile.last_name}"
      actor_user_account_id: "${String(audit_user_res.response.body[0].userAccountId)}"
      organisation_id: "${String(audit_user_res.response.body[0].organisationId ?? '')}"
  result: audit_res
  next: return_token

# Step 5: Return OK with Set-Cookie header.
# The JWT is set as an HttpOnly cookie so the browser sends it
# automatically on subsequent requests.
return_token:
  headers:
    Set-Cookie: "customJwtCookie=${jwt_result.response.body.token}; Path=/; HttpOnly; SameSite=Lax; Max-Age=28800"
  return: "ok"
  next: end

callback_error:
  status: 401
  return: "Authentication failed"
  next: end

jwt_error:
  status: 500
  return: "JWT generation failed"
  next: end

missing_params:
  status: 400
  return: "code and state are required"
  next: end
