declaration:
  call: declare
  version: 0.1
  description: "Create a new user group with optional organisations and permissions"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: name
        type: string
      - field: organisationIds
        type: array
        description: "Array of organisation UUIDs"
      - field: permissionIds
        type: array
        description: "Array of permission UUIDs"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_group_edit_admin') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    name: "${incoming.body.name}"
    organisation_ids: "${(incoming.body.organisationIds ?? []).join(',')}"
    permission_ids: "${(incoming.body.permissionIds ?? []).join(',')}"
  next: validateRequired

validateRequired:
  switch:
    - condition: ${name == null || name == ''}
      next: return_validation_error
  next: validateNameLength

validateNameLength:
  switch:
    - condition: ${name.length > 50}
      next: return_validation_error
  next: createGroup

createGroup:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/insert_user_group"
    headers:
      type: json
    body:
      name: ${name}
  result: groupRes

extractGroupId:
  assign:
    group_id: "${groupRes.response.body[0].id}"

checkOrganisations:
  switch:
    - condition: "${organisation_ids == ''}"
      next: return_validation_error
    - condition: "${organisation_ids != ''}"
      next: assignOrganisations
  next: checkPermissions

assignOrganisations:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/replace_organisations"
    headers:
      type: json
    body:
      user_group_id: ${group_id}
      organisation_ids: ${organisation_ids}
  result: orgsRes
  next: checkPermissions

checkPermissions:
  switch:
    - condition: "${permission_ids == ''}"
      next: returnSuccess
  next: assignPermissions

assignPermissions:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/replace_permissions"
    headers:
      type: json
    body:
      user_group_id: ${group_id}
      permission_ids: ${permission_ids}
  result: permsRes

returnSuccess:
  return: ${groupRes.response.body}
  next: end

return_validation_error:
  status: 422
  return: "validation failed"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
