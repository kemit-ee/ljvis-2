declaration:
  call: declare
  version: 0.1
  description: "Add new users to user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group UUID"
      - field: userIds
        type: array
        description: "Array of user UUIDs"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('user_group.add_user') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    user_ids: "${(incoming.body.userIds ?? []).join(',')}"
    created_by: "${auth_user.personalcode}"
  next: checkUserIds

checkUserIds:
  switch:
    - condition: "${user_ids == ''}"
      next: returnSuccess
  next: addUsers

addUsers:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${user_ids}
      status: "active"
      created_by: ${created_by}
  result: addRes
  next: rebuildLatest

rebuildLatest:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/rebuild_user_account_latest"
    headers:
      type: json
    body:
      user_account_ids: ${user_ids}
      created_by: ${created_by}
  result: latestRes
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
