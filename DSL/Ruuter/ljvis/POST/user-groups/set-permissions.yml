declaration:
  call: declare
  version: 0.1
  description: "Replace all permission links for a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: addedPermissionIds
        type: array
        description: "Array of added permission IDs"
      - field: removedPermissionIds
        type: array
        description: "Array of removed permission IDs"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.indexOf('user_group.create') >= 0 || auth_user.permissions.indexOf('user_group.update') >= 0)}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    added_permission_ids: "${(incoming.body.addedPermissionIds ?? []).join(',')}"
    removed_permission_ids: "${(incoming.body.removedPermissionIds ?? []).join(',')}"
    created_by: "${auth_user.personalcode}"
  next: checkRemovedPerms

checkRemovedPerms:
  switch:
    - condition: "${removed_permission_ids == ''}"
      next: checkAddedPerms
  next: removePerms

removePerms:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_permissions"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      permission_ids: ${removed_permission_ids}
      status: "removed"
      created_by: ${created_by}
  result: removeRes
  next: checkAddedPerms

checkAddedPerms:
  switch:
    - condition: "${added_permission_ids == ''}"
      next: rebuildLatest
  next: insertPerms

insertPerms:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_permissions"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      permission_ids: ${added_permission_ids}
      status: "active"
      created_by: ${created_by}
  result: insertRes
  next: rebuildLatest

rebuildLatest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/rebuild_user_group_latest"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      created_by: ${created_by}
  result: latestRes
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
