declaration:
  call: declare
  version: 0.1
  description: "Update user status"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: id
        type: string
      - field: status
        type: string

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "${incoming.body.status}"

updateStatus:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/update_user_status"
    headers:
      type: json
    body:
      id: ${id}
      status: ${status}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
