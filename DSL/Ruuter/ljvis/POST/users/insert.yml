declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: personalCode
        type: string
      - field: organisationId
        type: string
      - field: structuralUnitName
        type: string
      - field: jobTitleName
        type: string
      - field: email
        type: string
      - field: phone
        type: string
      - field: accessStart
        type: string
      - field: accessEnd
        type: string

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('user.edit.admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('user.edit.local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    first_name: "${incoming.body.firstName}"
    last_name: "${incoming.body.lastName}"
    personal_code: "${incoming.body.personalCode}"
    organisation_id: "${incoming.body.organisationId}"
    structural_unit: "${incoming.body.structuralUnitName}"
    job_title: "${incoming.body.jobTitleName}"
    email: "${incoming.body.email}"
    phone: "${incoming.body.phone ?? ''}"
    access_start: "${incoming.body.accessStart}"
    access_end: "${incoming.body.accessEnd ?? ''}"
    created_by: "${auth_user.personalcode}"
  next: validateRequired

validateRequired:
  switch:
    - condition: ${first_name == null || first_name == ''}
      next: return_validation_error
    - condition: ${last_name == null || last_name == ''}
      next: return_validation_error
    - condition: ${personal_code == null || personal_code == ''}
      next: return_validation_error
    - condition: ${organisation_id == null || organisation_id == ''}
      next: return_validation_error
    - condition: ${structural_unit == null || structural_unit == ''}
      next: return_validation_error
    - condition: ${job_title == null || job_title == ''}
      next: return_validation_error
    - condition: ${email == null || email == ''}
      next: return_validation_error
    - condition: ${access_start == null || access_start == ''}
      next: return_validation_error
  next: validatePersonalCodeLength

validatePersonalCodeLength:
  switch:
    - condition: ${personal_code.length != 11}
      next: return_validation_error
  next: validateEmail

validateEmail:
  switch:
    - condition: ${email.indexOf('@') < 1}
      next: return_validation_error
    - condition: ${email.indexOf('.', email.indexOf('@')) < (email.indexOf('@') + 2)}
      next: return_validation_error
    - condition: ${email.lastIndexOf('.') >= (email.length - 2)}
      next: return_validation_error
  next: createUser

checkPersonalCodeConflict:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user/check_personal_code_conflict"
    query:
      personal_code: ${personal_code}
      id: ""
  result: conflictRes
  next: checkConflictResult

checkConflictResult:
  switch:
    - condition: ${conflictRes.response.body.length > 0}
      next: return_conflict
  next: createUser

createUser:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/insert_user_account"
    headers:
      type: json
    body:
      personal_code: ${personal_code}
      created_by: ${created_by}
  result: userRes
  next: createUserDataState

createUserDataState:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/insert_user_account_data_state"
    headers:
      type: json
    body:
      user_account_id: ${userRes.response.body[0].id}
      first_name: ${first_name}
      last_name: ${last_name}
      organisation_id: ${organisation_id}
      email: ${email}
      phone: ${phone}
      structural_unit: ${structural_unit}
      job_title: ${job_title}
      access_start: ${access_start}
      access_end: ${access_end}
      created_by: ${created_by}
  result: dataStateRes
  next: createUserState

createUserState:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/insert_user_account_state"
    headers:
      type: json
    body:
      user_account_id: ${userRes.response.body[0].id}
      status: "active"
      created_by: ${created_by}
  result: stateRes
  next: rebuildLatest

rebuildLatest:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/rebuild_user_account_latest"
    headers:
      type: json
    body:
      user_account_id: ${userRes.response.body[0].id}
      created_by: ${created_by}
  result: latestRes
  next: returnSuccess

returnSuccess:
  return: ${userRes.response.body}
  next: end

return_validation_error:
  status: 422
  return: "validation failed"
  next: end

return_conflict:
  status: 409
  return: "personal code already exists"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
