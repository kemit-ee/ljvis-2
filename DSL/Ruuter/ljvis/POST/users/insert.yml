declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: personalCode
        type: string
      - field: organisationId
        type: string
      - field: email
        type: string
      - field: phone
        type: string
      - field: accessStart
        type: string
      - field: accessEnd
        type: string

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    first_name: "${incoming.body.firstName}"
    last_name: "${incoming.body.lastName}"
    personal_code: "${incoming.body.personalCode}"
    organisation_id: "${incoming.body.organisationId}"
    email: "${incoming.body.email}"
    phone: "${incoming.body.phone ?? ''}"
    access_start: "${incoming.body.accessStart}"
    access_end: "${incoming.body.accessEnd ?? ''}"
  next: validateRequired

validateRequired:
  switch:
    - condition: ${first_name == null || first_name == ''}
      next: return_validation_error
    - condition: ${last_name == null || last_name == ''}
      next: return_validation_error
    - condition: ${personal_code == null || personal_code == ''}
      next: return_validation_error
    - condition: ${organisation_id == null || organisation_id == ''}
      next: return_validation_error
    - condition: ${email == null || email == ''}
      next: return_validation_error
    - condition: ${access_start == null || access_start == ''}
      next: return_validation_error
  next: validatePersonalCodeLength

validatePersonalCodeLength:
  switch:
    - condition: ${personal_code.length() != 11}
      next: return_validation_error
  next: validateEmail

validateEmail:
  switch:
    - condition: ${!email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')}
      next: return_validation_error
  next: validatePhone

validatePhone:
  switch:
    - condition: ${phone != '' && !phone.matches('^[+\\d\\s]*$')}
      next: return_validation_error
  next: validateDates

validateDates:
  switch:
    - condition: ${access_end != '' && access_end <= access_start}
      next: return_validation_error
  next: checkPersonalCodeConflict

checkPersonalCodeConflict:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user/check_personal_code_conflict"
    query:
      personal_code: ${personal_code}
      id: ""
  result: conflictRes
  next: checkConflictResult

checkConflictResult:
  switch:
    - condition: ${conflictRes.response.body.length > 0}
      next: return_conflict
  next: createUser

createUser:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/insert_user"
    headers:
      type: json
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      personal_code: ${personal_code}
      organisation_id: ${organisation_id}
      email: ${email}
      phone: ${phone}
      access_start: ${access_start}
      access_end: ${access_end}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end

return_validation_error:
  status: 422
  return: "validation failed"
  next: end

return_conflict:
  status: 409
  return: "personal code already exists"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
