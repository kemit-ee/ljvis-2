declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: personalCode
        type: string
      - field: organisationId
        type: string
      - field: structuralUnitId
        type: string
      - field: jobTitleName
        type: string
      - field: email
        type: string
      - field: phone
        type: string
      - field: accessStart
        type: string
      - field: accessEnd
        type: string

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_edit_local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    first_name: "${incoming.body.firstName}"
    last_name: "${incoming.body.lastName}"
    personal_code: "${incoming.body.personalCode}"
    organisation_id: "${incoming.body.organisationId}"
    structural_unit_id: "${incoming.body.structuralUnitId}"
    job_title_name: "${incoming.body.jobTitleName}"
    email: "${incoming.body.email}"
    phone: "${incoming.body.phone ?? ''}"
    access_start: "${incoming.body.accessStart}"
    access_end: "${incoming.body.accessEnd ?? ''}"
  next: validateUser

validateUser:
  template: "[#LJVIS_PROJECT_LAYER]/user/validate-user-fields"
  requestType: templates
  body:
    first_name: ${first_name}
    last_name: ${last_name}
    personal_code: ${personal_code}
    organisation_id: ${organisation_id}
    structural_unit_id: ${structural_unit_id}
    job_title_name: ${job_title_name}
    email: ${email}
    access_start: ${access_start}
  result: field_error
  next: checkUser

checkUser:
  switch:
    - condition: ${field_error != 'valid'}
      next: propagate_error
  next: checkPersonalCodeConflict

checkPersonalCodeConflict:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user/check_personal_code_conflict"
    query:
      personal_code: ${personal_code}
      id: ""
  result: conflictRes
  next: checkConflictResult

checkConflictResult:
  switch:
    - condition: ${conflictRes.response.body.length > 0}
      next: return_conflict
  next: createUser

createUser:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/insert_user"
    headers:
      type: json
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      personal_code: ${personal_code}
      organisation_id: ${organisation_id}
      structural_unit_id: ${structural_unit_id}
      job_title_name: ${job_title_name}
      email: ${email}
      phone: ${phone}
      access_start: ${access_start}
      access_end: ${access_end}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end

propagate_error:
  status: 422
  return: ${field_error}
  next: end

return_conflict:
  status: 409
  return: "personal code already exists"
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
