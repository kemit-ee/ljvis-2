declaration:

  version: "1.0"
  description: >-
    Query Rahvastikuregister (RR) for person data by isikukood.
    RR's dde/v1/isikud service is REST-native X-Road (not SOAP). It is routed
    through the XTR component's REST passthrough lane (kind: rest, XTR >=
    0.3.0-rc), which performs a verbatim byte passthrough to the X-Road Security
    Server per the X-Road Message Protocol for REST v1.0.4 — one X-Road egress
    point for cert/mTLS/logging, consistent with arireg/mtr/etoimik/liiklusregister.
    XTR REST DSL: DSL/xtr/rr/isikud.yml. XTR sets the X-Road-Client header itself
    (from xtr.yaml client_data) and forwards X-Road-UserId + RR-Request-Reason
    and the body unchanged.
    Service identifier: GOV/70008440/rr/domesticDataExchange/v1/isikud (member
    70008440 = Siseministeeriumi infotehnoloogia- ja arenduskeskus / SMIT, which
    hosts RR's test subsystems on both ee-dev and ee-test).
    Returns firstName/lastName/citizenship/dateOfBirth/personStatus, or null data
    if no match. See LJVIS2-54.
  namespace: xroad
  allowlist:
    body:
      - field: personalCode
        type: string

validateInput:
  switch:
    - condition: "${incoming.body.personalCode == null || !(/^[1-6][0-9]{10}$/.test(incoming.body.personalCode.trim()))}"
      next: returnInvalidPersonalCode
  next: get_user_context

# X-Road-UserId (the official who initiated the query) is a mandatory header on
# every RR REST call, so we need the authenticated LJVIS user's personal code.
get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: checkUserContext

# Ilma isikukoodita ametnikuta ei saa X-Road-UserId päist täita (RR nõuab seda
# igal kutsel), seega katkestame enne XTR-i pöördumist.
checkUserContext:
  switch:
    - condition: "${auth_user == null || auth_user.personalcode == null || String(auth_user.personalcode).trim() == ''}"
      next: returnNoUserContext
  next: assignParams

assignParams:
  assign:
    personal_code: "${incoming.body.personalCode.trim()}"
    x_road_user_id: "${'EE' + (auth_user.personalcode || '')}"
    start_time: "${new Date().getTime()}"
  next: callRr

# Kutse läheb XTR-i REST passthrough lane'i (DSL/xtr/rr/isikud.yml), mis teeb
# X-Road Message Protocol for REST v1.0.4 järgi verbatim passthrough'i X-tee
# turvaserverisse. XTR seab X-Road-Client päise ise (xtr.yaml client_data-st) ja
# edastab X-Road-UserId + RR-Request-Reason + keha muutmata. X-tees ei ole API
# võtit ega bearer-tokenit — autoriseerimine käib turvaserveri mTLS + ACL kaudu.
callRr:
  call: http.post
  args:
    url: "[#LJVIS_XTR]/rr/isikud"
    headers:
      type: json
      X-Road-UserId: ${x_road_user_id}
      # RR-Request-Reason on RR domesticDataExchange nõutud vabatekstiline
      # päring-põhjus, mis salvestub RR auditi- ja andmejälgija kirjesse.
      RR-Request-Reason: "Järelevalve käigus isiku andmete päring Liiklusjärelevalve infosüsteemi poolt"
      # X-Road-Client eemaldatud — XTR seab selle ise xtr.yaml client_data-st.
    body:
      isikukoodid:
        - ${personal_code}
      andmevaljad:
        isikuandmed:
          - Isikukood
          - Eesnimi
          - Perekonnanimi
          - PohiKodakondsus
          - SynniKuupaev
          - IsikuStaatus
  result: rrResponse
  next: checkRrStatus

checkRrStatus:
  switch:
    - condition: "${rrResponse.response.status < 200 || rrResponse.response.status >= 300}"
      next: logFailure
  next: logSuccess

logSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "rr.dde.v1"
      request_xml: "${'personalCode=' + personal_code}"
      response_xml: "${JSON.stringify({ received: (rrResponse.response.body) != null, count: (Array.isArray(rrResponse.response.body) ? (rrResponse.response.body).length : null) })}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: "${personal_code}"
      source_type: ""
      source_record_id: ""
  result: logResult
  next: logAjUsage

# Andmejälgija (AJ) — IKS § 19: logi et RR-st päriti isiku andmeid
logAjUsage:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/aj/log_usage"
    headers:
      type: json
    body:
      user_code: "${personal_code}"
      action: "Järelevalve käigus isiku andmete päring rahvastikuregistrist"
      receiver_code: "70001231"
      receiver_name: "Liiklusjärelevalve infosüsteem (LJVIS2)"
      receiver_system: "ljvis2"
  result: ajLogResult
  next: mapResponse

# RR returns a JSON array of Isikuandmed (max 20, one per requested isikukood);
# an empty array means "not found" — that is a valid, non-error result (HTTP 200).
mapResponse:
  assign:
    person: "${(rrResponse.response.body && rrResponse.response.body.length > 0) ? rrResponse.response.body[0] : null}"
  next: checkPersonFound

checkPersonFound:
  switch:
    - condition: "${person == null}"
      next: returnEmptyResult
  next: buildFoundResult

# eesnimi/perekonnanimi are plain strings; pohiKodakondsus/isikuStaatus are
# RR "Kodifikaator" objects ({kood, elemendiKood, nimetus}) — elemendiKood is the
# lowest-level classifier element code (e.g. country ISO numeric-3, status letter),
# nimetus is the Estonian display name. synniKuupaev arrives as yyyy-MM-dd and is
# reformatted to pp.kk.aaaa per the task spec.
buildFoundResult:
  assign:
    person_result: >-
      ${JSON.stringify({
        data: {
          personalCode: person.isikukood || personal_code,
          firstName: person.eesnimi || '',
          lastName: person.perekonnanimi || '',
          citizenshipCode: (person.pohiKodakondsus && person.pohiKodakondsus.riik && person.pohiKodakondsus.riik.elemendiKood) || '',
          citizenshipName: (person.pohiKodakondsus && person.pohiKodakondsus.riik && person.pohiKodakondsus.riik.nimetus) || '',
          dateOfBirth: person.synniKuupaev ? person.synniKuupaev.split('-').reverse().join('.') : '',
          personStatus: (person.isikuStaatus && person.isikuStaatus.elemendiKood) || ''
        }
      })}
  next: returnFoundResult

returnFoundResult:
  status: 200
  return: ${person_result}
  next: end

returnEmptyResult:
  return: '{"data": null}'
  status: 200
  next: end

logFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "rr.dde.v1"
      request_xml: "${'personalCode=' + personal_code}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "${'RR HTTP ' + rrResponse.response.status}"
      person_identifier: "${personal_code}"
      source_type: ""
      source_record_id: ""
  result: logResult
  next: logAjUsageOnFailure

# Andmejälgija (AJ) — IKS § 19: isikukood edastati RR-le olenemata sellest, kas
# RR vastas edukalt, seega logime päringu ka ebaõnnestunud rajal.
logAjUsageOnFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/aj/log_usage"
    headers:
      type: json
    body:
      user_code: "${personal_code}"
      action: "Järelevalve käigus isiku andmete päring rahvastikuregistrist"
      receiver_code: "70001231"
      receiver_name: "Liiklusjärelevalve infosüsteem (LJVIS2)"
      receiver_system: "ljvis2"
  result: ajLogResult
  next: returnRrError

returnRrError:
  status: 502
  return: '{"error": "RR_ERROR", "message": "Rahvastikuregistri päring ebaõnnestus"}'
  next: end

returnNoUserContext:
  status: 401
  return: '{"error": "NO_USER_CONTEXT", "message": "Autenditud kasutaja isikukood puudub — rahvastikuregistri päringut ei saa teha"}'
  next: end

returnInvalidPersonalCode:
  status: 400
  return: '{"error": "INVALID_PARAMETER", "message": "personalCode is required and must be a valid Estonian isikukood (11 digits, starting with 1-6)"}'
  next: end
