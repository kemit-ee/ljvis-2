# Nõutav õigus: xtee.query.rahvastikuregister VÕI xtee.query (üldine X-tee päring).
# auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('xtee.query.rahvastikuregister') || auth_user.permissions.includes('xtee.query'))}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
