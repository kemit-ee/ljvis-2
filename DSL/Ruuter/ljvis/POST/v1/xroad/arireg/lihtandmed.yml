declaration:
  call: declare
  version: 0.1
  description: "Search Ariregister company data via public autocomplete REST API"
  method: post
  accepts: json
  returns: json
  namespace: xroad
  allowlist:
    body:
      - field: registryCode
        type: string
      - field: companyName
        type: string

validate:
  switch:
    - condition: "${incoming.body.registryCode == null && incoming.body.companyName == null}"
      return: "{\"error\": \"MISSING_PARAMETER\", \"message\": \"At least one of registryCode or companyName is required\"}"
      status: 400
  next: assignParams

assignParams:
  assign:
    search_term: "${incoming.body.registryCode || incoming.body.companyName || ''}"
    start_time: "${new Date().getTime()}"
  next: callAriregister

callAriregister:
  call: http.get
  args:
    url: "[#ARIREG_AUTOCOMPLETE_URL]"
    query:
      q: "${search_term}"
  result: arResponse
  next: checkAriregisterStatus

checkAriregisterStatus:
  switch:
    - condition: "${arResponse.response.statusCodeValue < 200 || arResponse.response.statusCodeValue >= 300}"
      next: logFailure
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/arireg_autocomplete_response"
    headers:
      type: json
    body:
      data: ${arResponse.response.body.data}
      status: ${arResponse.response.body.status}
  result: mappedResponse
  next: logSuccess

logSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.lihtandmed_v3.v1"
      request_xml: "${'q=' + search_term}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
  result: logResult
  next: returnResponse

logFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.lihtandmed_v3.v1"
      request_xml: "${'q=' + search_term}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "${'ARI HTTP ' + arResponse.response.statusCodeValue}"
  result: logResult
  next: returnError

returnResponse:
  return: "${mappedResponse.response.body}"
  status: 200
  next: end

returnError:
  return: "{\"error\": \"ARI_ERROR\", \"message\": \"Äriregistri päring ebaõnnestus\"}"
  status: 502
  next: end
