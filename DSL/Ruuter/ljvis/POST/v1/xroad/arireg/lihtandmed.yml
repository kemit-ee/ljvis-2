declaration:

  version: "1.0"
  description: >-
    Search Ariregister company data (lihtandmed_v1) via XTR, routed through
    the real X-Road Security Server — our subsystem (GOV/70001231/ljvis2) has
    ACL on arireg's v1 methods (confirmed live via allowedMethods, see
    .ai/ljvis-tasks/xtee-task.md). No Ariregister username/password needed
    anymore (was lihtandmed_v3 via a direct HTTPS bypass to ariregxmlv6.rik.ee).
  namespace: xroad
  allowlist:
    body:
      - field: registryCode
        type: string
      - field: companyName
        type: string
      - field: maxResults

validate:
  switch:
    - condition: "${incoming.body.registryCode == null && incoming.body.companyName == null}"
      next: returnMissingParam
    - condition: "${incoming.body.maxResults != null && (incoming.body.maxResults < 1 || incoming.body.maxResults > 100)}"
      next: returnInvalidParam
  next: assignParams

returnMissingParam:
  status: 400
  return: "{\"error\": \"MISSING_PARAMETER\", \"message\": \"At least one of registryCode or companyName is required\"}"
  next: end

returnInvalidParam:
  status: 400
  return: "{\"error\": \"INVALID_PARAMETER\", \"message\": \"maxResults must be between 1 and 100\"}"
  next: end

assignParams:
  assign:
    reg_code: "${incoming.body.registryCode == null ? '' : String(incoming.body.registryCode)}"
    company_name: "${incoming.body.companyName == null ? '' : String(incoming.body.companyName)}"
    max_results: "${incoming.body.maxResults || 10}"
    start_time: "${new Date().getTime()}"
  next: callXtr

callXtr:
  call: http.post
  args:
    url: "[#LJVIS_XTR]/ar/lihtandmed_v1"
    headers:
      type: json
    body:
      reg_code: "${reg_code}"
      company_name: "${company_name}"
      max_results: ${max_results}
  result: xtrResponse
  next: checkXtrStatus

checkXtrStatus:
  switch:
    - condition: "${xtrResponse.response.status < 200 || xtrResponse.response.status >= 300}"
      next: logFailure
  next: logSuccess

logSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.lihtandmed_v1.v1"
      request_xml: "${'registryCode=' + reg_code + ';companyName=' + company_name}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: ""
      source_record_id: ""
  result: logResult
  next: prepareMapperInput

# Unwrap XTR's SOAP body and normalize singleton/array responses before
# DMapper translates the v1 fields into the application company contract.
prepareMapperInput:
  assign:
    mapper_input: >-
      ${(function(){
        function stripNs(v) {
          if (Array.isArray(v)) return v.map(stripNs);
          if (v && typeof v === 'object') {
            var out = {};
            Object.keys(v).forEach(function(k) {
              if (k.charAt(0) === '@') return;
              var shortKey = k.indexOf(':') >= 0 ? k.substring(k.indexOf(':') + 1) : k;
              out[shortKey] = stripNs(v[k]);
            });
            return out;
          }
          return v !== undefined ? v : null;
        }
        var soapBody = (xtrResponse.response.body && xtrResponse.response.body.body) ? xtrResponse.response.body.body : (xtrResponse.response.body || {});
        var responseKey = Object.keys(soapBody).find(function(k) { return k.endsWith('lihtandmed_v1Response'); });
        var responseNode = responseKey ? stripNs(soapBody[responseKey]) : {keha: {leitud_ettevotjate_arv: '0'}};
        var keha = (responseNode && responseNode.keha) || {};
        var totalFound = Number(keha.leitud_ettevotjate_arv || 0);
        var items = keha.ettevotjad && keha.ettevotjad.item;
        var companies = totalFound > 0 && items ? (Array.isArray(items) ? items : [items]) : [];
        return {totalFound: totalFound, companies: companies};
      })()}
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/arireg_lihtandmed_response"
    headers:
      type: json
    body: ${mapper_input}
  result: mapped
  next: checkMapperStatus

checkMapperStatus:
  switch:
    - condition: "${mapped.response.status < 200 || mapped.response.status >= 300}"
      next: returnMappingError
  next: returnResponse

returnMappingError:
  status: 502
  return: '{"error": "MAPPING_ERROR", "message": "Äriregistri vastuse teisendamine ebaõnnestus"}'
  next: end

logFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.lihtandmed_v1.v1"
      request_xml: "${'registryCode=' + reg_code + ';companyName=' + company_name}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "${'XTR HTTP ' + xtrResponse.response.status}"
      person_identifier: ""
      source_type: ""
      source_record_id: ""
  result: logResult
  next: returnError

returnResponse:
  return: ${mapped.response.body}
  status: 200
  next: end

returnError:
  return: "{\"error\": \"XTR_ERROR\", \"message\": \"Äriregistri päring ebaõnnestus\"}"
  status: 502
  next: end
