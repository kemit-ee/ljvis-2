declaration:
  call: declare
  version: 0.1
  description: "Get a single user by ID filtered by own organisation (local scope)"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: id
        type: string
        description: "User UUID"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    organisation_id: "${auth_user.organisationid}"
  next: getUser

getUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user/log-user-view"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    first_name: "${res.response.body[0].firstName || ''}"
    last_name: "${res.response.body[0].lastName || ''}"
    personal_code: "${res.response.body[0].personalCode || ''}"
    scope: "ownOrganisation"
    organisation_id: ${organisation_id}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
