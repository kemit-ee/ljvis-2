declaration:
  call: declare
  version: 0.1
  description: "List users filtered by own organisation (local scope)"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: search
        type: string
        description: "Search by name or personal code"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    search: "${incoming.body.search ?? ''}"
    page: "${incoming.body.page ?? 1}"
    page_size: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'status asc'}"
    organisation_id: "${auth_user.organisationid}"
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/list_users"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: ${organisation_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_users_list"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: setDefaults

setDefaults:
  assign:
    result_count: ${mapped.response.body.total}
    view_description: "Kasutajate nimekiri, leht ${page}, tulemusi 0"
    view_log_content: "{\"page\":${page},\"pageSize\":${page_size},\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"displayedPersonalCodes\":[],\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id}}"
  next: checkSearch

checkSearch:
  switch:
    - condition: ${search.length >= 3}
      next: logSearchEvent
  next: extractPersonalCodes

logSearchEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user/log-user-list-search"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    search: ${search}
    result_count: ${result_count}
    scope: "ownOrganisation"
    organisation_id: ${organisation_id}
  result: audit_result
  next: extractPersonalCodes

extractPersonalCodes:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_personal_codes"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: personal_codes_result
  next: setPersonalCode

setPersonalCode:
  assign:
    personal_codes: "${personal_codes_result.response.body}"
  next: checkResultCount

checkResultCount:
  switch:
    - condition: ${result_count > 0}
      next: setDescriptionAndLogContent
  next: logViewEvent

setDescriptionAndLogContent:
  assign:
    view_description: "Kasutajate nimekiri, leht ${page}, tulemusi ${result_count}: ${personal_codes}"
    view_log_content: "{\"page\":${page},\"pageSize\":${page_size},\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"displayedPersonalCodes\":\"${personal_codes}\",\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id}}"
  next: logViewEvent

logViewEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user/log-user-list-view"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    description: ${view_description}
    log_content: ${view_log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
