declaration:
  call: declare
  version: 0.1
  description: "List users filtered by own organisation (local scope)"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: search
        type: string
        description: "Search by name or personal code"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    search: "${incoming.body.search ?? ''}"
    page: "${incoming.body.page ?? 1}"
    page_size: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'status asc'}"
    organisation_id: "${auth_user.organisationid}"
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/list_users"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: ${organisation_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_users_list"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
