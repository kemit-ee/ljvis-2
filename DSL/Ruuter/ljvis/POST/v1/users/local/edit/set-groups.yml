declaration:
  call: declare
  version: 0.1
  description: "Replace all group memberships for a user"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: userId
        type: string
        description: "User ID"
      - field: addedGroupIds
        type: array
        description: "Array of added user group IDs"
      - field: removedGroupIds
        type: array
        description: "Array of removed user group IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_account_id: "${incoming.body.userId}"
    added_group_ids: "${(incoming.body.addedGroupIds ?? []).join(',')}"
    removed_group_ids: "${(incoming.body.removedGroupIds ?? []).join(',')}"
    added_group_ids_json: "${JSON.stringify((incoming.body.addedGroupIds ?? []).map(Number))}"
    removed_group_ids_json: "${JSON.stringify((incoming.body.removedGroupIds ?? []).map(Number))}"
    created_by: "${auth_user.personalcode}"
  next: checkRemovedGroups

checkRemovedGroups:
  switch:
    - condition: "${removed_group_ids == ''}"
      next: checkAddedGroups
  next: removeGroups

removeGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/set_user_groups"
    headers:
      type: json
    body:
      user_account_id: ${user_account_id}
      group_ids: ${removed_group_ids}
      status: "removed"
      created_by: ${created_by}
  result: removeRes
  next: checkAddedGroups

checkAddedGroups:
  switch:
    - condition: "${added_group_ids == ''}"
      next: logAuditEvent
  next: insertGroups

insertGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/set_user_groups"
    headers:
      type: json
    body:
      user_account_id: ${user_account_id}
      group_ids: ${added_group_ids}
      status: "active"
      created_by: ${created_by}
  result: insertRes
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user/log-user-set-groups"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_account_id: ${user_account_id}
    added_group_ids: ${added_group_ids}
    removed_group_ids: ${removed_group_ids}
    added_group_ids_json: ${added_group_ids_json}
    removed_group_ids_json: ${removed_group_ids_json}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end
