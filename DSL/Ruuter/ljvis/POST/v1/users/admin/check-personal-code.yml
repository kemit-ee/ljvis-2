declaration:

  version: "1.0"
  description: "Check if a personal code is already in use"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: personalCode
        type: string
        description: "Personal code to check"
      - field: id
        type: string
        description: "Optional: UUID of the user being updated (excluded from check)"

extractRequestData:
  assign:
    personal_code: "${incoming.body.personalCode}"
    id: "${incoming.body.id ?? ''}"
  next: checkConflict

checkConflict:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/check_personal_code_conflict"
    headers:
      type: json
    body:
      personal_code: ${personal_code}
      id: ${id}
  result: conflictRes
  next: checkConflictResult

checkConflictResult:
  switch:
    - condition: ${conflictRes.response.body.length > 0}
      next: return_conflict
  next: returnSuccess

returnSuccess:
  return: ${conflictRes.response.body}
  next: end

return_conflict:
  status: 409
  return: "personal code already exists"
  next: end
