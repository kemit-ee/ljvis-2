declaration:
  call: declare
  version: 0.1
  description: "Get a single user by ID (admin scope — all organisations)"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: id
        type: string
        description: "User UUID"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    organisation_id: ""
  next: getUser

getUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
