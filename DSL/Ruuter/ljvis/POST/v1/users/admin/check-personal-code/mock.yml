declaration:
  description: "Arenduse mock: POST /v1/users/admin/check-personal-code/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      items: []
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
