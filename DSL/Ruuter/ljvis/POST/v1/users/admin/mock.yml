    response:
      items:
        - id: "a0000001-0000-0000-0000-000000000099"
          firstName: "Mock"
          lastName: "Kasutaja"
          personalCode: "38001010000"
          organisationId: "b0000001-0000-0000-0000-000000000001"
          email: "mock.kasutaja@example.ee"
          structuralUnitId: null
