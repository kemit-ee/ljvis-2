declaration:
  call: declare
  version: 0.1
  description: "Get a single foreign violation form by ID"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: number
        description: "Foreign violation form ID"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/get"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_foreign_violation_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
