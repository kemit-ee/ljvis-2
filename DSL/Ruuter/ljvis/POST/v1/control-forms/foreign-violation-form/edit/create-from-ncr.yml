declaration:
  version: "1.0"
  description: "Create a new VR (foreign violation) control card pre-filled from an ERRU NCR message and link them bidirectionally"
  namespace: control-forms
  allowlist:
    body:
      - field: businessCaseId
        type: string

extractRequestData:
  assign:
    business_case_id: "${incoming.body.businessCaseId}"
    created_by: "${u.personalcode || ''}"
    inspector_first_name: "${u.firstname || ''}"
    inspector_last_name: "${u.lastname || ''}"
    inspector_organisation_id: "${String(u.organisationid || '')}"
    inspector_unit: "${u.structuralunit || ''}"
    inspector_profession: "${u.jobtitle || ''}"
  next: getNcrData

getNcrData:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: ncrRes
  next: checkNcrResult

checkNcrResult:
  switch:
    - condition: ${ncrRes.response == null || ncrRes.response.status < 200 || ncrRes.response.status >= 300 || ncrRes.response.body == null || ncrRes.response.body.length == null || ncrRes.response.body.length === 0}
      next: returnNcrReadError
  next: extractNcrFields

extractNcrFields:
  assign:
    ncr_id: "${ncrRes.response.body[ncrRes.response.body.length - 1].id || ''}"
    reporting_country_code: "${ncrRes.response.body[ncrRes.response.body.length - 1].ncrFrom || ''}"
    company_name: "${ncrRes.response.body[ncrRes.response.body.length - 1].transportUndertakingName || ''}"
    vehicle_reg_nr: "${ncrRes.response.body[ncrRes.response.body.length - 1].vehicleRegistrationNumber || ''}"
    vehicle_country_code: "${ncrRes.response.body[ncrRes.response.body.length - 1].vehicleRegistrationCountry || ''}"
    licence_copy_number: "${ncrRes.response.body[ncrRes.response.body.length - 1].communityLicenceNumber || ''}"
    inspection_date: "${ncrRes.response.body[ncrRes.response.body.length - 1].checkDate || ''}"
    data_entry_date: "${new Date().toISOString().slice(0, 10)}"
    check_result: "${ncrRes.response.body[0].checkResult || ''}"
    minor_infringement_raw: "${ncrRes.response.body[0].minorInfringement || null}"
    serious_infringements_raw: "${ncrRes.response.body[0].seriousInfringements || '[]'}"
  next: mapMinorInfringement

# p.1: kontrolli koha riik lukustub teate saatnud riigi (ncrFrom) järgi —
# frontend lukustab välja täiendavalt (ForeignViolationFormFields.tsx
# useEffect), aga täidetakse ka siin loomisel.
mapMinorInfringement:
  assign:
    inspection_country_code: ${reporting_country_code}
    minor_violations_count: >-
      ${(() => {
        var mi = minor_infringement_raw;
        if (typeof mi === 'string') {
          try { mi = JSON.parse(mi); } catch (e) { mi = null; }
        }
        return (mi && mi.numberOfInfringements != null) ? String(mi.numberOfInfringements) : '';
      })()}
  next: mapSeriousInfringements

# p.2: NCR serious_infringements (category+infringementType, nt "SI"+"912")
# -> violations[].code (nt "SI912"), samas kujus mis EU_VIOLATION_GROUPS
# checkbox-väärtused (frontend/src/constants/constants.ts). Igale rikkumisele
# lisatakse esimese penaltiesImposed kirje penaltyTypeImposed ERRU-koodi
# põhjal kohalik sanctionCode — vt allolev PROVISOORNE vastavustabel, mis
# vajab kliendi/RS kinnitust (vt plaani "Lahtised kohad" p.b).
mapSeriousInfringements:
  assign:
    violations: >-
      ${(() => {
        var list = serious_infringements_raw;
        if (typeof list === 'string') {
          try { list = JSON.parse(list); } catch (e) { list = []; }
        }
        if (!Array.isArray(list)) list = [];
        // PROVISOORNE ERRU karistusliigi (penaltyTypeImposed) -> kohaliku
        // sanctionCode vastavustabel (NCR_PENALTY_TYPE_IMPOSED_REQ koodid
        // 101/102/201-204 vs forms.foreign_violation_form sanctionOptions).
        // Vastuse-poolsed koodid 301-307 (litsentsi/juhitunnistuse meetmed)
        // ei sobitu otse sanctionCode'iga -> MUU, tooreks kood sanctionNotes-i.
        var PENALTY_TO_SANCTION = {
          '101': 'HOIATUS',
          '102': 'MUU',
          '201': 'KABOTAAŽVEO AJUTINE KEELAMINE',
          '202': 'TRAHV',
          '203': 'LIIKLEMISKEELD',
          '204': 'SÕIDUKI KASUTAMISE TAKISTAMINE'
        };
        return list.map(function(inf) {
          var code = String(inf.category || '') + String(inf.infringementType || '');
          var penalties = Array.isArray(inf.penaltiesImposed) ? inf.penaltiesImposed : [];
          var first = penalties[0];
          var entry = { code: code };
          if (first && first.penaltyTypeImposed != null) {
            var ptype = String(first.penaltyTypeImposed);
            var mapped = PENALTY_TO_SANCTION[ptype];
            if (mapped) {
              entry.sanctionCode = mapped;
            } else {
              entry.sanctionCode = 'MUU';
              entry.sanctionNotes = 'ERRU penaltyTypeImposed=' + ptype + ' (kaardistamata, vt provisoorne vastavustabel)';
            }
          }
          return entry;
        });
      })()}
  next: insertVrForm

insertVrForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/insert"
    headers:
      type: json
    body:
      status: "saved"
      reportingCountryCode: ${reporting_country_code}
      reportingAuthority: ""
      inspectionCountryCode: ${inspection_country_code}
      inspectionDate: ${inspection_date}
      inspectionTime: "00:00:00"
      inspectionAddressLine1: ""
      inspectionAddressLine2: ""
      inspectionRegion: ""
      inspectionCity: ""
      companyRegCode: ""
      companyName: ${company_name}
      companyCountryCode: ""
      companyAddressLine1: ""
      companyAddressLine2: ""
      companyCity: ""
      companyPostalCode: ""
      driverFirstName: "–"
      driverLastName: "–"
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ""
      vehicleModel: ""
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ""
      vehicleFirstRegistration: ""
      vehicleBodyType: ""
      licenceCopyNumber: ${licence_copy_number}
      violationDescription: ""
      minorViolationsCount: ${minor_violations_count}
      sanctionCode: "${check_result === 'CleanCheck' || check_result === '' ? 'KORRAS' : 'MUU'}"
      sanctionNotes: ""
      recommendedMeasureCode: "PUUDUVAD"
      recommendedMeasureNotes: ""
      recommendedMeasureGeneralNotes: ""
      additionalSanctionCodes: "[]"
      violations: "${JSON.stringify(violations)}"
      dataEntryDate: ${data_entry_date}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      erruNcrMessageKey: ${ncr_id}
      created_by: ${created_by}
  result: insertRes
  next: checkInsertResult

checkInsertResult:
  switch:
    - condition: ${insertRes.response == null || insertRes.response.status < 200 || insertRes.response.status >= 300 || insertRes.response.body == null || insertRes.response.body.length == null || insertRes.response.body.length === 0}
      next: returnInsertError
  next: extractVrFormKey

extractVrFormKey:
  assign:
    vr_form_key: "${insertRes.response.body[0].id || ''}"
  next: updateNcrLink

updateNcrLink:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/update-vr-link"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      foreignViolationFormKey: ${vr_form_key}
  result: linkRes
  next: checkLinkResult

checkLinkResult:
  switch:
    - condition: ${linkRes.response == null || linkRes.response.status < 200 || linkRes.response.status >= 300 || linkRes.response.body == null || linkRes.response.body.length == null || linkRes.response.body.length === 0}
      next: returnLinkError
  next: returnResult

returnResult:
  return: ${insertRes.response.body}
  next: end

returnNcrReadError:
  status: 404
  return: "${(ncrRes.response != null && ncrRes.response.body) || {type: 'NCR_NOT_FOUND', code: 'ncr_not_found', message: 'NCR teadet ei leitud'}}"
  next: end

returnInsertError:
  status: 500
  return: "${(insertRes.response != null && insertRes.response.body) || {type: 'RESQL_ERROR', code: 'create_failed', message: 'Välisriigis toimunud rikkumise kaardi loomine ebaõnnestus'}}"
  next: end

returnLinkError:
  status: 500
  return: "${(linkRes.response != null && linkRes.response.body) || {type: 'RESQL_ERROR', code: 'link_failed', message: 'NCR teate ja rikkumise kaardi sidumine ebaõnnestus'}}"
  next: end
