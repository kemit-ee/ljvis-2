declaration:

  version: "1.0"
  description: "Publish (avalikusta) a foreign violation form. Only allowed from confirmed status. Form field values are taken from the current database record — client only provides the id."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "published"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: getCurrentForm

getCurrentForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFormIsConfirmed

checkFormIsConfirmed:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormIsConfirmedSwitch

checkFormIsConfirmedSwitch:
  switch:
    - condition: ${current_status === 'published'}
      next: returnAlreadyPublishedError
    - condition: ${current_status !== 'confirmed'}
      next: returnNotConfirmedError
  next: extractCurrentFormData

extractCurrentFormData:
  assign:
    form_number: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].formNumber) || ''}"
    reporting_country_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].reportingCountryCode) || ''}"
    reporting_authority: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].reportingAuthorityName) || ''}"
    inspection_country_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionCountryCode) || ''}"
    inspection_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionDate) || ''}"
    inspection_time: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionTime) || ''}"
    inspection_address_line1: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionAddressLine1) || ''}"
    inspection_address_line2: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionAddressLine2) || ''}"
    inspection_region: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionRegion) || ''}"
    inspection_city: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectionCity) || ''}"
    company_reg_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyRegCode) || ''}"
    company_name: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyName) || ''}"
    company_country_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyCountryCode) || ''}"
    company_address_line1: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyAddressLine1) || ''}"
    company_address_line2: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyAddressLine2) || ''}"
    company_city: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyCity) || ''}"
    company_postal_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].companyPostalCode) || ''}"
    driver_first_name: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].driverFirstName) || ''}"
    driver_last_name: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].driverLastName) || ''}"
    vehicle_reg_nr: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleRegNr) || ''}"
    vehicle_make: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleMake) || ''}"
    vehicle_model: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleModel) || ''}"
    vehicle_country_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleCountryCode) || ''}"
    vehicle_vin: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleVin) || ''}"
    vehicle_first_registration: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleFirstRegistration) || ''}"
    vehicle_body_type: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].vehicleBodyType) || ''}"
    licence_copy_number: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].licenceCopyNumber) || ''}"
    violation_description: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].violationDescription) || ''}"
    # `!= null ? String(x) : ''` — mitte `|| ''`, sest 0 (nt "0 väikest
    # rikkumist") on legitiimne väärtus, mille `|| ''` muudaks SQL NULL-iks.
    minor_violations_count: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].minorViolationsCount != null) ? String(currentFormRes.response.body[0].minorViolationsCount) : ''}"
    sanction_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].sanctionCode) || ''}"
    sanction_notes: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].sanctionNotes) || ''}"
    recommended_measure_code: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].recommendedMeasureCode) || ''}"
    recommended_measure_notes: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].recommendedMeasureNotes) || ''}"
    recommended_measure_general_notes: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].recommendedMeasureGeneralNotes) || ''}"
    additional_sanction_codes: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].additionalSanctionCodes) || '[]'}"
    klim_clarification_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].klimClarificationDate) || ''}"
    carrier_explanation_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].carrierExplanationDate) || ''}"
    penalty_valid_until: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].penaltyValidUntil) || ''}"
    penalty_expired_or_processed: "${String((currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].penaltyExpiredOrProcessed) || false)}"
    akvk_next_meeting_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].akvkNextMeetingDate) || ''}"
    commission_last_decision_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].commissionLastDecisionDate) || ''}"
    admin_procedure_decision: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].adminProcedureDecision) || ''}"
    foreign_authority_proposal: "${String((currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].foreignAuthorityProposal) || false)}"
    notify_carrier: "${String((currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].notifyCarrier) || false)}"
    violations: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].violations) || '[]'}"
    data_entry_date: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].dataEntryDate) || ''}"
    inspector_first_name: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectorFirstName) || ''}"
    inspector_last_name: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectorLastName) || ''}"
    inspector_organisation_id: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectorOrganisationId) || ''}"
    inspector_unit: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectorUnit) || ''}"
    inspector_profession: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].inspectorProfession) || ''}"
  next: publishForm

publishForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/update"
    headers:
      type: json
    body:
      key: ${id}
      reportingCountryCode: ${reporting_country_code}
      reportingAuthority: ${reporting_authority}
      inspectionCountryCode: ${inspection_country_code}
      inspectionDate: ${inspection_date}
      inspectionTime: ${inspection_time}
      inspectionAddressLine1: ${inspection_address_line1}
      inspectionAddressLine2: ${inspection_address_line2}
      inspectionRegion: ${inspection_region}
      inspectionCity: ${inspection_city}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyAddressLine1: ${company_address_line1}
      companyAddressLine2: ${company_address_line2}
      companyCity: ${company_city}
      companyPostalCode: ${company_postal_code}
      driverFirstName: ${driver_first_name}
      driverLastName: ${driver_last_name}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      licenceCopyNumber: ${licence_copy_number}
      violationDescription: ${violation_description}
      minorViolationsCount: ${minor_violations_count}
      sanctionCode: ${sanction_code}
      sanctionNotes: ${sanction_notes}
      recommendedMeasureCode: ${recommended_measure_code}
      recommendedMeasureNotes: ${recommended_measure_notes}
      recommendedMeasureGeneralNotes: ${recommended_measure_general_notes}
      additionalSanctionCodes: ${additional_sanction_codes}
      klimClarificationDate: ${klim_clarification_date}
      carrierExplanationDate: ${carrier_explanation_date}
      penaltyValidUntil: ${penalty_valid_until}
      penaltyExpiredOrProcessed: ${penalty_expired_or_processed}
      akvkNextMeetingDate: ${akvk_next_meeting_date}
      commissionLastDecisionDate: ${commission_last_decision_date}
      adminProcedureDecision: ${admin_procedure_decision}
      foreignAuthorityProposal: ${foreign_authority_proposal}
      notifyCarrier: ${notify_carrier}
      violations: ${violations}
      dataEntryDate: ${data_entry_date}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      status: ${status}
      created_by: ${created_by}
  result: publishRes
  next: check_publishRes_persisted

# --- Avalikustamisel märgitud teavituste saatmine (LJVIS2 VR ettepanek 10) ---
# Best-effort: teavituse saatmise viga EI tohi avalikustamist 500-tada.
# Vorm saab avalikustuda ainult üks kord (checkFormIsConfirmedSwitch tõkestab
# korduva avalikustamise), seega pole flip/dubleerimise kontrolli vaja —
# piisab lipu hetkeväärtuse kontrollist.
checkForeignProposalNotification:
  switch:
    - condition: ${foreign_authority_proposal === 'true'}
      next: sendForeignProposalNotification
  next: checkNotifyCarrierNotification

sendForeignProposalNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "labor_foreign_proposal"
      # recipient_email puudub teadlikult — send-postkast.yml kasutab
      # notification_template_mapping.default_recipient_email't (haldusliidesest
      # seadistatav, vt notification-template-mapping/save.yml).
      language: "et"
      send_time: ""
      related_entity_type: "foreign_violation_form"
      related_entity_id: ${id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: form_number, companyName: company_name, companyRegCode: company_reg_code } }"
  result: foreignProposalNotifRes
  error: checkNotifyCarrierNotification
  next: checkNotifyCarrierNotification

# 10b: vedaja teavitamine (notifyCarrier). E-posti aadress küsitakse
# äriregistrist (arireg/detailandmed_v1, mis juba nõuab yandmed=true ehk
# üldandmed, kus RIK-i skeemi järgi asub sidevahendid). Best-effort kogu
# ahelas: kui äriregister ei vasta, sealt e-posti ei leia või Postkast 2.0
# kutse ebaõnnestub, avalikustamine ei tohi 500-tada — vaikimisi liigutakse
# lihtsalt edasi teavituseta.
# TÄHELEPANU: sidevahendid'i täpne JSON-tee pärast XTR SOAP→JSON teisendust
# ei ole selles koodibaasis kunagi varem kasutusele võetud (detailandmed.yml
# tagastab siiani toorvastuse, kellelgi pole seda kaardistatud) — allolev
# extractCarrierEmail proovib mitut usutavat kuju, aga tuleb kontrollida
# päris X-tee vastuse vastu enne toodangusse laskmist.
checkNotifyCarrierNotification:
  switch:
    - condition: >-
        ${notify_carrier === 'true' && (company_reg_code || '').trim() !== ''}
      next: lookupCarrierRegistryData
  next: extractResponseData

lookupCarrierRegistryData:
  call: http.post
  args:
    url: "[#LJVIS_XTR]/ar/detailandmed_v1"
    headers:
      type: json
    body:
      reg_code: ${company_reg_code}
  result: carrierRegistryRes
  error: extractResponseData
  next: extractCarrierEmail

extractCarrierEmail:
  assign:
    carrier_email: >-
      ${(() => {
        var body = carrierRegistryRes.response && carrierRegistryRes.response.body;
        if (!body) return '';
        var list = body.ettevotjad || (body.keha && body.keha.ettevotjad) || body.item || body;
        var company = Array.isArray(list) ? list[0] : list;
        if (!company) return '';
        var yld = company.yldandmed || company;
        var sv = (yld && yld.sidevahendid) || company.sidevahendid;
        if (sv && sv.item) sv = sv.item;
        var svList = Array.isArray(sv) ? sv : (sv ? [sv] : []);
        var match = svList.find(function(s) {
          return s && typeof s.liik === 'string' && s.liik.toUpperCase().indexOf('POST') !== -1;
        });
        return (match && (match.sisu || match.vaartus || match.value)) || '';
      })()}
  next: checkCarrierEmailFound

checkCarrierEmailFound:
  switch:
    - condition: ${(carrier_email || '').trim() !== ''}
      next: sendCarrierNotification
  next: extractResponseData

sendCarrierNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "carrier_violation"
      recipient_email: ${carrier_email}
      language: "et"
      send_time: ""
      related_entity_type: "foreign_violation_form"
      related_entity_id: ${id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: form_number, companyName: company_name, companyRegCode: company_reg_code } }"
  result: carrierNotifRes
  error: extractResponseData
  next: extractResponseData

extractResponseData:
  assign:
    form_number: "${publishRes.response.body[0].formNumber + '/' + publishRes.response.body[0].version}"
    old_status: ${current_status}
    new_status: ${status}
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/foreign-violation/log-foreign-violation-publish"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    old_status: ${old_status}
    new_status: ${new_status}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${publishRes.response.body}
  next: end

returnAlreadyPublishedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_published"}'
  next: end

returnNotConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"not_confirmed"}'
  next: end

check_publishRes_persisted:
  switch:
    - condition: ${publishRes.response == null || publishRes.response.status < 200 || publishRes.response.status >= 300 || publishRes.response.body == null || publishRes.response.body.length == null || publishRes.response.body.length === 0}
      next: returnResqlWriteError
  next: checkForeignProposalNotification

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end
