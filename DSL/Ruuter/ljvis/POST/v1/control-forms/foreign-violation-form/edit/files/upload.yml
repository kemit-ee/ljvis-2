declaration:
  call: declare
  version: 0.1
  description: "Upload a file attachment for a foreign violation form"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: formNumber
        type: string
      - field: fileName
        type: string
      - field: fileBase64
        type: string
      - field: mimetype
        type: string

get_user_context:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: auth_user
  next: uploadFile

uploadFile:
  template: "[#LJVIS_PROJECT_LAYER]/files/upload"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "foreign-violation-form"
    form_number: ${incoming.body.formNumber}
    file_name: ${incoming.body.fileName}
    file_base64: ${incoming.body.fileBase64}
    mimetype: ${incoming.body.mimetype}
    actor_name: "${auth_user.response.body.firstName || ''} ${auth_user.response.body.lastName || ''}"
    actor_personal_code: "${auth_user.response.body.personalCode || ''}"
  result: uploadResult
  next: returnSuccess

returnSuccess:
  return: ${uploadResult}
  status: 200
  next: end
