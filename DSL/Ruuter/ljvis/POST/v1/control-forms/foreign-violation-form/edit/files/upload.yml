declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Upload a file attachment for a foreign violation form"
  namespace: control-forms
  allowlist:
    body:
      - field: formNumber
        type: string
      - field: fileName
        type: string
      - field: fileBase64
        type: string
      - field: mimetype
        type: string
    headers:
      - field: cookie
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) - eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: checkFormNumber

# Omand (epic #502 A2): vormi number peab algama selle vormitüübi prefiksiga - klient ei saa lisada
# manust teise tüübi vormile ega (`..`, `/`) kirjutada S3-s teise kausta. Sama kontroll on
# mallis `templates/files/upload` ja Resql'is `insert_form_attachment` (kaitse sügavuti).
checkFormNumber:
  switch:
    - condition: ${incoming.body.formNumber == null || !String(incoming.body.formNumber).startsWith("vr-") || !/^[A-Za-z0-9-]+$/.test(String(incoming.body.formNumber))}
      next: returnInvalidFormNumber
  next: uploadFile

returnInvalidFormNumber:
  status: 400
  return:
    error: INVALID_FORM_NUMBER
  next: end

uploadFile:
  template: "templates/files/upload"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "foreign-violation-form"
    form_number_prefix: "vr-"
    form_number: ${incoming.body.formNumber}
    file_name: ${incoming.body.fileName}
    file_base64: ${incoming.body.fileBase64}
    mimetype: ${incoming.body.mimetype}
  result: uploadResult
  next: checkUploadResult

# Malli veastaatus ei kandu edasi: õnnestumise korral on tulemus manuse ridade massiiv,
# vea korral objekt veakoodiga.
checkUploadResult:
  switch:
    - condition: ${Array.isArray(uploadResult)}
      next: returnSuccess
    - condition: ${uploadResult != null && uploadResult.error === "FILE_TYPE_NOT_ALLOWED"}
      next: returnFileTypeNotAllowed
    - condition: ${uploadResult != null && uploadResult.error === "FILE_TOO_LARGE"}
      next: returnFileTooLarge
    - condition: ${uploadResult != null && uploadResult.error === "FILE_REJECTED"}
      next: returnFileRejected
    - condition: ${uploadResult != null && uploadResult.error === "INVALID_FORM_NUMBER"}
      next: returnInvalidFormNumber
  next: returnUploadFailed

returnFileTypeNotAllowed:
  status: 415
  return:
    error: FILE_TYPE_NOT_ALLOWED
  next: end

returnFileTooLarge:
  status: 413
  return:
    error: FILE_TOO_LARGE
  next: end

returnFileRejected:
  status: 400
  return:
    error: FILE_REJECTED
  next: end

returnUploadFailed:
  status: 502
  return:
    error: UPLOAD_FAILED
  next: end

returnSuccess:
  return: ${uploadResult}
  status: 200
  next: end
