declaration:
  call: declare
  version: 0.1
  description: "Delete foreign violation form"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "deleted"
    created_by: "${auth_user.personalcode}"
  next: insertForm

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/delete"
    headers:
      type: json
    body:
      id: ${id}
      status: ${status}
      created_by: ${created_by}
  result: insertRes
  next: extractResponseData

extractResponseData:
  assign:
    form_number: "${insertRes.response.body[0].formNumber || ''}"
  next: returnSuccess

#logAuditEvent:
#  template: "[#LJVIS_PROJECT_LAYER]/audit/form/foreign-violation/log-foreign-violation-create"
#  requestType: templates
#  headers:
#    cookie: ${incoming.headers.cookie}
#  body:
#    form_number: ${form_number}
#  result: audit_result
#  next: returnSuccess

returnSuccess:
  return: ${insertRes.response.body}
  next: end
