declaration:

  version: "1.0"
  description: "Create or update a foreign violation form — single unified save endpoint, branches internally on presence of id. Confirmed forms can only be re-saved by a user with control_form.edit_locked."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: reportingCountryCode
        type: string
      - field: reportingAuthority
        type: string
      - field: inspectionCountryCode
        type: string
      - field: inspectionDate
        type: string
      - field: inspectionTime
        type: string
      - field: inspectionAddressLine1
        type: string
      - field: inspectionAddressLine2
        type: string
      - field: inspectionRegion
        type: string
      - field: inspectionCity
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: companyCountryCode
        type: string
      - field: companyAddressLine1
        type: string
      - field: companyAddressLine2
        type: string
      - field: companyCity
        type: string
      - field: companyPostalCode
        type: string
      - field: driverFirstName
        type: string
      - field: driverLastName
        type: string
      - field: vehicleRegNr
        type: string
      - field: vehicleMake
        type: string
      - field: vehicleModel
        type: string
      - field: vehicleCountryCode
        type: string
      - field: vehicleVin
        type: string
      - field: vehicleFirstRegistration
        type: string
      - field: vehicleBodyType
        type: string
      - field: licenceCopyNumber
        type: string
      - field: violationDescription
        type: string
      - field: minorViolationsCount
        type: string
      - field: sanctionCode
        type: string
      - field: sanctionNotes
        type: string
      - field: recommendedMeasureCode
        type: string
      - field: recommendedMeasureNotes
        type: string
      - field: recommendedMeasureGeneralNotes
        type: string
      - field: additionalSanctionCodes
        type: string
      - field: klimClarificationDate
        type: string
      - field: carrierExplanationDate
        type: string
      - field: penaltyValidUntil
        type: string
      - field: penaltyExpiredOrProcessed
        type: string
      - field: akvkNextMeetingDate
        type: string
      - field: commissionLastDecisionDate
        type: string
      - field: adminProcedureDecision
        type: string
      - field: foreignAuthorityProposal
        type: string
      - field: notifyCarrier
        type: string
      - field: violations
        type: string
      - field: dataEntryDate
        type: string
      - field: inspectorFirstName
        type: string
      - field: inspectorLastName
        type: string
      - field: inspectorOrganisationId
        type: string
      - field: inspectorUnit
        type: string
      - field: inspectorProfession
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    reporting_country_code: "${incoming.body.reportingCountryCode}"
    reporting_authority: "${incoming.body.reportingAuthority}"
    inspection_country_code: "${incoming.body.inspectionCountryCode}"
    inspection_date: "${incoming.body.inspectionDate}"
    inspection_time: "${incoming.body.inspectionTime}"
    inspection_address_line1: "${incoming.body.inspectionAddressLine1}"
    inspection_address_line2: "${incoming.body.inspectionAddressLine2}"
    inspection_region: "${incoming.body.inspectionRegion}"
    inspection_city: "${incoming.body.inspectionCity}"
    company_reg_code: "${incoming.body.companyRegCode}"
    company_name: "${incoming.body.companyName}"
    company_country_code: "${incoming.body.companyCountryCode}"
    company_address_line1: "${incoming.body.companyAddressLine1}"
    company_address_line2: "${incoming.body.companyAddressLine2}"
    company_city: "${incoming.body.companyCity}"
    company_postal_code: "${incoming.body.companyPostalCode}"
    driver_first_name: "${incoming.body.driverFirstName}"
    driver_last_name: "${incoming.body.driverLastName}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr}"
    vehicle_make: "${incoming.body.vehicleMake}"
    vehicle_model: "${incoming.body.vehicleModel}"
    vehicle_country_code: "${incoming.body.vehicleCountryCode}"
    vehicle_vin: "${incoming.body.vehicleVin}"
    vehicle_first_registration: "${incoming.body.vehicleFirstRegistration}"
    vehicle_body_type: "${incoming.body.vehicleBodyType}"
    licence_copy_number: "${incoming.body.licenceCopyNumber}"
    violation_description: "${incoming.body.violationDescription}"
    minor_violations_count: "${incoming.body.minorViolationsCount}"
    sanction_code: "${incoming.body.sanctionCode}"
    sanction_notes: "${incoming.body.sanctionNotes}"
    recommended_measure_code: "${incoming.body.recommendedMeasureCode}"
    recommended_measure_notes: "${incoming.body.recommendedMeasureNotes}"
    recommended_measure_general_notes: "${incoming.body.recommendedMeasureGeneralNotes}"
    additional_sanction_codes: "${incoming.body.additionalSanctionCodes}"
    klim_clarification_date: "${incoming.body.klimClarificationDate}"
    carrier_explanation_date: "${incoming.body.carrierExplanationDate}"
    penalty_valid_until: "${incoming.body.penaltyValidUntil}"
    penalty_expired_or_processed: "${incoming.body.penaltyExpiredOrProcessed}"
    akvk_next_meeting_date: "${incoming.body.akvkNextMeetingDate}"
    commission_last_decision_date: "${incoming.body.commissionLastDecisionDate}"
    admin_procedure_decision: "${incoming.body.adminProcedureDecision}"
    foreign_authority_proposal: "${incoming.body.foreignAuthorityProposal}"
    notify_carrier: "${incoming.body.notifyCarrier}"
    violations: "${incoming.body.violations}"
    data_entry_date: "${incoming.body.dataEntryDate}"
    inspector_first_name: "${incoming.body.inspectorFirstName}"
    inspector_last_name: "${incoming.body.inspectorLastName}"
    inspector_organisation_id: "${incoming.body.inspectorOrganisationId}"
    inspector_unit: "${incoming.body.inspectorUnit}"
    inspector_profession: "${incoming.body.inspectorProfession}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateForm

validateForm:
  template: "templates/form/foreign-violation/validate-foreign-violation-form"
  requestType: GET
  body:
    reportingCountryCode: ${reporting_country_code}
    reportingAuthority: ${reporting_authority}
    inspectionDate: ${inspection_date}
    sanctionCode: ${sanction_code}
    recommendedMeasureCode: ${recommended_measure_code}
    recommendedMeasureNotes: ${recommended_measure_notes}
    dataEntryDate: ${data_entry_date}
    inspectorFirstName: ${inspector_first_name}
    inspectorLastName: ${inspector_last_name}
    inspectorOrganisationId: ${inspector_organisation_id}
    inspectorProfession: ${inspector_profession}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: checkIsCreate

checkIsCreate:
  switch:
    - condition: ${id == null || id === ''}
      next: insertForm
  next: getCurrentFormForStatus

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/insert"
    headers:
      type: json
    body:
      status: saved
      reportingCountryCode: ${reporting_country_code}
      reportingAuthority: ${reporting_authority}
      inspectionCountryCode: ${inspection_country_code}
      inspectionDate: ${inspection_date}
      inspectionTime: ${inspection_time}
      inspectionAddressLine1: ${inspection_address_line1}
      inspectionAddressLine2: ${inspection_address_line2}
      inspectionRegion: ${inspection_region}
      inspectionCity: ${inspection_city}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyAddressLine1: ${company_address_line1}
      companyAddressLine2: ${company_address_line2}
      companyCity: ${company_city}
      companyPostalCode: ${company_postal_code}
      driverFirstName: ${driver_first_name}
      driverLastName: ${driver_last_name}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      licenceCopyNumber: ${licence_copy_number}
      violationDescription: ${violation_description}
      minorViolationsCount: ${minor_violations_count}
      sanctionCode: ${sanction_code}
      sanctionNotes: ${sanction_notes}
      recommendedMeasureCode: ${recommended_measure_code}
      recommendedMeasureNotes: ${recommended_measure_notes}
      recommendedMeasureGeneralNotes: ${recommended_measure_general_notes}
      additionalSanctionCodes: ${additional_sanction_codes}
      klimClarificationDate: ${klim_clarification_date}
      carrierExplanationDate: ${carrier_explanation_date}
      penaltyValidUntil: ${penalty_valid_until}
      penaltyExpiredOrProcessed: ${penalty_expired_or_processed}
      akvkNextMeetingDate: ${akvk_next_meeting_date}
      commissionLastDecisionDate: ${commission_last_decision_date}
      adminProcedureDecision: ${admin_procedure_decision}
      foreignAuthorityProposal: ${foreign_authority_proposal}
      notifyCarrier: ${notify_carrier}
      violations: ${violations}
      dataEntryDate: ${data_entry_date}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      created_by: ${created_by}
  result: saveRes
  next: checkInsertSaved

checkInsertSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: extractInsertResponseData


extractInsertResponseData:
  assign:
    form_number: "${saveRes.response.body[0].formNumber + '/' + saveRes.response.body[0].version}"
  next: logAuditEventCreate

logAuditEventCreate:
  template: "templates/audit/form/foreign-violation/log-foreign-violation-create"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotLocked

checkFormNotLocked:
  switch:
    - condition: ${current_status === 'confirmed' && !(u.permissions != null && u.permissions.includes('control_form.edit_locked'))}
      next: returnFormLockedError
  next: calculateChangedFields

calculateChangedFields:
  template: "templates/form/foreign-violation/calculate-foreign-violation-changed-fields"
  requestType: GET
  body:
    form_id: ${id}
    reporting_country_code: ${reporting_country_code}
    reporting_authority: ${reporting_authority}
    inspection_country_code: ${inspection_country_code}
    inspection_date: ${inspection_date}
    inspection_time: ${inspection_time}
    inspection_address_line1: ${inspection_address_line1}
    inspection_address_line2: ${inspection_address_line2}
    inspection_region: ${inspection_region}
    inspection_city: ${inspection_city}
    company_reg_code: ${company_reg_code}
    company_name: ${company_name}
    company_country_code: ${company_country_code}
    company_address_line1: ${company_address_line1}
    company_address_line2: ${company_address_line2}
    company_city: ${company_city}
    company_postal_code: ${company_postal_code}
    driver_first_name: ${driver_first_name}
    driver_last_name: ${driver_last_name}
    vehicle_reg_nr: ${vehicle_reg_nr}
    vehicle_make: ${vehicle_make}
    vehicle_model: ${vehicle_model}
    vehicle_country_code: ${vehicle_country_code}
    vehicle_vin: ${vehicle_vin}
    vehicle_first_registration: ${vehicle_first_registration}
    vehicle_body_type: ${vehicle_body_type}
    licence_copy_number: ${licence_copy_number}
    violation_description: ${violation_description}
    minor_violations_count: ${minor_violations_count}
    sanction_code: ${sanction_code}
    sanction_notes: ${sanction_notes}
    recommended_measure_code: ${recommended_measure_code}
    recommended_measure_notes: ${recommended_measure_notes}
    recommended_measure_general_notes: ${recommended_measure_general_notes}
    inspector_first_name: ${inspector_first_name}
    inspector_last_name: ${inspector_last_name}
    inspector_organisation_id: ${inspector_organisation_id}
    inspector_unit: ${inspector_unit}
    inspector_profession: ${inspector_profession}
  result: changedFieldsResult
  next: extractResult

extractResult:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
  next: parseChangedFieldsResult

parseChangedFieldsResult:
  assign:
    changed_fields_result: ${parsed_result.changed_fields}
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/update"
    headers:
      type: json
    body:
      key: ${id}
      reportingCountryCode: ${reporting_country_code}
      reportingAuthority: ${reporting_authority}
      inspectionCountryCode: ${inspection_country_code}
      inspectionDate: ${inspection_date}
      inspectionTime: ${inspection_time}
      inspectionAddressLine1: ${inspection_address_line1}
      inspectionAddressLine2: ${inspection_address_line2}
      inspectionRegion: ${inspection_region}
      inspectionCity: ${inspection_city}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyAddressLine1: ${company_address_line1}
      companyAddressLine2: ${company_address_line2}
      companyCity: ${company_city}
      companyPostalCode: ${company_postal_code}
      driverFirstName: ${driver_first_name}
      driverLastName: ${driver_last_name}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      licenceCopyNumber: ${licence_copy_number}
      violationDescription: ${violation_description}
      minorViolationsCount: ${minor_violations_count}
      sanctionCode: ${sanction_code}
      sanctionNotes: ${sanction_notes}
      recommendedMeasureCode: ${recommended_measure_code}
      recommendedMeasureNotes: ${recommended_measure_notes}
      recommendedMeasureGeneralNotes: ${recommended_measure_general_notes}
      additionalSanctionCodes: ${additional_sanction_codes}
      klimClarificationDate: ${klim_clarification_date}
      carrierExplanationDate: ${carrier_explanation_date}
      penaltyValidUntil: ${penalty_valid_until}
      penaltyExpiredOrProcessed: ${penalty_expired_or_processed}
      akvkNextMeetingDate: ${akvk_next_meeting_date}
      commissionLastDecisionDate: ${commission_last_decision_date}
      adminProcedureDecision: ${admin_procedure_decision}
      foreignAuthorityProposal: ${foreign_authority_proposal}
      notifyCarrier: ${notify_carrier}
      violations: ${violations}
      dataEntryDate: ${data_entry_date}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      status: ${current_status}
      created_by: ${created_by}
  result: saveRes
  next: checkUpdateSaved

checkUpdateSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: checkForeignProposalNotification

# --- Avalikustatud vormil märgitud teavituste saatmine (LJVIS2 VR ettepanek 10) ---
# Best-effort: teavituse saatmise viga EI tohi salvestamist 500-tada.
# "Flip" kontroll: saada ainult siis, kui märge läks nüüd true-ks (DB vana
# väärtus ei olnud true), et korduv salvestamine ei dubleeriks teavitust.
checkForeignProposalNotification:
  switch:
    - condition: >-
        ${current_status === 'published'
          && foreign_authority_proposal === 'true'
          && !(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].foreignAuthorityProposal === true)}
      next: sendForeignProposalNotification
  next: extractUpdateResponseData

sendForeignProposalNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "labor_foreign_proposal"
      recipient_email: "[#LABOUR_INSPECTOR_EMAIL]"
      language: "et"
      send_time: ""
      related_entity_type: "foreign_violation_form"
      related_entity_id: ${id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: saveRes.response.body[0].formNumber, companyName: company_name, companyRegCode: company_reg_code } }"
  result: foreignProposalNotifRes
  error: extractUpdateResponseData
  next: extractUpdateResponseData

# 10b: vedaja teavitamine (notifyCarrier) vajab veoettevõtte äriregistri
# e-posti aadressi (arireg/detailandmed 'sidevahendid') — eraldi töö.
# Kuni selleni jõuab: märge salvestatakse, kuid Postkast 2.0 teavitust
# ei saadeta.

extractUpdateResponseData:
  assign:
    form_number: "${saveRes.response.body[0].formNumber + '/' + saveRes.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/foreign-violation/log-foreign-violation-update"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    changed_fields: ${changed_fields_result}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

returnResqlSaveError:
  status: 500
  return: "${(saveRes.response != null && saveRes.response.body) || {type: 'RESQL_ERROR', code: 'save_failed', message: 'Vormi salvestamine andmebaasi ebaõnnestus'}}"
  next: end

returnSuccess:
  return: ${saveRes.response.body}
  next: end

returnValidationError:
  status: 422
  return: ${validationResult}
  next: end

returnFormLockedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"form_locked_after_confirm"}'
  next: end
