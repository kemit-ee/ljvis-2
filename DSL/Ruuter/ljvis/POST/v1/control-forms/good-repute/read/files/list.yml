declaration:
  call: declare
  version: 0.1
  description: "List active file attachments for a good repute form (LJVIS2-136)"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: formNumber
        type: string

getFiles:
  template: "[#LJVIS_PROJECT_LAYER]/files/list"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${incoming.body.formNumber}
  result: listResult
  next: returnSuccess

returnSuccess:
  return: ${listResult}
  status: 200
  next: end
