declaration:
  call: declare
  version: 0.1
  description: "Get a single good repute form snapshot by snapshot ID, for the read-only historical version view (LJVIS2-136)."
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "Good repute form key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_key: "${incoming.body.formKey}"
  next: getSnapshot

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/get-snapshot"
    headers:
      type: json
    body:
      id: ${id}
      form_key: ${form_key}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
