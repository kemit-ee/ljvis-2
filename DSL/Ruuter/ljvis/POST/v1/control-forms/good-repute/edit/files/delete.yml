declaration:
  internal: false

  version: "1.0"
  description: "Delete a file attachment for a good-repute form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: deleteFile

deleteFile:
  template: "templates/files/delete"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number_prefix: "mv-"
    id: ${incoming.body.id}
    form_type: "good-repute-form"
  result: deleteResult
  next: returnSuccess

returnSuccess:
  return: ${deleteResult}
  status: 200
  next: end
