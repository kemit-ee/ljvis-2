declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Confirm (kinnita) a good repute form (hea maine vorm). Confirming re-validates and re-saves current field values, then transitions status saved -> confirmed. One-way: an already-confirmed form cannot be confirmed again (LJVIS2-136)."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: revision
        type: integer
      - field: personalCode
        type: string
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: dateOfBirth
        type: string
      - field: placeOfBirth
        type: string
      - field: certificateNumber
        type: string
      - field: certificateIssueDate
        type: string
      - field: certificateCountryCode
        type: string
      - field: fitnessStatus
        type: string
      - field: unfitFromDate
        type: string
      - field: unfitUntilDate
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "confirmed"
    personal_code: "${incoming.body.personalCode || ''}"
    first_name: "${incoming.body.firstName || ''}"
    last_name: "${incoming.body.lastName || ''}"
    date_of_birth: "${incoming.body.dateOfBirth || ''}"
    place_of_birth: "${incoming.body.placeOfBirth || ''}"
    certificate_number: "${incoming.body.certificateNumber || ''}"
    certificate_issue_date: "${incoming.body.certificateIssueDate || ''}"
    certificate_country_code: "${incoming.body.certificateCountryCode || ''}"
    fitness_status: "${incoming.body.fitnessStatus || ''}"
    unfit_from_date: "${incoming.body.unfitFromDate || ''}"
    unfit_until_date: "${incoming.body.unfitUntilDate || ''}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateTextFields

validateTextFields:
  switch:
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(personal_code == null ? "" : personal_code))}'
      next: returnInvalidCharactersPersonalCode
    - condition: '${String(personal_code == null ? "" : personal_code).length > 20}'
      next: returnMaxLengthPersonalCode
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(first_name == null ? "" : first_name))}'
      next: returnInvalidCharactersFirstName
    - condition: '${String(first_name == null ? "" : first_name).length > 100}'
      next: returnMaxLengthFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(last_name == null ? "" : last_name))}'
      next: returnInvalidCharactersLastName
    - condition: '${String(last_name == null ? "" : last_name).length > 100}'
      next: returnMaxLengthLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(place_of_birth == null ? "" : place_of_birth))}'
      next: returnInvalidCharactersPlaceOfBirth
    - condition: '${String(place_of_birth == null ? "" : place_of_birth).length > 200}'
      next: returnMaxLengthPlaceOfBirth
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(certificate_number == null ? "" : certificate_number))}'
      next: returnInvalidCharactersCertificateNumber
    - condition: '${String(certificate_number == null ? "" : certificate_number).length > 100}'
      next: returnMaxLengthCertificateNumber
  next: validateForm

validateForm:
  template: "templates/form/good-repute/validate-good-repute-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: ${id}
    personalCode: ${personal_code}
    firstName: ${first_name}
    lastName: ${last_name}
    dateOfBirth: ${date_of_birth}
    placeOfBirth: ${place_of_birth}
    certificateNumber: ${certificate_number}
    certificateIssueDate: ${certificate_issue_date}
    certificateCountryCode: ${certificate_country_code}
    fitnessStatus: ${fitness_status}
    unfitFromDate: ${unfit_from_date}
    unfitUntilDate: ${unfit_until_date}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: getCurrentFormForStatus

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFormNotAlreadyConfirmed

checkFormNotAlreadyConfirmed:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotAlreadyConfirmedSwitch

checkFormNotAlreadyConfirmedSwitch:
  switch:
    - condition: ${current_status === 'confirmed'}
      next: returnAlreadyConfirmedError
  next: confirmForm

confirmForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/update"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${incoming.body.revision == null || incoming.body.revision === '' ? '' : String(incoming.body.revision)}"
      status: ${status}
      personalCode: ${personal_code}
      firstName: ${first_name}
      lastName: ${last_name}
      dateOfBirth: ${date_of_birth}
      placeOfBirth: ${place_of_birth}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateCountryCode: ${certificate_country_code}
      fitnessStatus: ${fitness_status}
      unfitFromDate: ${unfit_from_date}
      unfitUntilDate: ${unfit_until_date}
      created_by: ${created_by}
  result: confirmRes
  next: checkFormModified

# Optimistlik lukk: kui kasutaja nähtud revision ei ole enam uusim, lisab update.sql 0 rida
# (tühi vastus) - see on konflikt, mitte salvestusviga.
checkFormModified:
  switch:
    - condition: ${confirmRes.response != null && confirmRes.response.status >= 200 && confirmRes.response.status < 300 && Array.isArray(confirmRes.response.body) && confirmRes.response.body.length === 0 && incoming.body.revision != null && incoming.body.revision !== ''}
      next: returnFormModifiedError
  next: check_confirmRes_persisted

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

extractConfirmResponseData:
  assign:
    good_repute_form_key: "${confirmRes.response.body[0].id || ''}"
    form_number: "${confirmRes.response.body[0].formNumber || ''}"
    old_status: ${current_status}
    new_status: ${status}
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/good-repute/log-good-repute-confirm"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    good_repute_form_key: "${String((good_repute_form_key) ?? '')}"
    personal_code: ${personal_code}
    old_status: ${old_status}
    new_status: ${new_status}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${confirmRes.response.body}
  next: end

returnValidationError:
  status: 422
  return: ${validationResult}
  next: end

returnAlreadyConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_confirmed"}'
  next: end

check_confirmRes_persisted:
  switch:
    - condition: ${confirmRes.response == null || confirmRes.response.status < 200 || confirmRes.response.status >= 300 || confirmRes.response.body == null || confirmRes.response.body.length == null || confirmRes.response.body.length === 0}
      next: returnResqlWriteError
  next: extractConfirmResponseData

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end

returnInvalidCharactersPersonalCode:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"personalCode","code":"invalid_characters"}'
  next: end

returnMaxLengthPersonalCode:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"personalCode","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersFirstName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"firstName","code":"invalid_characters"}'
  next: end

returnMaxLengthFirstName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"firstName","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersLastName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"lastName","code":"invalid_characters"}'
  next: end

returnMaxLengthLastName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"lastName","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersPlaceOfBirth:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"placeOfBirth","code":"invalid_characters"}'
  next: end

returnMaxLengthPlaceOfBirth:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"placeOfBirth","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersCertificateNumber:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"certificateNumber","code":"invalid_characters"}'
  next: end

returnMaxLengthCertificateNumber:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"certificateNumber","code":"max_length_exceeded"}'
  next: end
