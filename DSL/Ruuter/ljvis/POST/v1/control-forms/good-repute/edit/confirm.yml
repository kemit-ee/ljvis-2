declaration:

  version: "1.0"
  description: "Confirm (kinnita) a good repute form (hea maine vorm). Confirming re-validates and re-saves current field values, then transitions status saved -> confirmed. One-way: an already-confirmed form cannot be confirmed again (LJVIS2-136)."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: personalCode
        type: string
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: dateOfBirth
        type: string
      - field: placeOfBirth
        type: string
      - field: certificateNumber
        type: string
      - field: certificateIssueDate
        type: string
      - field: certificateCountryCode
        type: string
      - field: fitnessStatus
        type: string
      - field: unfitFromDate
        type: string
      - field: unfitUntilDate
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "confirmed"
    personal_code: "${incoming.body.personalCode || ''}"
    first_name: "${incoming.body.firstName || ''}"
    last_name: "${incoming.body.lastName || ''}"
    date_of_birth: "${incoming.body.dateOfBirth || ''}"
    place_of_birth: "${incoming.body.placeOfBirth || ''}"
    certificate_number: "${incoming.body.certificateNumber || ''}"
    certificate_issue_date: "${incoming.body.certificateIssueDate || ''}"
    certificate_country_code: "${incoming.body.certificateCountryCode || ''}"
    fitness_status: "${incoming.body.fitnessStatus || ''}"
    unfit_from_date: "${incoming.body.unfitFromDate || ''}"
    unfit_until_date: "${incoming.body.unfitUntilDate || ''}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateForm

validateForm:
  template: "templates/form/good-repute/validate-good-repute-form"
  requestType: GET
  body:
    personalCode: ${personal_code}
    firstName: ${first_name}
    lastName: ${last_name}
    dateOfBirth: ${date_of_birth}
    placeOfBirth: ${place_of_birth}
    certificateNumber: ${certificate_number}
    certificateIssueDate: ${certificate_issue_date}
    certificateCountryCode: ${certificate_country_code}
    fitnessStatus: ${fitness_status}
    unfitFromDate: ${unfit_from_date}
    unfitUntilDate: ${unfit_until_date}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: getCurrentFormForStatus

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFormNotAlreadyConfirmed

checkFormNotAlreadyConfirmed:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotAlreadyConfirmedSwitch

checkFormNotAlreadyConfirmedSwitch:
  switch:
    - condition: ${current_status === 'confirmed'}
      next: returnAlreadyConfirmedError
  next: confirmForm

confirmForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/update"
    headers:
      type: json
    body:
      key: ${id}
      status: ${status}
      personalCode: ${personal_code}
      firstName: ${first_name}
      lastName: ${last_name}
      dateOfBirth: ${date_of_birth}
      placeOfBirth: ${place_of_birth}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateCountryCode: ${certificate_country_code}
      fitnessStatus: ${fitness_status}
      unfitFromDate: ${unfit_from_date}
      unfitUntilDate: ${unfit_until_date}
      created_by: ${created_by}
  result: confirmRes
  next: extractConfirmResponseData

extractConfirmResponseData:
  assign:
    good_repute_form_key: "${confirmRes.response.body[0].id || ''}"
    form_number: "${confirmRes.response.body[0].formNumber || ''}"
    old_status: ${current_status}
    new_status: ${status}
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/good-repute/log-good-repute-confirm"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    good_repute_form_key: ${good_repute_form_key}
    personal_code: ${personal_code}
    old_status: ${old_status}
    new_status: ${new_status}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${confirmRes.response.body}
  next: end

returnValidationError:
  status: 422
  return: ${validationResult}
  next: end

returnAlreadyConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_confirmed"}'
  next: end
