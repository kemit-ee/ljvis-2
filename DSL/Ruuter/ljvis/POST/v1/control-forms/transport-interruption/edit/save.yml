declaration:

  version: "1.0"
  description: "Create or update the transport-interruption sub-form (autoveo katkestamise kontrollvorm, LJVIS2-74) — single unified save endpoint, branches internally on presence of id. Requires an already-existing compoundFormKey (created via the normal compound-form flow). Status and the sub-form-number /V version suffix are always computed/controlled server-side and never trust client input. Confirmed/published sub-forms can only be re-saved by a user with control_form.edit_locked."
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: compoundFormKey
        type: number
      - field: headerText
        type: string
      - field: residenceCountry
        type: string
      - field: residenceRegion
        type: string
      - field: residenceCity
        type: string
      - field: residenceAddressLine
        type: string
      - field: residencePostalCode
        type: string
      - field: interruptionReason
        type: string
      - field: legalBases
        type: string
      - field: terminationCondition
        type: string
      - field: personApplications
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    compound_form_key: ${incoming.body.compoundFormKey}
    header_text: "${incoming.body.headerText || ''}"
    residence_country: "${incoming.body.residenceCountry || 'EE'}"
    residence_region: "${incoming.body.residenceRegion || ''}"
    residence_city: "${incoming.body.residenceCity || ''}"
    residence_address_line: "${incoming.body.residenceAddressLine || ''}"
    residence_postal_code: "${incoming.body.residencePostalCode || ''}"
    interruption_reason: "${incoming.body.interruptionReason || ''}"
    legal_bases: "${incoming.body.legalBases || '[]'}"
    termination_condition: "${incoming.body.terminationCondition || ''}"
    person_applications: "${incoming.body.personApplications || ''}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${id == null || id === ''}
      next: checkCompoundFormKeyForCreate
  next: getCurrentFormForStatus

checkCompoundFormKeyForCreate:
  switch:
    - condition: ${compound_form_key == null}
      next: returnMissingCompoundFormKeyError
  next: insertForm

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/insert"
    headers:
      type: json
    body:
      compoundFormKey: ${compound_form_key}
      status: saved
      headerText: ${header_text}
      residenceCountry: ${residence_country}
      residenceRegion: ${residence_region}
      residenceCity: ${residence_city}
      residenceAddressLine: ${residence_address_line}
      residencePostalCode: ${residence_postal_code}
      interruptionReason: ${interruption_reason}
      legalBases: ${legal_bases}
      terminationCondition: ${termination_condition}
      personApplications: ${person_applications}
      created_by: ${created_by}
  result: saveRes
  next: extractInsertResponseData

extractInsertResponseData:
  assign:
    sub_form_key: "${saveRes.response.body[0].id || ''}"
    sub_form_number: "${saveRes.response.body[0].subFormNumber + '/' + saveRes.response.body[0].version}"
  next: getCompoundFormInsert

getCompoundFormInsert:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${compound_form_key}
  result: compoundFormRes
  next: extractDriverCodesInsert

extractDriverCodesInsert:
  assign:
    compound_drivers: "${JSON.parse(compoundFormRes.response.body[0].drivers)}"
  next: extractDriverPersonalCodesInsert

extractDriverPersonalCodesInsert:
  assign:
    driver1_personal_code_ee: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeEe || '') : ''}"
    driver1_personal_code_foreign: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeForeign || '') : ''}"
    driver2_personal_code_ee: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeEe || '') : ''}"
    driver2_personal_code_foreign: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeForeign || '') : ''}"
  next: logAuditEventInsert

logAuditEventInsert:
  template: "templates/audit/form/transport-interruption/log-transport-interruption-create"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    sub_form_key: ${sub_form_key}
    compound_form_key: ${compound_form_key}
    sub_form_number: ${sub_form_number}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
    current_compound_form_key: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].compoundFormKey) || compound_form_key}"
  next: checkFormNotLocked

checkFormNotLocked:
  switch:
    - condition: ${(current_status === 'confirmed' || current_status === 'published') && !(u.permissions != null && u.permissions.includes('control_form.edit_locked'))}
      next: returnFormLockedError
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/update"
    headers:
      type: json
    body:
      key: ${id}
      status: ${current_status}
      headerText: ${header_text}
      residenceCountry: ${residence_country}
      residenceRegion: ${residence_region}
      residenceCity: ${residence_city}
      residenceAddressLine: ${residence_address_line}
      residencePostalCode: ${residence_postal_code}
      interruptionReason: ${interruption_reason}
      legalBases: ${legal_bases}
      terminationCondition: ${termination_condition}
      personApplications: ${person_applications}
      created_by: ${created_by}
  result: saveRes
  next: extractUpdateResponseData

extractUpdateResponseData:
  assign:
    sub_form_key: "${saveRes.response.body[0].id || ''}"
    sub_form_number: "${saveRes.response.body[0].subFormNumber + '/' + saveRes.response.body[0].version}"
  next: getCompoundFormUpdate

getCompoundFormUpdate:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${current_compound_form_key}
  result: compoundFormRes
  next: extractDriverCodesUpdate

extractDriverCodesUpdate:
  assign:
    compound_drivers: "${JSON.parse(compoundFormRes.response.body[0].drivers)}"
  next: extractDriverPersonalCodesUpdate

extractDriverPersonalCodesUpdate:
  assign:
    driver1_personal_code_ee: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeEe || '') : ''}"
    driver1_personal_code_foreign: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeForeign || '') : ''}"
    driver2_personal_code_ee: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeEe || '') : ''}"
    driver2_personal_code_foreign: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeForeign || '') : ''}"
  next: logAuditEventUpdate

logAuditEventUpdate:
  template: "templates/audit/form/transport-interruption/log-transport-interruption-update"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    sub_form_key: ${sub_form_key}
    compound_form_key: ${current_compound_form_key}
    sub_form_number: ${sub_form_number}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${saveRes.response.body}
  next: end

returnMissingCompoundFormKeyError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"compoundFormKey","code":"required"}'
  next: end

returnFormLockedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"form_locked"}'
  next: end
