declaration:

  version: "1.0"
  description: "Publish (avalikusta) the transport-interruption sub-form. Only allowed from confirmed status. Form field values are taken from the current database record — client only provides the id."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: getCurrentForm

getCurrentForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
  next: checkFormIsConfirmed

checkFormIsConfirmed:
  assign:
    current_status: "${currentFormRes.response.body[0].status}"
    compound_form_key: "${currentFormRes.response.body[0].compoundFormKey}"
  next: checkStatusSwitch

checkStatusSwitch:
  switch:
    - condition: ${current_status === 'published'}
      next: returnAlreadyPublishedError
    - condition: ${current_status !== 'confirmed'}
      next: returnNotConfirmedError
  next: extractCurrentFormData

extractCurrentFormData:
  assign:
    header_text: "${currentFormRes.response.body[0].headerText || ''}"
    residence_country: "${currentFormRes.response.body[0].residenceCountry || 'EE'}"
    residence_region: "${currentFormRes.response.body[0].residenceRegion || ''}"
    residence_city: "${currentFormRes.response.body[0].residenceCity || ''}"
    residence_address_line: "${currentFormRes.response.body[0].residenceAddressLine || ''}"
    residence_postal_code: "${currentFormRes.response.body[0].residencePostalCode || ''}"
    interruption_reason: "${currentFormRes.response.body[0].interruptionReason || ''}"
    legal_bases: "${currentFormRes.response.body[0].legalBases || '[]'}"
    termination_condition: "${currentFormRes.response.body[0].terminationCondition || ''}"
    person_applications: "${currentFormRes.response.body[0].personApplications || ''}"
  next: publishForm

publishForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/update"
    headers:
      type: json
    body:
      key: ${id}
      status: published
      headerText: ${header_text}
      residenceCountry: ${residence_country}
      residenceRegion: ${residence_region}
      residenceCity: ${residence_city}
      residenceAddressLine: ${residence_address_line}
      residencePostalCode: ${residence_postal_code}
      interruptionReason: ${interruption_reason}
      legalBases: ${legal_bases}
      terminationCondition: ${termination_condition}
      personApplications: ${person_applications}
      created_by: ${created_by}
  result: publishRes
  next: buildLogDescription

buildLogDescription:
  assign:
    description: "KV alamvorm avalikustatud, alamvormi võti=${id}, koondvormi võti=${compound_form_key}, alamvormi number=${publishRes.response.body[0].subFormNumber}/${publishRes.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.transport_interruption.publish"
    event_category: "control_form"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
    description: ${description}
    log_content: "{\"subFormKey\":${id},\"compoundFormKey\":${compound_form_key}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${publishRes.response.body}
  next: end

returnNotFound:
  status: 404
  return: '{"error": "NOT_FOUND"}'
  next: end

returnAlreadyPublishedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_published"}'
  next: end

returnNotConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"not_confirmed"}'
  next: end
