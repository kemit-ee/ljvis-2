declaration:

  version: "1.0"
  description: "Soft-delete a TRAM control card (tombstone snapshot, status='deleted'). Requires control_form.delete."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: old_status
        type: string

checkDeletePermission:
  switch:
    - condition: ${u.permissions != null && u.permissions.includes('control_form.delete')}
      next: extractRequestData
  next: returnForbidden

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    old_status: "${incoming.body.old_status}"
    status: "deleted"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: deleteForm

deleteForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/delete"
    headers:
      type: json
    body:
      id: ${id}
      status: ${status}
      created_by: ${created_by}
  result: deleteRes
  next: check_deleteRes_persisted

logAuditEvent:
  template: "templates/audit/form/log-form-delete"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: "${deleteRes.response.body[0].formNumber + '/' + deleteRes.response.body[0].version}"
    old_status: ${old_status}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${deleteRes.response.body}
  next: end

returnForbidden:
  status: 403
  return: "forbidden"
  next: end

check_deleteRes_persisted:
  switch:
    - condition: ${deleteRes.response == null || deleteRes.response.status < 200 || deleteRes.response.status >= 300 || deleteRes.response.body == null || deleteRes.response.body.length == null || deleteRes.response.body.length === 0}
      next: returnResqlWriteError
  next: logAuditEvent

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end
