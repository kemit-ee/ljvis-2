declaration:

  version: "1.0"
  description: "Create or update a TRAM control card (Transpordiameti kontrollkaart) — single unified save endpoint, branches internally on presence of id. status and the form_number /V version suffix are always computed server-side. A confirmed/published card can only be re-saved by a user with control_form.edit_locked."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: controlDate
        type: string
      - field: controlTime
        type: string
      - field: controlCountryCode
        type: string
      - field: county
        type: string
      - field: city
        type: string
      - field: road
        type: string
      - field: roadOther
        type: string
      - field: kilometer
        type: string
      - field: address
        type: string
      - field: roadType
        type: string
      - field: roadTaxStatus
        type: string
      - field: roadTaxNotes
        type: string
      - field: vehicleRegNr
        type: string
      - field: vehicleMake
        type: string
      - field: vehicleModel
        type: string
      - field: vehicleCountryCode
        type: string
      - field: vehicleVin
        type: string
      - field: vehicleFirstRegistration
        type: string
      - field: vehicleBodyType
        type: string
      - field: vehicleCategoryCode
        type: string
      - field: vehicleCategoryOther
        type: string
      - field: vehicleMileage
        type: string
      - field: trailers
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: companyCountryCode
        type: string
      - field: companyCounty
        type: string
      - field: companyCity
        type: string
      - field: companyAddress
        type: string
      - field: companyPostalCode
        type: string
      - field: companyOwnerFirstName
        type: string
      - field: companyOwnerLastName
        type: string
      - field: companyActivityLicenceCopyNumber
        type: string
      - field: inspectorFirstName
        type: string
      - field: inspectorLastName
        type: string
      - field: inspectorOrganisationId
        type: string
      - field: inspectorUnit
        type: string
      - field: inspectorProfession
        type: string
      - field: drivers
        type: string
      - field: driverNotApplicable
        type: string
      - field: transportType
        type: string
      - field: transportEmptyRun
        type: string
      - field: transportNature
        type: string
      - field: transportNatureExempt
        type: string
      - field: transportClasses
        type: string
      - field: cabotageViolations
        type: string
      - field: resultType
        type: string
      - field: additionalMeasure
        type: string
      - field: proceedingType
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: documentChecks
        type: string
      - field: otherDocuments
        type: string
      - field: spApplicability
        type: string
      - field: tachographTypeCode
        type: string
      - field: tachographDataNotDownloaded
        type: string
      - field: checkedDaysCount
        type: string
      - field: workDaysCount
        type: string
      - field: otherActivityDaysCount
        type: string
      - field: violations5612006
        type: string
      - field: violations1652014
        type: string
      - field: violations200215
        type: string
      - field: violations5932008
        type: string
      - field: violations20201057
        type: string
      - field: erruPoints
        type: string
      - field: liiniNumber
        type: string
      - field: liiniNimetus
        type: string
      - field: files
        type: string
      - field: notes
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    control_date: "${incoming.body.controlDate || ''}"
    control_time: "${incoming.body.controlTime || ''}"
    control_country_code: "${incoming.body.controlCountryCode || ''}"
    county: "${incoming.body.county || ''}"
    city: "${incoming.body.city || ''}"
    road: "${incoming.body.road || ''}"
    road_other: "${incoming.body.roadOther || ''}"
    kilometer: "${incoming.body.kilometer || ''}"
    address: "${incoming.body.address || ''}"
    road_type: "${incoming.body.roadType || ''}"
    road_tax_status: "${incoming.body.roadTaxStatus || ''}"
    road_tax_notes: "${incoming.body.roadTaxNotes || ''}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr || ''}"
    vehicle_make: "${incoming.body.vehicleMake || ''}"
    vehicle_model: "${incoming.body.vehicleModel || ''}"
    vehicle_country_code: "${incoming.body.vehicleCountryCode || ''}"
    vehicle_vin: "${incoming.body.vehicleVin || ''}"
    vehicle_first_registration: "${incoming.body.vehicleFirstRegistration || ''}"
    vehicle_body_type: "${incoming.body.vehicleBodyType || ''}"
    vehicle_category_code: "${incoming.body.vehicleCategoryCode || ''}"
    vehicle_category_other: "${incoming.body.vehicleCategoryOther || ''}"
    vehicle_mileage: "${incoming.body.vehicleMileage || ''}"
    trailers: "${incoming.body.trailers || '[]'}"
    company_reg_code: "${incoming.body.companyRegCode || ''}"
    company_name: "${incoming.body.companyName || ''}"
    company_country_code: "${incoming.body.companyCountryCode || ''}"
    company_county: "${incoming.body.companyCounty || ''}"
    company_city: "${incoming.body.companyCity || ''}"
    company_address: "${incoming.body.companyAddress || ''}"
    company_postal_code: "${incoming.body.companyPostalCode || ''}"
    company_owner_first_name: "${incoming.body.companyOwnerFirstName || ''}"
    company_owner_last_name: "${incoming.body.companyOwnerLastName || ''}"
    company_activity_licence_copy_number: "${incoming.body.companyActivityLicenceCopyNumber || ''}"
    inspector_first_name: "${incoming.body.inspectorFirstName || ''}"
    inspector_last_name: "${incoming.body.inspectorLastName || ''}"
    inspector_organisation_id: "${incoming.body.inspectorOrganisationId || ''}"
    inspector_unit: "${incoming.body.inspectorUnit || ''}"
    inspector_profession: "${incoming.body.inspectorProfession || ''}"
    drivers: "${incoming.body.drivers || '[]'}"
    driver_not_applicable: "${incoming.body.driverNotApplicable || 'false'}"
    transport_type: "${incoming.body.transportType || ''}"
    transport_empty_run: "${incoming.body.transportEmptyRun || 'false'}"
    transport_nature: "${incoming.body.transportNature || ''}"
    transport_nature_exempt: "${incoming.body.transportNatureExempt || 'false'}"
    transport_classes: "${incoming.body.transportClasses || '[]'}"
    cabotage_violations: "${incoming.body.cabotageViolations || '[]'}"
    result_type: "${incoming.body.resultType || ''}"
    additional_measure: "${incoming.body.additionalMeasure || ''}"
    proceeding_type: "${incoming.body.proceedingType || ''}"
    proceeding_reference_number: "${incoming.body.proceedingReferenceNumber || ''}"
    document_checks: "${incoming.body.documentChecks || '[]'}"
    other_documents: "${incoming.body.otherDocuments || '[]'}"
    sp_applicability: "${incoming.body.spApplicability || ''}"
    tachograph_type_code: "${incoming.body.tachographTypeCode || ''}"
    tachograph_data_not_downloaded: "${incoming.body.tachographDataNotDownloaded || 'false'}"
    checked_days_count: "${incoming.body.checkedDaysCount || ''}"
    work_days_count: "${incoming.body.workDaysCount || ''}"
    other_activity_days_count: "${incoming.body.otherActivityDaysCount || ''}"
    violations_561_2006: "${incoming.body.violations5612006 || '[]'}"
    violations_165_2014: "${incoming.body.violations1652014 || '[]'}"
    violations_2002_15: "${incoming.body.violations200215 || '[]'}"
    violations_593_2008: "${incoming.body.violations5932008 || '[]'}"
    violations_2020_1057: "${incoming.body.violations20201057 || '[]'}"
    erru_points: "${incoming.body.erruPoints || '[]'}"
    liini_number: "${incoming.body.liiniNumber || ''}"
    liini_nimetus: "${incoming.body.liiniNimetus || ''}"
    files: "${incoming.body.files || '[]'}"
    notes: "${incoming.body.notes || ''}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateForm

validateForm:
  template: "templates/form/tram-card/validate-tram-card-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    controlDate: ${control_date}
    drivers: ${drivers}
    driverNotApplicable: ${driver_not_applicable}
    proceedingType: ${proceeding_type}
    proceedingReferenceNumber: ${proceeding_reference_number}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: checkIsCreate

checkIsCreate:
  switch:
    - condition: ${id == null || id === ''}
      next: insertForm
  next: getCurrentFormForStatus

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/insert"
    headers:
      type: json
    body:
      status: saved
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      roadType: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddress: ${company_address}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      drivers: ${drivers}
      driverNotApplicable: ${driver_not_applicable}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      erruPoints: ${erru_points}
      liiniNumber: ${liini_number}
      liiniNimetus: ${liini_nimetus}
      files: ${files}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkSaved

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotLocked

checkFormNotLocked:
  switch:
    - condition: ${(current_status === 'confirmed' || current_status === 'published') && !(u.permissions != null && u.permissions.includes('control_form.edit_locked'))}
      next: returnFormLockedError
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/update"
    headers:
      type: json
    body:
      key: ${id}
      status: ${current_status}
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      roadType: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddress: ${company_address}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      drivers: ${drivers}
      driverNotApplicable: ${driver_not_applicable}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      erruPoints: ${erru_points}
      liiniNumber: ${liini_number}
      liiniNimetus: ${liini_nimetus}
      files: ${files}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkSaved

checkSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.tram_control_card.save"
    event_category: "control_form_management"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
    description: "TRAM kontrollkaart salvestatud, number=${saveRes.response.body[0].formNumber}/${saveRes.response.body[0].version}"
    log_content: "{\"tramControlCardKey\":${saveRes.response.body[0].id},\"formNumber\":\"${saveRes.response.body[0].formNumber}\",\"version\":${saveRes.response.body[0].version}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${saveRes.response.body}
  next: end

returnResqlSaveError:
  status: 500
  return: "${(saveRes.response != null && saveRes.response.body) || {type: 'RESQL_ERROR', code: 'save_failed', message: 'Vormi salvestamine andmebaasi ebaõnnestus'}}"
  next: end

returnValidationError:
  status: 422
  return: ${validationResult}
  next: end

returnFormLockedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"form_locked_after_confirm"}'
  next: end

returnNotFound:
  status: 404
  return: '{"error":"NOT_FOUND"}'
  next: end
