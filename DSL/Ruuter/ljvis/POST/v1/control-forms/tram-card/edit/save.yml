    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_activity_licence_copy_number == null ? "" : company_activity_licence_copy_number))}'
      next: returnInvalidCharactersCompanyActivityLicenceCopyNumber
    - condition: '${String(company_activity_licence_copy_number == null ? "" : company_activity_licence_copy_number).length > 50}'
      next: returnMaxLengthCompanyActivityLicenceCopyNumber
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_first_name == null ? "" : inspector_first_name))}'
      next: returnInvalidCharactersInspectorFirstName
    - condition: '${String(inspector_first_name == null ? "" : inspector_first_name).length > 100}'
      next: returnMaxLengthInspectorFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_last_name == null ? "" : inspector_last_name))}'
      next: returnInvalidCharactersInspectorLastName
    - condition: '${String(inspector_last_name == null ? "" : inspector_last_name).length > 100}'
      next: returnMaxLengthInspectorLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_unit == null ? "" : inspector_unit))}'
      next: returnInvalidCharactersInspectorUnit
    - condition: '${String(inspector_unit == null ? "" : inspector_unit).length > 200}'
      next: returnMaxLengthInspectorUnit
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_profession == null ? "" : inspector_profession))}'
      next: returnInvalidCharactersInspectorProfession
    - condition: '${String(inspector_profession == null ? "" : inspector_profession).length > 200}'
      next: returnMaxLengthInspectorProfession
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(additional_measure == null ? "" : additional_measure))}'
      next: returnInvalidCharactersAdditionalMeasure
    - condition: '${String(additional_measure == null ? "" : additional_measure).length > 50}'
      next: returnMaxLengthAdditionalMeasure
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(proceeding_reference_number == null ? "" : proceeding_reference_number))}'
      next: returnInvalidCharactersProceedingReferenceNumber
    - condition: '${String(proceeding_reference_number == null ? "" : proceeding_reference_number).length > 50}'
      next: returnMaxLengthProceedingReferenceNumber
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(tachograph_notes == null ? "" : tachograph_notes))}'
      next: returnInvalidCharactersTachographNotes
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(liini_number == null ? "" : liini_number))}'
      next: returnInvalidCharactersLiiniNumber
    - condition: '${String(liini_number == null ? "" : liini_number).length > 100}'
      next: returnMaxLengthLiiniNumber
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(liini_nimetus == null ? "" : liini_nimetus))}'
      next: returnInvalidCharactersLiiniNimetus
    - condition: '${String(liini_nimetus == null ? "" : liini_nimetus).length > 255}'
      next: returnMaxLengthLiiniNimetus
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(notes == null ? "" : notes))}'
      next: returnInvalidCharactersNotes
  next: validateForm

validateForm:
  template: "templates/form/tram-card/validate-tram-card-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    controlDate: ${control_date}
    drivers: ${drivers}
    driverNotApplicable: ${driver_not_applicable}
    proceedingType: ${proceeding_type}
    proceedingReferenceNumber: ${proceeding_reference_number}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: checkIsCreate

checkIsCreate:
  switch:
    - condition: ${id == null || id === ''}
      next: insertForm
  next: getCurrentFormForStatus

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/insert"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      status: saved
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      road_type: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddressLine1: ${company_address}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      drivers: ${drivers}
      driverNotApplicable: ${driver_not_applicable}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      tachographNotes: ${tachograph_notes}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      erruPoints: ${erru_points}
      liiniNumber: ${liini_number}
      liiniNimetus: ${liini_nimetus}
      files: ${files}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkSaved

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotLocked

checkFormNotLocked:
  switch:
    - condition: ${(current_status === 'confirmed' || current_status === 'published') && !(u.permissions != null && u.permissions.includes('control_form.edit_locked'))}
      next: returnFormLockedError
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/update"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${incoming.body.revision == null || incoming.body.revision === '' ? '' : String(incoming.body.revision)}"
      status: ${current_status}
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      road_type: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddressLine1: ${company_address}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      drivers: ${drivers}
      driverNotApplicable: ${driver_not_applicable}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      tachographNotes: ${tachograph_notes}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      erruPoints: ${erru_points}
      liiniNumber: ${liini_number}
      liiniNimetus: ${liini_nimetus}
      files: ${files}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkFormModified

# Optimistlik lukk: kui kasutaja nähtud revision ei ole enam uusim, lisab update.sql 0 rida
# (tühi vastus) - see on konflikt, mitte salvestusviga.
checkFormModified:
  switch:
    - condition: ${saveRes.response != null && saveRes.response.status >= 200 && saveRes.response.status < 300 && Array.isArray(saveRes.response.body) && saveRes.response.body.length === 0 && incoming.body.revision != null && incoming.body.revision !== ''}
      next: returnFormModifiedError
  next: checkSaved

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

checkSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.tram_control_card.save"
    event_category: "control_form_management"
    description: "TRAM kontrollkaart salvestatud, number=${saveRes.response.body[0].formNumber}/${saveRes.response.body[0].version}"
    log_content: "{\"tramControlCardKey\":${saveRes.response.body[0].id},\"formNumber\":\"${saveRes.response.body[0].formNumber}\",\"version\":${saveRes.response.body[0].version}}"
  result: audit_result
  next: recalcRiskOnResave

# Avalikustatud vormi muutmine-salvestamine lisab uue avalikustatud versiooni, mis on
# riskiskoori sisend - skoor arvutatakse ümber samamoodi nagu publish.yml-is, mitte
# alles öise cron'iga. Viga ei tohi salvestamist tagasi pöörata.
recalcRiskOnResave:
  switch:
    - condition: ${current_status === 'published' && /^[0-9]{8}$/.test('' + (company_reg_code || ''))}
      next: callRiskRecalcOnResave
  next: checkNotifyOnResave

callRiskRecalcOnResave:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/risk-scores/recalculate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      company_reg_code: ${company_reg_code}
      calculation_trigger: "kontrollvorm"
  result: riskRecalcRes
  error: checkNotifyOnResave
  next: checkNotifyOnResave

# Avalikustatud vormi muutmine-salvestamine on samuti avalikustamise sündmus
# teavituste mõttes - publish.yml-iga sama kontroll, aga event_key sisaldab
# uut version'it, nii et teavitus ei jää dubleerimiskontrolli taha kinni.
checkNotifyOnResave:
  switch:
    - condition: ${current_status === 'published'}
      next: checkSeriousInfringementResave
  next: returnSuccess

checkSeriousInfringementResave:
  switch:
    - condition: >-
        ${(function(t) { return /(^|[^A-Z])(MSI|VSI|SI|MI)[ _-]*[0-9]/.test(t) || /"severityCode"\s*:\s*"(MSI|VSI|SI|MI)"/.test(t); })([violations_561_2006, violations_165_2014, violations_2002_15, violations_593_2008, violations_2020_1057, cabotage_violations, erru_points].join(' '))}
      next: createSeriousInfringementResave
  next: returnSuccess

createSeriousInfringementResave:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      type: "serious_infringement"
      required_permission: "rsi.read"
      related_entity_type: "tram_control_card"
      related_entity_id: ${id}
      event_key: "${'tram-control-card:' + id + ':' + saveRes.response.body[0].version + ':serious'}"
      title_et: "${'Saabus teade Eestis avastatud raske rikkumise kohta vedaja „' + company_name + '“ kontrollimisel'}"
      body_et: "${'Sõiduk: ' + vehicle_reg_nr}"
      created_by: ${actor_personal_code}
  result: seriousNotifResResave
  error: returnSuccess
  next: returnSuccess

returnSuccess:
  return: ${saveRes.response.body}
  next: end

returnResqlSaveError:
  status: 500
  return: "${(saveRes.response != null && saveRes.response.body) || {type: 'RESQL_ERROR', code: 'save_failed', message: 'Vormi salvestamine andmebaasi ebaõnnestus'}}"
  next: end

