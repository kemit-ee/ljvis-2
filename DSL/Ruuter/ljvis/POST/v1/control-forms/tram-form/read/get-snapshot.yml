declaration:

  version: "1.0"
  description: "Get version history snapshot for a compound form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "Compound form key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_key: "${incoming.body.formKey}"
  next: getSnapshots

getSnapshots:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-form/get-snapshot"
    headers:
      type: json
    body:
      id: ${id}
      form_key: ${form_key}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_compound_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
