declaration:

  version: "1.0"
  description: "Get version history snapshot for a compound form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "Compound form key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_key: "${incoming.body.formKey}"
  next: getSnapshots

getSnapshots:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get-snapshot"
    headers:
      type: json
    body:
      id: ${id}
      form_key: ${form_key}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: mapResponse

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshot"
    headers:
      type: json
    body:
      formType: "compound-form"
      id: ${id}
  result: archiveRes
  next: mapResponseArchive

mapResponseArchive:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_compound_form"
    headers:
      type: json
    body:
      forms: "${(archiveRes.response.body && archiveRes.response.body[0]) ? [archiveRes.response.body[0].payload] : []}"
  result: mapped
  next: returnSuccess

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_compound_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
