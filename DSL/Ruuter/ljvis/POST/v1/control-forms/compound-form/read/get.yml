declaration:

  version: "1.0"
  description: "Get a single compound form by ID"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: number
        description: "Compound form ID"

getActorFromTim:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: timRes
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    actor_personal_code: "${timRes.response.body.personalCode || ''}"
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body.length != 1}
      next: returnNotFound
  next: extractFormData

extractFormData:
  assign:
    form_number: "${res.response.body[0].formNumber}"
    created_by: "${res.response.body[0].createdBy}"
    drivers: ${JSON.parse(res.response.body[0].drivers)}
  next: extractDriverCodes

extractDriverCodes:
  assign:
    driver1_personal_code_ee: "${drivers[0].personalCodeEe || ''}"
    driver1_personal_code_foreign: "${drivers[0].personalCodeForeign || ''}"
    driver2_personal_code_ee: "${drivers[1] != null ? drivers[1].personalCodeEe || '' : ''}"
    driver2_personal_code_foreign: "${drivers[1] != null ? drivers[1].personalCodeForeign || '' : ''}"
  next: checkShouldLog

checkShouldLog:
  switch:
    - condition: ${actor_personal_code != created_by}
      next: logAuditEvent
  next: mapResponse

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/form/compound-form/log-compound-view"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_key: ${id}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_compound_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnNotFound:
  status: 404
  return: "form not found"
  next: end
