declaration:
  call: declare
  version: 0.1
  description: "Get a presigned download URL for a compound form file attachment"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

get_user_context:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: auth_user
  next: downloadFile

downloadFile:
  template: "[#LJVIS_PROJECT_LAYER]/files/download"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: ${incoming.body.id}
    form_type: "compound-form"
    actor_name: "${auth_user.response.body.firstName || ''} ${auth_user.response.body.lastName || ''}"
    actor_personal_code: "${auth_user.response.body.personalCode || ''}"
  result: downloadResult
  next: returnSuccess

returnSuccess:
  return: ${downloadResult}
  status: 200
  next: end
