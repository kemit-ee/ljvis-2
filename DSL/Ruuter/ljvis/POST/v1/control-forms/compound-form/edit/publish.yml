declaration:

  version: "1.0"
  description: "Publish (avalikusta) compound form. Only allowed once no active sub-form is left unpublished (the general part is never published on its own). Form field values are taken from the current database record — client only provides the id. The logic lives in templates/form/compound-form/publish-compound-form, which the sub-form publish handlers also use to auto-publish the general part."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: publishCompound

publishCompound:
  template: "templates/form/compound-form/publish-compound-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: ${id}
    only_if_confirmed: "false"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
  result: publishResult
  next: parseResult

parseResult:
  assign:
    parsed_result: ${JSON.parse(publishResult)}
  next: checkOutcome

checkOutcome:
  switch:
    - condition: ${parsed_result.outcome === 'published'}
      next: returnSuccess
    - condition: ${parsed_result.outcome === 'not_found'}
      next: returnNotFound
    - condition: ${parsed_result.outcome === 'subforms_not_published'}
      next: returnSubFormsNotPublished
  next: returnResqlWriteError

returnSuccess:
  return: ${parsed_result.body}
  next: end

returnNotFound:
  status: 404
  return: '{"error": "NOT_FOUND"}'
  next: end

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end

returnSubFormsNotPublished:
  status: 422
  return: '{"type":"SUBFORMS_NOT_PUBLISHED","code":"subforms_not_published","message":"Koondvormi üldosa saab avalikustada alles siis, kui kõik alamvormid on avalikustatud"}'
  next: end
