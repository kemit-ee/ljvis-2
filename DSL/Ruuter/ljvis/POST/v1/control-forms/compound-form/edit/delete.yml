declaration:

  version: "1.0"
  description: "Delete compound form"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: form_number
        type: string
      - field: old_status
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_number: "${incoming.body.form_number}"
    old_status: "${incoming.body.old_status}"
    status: "deleted"
    created_by: "${auth_user.personalcode}"
  next: deleteForm

deleteForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/delete"
    headers:
      type: json
    body:
      id: ${id}
      status: ${status}
      created_by: ${created_by}
  result: deleteRes
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/form/log-form-delete"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${form_number}
    old_status: ${old_status}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${deleteRes.response.body}
  next: end
