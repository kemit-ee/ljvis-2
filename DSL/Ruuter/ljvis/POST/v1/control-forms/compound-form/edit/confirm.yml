returnInvalidCharactersCompanyRegCode:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyRegCode","code":"invalid_characters"}'
  next: end

returnMaxLengthCompanyRegCode:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyRegCode","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersCompanyName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyName","code":"invalid_characters"}'
  next: end

returnMaxLengthCompanyName:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyName","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersCompanyCounty:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyCounty","code":"invalid_characters"}'
  next: end

returnMaxLengthCompanyCounty:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"companyCounty","code":"max_length_exceeded"}'
  next: end

