  next: end

returnInvalidCharactersVehicleRegNr:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"vehicleRegNr","code":"invalid_characters"}'
  next: end

returnMaxLengthVehicleRegNr:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"vehicleRegNr","code":"max_length_exceeded"}'
  next: end

