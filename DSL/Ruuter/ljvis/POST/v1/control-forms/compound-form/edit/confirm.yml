declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Confirm compound form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: revision
        type: integer
      - field: controlDate
        type: string
      - field: controlTime
        type: string
      - field: controlCountryCode
        type: string
      - field: county
        type: string
      - field: city
        type: string
      - field: road
        type: string
      - field: roadOther
        type: string
      - field: kilometer
        type: string
      - field: address
        type: string
      - field: road_type
        type: string
      - field: roadTaxStatus
        type: string
      - field: roadTaxNotes
        type: string
      - field: vehicleRegNr
        type: string
      - field: vehicleMake
        type: string
      - field: vehicleModel
        type: string
      - field: vehicleCountryCode
        type: string
      - field: vehicleVin
        type: string
      - field: vehicleFirstRegistration
        type: string
      - field: vehicleBodyType
        type: string
      - field: vehicleCategoryCode
        type: string
      - field: vehicleCategoryOther
        type: string
      - field: vehicleMileage
        type: string
      - field: trailers
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: companyCountryCode
        type: string
      - field: companyCounty
        type: string
      - field: companyCity
        type: string
      - field: companyAddressLine1
        type: string
      - field: companyPostalCode
        type: string
      - field: companyOwnerFirstName
        type: string
      - field: companyOwnerLastName
        type: string
      - field: companyActivityLicenceCopyNumber
        type: string
      - field: drivers
        type: string
      - field: inspectorFirstName
        type: string
      - field: inspectorLastName
        type: string
      - field: inspectorOrganisationId
        type: string
      - field: inspectorUnit
        type: string
      - field: inspectorProfession
        type: string
      - field: driver1PersonalCodeEe
        type: string
      - field: driver1PersonalCodeForeign
        type: string
      - field: driver2PersonalCodeEe
        type: string
      - field: driver2PersonalCodeForeign
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    key: "${incoming.body.id}"
    status: "confirmed"
    control_date: "${incoming.body.controlDate}"
    control_time: "${incoming.body.controlTime}"
    control_country_code: "${incoming.body.controlCountryCode}"
    county: "${incoming.body.county}"
    city: "${incoming.body.city}"
    road: "${incoming.body.road}"
    road_other: "${incoming.body.roadOther}"
    kilometer: "${incoming.body.kilometer}"
    address: "${incoming.body.address}"
    road_type: "${incoming.body.road_type}"
    road_tax_status: "${incoming.body.roadTaxStatus}"
    road_tax_notes: "${incoming.body.roadTaxNotes}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr}"
    vehicle_make: "${incoming.body.vehicleMake}"
    vehicle_model: "${incoming.body.vehicleModel}"
    vehicle_country_code: "${incoming.body.vehicleCountryCode}"
    vehicle_vin: "${incoming.body.vehicleVin}"
    vehicle_first_registration: "${incoming.body.vehicleFirstRegistration}"
    vehicle_body_type: "${incoming.body.vehicleBodyType}"
    vehicle_category_code: "${incoming.body.vehicleCategoryCode}"
    vehicle_category_other: "${incoming.body.vehicleCategoryOther}"
    vehicle_mileage: "${incoming.body.vehicleMileage}"
    trailers: "${incoming.body.trailers}"
    company_reg_code: "${incoming.body.companyRegCode}"
    company_name: "${incoming.body.companyName}"
    company_country_code: "${incoming.body.companyCountryCode}"
    company_county: "${incoming.body.companyCounty}"
    company_city: "${incoming.body.companyCity}"
    company_address_line1: "${incoming.body.companyAddressLine1}"
    company_postal_code: "${incoming.body.companyPostalCode}"
    company_owner_first_name: "${incoming.body.companyOwnerFirstName}"
    company_owner_last_name: "${incoming.body.companyOwnerLastName}"
    company_activity_licence_copy_number: "${incoming.body.companyActivityLicenceCopyNumber}"
    drivers: "${incoming.body.drivers}"
    driver1_personal_code_ee: "${incoming.body.driver1PersonalCodeEe}"
    driver1_personal_code_foreign: "${incoming.body.driver1PersonalCodeForeign}"
    driver2_personal_code_ee: "${incoming.body.driver2PersonalCodeEe}"
    driver2_personal_code_foreign: "${incoming.body.driver2PersonalCodeForeign}"
    inspector_first_name: "${incoming.body.inspectorFirstName}"
    inspector_last_name: "${incoming.body.inspectorLastName}"
    inspector_organisation_id: "${incoming.body.inspectorOrganisationId}"
    inspector_unit: "${incoming.body.inspectorUnit}"
    inspector_profession: "${incoming.body.inspectorProfession}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateTextFields

validateTextFields:
  switch:
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(county == null ? "" : county))}'
      next: returnInvalidCharactersCounty
    - condition: '${String(county == null ? "" : county).length > 100}'
      next: returnMaxLengthCounty
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(city == null ? "" : city))}'
      next: returnInvalidCharactersCity
    - condition: '${String(city == null ? "" : city).length > 50}'
      next: returnMaxLengthCity
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(road == null ? "" : road))}'
      next: returnInvalidCharactersRoad
    - condition: '${String(road == null ? "" : road).length > 200}'
      next: returnMaxLengthRoad
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(road_other == null ? "" : road_other))}'
      next: returnInvalidCharactersRoadOther
    - condition: '${String(road_other == null ? "" : road_other).length > 200}'
      next: returnMaxLengthRoadOther
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(address == null ? "" : address))}'
      next: returnInvalidCharactersAddress
    - condition: '${String(address == null ? "" : address).length > 300}'
      next: returnMaxLengthAddress
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(road_tax_notes == null ? "" : road_tax_notes))}'
      next: returnInvalidCharactersRoadTaxNotes
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(vehicle_reg_nr == null ? "" : vehicle_reg_nr))}'
      next: returnInvalidCharactersVehicleRegNr
    - condition: '${String(vehicle_reg_nr == null ? "" : vehicle_reg_nr).length > 20}'
      next: returnMaxLengthVehicleRegNr
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(vehicle_make == null ? "" : vehicle_make))}'
      next: returnInvalidCharactersVehicleMake
    - condition: '${String(vehicle_make == null ? "" : vehicle_make).length > 100}'
      next: returnMaxLengthVehicleMake
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(vehicle_model == null ? "" : vehicle_model))}'
      next: returnInvalidCharactersVehicleModel
    - condition: '${String(vehicle_model == null ? "" : vehicle_model).length > 100}'
      next: returnMaxLengthVehicleModel
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(vehicle_vin == null ? "" : vehicle_vin))}'
      next: returnInvalidCharactersVehicleVin
    - condition: '${String(vehicle_vin == null ? "" : vehicle_vin).length > 17}'
      next: returnMaxLengthVehicleVin
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(vehicle_category_other == null ? "" : vehicle_category_other))}'
      next: returnInvalidCharactersVehicleCategoryOther
    - condition: '${String(vehicle_category_other == null ? "" : vehicle_category_other).length > 100}'
      next: returnMaxLengthVehicleCategoryOther
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_reg_code == null ? "" : company_reg_code))}'
      next: returnInvalidCharactersCompanyRegCode
    - condition: '${String(company_reg_code == null ? "" : company_reg_code).length > 20}'
      next: returnMaxLengthCompanyRegCode
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_name == null ? "" : company_name))}'
      next: returnInvalidCharactersCompanyName
    - condition: '${String(company_name == null ? "" : company_name).length > 300}'
      next: returnMaxLengthCompanyName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_county == null ? "" : company_county))}'
      next: returnInvalidCharactersCompanyCounty
    - condition: '${String(company_county == null ? "" : company_county).length > 100}'
      next: returnMaxLengthCompanyCounty
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_city == null ? "" : company_city))}'
      next: returnInvalidCharactersCompanyCity
    - condition: '${String(company_city == null ? "" : company_city).length > 50}'
      next: returnMaxLengthCompanyCity
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_address_line1 == null ? "" : company_address_line1))}'
      next: returnInvalidCharactersCompanyAddressLine1
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_postal_code == null ? "" : company_postal_code))}'
      next: returnInvalidCharactersCompanyPostalCode
    - condition: '${String(company_postal_code == null ? "" : company_postal_code).length > 20}'
      next: returnMaxLengthCompanyPostalCode
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_owner_first_name == null ? "" : company_owner_first_name))}'
      next: returnInvalidCharactersCompanyOwnerFirstName
    - condition: '${String(company_owner_first_name == null ? "" : company_owner_first_name).length > 100}'
      next: returnMaxLengthCompanyOwnerFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_owner_last_name == null ? "" : company_owner_last_name))}'
      next: returnInvalidCharactersCompanyOwnerLastName
    - condition: '${String(company_owner_last_name == null ? "" : company_owner_last_name).length > 100}'
      next: returnMaxLengthCompanyOwnerLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(company_activity_licence_copy_number == null ? "" : company_activity_licence_copy_number))}'
      next: returnInvalidCharactersCompanyActivityLicenceCopyNumber
    - condition: '${String(company_activity_licence_copy_number == null ? "" : company_activity_licence_copy_number).length > 100}'
      next: returnMaxLengthCompanyActivityLicenceCopyNumber
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_first_name == null ? "" : inspector_first_name))}'
      next: returnInvalidCharactersInspectorFirstName
    - condition: '${String(inspector_first_name == null ? "" : inspector_first_name).length > 100}'
      next: returnMaxLengthInspectorFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_last_name == null ? "" : inspector_last_name))}'
      next: returnInvalidCharactersInspectorLastName
    - condition: '${String(inspector_last_name == null ? "" : inspector_last_name).length > 100}'
      next: returnMaxLengthInspectorLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_unit == null ? "" : inspector_unit))}'
      next: returnInvalidCharactersInspectorUnit
    - condition: '${String(inspector_unit == null ? "" : inspector_unit).length > 100}'
      next: returnMaxLengthInspectorUnit
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(inspector_profession == null ? "" : inspector_profession))}'
      next: returnInvalidCharactersInspectorProfession
    - condition: '${String(inspector_profession == null ? "" : inspector_profession).length > 150}'
      next: returnMaxLengthInspectorProfession
  next: check_driver1_personal_code_not_empty

check_driver1_personal_code_not_empty:
  switch:
    - condition: ${driver1_personal_code_ee == null || driver1_personal_code_ee == ''}
      next: skip_pc1_validation
  next: validate_driver1_personal_code_format

skip_pc1_validation:
  assign:
    pc1_result: valid
  next: check_driver2_personal_code_not_empty

validate_driver1_personal_code_format:
  template: "templates/validate/estonian-personal-code"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    personal_code: ${driver1_personal_code_ee}
  result: pc1_result
  next: check_driver2_personal_code_not_empty

check_driver2_personal_code_not_empty:
  switch:
    - condition: ${driver2_personal_code_ee == null || driver2_personal_code_ee == ''}
      next: skip_pc2_validation
  next: validate_driver2_personal_code_format

skip_pc2_validation:
  assign:
    pc2_result: valid
  next: check_pc_results

validate_driver2_personal_code_format:
  template: "templates/validate/estonian-personal-code"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    personal_code: ${driver2_personal_code_ee}
  result: pc2_result
  next: check_pc_results

check_pc_results:
  switch:
    - condition: ${pc1_result != 'valid'}
      next: propagate_pc1_error
    - condition: ${pc2_result != 'valid'}
      next: propagate_pc2_error
  next: confirmForm

confirmForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/update"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${key}
      expected_revision: "${incoming.body.revision == null || incoming.body.revision === '' ? '' : String(incoming.body.revision)}"
      status: ${status}
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      road_type: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddressLine1: ${company_address_line1}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      drivers: ${drivers}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      created_by: ${created_by}
  result: confirmRes
  next: checkFormModified

# Optimistlik lukk: kui kasutaja nähtud revision ei ole enam uusim, lisab update.sql 0 rida
# (tühi vastus) - see on konflikt, mitte salvestusviga.
checkFormModified:
  switch:
    - condition: ${confirmRes.response != null && confirmRes.response.status >= 200 && confirmRes.response.status < 300 && Array.isArray(confirmRes.response.body) && confirmRes.response.body.length === 0 && incoming.body.revision != null && incoming.body.revision !== ''}
      next: returnFormModifiedError
  next: check_confirmRes_persisted

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

extractResponseData:
  assign:
    compound_form_key: "${confirmRes.response.body[0].id || ''}"
  next: checkDriver1AjLog

# Andmejälgija (AJ) - logi Eesti isikukoodi alusel tuvastatud juhtide andmete
# esmakordne registreerimine LJVIS2-sse. Välisriigi juhte (personalCodeForeign)
# ei logita, kuna AJ nõuab Eesti isikukoodi formaati. Töötlejana näidatakse
# LJVIS2 vastutavat töötlejat Kliimaministeeriumi (70001231).
checkDriver1AjLog:
  switch:
    - condition: "${driver1_personal_code_ee == null || driver1_personal_code_ee == ''}"
      next: checkDriver2AjLog
  next: logAjDriver1

logAjDriver1:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/aj/log_usage"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      user_code: "${driver1_personal_code_ee}"
      action: "Juhi isikuandmete registreerimine liiklusjärelevalve teekontrolli protokollis (koondvorm kinnitatud)"
      receiver_code: "70001231"
      receiver_name: "Kliimaministeerium"
      receiver_system: "Liiklusjärelevalve infosüsteem (LJVIS2)"
  result: ajLog1Result
  next: checkDriver2AjLog

checkDriver2AjLog:
  switch:
    - condition: "${driver2_personal_code_ee == null || driver2_personal_code_ee == ''}"
      next: buildLogDescription
  next: logAjDriver2

logAjDriver2:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/aj/log_usage"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      user_code: "${driver2_personal_code_ee}"
      action: "Juhi isikuandmete registreerimine liiklusjärelevalve teekontrolli protokollis (koondvorm kinnitatud)"
      receiver_code: "70001231"
      receiver_name: "Kliimaministeerium"
      receiver_system: "Liiklusjärelevalve infosüsteem (LJVIS2)"
  result: ajLog2Result
  next: buildLogDescription

buildLogDescription:
  assign:
    description: "Koondvorm kinnitatud, koondvormi võti=${compound_form_key}, koondvormi number=${(confirmRes.response.body[0].formNumber)}/${(confirmRes.response.body[0].version)}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.compound_form.confirm"
    event_category: "control_form"
    description: ${description}
    log_content: "{\"compoundFormKey\":${compound_form_key}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${confirmRes.response.body}
  next: end

propagate_pc1_error:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"drivers[0].personalCodeEe","code":"invalid_personal_code"}'
  next: end

propagate_pc2_error:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"drivers[1].personalCodeEe","code":"invalid_personal_code"}'
  next: end

check_confirmRes_persisted:
  switch:
    - condition: ${confirmRes.response == null || confirmRes.response.status < 200 || confirmRes.response.status >= 300 || confirmRes.response.body == null || confirmRes.response.body.length == null || confirmRes.response.body.length === 0}
      next: returnResqlWriteError
  next: extractResponseData

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end

returnInvalidCharactersCounty:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"county","code":"invalid_characters"}'
  next: end

returnMaxLengthCounty:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"county","code":"max_length_exceeded"}'
  next: end

returnInvalidCharactersCity:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"city","code":"invalid_characters"}'
  next: end

returnMaxLengthCity:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"city","code":"max_length_exceeded"}'
  next: end

