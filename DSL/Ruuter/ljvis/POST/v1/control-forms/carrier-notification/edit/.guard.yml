# Vedaja teavituse tellimine kinnitatud/avalikustatud vormile. Guard lubab kasutaja, kellel on
# vähemalt ühe teavitatava vormitüübi kirjutusõigus; täpse vormitüübi õigust (või administraatori
# õigusi) kontrollib request.yml ise. auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: >-
        ${auth_user.permissions != null && ['sp_driver_form.write','sp_teammate_form.write','tram_driver_form.write','vehicle_technical_form.write','trailer_technical_form.write'].some(function(p) { return auth_user.permissions.includes(p); })}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
