declaration:
  call: declare
  version: 0.1
  description: "List latest snapshots of all vehicle technical-check sub-forms linked to a compound form key"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: compoundFormKey
        type: number

fetchList:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/vehicle-technical/get-by-compound-form-key"
    headers:
      type: json
    body:
      compoundFormKey: ${incoming.body.compoundFormKey}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
