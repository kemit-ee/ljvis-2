declaration:
  call: declare
  version: 0.1
  description: "Get a single drive rest form (teammate) by key"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: number
        description: "sp_teammate_form_key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/teammate/get"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body.length != 1}
      next: returnNotFound
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_sp_teammate_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnNotFound:
  status: 404
  return: "form not found"
  next: end
