declaration:
  call: declare
  version: 0.1
  description: "Get version history snapshot for a drive rest form (driver)"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "sp_driver_form_key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_key: "${incoming.body.formKey}"
  next: getSnapshot

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/get-snapshot"
    headers:
      type: json
    body:
      id: ${id}
      form_key: ${form_key}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_sp_driver_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
