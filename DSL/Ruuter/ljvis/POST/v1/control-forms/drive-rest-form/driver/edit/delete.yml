declaration:

  version: "1.0"
  description: "Delete driver form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: old_status
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    old_status: "${incoming.body.old_status}"
    status: "deleted"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: deleteForm

deleteForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/delete"
    headers:
      type: json
    body:
      id: ${id}
      status: ${status}
      created_by: ${created_by}
  result: deleteRes
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/log-form-delete"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: "${deleteRes.response.body[0].subFormNumber + '/' + deleteRes.response.body[0].version}"
    old_status: ${old_status}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: triggerRiskRecalculate

# calculate_risk_score.sql jätab kustutatud vormi arvestusest välja, seega
# kustutamine peab riskiskoori värskendama (muidu jääb kustutatud vormi
# rikkumine skoori sisse kuni öise risk-score-recalc-sync cron'ini).
# Fire-and-forget: viga ei tohi kustutamist tagasi pöörata.
triggerRiskRecalculate:
  switch:
    - condition: "${!/^[0-9]{8}$/.test('' + (deleteRes.response.body[0].companyRegCode || ''))}"
      next: returnSuccess
  next: callRiskRecalculate

callRiskRecalculate:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/risk-scores/recalculate"
    headers:
      type: json
    body:
      company_reg_code: ${deleteRes.response.body[0].companyRegCode}
      calculation_trigger: "kontrollvorm"
  result: recalc_result
  error: returnSuccess
  next: returnSuccess

returnSuccess:
  return: ${deleteRes.response.body}
  next: end
