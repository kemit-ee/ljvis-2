declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Create or update the drive rest form for driver - single unified save endpoint, branches internally on presence of id. Requires an already-existing compoundFormKey. Status is always computed/controlled server-side and never trusts client input."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: revision
        type: integer
      - field: compoundFormKey
        type: integer
      - field: subFormNumber
        type: string
      - field: selectionStatus
        type: string
      - field: transportType
        type: string
      - field: transportEmptyRun
        type: boolean
      - field: transportNature
        type: string
      - field: transportNatureExempt
        type: boolean
      - field: transportClasses
        type: string
      - field: cabotageViolations
        type: string
      - field: resultType
        type: string
      - field: additionalMeasure
        type: string
      - field: proceedingType
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: documentChecks
        type: string
      - field: otherDocuments
        type: string
      - field: spApplicability
        type: string
      - field: tachographTypeCode
        type: string
      - field: tachographDataNotDownloaded
        type: boolean
      - field: tachographNotes
        type: string
      - field: checkedDaysCount
        type: string
      - field: workDaysCount
        type: string
      - field: otherActivityDaysCount
        type: string
      - field: violations5612006
        type: string
      - field: violations1652014
        type: string
      - field: violations200215
        type: string
      - field: violations5932008
        type: string
      - field: violations20201057
        type: string
      - field: massDimensionNonCompliant
        type: boolean
      - field: massDimensionMeasurements
        type: string
      - field: atpViolationFound
        type: string
      - field: atpViolationDescription
        type: string
      - field: erruPoints
        type: string
      - field: enforcementDecision
        type: string
      - field: proceedingClosureBasis
        type: string
      - field: notes
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    compound_form_key: "${incoming.body.compoundFormKey}"
    sub_form_number: "${incoming.body.subFormNumber}"
    selection_status: "${incoming.body.selectionStatus}"
    transport_type: "${incoming.body.transportType}"
    transport_empty_run: "${incoming.body.transportEmptyRun}"
    transport_nature: "${incoming.body.transportNature}"
    transport_nature_exempt: "${incoming.body.transportNatureExempt}"
    transport_classes: "${incoming.body.transportClasses}"
    cabotage_violations: "${incoming.body.cabotageViolations}"
    result_type: "${incoming.body.resultType}"
    additional_measure: "${incoming.body.additionalMeasure}"
    proceeding_type: "${incoming.body.proceedingType}"
    proceeding_reference_number: "${incoming.body.proceedingReferenceNumber}"
    document_checks: "${incoming.body.documentChecks}"
    other_documents: "${incoming.body.otherDocuments}"
    sp_applicability: "${incoming.body.spApplicability}"
    tachograph_type_code: "${incoming.body.tachographTypeCode}"
    tachograph_data_not_downloaded: "${incoming.body.tachographDataNotDownloaded}"
    tachograph_notes: "${incoming.body.tachographNotes}"
    checked_days_count: "${incoming.body.checkedDaysCount == null ? '' : String(incoming.body.checkedDaysCount)}"
    work_days_count: "${incoming.body.workDaysCount == null ? '' : String(incoming.body.workDaysCount)}"
    other_activity_days_count: "${incoming.body.otherActivityDaysCount == null ? '' : String(incoming.body.otherActivityDaysCount)}"
    violations_561_2006: "${incoming.body.violations5612006}"
    violations_165_2014: "${incoming.body.violations1652014}"
    violations_2002_15: "${incoming.body.violations200215}"
    violations_593_2008: "${incoming.body.violations5932008}"
    violations_2020_1057: "${incoming.body.violations20201057}"
    mass_dimension_non_compliant: "${incoming.body.massDimensionNonCompliant}"
    mass_dimension_measurements: "${incoming.body.massDimensionMeasurements}"
    atp_violation_found: "${incoming.body.atpViolationFound}"
    atp_violation_description: "${incoming.body.atpViolationDescription}"
    erru_points: "${incoming.body.erruPoints == null ? '' : String(incoming.body.erruPoints)}"
    enforcement_decision: "${incoming.body.enforcementDecision}"
    proceeding_closure_basis: "${incoming.body.proceedingClosureBasis}"
    notes: "${incoming.body.notes}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateTextLengths

validateTextLengths:
  switch:
    - condition: '${(typeof incoming.body.atpViolationDescription === "string" ? incoming.body.atpViolationDescription : JSON.stringify(incoming.body.atpViolationDescription == null ? "" : incoming.body.atpViolationDescription)).length > 4000}'
      next: returnMaxLengthAtpViolationDescription
    - condition: '${(typeof incoming.body.tachographNotes === "string" ? incoming.body.tachographNotes : JSON.stringify(incoming.body.tachographNotes == null ? "" : incoming.body.tachographNotes)).length > 4000}'
      next: returnMaxLengthTachographNotes
    - condition: '${(typeof incoming.body.notes === "string" ? incoming.body.notes : JSON.stringify(incoming.body.notes == null ? "" : incoming.body.notes)).length > 4000}'
      next: returnMaxLengthNotes
    - condition: '${(typeof incoming.body.enforcementDecision === "string" ? incoming.body.enforcementDecision : JSON.stringify(incoming.body.enforcementDecision == null ? "" : incoming.body.enforcementDecision)).length > 20000}'
      next: returnMaxLengthEnforcementDecision
    - condition: '${(typeof incoming.body.proceedingClosureBasis === "string" ? incoming.body.proceedingClosureBasis : JSON.stringify(incoming.body.proceedingClosureBasis == null ? "" : incoming.body.proceedingClosureBasis)).length > 20000}'
      next: returnMaxLengthProceedingClosureBasis
    - condition: '${(typeof incoming.body.transportClasses === "string" ? incoming.body.transportClasses : JSON.stringify(incoming.body.transportClasses == null ? "" : incoming.body.transportClasses)).length > 100000}'
      next: returnTooLargeTransportClasses
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.transportClasses === "string" ? incoming.body.transportClasses : JSON.stringify(incoming.body.transportClasses == null ? "" : incoming.body.transportClasses))) && JSON.stringify(JSON.parse((typeof incoming.body.transportClasses === "string" ? incoming.body.transportClasses : JSON.stringify(incoming.body.transportClasses == null ? "" : incoming.body.transportClasses))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeTransportClasses
    - condition: '${(typeof incoming.body.cabotageViolations === "string" ? incoming.body.cabotageViolations : JSON.stringify(incoming.body.cabotageViolations == null ? "" : incoming.body.cabotageViolations)).length > 100000}'
      next: returnTooLargeCabotageViolations
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.cabotageViolations === "string" ? incoming.body.cabotageViolations : JSON.stringify(incoming.body.cabotageViolations == null ? "" : incoming.body.cabotageViolations))) && JSON.stringify(JSON.parse((typeof incoming.body.cabotageViolations === "string" ? incoming.body.cabotageViolations : JSON.stringify(incoming.body.cabotageViolations == null ? "" : incoming.body.cabotageViolations))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeCabotageViolations
    - condition: '${(typeof incoming.body.documentChecks === "string" ? incoming.body.documentChecks : JSON.stringify(incoming.body.documentChecks == null ? "" : incoming.body.documentChecks)).length > 100000}'
      next: returnTooLargeDocumentChecks
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.documentChecks === "string" ? incoming.body.documentChecks : JSON.stringify(incoming.body.documentChecks == null ? "" : incoming.body.documentChecks))) && JSON.stringify(JSON.parse((typeof incoming.body.documentChecks === "string" ? incoming.body.documentChecks : JSON.stringify(incoming.body.documentChecks == null ? "" : incoming.body.documentChecks))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeDocumentChecks
    - condition: '${(typeof incoming.body.otherDocuments === "string" ? incoming.body.otherDocuments : JSON.stringify(incoming.body.otherDocuments == null ? "" : incoming.body.otherDocuments)).length > 100000}'
      next: returnTooLargeOtherDocuments
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.otherDocuments === "string" ? incoming.body.otherDocuments : JSON.stringify(incoming.body.otherDocuments == null ? "" : incoming.body.otherDocuments))) && JSON.stringify(JSON.parse((typeof incoming.body.otherDocuments === "string" ? incoming.body.otherDocuments : JSON.stringify(incoming.body.otherDocuments == null ? "" : incoming.body.otherDocuments))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeOtherDocuments
    - condition: '${(typeof incoming.body.violations5612006 === "string" ? incoming.body.violations5612006 : JSON.stringify(incoming.body.violations5612006 == null ? "" : incoming.body.violations5612006)).length > 100000}'
      next: returnTooLargeViolations5612006
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.violations5612006 === "string" ? incoming.body.violations5612006 : JSON.stringify(incoming.body.violations5612006 == null ? "" : incoming.body.violations5612006))) && JSON.stringify(JSON.parse((typeof incoming.body.violations5612006 === "string" ? incoming.body.violations5612006 : JSON.stringify(incoming.body.violations5612006 == null ? "" : incoming.body.violations5612006))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeViolations5612006
    - condition: '${(typeof incoming.body.violations1652014 === "string" ? incoming.body.violations1652014 : JSON.stringify(incoming.body.violations1652014 == null ? "" : incoming.body.violations1652014)).length > 100000}'
      next: returnTooLargeViolations1652014
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.violations1652014 === "string" ? incoming.body.violations1652014 : JSON.stringify(incoming.body.violations1652014 == null ? "" : incoming.body.violations1652014))) && JSON.stringify(JSON.parse((typeof incoming.body.violations1652014 === "string" ? incoming.body.violations1652014 : JSON.stringify(incoming.body.violations1652014 == null ? "" : incoming.body.violations1652014))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeViolations1652014
    - condition: '${(typeof incoming.body.violations200215 === "string" ? incoming.body.violations200215 : JSON.stringify(incoming.body.violations200215 == null ? "" : incoming.body.violations200215)).length > 100000}'
      next: returnTooLargeViolations200215
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.violations200215 === "string" ? incoming.body.violations200215 : JSON.stringify(incoming.body.violations200215 == null ? "" : incoming.body.violations200215))) && JSON.stringify(JSON.parse((typeof incoming.body.violations200215 === "string" ? incoming.body.violations200215 : JSON.stringify(incoming.body.violations200215 == null ? "" : incoming.body.violations200215))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeViolations200215
    - condition: '${(typeof incoming.body.violations5932008 === "string" ? incoming.body.violations5932008 : JSON.stringify(incoming.body.violations5932008 == null ? "" : incoming.body.violations5932008)).length > 100000}'
      next: returnTooLargeViolations5932008
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.violations5932008 === "string" ? incoming.body.violations5932008 : JSON.stringify(incoming.body.violations5932008 == null ? "" : incoming.body.violations5932008))) && JSON.stringify(JSON.parse((typeof incoming.body.violations5932008 === "string" ? incoming.body.violations5932008 : JSON.stringify(incoming.body.violations5932008 == null ? "" : incoming.body.violations5932008))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeViolations5932008
    - condition: '${(typeof incoming.body.violations20201057 === "string" ? incoming.body.violations20201057 : JSON.stringify(incoming.body.violations20201057 == null ? "" : incoming.body.violations20201057)).length > 100000}'
      next: returnTooLargeViolations20201057
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.violations20201057 === "string" ? incoming.body.violations20201057 : JSON.stringify(incoming.body.violations20201057 == null ? "" : incoming.body.violations20201057))) && JSON.stringify(JSON.parse((typeof incoming.body.violations20201057 === "string" ? incoming.body.violations20201057 : JSON.stringify(incoming.body.violations20201057 == null ? "" : incoming.body.violations20201057))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeViolations20201057
    - condition: '${(typeof incoming.body.massDimensionMeasurements === "string" ? incoming.body.massDimensionMeasurements : JSON.stringify(incoming.body.massDimensionMeasurements == null ? "" : incoming.body.massDimensionMeasurements)).length > 100000}'
      next: returnTooLargeMassDimensionMeasurements
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.massDimensionMeasurements === "string" ? incoming.body.massDimensionMeasurements : JSON.stringify(incoming.body.massDimensionMeasurements == null ? "" : incoming.body.massDimensionMeasurements))) && JSON.stringify(JSON.parse((typeof incoming.body.massDimensionMeasurements === "string" ? incoming.body.massDimensionMeasurements : JSON.stringify(incoming.body.massDimensionMeasurements == null ? "" : incoming.body.massDimensionMeasurements))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeMassDimensionMeasurements
    - condition: '${(typeof incoming.body.erruPoints === "string" ? incoming.body.erruPoints : JSON.stringify(incoming.body.erruPoints == null ? "" : incoming.body.erruPoints)).length > 100000}'
      next: returnTooLargeErruPoints
    - condition: '${/^\s*[\x5b\x7b]/.test((typeof incoming.body.erruPoints === "string" ? incoming.body.erruPoints : JSON.stringify(incoming.body.erruPoints == null ? "" : incoming.body.erruPoints))) && JSON.stringify(JSON.parse((typeof incoming.body.erruPoints === "string" ? incoming.body.erruPoints : JSON.stringify(incoming.body.erruPoints == null ? "" : incoming.body.erruPoints))), (k, x) => typeof x === "string" && x.length > 4000 ? "#too-long#" : x).indexOf("\"#too-long#\"") !== -1}'
      next: returnTooLargeErruPoints
  next: validateTextFields

validateTextFields:
  switch:
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(additional_measure == null ? "" : additional_measure))}'
      next: returnInvalidCharactersAdditionalMeasure
    - condition: '${String(additional_measure == null ? "" : additional_measure).length > 30}'
      next: returnMaxLengthAdditionalMeasure
    - condition: '${/[\u0000-\u001F\u007F]/.test(String(proceeding_reference_number == null ? "" : proceeding_reference_number))}'
      next: returnInvalidCharactersProceedingReferenceNumber
    - condition: '${String(proceeding_reference_number == null ? "" : proceeding_reference_number).length > 50}'
      next: returnMaxLengthProceedingReferenceNumber
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(tachograph_notes == null ? "" : tachograph_notes))}'
      next: returnInvalidCharactersTachographNotes
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(atp_violation_description == null ? "" : atp_violation_description))}'
      next: returnInvalidCharactersAtpViolationDescription
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(String(notes == null ? "" : notes))}'
      next: returnInvalidCharactersNotes
  next: checkInsertOrUpdate

checkInsertOrUpdate:
  switch:
    - condition: ${id == null || id === ''}
      next: checkCompoundFormKeyForCreate
  next: getCurrentFormForStatus

checkCompoundFormKeyForCreate:
  switch:
    - condition: ${compound_form_key == null}
      next: returnMissingCompoundFormKeyError
  next: insertForm

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/insert"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      compoundFormKey: ${compound_form_key}
      status: saved
      selectionStatus: ${selection_status}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      tachographNotes: ${tachograph_notes}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      massDimensionNonCompliant: ${mass_dimension_non_compliant}
      massDimensionMeasurements: ${mass_dimension_measurements}
      atpViolationFound: ${atp_violation_found}
      atpViolationDescription: ${atp_violation_description}
      erruPoints: ${erru_points}
      enforcementDecision: ${enforcement_decision}
      proceedingClosureBasis: ${proceeding_closure_basis}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkInsertSaved

checkInsertSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: extractInsertResponseData


extractInsertResponseData:
  assign:
    sp_driver_form_key: "${saveRes.response.body[0].id || ''}"
    sub_form_number: "${saveRes.response.body[0].subFormNumber + '/' + saveRes.response.body[0].version}"
  next: getCompoundFormInsert

getCompoundFormInsert:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${compound_form_key}
  result: compoundFormRes
  next: extractDriverCodesInsert

extractDriverCodesInsert:
  assign:
    compound_drivers: "${JSON.parse(compoundFormRes.response.body[0].drivers)}"
  next: extractDriverPersonalCodesInsert

extractDriverPersonalCodesInsert:
  assign:
    driver1_personal_code_ee: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeEe || '') : ''}"
    driver1_personal_code_foreign: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeForeign || '') : ''}"
    driver2_personal_code_ee: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeEe || '') : ''}"
    driver2_personal_code_foreign: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeForeign || '') : ''}"
  next: logAuditEventInsert

logAuditEventInsert:
  template: "templates/audit/form/sp-driver-form/log-sp-driver-create-update"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    sp_driver_form_key: "${String((sp_driver_form_key) ?? '')}"
    compound_form_key: "${String((compound_form_key) ?? '')}"
    sub_form_number: ${sub_form_number}
    result_type: ${result_type}
    proceeding_type: ${proceeding_type}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
  result: audit_result
  next: returnSuccess

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
    current_compound_form_key: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].compoundFormKey) || compound_form_key}"
  next: protectProceedingOutcome

# Jõustunud otsust ja menetluse lõpetamise alust võivad kinnitatud ja avalikustatud vormil
# muuta ainult eToimikuga seonduva ülekirjutamise õigusega kasutaja ja administraator
# (edit_locked). Kõigil teistel säilitatakse salvestatud väärtused.
protectProceedingOutcome:
  switch:
    - condition: ${(current_status === 'confirmed' || current_status === 'published') && !(u.permissions != null && (u.permissions.includes('control_form.punishment_register') || u.permissions.includes('control_form.edit_locked')))}
      next: keepProceedingOutcome
  next: updateForm

keepProceedingOutcome:
  assign:
    enforcement_decision: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].enforcementDecision) || ''}"
    proceeding_closure_basis: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].proceedingClosureBasis) || ''}"
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/update"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${incoming.body.revision == null || incoming.body.revision === '' ? '' : String(incoming.body.revision)}"
      compoundFormKey: ${current_compound_form_key}
      subFormNumber: ${sub_form_number}
      status: ${current_status}
      selectionStatus: ${selection_status}
      transportType: ${transport_type}
      transportEmptyRun: ${transport_empty_run}
      transportNature: ${transport_nature}
      transportNatureExempt: ${transport_nature_exempt}
      transportClasses: ${transport_classes}
      cabotageViolations: ${cabotage_violations}
      resultType: ${result_type}
      additionalMeasure: ${additional_measure}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      documentChecks: ${document_checks}
      otherDocuments: ${other_documents}
      spApplicability: ${sp_applicability}
      tachographTypeCode: ${tachograph_type_code}
      tachographDataNotDownloaded: ${tachograph_data_not_downloaded}
      tachographNotes: ${tachograph_notes}
      checkedDaysCount: ${checked_days_count}
      workDaysCount: ${work_days_count}
      otherActivityDaysCount: ${other_activity_days_count}
      violations5612006: ${violations_561_2006}
      violations1652014: ${violations_165_2014}
      violations200215: ${violations_2002_15}
      violations5932008: ${violations_593_2008}
      violations20201057: ${violations_2020_1057}
      massDimensionNonCompliant: ${mass_dimension_non_compliant}
      massDimensionMeasurements: ${mass_dimension_measurements}
      atpViolationFound: ${atp_violation_found}
      atpViolationDescription: ${atp_violation_description}
      erruPoints: ${erru_points}
      enforcementDecision: ${enforcement_decision}
      proceedingClosureBasis: ${proceeding_closure_basis}
      notes: ${notes}
      created_by: ${created_by}
  result: saveRes
  next: checkFormModified

# Optimistlik lukk: kui kasutaja nähtud revision ei ole enam uusim, lisab update.sql 0 rida
# (tühi vastus) - see on konflikt, mitte salvestusviga.
checkFormModified:
  switch:
    - condition: ${saveRes.response != null && saveRes.response.status >= 200 && saveRes.response.status < 300 && Array.isArray(saveRes.response.body) && saveRes.response.body.length === 0 && incoming.body.revision != null && incoming.body.revision !== ''}
      next: returnFormModifiedError
  next: checkUpdateSaved

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

checkUpdateSaved:
  switch:
    - condition: ${saveRes.response == null || saveRes.response.status < 200 || saveRes.response.status >= 300 || saveRes.response.body == null || saveRes.response.body.length == null || saveRes.response.body.length === 0}
      next: returnResqlSaveError
  next: extractUpdateResponseData


extractUpdateResponseData:
  assign:
    sp_driver_form_key: "${saveRes.response.body[0].id || ''}"
    sub_form_number: "${saveRes.response.body[0].subFormNumber + '/' + saveRes.response.body[0].version}"
  next: getCompoundFormUpdate

getCompoundFormUpdate:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${current_compound_form_key}
  result: compoundFormRes
  next: extractDriverCodesUpdate

extractDriverCodesUpdate:
  assign:
    compound_drivers: "${JSON.parse(compoundFormRes.response.body[0].drivers)}"
  next: extractDriverPersonalCodesUpdate

extractDriverPersonalCodesUpdate:
  assign:
    driver1_personal_code_ee: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeEe || '') : ''}"
    driver1_personal_code_foreign: "${compound_drivers[0] != null ? (compound_drivers[0].personalCodeForeign || '') : ''}"
    driver2_personal_code_ee: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeEe || '') : ''}"
    driver2_personal_code_foreign: "${compound_drivers[1] != null ? (compound_drivers[1].personalCodeForeign || '') : ''}"
    company_name: "${compoundFormRes.response.body[0].companyName || ''}"
  next: logAuditEventUpdate

logAuditEventUpdate:
  template: "templates/audit/form/sp-driver-form/log-sp-driver-create-update"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    sp_driver_form_key: "${String((sp_driver_form_key) ?? '')}"
    compound_form_key: "${String((current_compound_form_key) ?? '')}"
    sub_form_number: ${sub_form_number}
    result_type: ${result_type}
    proceeding_type: ${proceeding_type}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
  result: audit_result
  next: recalcRiskOnResave

# Avalikustatud vormi muutmine-salvestamine lisab uue avalikustatud versiooni, mis on
# riskiskoori sisend - skoor arvutatakse ümber samamoodi nagu publish.yml-is, mitte
# alles öise cron'iga. Viga ei tohi salvestamist tagasi pöörata.
recalcRiskOnResave:
  switch:
    - condition: ${current_status === 'published'}
      next: callRiskRecalcOnResave
  next: checkNotifyOnResave

callRiskRecalcOnResave:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/risk-scores/recalculate/from-form"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      form_type: "compound"
      form_key: "${String(current_compound_form_key)}"
  result: riskRecalcRes
  error: checkNotifyOnResave
  next: checkNotifyOnResave

# Avalikustatud vormi muutmine-salvestamine on samuti avalikustamise sündmus
# teavituste mõttes - publish.yml-iga samad kontrollid, aga event_key sisaldab
# uut version'it, nii et teavitus ei jää dubleerimiskontrolli taha kinni.
checkNotifyOnResave:
  switch:
    - condition: ${current_status === 'published'}
      next: checkSeriousInfringementResave
  next: returnSuccess

checkSeriousInfringementResave:
  switch:
    - condition: >-
        ${(function(t) { return /(^|[^A-Z])(MSI|VSI|SI|MI)[ _-]*[0-9]/.test(t) || /"severityCode"\s*:\s*"(MSI|VSI|SI|MI)"/.test(t); })([violations_561_2006, violations_165_2014, violations_2002_15, violations_593_2008, violations_2020_1057, cabotage_violations, erru_points].join(' '))}
      next: createSeriousInfringementResave
  next: checkWeightViolationResave

createSeriousInfringementResave:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      type: "serious_infringement"
      required_permission: "rsi.read"
      related_entity_type: "drive_rest_driver_form"
      related_entity_id: ${sp_driver_form_key}
      event_key: "${'drive-rest-driver:' + sp_driver_form_key + ':' + saveRes.response.body[0].version + ':serious'}"
      title_et: "${'Saabus teade Eestis avastatud raske rikkumise kohta vedaja „' + company_name + '“ kontrollimisel'}"
      body_et: "${'Koondvormi võti: ' + current_compound_form_key}"
      created_by: ${actor_personal_code}
  result: seriousNotifResResave
  error: checkWeightViolationResave
  next: checkWeightViolationResave

checkWeightViolationResave:
  switch:
    - condition: ${mass_dimension_non_compliant === true || mass_dimension_non_compliant === 'true'}
      next: createWeightViolationNotificationResave
  next: returnSuccess

createWeightViolationNotificationResave:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      type: "weight_violation"
      required_permission: "rsi.read"
      related_entity_type: "drive_rest_driver_form"
      related_entity_id: ${sp_driver_form_key}
      event_key: "${'drive-rest-driver:' + sp_driver_form_key + ':' + saveRes.response.body[0].version}"
      title_et: "Sõiduki kaalumisel ja mõõtmisel on avastatud rikkumine"
      body_et: "${'Koondvormi võti: ' + current_compound_form_key}"
      created_by: ${actor_personal_code}
  result: notifResResave
  error: returnSuccess
  next: returnSuccess

returnResqlSaveError:
  status: 500
  return: "${(saveRes.response != null && saveRes.response.body) || {type: 'RESQL_ERROR', code: 'save_failed', message: 'Vormi salvestamine andmebaasi ebaõnnestus'}}"
  next: end

returnSuccess:
  return: ${saveRes.response.body}
  next: end

