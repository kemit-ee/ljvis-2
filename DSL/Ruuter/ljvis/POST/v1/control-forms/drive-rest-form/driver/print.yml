declaration:
  version: "1.0"
  description: "Generate a filled or blank drive-rest (driver) PDF."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: blank
        type: boolean

extractRequestData:
  assign:
    id: "${incoming.body.id || ''}"
    blank: ${incoming.body.blank === true}
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${(auth_user.firstname || '') + ' ' + (auth_user.lastname || '')}"
  next: checkBlankNoId

checkBlankNoId:
  switch:
    - condition: ${blank && id === ''}
      next: renderBlank
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/get"
    headers:
      type: json
    body:
      id: ${id}
  result: formRes
  next: checkForm

checkForm:
  switch:
    - condition: ${formRes.response.body == null || formRes.response.body.length !== 1}
      next: returnNotFound
  next: getCompoundForm

getCompoundForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${formRes.response.body[0].compoundFormKey}
  result: compoundFormRes
  next: checkCompoundForm

checkCompoundForm:
  switch:
    - condition: ${compoundFormRes.response.body == null || compoundFormRes.response.body.length !== 1}
      next: returnNotFound
    - condition: ${blank}
      next: renderBlank
  next: renderFilled

renderBlank:
  call: http.post
  args:
    url: "http://pdf-creator:3020/v1/render"
    headers:
      type: json
    body:
      templateCode: "drive-rest-form"
      blank: true
      fields: {}
      output: "base64"
  result: pdfRes
  next: checkPdfResult

renderFilled:
  call: http.post
  args:
    url: "http://pdf-creator:3020/v1/render"
    headers:
      type: json
    body:
      templateCode: "drive-rest-form"
      blank: false
      fields:
        compoundForm: ${compoundFormRes.response.body[0]}
        driveRestForm: ${formRes.response.body[0]}
        printOptions:
          driverIndex: 0
      output: "base64"
  result: pdfRes
  next: checkPdfResult

checkPdfResult:
  switch:
    - condition: ${pdfRes.response == null || pdfRes.response.status < 200 || pdfRes.response.status >= 300 || pdfRes.response.body == null}
      next: returnRenderError
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.drive_rest_driver.print"
    event_category: "control_form"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
    description: "Sõidu- ja puhkeaja kontrollkaart (juht) trükitud, alamvormi võti=${id}, tühi=${blank}"
    log_content: "{\"subFormKey\":\"${id}\",\"blank\":${blank}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${pdfRes.response.body}
  next: end

returnNotFound:
  status: 404
  return: '{"error":"NOT_FOUND"}'
  next: end

returnRenderError:
  status: 502
  return: '{"error":"PDF_RENDER_FAILED"}'
  next: end
