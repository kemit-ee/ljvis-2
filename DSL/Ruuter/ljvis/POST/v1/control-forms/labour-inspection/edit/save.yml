declaration:
  call: declare
  version: 0.1
  description: "Create or update a labour inspection form (Tööinspektsiooni kontrollakt) — single unified save endpoint, branches internally on presence of id. Status and the form_number /V version suffix are always computed/controlled server-side and never trust client input — see extractRequestData / validateRequired / updateForm."
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: inspectorName
        type: string
      - field: inspectionDate
        type: string
      - field: inspectionType
        type: string
      - field: companyName
        type: string
      - field: companyRegCode
        type: string
      - field: vehicleCount
        type: string
      - field: totalDriversCount
        type: string
      - field: controlsMatrix
        type: string
      - field: prescriptionComposed
        type: string
      - field: punishedPersonIdCode
        type: string
      - field: punishedPersonFirstName
        type: string
      - field: punishedPersonLastName
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: violations
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    inspector_name: "${incoming.body.inspectorName}"
    inspection_date: "${incoming.body.inspectionDate}"
    inspection_type: "${incoming.body.inspectionType}"
    company_name: "${incoming.body.companyName}"
    company_reg_code: "${incoming.body.companyRegCode}"
    vehicle_count: "${incoming.body.vehicleCount}"
    total_drivers_count: "${incoming.body.totalDriversCount}"
    controls_matrix: "${incoming.body.controlsMatrix}"
    prescription_composed: "${incoming.body.prescriptionComposed}"
    punished_person_id_code: "${incoming.body.punishedPersonIdCode}"
    punished_person_first_name: "${incoming.body.punishedPersonFirstName}"
    punished_person_last_name: "${incoming.body.punishedPersonLastName}"
    proceeding_reference_number: "${incoming.body.proceedingReferenceNumber}"
    violations: "${incoming.body.violations}"
    created_by: "${auth_user.personalcode}"
  next: validateRequired

validateRequired:
  switch:
    - condition: ${!inspector_name || inspector_name.trim() === ''}
      next: returnInspectorNameRequiredError
    - condition: ${!inspection_date || inspection_date.trim() === ''}
      next: returnInspectionDateRequiredError
    - condition: ${new Date(inspection_date) > new Date()}
      next: returnInspectionDateFutureError
  next: checkIsCreate

checkIsCreate:
  switch:
    - condition: ${id == null || id === ''}
      next: insertForm
  next: getCurrentFormForStatus

insertForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/insert"
    headers:
      type: json
    body:
      status: saved
      inspectorName: ${inspector_name}
      inspectionDate: ${inspection_date}
      inspectionType: ${inspection_type}
      companyName: ${company_name}
      companyRegCode: ${company_reg_code}
      vehicleCount: ${vehicle_count}
      totalDriversCount: ${total_drivers_count}
      controlsMatrix: ${controls_matrix}
      prescriptionComposed: ${prescription_composed}
      punishedPersonIdCode: ${punished_person_id_code}
      punishedPersonFirstName: ${punished_person_first_name}
      punishedPersonLastName: ${punished_person_last_name}
      proceedingReferenceNumber: ${proceeding_reference_number}
      violations: ${violations}
      created_by: ${created_by}
  result: saveRes
  next: logCreate

logCreate:
  template: "[#LJVIS_PROJECT_LAYER]/audit/form/labour-inspection/log-labour-inspection-create"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${saveRes.response.body[0].formNumber}
    version: ${saveRes.response.body[0].version}
  result: audit_result
  next: returnSuccess

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: extractCurrentStatus

extractCurrentStatus:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/form/labour-inspection/calculate-labour-inspection-changed-fields"
  requestType: templates
  body:
    formId: ${id}
    inspectorName: ${inspector_name}
    inspectionDate: ${inspection_date}
    inspectionType: ${inspection_type}
    companyName: ${company_name}
    companyRegCode: ${company_reg_code}
    vehicleCount: ${vehicle_count}
    totalDriversCount: ${total_drivers_count}
    controlsMatrix: ${controls_matrix}
    prescriptionComposed: ${prescription_composed}
    punishedPersonIdCode: ${punished_person_id_code}
    punishedPersonFirstName: ${punished_person_first_name}
    punishedPersonLastName: ${punished_person_last_name}
    proceedingReferenceNumber: ${proceeding_reference_number}
    violations: ${violations}
  result: changedFieldsResult
  next: extractChangedFields

extractChangedFields:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
    changed_fields_result: ${parsed_result.changed_fields}
  next: updateForm

updateForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/update"
    headers:
      type: json
    body:
      key: ${id}
      status: ${current_status}
      inspectorName: ${inspector_name}
      inspectionDate: ${inspection_date}
      inspectionType: ${inspection_type}
      companyName: ${company_name}
      companyRegCode: ${company_reg_code}
      vehicleCount: ${vehicle_count}
      totalDriversCount: ${total_drivers_count}
      controlsMatrix: ${controls_matrix}
      prescriptionComposed: ${prescription_composed}
      punishedPersonIdCode: ${punished_person_id_code}
      punishedPersonFirstName: ${punished_person_first_name}
      punishedPersonLastName: ${punished_person_last_name}
      proceedingReferenceNumber: ${proceeding_reference_number}
      violations: ${violations}
      created_by: ${created_by}
  result: saveRes
  next: logUpdate

logUpdate:
  template: "[#LJVIS_PROJECT_LAYER]/audit/form/labour-inspection/log-labour-inspection-update"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: ${saveRes.response.body[0].formNumber}
    version: ${saveRes.response.body[0].version}
    changed_fields: ${changed_fields_result}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${saveRes.response.body}
  next: end

returnInspectorNameRequiredError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"inspectorName","code":"required"}'
  next: end

returnInspectionDateRequiredError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"inspectionDate","code":"required"}'
  next: end

returnInspectionDateFutureError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"inspectionDate","code":"future_date_not_allowed"}'
  next: end
