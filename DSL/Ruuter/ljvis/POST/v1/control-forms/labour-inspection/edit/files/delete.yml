declaration:

  version: "1.0"
  description: "Delete a file attachment for a labour inspection form"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: deleteFile

deleteFile:
  template: "templates/files/delete"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number_prefix: "ti-"
    id: ${incoming.body.id}
    form_type: "labour-inspection-form"
  result: deleteResult
  next: returnSuccess

returnSuccess:
  return: ${deleteResult}
  status: 200
  next: end
