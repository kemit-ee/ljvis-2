declaration:
  internal: false

  version: "1.0"
  description: "Confirm (kinnita) a labour inspection form. Validates the form, then appends a 'confirmed' snapshot. Like tram-card, there is no violations gate — an act with violations may be confirmed and then either published manually or auto-published when e-toimik returns an entered-into-force decision."
  namespace: control-forms
  allowlist:
    body:
      - field: id
      - field: revision
      - field: inspectorName
        type: string
      - field: inspectionDate
        type: string
      - field: inspectionType
        type: string
      - field: companyName
        type: string
      - field: companyRegCode
        type: string
      - field: vehicleCount
        type: string
      - field: totalDriversCount
        type: string
      - field: controlsMatrix
        type: string
      - field: prescriptionComposed
        type: string
      - field: punishedPersonIdCode
        type: string
      - field: punishedPersonFirstName
        type: string
      - field: punishedPersonLastName
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: violations
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    status: "confirmed"
    inspector_name: "${incoming.body.inspectorName || ''}"
    inspection_date: "${incoming.body.inspectionDate || ''}"
    inspection_type: "${incoming.body.inspectionType || ''}"
    company_name: "${incoming.body.companyName || ''}"
    company_reg_code: "${incoming.body.companyRegCode || ''}"
    # Ei coercida `|| ''`-ga — 0 on legitiimne sõidukite/juhtide arv (vt save.yml).
    vehicle_count: "${incoming.body.vehicleCount}"
    total_drivers_count: "${incoming.body.totalDriversCount}"
    controls_matrix: "${incoming.body.controlsMatrix || '[]'}"
    prescription_composed: "${incoming.body.prescriptionComposed || 'false'}"
    punished_person_id_code: "${incoming.body.punishedPersonIdCode || ''}"
    punished_person_first_name: "${incoming.body.punishedPersonFirstName || ''}"
    punished_person_last_name: "${incoming.body.punishedPersonLastName || ''}"
    proceeding_reference_number: "${incoming.body.proceedingReferenceNumber || ''}"
    violations: "${incoming.body.violations || '[]'}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: validateForm

validateForm:
  template: "templates/form/labour-inspection/validate-labour-inspection-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    inspectorName: ${inspector_name}
    inspectionDate: ${inspection_date}
    inspectionType: ${inspection_type}
    companyName: ${company_name}
    companyRegCode: ${company_reg_code}
  result: validationResult
  next: checkValidationResult

checkValidationResult:
  switch:
    - condition: ${validationResult.indexOf('"valid":true') === -1}
      next: returnValidationError
  next: getCurrentFormForStatus

getCurrentFormForStatus:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFormNotAlreadyConfirmed

checkFormNotAlreadyConfirmed:
  assign:
    current_status: "${(currentFormRes.response.body && currentFormRes.response.body[0] && currentFormRes.response.body[0].status) || 'saved'}"
  next: checkFormNotAlreadyConfirmedSwitch

checkFormNotAlreadyConfirmedSwitch:
  switch:
    - condition: ${current_status === 'confirmed'}
      next: returnAlreadyConfirmedError
  next: calculateChangedFields

calculateChangedFields:
  template: "templates/form/labour-inspection/calculate-labour-inspection-changed-fields"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    formId: ${id}
    inspectorName: ${inspector_name}
    inspectionDate: ${inspection_date}
    inspectionType: ${inspection_type}
    companyName: ${company_name}
    companyRegCode: ${company_reg_code}
    vehicleCount: ${vehicle_count}
    totalDriversCount: ${total_drivers_count}
    controlsMatrix: ${controls_matrix}
    prescriptionComposed: ${prescription_composed}
    punishedPersonIdCode: ${punished_person_id_code}
    punishedPersonFirstName: ${punished_person_first_name}
    punishedPersonLastName: ${punished_person_last_name}
    proceedingReferenceNumber: ${proceeding_reference_number}
    violations: ${violations}
  result: changedFieldsResult
  next: extractChangedFields

extractChangedFields:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
  next: parseChangedFieldsResult

parseChangedFieldsResult:
  assign:
    changed_fields_result: ${parsed_result.changed_fields}
  next: confirmForm

confirmForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/update"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${incoming.body.revision == null || incoming.body.revision === '' ? '' : String(incoming.body.revision)}"
      status: ${status}
      inspectorName: ${inspector_name}
      inspectionDate: ${inspection_date}
      inspectionType: ${inspection_type}
      companyName: ${company_name}
      companyRegCode: ${company_reg_code}
      vehicleCount: ${vehicle_count}
      totalDriversCount: ${total_drivers_count}
      controlsMatrix: ${controls_matrix}
      prescriptionComposed: ${prescription_composed}
      punishedPersonIdCode: ${punished_person_id_code}
      punishedPersonFirstName: ${punished_person_first_name}
      punishedPersonLastName: ${punished_person_last_name}
      proceedingReferenceNumber: ${proceeding_reference_number}
      violations: ${violations}
      created_by: ${created_by}
  result: confirmRes
  next: checkFormModified

# Optimistlik lukk: kui kasutaja nähtud revision ei ole enam uusim, lisab update.sql 0 rida
# (tühi vastus) — see on konflikt, mitte salvestusviga.
checkFormModified:
  switch:
    - condition: ${confirmRes.response != null && confirmRes.response.status >= 200 && confirmRes.response.status < 300 && Array.isArray(confirmRes.response.body) && confirmRes.response.body.length === 0 && incoming.body.revision != null && incoming.body.revision !== ''}
      next: returnFormModifiedError
  next: check_confirmRes_persisted

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

logAuditEvent:
  template: "templates/audit/form/labour-inspection/log-labour-inspection-confirm"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    akti_voti: ${id}
    form_number: ${confirmRes.response.body[0].formNumber}
    isikukood: ${punished_person_id_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${confirmRes.response.body}
  next: end

returnValidationError:
  status: 422
  return: ${validationResult}
  next: end

returnAlreadyConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_confirmed"}'
  next: end

check_confirmRes_persisted:
  switch:
    - condition: ${confirmRes.response == null || confirmRes.response.status < 200 || confirmRes.response.status >= 300 || confirmRes.response.body == null || confirmRes.response.body.length == null || confirmRes.response.body.length === 0}
      next: returnResqlWriteError
  next: logAuditEvent

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end
