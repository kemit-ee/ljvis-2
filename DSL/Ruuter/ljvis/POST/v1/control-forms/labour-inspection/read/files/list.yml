declaration:
  internal: false

  version: "1.0"
  description: "List active file attachments for a labour inspection form"
  namespace: control-forms
  allowlist:
    body:
      - field: formNumber
        type: string
    headers:
      - field: cookie
        type: string

# Omand (epic #502 A2 read): manuste loend järgib vormi lugemisreeglit (avalikustamata vorm: looja,
# looja asutus või `control_form.view_unpublished`).
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "labour-inspection"
    form_key: ""
    form_number: "${incoming.body.formNumber}"
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getFiles
  next: returnReadAccessDenied

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

getFiles:
  template: "templates/files/list"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number_prefix: "ti-"
    form_number: ${incoming.body.formNumber}
  result: listResult
  next: returnSuccess

returnSuccess:
  return: ${listResult}
  status: 200
  next: end
