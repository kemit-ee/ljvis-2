declaration:

  version: "1.0"
  description: "Confirm (kinnita) the ADR sub-form. Appends a new snapshot with status=confirmed (server-controlled). Blocked if the sub-form is already confirmed or published."
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
      - field: driverAssistant
        type: string
      - field: driverAdrCertificateNumber
        type: string
      - field: crewAdrCertificateNumber
        type: string
      - field: assistantAdrCertificateNumber
        type: string
      - field: lastLoadAddress
        type: string
      - field: lastLoadDate
        type: string
      - field: nextLoadAddress
        type: string
      - field: dangerousGoods
        type: string
      - field: exemptionApplied
        type: boolean
      - field: exemptionAdrProvision
        type: string
      - field: containerType
        type: string
      - field: infringements
        type: string
      - field: otherViolations
        type: string
      - field: resultType
        type: string
      - field: proceedingType
        type: string
      - field: proceedingReferenceNumber
        type: string
      - field: correctiveMeasures
        type: string
      - field: sealOpened
        type: boolean
      - field: sealOpenedDate
        type: string
      - field: sealInstalledDate
        type: string
      - field: notes
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    driver_assistant: "${incoming.body.driverAssistant || ''}"
    driver_adr_certificate_number: "${incoming.body.driverAdrCertificateNumber || ''}"
    crew_adr_certificate_number: "${incoming.body.crewAdrCertificateNumber || ''}"
    assistant_adr_certificate_number: "${incoming.body.assistantAdrCertificateNumber || ''}"
    last_load_address: "${incoming.body.lastLoadAddress || ''}"
    last_load_date: "${incoming.body.lastLoadDate || ''}"
    next_load_address: "${incoming.body.nextLoadAddress || ''}"
    dangerous_goods: "${incoming.body.dangerousGoods || '[]'}"
    exemption_applied: "${incoming.body.exemptionApplied || false}"
    exemption_adr_provision: "${incoming.body.exemptionAdrProvision || ''}"
    container_type: "${incoming.body.containerType || ''}"
    infringements: "${incoming.body.infringements || '[]'}"
    other_violations: "${incoming.body.otherViolations || ''}"
    result_type: "${incoming.body.resultType || 'ok'}"
    proceeding_type: "${incoming.body.proceedingType || ''}"
    proceeding_reference_number: "${incoming.body.proceedingReferenceNumber || ''}"
    corrective_measures: "${incoming.body.correctiveMeasures || '[]'}"
    seal_opened: "${incoming.body.sealOpened || false}"
    seal_opened_date: "${incoming.body.sealOpenedDate || ''}"
    seal_installed_date: "${incoming.body.sealInstalledDate || ''}"
    notes: "${incoming.body.notes || ''}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: getCurrentForm

getCurrentForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/adr-form/get"
    headers:
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
  next: checkNotAlreadyConfirmedOrPublished

checkNotAlreadyConfirmedOrPublished:
  assign:
    current_status: "${currentFormRes.response.body[0].status}"
    compound_form_key: "${currentFormRes.response.body[0].compoundFormKey}"
  next: checkStatusSwitch

checkStatusSwitch:
  switch:
    - condition: ${current_status === 'confirmed'}
      next: returnAlreadyConfirmedError
    - condition: ${current_status === 'published'}
      next: returnFormLockedError
  next: confirmForm

confirmForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/adr-form/update"
    headers:
      type: json
    body:
      key: ${id}
      status: confirmed
      driverAssistant: ${driver_assistant}
      driverAdrCertificateNumber: ${driver_adr_certificate_number}
      crewAdrCertificateNumber: ${crew_adr_certificate_number}
      assistantAdrCertificateNumber: ${assistant_adr_certificate_number}
      lastLoadAddress: ${last_load_address}
      lastLoadDate: ${last_load_date}
      nextLoadAddress: ${next_load_address}
      dangerousGoods: ${dangerous_goods}
      exemptionApplied: ${exemption_applied}
      exemptionAdrProvision: ${exemption_adr_provision}
      containerType: ${container_type}
      infringements: ${infringements}
      otherViolations: ${other_violations}
      resultType: ${result_type}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      correctiveMeasures: ${corrective_measures}
      sealOpened: ${seal_opened}
      sealOpenedDate: ${seal_opened_date}
      sealInstalledDate: ${seal_installed_date}
      notes: ${notes}
      created_by: ${created_by}
  result: confirmRes
  next: buildLogDescription

buildLogDescription:
  assign:
    description: "ADR alamvorm kinnitatud, alamvormi võti=${id}, koondvormi võti=${compound_form_key}, alamvormi number=${confirmRes.response.body[0].subFormNumber}/${confirmRes.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.adr.confirm"
    event_category: "control_form"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
    description: ${description}
    log_content: "{\"subFormKey\":${id},\"compoundFormKey\":${compound_form_key}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${confirmRes.response.body}
  next: end

returnNotFound:
  status: 404
  return: '{"error": "NOT_FOUND"}'
  next: end

returnAlreadyConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_confirmed"}'
  next: end

returnFormLockedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"form_locked_after_publish"}'
  next: end
