declaration:
  internal: false

  version: "1.0"
  description: "Publish (avalikusta) the trailer technical-check sub-form. Only allowed from confirmed status. Form field values are taken from the current database record — client only provides the id."
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    created_by: "${u.personalcode || ''}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: getCurrentForm

getCurrentForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/trailer-technical/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
  next: checkFormIsConfirmed

checkFormIsConfirmed:
  assign:
    current_status: "${currentFormRes.response.body[0].status}"
    compound_form_key: "${currentFormRes.response.body[0].compoundFormKey}"
  next: checkStatusSwitch

checkStatusSwitch:
  switch:
    - condition: ${current_status === 'published'}
      next: returnAlreadyPublishedError
    - condition: ${current_status !== 'confirmed'}
      next: returnNotConfirmedError
  next: checkManualPublish

checkManualPublish:
  switch:
    - condition: ${(currentFormRes.response.body[0].proceedingType && currentFormRes.response.body[0].proceedingType !== 'none' || currentFormRes.response.body[0].proceedingReferenceNumber) && (u.permissions == null || !u.permissions.includes('control_form.punishment_register'))}
      next: returnPunishmentRegisterPermissionError
    - condition: ${(currentFormRes.response.body[0].proceedingType && currentFormRes.response.body[0].proceedingType !== 'none' || currentFormRes.response.body[0].proceedingReferenceNumber) && !currentFormRes.response.body[0].enforcementDecision && !currentFormRes.response.body[0].proceedingClosureBasis}
      next: returnProceedingOutcomeRequired
  next: extractCurrentFormData

extractCurrentFormData:
  assign:
    parts_summary: "${currentFormRes.response.body[0].partsSummary || '[]'}"
    parts_defects: "${currentFormRes.response.body[0].partsDefects || '[]'}"
    result_type: "${currentFormRes.response.body[0].resultType || 'ok'}"
    result_transport_interruption: "${currentFormRes.response.body[0].resultTransportInterruption || false}"
    transport_interruption_autovs_51_3_1: "${currentFormRes.response.body[0].transportInterruptionAutovs5131 || false}"
    other_measure: "${currentFormRes.response.body[0].otherMeasure || false}"
    era_yv_mnt_regnr: "${currentFormRes.response.body[0].eraYvMntRegnr || false}"
    era_yv_mnt_vintin: "${currentFormRes.response.body[0].eraYvMntVintin || false}"
    era_yv_mnt_axles: "${currentFormRes.response.body[0].eraYvMntAxles || false}"
    era_yv_mnt_places: "${currentFormRes.response.body[0].eraYvMntPlaces || false}"
    era_yv_mnt_rebuilt: "${currentFormRes.response.body[0].eraYvMntRebuilt || false}"
    proceeding_type: "${currentFormRes.response.body[0].proceedingType || ''}"
    proceeding_reference_number: "${currentFormRes.response.body[0].proceedingReferenceNumber || ''}"
    violations: "${currentFormRes.response.body[0].violations || '[]'}"
    notes: "${currentFormRes.response.body[0].notes || ''}"
    trailer_reg_nr: "${currentFormRes.response.body[0].trailerRegNr || ''}"
  next: publishForm

publishForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/trailer-technical/update"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${String(currentFormRes.response.body[0].revision ?? '')}"  # publish kopeerib get-vastuse andmed: lukk selle revision'i vastu
      status: published
      partsSummary: ${parts_summary}
      partsDefects: ${parts_defects}
      resultType: ${result_type}
      resultTransportInterruption: ${result_transport_interruption}
      transportInterruptionAutovs5131: ${transport_interruption_autovs_51_3_1}
      otherMeasure: ${other_measure}
      eraYvMntRegnr: ${era_yv_mnt_regnr}
      eraYvMntVintin: ${era_yv_mnt_vintin}
      eraYvMntAxles: ${era_yv_mnt_axles}
      eraYvMntPlaces: ${era_yv_mnt_places}
      eraYvMntRebuilt: ${era_yv_mnt_rebuilt}
      proceedingType: ${proceeding_type}
      proceedingReferenceNumber: ${proceeding_reference_number}
      violations: ${violations}
      notes: ${notes}
      trailerRegNr: ${trailer_reg_nr}
      created_by: ${created_by}
  result: publishRes
  next: checkPublishConflict

# Optimistlik lukk: kui vorm muutus pärast get-päringut (nt e-toimiku cron avalikustas selle),
# lisab update.sql 0 rida — see on konflikt, mitte salvestusviga.
checkPublishConflict:
  switch:
    - condition: ${publishRes.response != null && publishRes.response.status >= 200 && publishRes.response.status < 300 && Array.isArray(publishRes.response.body) && publishRes.response.body.length === 0 && currentFormRes.response.body[0].revision != null}
      next: returnFormModifiedError
  next: check_publishRes_persisted

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end

buildLogDescription:
  assign:
    description: "Haagise tehnovorm avalikustatud, alamvormi võti=${id}, koondvormi võti=${compound_form_key}, alamvormi number=${publishRes.response.body[0].subFormNumber}/${publishRes.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.trailer_technical.publish"
    event_category: "control_form"
    description: ${description}
    log_content: "{\"subFormKey\":${id},\"compoundFormKey\":${compound_form_key}}"
  result: audit_result
  next: autoPublishCompound

# Viimase alamvormi avalikustamisel avalikustub kinnitatud koondvormi üldosa
# serveris, mitte ainult brauseris (brauseri vormi esitus jääb vaikselt
# tegemata, kui üldosa valideerimine ebaõnnestub). Viga ei tohi alamvormi
# avalikustamist tagasi pöörata.
autoPublishCompound:
  template: "templates/form/compound-form/publish-compound-form"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: "${compound_form_key == null ? '' : String(compound_form_key)}"
    only_if_confirmed: "true"
  result: autoPublishCompoundRes
  error: sendCarrierFromRequest
  next: sendCarrierFromRequest

# Vedajale raske rikkumise teavitus, kui kasutaja märkis kinnitamisel „Teavita
# vedajat" (notifications.carrier_notification_request). Best-effort; vormi andmed
# loeb teenus ise. Sama teenust kutsuvad e-toimiku cron'id automaatse avalikustamise järel.
sendCarrierFromRequest:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-carrier-from-request"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      entity_type: "trailer_technical"
      entity_id: ${id}
      created_by: ${actor_personal_code}
  result: carrierFromRequestRes
  error: evaluateNotifications
  next: evaluateNotifications

evaluateNotifications:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/evaluate-technical-publish"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      entityType: "trailer_technical"
      entityId: ${id}
      compoundFormKey: ${compound_form_key}
      version: ${publishRes.response.body[0].version}
      resultType: ${result_type}
      resultTransportInterruption: ${result_transport_interruption}
      partsSummary: ${parts_summary}
      partsDefects: ${parts_defects}
      violations: ${violations}
      createdBy: ${actor_personal_code}
  result: notificationEvaluationRes
  error: returnSuccess
  next: returnSuccess

returnSuccess:
  return: ${publishRes.response.body}
  next: end

returnNotFound:
  status: 404
  return: '{"error": "NOT_FOUND"}'
  next: end

returnAlreadyPublishedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"already_published"}'
  next: end

returnPunishmentRegisterPermissionError:
  status: 403
  return: '{"type":"FORBIDDEN","field":null,"code":"punishment_register_permission_required"}'
  next: end

returnProceedingOutcomeRequired:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"enforcementDecision","code":"proceeding_outcome_required"}'
  next: end

returnNotConfirmedError:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":null,"code":"not_confirmed"}'
  next: end

check_publishRes_persisted:
  switch:
    - condition: ${publishRes.response == null || publishRes.response.status < 200 || publishRes.response.status >= 300 || publishRes.response.body == null || publishRes.response.body.length == null || publishRes.response.body.length === 0}
      next: returnResqlWriteError
  next: buildLogDescription

returnResqlWriteError:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"write_failed","message":"Andmebaasi kirjutamine ebaõnnestus"}'
  next: end
