declaration:
  call: declare
  version: 0.1
  description: "Get form classifier values by multiple codes"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: codes
        type: array
        description: "List of classifier codes"

extractRequestData:
  assign:
    codes: "${incoming.body.codes.join(',')}"
  next: getClassifierValues

getClassifierValues:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-form/get_available_form_classifier_values"
    headers:
      type: json
    body:
      codes: ${codes}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_form_classifier_values"
    headers:
      type: json
    body:
      values: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
