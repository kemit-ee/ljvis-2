declaration:
  call: declare
  version: 0.1
  description: "Get list of available form permissions for a user"
  method: post
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: number
        description: "User ID"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
  next: getAvailableForms

getAvailableForms:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-form/get_available_permissions"
    headers:
      type: json
    body:
      id: "${id}"
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
