declaration:
  call: declare
  version: 0.1
  description: "Update user group name"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: name
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    name: "${incoming.body.name}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: updateName

updateName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/update_user_group_name"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      name: ${name}
      created_by: "${auth_user.personalcode || ''}"
  result: res
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-update-name"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_group_id: ${user_group_id}
    old_name: ${group_name}
    new_name: ${name}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
