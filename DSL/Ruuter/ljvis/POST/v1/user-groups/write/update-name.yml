declaration:
  call: declare
  version: 0.1
  description: "Update user group name"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: name
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/user_group/calculate-user-group-changed-fields"
  requestType: templates
  body:
    user_group_id: ${user_group_id}
    name: ${name}
  result: changedFieldsResult
  next: extractResult

extractResult:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
    old_name: ${parsed_result.old_name}
  next: updateName

updateName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/update_user_group_name"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      name: ${name}
      created_by: ${actor_personal_code}
  result: res
  next: buildAuditLog

buildAuditLog:
  assign:
    description: "Kasutajagrupi nime muutmine, vana nimi:'${old_name}', uus nimi:'${name}'"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[\"name\"],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_type: "user_group.update"
      event_category: "user_group_management"
      actor_name: ${actor_name}
      actor_personal_code: ${actor_personal_code}
      description: ${description}
      log_content: ${log_content}
      created_by: ${actor_name}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
