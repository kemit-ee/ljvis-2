declaration:
  call: declare
  version: 0.1
  description: "Update user group name"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: name
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    created_by: "${auth_user.personalcode}"

updateName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/update_user_group_name"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      name: ${name}
      created_by: ${created_by}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
