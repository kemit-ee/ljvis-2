declaration:
  call: declare
  version: 0.1
  description: "Replace all organisation links for a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: addedOrganisationIds
        type: array
        description: "Array of added organisation IDs"
      - field: removedOrganisationIds
        type: array
        description: "Array of removed organisation IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    added_organisation_ids: "${(incoming.body.addedOrganisationIds ?? []).join(',')}"
    removed_organisation_ids: "${(incoming.body.removedOrganisationIds ?? []).join(',')}"
    added_organisation_ids_json: ${JSON.stringify((incoming.body.addedOrganisationIds ?? []).map(Number))}
    removed_organisation_ids_json: ${JSON.stringify((incoming.body.removedOrganisationIds ?? []).map(Number))}
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/user_group/calculate-user-group-changed-fields"
  requestType: templates
  body:
    user_group_id: ${user_group_id}
    addedOrganisationIds: ${incoming.body.addedOrganisationIds}
    removedOrganisationIds: ${incoming.body.removedOrganisationIds}
  result: changedFieldsResult
  next: extractResult

extractResult:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
    changed_fields_result: ${parsed_result.changed_fields}
    old_name: ${parsed_result.old_name}
  next: checkRemovedOrgs

checkRemovedOrgs:
  switch:
    - condition: "${removed_organisation_ids == ''}"
      next: checkAddedOrgs
  next: removeOrgs

removeOrgs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_organisations"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      organisation_ids: ${removed_organisation_ids}
      status: "removed"
      created_by: ${actor_personal_code}
  result: removeRes
  next: checkAddedOrgs

checkAddedOrgs:
  switch:
    - condition: "${added_organisation_ids == ''}"
      next: returnSuccess
  next: insertOrgs

insertOrgs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_organisations"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      organisation_ids: ${added_organisation_ids}
      status: "active"
      created_by: ${actor_personal_code}
  result: insertRes
  next: returnSuccess

returnSuccess:
  assign:
    description: "Kasutajagrupi ${old_name} muutmine: organisatsioonid"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[],\"addedOrganisationIds\":${added_organisation_ids_json},\"removedOrganisationIds\":${removed_organisation_ids_json},\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_type: "user_group.update"
      event_category: "user_group_management"
      actor_name: ${actor_name}
      actor_personal_code: ${actor_personal_code}
      description: ${description}
      log_content: ${log_content}
      created_by: ${actor_name}
  result: audit_result
  next: returnSuccessResult

returnSuccessResult:
  return: "ok"
  next: end

return_validation_error:
  status: 422
  return: "validation failed"
  next: end
