declaration:
  call: declare
  version: 0.1
  description: "Replace all organisation links for a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: addedOrganisationIds
        type: array
        description: "Array of added organisation IDs"
      - field: removedOrganisationIds
        type: array
        description: "Array of removed organisation IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    added_organisation_ids: "${(incoming.body.addedOrganisationIds ?? []).join(',')}"
    removed_organisation_ids: "${(incoming.body.removedOrganisationIds ?? []).join(',')}"
    added_organisation_ids_json: ${JSON.stringify((incoming.body.addedOrganisationIds ?? []).map(Number))}
    removed_organisation_ids_json: ${JSON.stringify((incoming.body.removedOrganisationIds ?? []).map(Number))}
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: setOrgs

setOrgs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_organisations"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      added_organisation_ids: ${added_organisation_ids}
      removed_organisation_ids: ${removed_organisation_ids}
      created_by: "${auth_user.personalcode || ''}"
  result: setOrgsRes
  next: checkRemovedOrgs

checkRemovedOrgs:
  switch:
    - condition: "${removed_organisation_ids == ''}"
      next: logAuditEvent
  next: getCascadeRemovedUsers

getCascadeRemovedUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_group_users_by_organisations"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      organisation_ids: ${removed_organisation_ids}
  result: cascadeUsersRes
  next: extractCascadeUserIds

extractCascadeUserIds:
  assign:
    cascade_user_ids: "${cascadeUsersRes.response.body[0].userIds || ''}"
  next: checkCascadeUsers

checkCascadeUsers:
  switch:
    - condition: "${cascade_user_ids == '' || cascade_user_ids == null}"
      next: logAuditEvent
  next: removeUsersFromGroup

removeUsersFromGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${cascade_user_ids}
      status: "removed"
      created_by: "${auth_user.personalcode || ''}"
  result: removeUsersRes
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-set-organisations"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_group_id: ${user_group_id}
    group_name: ${group_name}
    added_org_ids_json: ${added_organisation_ids_json}
    removed_org_ids_json: ${removed_organisation_ids_json}
    cascade_user_ids: ${cascade_user_ids}
  result: audit_result
  next: returnSuccessResult

returnSuccessResult:
  return: "ok"
  next: end

return_validation_error:
  status: 422
  return: "validation failed"
  next: end
