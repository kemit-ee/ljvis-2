declaration:
  call: declare
  version: 0.1
  description: "Add new users to user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: userIds
        type: array
        description: "Array of user IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    user_ids: "${(incoming.body.userIds ?? []).join(',')}"
    actor_name: "${auth_user.firstname} ${auth_user.lastname}"
    actor_personal_code: ${auth_user.personalcode}
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/user_group/calculate-user-group-changed-fields"
  requestType: templates
  body:
    user_group_id: ${user_group_id}
  result: changedFieldsResult
  next: extractResult

extractResult:
  assign:
    parsed_result: ${JSON.parse(changedFieldsResult)}
    old_name: ${parsed_result.old_name}
  next: checkUserIds

checkUserIds:
  switch:
    - condition: "${user_ids == ''}"
      next: buildEmptyAuditEvent
  next: addUsers

addUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${user_ids}
      status: "active"
      created_by: ${actor_personal_code}
  result: addRes
  next: getAddedUserPersonalCodes

getAddedUserPersonalCodes:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_users_by_ids"
    headers:
      type: json
    body:
      user_ids: ${user_ids}
  result: personalCodesRes
  next: buildAuditEvent

buildEmptyAuditEvent:
  assign:
    added_personal_codes_json: "[]"
    description: "Kasutajagrupi ${old_name} muutmine: lisatud kasutajad: "
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

buildAuditEvent:
  assign:
    added_personal_codes_json: ${JSON.stringify((personalCodesRes.response.body ?? []).map(u => u.personalCode))}
    added_personal_codes_str: ${ (personalCodesRes.response.body ?? []).map(u => "'" + u.personalCode + "'").join(', ') }
    description: "Kasutajagrupi ${old_name} muutmine: lisatud kasutajad: ${added_personal_codes_str}"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":${added_personal_codes_json},\"removedUserPersonalCodes\":[],\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_type: "user_group.update"
      event_category: "user_group_management"
      actor_name: ${actor_name}
      actor_personal_code: ${actor_personal_code}
      description: ${description}
      log_content: ${log_content}
      created_by: ${actor_name}
  result: audit_result
  next: returnSuccessResult

returnSuccessResult:
  return: "ok"
  next: end
