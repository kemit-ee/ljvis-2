declaration:
  call: declare
  version: 0.1
  description: "Delete a user from a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: userId
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    user_id: "${incoming.body.userId}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: deleteUser

deleteUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${user_id}
      status: "removed"
      created_by: "${auth_user.personalcode || ''}"
  result: res
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-delete-user"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_group_id: ${user_group_id}
    group_name: ${group_name}
    user_id: ${user_id}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end
