declaration:
  call: declare
  version: 0.1
  description: "Delete a user from a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
      - field: userId
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    user_ids: "${incoming.body.userId}"
    created_by: "${auth_user.personalcode}"
  next: deleteUser

deleteUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${user_ids}
      status: "removed"
      created_by: ${created_by}
  result: res
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end
