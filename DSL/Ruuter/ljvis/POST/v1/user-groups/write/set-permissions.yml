declaration:
  call: declare
  version: 0.1
  description: "Replace all permission links for a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group ID"
      - field: addedPermissionIds
        type: array
        description: "Array of added permission IDs"
      - field: removedPermissionIds
        type: array
        description: "Array of removed permission IDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    user_group_id: "${incoming.body.id}"
    added_permission_ids: "${(incoming.body.addedPermissionIds ?? []).join(',')}"
    removed_permission_ids: "${(incoming.body.removedPermissionIds ?? []).join(',')}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: setPerms

setPerms:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_permissions"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      added_permission_ids: ${added_permission_ids}
      removed_permission_ids: ${removed_permission_ids}
      created_by: "${auth_user.personalcode || ''}"
  result: setPermsRes
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-set-permissions"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_group_id: ${user_group_id}
    group_name: ${group_name}
    added_permission_ids_arr: ${incoming.body.addedPermissionIds ?? []}
    removed_permission_ids_arr: ${incoming.body.removedPermissionIds ?? []}
  result: audit_result
  next: returnSuccessResult

returnSuccessResult:
  return: "ok"
  next: end
