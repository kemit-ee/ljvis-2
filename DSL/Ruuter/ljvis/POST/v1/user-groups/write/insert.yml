declaration:
  call: declare
  version: 0.1
  description: "Create a new user group with optional organisations and permissions"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: name
        type: string
      - field: organisationIds
        type: array
        description: "Array of organisation UUIDs"
      - field: permissionIds
        type: array
        description: "Array of permission UUIDs"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    name: "${incoming.body.name}"
    organisation_ids: "${(incoming.body.organisationIds ?? []).join(',')}"
    permission_ids: "${(incoming.body.permissionIds ?? []).join(',')}"
    created_by: "${auth_user.personalcode}"
    selected_org_count: ${(incoming.body.organisationIds ?? []).length}
  next: validateRequired

validateRequired:
  switch:
    - condition: ${name == null || name == ''}
      next: return_validation_error
  next: validateNameLength

validateNameLength:
  switch:
    - condition: ${name.length > 50}
      next: return_validation_error
  next: validateOrganisations

validateOrganisations:
  switch:
    - condition: "${organisation_ids == ''}"
      next: return_validation_error
  next: createGroup

createGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/insert_user_group"
    headers:
      type: json
    body:
      name: ${name}
      organisation_ids: ${organisation_ids}
      permission_ids: ${permission_ids}
      created_by: ${created_by}
  result: groupRes
  next: extractGroupId

extractGroupId:
  assign:
    user_group_id: "${groupRes.response.body[0].id}"
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-create"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    user_group_id: ${user_group_id}
    group_name: ${name}
    organisation_ids: ${organisation_ids}
    selected_org_count: ${selected_org_count}
    permission_ids: ${permission_ids}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${groupRes.response.body}
  next: end

return_validation_error:
  assign:
    form_error:
      type: VALIDATION_ERROR
      field: ~
      code: validation_failed
  next: emit_validation_error

emit_validation_error:
  status: 422
  return: ${form_error}
  next: end
