declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Get list of available users for a user group with pagination, sorting and search"
  namespace: user-groups
  allowlist:
    body:
      - field: page
        type: string
        description: "Page number"
      - field: pageSize
        type: string
        description: "Items per page"
      - field: userGroupId
        type: string
        description: "Filter by user group"
      - field: sorting
        type: string
      - field: search
        type: string
      - field: organisationIds
        type: string

extractRequestData:
  assign:
    page: "${Number(incoming.body.page ?? 1)}"
    page_size: "${Number(incoming.body.pageSize ?? 20)}"
    sorting: "${incoming.body.sorting ?? 'first_name asc'}"
    search: "${incoming.body.search ?? ''}"
    user_group_id: "${incoming.body.userGroupId}"
    organisation_ids: "${incoming.body.organisationIds ?? ''}"
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_available_users"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      search: ${search}
      user_group_id: ${user_group_id}
      organisation_ids: ${organisation_ids}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
