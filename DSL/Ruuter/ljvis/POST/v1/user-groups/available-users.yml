declaration:

  version: "0.1"
  description: "Get list of available users for a user group with pagination, sorting and search"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Items per page"
      - field: sorting
        type: string
        description: "Sort column and direction"
      - field: search
        type: string
        description: "Search by first or last name"
      - field: userGroupId
        type: string
        description: "Filter by user group"
      - field: organisationIds
        type: string
        description: "Filter by organisations"

extractRequestData:
  assign:
    page: "${incoming.body.page ?? 1}"
    page_size: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'first_name asc'}"
    search: "${incoming.body.search ?? ''}"
    user_group_id: "${incoming.body.userGroupId}"
    organisation_ids: "${incoming.body.organisationIds ?? ''}"
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_available_users"
    headers:
      type: json
    body:
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      search: ${search}
      user_group_id: ${user_group_id}
      organisation_ids: ${organisation_ids}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group_users"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
