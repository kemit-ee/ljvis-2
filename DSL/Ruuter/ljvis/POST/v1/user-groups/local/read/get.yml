declaration:
  call: declare
  version: 0.1
  description: "Get a single user group filtered by own organisation (local scope)"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group UUID"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    organisation_id: "${auth_user.organisationid}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res
  next: checkGroupFound

checkGroupFound:
  switch:
    - condition: ${res.response.body.length > 0}
      next: mapResponse
  next: return_forbidden

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
