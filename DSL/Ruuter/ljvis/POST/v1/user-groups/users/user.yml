declaration:

  version: "1.0"
  description: "Delete a user from a user group"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: q
        type: string
      - field: userId
        type: string

extractRequestData:
  assign:
    user_group_id: "${incoming.body.q}"
    user_id: "${incoming.body.userId}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
    actor_personal_code: "${u.personalcode || ''}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${user_group_id}
      organisation_id: 0
  result: res
  next: extractResult

extractResult:
  assign:
    group_name: "${res.response.body[0].name || ''}"
  next: deleteUser

deleteUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/set_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
      user_ids: ${user_id}
      status: "removed"
      created_by: ${actor_personal_code}
  result: res
  next: getRemovedUserPersonalCode

getRemovedUserPersonalCode:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${user_id}
      organisation_id: ""
  result: personalCodesRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    removed_personal_codes_json: ${JSON.stringify((personalCodesRes.response.body ?? []).map(u => u.personalCode))}
    removed_personal_codes_str: ${ (personalCodesRes.response.body ?? []).map(u => "'" + u.personalCode + "'").join(', ') }
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Kasutajagrupi ${group_name} muutmine: eemaldatud kasutajad: ${removed_personal_codes_str}"
    log_content: "{\"targetGroupId\":${user_group_id},\"changedFields\":[],\"addedOrganisationIds\":[],\"removedOrganisationIds\":[],\"addedPermissionCodes\":[],\"removedPermissionCodes\":[],\"addedUserPersonalCodes\":[],\"removedUserPersonalCodes\":${removed_personal_codes_json},\"cascadeRemovedPersonalCodes\":[]}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user_group.update"
    event_category: "user_group_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: "ok"
  next: end
