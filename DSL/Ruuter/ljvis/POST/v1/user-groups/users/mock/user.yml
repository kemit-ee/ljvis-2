declaration:
  description: "Arenduse mock: POST /v1/user-groups/users/mock/user tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      result: "ok"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.result}
  next: end
