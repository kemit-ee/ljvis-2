declaration:
  call: declare
  version: 0.1
  description: "Get a single user group by ID (admin scope — all organisations)"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group UUID"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    organisation_id: ""
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
