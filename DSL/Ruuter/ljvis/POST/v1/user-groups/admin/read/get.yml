declaration:
  call: declare
  version: 0.1
  description: "Get a single user group by ID (admin scope — all organisations)"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: id
        type: string
        description: "User group UUID"
      - field: logAudit
        type: boolean
        description: "Whether to log an audit event (default true)"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    organisation_id: 0
    log_audit: ${incoming.body.logAudit !== false}
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: checkLogAudit

checkLogAudit:
  switch:
    - condition: ${log_audit === true}
      next: logAuditEvent
  next: returnSuccess

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-view"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    group_id: ${id}
    group_name: "${res.response.body[0].name || ''}"
    scope: "allOrganisations"
    organisation_id: "null"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
