declaration:
  call: declare
  version: 0.1
  description: "List all user groups (admin scope — all organisations)"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: search
        type: string
        description: "Search by group name or organisation name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"
      - field: logSearch
        type: boolean
        description: "Whether to log this as a user-initiated search"

extractRequestData:
  assign:
    search: "${incoming.body.search ?? ''}"
    page: "${incoming.body.page ?? 1}"
    page_size: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'name asc'}"
    log_search: "${incoming.body.logSearch ?? false}"
  next: getUserGroups

getUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/list_user_groups"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: 0
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_groups_list"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: setDefaults

setDefaults:
  assign:
    result_count: ${mapped.response.body.total}
  next: checkSearch

checkSearch:
  switch:
    - condition: "${log_search == true && search.length >= 3}"
      next: logSearchEvent
  next: returnSuccess

logSearchEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/user-group/log-user-group-list-search"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    search: ${search}
    result_count: ${result_count}
    scope: "allOrganisations"
    organisation_id: "null"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
