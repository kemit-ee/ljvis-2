declaration:
  call: declare
  version: 0.1
  description: "List all user groups (admin scope — all organisations)"
  method: post
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    body:
      - field: search
        type: string
        description: "Search by group name or organisation name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

extractRequestData:
  assign:
    search: "${incoming.body.search ?? ''}"
    page: "${incoming.body.page ?? 1}"
    page_size: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'name asc'}"
  next: getUserGroups

getUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/list_user_groups"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: 0
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_groups_list"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
