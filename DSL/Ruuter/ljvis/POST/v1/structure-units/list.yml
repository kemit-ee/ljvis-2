declaration:
  call: declare
  version: 0.1
  description: "List all structure units"
  method: post
  accepts: json
  returns: json
  namespace: structure-units

getStructureUnits:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/structure-units/list_structure_units"
    headers:
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
