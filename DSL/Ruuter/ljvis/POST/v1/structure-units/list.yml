declaration:
  call: declare
  version: 0.1
  description: "List all structure units"
  method: post
  accepts: json
  returns: json
  namespace: structure-units
  allowlist:
    body:
      - field: organisationId
        type: number
        description: "Filter by organisation ID"

extractRequestData:
  assign:
    organisationId: ${incoming.body.organisationId}
  next: getStructureUnits

getStructureUnits:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/structure-units/list_structure_units"
    headers:
      type: json
    body:
      organisationId: ${organisationId}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
