# Nõutav õigus: notification_template_mapping.edit (Postkast 2.0 malli/vastuvõtja
# seadistuste muutmine). auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.includes('notification_template_mapping.edit')}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
