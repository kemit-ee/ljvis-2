declaration:
  version: "1.0"
  description: >-
    MOCK Äriregister esindus_v1 (representation rights) — dev and CI only.
    Stands in for XTR -> X-tee security server -> Äriregister. Production
    points LJVIS_XTR at the real XTR (constants.ini ConfigMap).

    Response shape mirrors what XTR returns for a real esindus_v1 SOAP call
    after XML -> JSON conversion: a `<prefix>:esindus_v1Response` node with a
    `keha.ettevotjad.item[]` list, each item carrying `ariregistri_kood` and
    `arinimi`. The consuming DSLs (representation/companies, representation/
    switch, GET/v1/citizen/risk-scores/{my-company,controls}, POST/v1/citizen/
    forms/search, templates/citizen-company-representative) all strip the
    namespace prefix and read only those two fields.

    Scenario selection is by `personal_code` so tests are deterministic:
    codes listed in `lookupRepresentation` represent the given companies;
    every other code (incl. the 99999999 "unrepresented" E2E checks) gets an
    empty list -> callers return 403 NOT_REPRESENTATIVE. Add a branch here
    when a test needs a citizen who genuinely represents a fixture company.
  namespace: xtr_mock
  allowlist:
    body:
      - field: reg_code
        type: string
      - field: personal_code
        type: string
      - field: personal_code_country
        type: string

lookupRepresentation:
  assign:
    companies: >-
      ${(function(){
        var pc = '' + (incoming.body.personal_code || '');
        var map = {
          // "personalCode": [ { code: "<ariregistri_kood>", name: "<arinimi>" }, ... ]
        };
        return map[pc] || [];
      })()}
  next: buildResponse

buildResponse:
  assign:
    soap: >-
      ${(function(){
        var items = companies.map(function(c){
          return { ariregistri_kood: c.code, arinimi: c.name };
        });
        return {
          body: {
            "ns2:esindus_v1Response": {
              keha: {
                ettevotjad: { item: items }
              }
            }
          }
        };
      })()}
  next: returnResponse

returnResponse:
  status: 200
  return: "${soap}"
  next: end
