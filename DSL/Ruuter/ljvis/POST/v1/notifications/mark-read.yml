declaration:
  version: "1.0"
  description: >-
    Märgib ühe in-app teavituse autenditud kasutaja jaoks loetuks.
    Idempotentne: ON CONFLICT DO NOTHING.
    Teavituse id käib ?q= query-paramina (rest-api-disainijuhend §4.2) —
    Ruuter nõuab kõigi allowlist.body väljade olemasolu, seega ei saa id-d
    valikuliseks kehaväljaks teha.
    Kaitstud POST/.guard (autentimine) kaudu.
  namespace: notification
  allowlist:
    params:
      - field: q
        type: string

extractParams:
  assign:
    notification_id: "${incoming.params.q ?? ''}"
    user_code: "${u.personalcode || ''}"
  next: checkId

checkId:
  switch:
    - condition: ${notification_id === ''}
      next: returnBadRequest
  next: markRead

markRead:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/notification/mark_notification_read"
    headers:
      type: json
    body:
      notification_id: ${notification_id}
      user_code: ${user_code}
  result: res
  next: returnResult

returnResult:
  return: "${res.response.body[0] ?? {notificationId: notification_id, userCode: user_code}}"
  next: end

returnBadRequest:
  status: 400
  return: "notification id is required"
  next: end
