declaration:
  internal: false
  returns: []
  version: "1.0"
  description: >-
    Märgib kõik autenditud kasutaja lugemata teavitused loetuks.
    Lisab lugemise sündmused ühe INSERT ON CONFLICT DO NOTHING päringuga.
    Korduv päring ei lisa duplikaate. Teavituste arv ei ole piiratud.
    Projektiülene guard autendib kasutaja.
  namespace: notification
  allowlist:
    body: []

extractContext:
  assign:
    user_code: "${auth_user.personalcode}"
    permissions: "${(auth_user.permissions || []).join(',')}"
  next: markAllRead

markAllRead:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/notification/mark_all_notifications_read"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      user_code: ${user_code}
      permissions: ${permissions}
  result: res
  next: returnResult

returnResult:
  return: ${res.response.body[0]}
  next: end
