# Nõutav õigus: notification.admin (Postkast 2.0 outbound-log toimingud, UC-04 uuesti saatmine).
# auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.includes('notification.admin')}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
