declaration:
  version: "1.0"
  description: "MOCK Estonian transport manager good-repute lookup — dev and CI only. Stands in for the WHOLE erru/cgr/lookup-mtr.yml wrapper (NYSIIS encoding + real MTR CheckTransportManagerGoodRepute via XTR), which erru/cgr/inbound-request.yml calls with RAW (not yet NYSIIS-encoded) firstName/lastName — lookup-mtr.yml only NYSIIS-encodes internally, right before its own XTR call. This mock therefore matches on the raw names, exactly like lookup-mtr.yml's caller sees them. Field names and response shape are kept identical to that real path (DSL/Ruuter/ljvis/POST/v1/xroad/mtr/check-transport-manager-good-repute.yml's buildResult) so cgr/inbound-request.yml's mapping code works unchanged against either. Match rule: Found when lastName is 'TAMM' or firstName is 'MART' (case-insensitive) or cpcDocumentNumber is EE-CPC-2020-00111; everything else is NotFound."
  namespace: erru
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: birthDate
        type: string
      - field: birthPlace
        type: string
      - field: cpcDocumentNumber
        type: string
      - field: cpcDocumentIssueCountry
        type: string
      - field: cpcDocumentIssueDate
        type: string

selectScenario:
  switch:
    - condition: ${('' + (incoming.body.cpcDocumentNumber || '')).toUpperCase() === 'EE-CPC-2020-00111'}
      next: returnFound
    - condition: ${('' + (incoming.body.lastName || '')).toUpperCase() === 'TAMM'}
      next: returnFound
    - condition: ${('' + (incoming.body.firstName || '')).toUpperCase() === 'MART'}
      next: returnFound
  next: returnNotFound

returnFound:
  assign:
    result: >-
      ${(function(){
        return {
          transportManager: {
            firstName: 'Mart',
            lastName: 'Tamm',
            birthDate: '1980-05-15',
            birthPlace: 'Tallinn',
            cpcDocumentNumber: 'EE-CPC-2020-00111',
            cpcDocumentIssueCountry: 'EE',
            cpcDocumentIssueDate: '2020-06-01',
            companyCount: 1,
            carCount: 8,
            fitness: 'Fit',
            unfitUntil: null
          },
          companies: [
            {
              name: 'AS EESTI VEOD',
              registryCode: '10145678',
              carCount: 8,
              address: { address: 'Tartu mnt 12', postCode: '10145', city: 'Tallinn', country: 'EE' },
              communityLicenses: [
                { communityLicenceNumber: 'EE-CL-2020-11111', communityLicenceStatus: 'Active' }
              ]
            }
          ]
        };
      })()}
  next: returnResult

returnNotFound:
  assign:
    result: "${(function(){ return { transportManager: null, companies: [] }; })()}"
  next: returnResult

returnResult:
  status: 200
  return: "${result}"
  next: end
