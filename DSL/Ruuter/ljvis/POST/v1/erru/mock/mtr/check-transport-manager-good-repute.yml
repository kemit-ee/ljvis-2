declaration:
  internal: false
  version: "1.0"
  description: "Static MTR good-repute mock for dev and test. Responses cover the MOVEHUB MS Test Pack 3.19 registry scenarios. HUB timeout and availability scenarios are handled by the HUB mock."
  namespace: erru
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: birthDate
        type: string
      - field: birthPlace
        type: string
      - field: cpcDocumentNumber
        type: string
      - field: cpcDocumentIssueCountry
        type: string
      - field: cpcDocumentIssueDate
        type: string

selectScenario:
  switch:
    - condition: ${incoming.body.cpcDocumentNumber === 'EE-CPC-SLOW'}
      next: simulateSlowRegister
  next: selectTestPackScenario

