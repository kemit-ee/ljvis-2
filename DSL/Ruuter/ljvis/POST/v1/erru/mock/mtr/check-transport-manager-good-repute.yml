        const nameKey = [incoming.body.firstName, incoming.body.lastName, incoming.body.birthDate]
          .map(value => ('' + (value || '')).trim().toUpperCase()).join('|');
        const scenario = scenarios[certificateKey] || scenarios[nameKey] || null;
        if (scenario == null || scenario.transportManager == null) return scenario;
        const manager = scenario.transportManager;
        if (incoming.body.birthPlace && incoming.body.birthPlace !== manager.birthPlace) return null;
        if (incoming.body.cpcDocumentIssueCountry && incoming.body.cpcDocumentIssueCountry !== manager.cpcDocumentIssueCountry) return null;
        if (incoming.body.cpcDocumentIssueDate && incoming.body.cpcDocumentIssueDate !== manager.cpcDocumentIssueDate) return null;
        return scenario;
      })()}
  next: checkTestPackScenario

checkTestPackScenario:
  switch:
    - condition: ${result != null}
      next: returnResult
  next: selectCiScenario

selectCiScenario:
  switch:
    - condition: ${('' + (incoming.body.cpcDocumentNumber || '')).toUpperCase() === 'EE-CPC-2020-00111'}
      next: returnCiFound
    - condition: ${('' + (incoming.body.lastName || '')).toUpperCase() === 'TAMM'}
      next: returnCiFound
    - condition: ${('' + (incoming.body.firstName || '')).toUpperCase() === 'MART'}
      next: returnCiFound
  next: returnNotFound

returnCiFound:
  assign:
    result: >-
      ${(function(){ return {transportManager:{firstName:'Mart',lastName:'Tamm',birthDate:'1980-05-15',birthPlace:'Tallinn',cpcDocumentNumber:'EE-CPC-2020-00111',cpcDocumentIssueCountry:'EE',cpcDocumentIssueDate:'2020-06-01',companyCount:1,carCount:8,fitness:'Fit',unfitUntil:null},companies:[{name:'AS EESTI VEOD',registryCode:'10145678',carCount:8,address:{address:'Tartu mnt 12',postCode:'10145',city:'Tallinn',country:'EE'},communityLicenses:[{communityLicenceNumber:'EE-CL-2020-11111',communityLicenceStatus:'Active'}]}]}; })()}
  next: returnResult

returnNotFound:
  assign:
    result: "${(function(){ return { transportManager: null, companies: [] }; })()}"
  next: returnResult

returnResult:
  status: 200
  return: "${result}"
  next: end

simulateSlowRegister:
  call: http.get
  args:
    url: "http://erru-hub-mock:8080/_test/wait/12000"
  timeout: 15000
  result: delayResult
  next: returnCiFound
