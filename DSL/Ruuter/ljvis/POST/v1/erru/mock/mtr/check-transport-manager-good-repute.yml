declaration:
  version: "1.0"
  description: "MOCK Estonian transport manager good-repute lookup — dev and CI only. Stands in for the X-tee MTR CheckTransportManagerGoodRepute service that the inbound CGR handler must call when the transport manager is NOT found in the local good_repute_form UNFIT register (see LJVIS2-139, comment by Eda Rembel). Production points ERRU_CGR_MTR_ENDPOINT at the real service via XTR. Match rule is deterministic so Newman tests can rely on it: a transport manager is Found when tmFamilyName is 'TAMM' or tmFirstName is 'MART'; everything else is NotFound. The Found response returns a single EE undertaking with fitnessStatus 'Fit', mirroring the structure of the ERRU 3.5 CheckGoodRepute_ResponseBodyMemberState transportManagerDetails field. The certificate number EE-CPC-2020-00111 is also a match trigger so CPC-based inbound searches can be tested."
  namespace: erru
  allowlist:
    body:
      - field: tmFirstName
        type: string
      - field: tmFamilyName
        type: string
      - field: tmDateOfBirth
        type: string
      - field: certNumber
        type: string

selectScenario:
  switch:
    - condition: ${('' + (incoming.body.certNumber || '')).toUpperCase() === 'EE-CPC-2020-00111'}
      next: returnFoundBycertificate
    - condition: ${('' + (incoming.body.tmFamilyName || '')).toUpperCase() === 'TAMM'}
      next: returnFoundByName
    - condition: ${('' + (incoming.body.tmFirstName || '')).toUpperCase() === 'MART'}
      next: returnFoundByName
  next: returnNotFound

returnFoundByName:
  return: '{"statusCode":"Found","statusMessage":"","transportManagerDetails":{"respondingAuthority":"EE-TRAM","searchMethod":"NYSIIS","nameDetails":{"firstName":"Mart","familyName":"Tamm","dateOfBirth":"1980-05-15","placeOfBirth":"Tallinn"},"addressDetails":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"},"certificateDetails":{"certificateNumber":"EE-CPC-2020-00111","certificateIssueDate":"2020-06-01","certificateIssueCountry":"EE","certificateValidity":"Valid","fitness":{"fitnessStatus":"Fit","unfitStartDate":null,"unfitEndDate":null}},"transportUndertakings":{"totalManagedUndertakings":1,"totalManagedVehicles":8,"undertaking":[{"transportUndertakingName":"AS EESTI VEOD","communityLicenceNumber":"EE-CL-2020-11111","communityLicenceStatus":"Active","numberOfVehicles":8,"address":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"}}]}}}'
  next: end

returnFoundBycertificate:
  return: '{"statusCode":"Found","statusMessage":"","transportManagerDetails":{"respondingAuthority":"EE-TRAM","searchMethod":"CPC","nameDetails":{"firstName":"Mart","familyName":"Tamm","dateOfBirth":"1980-05-15","placeOfBirth":"Tallinn"},"addressDetails":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"},"certificateDetails":{"certificateNumber":"EE-CPC-2020-00111","certificateIssueDate":"2020-06-01","certificateIssueCountry":"EE","certificateValidity":"Valid","fitness":{"fitnessStatus":"Fit","unfitStartDate":null,"unfitEndDate":null}},"transportUndertakings":{"totalManagedUndertakings":1,"totalManagedVehicles":8,"undertaking":[{"transportUndertakingName":"AS EESTI VEOD","communityLicenceNumber":"EE-CL-2020-11111","communityLicenceStatus":"Active","numberOfVehicles":8,"address":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"}}]}}}'
  next: end

returnNotFound:
  return: '{"statusCode":"NotFound","statusMessage":"Transport manager not found in Estonian register","transportManagerDetails":null}'
  next: end
