declaration:
  version: "1.0"
  description: "MOCK Estonian transport-undertaking lookup — dev and CI only. Stands in for the X-tee MTR checkCommunityLicence service that the inbound CTUD handler must call to answer another member state (see the LJVIS2-142 comment by Eda Rembel). Production points ERRU_MTR_ENDPOINT at the real service via XTR. Match rule is deterministic so tests can rely on it: an undertaking is found when the community licence number is EE-CL-2020-11111 or the name contains EESTI; everything else is not found. riskBand is always Grey — Estonia returns a neutral risk band until the risk-assessment module (EPIC 16) is delivered, exactly as the specification requires."
  method: post
  accepts: json
  returns: json
  namespace: erru
  allowlist:
    body:
      - field: transportUndertakingName
        type: string
      - field: communityLicenceNumber
        type: string
      - field: vehicleRegistrationNumber
        type: string
      - field: requestAllVehicles
        type: string

selectScenario:
  switch:
    - condition: ${('' + (incoming.body.communityLicenceNumber || '')).toUpperCase() === 'EE-CL-2020-11111'}
      next: checkAllVehicles
    - condition: ${('' + (incoming.body.transportUndertakingName || '')).toUpperCase().indexOf('EESTI') >= 0}
      next: checkAllVehicles
  next: returnNotFound

checkAllVehicles:
  switch:
    - condition: ${('' + (incoming.body.requestAllVehicles || '')) === 'true'}
      next: returnFoundWithVehicles
  next: returnFound

returnFoundWithVehicles:
  return: '{"statusCode":"Found","statusMessage":"","respondingAuthority":"EE-TRAM","transportUndertakingName":"AS EESTI VEOD","legalForm":"AS","numberOfEmployees":63,"numberOfVehicles":24,"riskRating":0,"riskBand":"Grey","searchMethod":"CommunityLicence","address":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"},"communityLicenceDetails":[{"communityLicenceNumber":"EE-CL-2020-11111","communityLicenceStatus":"Active","communityLicenceType":"CommunityLicenceGoods","startDate":"2020-06-01","expiryDate":"2030-05-31","withdrawalDate":null,"suspensionDate":null,"suspensionExpiryDate":null,"suspensionOrWithdrawalReason":null,"licencingAuthority":"EE-TRAM"}],"certifiedTrueCopyDetails":[{"trueCopyNumber":"EE-CL-2020-11111-001","trueCopyIssueDate":"2020-06-01","trueCopyExpiryDate":"2030-05-31","trueCopySuspensionDate":null,"trueCopySuspensionExpiryDate":null,"trueCopyWithdrawalDate":null}],"vehicleRegistrations":["123ABC","456DEF","789GHI"]}'
  next: end

returnFound:
  return: '{"statusCode":"Found","statusMessage":"","respondingAuthority":"EE-TRAM","transportUndertakingName":"AS EESTI VEOD","legalForm":"AS","numberOfEmployees":63,"numberOfVehicles":24,"riskRating":0,"riskBand":"Grey","searchMethod":"CommunityLicence","address":{"address":"Tartu mnt 12","postCode":"10145","city":"Tallinn","country":"EE"},"communityLicenceDetails":[{"communityLicenceNumber":"EE-CL-2020-11111","communityLicenceStatus":"Active","communityLicenceType":"CommunityLicenceGoods","startDate":"2020-06-01","expiryDate":"2030-05-31","withdrawalDate":null,"suspensionDate":null,"suspensionExpiryDate":null,"suspensionOrWithdrawalReason":null,"licencingAuthority":"EE-TRAM"}],"certifiedTrueCopyDetails":[{"trueCopyNumber":"EE-CL-2020-11111-001","trueCopyIssueDate":"2020-06-01","trueCopyExpiryDate":"2030-05-31","trueCopySuspensionDate":null,"trueCopySuspensionExpiryDate":null,"trueCopyWithdrawalDate":null}],"vehicleRegistrations":[]}'
  next: end

returnNotFound:
  return: '{"statusCode":"NotFound","statusMessage":"Otsitud veoettevõtjat ei leitud Eesti andmetest","respondingAuthority":"EE-TRAM"}'
  next: end
