checkTestPackScenario:
  switch:
    - condition: ${result != null}
      next: returnResult
  next: selectCiScenario

selectCiScenario:
  switch:
    - condition: ${('' + (incoming.body.trueCopyNumber || '')).toUpperCase() === 'EE-CL-2020-11111'}
      next: returnCiFound
    - condition: ${('' + (incoming.body.transportUndertakingName || '')).toUpperCase().indexOf('EESTI') >= 0}
      next: returnCiFound
  next: returnNotFound

returnCiFound:
