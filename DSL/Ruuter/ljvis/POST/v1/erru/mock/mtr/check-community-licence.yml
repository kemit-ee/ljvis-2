    result: >-
      ${(function(){ return {businessCaseId:incoming.body.businessCaseId||'',originatingAuthority:incoming.body.originatingAuthority||'',respondingAuthority:'EE-TRAM',statusCode:'Found',statusMessage:'',transportUndertaking:{transportUndertakingName:'AS EESTI VEOD',address:{address:'Tartu mnt 12',postCode:'10145',city:'Tallinn',country:'EE'},communityLicenceDetails:{communityLicenceNumber:'EE-CL-2020-11111',communityLicenceStatus:'Active',communityLicenceType:'CommunityLicenceGoods',licencingAuthority:'EE-TRAM',startDate:'2020-06-01',expiryDate:'2030-05-31',withdrawalDate:null,withdrawalExpiryDate:null,suspensionDate:null,suspensionExpiryDate:null,numberOfVehicles:3},certifiedTrueCopyDetails:{trueCopyNumber:'EE-CL-2020-11111-001',trueCopyIssueDate:'2020-06-01',trueCopyIssueCountry:'EE',trueCopyExpiryDate:'2030-05-31',trueCopyWithdrawalDate:null,trueCopyWithdrawalExpiryDate:null,trueCopySuspensionDate:null,trueCopySuspensionExpiryDate:null},numberOfEmployees:63,vehicles:((''+(incoming.body.allVehicles||''))==='true'?[{registrationNumber:'123ABC',registrationCountry:'EE'},{registrationNumber:'456DEF',registrationCountry:'EE'},{registrationNumber:'789GHI',registrationCountry:'EE'}]:[])}}; })()}
