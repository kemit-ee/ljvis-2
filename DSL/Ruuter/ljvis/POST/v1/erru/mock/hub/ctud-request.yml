declaration:
  version: "1.0"
  description: "MOCK ERRU hub for CTUD request/response — dev and CI only, never reachable in production (ERRU_CTUD_ENDPOINT points at XTR there). Stands in for the MOVEHUB / s-TESTA synchronous request-response interface, which is unavailable in this environment. Modelled on the legacy SimulationController from the 2010 Erru.Receiver, which served the same purpose (its CheckCommunityLicence_Response DTO shape maps 1:1 onto the fields below, mod camelCase and the 2.4→3.5 singular→array delta). The scenario is selected by the target country so every branch of the send flow is reachable from a test: DE=Found with a full payload, LV=NotFound, PL=Timeout, GR=NotAvailable (a member state still on ERRU v2.4), anything else=Found with a minimal payload. FI is handled by returning HTTP 502 so the transport-failure branch can be exercised. FR/IT/ES/NL cover the remaining COMMUNITY_LICENCE_STATUS values (Suspended/Withdrawn/Expired/LostOrStolen) so the frontend's licence-status rendering has fixtures beyond the default Active. Response shapes follow ERRU 3.5 as derived from the 2.4 CheckCommunityLicence schema plus the LJVIS2-144 specification."
  method: post
  accepts: json
  returns: json
  namespace: erru
  allowlist:
    body:
      - field: ctudTo
        type: string
      - field: businessCaseId
        type: string
      - field: technicalId
        type: string
      - field: workflowId
        type: string
      - field: transportUndertakingName
        type: string
      - field: communityLicenceNumber
        type: string
      - field: vehicleRegistrationNumber
        type: string
      - field: requestAllVehicles
        type: string

selectScenario:
  switch:
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'LV'}
      next: returnNotFound
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'PL'}
      next: returnTimeout
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'GR'}
      next: returnNotAvailable
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'FI'}
      next: returnTransportFailure
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'DE'}
      next: returnFoundFull
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'FR'}
      next: returnFoundSuspended
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'IT'}
      next: returnFoundWithdrawn
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'ES'}
      next: returnFoundExpired
    - condition: ${('' + (incoming.body.ctudTo || '')).toUpperCase() === 'NL'}
      next: returnFoundLostOrStolen
  next: returnFoundMinimal

returnFoundFull:
  return: '{"statusCode":"Found","statusMessage":"","respondingAuthority":"DE-BAG","transportUndertakingName":"Rhein Spedition GmbH","legalForm":"GmbH","numberOfEmployees":42,"numberOfVehicles":18,"riskRating":74,"riskBand":"Green","searchMethod":"CommunityLicence","address":{"address":"Hauptstrasse 12","postCode":"50667","city":"Koeln","country":"DE"},"communityLicenceDetails":[{"communityLicenceNumber":"DE-CL-2019-55821","communityLicenceStatus":"Active","communityLicenceType":"CommunityLicenceGoods","startDate":"2019-04-01","expiryDate":"2029-03-31","withdrawalDate":null,"suspensionDate":null,"suspensionExpiryDate":null,"suspensionOrWithdrawalReason":null,"licencingAuthority":"DE-BAG"},{"communityLicenceNumber":"DE-CL-2015-11002","communityLicenceStatus":"Expired","communityLicenceType":"CommunityLicencePassenger","startDate":"2015-01-01","expiryDate":"2025-01-01","withdrawalDate":null,"suspensionDate":null,"suspensionExpiryDate":null,"suspensionOrWithdrawalReason":null,"licencingAuthority":"DE-BAG"}],"certifiedTrueCopyDetails":[{"trueCopyNumber":"DE-CL-2019-55821-004","trueCopyIssueDate":"2019-04-01","trueCopyExpiryDate":"2029-03-31","trueCopySuspensionDate":null,"trueCopySuspensionExpiryDate":null,"trueCopyWithdrawalDate":null}],"vehicleRegistrations":["K-RS-4412","K-RS-4413"]}'
  next: end

returnFoundMinimal:
  return: '{"statusCode":"Found","statusMessage":"","respondingAuthority":"XX-CA","transportUndertakingName":"Generic Transport Ltd","legalForm":"Ltd","numberOfEmployees":5,"numberOfVehicles":2,"riskRating":10,"riskBand":"Grey","searchMethod":"CompanyName","address":{"address":"Main street 1","postCode":"00001","city":"Capital","country":"XX"},"communityLicenceDetails":[],"certifiedTrueCopyDetails":[],"vehicleRegistrations":[]}'
  next: end

# The four scenarios below all resolve as a SUCCESSFUL exchange (statusCode 'Found') —
# only the licence's own COMMUNITY_LICENCE_STATUS differs, per Global_Types.xsd:272-279.
# They give the frontend fixtures for every non-Active licence-status rendering branch,
# since a hand-picked 'DE' Active licence alone does not exercise those code paths.
