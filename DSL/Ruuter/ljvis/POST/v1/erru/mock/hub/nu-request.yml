declaration:
  internal: false
  version: "1.0"
  description: "Local NU hub mock: broadcast returns mixed results; LV times out, PL is unavailable, FI fails; other targets return OK."
  namespace: erru
  allowlist:
    body:
      - field: nuTo
        type: string
      - field: sentAt
        type: string
      - field: from
        type: string
      - field: version
        type: string
      - field: technicalId
        type: string
      - field: workflowId
        type: string

validateHeader:
  switch:
    - condition: ${incoming.body.version !== '3.5' || !incoming.body.technicalId || !incoming.body.workflowId || !incoming.body.sentAt || !incoming.body.from}
      next: returnInvalidHeader
  next: selectScenario

returnInvalidHeader:
  status: 400
  return: '{"code":"invalid_header"}'
  next: end

selectScenario:
  switch:
    - condition: ${('' + (incoming.body.nuTo || '')).toUpperCase() === 'FI'}
      next: returnTransportFailure
    - condition: ${('' + (incoming.body.nuTo || '')).toUpperCase() === 'ZZ'}
      next: returnBroadcast
    - condition: ${('' + (incoming.body.nuTo || '')).toUpperCase() === 'LV'}
      next: returnSingleTimeout
    - condition: ${('' + (incoming.body.nuTo || '')).toUpperCase() === 'PL'}
      next: returnSingleNotAvailable
  next: returnSingleOk
returnBroadcast:
  return: '{"memberStates":[{"memberStateCode":"DE","respondingAuthority":"DE-BAG","statusCode":"OK","statusMessage":""},{"memberStateCode":"SE","respondingAuthority":"SE-TS","statusCode":"Timeout","statusMessage":"Member state did not respond within the allowed time"},{"memberStateCode":"PL","respondingAuthority":"PL-GITD","statusCode":"NotAvailable","statusMessage":"Member state is not yet available on ERRU 3.5"}]}'
  next: end
returnSingleOk:
  return: "${JSON.stringify({memberStates: [{memberStateCode: ('' + (incoming.body.nuTo || '')).toUpperCase(), respondingAuthority: ('' + (incoming.body.nuTo || '')).toUpperCase() + '-CA', statusCode: 'OK', statusMessage: ''}]})}"
  next: end

returnSingleTimeout:
  return: '{"memberStates":[{"memberStateCode":"LV","respondingAuthority":"LV-CSDD","statusCode":"Timeout","statusMessage":"Member state did not respond within the allowed time"}]}'
  next: end

returnSingleNotAvailable:
  return: '{"memberStates":[{"memberStateCode":"PL","respondingAuthority":"PL-GITD","statusCode":"NotAvailable","statusMessage":"Member state is not yet available on ERRU 3.5"}]}'
  next: end
returnTransportFailure:
  status: 502
  return: '{"error":"ERRU hub simulation: transport failure"}'
  next: end
