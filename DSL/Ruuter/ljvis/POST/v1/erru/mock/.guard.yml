# Register mocks are included in the deployed image for demo/test environments.
# Replace the user-session guard with the existing internal service-token guard.
# Inbound flows send the token only to the exact local mock URL.
declaration:
  override_ancestors: true

check_token:
  switch:
    - condition: ${incoming.headers != null && '[#INTERNAL_COMMUNICATION_KEY]' !== '' && incoming.headers['x-internal-service-token'] === '[#INTERNAL_COMMUNICATION_KEY]'}
      next: allow_mock
  next: deny

allow_mock:
  return: "success"
  status: 200
  next: end

deny:
  return: "forbidden"
  status: 403
  next: end
