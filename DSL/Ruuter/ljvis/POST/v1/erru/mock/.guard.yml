# Permissive guard for the DEV/CI-ONLY register mocks (MTR and X-tee stubs).
#
# The parent POST/.guard requires a LJVIS user cookie. The stubs stand in for external
# registers reached through X-tee, and the flows must call them exactly the way they
# will call XTR in production - i.e. WITHOUT forwarding the operator's session cookie.
# Sending a user cookie to an external endpoint would be wrong, so instead of weakening
# the flows this narrower guard lets the stubs be reached.
#
# Safe because the stubs are unreachable in production: the ERRU_*_ENDPOINT constants that
# reach them (MTR, Liiklusregister) point at XTR there, and nothing else references this path. As defence-in-depth, the
# repo-root .dockerignore excludes this directory from every Docker build context, so it
# cannot ship in any built image even if a constant were ever misconfigured; local/CI
# compose files restore it via a bind-mount of the whole DSL/Ruuter/ljvis tree from the
# host (bind mounts are unaffected by .dockerignore).
#
# override_ancestors is required: Rust Ruuter stacks ancestor guards by default (unlike
# the Java Ruuter parity model where a nested guard replaced its ancestors), so without
# this the parent POST/.guard cookie check would still run and reject the unauthenticated
# mock call with 403 before this guard's own "allow" is ever considered.
declaration:
  override_ancestors: true

allow_mock:
  return: "success"
  status: 200
  next: end
