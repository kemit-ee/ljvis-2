declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Reserve an outgoing RSI envelope, send it through the internal XML adapter, and store the Hub acceptance. The adapter validates ERRU 3.5 XML and performs one HTTP dispatch. Only its accepted result means HTTP 202 from the Hub. Transport uncertainty is send_unknown and cannot be retried. Business responses arrive separately, correlated by the persisted workflowId."
  namespace: erru
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${('' + (incoming.body.id || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${!id}
      next: returnIdRequired
  next: getRequest

getRequest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: current
  next: checkFound

checkFound:
  switch:
    - condition: ${current.response.body.length != 1}
      next: returnNotFound
  next: extractCurrentState

extractCurrentState:
  assign:
    expected_version: "${current.response.body[0].version}"
    cur_status: "${current.response.body[0].status}"
    cur_direction: "${current.response.body[0].direction}"
    business_case_id: "${current.response.body[0].businessCaseId}"
    rsi_to: "${current.response.body[0].rsiTo || ''}"
    originating_authority: "${current.response.body[0].originatingAuthority || ''}"
    request_source: "${current.response.body[0].requestSource || 'RSI'}"
    request_purpose: "${current.response.body[0].requestPurpose || 'Control'}"
    vehicle_registration_number: "${current.response.body[0].vehicleRegistrationNumber || ''}"
    vehicle_registration_country: "${current.response.body[0].vehicleRegistrationCountry || ''}"
    vehicle_category: "${current.response.body[0].vehicleCategory || ''}"
    vehicle_identification_number: "${current.response.body[0].vehicleIdentificationNumber || ''}"
    odometer_reading: "${current.response.body[0].odometerReading != null ? String(current.response.body[0].odometerReading) : ''}"
    driver_first_name: "${current.response.body[0].driverFirstName || ''}"
    driver_family_name: "${current.response.body[0].driverFamilyName || ''}"
    driver_licence_number: "${current.response.body[0].driverLicenceNumber || ''}"
    driver_licence_country: "${current.response.body[0].driverLicenceCountry || ''}"
    identification_details: "${current.response.body[0].identificationDetails || ''}"
    inspection_identifier: "${current.response.body[0].inspectionIdentifier || ''}"
    inspection_location: "${current.response.body[0].inspectionLocation || ''}"
    inspection_datetime: "${current.response.body[0].inspectionDatetime || ''}"
    inspection_authority_or_name: "${current.response.body[0].inspectionAuthorityOrName || ''}"
    inspection_passed: "${current.response.body[0].inspectionPassed != null ? String(current.response.body[0].inspectionPassed) : 'false'}"
    pti_requested: "${current.response.body[0].ptiRequested != null ? String(current.response.body[0].ptiRequested) : 'false'}"
    vehicle_prohibition: "${current.response.body[0].vehicleProhibitionOrRestriction != null ? String(current.response.body[0].vehicleProhibitionOrRestriction) : 'false'}"
    checked_items_raw: "${current.response.body[0].checkedItems || '[]'}"
  next: checkSendable

# RSI differs from CGR: only 'initiated' is sendable. 'error' has NO outgoing transition
# (LJVIS2-146/148) - a new message with a new rsi_message_key must be composed instead.
checkSendable:
  switch:
    - condition: ${cur_direction !== 'outgoing'}
      next: returnNotSendable
    - condition: ${cur_status !== 'initiated'}
      next: returnNotSendable
  next: prepareOutbound

# checked_items are stored with RSI_FAILED_REASON classifier codes (direktiiv 2014/47/EL
# II/III lisa): partCode = ERRU rsiItemType ('0'..'10', '20'), defects[].defectCode = ERRU
# rsiFailedReason (e.g. '1.1.3.a', '30'). Converted here to the rsiCheckedItemType shape:
# {itemType, itemFailed, failedChecks:[{failedReason, failedAssessment}]}.
# Severity: VO→Minor, OV→Major, EOV→Dangerous (ERRU rsiFailedAssessmentType XSD values).
# Drafts saved in the old TECHNICAL_CHECK shape (partCode 'CAA_*') and "Ei vasta nõuetele"
# items without a selected reason are rejected (422 invalid_checked_items) instead of
# sending codes that are not valid ERRU values.
#
# NOTE: this conversion is deliberately split into several small assign steps, each with a
# short expression. A single large IIFE combining the full parse+filter+map+ternary logic
# in one `${...}` expression was found to silently fail once enough OTHER variables had
# already accumulated earlier in this same flow - Ruuter-on-Rust's template evaluator
# returned the literal unevaluated template text instead of raising an error, which went
# unnoticed because no test inspected the actual outbound payload (only the final status).
# Splitting the transformation avoids the failure and is easier to unit-debug step by step.
prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"
    checked_items_array: "${typeof checked_items_raw === 'string' ? JSON.parse(checked_items_raw) : (Array.isArray(checked_items_raw) ? checked_items_raw : [])}"
  next: validateCheckedItems

validateCheckedItems:
  assign:
    invalid_checked_items: "${checked_items_array.some(function(i){ var c = '' + (i.partCode || ''); var ds = i.defects || []; return !/^([0-9]|10|20)$/.test(c) || (i.status === 'non_compliant' && ds.length === 0) || ds.some(function(d){ return !/^[0-9]/.test('' + (d.defectCode || '')) || ['VO','OV','EOV'].indexOf(d.severity) < 0; }); })}"
  next: checkCheckedItems

checkCheckedItems:
  switch:
    - condition: ${invalid_checked_items === true || invalid_checked_items === 'true'}
      next: returnInvalidCheckedItems
  next: convertCheckedItems

convertCheckedItems:
  assign:
    erru_checked_items: "${JSON.stringify(checked_items_array.filter(function(i){return i.status === 'checked' || i.status === 'non_compliant';}).map(function(i){ var sevMap = {'VO':'Minor','OV':'Major','EOV':'Dangerous'}; var failed = i.status === 'non_compliant'; var out = {itemType: parseInt(i.partCode, 10), itemFailed: failed}; if (failed) { out.failedChecks = (i.defects || []).map(function(d){ return {failedReason: d.defectCode, failedAssessment: sevMap[d.severity]}; }); } return out; }))}"
  next: mapAuthorities

# RSI ettepanek 7: teate esitanud pädev asutus (org-kood) ja inspektor
# teisendatakse väljaminevas teates ingliskeelseks ametlikuks nimeks.
mapAuthorities:
  assign:
    originating_authority_out: >-
      ${originating_authority === 'KLIM' ? 'Ministry of Climate'
        : originating_authority === 'PPA' ? 'Estonian Police and Border Guard Board'
        : originating_authority === 'TRAM' ? 'Estonian Transport Administration'
        : originating_authority === 'TI' ? 'Estonian Labour Inspectorate'
        : originating_authority === 'MTA' ? 'Estonian Tax and Customs Board'
        : originating_authority}
    inspection_authority_out: >-
      ${inspection_authority_or_name === 'Politsei- ja Piirivalveamet'
        ? 'Estonian Police and Border Guard Board'
        : inspection_authority_or_name}
  next: validateXml

validateXml:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/rsi/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      rsiTo: ${rsi_to}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority_out}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      vehicleRegistrationNumber: ${vehicle_registration_number}
      vehicleRegistrationCountry: ${vehicle_registration_country}
      vehicleCategory: ${vehicle_category}
      vehicleIdentificationNumber: ${vehicle_identification_number}
      inspectionLocation: ${inspection_location}
      inspectionDatetime: ${inspection_datetime}
      inspectionAuthorityOrName: ${inspection_authority_out}
      inspectionPassed: ${inspection_passed}
      ptiRequested: ${pti_requested}
      vehicleProhibitionOrRestriction: ${vehicle_prohibition}
      checkedItems: ${erru_checked_items}
      odometerReading: ${odometer_reading}
      driverFirstName: ${driver_first_name}
      driverFamilyName: ${driver_family_name}
      driverLicenceNumber: ${driver_licence_number}
      driverLicenceCountry: ${driver_licence_country}
      identificationDetails: ${identification_details}
      inspectionIdentifier: ${inspection_identifier}
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_rsi_xml","message":"RSI data does not satisfy the ERRU 3.5 XML contract. Check VIN, odometer, driver and holder details."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"RSI XML validation is unavailable. The draft was not sent."}'
  next: end

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/begin-send"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expectedVersion: ${expected_version}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/rsi/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      rsiTo: ${rsi_to}
      businessCaseId: ${business_case_id}
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      originatingAuthority: ${originating_authority_out}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      vehicleRegistrationNumber: ${vehicle_registration_number}
      vehicleRegistrationCountry: ${vehicle_registration_country}
      vehicleCategory: ${vehicle_category}
      vehicleIdentificationNumber: ${vehicle_identification_number}
      inspectionLocation: ${inspection_location}
      inspectionDatetime: ${inspection_datetime}
      inspectionAuthorityOrName: ${inspection_authority_out}
      inspectionPassed: ${inspection_passed}
      ptiRequested: ${pti_requested}
      vehicleProhibitionOrRestriction: ${vehicle_prohibition}
      checkedItems: ${erru_checked_items}
      odometerReading: ${odometer_reading}
      driverFirstName: ${driver_first_name}
      driverFamilyName: ${driver_family_name}
      driverLicenceNumber: ${driver_licence_number}
      driverLicenceCountry: ${driver_licence_country}
      identificationDetails: ${identification_details}
      inspectionIdentifier: ${inspection_identifier}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.httpStatus === 202 && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: logIntegrationSuccess
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: logIntegrationFailure
  next: markUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/rsi/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' rsiTo=' + rsi_to + ' checkedItems=' + erru_checked_items}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_rsi"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: storeSent
  next: storeSent

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/rsi/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' rsiTo=' + rsi_to + ' checkedItems=' + erru_checked_items}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU RSI transport failure or error response"
      person_identifier: ""
      source_type: "erru_rsi"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  next: markError

storeSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "sent"
      responseStatusCode: ""
      responseStatusMessage: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: stored_res
  error: checkConcurrentResponse
  next: checkStoreSent

checkStoreSent:
  switch:
    - condition: ${stored_res.response.body == null || stored_res.response.body.length != 1}
      next: checkConcurrentResponse
  next: extractWorkflowId

checkConcurrentResponse:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: latest_after_send
  error: returnFinalizeFailed
  next: checkResponseWonRace

checkResponseWonRace:
  switch:
    - condition: ${latest_after_send.response.body != null && latest_after_send.response.body.length === 1 && latest_after_send.response.body[0].status === 'responded'}
      next: logAuditSend
  next: returnFinalizeFailed

extractWorkflowId:
  assign:
    rsi_wf_id: "${workflow_id}"
  next: logAuditSend

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "error"
      responseStatusCode: ""
      responseStatusMessage: ""
      errorMessage: "ERRU RSI request rejected before acceptance; check the integration log"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "send_unknown"
      responseStatusCode: ""
      responseStatusMessage: ""
      errorMessage: "RSI dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: checkUnknownStored

checkUnknownStored:
  switch:
    - condition: ${unknown_res.response != null && unknown_res.response.body != null && unknown_res.response.body.length === 0}
      next: checkConcurrentResponse
  next: returnUnknown

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"RSI dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the RSI request but local confirmation failed; do not resend"}'
  next: end

logAuditSend:
  template: "templates/audit/erru/rsi/log-rsi-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    rsi_to: ${rsi_to}
    result_status: "sent"
    vehicle_registration_number: ${vehicle_registration_number}
  result: audit_ok
  error: returnSent
  next: returnSent

logAuditError:
  template: "templates/audit/erru/rsi/log-rsi-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    rsi_to: ${rsi_to}
    result_status: "error"
    vehicle_registration_number: ${vehicle_registration_number}
  result: audit_err
  next: returnError

returnSent:
  return: "${JSON.stringify({id: id, status: 'sent', businessCaseId: business_case_id, workflowId: workflow_id, rsiTo: rsi_to})}"
  next: end

returnError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU RSI transport failure - request transitioned to error, a new message must be composed"}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"id","code":"required","message":"id on kohustuslik"}'
  next: end

returnNotFound:
  status: 404
  return: '{"valid":false,"code":"not_found","message":"RSI teade ei leitud"}'
  next: end

returnInvalidCheckedItems:
  status: 422
  return: '{"valid":false,"field":"checkedItems","code":"invalid_checked_items","message":"Kontrollitud punktid on vanas vormingus või punktil „Ei vasta nõuetele” puudub mitteläbimise põhjus"}'
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Teadet ei saa saata praeguses olekus (ainult initiated staatus on saadetav)"}'
  next: end
