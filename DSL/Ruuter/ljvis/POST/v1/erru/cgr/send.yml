declaration:
  internal: false
  version: "1.0"
  description: "Reserve an outgoing CGR envelope, send it through the internal XML adapter and store the Hub acceptance (LJVIS2-139). The adapter validates ERRU 3.5 XML and performs one HTTP dispatch; only its accepted result means HTTP 202 from the Hub. Transport uncertainty is send_unknown and cannot be retried. A definite rejection becomes error and may be retried. The member states answer later, each in its own CheckGoodRepute_Response, correlated by the persisted workflowId (cgr/inbound-response). Flow: get the draft, validate it is sendable (initiated or error), compute NYSIIS search keys if the 7A (name) block is used, validate the XML, reserve the envelope (begin-send), send, then append sent, error or send_unknown."
  namespace: erru
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${('' + (incoming.body.id || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${!id}
      next: returnIdRequired
  next: getRequest

getRequest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: current
  next: checkFound

checkFound:
  switch:
    - condition: ${current.response.body.length != 1}
      next: returnNotFound
  next: extractCurrentState

extractCurrentState:
  assign:
    cur_status: "${current.response.body[0].status}"
    cur_direction: "${current.response.body[0].direction}"
    business_case_id: "${current.response.body[0].businessCaseId}"
    cgr_to: "${current.response.body[0].cgrTo || 'ZZ'}"
    tm_first_name: "${current.response.body[0].tmFirstName || ''}"
    tm_family_name: "${current.response.body[0].tmFamilyName || ''}"
    tm_date_of_birth: "${current.response.body[0].tmDateOfBirth || ''}"
    tm_place_of_birth: "${current.response.body[0].tmPlaceOfBirth || ''}"
    tm_first_name_search_key: "${current.response.body[0].tmFirstNameSearchKey || ''}"
    tm_family_name_search_key: "${current.response.body[0].tmFamilyNameSearchKey || ''}"
    certificate_number: "${current.response.body[0].certificateNumber || ''}"
    certificate_issue_date: "${current.response.body[0].certificateIssueDate || ''}"
    certificate_issue_country: "${current.response.body[0].certificateIssueCountry || ''}"
    originating_authority: "${current.response.body[0].originatingAuthority || ''}"
    request_source: "${current.response.body[0].requestSource || ''}"
    request_purpose: "${current.response.body[0].requestPurpose || ''}"
  next: checkSendable

# Only an outgoing draft (initiated) or a previously failed send (error) may be sent.
# append-transition.sql enforces this too; checking here gives a precise error code.
checkSendable:
  switch:
    - condition: ${cur_direction !== 'outgoing'}
      next: returnNotSendable
    - condition: ${cur_status !== 'initiated' && cur_status !== 'error'}
      next: returnNotSendable
  next: checkNysiisNeeded

# NYSIIS keys must be computed server-side for the 7A (name) search choice.
# They were NOT stored on draft-save (per LJVIS2-139 §4.1: "ERRU sõnumi koostamise käigus")
# so we compute them fresh here. If we already have stored keys (retry of a previously
# sent request), carry them forward without recomputation.
checkNysiisNeeded:
  switch:
    - condition: ${!!tm_first_name && !tm_first_name_search_key}
      next: computeNysiisFirst
    - condition: ${!!tm_first_name && !!tm_first_name_search_key}
      next: prepareOutbound
  next: prepareOutbound

# Call NYSIIS sidecar directly - template mechanism unreliable for GET+body in this engine.
computeNysiisFirst:
  call: http.post
  args:
    url: "[#NYSIIS_ENDPOINT]"
    headers:
      type: json
      Authorization: "Bearer [#NYSIIS_API_KEY]"
    body:
      name: ${tm_first_name}
      useFullName: false
  result: nysiisFirstRes
  next: checkNysiisFirstOk

checkNysiisFirstOk:
  switch:
    - condition: ${nysiisFirstRes.response == null || nysiisFirstRes.response.status !== 200 || nysiisFirstRes.response.body == null || nysiisFirstRes.response.body.length === 0}
      next: returnNysiisError
  next: storeNysiisFirstKey

storeNysiisFirstKey:
  assign:
    tm_first_name_search_key: "${nysiisFirstRes.response.body.searchKey || ''}"
  next: callNysiisFamily

callNysiisFamily:
  call: http.post
  args:
    url: "[#NYSIIS_ENDPOINT]"
    headers:
      type: json
      Authorization: "Bearer [#NYSIIS_API_KEY]"
    body:
      name: ${tm_family_name}
      useFullName: true
  result: nysiissFamilyRes
  next: checkNysiisFamilyOk

checkNysiisFamilyOk:
  switch:
    - condition: ${nysiissFamilyRes.response == null || nysiissFamilyRes.response.status !== 200 || nysiissFamilyRes.response.body == null || nysiissFamilyRes.response.body.length === 0}
      next: returnNysiisError
  next: storeNysiisKeys

storeNysiisKeys:
  assign:
    tm_family_name_search_key: "${nysiissFamilyRes.response.body.searchKey || ''}"
  next: prepareOutbound

prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"
  next: validateXml

validateXml:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/cgr/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      cgrTo: ${cgr_to}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      tmDateOfBirth: ${tm_date_of_birth}
      tmPlaceOfBirth: ${tm_place_of_birth}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateIssueCountry: ${certificate_issue_country}
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/begin-send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      created_by: ${actor_personal_code}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      targetMemberState: ""
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/cgr/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      cgrTo: ${cgr_to}
      businessCaseId: ${business_case_id}
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      tmDateOfBirth: ${tm_date_of_birth}
      tmPlaceOfBirth: ${tm_place_of_birth}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateIssueCountry: ${certificate_issue_country}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.httpStatus === 202 && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: logIntegrationSuccess
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: logIntegrationFailure
  next: markUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/cgr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' cgrTo=' + cgr_to}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_cgr"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: storeSent
  next: storeSent

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/cgr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' cgrTo=' + cgr_to}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU CGR request rejected by the Hub"
      person_identifier: ""
      source_type: "erru_cgr"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  error: markError
  next: markError

storeSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "sent"
      memberStates: ""
      tmFirstNameSearchKey: ""
      tmFamilyNameSearchKey: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: stored_res
  error: checkConcurrentResponse
  next: checkStoreSent

checkStoreSent:
  switch:
    - condition: ${stored_res.response.body == null || stored_res.response.body.length != 1}
      next: checkConcurrentResponse
  next: logAuditSend

# A member state may answer before the Hub acknowledgement is stored: sending -> responded.
checkConcurrentResponse:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: latest_after_send
  error: returnFinalizeFailed
  next: checkResponseWonRace

checkResponseWonRace:
  switch:
    - condition: ${latest_after_send.response.body != null && latest_after_send.response.body.length === 1 && latest_after_send.response.body[0].status === 'responded'}
      next: logAuditSend
  next: returnFinalizeFailed

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "error"
      memberStates: ""
      tmFirstNameSearchKey: ""
      tmFamilyNameSearchKey: ""
      errorMessage: "ERRU CGR request rejected before acceptance - the request may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "send_unknown"
      memberStates: ""
      tmFirstNameSearchKey: ""
      tmFamilyNameSearchKey: ""
      errorMessage: "CGR dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: checkUnknownStored

checkUnknownStored:
  switch:
    - condition: ${unknown_res.response != null && unknown_res.response.body != null && unknown_res.response.body.length === 0}
      next: checkConcurrentResponse
  next: returnUnknown

logAuditSend:
  template: "templates/audit/erru/cgr/log-cgr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    cgr_to: ${cgr_to}
    result_status: "sent"
    member_state_count: "0"
    tm_first_name: ${tm_first_name}
    tm_family_name: ${tm_family_name}
  result: audit_ok
  error: returnSent
  next: returnSent

logAuditError:
  template: "templates/audit/erru/cgr/log-cgr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    cgr_to: ${cgr_to}
    result_status: "error"
    member_state_count: "0"
    tm_first_name: ${tm_first_name}
    tm_family_name: ${tm_family_name}
  result: audit_err
  next: returnError

returnSent:
  return: "${JSON.stringify({id: id, status: 'sent', businessCaseId: business_case_id, workflowId: workflow_id})}"
  next: end

returnError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU CGR request was rejected - it transitioned to error, retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"CGR dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the CGR request but local confirmation failed; do not resend"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_cgr_xml","message":"CGR data does not satisfy the ERRU 3.5 XML contract. Check the name, date of birth and certificate details."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"CGR XML validation is unavailable. The draft was not sent."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"id","code":"required","message":"id on kohustuslik"}'
  next: end

returnNotFound:
  status: 404
  return: '{"valid":false,"code":"not_found","message":"CGR päring ei leitud"}'
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Päringut ei saa saata praeguses olekus"}'
  next: end

returnNysiisError:
  status: 422
  return: '{"valid":false,"field":"name","code":"nysiis_unavailable","message":"NYSIIS otsinguvõtme arvutamine ebaõnnestus"}'
  next: end
