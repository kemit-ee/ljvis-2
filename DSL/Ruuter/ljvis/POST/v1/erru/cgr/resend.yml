declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Re-send a CGR request to ONE member state that did not respond (riigipõhine uuestisaatmine, LJVIS2-139). The request must already be sent or responded. The envelope is reserved with begin-send (status and workflow_id are kept, a new technical_id is issued), the XML goes through the internal adapter to the Hub, and the member state's new answer arrives later as a CheckGoodRepute_Response that replaces only that member state's entry. A rejected or uncertain resend does NOT change the request status: the answers already stored stay valid, an audit entry is logged and 502 is returned. An uncertain outcome (send_unknown) must not be retried automatically."
  namespace: erru
  allowlist:
    body:
      - field: id
        type: string
      - field: memberStateCode
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${('' + (incoming.body.id || '')).trim()}"
    member_state_code: "${('' + (incoming.body.memberStateCode || '')).trim().toUpperCase()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkParams

checkParams:
  switch:
    - condition: ${!id}
      next: returnIdRequired
    - condition: ${!member_state_code}
      next: returnMemberStateRequired
  next: getRequest

getRequest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: current
  next: checkFound

checkFound:
  switch:
    - condition: ${current.response.body.length != 1}
      next: returnNotFound
  next: extractCurrentState

extractCurrentState:
  assign:
    cur_status: "${current.response.body[0].status}"
    cur_direction: "${current.response.body[0].direction}"
    business_case_id: "${current.response.body[0].businessCaseId}"
    cgr_to: "${current.response.body[0].cgrTo || 'ZZ'}"
    tm_first_name: "${current.response.body[0].tmFirstName || ''}"
    tm_family_name: "${current.response.body[0].tmFamilyName || ''}"
    tm_date_of_birth: "${current.response.body[0].tmDateOfBirth || ''}"
    tm_place_of_birth: "${current.response.body[0].tmPlaceOfBirth || ''}"
    tm_first_name_search_key: "${current.response.body[0].tmFirstNameSearchKey || ''}"
    tm_family_name_search_key: "${current.response.body[0].tmFamilyNameSearchKey || ''}"
    certificate_number: "${current.response.body[0].certificateNumber || ''}"
    certificate_issue_date: "${current.response.body[0].certificateIssueDate || ''}"
    certificate_issue_country: "${current.response.body[0].certificateIssueCountry || ''}"
    originating_authority: "${current.response.body[0].originatingAuthority || ''}"
    request_source: "${current.response.body[0].requestSource || ''}"
    request_purpose: "${current.response.body[0].requestPurpose || ''}"
  next: checkResendable

# Resend is only valid for an outgoing request that was accepted by the Hub (sent or responded).
checkResendable:
  switch:
    - condition: ${cur_direction !== 'outgoing'}
      next: returnNotResendable
    - condition: ${cur_status !== 'sent' && cur_status !== 'responded'}
      next: returnNotResendable
  next: prepareOutbound

prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"
  next: validateXml

validateXml:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/cgr/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      cgrTo: ${member_state_code}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      tmDateOfBirth: ${tm_date_of_birth}
      tmPlaceOfBirth: ${tm_place_of_birth}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateIssueCountry: ${certificate_issue_country}
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/begin-send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      created_by: ${actor_personal_code}
      tmFirstNameSearchKey: ""
      tmFamilyNameSearchKey: ""
      targetMemberState: ${member_state_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotResendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    cgr_wf_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: logIntegrationUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/cgr/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${cgr_wf_id}
      sentAt: ${sent_at}
      cgrTo: ${member_state_code}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      tmDateOfBirth: ${tm_date_of_birth}
      tmPlaceOfBirth: ${tm_place_of_birth}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateIssueCountry: ${certificate_issue_country}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: logIntegrationUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.httpStatus === 202 && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === cgr_wf_id}
      next: logIntegrationSuccess
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: logIntegrationFailure
  next: logIntegrationUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/cgr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' memberState=' + member_state_code}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_cgr_resend"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: logAuditResend
  next: logAuditResend

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/cgr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' memberState=' + member_state_code}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU CGR resend rejected by the Hub"
      person_identifier: ""
      source_type: "erru_cgr_resend"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  error: logAuditResendFailed
  next: logAuditResendFailed

# Outcome unknown: log it and tell the caller not to resend until the journal is reconciled.
logIntegrationUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/cgr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' memberState=' + member_state_code}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU CGR resend outcome unknown"
      person_identifier: ""
      source_type: "erru_cgr_resend"
      source_record_id: "${'' + business_case_id}"
  result: log_unknown
  error: returnUnknown
  next: returnUnknown

logAuditResend:
  template: "templates/audit/erru/cgr/log-cgr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    cgr_to: ${member_state_code}
    result_status: "resent"
    member_state_count: "0"
    tm_first_name: ${tm_first_name}
    tm_family_name: ${tm_family_name}
  result: audit_ok
  error: returnResent
  next: returnResent

# A rejected resend does NOT transition the request: the stored answers stay valid and the
# resend can be retried immediately. Only an audit trail entry is written and 502 is returned.
logAuditResendFailed:
  template: "templates/audit/erru/cgr/log-cgr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    cgr_to: ${member_state_code}
    result_status: "resend_failed"
    member_state_count: "0"
    tm_first_name: ${tm_first_name}
    tm_family_name: ${tm_family_name}
  result: audit_err
  error: returnError
  next: returnError

returnResent:
  return: "${JSON.stringify({id: id, status: cur_status, businessCaseId: business_case_id, workflowId: cgr_wf_id, resentMemberState: member_state_code})}"
  next: end

returnError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU CGR resend was rejected - retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"CGR resend outcome is unknown; do not resend until it is reconciled"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_cgr_xml","message":"CGR data does not satisfy the ERRU 3.5 XML contract"}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"CGR XML validation is unavailable. Nothing was sent."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"id","code":"required","message":"id on kohustuslik"}'
  next: end

returnMemberStateRequired:
  status: 400
  return: '{"valid":false,"field":"memberStateCode","code":"required","message":"memberStateCode on kohustuslik"}'
  next: end

returnNotFound:
  status: 404
  return: '{"valid":false,"code":"not_found","message":"CGR päring ei leitud"}'
  next: end

returnNotResendable:
  status: 422
  return: '{"valid":false,"code":"not_resendable","message":"Uuestisaatmine on võimalik ainult saadetud või vastatud olekus päringutel"}'
  next: end
