declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Reserve an outgoing NCR request, send it as ERRU 3.5 XML through the internal adapter and store the Hub acceptance (LJVIS2-64 §4.2). The adapter validates the XML and performs one HTTP dispatch; only HTTP 202 means accepted. Flow: initiated|error -> sending -> sent (or send_unknown, never resent, or error after a definite rejection, which may be retried). The destination's NotifyCheckResult_Acknowledgement (ncr/inbound-ack) moves the message to acknowledged and its NotifyCheckResult_Response (ncr/inbound-response) to responded; a negative acknowledgement ends in error."
  namespace: erru
  allowlist:
    body:
      - field: businessCaseId
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${business_case_id === ''}
      next: returnIdRequired
  next: getCase

getCase:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: caseRes
  next: checkCaseFound

checkCaseFound:
  switch:
    - condition: ${caseRes.response.body.length === 0}
      next: returnNotFound
  next: checkSendable

checkSendable:
  assign:
    current: "${caseRes.response.body[caseRes.response.body.length - 1]}"
  next: checkSendableState

checkSendableState:
  switch:
    - condition: ${current.direction !== 'outgoing'}
      next: returnNotSendable
    - condition: ${current.status !== 'initiated' && current.status !== 'error'}
      next: returnNotSendable
  next: mapOriginatingAuthority

# NCR ettepanek 7: väljaminevas teates teisendatakse teate esitav pädev asutus
# ingliskeelseks ametlikuks nimeks (salvestatud on org-kood, nt "KLIM").
mapOriginatingAuthority:
  assign:
    originating_authority_out: >-
      ${current.originatingAuthority === 'KLIM' ? 'Ministry of Climate'
        : current.originatingAuthority === 'PPA' ? 'Estonian Police and Border Guard Board'
        : current.originatingAuthority === 'TRAM' ? 'Estonian Transport Administration'
        : current.originatingAuthority === 'TI' ? 'Estonian Labour Inspectorate'
        : current.originatingAuthority === 'MTA' ? 'Estonian Tax and Customs Board'
        : current.originatingAuthority}
  next: validateXml
validateXml:
  assign:
    start_time: "${new Date().getTime()}"
  next: callValidate

callValidate:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      ncrTo: ${current.ncrTo}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority_out}
      requestSource: ${current.requestSource}
      requestPurpose: ${current.requestPurpose}
      transportUndertakingName: ${current.transportUndertakingName}
      communityLicenceNumber: ${current.communityLicenceNumber}
      vehicleRegistrationNumber: ${current.vehicleRegistrationNumber}
      vehicleRegistrationCountry: ${current.vehicleRegistrationCountry}
      checkResult: ${current.checkResult}
      checkDate: ${current.checkDate}
      minorInfringement: ${current.minorInfringement}
      seriousInfringements: ${current.seriousInfringements}
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/begin-send"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      ncrTo: ${current.ncrTo}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority_out}
      requestSource: ${current.requestSource}
      requestPurpose: ${current.requestPurpose}
      transportUndertakingName: ${current.transportUndertakingName}
      communityLicenceNumber: ${current.communityLicenceNumber}
      vehicleRegistrationNumber: ${current.vehicleRegistrationNumber}
      vehicleRegistrationCountry: ${current.vehicleRegistrationCountry}
      checkResult: ${current.checkResult}
      checkDate: ${current.checkDate}
      minorInfringement: ${current.minorInfringement}
      seriousInfringements: ${current.seriousInfringements}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.httpStatus === 202 && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: logIntegrationSuccess
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: logIntegrationFailure
  next: markUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ncr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' ncrTo=' + current.ncrTo}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_ncr"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: storeSent
  next: storeSent

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ncr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' ncrTo=' + current.ncrTo}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU NCR request rejected by the Hub"
      person_identifier: ""
      source_type: "erru_ncr"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  error: markError
  next: markError

storeSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "sent"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: sent_res
  error: checkConcurrentAnswer
  next: checkSentStored

checkSentStored:
  switch:
    - condition: ${sent_res.response.body == null || sent_res.response.body.length != 1}
      next: checkConcurrentAnswer
  next: logAuditSent

# The acknowledgement or response may already have been stored (sending -> acknowledged|responded).
checkConcurrentAnswer:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: latest_after_send
  error: returnFinalizeFailed
  next: checkAnswerWonRace

checkAnswerWonRace:
  switch:
    - condition: ${latest_after_send.response.body != null && latest_after_send.response.body.length > 0 && ['acknowledged', 'responded'].indexOf(latest_after_send.response.body[latest_after_send.response.body.length - 1].status) >= 0}
      next: logAuditSent
  next: returnFinalizeFailed

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "ERRU NCR request rejected before acceptance - the request may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditTransportError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "send_unknown"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "NCR dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: checkUnknownStored

checkUnknownStored:
  switch:
    - condition: ${unknown_res.response != null && unknown_res.response.body != null && unknown_res.response.body.length === 0}
      next: checkConcurrentAnswer
  next: returnUnknown

logAuditSent:
  template: "templates/audit/erru/ncr/log-ncr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ncr_to: "${current.ncrTo}"
    result_status: "sent"
    ack_status_code: ""
  result: audit_ok
  error: returnSent
  next: returnSent

logAuditTransportError:
  template: "templates/audit/erru/ncr/log-ncr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ncr_to: "${current.ncrTo}"
    result_status: "error"
    ack_status_code: "rejected"
  result: audit_err
  next: returnTransportError

returnSent:
  return: "${JSON.stringify({businessCaseId: business_case_id, status: 'sent', workflowId: workflow_id})}"
  next: end

returnTransportError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR request was rejected - request transitioned to error, retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"NCR dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the NCR request but local confirmation failed; do not resend"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_ncr_xml","message":"NCR data does not satisfy the ERRU 3.5 XML contract. Check the undertaking, vehicle, check result and infringements."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"NCR XML validation is unavailable. The request was not sent."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"businessCaseId","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ncr case not found"
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Teadet ei saa saata praeguses olekus (initiated või error on saadetavad)"}'
  next: end
