declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Reserve an outgoing NCR request, send it as ERRU 3.5 XML through the internal adapter and store the Hub acceptance (LJVIS2-64 §4.2). The adapter validates the XML and performs one HTTP dispatch; only HTTP 202 means accepted. Flow: initiated|error -> sending -> sent (or send_unknown, never resent, or error after a definite rejection, which may be retried). The destination's NotifyCheckResult_Acknowledgement (ncr/inbound-ack) moves the message to acknowledged and its NotifyCheckResult_Response (ncr/inbound-response) to responded; a negative acknowledgement ends in error."
  namespace: erru
  allowlist:
    body:
      - field: businessCaseId
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${business_case_id === ''}
      next: returnIdRequired
  next: getCase

getCase:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: caseRes
  next: checkCaseFound

checkCaseFound:
  switch:
    - condition: ${caseRes.response.body.length === 0}
      next: returnNotFound
  next: checkSendable

checkSendable:
  assign:
    current: "${caseRes.response.body[caseRes.response.body.length - 1]}"
  next: checkSendableState

checkSendableState:
  switch:
    - condition: ${current.direction !== 'outgoing'}
      next: returnNotSendable
    - condition: ${current.status !== 'initiated' && current.status !== 'error'}
      next: returnNotSendable
  next: mapOriginatingAuthority

# NCR ettepanek 7: väljaminevas teates teisendatakse teate esitav pädev asutus
# ingliskeelseks ametlikuks nimeks (salvestatud on org-kood, nt "KLIM").
mapOriginatingAuthority:
  assign:
    originating_authority_out: >-
      ${current.originatingAuthority === 'KLIM' ? 'Ministry of Climate'
        : current.originatingAuthority === 'PPA' ? 'Estonian Police and Border Guard Board'
        : current.originatingAuthority === 'TRAM' ? 'Estonian Transport Administration'
        : current.originatingAuthority === 'TI' ? 'Estonian Labour Inspectorate'
        : current.originatingAuthority === 'MTA' ? 'Estonian Tax and Customs Board'
        : current.originatingAuthority}
  next: prepareOutbound

prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"
  next: xtrPreflight

# XTR validates against the XSD only in report/enforce mode; keep refusing what the Java builder refused.
xtrPreflight:
  switch:
    - condition: "${!current.ncrTo || !business_case_id || !originating_authority_out || !current.requestSource || !current.requestPurpose}"
      next: returnInvalidXml
    - condition: "${!current.transportUndertakingName || !current.communityLicenceNumber || !current.vehicleRegistrationNumber || !current.vehicleRegistrationCountry || !current.checkResult || !current.checkDate}"
      next: returnInvalidXml
    - condition: "${((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.seriousInfringements) || []).some(function(si) { return !si.dateOfInfringement || !si.category || si.infringementType == null || !(si.penaltiesImposed || []).length; })}"
      next: returnInvalidXml
  next: reserveSend

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/begin-send"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: composeXtrSerious

composeXtrSerious:
  assign:
    xtr_serious: "${((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.seriousInfringements) || []).map(function(si) { var d = function(s) { return String(s || '').substring(0, 10); }; var c = function(o) { return Object.keys(o).filter(function(k) { return o[k] !== '' && o[k] != null; }).reduce(function(a, k) { a[k] = o[k]; return a; }, {}); }; var b = function(b) { return (b === true || b === 'true' || b === 1 || b === '1') ? 'true' : 'false'; }; return Object.assign({'@dateOfInfringement': d(si.dateOfInfringement), '@category': si.category, '@infringementType': String(si.infringementType), '@appealPossible': b(si.appealPossible), 'PenaltiesImposed': {'PenaltyImposed': (si.penaltiesImposed || []).map(function(p) { return c({'@penaltyImposedIdentifier': String(p.penaltyImposedIdentifier), '@finalDecisionDate': d(p.finalDecisionDate), '@penaltyTypeImposed': String(p.penaltyTypeImposed), '@startDate': d(p.startDate), '@endDate': d(p.endDate), '@isExecuted': p.isExecuted, '@notExecutedReason': p.notExecutedReason}); })}}, (si.penaltiesRequested || []).length > 0 ? {'PenaltiesRequested': {'PenaltyRequested': si.penaltiesRequested.map(function(p) { return c({'@penaltyRequestedIdentifier': String(p.penaltyRequestedIdentifier), '@penaltyTypeRequested': String(p.penaltyTypeRequested), '@duration': p.duration == null || p.duration === '' ? '' : String(p.duration)}); })}} : {}); })}"
  next: composeXtrMinor

composeXtrMinor:
  assign:
    xtr_minor: "${(function(m) { return m && m.dateOfInfringement ? {'MinorInfringement': {'@dateOfInfringement': String(m.dateOfInfringement).substring(0, 10), '@numberOfInfringements': String(m.numberOfInfringements)}} : {}; })((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.minorInfringement))}"
  next: composeXtrBody

composeXtrBody:
  assign:
    xtr_body: "${{'Header': {'@version': '3.5', '@technicalId': technical_id, '@workflowId': workflow_id, '@sentAt': new Date(String(sent_at).replace(' ', 'T')).toISOString().substring(0, 19) + 'Z', '@from': 'EE', '@to': current.ncrTo}, 'Body': {'@businessCaseId': business_case_id, '@originatingAuthority': originating_authority_out, '@requestSource': current.requestSource, '@requestPurpose': current.requestPurpose, 'TransportUndertaking': Object.assign({'@transportUndertakingName': current.transportUndertakingName, '@communityLicenceNumber': current.communityLicenceNumber, 'Vehicle': {'@vehicleRegistrationNumber': current.vehicleRegistrationNumber, '@vehicleRegistrationCountry': current.vehicleRegistrationCountry}, 'CheckSummary': {'@checkResult': current.checkResult, '@dateOfCheck': String(current.checkDate).substring(0, 10)}}, xtr_minor, {'SeriousInfringement': xtr_serious})}}}"
  next: callErruXtr

callErruXtr:
  call: http.post
  error: markUnknown
  args:
    url: "${('[#ERRU_XTR_BRIDGE]'.indexOf('ERRU_XTR_BRIDGE') >= 0 ? 'http://erru-xml-adapter:8080' : '[#ERRU_XTR_BRIDGE]') + '/xml-out/erru/erru/NotifyCheckResult_Request'}"
    headers:
      type: json
      Authorization: "Bearer [#INTERNAL_COMMUNICATION_KEY]"
    body: ${xtr_body}
  result: erru_res
  timeout: 30000
  next: checkXtrStatus

# XTR raw-XML lane: HTTP 200 carries the Hub's own HTTP status in body.status. Hub 202 = accepted; another 4xx
# (or XTR's own 422 schema_invalid, nothing sent) is a definite refusal; everything else is unknown, never resent.
checkXtrStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 202}
      next: logIntegrationSuccess
    - condition: ${(erru_res.response.status === 200 && erru_res.response.body.status >= 400 && erru_res.response.body.status < 500) || erru_res.response.status === 422 || erru_res.response.status === 401 || erru_res.response.status === 404 || erru_res.response.status === 400 || erru_res.response.status === 413}
      next: logIntegrationFailure
  next: markUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ncr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' ncrTo=' + current.ncrTo}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_ncr"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: storeSent
  next: storeSent

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ncr/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' ncrTo=' + current.ncrTo}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU NCR request rejected by the Hub"
      person_identifier: ""
      source_type: "erru_ncr"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  error: markError
  next: markError

storeSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "sent"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: sent_res
  error: checkConcurrentAnswer
  next: checkSentStored

checkSentStored:
  switch:
    - condition: ${sent_res.response.body == null || sent_res.response.body.length != 1}
      next: checkConcurrentAnswer
  next: logAuditSent

# The acknowledgement or response may already have been stored (sending -> acknowledged|responded).
checkConcurrentAnswer:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: latest_after_send
  error: returnFinalizeFailed
  next: checkAnswerWonRace

checkAnswerWonRace:
  switch:
    - condition: ${latest_after_send.response.body != null && latest_after_send.response.body.length > 0 && ['acknowledged', 'responded'].indexOf(latest_after_send.response.body[latest_after_send.response.body.length - 1].status) >= 0}
      next: logAuditSent
  next: returnFinalizeFailed

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "ERRU NCR request rejected before acceptance - the request may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditTransportError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "send_unknown"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "NCR dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: checkUnknownStored

checkUnknownStored:
  switch:
    - condition: ${unknown_res.response != null && unknown_res.response.body != null && unknown_res.response.body.length === 0}
      next: checkConcurrentAnswer
  next: returnUnknown

logAuditSent:
  template: "templates/audit/erru/ncr/log-ncr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ncr_to: "${current.ncrTo}"
    result_status: "sent"
    ack_status_code: ""
  result: audit_ok
  error: returnSent
  next: returnSent

logAuditTransportError:
  template: "templates/audit/erru/ncr/log-ncr-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ncr_to: "${current.ncrTo}"
    result_status: "error"
    ack_status_code: "rejected"
  result: audit_err
  next: returnTransportError

returnSent:
  return: "${JSON.stringify({businessCaseId: business_case_id, status: 'sent', workflowId: workflow_id})}"
  next: end

returnTransportError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR request was rejected - request transitioned to error, retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"NCR dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the NCR request but local confirmation failed; do not resend"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_ncr_xml","message":"NCR data does not satisfy the ERRU 3.5 XML contract. Check the undertaking, vehicle, check result and infringements."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"businessCaseId","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ncr case not found"
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Teadet ei saa saata praeguses olekus (initiated või error on saadetavad)"}'
  next: end
