declaration:
  version: "1.0"
  description: "Send the Estonian response draft to an incoming NCR message (LJVIS2-64 §4.5).
    Sendable states: 'answer_drafted' (first send) or 'error' (retry). Sending is blocked
    while the message is 'forwarded' (LJVIS2-62 §4 'Kui teade on olekus Suunatud menetlusse,
    ei saa vastust saata enne, kui seotud välisriigi rikkumise vorm on eemaldatud') — that
    state simply is not in the sendable set, so it naturally falls into 422 not_sendable. On
    success the message becomes 'answered'; on ack failure or transport failure it becomes
    'error' and can be retried. Note the path is POST /v1/erru/ncr/response-send (not nested
    under response/) so it can be protected by the ncr.send guard at erru/ncr/.guard, distinct
    from erru/ncr/response/.guard (ncr.respond) which protects only response/save.yml."
  namespace: erru
  allowlist:
    body:
      - field: businessCaseId
        type: string

extractRequestData:
  assign:
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${business_case_id === ''}
      next: returnIdRequired
  next: getCase

getCase:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: caseRes
  next: checkCaseFound

checkCaseFound:
  switch:
    - condition: ${caseRes.response.body.length === 0}
      next: returnNotFound
  next: checkSendable

checkSendable:
  assign:
    current: "${caseRes.response.body[caseRes.response.body.length - 1]}"
  next: checkSendableState

checkSendableState:
  switch:
    - condition: ${current.direction !== 'incoming'}
      next: returnNotSendable
    - condition: ${current.status !== 'answer_drafted' && current.status !== 'error'}
      next: returnNotSendable
  next: extractResponseData

# TransportUndertaking (name, vehicle count, address, community licence status) and the
# imposed-penalty decisions are collected on the response form and stored by
# response/save.yml (append-response-draft.sql); this step forwards them to XTR. They are
# sent even though the ERRU 3.5 XSD marks both elements optional (minOccurs="0") —
# see the ncr-response.yml header.
extractResponseData:
  assign:
    response_tu_name: "${current.transportUndertakingName || ''}"
    response_licence_number: "${current.communityLicenceNumber || ''}"
    response_number_of_vehicles: "${current.responseNumberOfVehicles != null ? String(current.responseNumberOfVehicles) : ''}"
    response_licence_status: "${current.responseCommunityLicenceStatus || ''}"
    response_address_raw: "${current.responseAddress || ''}"
    response_penalties_raw: "${current.responsePenaltiesImposed || '[]'}"
  next: parseResponseAddress

parseResponseAddress:
  assign:
    response_address_obj: "${response_address_raw ? (typeof response_address_raw === 'string' ? JSON.parse(response_address_raw) : response_address_raw) : {}}"
  next: parseResponsePenalties

# Build a plain JSON array (NOT an XML string) — the XTR DSL template (ncr-response.yml) owns
# the `{{#each}}` loop and the erru: namespace prefixing (every schema in contracts/erru/3.5/
# declares elementFormDefault="qualified", so a string-built fragment inserted with {{{ }}}
# would produce unprefixed PenaltyImposed elements under the namespace-qualified
# PenaltiesImposed parent — schema-invalid). penaltyTypeImposed is XSD-required even when
# isImposed=false — response/save.yml strips it client-side for display purposes (LJVIS2-63
# §4 "Määrati karistus = Ei peidab ja tühjendab välja"), so it falls back to '102' (Other)
# here to keep the outbound message schema-valid. reason is only emitted for isImposed=false,
# matching ncrPenaltyImposedResponseType's documented intent ("Reason if penalty is not
# imposed").
parseResponsePenalties:
  assign:
    response_penalties_array: "${typeof response_penalties_raw === 'string' ? JSON.parse(response_penalties_raw || '[]') : (Array.isArray(response_penalties_raw) ? response_penalties_raw : [])}"
  next: buildPenaltiesImposed

buildPenaltiesImposed:
  assign:
    response_penalties_imposed: >-
      ${response_penalties_array.map(function(p){
        var isImposed = p.isImposed === true;
        return {
          penaltyRequestedIdentifier: '' + p.penaltyRequestedIdentifier,
          authorityImposingPenalty: p.authorityImposingPenalty || '',
          isImposed: isImposed ? 'true' : 'false',
          penaltyTypeImposed: p.penaltyTypeImposed || '102',
          startDate: p.startDate || '',
          endDate: p.endDate || '',
          reason: (!isImposed && p.reason) ? p.reason : ''
        };
      })}
  next: generateErruIds

# technicalId is fresh per outbound message; generated HERE so the same value is both sent
# in the SOAP message (callErru below) and stored in our DB (storeAnswered below) for
# correlation. workflowId is NOT generated — it must be the incoming request's workflowId
# (current.workflowId), already fetched above, so the hub can match the reply; the
# workflow_id this endpoint also returns is deliberately ignored. Source is Postgres
# gen_random_uuid(), not Math.random() — a JS PRNG is not a secure source for a
# correlation id.
generateErruIds:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/generate-uuid-pair"
    headers:
      type: json
    body: {}
  result: erru_ids_res
  next: extractErruIds

extractErruIds:
  assign:
    erru_technical_id: "${erru_ids_res.response.body[0].technicalId}"
    erru_sent_at: "${new Date().toISOString().slice(0,19) + 'Z'}"
  next: callErru

callErru:
  call: http.post
  args:
    url: "[#ERRU_NCR_RESPONSE_ENDPOINT]"
    headers:
      type: json
    body:
      ncrTo: ${current.ncrFrom}
      businessCaseId: ${business_case_id}
      technicalId: ${erru_technical_id}
      workflowId: "${current.workflowId || ''}"
      sentAt: ${erru_sent_at}
      originatingAuthority: ${current.originatingAuthority}
      respondingAuthority: ${current.respondingAuthority}
      responseStatusCode: ${current.responseStatusCode}
      transportUndertakingName: ${response_tu_name}
      communityLicenceNumber: ${response_licence_number}
      numberOfVehicles: ${response_number_of_vehicles}
      communityLicenceStatus: ${response_licence_status}
      tuAddress: "${response_address_obj.address || ''}"
      tuPostCode: "${response_address_obj.postCode || ''}"
      tuCity: "${response_address_obj.city || ''}"
      tuCountry: "${response_address_obj.country || ''}"
      penaltiesImposed: ${response_penalties_imposed}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.status >= 400}
      next: markError
  next: extractAck

extractAck:
  assign:
    ack_body: "${erru_res.response.body != null && erru_res.response.body.response != null ? JSON.parse(erru_res.response.body.response) : erru_res.response.body}"
  next: checkAckStatusCode

checkAckStatusCode:
  assign:
    ack_status_code: "${(ack_body && ack_body.statusCode) || 'NotAvailable'}"
  next: decideAckOutcome

decideAckOutcome:
  switch:
    - condition: ${ack_status_code === 'OK'}
      next: storeAnswered
  next: markErrorAfterNegativeAck

storeAnswered:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "answered"
      technicalId: ${erru_technical_id}
      workflowId: ""
      sentAt: ""
      ackStatusCode: ${ack_status_code}

      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: answered_res
  next: checkAnsweredStored

checkAnsweredStored:
  switch:
    - condition: ${answered_res.response.body == null || answered_res.response.body.length != 1}
      next: returnNotSendable
  next: logAuditSent

logAuditSent:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "answered"
    ack_status_code: ${ack_status_code}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_ok
  next: returnAnswered

markErrorAfterNegativeAck:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      technicalId: ""
      workflowId: ""
      sentAt: ""
      ackStatusCode: ""

      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "${'ERRU NCR negative acknowledgement on response send: ' + ack_status_code}"
      created_by: ${actor_personal_code}
  result: neg_res
  next: logAuditNegativeAck

logAuditNegativeAck:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "error"
    ack_status_code: ${ack_status_code}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_neg
  next: returnAckError

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      technicalId: ""
      workflowId: ""
      sentAt: ""
      ackStatusCode: ""

      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "ERRU NCR transport failure while sending the response"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditTransportError

logAuditTransportError:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "error"
    ack_status_code: "transport_failure"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_err
  next: returnTransportError

returnAnswered:
  return: "${JSON.stringify({businessCaseId: business_case_id, status: 'answered', ackStatusCode: ack_status_code})}"
  next: end

returnAckError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR negative acknowledgement — response transitioned to error"}'
  next: end

returnTransportError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR transport failure — response transitioned to error"}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"businessCaseId","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ncr case not found"
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Vastust ei saa saata praeguses olekus (answer_drafted või error on saadetavad)"}'
  next: end
