declaration:
  internal: false
  version: "1.0"
  description: "Send the Estonian response draft to an incoming NCR message as ERRU 3.5 XML (LJVIS2-64 §4.5). Sendable states: 'answer_drafted' (first send) or 'error' (retry after a definite rejection). Sending is blocked while the message is 'forwarded' (LJVIS2-62 §4), that state is simply not in the sendable set. The XML is validated, erru.ncr_begin_response reserves the envelope (status sending, new response technicalId, the incoming workflowId is reused) and the internal adapter posts the NotifyCheckResult_Response to the Hub's response URL. A 2xx answer makes the message 'answered', a definite rejection 'error', an uncertain outcome 'send_unknown' (never resent). A negative NCRR_Ack received later moves 'answered' to 'error' (ncr/inbound-ack). The path is POST /v1/erru/ncr/response-send (not nested under response/) so it is protected by the ncr.send guard at erru/ncr/.guard, distinct from erru/ncr/response/.guard (ncr.respond)."
  namespace: erru
  allowlist:
    body:
      - field: businessCaseId
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${business_case_id === ''}
      next: returnIdRequired
  next: getCase

getCase:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: caseRes
  next: checkCaseFound

checkCaseFound:
  switch:
    - condition: ${caseRes.response.body.length === 0}
      next: returnNotFound
  next: checkSendable

checkSendable:
  assign:
    current: "${caseRes.response.body[caseRes.response.body.length - 1]}"
  next: checkSendableState

checkSendableState:
  switch:
    - condition: ${current.direction !== 'incoming'}
      next: returnNotSendable
    - condition: ${current.status !== 'answer_drafted' && current.status !== 'error'}
      next: returnNotSendable
  next: validateXml
validateXml:
  assign:
    start_time: "${new Date().getTime()}"
  next: callValidate

callValidate:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr-response/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      ncrTo: ${current.ncrFrom}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${current.originatingAuthority}
      respondingAuthority: ${current.respondingAuthority}
      statusCode: ${current.responseStatusCode}
      statusMessage: ${current.responseStatusMessage}
      transportUndertakingName: "${current.responseStatusCode === 'OK' ? (current.transportUndertakingName || '') : ''}"
      communityLicenceNumber: "${current.responseStatusCode === 'OK' ? (current.communityLicenceNumber || '') : ''}"
      numberOfVehicles: "${current.responseStatusCode === 'OK' && current.responseNumberOfVehicles != null ? current.responseNumberOfVehicles : ''}"
      communityLicenceStatus: "${current.responseStatusCode === 'OK' ? (current.responseCommunityLicenceStatus || '') : ''}"
      address: "${current.responseStatusCode === 'OK' && current.responseAddress ? current.responseAddress : ''}"
      penaltiesImposed: "${current.responseStatusCode === 'OK' && current.responsePenaltiesImposed ? current.responsePenaltiesImposed : ''}"
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/begin-response"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr-response/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      ncrTo: ${current.ncrFrom}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${current.originatingAuthority}
      respondingAuthority: ${current.respondingAuthority}
      statusCode: ${current.responseStatusCode}
      statusMessage: ${current.responseStatusMessage}
      transportUndertakingName: "${current.responseStatusCode === 'OK' ? (current.transportUndertakingName || '') : ''}"
      communityLicenceNumber: "${current.responseStatusCode === 'OK' ? (current.communityLicenceNumber || '') : ''}"
      numberOfVehicles: "${current.responseStatusCode === 'OK' && current.responseNumberOfVehicles != null ? current.responseNumberOfVehicles : ''}"
      communityLicenceStatus: "${current.responseStatusCode === 'OK' ? (current.responseCommunityLicenceStatus || '') : ''}"
      address: "${current.responseStatusCode === 'OK' && current.responseAddress ? current.responseAddress : ''}"
      penaltiesImposed: "${current.responseStatusCode === 'OK' && current.responsePenaltiesImposed ? current.responsePenaltiesImposed : ''}"
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: storeAnswered
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: markError
  next: markUnknown

storeAnswered:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "answered"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: answered_res
  next: checkAnsweredStored

checkAnsweredStored:
  switch:
    - condition: ${answered_res.response.body == null || answered_res.response.body.length != 1}
      next: returnFinalizeFailed
  next: logAuditSent

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "ERRU NCR response rejected before acceptance - the response may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditTransportError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "send_unknown"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "NCR response dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: returnUnknown

logAuditSent:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "answered"
    ack_status_code: ""
  result: audit_ok
  error: returnAnswered
  next: returnAnswered

logAuditTransportError:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "error"
    ack_status_code: "rejected"
  result: audit_err
  next: returnTransportError

returnAnswered:
  return: "${JSON.stringify({businessCaseId: business_case_id, status: 'answered'})}"
  next: end

returnTransportError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR response was rejected - response transitioned to error, retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"NCR response dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the NCR response but local confirmation failed; do not resend"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_ncr_response_xml","message":"NCR response does not satisfy the ERRU 3.5 XML contract. A found undertaking needs vehicle count, licence status and a complete address."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"NCR XML validation is unavailable. The response was not sent."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"businessCaseId","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ncr case not found"
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Vastust ei saa saata praeguses olekus (answer_drafted või error on saadetavad)"}'
  next: end
