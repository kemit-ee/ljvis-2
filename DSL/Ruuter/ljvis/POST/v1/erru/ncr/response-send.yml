declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Send the Estonian response draft to an incoming NCR message as ERRU 3.5 XML (LJVIS2-64 §4.5). Sendable states: 'answer_drafted' (first send) or 'error' (retry after a definite rejection). A message without a workflowId (e.g. seeded test data) cannot be answered, it yields 422 workflow_id_missing instead of the misleading not_sendable. Sending is blocked while the message is 'forwarded' (LJVIS2-62 §4), that state is simply not in the sendable set. The XML is validated, erru.ncr_begin_response reserves the envelope (status sending, new response technicalId, the incoming workflowId is reused) and the internal adapter posts the NotifyCheckResult_Response to the Hub's response URL. A 2xx answer makes the message 'answered', a definite rejection 'error', an uncertain outcome 'send_unknown' (never resent). A negative NCRR_Ack received later moves 'answered' to 'error' (ncr/inbound-ack). The path is POST /v1/erru/ncr/response-send (not nested under response/) so it is protected by the ncr.send guard at erru/ncr/.guard, distinct from erru/ncr/response/.guard (ncr.respond)."
  namespace: erru
  allowlist:
    body:
      - field: businessCaseId
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${business_case_id === ''}
      next: returnIdRequired
  next: getCase

getCase:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
  result: caseRes
  next: checkCaseFound

checkCaseFound:
  switch:
    - condition: ${caseRes.response.body.length === 0}
      next: returnNotFound
  next: checkSendable

checkSendable:
  assign:
    current: "${caseRes.response.body[caseRes.response.body.length - 1]}"
  next: checkSendableState

checkSendableState:
  switch:
    - condition: ${current.direction !== 'incoming'}
      next: returnNotSendable
    - condition: ${current.status !== 'answer_drafted' && current.status !== 'error'}
      next: returnNotSendable
    - condition: ${current.workflowId == null || current.workflowId === ''}
      next: returnWorkflowMissing
  next: prepareOutbound

prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"

    # ERRU_NCR_RESPONSE_TRANSPORT=xtr sends via the XTR raw-XML bridge; anything else (or unset: the placeholder stays literal)
    # keeps the Java adapter. Rollback = set the constant back to adapter and restart Ruuter.
    erru_transport: "${'[#ERRU_NCR_RESPONSE_TRANSPORT]' === 'xtr' ? 'xtr' : 'adapter'}"
  next: chooseValidation

chooseValidation:
  switch:
    - condition: ${erru_transport === 'xtr'}
      next: xtrPreflight
  next: callValidate

# XTR validates against the XSD only in report/enforce mode; keep refusing what the Java builder refused.
xtrPreflight:
  switch:
    - condition: ${!current.ncrFrom || !business_case_id || !current.originatingAuthority || !current.respondingAuthority || !current.responseStatusCode}
      next: returnInvalidXml
    - condition: ${current.responseStatusCode === 'OK' && !!current.transportUndertakingName && (!current.responseAddress || current.responseNumberOfVehicles == null || current.responseNumberOfVehicles === '' || !current.communityLicenceNumber || !current.responseCommunityLicenceStatus)}
      next: returnInvalidXml
  next: reserveSend

callValidate:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr-response/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      ncrTo: ${current.ncrFrom}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${current.originatingAuthority}
      respondingAuthority: ${current.respondingAuthority}
      statusCode: ${current.responseStatusCode}
      statusMessage: ${current.responseStatusMessage}
      transportUndertakingName: "${current.responseStatusCode === 'OK' ? (current.transportUndertakingName || '') : ''}"
      communityLicenceNumber: "${current.responseStatusCode === 'OK' ? (current.communityLicenceNumber || '') : ''}"
      numberOfVehicles: "${current.responseStatusCode === 'OK' && current.responseNumberOfVehicles != null ? current.responseNumberOfVehicles : ''}"
      communityLicenceStatus: "${current.responseStatusCode === 'OK' ? (current.responseCommunityLicenceStatus || '') : ''}"
      address: "${current.responseStatusCode === 'OK' && current.responseAddress ? current.responseAddress : ''}"
      penaltiesImposed: "${current.responseStatusCode === 'OK' && current.responsePenaltiesImposed ? current.responsePenaltiesImposed : ''}"
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/begin-response"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: chooseTransport

chooseTransport:
  switch:
    - condition: ${erru_transport === 'xtr'}
      next: composeXtrTu
  next: callErru

composeXtrTu:
  assign:
    xtr_tu: "${(current.responseStatusCode === 'OK' && !!current.transportUndertakingName && current.responseAddress) ? {'TransportUndertaking': {'@transportUndertakingName': current.transportUndertakingName, '@numberOfVehicles': String(parseInt(current.responseNumberOfVehicles, 10)), '@communityLicenceNumber': current.communityLicenceNumber, '@communityLicenceStatus': current.responseCommunityLicenceStatus, 'TransportUndertakingAddress': (function(a) { return {'@address': a.address, '@postCode': a.postCode, '@city': a.city, '@country': a.country}; })((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.responseAddress))}} : {}}"
  next: composeXtrPen

composeXtrPen:
  assign:
    xtr_pen: "${(current.responseStatusCode === 'OK' && !!current.responsePenaltiesImposed && ((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.responsePenaltiesImposed) || []).length > 0) ? {'PenaltiesImposed': {'PenaltyImposed': ((function(v) { return v == null || v === '' ? null : (typeof v === 'string' ? JSON.parse(v) : v); })(current.responsePenaltiesImposed)).map(function(p) { var d = function(s) { return String(s || '').substring(0, 10); }; return (function(o) { return Object.keys(o).filter(function(k) { return o[k] !== '' && o[k] != null; }).reduce(function(a, k) { a[k] = o[k]; return a; }, {}); })({'@penaltyRequestedIdentifier': String(parseInt(p.penaltyRequestedIdentifier, 10)), '@authorityImposingPenalty': p.authorityImposingPenalty, '@isImposed': (p.isImposed === true || p.isImposed === 'true' || p.isImposed === 1 || p.isImposed === '1') ? 'true' : 'false', '@penaltyTypeImposed': String(p.penaltyTypeImposed), '@startDate': d(p.startDate), '@endDate': d(p.endDate), '@reason': p.reason}); })}} : {}}"
  next: composeXtrBody

composeXtrBody:
  assign:
    xtr_body: "${{'Header': {'@version': '3.5', '@technicalId': technical_id, '@workflowId': workflow_id, '@sentAt': new Date(String(sent_at).replace(' ', 'T')).toISOString().substring(0, 19) + 'Z', '@from': 'EE', '@to': current.ncrFrom}, 'Body': Object.assign((function(o) { return Object.keys(o).filter(function(k) { return o[k] !== '' && o[k] != null; }).reduce(function(a, k) { a[k] = o[k]; return a; }, {}); })({'@businessCaseId': business_case_id, '@originatingAuthority': current.originatingAuthority, '@respondingAuthority': current.respondingAuthority, '@statusCode': current.responseStatusCode, '@statusMessage': current.responseStatusMessage}), xtr_tu, xtr_pen)}}"
  next: callErruXtr

callErruXtr:
  call: http.post
  error: markUnknown
  args:
    url: "${('[#ERRU_XTR_BRIDGE]'.indexOf('ERRU_XTR_BRIDGE') >= 0 ? 'http://erru-xml-adapter:8080' : '[#ERRU_XTR_BRIDGE]') + '/xml-out/erru/erru/NotifyCheckResult_Response'}"
    headers:
      type: json
    body: ${xtr_body}
  result: erru_res
  timeout: 30000
  next: checkXtrStatus

# XTR raw-XML lane: HTTP 200 carries the Hub's own HTTP status in body.status. Hub 202 = accepted; another 4xx
# (or XTR's own 422 schema_invalid, nothing sent) is a definite refusal; everything else is unknown, never resent.
checkXtrStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status >= 200 && erru_res.response.body.status < 300}
      next: storeAnswered
    - condition: ${(erru_res.response.status === 200 && erru_res.response.body.status >= 400 && erru_res.response.body.status < 500) || erru_res.response.status === 422}
      next: markError
  next: markUnknown

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ncr-response/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      ncrTo: ${current.ncrFrom}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${current.originatingAuthority}
      respondingAuthority: ${current.respondingAuthority}
      statusCode: ${current.responseStatusCode}
      statusMessage: ${current.responseStatusMessage}
      transportUndertakingName: "${current.responseStatusCode === 'OK' ? (current.transportUndertakingName || '') : ''}"
      communityLicenceNumber: "${current.responseStatusCode === 'OK' ? (current.communityLicenceNumber || '') : ''}"
      numberOfVehicles: "${current.responseStatusCode === 'OK' && current.responseNumberOfVehicles != null ? current.responseNumberOfVehicles : ''}"
      communityLicenceStatus: "${current.responseStatusCode === 'OK' ? (current.responseCommunityLicenceStatus || '') : ''}"
      address: "${current.responseStatusCode === 'OK' && current.responseAddress ? current.responseAddress : ''}"
      penaltiesImposed: "${current.responseStatusCode === 'OK' && current.responsePenaltiesImposed ? current.responsePenaltiesImposed : ''}"
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: storeAnswered
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: markError
  next: markUnknown

storeAnswered:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "answered"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: answered_res
  next: checkAnsweredStored

checkAnsweredStored:
  switch:
    - condition: ${answered_res.response.body == null || answered_res.response.body.length != 1}
      next: returnFinalizeFailed
  next: logAuditSent

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "error"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "ERRU NCR response rejected before acceptance - the response may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditTransportError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      newStatus: "send_unknown"
      ackStatusCode: ""
      ackStatusMessage: ""
      respondingAuthority: ""
      transportUndertakingName: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseNumberOfVehicles: ""
      responseCommunityLicenceStatus: ""
      responseAddress: ""
      responsePenaltiesImposed: ""
      errorMessage: "NCR response dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: returnUnknown

logAuditSent:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "answered"
    ack_status_code: ""
  result: audit_ok
  error: returnAnswered
  next: returnAnswered

logAuditTransportError:
  template: "templates/audit/erru/ncr/log-ncr-response-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    result_status: "error"
    ack_status_code: "rejected"
  result: audit_err
  next: returnTransportError

returnAnswered:
  return: "${JSON.stringify({businessCaseId: business_case_id, status: 'answered'})}"
  next: end

returnTransportError:
  status: 502
  return: '{"valid":false,"code":"send_failed","message":"ERRU NCR response was rejected - response transitioned to error, retry permitted"}'
  next: end

returnUnknown:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"NCR response dispatch outcome is unknown; do not resend"}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"valid":false,"code":"send_unknown","message":"Hub accepted the NCR response but local confirmation failed; do not resend"}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"valid":false,"code":"invalid_ncr_response_xml","message":"NCR response does not satisfy the ERRU 3.5 XML contract. A found undertaking needs vehicle count, licence status and a complete address."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"valid":false,"code":"validation_unavailable","message":"NCR XML validation is unavailable. The response was not sent."}'
  next: end

returnIdRequired:
  status: 400
  return: '{"valid":false,"field":"businessCaseId","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ncr case not found"
  next: end

returnWorkflowMissing:
  status: 422
  return: '{"valid":false,"code":"workflow_id_missing","message":"Saabunud teatel puudub workflowId, seetõttu ei saa vastust Hubile korrelatsioonis saata"}'
  next: end

returnNotSendable:
  status: 422
  return: '{"valid":false,"code":"not_sendable","message":"Vastust ei saa saata praeguses olekus (answer_drafted või error on saadetavad)"}'
  next: end
