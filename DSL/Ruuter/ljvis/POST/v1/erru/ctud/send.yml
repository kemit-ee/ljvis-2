declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Reserve an outgoing CTUD envelope, send it through the internal XML adapter and store the Hub acceptance (LJVIS2-144). The adapter validates ERRU 3.5 XML and performs one HTTP dispatch; only its accepted result means HTTP 202 from the Hub. The flow is initiated|error -> sending -> sent (or send_unknown, or error after a definite rejection, which may be retried). The target country's CheckTransportUndertakingData_Response arrives later through /erru/xml and is correlated by the persisted workflowId (ctud/inbound-response), which moves the request to responded. Timeout and NotAvailable are outcomes of a successful exchange set by the ERRU Hub and lead to responded. An uncertain transport outcome (send_unknown) must not be retried. Every outbound call is logged to xroad.xroad_integration_log."
  namespace: erru
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${('' + (incoming.body.id || '')).trim()}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: checkIdPresent

checkIdPresent:
  switch:
    - condition: ${!id}
      next: returnIdRequired
  next: getRequest

getRequest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: current
  next: checkFound

checkFound:
  switch:
    - condition: ${current.response.body.length != 1}
      next: returnNotFound
  next: extractCurrentState

extractCurrentState:
  assign:
    cur_status: "${current.response.body[0].status}"
    cur_direction: "${current.response.body[0].direction}"
    business_case_id: "${current.response.body[0].businessCaseId}"
    ctud_to: "${current.response.body[0].ctudTo || ''}"
    undertaking_name: "${current.response.body[0].transportUndertakingName || ''}"
    licence_number: "${current.response.body[0].communityLicenceNumber || ''}"
    vehicle_number: "${current.response.body[0].vehicleRegistrationNumber || ''}"
    vehicle_registration_country: "${current.response.body[0].vehicleRegistrationCountry || ''}"
    all_vehicles: "${current.response.body[0].requestAllVehicles ? 'true' : 'false'}"
    originating_authority: "${current.response.body[0].originatingAuthority || ''}"
    request_source: "${current.response.body[0].requestSource || ''}"
    request_purpose: "${current.response.body[0].requestPurpose || ''}"
  next: checkSendable

# Only an outgoing request that is a draft or was definitely rejected may be sent.
# ctud_begin_send enforces this too; checking here yields a precise error code.
checkSendable:
  switch:
    - condition: ${cur_direction !== 'outgoing'}
      next: returnNotSendable
    - condition: ${cur_status !== 'initiated' && cur_status !== 'error'}
      next: returnNotSendable
  next: prepareOutbound

prepareOutbound:
  assign:
    start_time: "${new Date().getTime()}"
  next: validateXml

validateXml:
  call: http.post
  error: returnValidationUnavailable
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ctud/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      ctudTo: ${ctud_to}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      transportUndertakingName: ${undertaking_name}
      communityLicenceNumber: ${licence_number}
      vehicleRegistrationNumber: ${vehicle_number}
      vehicleRegistrationCountry: ${vehicle_registration_country}
      requestAllVehicles: ${all_vehicles}
  result: xml_validation
  next: checkXmlValidation

checkXmlValidation:
  switch:
    - condition: ${xml_validation.response != null && xml_validation.response.status === 422}
      next: returnInvalidXml
    - condition: ${xml_validation.response != null && xml_validation.response.status === 200 && xml_validation.response.body.status === 'valid'}
      next: reserveSend
  next: returnValidationUnavailable

reserveSend:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/begin-send"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      created_by: ${actor_personal_code}
  result: reservation
  next: checkReservation

checkReservation:
  switch:
    - condition: ${reservation.response == null || reservation.response.status >= 400 || reservation.response.body == null || reservation.response.body.length !== 1}
      next: returnNotSendable
  next: extractEnvelope

extractEnvelope:
  assign:
    technical_id: "${reservation.response.body[0].technicalId}"
    workflow_id: "${reservation.response.body[0].workflowId}"
    sent_at: "${reservation.response.body[0].sentAt}"
  next: callErru

callErru:
  call: http.post
  error: markUnknown
  args:
    url: "[#ERRU_XML_ADAPTER]/internal/ctud/send"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      ctudTo: ${ctud_to}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      transportUndertakingName: ${undertaking_name}
      communityLicenceNumber: ${licence_number}
      vehicleRegistrationNumber: ${vehicle_number}
      vehicleRegistrationCountry: ${vehicle_registration_country}
      requestAllVehicles: ${all_vehicles}
  result: erru_res
  next: checkErruStatus

checkErruStatus:
  switch:
    - condition: ${erru_res.response == null || erru_res.response.status == null || erru_res.response.body == null}
      next: markUnknown
    - condition: ${erru_res.response.status === 200 && erru_res.response.body.status === 'accepted' && erru_res.response.body.httpStatus === 202 && erru_res.response.body.technicalId === technical_id && erru_res.response.body.workflowId === workflow_id}
      next: logIntegrationSuccess
    - condition: ${erru_res.response.body.status === 'rejected'}
      next: logIntegrationFailure
  next: markUnknown

logIntegrationSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ctud/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' to=' + ctud_to}"
      response_xml: "${JSON.stringify(erru_res.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: "erru_ctud"
      source_record_id: "${'' + business_case_id}"
  result: log_ok
  error: storeSent
  next: storeSent

logIntegrationFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      service_code: "erru/ctud/request"
      request_xml: "${'businessCaseId=' + business_case_id + ' to=' + ctud_to}"
      response_xml: "${erru_res.response != null ? JSON.stringify(erru_res.response.body) : ''}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "ERRU CTUD request rejected by the Hub"
      person_identifier: ""
      source_type: "erru_ctud"
      source_record_id: "${'' + business_case_id}"
  result: log_fail
  error: markError
  next: markError

storeSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "sent"
      technicalId: ""
      workflowId: ""
      respondingAuthority: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseContent: ""
      errorMessage: ""
      created_by: ${actor_personal_code}
  result: stored_res
  error: checkConcurrentResponse
  next: checkStoreSent

checkStoreSent:
  switch:
    - condition: ${stored_res.response.body == null || stored_res.response.body.length != 1}
      next: checkConcurrentResponse
  next: logAuditSend

# The country may answer before the Hub acknowledgement is stored: sending -> responded.
checkConcurrentResponse:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/get"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: latest_after_send
  error: returnFinalizeFailed
  next: checkResponseWonRace

checkResponseWonRace:
  switch:
    - condition: ${latest_after_send.response.body != null && latest_after_send.response.body.length === 1 && latest_after_send.response.body[0].status === 'responded'}
      next: logAuditSend
  next: returnFinalizeFailed

markError:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "error"
      technicalId: ""
      workflowId: ""
      respondingAuthority: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseContent: ""
      errorMessage: "ERRU CTUD request rejected before acceptance - the request may be sent again"
      created_by: ${actor_personal_code}
  result: error_res
  next: logAuditError

markUnknown:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/append-transition"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      newStatus: "send_unknown"
      technicalId: ""
      workflowId: ""
      respondingAuthority: ""
      responseStatusCode: ""
      responseStatusMessage: ""
      responseContent: ""
      errorMessage: "CTUD dispatch outcome unknown. Do not resend without transport reconciliation."
      created_by: ${actor_personal_code}
  result: unknown_res
  error: returnUnknown
  next: checkUnknownStored

checkUnknownStored:
  switch:
    - condition: ${unknown_res.response != null && unknown_res.response.body != null && unknown_res.response.body.length === 0}
      next: checkConcurrentResponse
  next: returnUnknown

logAuditSend:
  template: "templates/audit/erru/ctud/log-ctud-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ctud_to: ${ctud_to}
    result_status: "sent"
    response_code: ""
    transport_undertaking_name: ${undertaking_name}
    community_licence_number: ${licence_number}
  result: audit_result
  error: returnSent
  next: returnSent

logAuditError:
  template: "templates/audit/erru/ctud/log-ctud-request-send"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    business_case_id: ${business_case_id}
    ctud_to: ${ctud_to}
    result_status: "error"
    response_code: ""
    transport_undertaking_name: ${undertaking_name}
    community_licence_number: ${licence_number}
  result: audit_result
  next: returnSendFailed

returnSent:
  return: "${JSON.stringify({id: id, status: 'sent', businessCaseId: business_case_id, workflowId: workflow_id})}"
  next: end

returnSendFailed:
  status: 502
  return: '{"type":"ERRU_ERROR","code":"send_failed","message":"ERRU lükkas päringu tagasi. Saatmist saab korrata."}'
  next: end

returnUnknown:
  status: 502
  return: '{"type":"ERRU_ERROR","code":"send_unknown","message":"Päringu saatmise tulemus on teadmata. Ära saada uuesti."}'
  next: end

returnFinalizeFailed:
  status: 502
  return: '{"type":"ERRU_ERROR","code":"send_unknown","message":"Hub võttis päringu vastu, kuid kohalik kinnitus ebaõnnestus. Ära saada uuesti."}'
  next: end

returnInvalidXml:
  status: 422
  return: '{"type":"VALIDATION_ERROR","code":"invalid_ctud_xml","message":"Andmed ei vasta ERRU XML-lepingule. Vähemalt kaks otsingukriteeriumi on kohustuslikud ning sõidukil peab olema number ja riik."}'
  next: end

returnValidationUnavailable:
  status: 503
  return: '{"type":"ERRU_ERROR","code":"validation_unavailable","message":"CTUD XML-i kontroll pole saadaval. Päringut ei saadetud."}'
  next: end

returnNotSendable:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"status","code":"not_sendable"}'
  next: end

returnIdRequired:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"id","code":"required"}'
  next: end

returnNotFound:
  status: 404
  return: "ctud request not found"
  next: end
