declaration:
  call: declare
  version: 0.1
  description: "List all permissions (fixed set)"
  method: post
  accepts: json
  returns: json
  namespace: permissions

getPermissions:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/permission/list_permissions"
    headers:
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
