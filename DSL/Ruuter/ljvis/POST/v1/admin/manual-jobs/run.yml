declaration:
  internal: false

  version: "1.0"
  description: >-
    Haldus > X-tee logid > Manuaalne käivitamine: käivitab käsitsi ühe
    CronManageri tööga identse töö (riskiskooride ümberarvutus või e-toimiku
    otsuste sünkroonimine). Kutsub sünkroonselt vastavat
    [#LJVIS_RUUTER_INTERNAL]/cron/<job> endpointi ja tagastab selle kokkuvõtte.
    Lubatud tööde nimekiri on kinnine (allowedJobs) — suvalist cron-endpointi
    selle kaudu kutsuda ei saa. Õigus xroad.log.read kontrollitakse selle
    kataloogi .guard.yml-is. Iga käivitus logitakse auditisse
    (manual_job.run). Töö ise kirjutab oma süsteemi auditisündmuse (kui see
    on seal ette nähtud).
  namespace: manual_job
  allowlist:
    body:
      - field: job
        type: string
        description: "Töö nimi, nt risk-score-recalc-sync, etoimik-decision-sync."
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    job: "${(incoming.body.job || '').trim()}"
    allowed_jobs: "${['risk-score-recalc-sync','etoimik-decision-sync','etoimik-tram-decision-sync','etoimik-sp-driver-decision-sync','etoimik-sp-teammate-decision-sync','etoimik-technical-check-decision-sync']}"
  next: validateJob

validateJob:
  switch:
    - condition: "${allowed_jobs.indexOf(job) < 0}"
      next: returnInvalidJob
  next: callJob

# Pikk töö (üks päring iga kandidaadi kohta), seepärast suur timeout.
callJob:
  call: http.post
  timeout: 600000
  args:
    url: "${'[#LJVIS_RUUTER_INTERNAL]/cron/' + job}"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: jobRes
  next: checkJob

checkJob:
  switch:
    - condition: "${jobRes.response == null || jobRes.response.status < 200 || jobRes.response.status >= 300 || jobRes.response.body == null}"
      next: returnJobError
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "manual_job.run"
    event_category: "system_process"
    description: "${'Töö käivitati käsitsi: ' + job + '; ebaõnnestunuid: ' + (jobRes.response.body.failures == null ? 0 : jobRes.response.body.failures)}"
    log_content: "${JSON.stringify(jobRes.response.body)}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: "${({ job: job, failures: jobRes.response.body.failures == null ? 0 : jobRes.response.body.failures, result: jobRes.response.body })}"
  next: end

returnInvalidJob:
  status: 400
  return: "${({ error: 'INVALID_PARAMETER', message: 'Tundmatu töö' })}"
  next: end

returnJobError:
  status: 502
  return: "${({ error: 'JOB_FAILED', message: 'Töö käivitamine ebaõnnestus' })}"
  next: end
