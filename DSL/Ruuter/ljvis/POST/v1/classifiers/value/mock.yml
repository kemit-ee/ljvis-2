declaration:
  description: "Arenduse mock: POST /v1/classifiers/value/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    body: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - classifierValueId: "199"
          classifierId: "1"
          classifierCode: "AMETIKOHT"
          code: "MOCK_VAARTUS"
          name: "Mock väärtus"
          validFrom: "2025-01-01"
          validUntil: ""
          isValid: true
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
