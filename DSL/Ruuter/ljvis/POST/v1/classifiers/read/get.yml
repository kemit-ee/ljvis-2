declaration:
  call: declare
  version: 0.1
  description: "Get a single classifier by ID"
  method: post
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    body:
      - field: id
        type: string
        description: "Classifier ID"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
  next: getClassifier

getClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/classifier/log-classifier-view"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    classifier_id: ${id}
    classifier_code: "${res.response.body[0].code || ''}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
