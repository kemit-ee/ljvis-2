declaration:
  call: declare
  version: 0.1
  description: "List all classifiers"
  method: post
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    body:
      - field: search
        type: string
        description: "Search by classifier code or name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

extractRequestData:
  assign:
    search: "${incoming.body.search ?? ''}"
    page: "${incoming.body.page ?? 1}"
    pageSize: "${incoming.body.pageSize ?? 20}"
    sorting: "${incoming.body.sorting ?? 'name asc'}"
  next: getClassifiers

getClassifiers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/list_classifiers"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      pageSize: ${pageSize}
      sorting: ${sorting}
  result: res
  next: checkAuditCondition

checkAuditCondition:
  assign:
    result_count: "${res.response.body && res.response.body[0] ? res.response.body[0].total : 0}"
  next: conditionalAudit

conditionalAudit:
  switch:
    - condition: "${search.length >= 3}"
      next: logAuditEvent
  next: mapResponse

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/classifier/log-classifier-list-search"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    search: ${search}
    result_count: ${result_count}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_classifiers_list"
    headers:
      type: json
    body:
      classifiers: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
