declaration:

  version: "1.0"
  description: "Create a new classifier value"
  namespace: classifiers
  allowlist:
    body:
      - field: classifierId
        type: string
      - field: code
        type: string
      - field: name
        type: string
      - field: validFrom
        type: string
      - field: validUntil
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    classifier_id: "${incoming.body.classifierId}"
    code: "${incoming.body.code}"
    name: "${incoming.body.name}"
    valid_from: "${incoming.body.validFrom}"
    valid_until: "${incoming.body.validUntil ?? ''}"
    created_by: "${auth_user.personalcode || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifierCode

getClassifierCode:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${classifier_id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: insertClassifierValue

insertClassifierValue:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/insert_classifier_value"
    headers:
      type: json
    body:
      classifier_id: ${classifier_id}
      code: ${code}
      name: ${name}
      valid_from: ${valid_from}
      valid_until: ${valid_until}
      created_by: ${created_by}
  result: insertRes
  next: checkInsertResult

checkInsertResult:
  switch:
    - condition: ${insertRes.response.status >= 200 && insertRes.response.status < 300 && insertRes.response.body != null && insertRes.response.body.length > 0}
      next: buildAuditData
    # Tühi vastus = sama koodiga väärtus on klassifikaatoris juba olemas.
    - condition: ${insertRes.response.status >= 200 && insertRes.response.status < 300}
      next: returnDuplicateCode
    # Andmebaasi piirang ck_cv_period (valid_until > valid_from).
    - condition: ${insertRes.response.status == 400}
      next: returnInvalidPeriod
  next: returnSaveFailed

buildAuditData:
  assign:
    classifier_value_id: "${insertRes.response.body[0].id}"
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Klassifikaator '${classifier_code}' (ID ${classifier_id}), lisatud väärtus '${code}' — '${name}', kehtivus ${valid_from}–${valid_until}"
    log_content: "{\"classifierId\":${classifier_id},\"classifierCode\":\"${classifier_code}\",\"classifierValueId\":${classifier_value_id},\"code\":\"${code}\",\"name\":\"${name}\",\"validFrom\":\"${valid_from}\",\"validUntil\":\"${valid_until}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "classifier_value.add"
    event_category: "classifier_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${insertRes.response.body}
  next: end

returnDuplicateCode:
  status: 422
  return:
    type: VALIDATION_ERROR
    field: code
    code: duplicate_code
  next: end

returnInvalidPeriod:
  status: 422
  return:
    type: VALIDATION_ERROR
    field: validUntil
    code: invalid_period
  next: end

returnSaveFailed:
  status: 500
  return:
    type: SERVER_ERROR
    code: save_failed
  next: end
