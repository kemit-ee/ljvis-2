declaration:

  version: "1.0"
  description: "Create a new classifier value"
  namespace: classifiers
  allowlist:
    body:
      - field: classifierId
        type: string
      - field: code
        type: string
      - field: name
        type: string
      - field: validFrom
        type: string
      - field: validUntil
        type: string
      - field: formTypes
        type: array
        description: "ADR-011: FORM_TYPE koodid, millele väärtus piiratakse; [] = kõik vormid; puudumisel piirangut ei muudeta"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    classifier_id: "${incoming.body.classifierId}"
    code: "${incoming.body.code}"
    name: "${incoming.body.name}"
    valid_from: "${incoming.body.validFrom}"
    valid_until: "${incoming.body.validUntil ?? ''}"
    form_types_provided: ${incoming.body.formTypes != null}
    form_type_codes: "${(incoming.body.formTypes ?? []).join(',')}"
    created_by: "${auth_user.personalcode || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifierCode

getClassifierCode:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${classifier_id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: insertClassifierValue

insertClassifierValue:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/insert_classifier_value"
    headers:
      type: json
    body:
      classifier_id: ${classifier_id}
      code: ${code}
      name: ${name}
      valid_from: ${valid_from}
      valid_until: ${valid_until}
      created_by: ${created_by}
  result: insertRes
  next: buildAuditData

buildAuditData:
  assign:
    classifier_value_id: "${insertRes.response.body[0].id}"
  next: checkFormScopeProvided

checkFormScopeProvided:
  switch:
    - condition: ${form_types_provided && form_type_codes != ''}
      next: setFormScope
  next: buildAuditContent

setFormScope:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/set_classifier_value_form_scope"
    headers:
      type: json
    body:
      classifier_value_id: ${classifier_value_id}
      form_type_codes: ${form_type_codes}
      created_by: ${created_by}
  result: formScopeRes
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Klassifikaator '${classifier_code}' (ID ${classifier_id}), lisatud väärtus '${code}' — '${name}', kehtivus ${valid_from}–${valid_until}, vormipiirang: '${form_type_codes}'"
    log_content: "{\"classifierId\":${classifier_id},\"classifierCode\":\"${classifier_code}\",\"classifierValueId\":${classifier_value_id},\"code\":\"${code}\",\"name\":\"${name}\",\"validFrom\":\"${valid_from}\",\"validUntil\":\"${valid_until}\",\"formTypes\":\"${form_type_codes}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "classifier_value.add"
    event_category: "classifier_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${insertRes.response.body}
  next: end
