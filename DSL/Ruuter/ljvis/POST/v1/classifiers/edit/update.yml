declaration:
  call: declare
  version: 0.1
  description: "Update classifier"
  method: post
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    body:
      - field: id
        type: number
      - field: name
        type: string
      - field: description
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    description: "${incoming.body.description}"
    created_by: "${auth_user.id}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifier

getClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/classifier/calculate-classifier-changed-fields"
  requestType: templates
  body:
    classifier_id: ${id}
    name: ${name}
    description: ${description}
  result: changedFieldsResult
  next: validateClassifier

validateClassifier:
  template: "[#LJVIS_PROJECT_LAYER]/classifier/validate-classifier-fields"
  requestType: templates
  body:
    name: ${name}
    description: ${description}
  result: field_error
  next: checkClassifier

checkClassifier:
  switch:
    - condition: ${field_error != 'valid'}
      next: propagate_error
  next: createClassifierNameState

createClassifierNameState:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/insert_classifier_name_state"
    headers:
      type: json
    body:
      classifier_id: ${id}
      name: ${name}
      description: ${description}
      created_by: ${created_by}
  result: nameStateRes
  next: rebuildLatest

rebuildLatest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/rebuild_classifier_latest"
    headers:
      type: json
    body:
      classifier_id: ${id}
      created_by: ${created_by}
  result: latestRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    changed_fields: ${changedFieldsResult}
    description: "Klassifikaator '${classifier_code}' (ID ${id}), muudetud väljad: ${changed_fields}"
    log_content: "{\"classifierId\":${id},\"classifierCode\":\"${classifier_code}\",\"changedFields\":${changed_fields}}"
  next: logAuditEvent

logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_type: "classifier.update"
      event_category: "classifier_management"
      actor_name: ${actor_name}
      actor_personal_code: ${actor_personal_code}
      description: ${description}
      log_content: ${log_content}
      created_by: ${actor_name}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${nameStateRes.response.body}
  next: end

propagate_error:
  status: 422
  return: ${field_error}
  next: end
