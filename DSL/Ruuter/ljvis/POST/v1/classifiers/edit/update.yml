declaration:
  call: declare
  version: 0.1
  description: "Update classifier"
  method: post
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    body:
      - field: id
        type: number
      - field: name
        type: string
      - field: description
        type: string

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    name: "${incoming.body.name}"
    description: "${incoming.body.description}"
    created_by: "${auth_user.personalcode || ''}"
  next: getClassifier

getClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${id}
  result: classifierRes
  next: setClassifierCode

setClassifierCode:
  assign:
    classifier_code: "${classifierRes.response.body[0].code  || ''}"
  next: calculateChangedFields

calculateChangedFields:
  template: "[#LJVIS_PROJECT_LAYER]/classifier/calculate-classifier-changed-fields"
  requestType: templates
  body:
    classifier_id: ${id}
    name: ${name}
    description: ${description}
  result: changedFieldsResult
  next: validateClassifier

validateClassifier:
  template: "[#LJVIS_PROJECT_LAYER]/classifier/validate-classifier-fields"
  requestType: templates
  body:
    name: ${name}
    description: ${description}
  result: field_error
  next: checkClassifier

checkClassifier:
  switch:
    - condition: ${field_error != 'valid'}
      next: propagate_error
  next: updateClassifier

updateClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/update_classifier"
    headers:
      type: json
    body:
      classifier_id: ${id}
      name: ${name}
      description: ${description}
      created_by: ${created_by}
  result: updatedRes
  next: logAuditEvent

logAuditEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/classifier/log-classifier-update"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    classifier_id: ${id}
    classifier_code: ${classifier_code}
    changed_fields: ${changedFieldsResult}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${updatedRes.response.body}
  next: end

propagate_error:
  status: 422
  return: ${field_error}
  next: end
