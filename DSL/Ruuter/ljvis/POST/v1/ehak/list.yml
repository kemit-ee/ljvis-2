declaration:
  call: declare
  version: 0.1
  description: "List of cities/parishes filtered by county"
  method: post
  accepts: json
  returns: json
  namespace: ehak
  allowlist:
    body:
      - field: parentId
        type: number
        description: "Filter by county ID"

extractRequestData:
  assign:
    parentId: ${incoming.body.parentId}
  next: getEhak

getEhak:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ehak/list_cities_parishes"
    headers:
      type: json
    body:
      parentId: ${parentId}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
