declaration:
  call: declare
  version: 0.1
  description: "Soft-delete a control form file attachment by ID"
  method: delete
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "ID of the form_attachment record to delete"

getActorFromTim:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: timRes
  next: extractActorData

extractActorData:
  assign:
    actor_personal_code: "${timRes.response.body.personalCode || ''}"
    actor_name: "${(timRes.response.body.firstName || '') + ' ' + (timRes.response.body.lastName || '')}"
    form_type: "foreign-violation-form"
  next: deleteFile

deleteFile:
  template: "[#LJVIS_PROJECT_LAYER]/files/delete"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: "${incoming.params.q}"
    form_type: ${form_type}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: deleteResult

returnSuccess:
  return: ${deleteResult}
  status: 200
