declaration:

  version: "1.0"
  description: "List all roads"
  method: get
  accepts: json
  returns: json
  namespace: roads

getRoads:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/roads/list_roads"
    headers:
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
