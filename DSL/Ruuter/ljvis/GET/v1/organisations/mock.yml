declaration:
  description: "Arenduse mock: GET /v1/organisations/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: 1
          name: "Politsei- ja Piirivalveamet"
        - id: 2
          name: "Justiitsministeerium"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
