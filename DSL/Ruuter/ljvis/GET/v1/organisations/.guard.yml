# GET /v1/organisations — piisab kehtivast ametniku sessioonist (baasõigus: vormide täitmiseks
# vajalik otsinguandmestik peab olema kõigile ametnikele kohe kättesaadav,
# et vorm ei avaneks poolikult grupi õiguste puudumise tõttu).
# auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.personalcode != null}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
