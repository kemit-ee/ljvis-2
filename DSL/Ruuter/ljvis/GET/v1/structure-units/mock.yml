declaration:
  description: "Arenduse mock: GET /v1/structure-units/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - code: "LIIKLUSJARELEVALVE"
          name: "Liiklusjärelevalve osakond"
        - code: "PATRULLTEENISTUS"
          name: "Patrullteenistus"
        - code: "PIIRIKONTROLL"
          name: "Piirikontrolli talitus"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
