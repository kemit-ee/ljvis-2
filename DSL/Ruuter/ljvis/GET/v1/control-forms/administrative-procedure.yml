declaration:
  internal: false
  version: "1.0"
  description: "Vormi haldusmenetluse andmeplokk (PPA andmevormid ja TRAM kontrollkaart). Nõuab Transpordiameti (TRAM) või Kliimaministeeriumi (KLIM) ametnikku või administraatorit ning vormi lugemisõigust; tühi objekt, kui plokki pole täidetud."
  namespace: control-forms
  allowlist:
    params:
      - field: formType
        type: string
        description: "adr-form | drive-rest-form/driver | drive-rest-form/teammate | trailer-technical | tram-card | vehicle-technical"
      - field: id
        type: string
        description: "vormi võti (*_key)"
    headers:
      - field: cookie
        type: string

get_user_context:
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    form_type: "${incoming.params.formType}"
    id: "${incoming.params.id}"
  next: checkPermission

checkPermission:
  switch:
    - condition: ${['TRAM', 'KLIM'].includes(auth_user.organisationcode) || (auth_user.permissions != null && ((auth_user.permissions.includes('control_form.view_unpublished') && auth_user.permissions.includes('control_form.edit_locked') && auth_user.permissions.includes('control_form.delete')) || auth_user.permissions.includes('user.edit.admin') || auth_user.permissions.includes('user.edit.local')))}
      next: checkInput
  next: returnForbidden

checkInput:
  switch:
    - condition: ${['adr-form','drive-rest-form/driver','drive-rest-form/teammate','trailer-technical','tram-card','vehicle-technical'].indexOf(form_type) === -1}
      next: returnInvalidType
    - condition: ${id == null || !/^[0-9]+$/.test(String(id))}
      next: returnInvalidId
  next: checkReadAccess

checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "${form_type}"
    form_key: "${id}"
    form_number: ""
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getBlock
  next: returnForbidden

getBlock:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/administrative-procedure/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      formType: ${form_type}
      formKey: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response == null || res.response.status < 200 || res.response.status >= 300}
      next: returnFailed
    - condition: ${res.response.body == null || res.response.body.length === 0}
      next: returnEmpty
  next: returnSuccess

returnSuccess:
  return: ${res.response.body[0]}
  next: end

returnEmpty:
  return: {}
  next: end

returnInvalidType:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"formType","code":"invalid_form_type"}'
  next: end

returnInvalidId:
  status: 422
  return: '{"type":"VALIDATION_ERROR","field":"id","code":"invalid_id"}'
  next: end

returnForbidden:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

returnFailed:
  status: 500
  return: '{"type":"RESQL_ERROR","code":"get_failed"}'
  next: end
