declaration:
  call: declare
  version: 0.1
  description: "List active file attachments for a vehicle technical check form"
  method: get
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    params:
      - field: form_number
        type: string
        description: "Logical form number to list files for"

getFiles:
  template: "[#LJVIS_PROJECT_LAYER]/files/list"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number: "${incoming.params.form_number}"
  result: listResult

returnSuccess:
  return: ${listResult}
  status: 200
