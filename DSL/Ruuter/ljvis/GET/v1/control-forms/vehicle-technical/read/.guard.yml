# Nõutav õigus: control_form.view_unpublished,vehicle_technical_form.read,compound_form.read,sp_driver_form.read,sp_teammate_form.read.
# Mootorsõiduki tehnoülevaatus on alati mõne koondvormi (PPA kontrollkaardi) alamvorm - kellel on õigus
# koondvormi või selle autojuhi/meeskonnaliikme alamvormi lugeda, näeb ka sellesse kuuluva tehnoülevaatuse
# alamvormi (sh failide) andmeid. auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('vehicle_technical_form.read') || auth_user.permissions.includes('compound_form.read') || auth_user.permissions.includes('sp_driver_form.read') || auth_user.permissions.includes('sp_teammate_form.read'))}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
