declaration:

  version: "1.0"
  description: "List latest snapshots of all vehicle technical-check sub-forms linked to a compound form key"
  namespace: control-forms
  allowlist:
    params:
      - field: compoundFormKey
        type: string
        description: "Compound form key"

checkPermission:
  switch:
    - condition: ${auth_user != null && auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('vehicle_technical_form.read'))}
      next: fetchList
  next: returnForbidden

fetchList:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/vehicle-technical/get-by-compound-form-key"
    headers:
      type: json
    body:
      compoundFormKey: ${incoming.params.compoundFormKey}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end

returnForbidden:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end
