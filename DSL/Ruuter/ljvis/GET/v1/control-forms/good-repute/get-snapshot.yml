declaration:

  version: "1.0"
  description: "Get a single good repute form snapshot by snapshot ID, for the read-only historical version view (LJVIS2-136)."
  namespace: control-forms
  allowlist:
    params:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "Good repute form key"

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/good-repute/get-snapshot"
    headers:
      type: json
    body:
      id: ${incoming.params.id}
      form_key: ${incoming.params.formKey}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: returnSuccess

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshot"
    headers:
      type: json
    body:
      formType: "good-repute"
      id: ${incoming.params.id}
  result: archiveRes
  next: returnArchive

returnArchive:
  return: "${(archiveRes.response.body && archiveRes.response.body[0]) ? [archiveRes.response.body[0].payload] : []}"
  next: end

returnSuccess:
  return: ${res.response.body}
  next: end
