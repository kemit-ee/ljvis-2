declaration:

  version: "1.0"
  description: "Get a single TRAM control card by key (latest snapshot). Guarded by tram_driver_form.read."
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "tram_control_card_key"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/get"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body == null || res.response.body.length != 1}
      next: returnNotFound
  next: checkShouldLog

checkShouldLog:
  switch:
    - condition: ${actor_personal_code != res.response.body[0].createdBy}
      next: logAuditEvent
  next: mapResponse

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.tram_control_card.view"
    event_category: "control_form_management"
    actor_personal_code: ${actor_personal_code}
    actor_name: ${actor_name}
    description: "TRAM kontrollkaart vaadatud, number=${res.response.body[0].formNumber}/${res.response.body[0].version}"
    log_content: "{\"tramControlCardKey\":${id},\"formNumber\":\"${res.response.body[0].formNumber}\"}"
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_tram_control_card"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnNotFound:
  status: 404
  return: "form not found"
  next: end
