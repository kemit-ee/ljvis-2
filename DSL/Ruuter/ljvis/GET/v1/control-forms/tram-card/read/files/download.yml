declaration:
  internal: false

  version: "1.0"
  description: "Get a presigned download URL for a TRAM control card file attachment"
  namespace: control-forms
  allowlist:
    body:
      - field: id
        type: string
    headers:
      - field: cookie
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: downloadFile

downloadFile:
  template: "templates/files/download"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number_prefix: "tram-"
    id: ${incoming.body.id}
    form_type: "tram-control-card-form"
    access_form_type: "tram-card"
  result: downloadResult
  next: checkDownloadResult

checkDownloadResult:
  switch:
    - condition: ${downloadResult === "FORBIDDEN"}
      next: returnReadAccessDenied
  next: returnSuccess

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

returnSuccess:
  return: ${downloadResult}
  status: 200
  next: end
