declaration:
  internal: false

  version: "1.0"
  description: "Get version history snapshots for a TRAM control card. Guarded by tram_driver_form.read — unlike the generic control-forms/get-snapshots endpoint this does not leak TRAM history to non-TRAM users."
  namespace: control-forms
  allowlist:
    params:
      - field: id
        type: string
        description: "tram_control_card_key"
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    id: "${incoming.params.id}"
  next: checkReadAccess

# Omand (epic #502 A2 read): avalikustamata vormi loeb ainult looja, looja asutuse kolleeg või
# `control_form.view_unpublished` omaja; otsus tuleb Resql'ist (check-read-access), mitte kliendilt.
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "tram-card"
    form_key: "${id}"
    form_number: ""
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getSnapshots
  next: returnReadAccessDenied

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

getSnapshots:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/get-snapshots"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: returnSuccess

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshots"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      formType: "tram-card"
      formKey: ${id}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
