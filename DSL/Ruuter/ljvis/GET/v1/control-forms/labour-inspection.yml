declaration:

  version: "1.0"
  description: "Get a single labour inspection form (labour_inspection_form) by ID"
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "Labour inspection form ID"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: checkPermission

checkPermission:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('labour_inspection_form.read'))}
      next: extractRequestData
  next: returnForbidden

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    actor_personal_code: "${auth_user.personalcode || ''}"
  next: checkReadAccess

# Omand (epic #502 A2 read): avalikustamata vormi loeb ainult looja, looja asutuse kolleeg või
# `control_form.view_unpublished` omaja; otsus tuleb Resql'ist (check-read-access), mitte kliendilt.
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "labour-inspection"
    form_key: "${id}"
    form_number: ""
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getForm
  next: returnReadAccessDenied

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/labour-inspection/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body.length != 1}
      next: returnNotFound
  next: extractFormData

extractFormData:
  assign:
    form_number: "${res.response.body[0].formNumber}"
    created_by: "${res.response.body[0].createdBy}"
    punished_person_id_code: "${res.response.body[0].punishedPersonIdCode || ''}"
  next: checkShouldLog

checkShouldLog:
  switch:
    - condition: ${actor_personal_code != created_by}
      next: logAuditEvent
  next: mapResponse

logAuditEvent:
  template: "templates/audit/form/labour-inspection/log-labour-inspection-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    akti_voti: ${id}
    form_number: ${form_number}
    isikukood: ${punished_person_id_code}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_labour_inspection_form"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnNotFound:
  status: 404
  return: "form not found"
  next: end

returnForbidden:
  status: 403
  return: "forbidden"
  next: end
