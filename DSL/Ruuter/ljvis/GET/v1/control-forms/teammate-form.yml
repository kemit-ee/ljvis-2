declaration:
  internal: false

  version: "1.0"
  description: "Get a single drive rest form (teammate) by key"
  namespace: control-forms
  allowlist:
    headers:
      - field: cookie
        type: string
    params:
      - field: q
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: checkPermission

checkPermission:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('sp_teammate_form.read') || auth_user.permissions.includes('sp_teammate_form.write'))}
      next: extractRequestData
  next: returnForbidden

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
  next: checkReadAccess

# Omand (epic #502 A2 read): avalikustamata vormi loeb ainult looja, looja asutuse kolleeg või
# `control_form.view_unpublished` omaja; otsus tuleb Resql'ist (check-read-access), mitte kliendilt.
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "drive-rest-form/teammate"
    form_key: "${id}"
    form_number: ""
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getForm
  next: returnReadAccessDenied

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/teammate/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body.length != 1}
      next: returnNotFound
  next: extractCompoundRequestData

extractCompoundRequestData:
  assign:
    compound_id: "${res.response.body[0].compoundFormKey}"
  next: getCompoundForm

getCompoundForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${compound_id}
  result: comres
  next: extractFormData

extractFormData:
  assign:
    sub_form_key: "${res.response.body[0].id}"
    sub_form_number: "${res.response.body[0].subFormNumber}"
    compound_form_key: "${res.response.body[0].compoundFormKey}"
    created_by: "${res.response.body[0].createdBy}"
    drivers: ${JSON.parse(comres.response.body[0].drivers || '[]')}
  next: extractDriverCodes

extractDriverCodes:
  assign:
    driver1_personal_code_ee: "${drivers[0] != null ? drivers[0].personalCodeEe || '' : ''}"
    driver1_personal_code_foreign: "${drivers[0] != null ? drivers[0].personalCodeForeign || '' : ''}"
    driver2_personal_code_ee: "${drivers[1] != null ? drivers[1].personalCodeEe || '' : ''}"
    driver2_personal_code_foreign: "${drivers[1] != null ? drivers[1].personalCodeForeign || '' : ''}"
  next: checkShouldLog

checkShouldLog:
  switch:
    - condition: ${actor_personal_code != created_by}
      next: logAuditEvent
  next: mapResponse

logAuditEvent:
  template: "templates/audit/form/sp-teammate-form/log-sp-teammate-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    sub_form_key: ${sub_form_key}
    sub_form_number: ${sub_form_number}
    compound_form_key: ${compound_form_key}
    driver1PersonalCodeEe: ${driver1_personal_code_ee}
    driver1PersonalCodeForeign: ${driver1_personal_code_foreign}
    driver2PersonalCodeEe: ${driver2_personal_code_ee}
    driver2PersonalCodeForeign: ${driver2_personal_code_foreign}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_sp_teammate_form"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: "${(typeof mapped.response.body === 'string' ? JSON.parse(mapped.response.body) : mapped.response.body)}"
  next: end

returnNotFound:
  status: 404
  return: "form not found"
  next: end

returnForbidden:
  status: 403
  return: '{"error": "FORBIDDEN"}'
  next: end
