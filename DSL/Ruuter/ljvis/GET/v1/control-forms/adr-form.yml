declaration:

  version: "1.0"
  description: "Get ADR sub-form by id (latest snapshot). Logs a view event only when the viewing user differs from the sub-form's creator (LJVIS2-141 §7)."
  method: get
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "ADR sub-form ID"

get_user_context:
  template: "templates/check-user-authority"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: fetchForm

fetchForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/adr-form/get"
    headers:
      type: json
    body:
      id: ${incoming.params.q}
  result: res
  next: checkFound

checkFound:
  switch:
    - condition: ${res.response.body == null || res.response.body.length !== 1}
      next: returnNotFound
  next: checkViewerDiffersFromCreator

checkViewerDiffersFromCreator:
  switch:
    - condition: ${res.response.body[0].createdBy != null && res.response.body[0].createdBy !== auth_user.personalcode}
      next: logView
  next: returnSuccess

logView:
  assign:
    description: "ADR alamvorm vaadatud, alamvormi võti=${res.response.body[0].id}, koondvormi võti=${res.response.body[0].compoundFormKey}, alamvormi number=${res.response.body[0].subFormNumber}/${res.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.adr.view"
    event_category: "control_form"
    description: ${description}
    log_content: "{\"subFormKey\":${res.response.body[0].id}}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body[0]}
  next: end

returnNotFound:
  status: 404
  return: '{"error": "NOT_FOUND"}'
  next: end
