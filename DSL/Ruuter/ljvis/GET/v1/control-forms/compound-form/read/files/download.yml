declaration:
  internal: false

  version: "1.0"
  description: "Get a short-lived presigned download URL for a file attachment"
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "ID of the form_attachment record"
    headers:
      - field: cookie
        type: string

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: downloadFile

downloadFile:
  template: "templates/files/download"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_number_prefix: "koond-"
    id: ${incoming.params.q}
    form_type: "compound-form"
    access_form_type: "compound-form"
  result: downloadResult

checkDownloadResult:
  switch:
    - condition: ${downloadResult === "FORBIDDEN"}
      next: returnReadAccessDenied
  next: returnSuccess

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

returnSuccess:
  return: ${downloadResult}
  status: 200
