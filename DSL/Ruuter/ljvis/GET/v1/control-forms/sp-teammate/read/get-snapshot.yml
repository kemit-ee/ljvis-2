declaration:

  version: "1.0"
  description: "Get version history snapshot for a drive rest form (teammate)"
  namespace: control-forms
  allowlist:
    params:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "sp_teammate_form_key"

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    form_key: "${incoming.body.formKey}"
  next: getSnapshot

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/teammate/get-snapshot"
    headers:
      type: json
    body:
      id: ${id}
      form_key: ${form_key}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: returnSuccess

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshot"
    headers:
      type: json
    body:
      formType: "drive-rest-form/teammate"
      id: ${id}
  result: archiveRes
  next: returnArchive

returnArchive:
  return: "${(archiveRes.response.body && archiveRes.response.body[0]) ? archiveRes.response.body[0].payload : null}"
  next: end

returnSuccess:
  return: ${res.response.body[0]}
  next: end
