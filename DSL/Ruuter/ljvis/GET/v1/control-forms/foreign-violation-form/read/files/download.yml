declaration:

  version: "0.1"
  description: "Get a short-lived presigned download URL for a file attachment"
  method: get
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "ID of the form_attachment record"

getActorFromTim:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: timRes
  next: extractActorData

extractActorData:
  assign:
    actor_personal_code: "${timRes.response.body.personalCode || ''}"
    actor_name: "${(timRes.response.body.firstName || '') + ' ' + (timRes.response.body.lastName || '')}"
    form_type: "foreign-violation-form"
  next: downloadFile

downloadFile:
  template: "[#LJVIS_PROJECT_LAYER]/files/download"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: "${incoming.params.q}"
    form_type: ${form_type}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: downloadResult

returnSuccess:
  return: ${downloadResult}
  status: 200
