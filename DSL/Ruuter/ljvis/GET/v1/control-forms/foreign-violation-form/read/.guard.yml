# Nõutav õigus: foreign_violation_form.read. auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.includes('foreign_violation_form.read')}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
