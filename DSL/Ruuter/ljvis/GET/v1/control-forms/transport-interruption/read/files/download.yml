declaration:
  call: declare
  version: 0.1
  description: "Get a presigned download URL for a transport-interruption sub-form file attachment"
  method: get
  accepts: json
  returns: json
  namespace: control-forms
  allowlist:
    params:
      - field: q
        type: string
        description: "ID of the form_attachment record"

get_user_context:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: auth_user
  next: downloadFile

downloadFile:
  template: "[#LJVIS_PROJECT_LAYER]/files/download"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    id: ${incoming.params.q}
    form_type: "transport-interruption"
    actor_name: "${auth_user.response.body.firstName || ''} ${auth_user.response.body.lastName || ''}"
    actor_personal_code: "${auth_user.response.body.personalCode || ''}"
  result: downloadResult

returnSuccess:
  return: ${downloadResult}
  status: 200
