declaration:

  version: "1.0"
  description: "Get a single transport-interruption form snapshot by snapshot ID, for the read-only historical version view."
  namespace: control-forms
  allowlist:
    params:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "KV form key"

checkPermission:
  switch:
    - condition: ${auth_user != null && auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('transport_interruption_form.read'))}
      next: getSnapshot
  next: returnForbidden

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/transport-interruption/get-snapshot"
    headers:
      type: json
    body:
      id: ${incoming.params.id}
      form_key: ${incoming.params.formKey}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: mapResponse

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshot"
    headers:
      type: json
    body:
      formType: "transport-interruption"
      id: ${incoming.params.id}
  result: archiveRes
  next: returnArchive

returnArchive:
  return: "${(archiveRes.response.body && archiveRes.response.body[0]) ? [archiveRes.response.body[0].payload] : []}"
  next: end

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_transport_interruption_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${[mapped.response.body]}
  next: end

returnForbidden:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

