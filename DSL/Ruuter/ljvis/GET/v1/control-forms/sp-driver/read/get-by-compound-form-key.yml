declaration:

  version: "1.0"
  description: "Get the latest active drive rest form (driver) for a compound form"
  namespace: control-forms
  allowlist:
    params:
      - field: compoundFormKey

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/drive-rest-form/driver/get-by-compound-form-key"
    headers:
      type: json
    body:
      compoundFormKey: ${incoming.params.compoundFormKey}
  result: res
  next: checkResponse

checkResponse:
  switch:
    - condition: ${res.response.body.length != 1}
      next: returnEmpty
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_sp_driver_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnEmpty:
  return: null
  next: end
