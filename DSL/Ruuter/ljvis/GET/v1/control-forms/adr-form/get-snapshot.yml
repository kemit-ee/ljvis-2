declaration:

  version: "1.0"
  description: "Get a single ADR form snapshot by snapshot ID, for the read-only historical version view (LJVIS2-141)."
  namespace: control-forms
  allowlist:
    params:
      - field: id
        type: string
        description: "Snapshot ID"
      - field: formKey
        type: string
        description: "ADR form key"

checkPermission:
  switch:
    - condition: ${auth_user != null && auth_user.permissions != null && (auth_user.permissions.includes('control_form.view_unpublished') || auth_user.permissions.includes('adr_form.read'))}
      next: checkReadAccess
  next: returnForbidden

# Omand (epic #502 A2 read): avalikustamata vormi loeb ainult looja, looja asutuse kolleeg või
# `control_form.view_unpublished` omaja; otsus tuleb Resql'ist (check-read-access), mitte kliendilt.
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: "adr-form"
    form_key: "${incoming.params.formKey}"
    form_number: ""
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getSnapshot
  next: returnReadAccessDenied

returnReadAccessDenied:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

getSnapshot:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/adr-form/get-snapshot"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${incoming.params.id}
      form_key: ${incoming.params.formKey}
  result: res
  next: checkEmpty

checkEmpty:
  switch:
    - condition: ${res.response.body == null || res.response.body.length == 0}
      next: getFromArchive
  next: mapResponse

getFromArchive:
  call: http.post
  args:
    url: "[#LJVIS_RESQL_ARHIIV]/deleted-forms/get_snapshot"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      formType: "adr-form"
      id: ${incoming.params.id}
  result: archiveRes
  next: returnArchive

returnArchive:
  return: "${(archiveRes.response.body && archiveRes.response.body[0]) ? [archiveRes.response.body[0].payload] : []}"
  next: end

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_adr_form"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${[mapped.response.body]}
  next: end

returnForbidden:
  status: 403
  return: '{"error":"FORBIDDEN"}'
  next: end

