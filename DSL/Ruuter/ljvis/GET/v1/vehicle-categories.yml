declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "List of all vehicle categories"
  namespace: vehicle-categories
  allowlist:
    params: []

getVehicleCategories:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/vehicle-categories/list_vehicle-categories"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
