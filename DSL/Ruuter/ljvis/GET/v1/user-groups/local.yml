declaration:
  call: declare
  version: 0.1
  description: "Get a single user group by ID filtered by own organisation (local scope)"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    params:
      - field: q
        type: string
        description: "User group ID"

get_user_context:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    organisation_id: ${auth_user.organisationid}
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res
  next: checkGroupFound

checkGroupFound:
  switch:
    - condition: ${res.response.body.length > 0}
      next: mapResponse
  next: return_forbidden

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: getGroupUsers

getGroupUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${Number(id)}
      user_organisation_id: ${organisation_id}
      page: 1
      page_size: 10000
      search: ""
      sorting: ""
  result: usersRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    group_name: "${res.response.body[0].name || ''}"
    displayed_personal_codes: ${JSON.stringify((usersRes.response.body ?? []).map(u => u.personalCode))}
    personal_codes_str: "${(usersRes.response.body ?? []).map(u => \"'\" + u.personalCode + \"'\").join(', ')}"
    view_description: "${(usersRes.response.body ?? []).length > 0 ? 'Kasutajagrupi ' + group_name + ' vaatamine, kasutajaid: ' + personal_codes_str : 'Kasutajagrupi ' + group_name + ' vaatamine'}"
    log_content: "{\"targetGroupId\":${id},\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id},\"displayedUserPersonalCodes\":${displayed_personal_codes}}"
  next: logAuditEvent

logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_type: "user_group.view"
      event_category: "user_group_management"
      actor_name: ${actor_name}
      actor_personal_code: ${actor_personal_code}
      description: ${view_description}
      log_content: ${log_content}
      created_by: ${actor_name}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
