declaration:

  version: "1.0"
  description: "Get organisations linked to a user group"
  namespace: user-groups
  allowlist:
    params:
      - field: q
        type: string
        description: "User group ID"

extractRequestData:
  assign:
    user_group_id: "${incoming.params.q}"
  next: getOrganisations

getOrganisations:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_organisations"
    headers:
      type: json
    body:
      user_group_id: ${user_group_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group_organisations"
    headers:
      type: json
    body:
      organisations: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
