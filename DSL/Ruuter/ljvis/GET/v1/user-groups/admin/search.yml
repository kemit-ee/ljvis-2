declaration:
  call: declare
  version: 0.1
  description: "Search/list user groups (admin scope — all organisations)"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    params:
      - field: q
        type: string
        description: "Search by group name or organisation name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"
      - field: logSearch
        type: boolean
        description: "Whether to log this as a user-initiated search"

get_user_context:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    search: "${incoming.params.q ?? ''}"
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'name asc'}"
    actor_personal_code: "${auth_user.response.body.personalCode || ''}"
    actor_name: "${auth_user.response.body.firstName || ''} ${auth_user.response.body.lastName || ''}"
    log_search: "${incoming.params.logSearch ?? false}"
  next: getUserGroups

getUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/list_user_groups"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: 0
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_groups_list"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: setDefaults

setDefaults:
  assign:
    result_count: ${mapped.response.body.total}
  next: checkSearch

checkSearch:
  switch:
    - condition: "${log_search == true && search.length >= 3}"
      next: logSearchEvent
  next: returnSuccess

logSearchEvent:
  template: "[#LJVIS_PROJECT_LAYER]/audit/log-audit-event"
  requestType: templates
  body:
    event_type: "user_group.list.search"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: "Otsing '${search}', tulemusi ${result_count}"
    log_content: "{\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"scope\":\"allOrganisations\",\"organisationId\":null}"
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
