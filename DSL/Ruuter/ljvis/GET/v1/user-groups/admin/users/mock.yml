declaration:
  description: "Arenduse mock: GET /v1/user-groups/admin/users/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: "a0000001-0000-0000-0000-000000000001"
          firstName: "Marko"
          lastName: "Mägi"
          personalCode: "60001019906"
          organisationName: "Politsei- ja Piirivalveamet"
          status: "active"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
