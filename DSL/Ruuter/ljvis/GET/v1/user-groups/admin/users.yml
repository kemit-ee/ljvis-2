declaration:
  call: declare
  version: 0.1
  description: "List members of a user group (admin scope — all organisations)"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    params:
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Items per page"
      - field: sorting
        type: string
        description: "Sort column and direction"
      - field: search
        type: string
        description: "Search by first or last name"
      - field: q
        type: string
        description: "User group ID to filter members by"

extractRequestData:
  assign:
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'status asc'}"
    search: "${incoming.params.search ?? ''}"
    user_group_id: "${incoming.params.q ?? 0}"
    user_organisation_id: 0
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_users"
    headers:
      type: json
    body:
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      search: ${search}
      user_group_id: ${user_group_id}
      user_organisation_id: ${user_organisation_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group_users"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
