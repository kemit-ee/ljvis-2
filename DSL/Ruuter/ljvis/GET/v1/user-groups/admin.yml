declaration:

  version: "1.0"
  description: "Get a single user group by ID (admin scope — all organisations)"
  namespace: user-groups
  allowlist:
    params:
      - field: q
        type: string
        description: "User group ID"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    organisation_id: 0
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getUserGroup

getUserGroup:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: getGroupUsers

getGroupUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user_group/get_user_group_users"
    headers:
      type: json
    body:
      user_group_id: ${Number(id)}
      user_organisation_id: 0
      page: 1
      page_size: 10000
      search: ""
      sorting: ""
  result: usersRes
  next: buildAuditEvent

buildAuditEvent:
  assign:
    group_name: "${res.response.body[0].name || ''}"
    displayed_personal_codes: "[]"
  next: buildAuditContent

buildAuditContent:
  assign:
    view_description: "Kasutajagrupi ${group_name} vaatamine"
    log_content: "{\"targetGroupId\":${id},\"scope\":\"allOrganisations\",\"organisationId\":null,\"displayedUserPersonalCodes\":${displayed_personal_codes}}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user_group.view"
    event_category: "user_group_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${view_description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
