declaration:
  description: "Arenduse mock: GET /v1/user-groups/local/organisations/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - organisationId: "b0000001-0000-0000-0000-000000000002"
          name: "Justiitsministeerium"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
