  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: "a0000001-0000-0000-0000-000000000002"
          firstName: "Kairi"
          lastName: "Sepp"
          personalCode: "60001017727"
          organisationName: "Justiitsministeerium"
          status: "active"
  result: mock_data

returnSuccess:
