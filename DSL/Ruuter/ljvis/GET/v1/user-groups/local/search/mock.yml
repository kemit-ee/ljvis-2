declaration:
  description: "Arenduse mock: GET /v1/user-groups/local/search/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      content:
        - id: "2"
          name: "Local Admin Group"
          organisations: ["Justiitsministeerium"]
          coversAllOrganisations: false
      total: 1
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body}
  next: end
