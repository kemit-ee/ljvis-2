declaration:
  internal: false

  version: "1.0"
  description: >-
    Citizen-facing equivalent of GET/v1/classifier-values.yml - same resql,
    same shape. Classifier values (codes/labels used to render form fields,
    e.g. TRANSPORT_TYPE/DRIVING_VIOLATION) are non-sensitive read-only
    reference data; a separate citizen route exists only because
    /v1/classifier-values.yml lives directly under GET/v1/ alongside many
    officer-only siblings, so its guard (GET/v1/.guard) can't be scoped to
    just this one file without moving it (which would change its URL).
    Guarded by GET/v1/citizen/.guard (templates/citizen-authority) - reuses
    the existing override_ancestors set up for the citizen namespace.
  namespace: citizen
  allowlist:
    params: []
    headers:
      - field: if-none-match
        type: string
        required: false
        description: "Varasema vastuse ETag (HTTP tingimuslik päring)"

# ETag / 304 (klassifikaatorid muutuvad harva): odav versioonimärk enne suurt päringut.
# Kui brauseri If-None-Match ühtib, vastatakse 304 ilma kehata (Ruuteri CPU on vastuse
# suurusega lineaarne). private, no-cache: brauser hoiab koopiat, aga valideerib iga kord;
# guard jookseb enne seda DSL-i, seega õiguseta kasutaja 304-t ei saa.
getVersion:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifiers_version"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: ver
  next: setEtag

setEtag:
  assign:
    etag: "${'W/\"cv-citizen-' + ver.response.body[0].version + '\"'}"
  next: checkNotModified

checkNotModified:
  switch:
    - condition: "${String(incoming.headers['if-none-match'] || '').split(',').map(function(t){ return t.trim(); }).indexOf(etag) >= 0}"
      next: returnNotModified
  next: getClassifierValues

returnNotModified:
  status: 304
  headers:
    ETag: ${etag}
    Cache-Control: "private, no-cache"
  return: ""
  next: end

getClassifierValues:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/list_classifier_value_data"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res
  next: returnSuccess

returnSuccess:
  headers:
    ETag: ${etag}
    Cache-Control: "private, no-cache"
  return: ${res.response.body}
  next: end
