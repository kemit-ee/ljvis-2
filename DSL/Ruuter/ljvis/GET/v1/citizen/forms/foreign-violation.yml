declaration:

  version: "1.0"
  description: >-
    Citizen-facing read-only single foreign_violation_form detail. Guarded by
    GET/v1/citizen/.guard (templates/citizen-authority). Company scope ONLY —
    ownership requires row.companyRegCode to be one of the session's
    represented companies (templates/citizen-company-representative —
    cached claim first, live Äriregister esindus_v2 fallback), independent
    of activeRole/activeRegistryCode — the dashboard shows every represented
    company's forms at once, so a click-through must succeed regardless of
    which role happens to be active (same pattern as forms/search.yml's
    scope param and citizen/forms/compound.yml). citizen-self is not supported for this type
    and always returns 403: the driver on a foreign_violation_form is stored
    as driver_first_name/driver_last_name only (see get.sql) with NO
    personal code column at all, so there is no reliable identifier to match
    against the session's own personalCode (matching by name alone would be
    unsafe — name collisions). Citizen-visible status is 'published' only.
    Reuses the officer resql (control-forms/foreign-violation-form/get.sql)
    and DMapper template (map_foreign_violation_form).

    GDPR: no masking applied — driver_first_name/driver_last_name are the
    ONLY driver fields on this form (no personal code to mask), same
    reasoning already used for names elsewhere in this citizen surface (kept
    visible, company needs to know who was involved).
  namespace: citizen
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"
    params:
      - field: q
        type: string
        description: "Foreign violation form ID"

getSessionClaims:
  template: "templates/citizen-authority"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  result: authority
  next: checkSession

checkSession:
  switch:
    - condition: "${authority === 'false'}"
      next: returnUnauthenticated
  next: extractClaims

extractClaims:
  assign:
    personal_code: "${authority.personalCode}"
    represented_companies: "${authority.representedCompanies ?? []}"
  next: getForm

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/get"
    headers:
      type: json
    body:
      id: "${incoming.params.q}"
  result: res
  next: checkFound

checkFound:
  switch:
    - condition: "${res.response.body.length != 1}"
      next: returnNotFound
  next: checkOwnership

checkOwnership:
  assign:
    row: "${res.response.body[0]}"
  next: checkOwnershipSwitch

checkOwnershipSwitch:
  switch:
    - condition: "${row.status !== 'published'}"
      next: returnNotFound
  next: checkCompanyRepresentative

# templates/citizen-company-representative — same check as forms/search.yml's
# scope=company branch and citizen/forms/compound.yml, independent of
# activeRole/activeRegistryCode (see the description block above for why).
checkCompanyRepresentative:
  template: "templates/citizen-company-representative"
  requestType: GET
  body:
    personal_code: ${personal_code}
    registry_code: ${row.companyRegCode}
    cached_companies: ${represented_companies}
  result: representative_check
  next: checkRepresentativeResult

checkRepresentativeResult:
  switch:
    - condition: "${representative_check.isRepresentative === true}"
      next: mapResponse
  next: returnForbidden

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_foreign_violation_form"
    headers:
      type: json
    body:
      forms: ${res.response.body}
  result: mapped
  next: logAuditEvent

# Company scope is the ONLY scope this endpoint allows (see checkOwnership),
# so a successful response always means a representative viewed a third
# party's (the driver's) data — always audit it, unlike the other citizen
# detail endpoints where citizen-self access to one's own record is exempt.
logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "citizen.control_form.foreign_violation.view"
    event_category: "control_form"
    description: "Esindaja vaatas välisriigi rikkumise vormi ${row.formNumber}"
    log_content: "${JSON.stringify({formKey: row.id, companyRegCode: row.companyRegCode})}"
    actor_name: ${personal_code}
    actor_personal_code: ${personal_code}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnNotFound:
  status: 404
  return: "${({error: 'NOT_FOUND', message: 'Form not found'})}"
  next: end

returnForbidden:
  status: 403
  return: "${({error: 'FORBIDDEN', message: 'This form does not belong to your active representation'})}"
  next: end

returnUnauthenticated:
  status: 401
  return: "${({error: 'UNAUTHENTICATED', message: 'Valid session required'})}"
  next: end
