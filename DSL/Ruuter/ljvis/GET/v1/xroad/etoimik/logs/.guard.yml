# Nõutav õigus: xroad.log.read (Haldus > eToimiku X-tee logid).
# auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.includes('xroad.log.read')}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
