declaration:

  version: "1.0"
  description: "List all organisations"
  method: get
  accepts: json
  returns: json
  namespace: organisations

getOrganisations:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/organisation/list_organisations"
    headers:
      type: json
    body: {}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
