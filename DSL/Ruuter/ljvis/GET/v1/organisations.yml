declaration:

  version: "1.0"
  description: "List all organisations"
  namespace: organisations
  allowlist:
    params: []

getOrganisations:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/organisation/list_organisations"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
