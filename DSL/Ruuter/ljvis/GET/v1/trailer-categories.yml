declaration:
  internal: false

  version: "1.0"
  description: "List all trailer categories"
  namespace: trailer-categories
  allowlist:
    params: []

getTrailerCategories:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/trailer-categories/list_trailer-categories"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
