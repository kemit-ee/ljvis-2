declaration:
  call: declare
  version: 0.1
  description: "List all counties (fixed set)"
  method: get
  accepts: json
  returns: json
  namespace: ehak

getPermissions:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ehak/list_counties"
    headers:
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
