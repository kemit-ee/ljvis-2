declaration:
  internal: false

  version: "1.0"
  description: "List all permissions (fixed set)"
  namespace: permissions
  allowlist:
    params: []

getPermissions:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/permission/list_permissions"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
