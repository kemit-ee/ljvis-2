declaration:
  version: "2.0"
  description: >-
    Postkast 2.0 kaudu saadetud kirjade logi (analüüs 12-2 "Saadetud
    teavituste nimekirja vaatamine"). Filtrid: status, notificationType,
    dateFrom/dateTo (saatmise kuupäevavahemik), recipient (adressaat,
    sisaldab), notificationKey (täpne). Sortimine sortBy/sortDir (vaikimisi
    sendDate desc). Leheküljed page + pageSize.
    Nõuab notification.list õigust (kaitstud outbound-log/.guard kaudu).
    Iga avamine logitakse auditisse (notification.list.view) — vaates
    kuvatakse isikuandmeid (adressaatide e-posti aadressid), 12-2 §7.
  namespace: notification
  allowlist:
    params:
      - field: status
        type: string
      - field: notificationType
        type: string
      - field: dateFrom
        type: string
      - field: dateTo
        type: string
      - field: recipient
        type: string
      - field: notificationKey
        type: string
      - field: sortBy
        type: string
      - field: sortDir
        type: string
      - field: page
        type: number
      - field: pageSize
        type: number

extractParams:
  assign:
    status: "${incoming.params.status ?? ''}"
    notification_type: "${incoming.params.notificationType ?? ''}"
    date_from: "${incoming.params.dateFrom ?? ''}"
    date_to: "${incoming.params.dateTo ?? ''}"
    recipient: "${incoming.params.recipient ?? ''}"
    notification_key: "${incoming.params.notificationKey ?? ''}"
    sort_by: "${incoming.params.sortBy ?? 'send_date'}"
    sort_dir: "${incoming.params.sortDir ?? 'desc'}"
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 20}"
  next: queryLog

queryLog:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/notification/list_outbound_log"
    headers:
      type: json
    body:
      status: ${status}
      notification_type: ${notification_type}
      date_from: ${date_from}
      date_to: ${date_to}
      recipient: ${recipient}
      notification_key: ${notification_key}
      sort_by: ${sort_by}
      sort_dir: ${sort_dir}
      page: ${page}
      page_size: ${page_size}
  result: res
  next: sanitizeRows

# failure_reason võib pärineda X-teelt / Postkast 2.0-st (op.resolution) ja
# sisaldada reavahetusi / kurakaldkriipse. map_outbound_log_list.handlebars
# ehitab JSON-i käsitsi (ei escape'i), seega üherealiseks siin — muidu tekitaks
# üksainus vigane rida terve lehe DMapper-parse vea (500).
sanitizeRows:
  assign:
    clean_rows: >-
      ${(res.response.body || []).map(function(r){
        if (r.failureReason) {
          r.failureReason = String(r.failureReason).replace(/[\r\n\t\\]+/g, ' ').replace(/"/g, "'");
        }
        return r;
      })}
  next: mapResponse

# Mähime read {content, total} kujusse (frontend PagedResponse), sama mustriga
# nagu erru list-otspunktid (map_rsi_list / map_ctud_list). total tuleb
# list_outbound_log.sql-i COUNT(*) OVER () veerust, mis on igal real ühesugune.
mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_outbound_log_list"
    headers:
      type: json
    body:
      rows: ${clean_rows}
  result: mapped
  next: buildAuditDescription

# 12-2 §7: iga avamine logitakse, sest vaates kuvatakse adressaatide
# e-posti aadresse. `description` on audit-tabelis varchar(500), seega hoiame
# selle lühikese (filter + lehekülg + kirjete arv); kuvatud teavituste
# tunnused ja adressaadid lähevad täies mahus struktureeritud log_content'i.
buildAuditDescription:
  assign:
    shown_count: "${(res.response.body || []).length}"
    shown_keys_json: "${JSON.stringify((res.response.body || []).map(function(r){ return r.notificationKey || r.id; }))}"
    shown_recipients_json: "${JSON.stringify((res.response.body || []).map(function(r){ return r.recipientAddress; }).filter(function(e){ return !!e; }))}"
    filter_summary: "${'status=' + (status || '-') + ', notificationType=' + (notification_type || '-') + ', dateFrom=' + (date_from || '-') + ', dateTo=' + (date_to || '-') + ', recipient=' + (recipient || '-') + ', notificationKey=' + (notification_key || '-')}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "notification.list.view"
    event_category: "notification_management"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
    description: "${('Teavituste logi vaadatud, filter ' + filter_summary + ', lehekülg ' + page + ', kuvatud ' + shown_count + ' kirjet, ulatus: kõik asutused').substring(0, 480)}"
    log_content: "${JSON.stringify({ page: page, pageSize: page_size, sortBy: sort_by, sortDir: sort_dir, filters: { status: status, notificationType: notification_type, dateFrom: date_from, dateTo: date_to, recipient: recipient, notificationKey: notification_key }, shownNotificationKeys: JSON.parse(shown_keys_json), shownRecipients: JSON.parse(shown_recipients_json) })}"
  result: audit_result
  next: returnResult

returnResult:
  return: ${mapped.response.body}
  next: end
