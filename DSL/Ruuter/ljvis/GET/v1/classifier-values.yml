declaration:
  internal: false

  version: "1.0"
  description: "List of all classifier values"
  namespace: classifier-values
  allowlist:
    params: []

getClassifierValues:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/list_classifier_value_data"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
