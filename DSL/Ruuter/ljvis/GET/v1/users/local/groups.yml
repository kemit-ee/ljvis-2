declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Get groups assigned to a user"
  namespace: users
  allowlist:
    params:
      - field: q
        type: string
        description: "User UUID"

extractRequestData:
  assign:
    user_id: "${incoming.params.q}"
  next: getUserGroups

getUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_groups"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      user_id: ${user_id}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
