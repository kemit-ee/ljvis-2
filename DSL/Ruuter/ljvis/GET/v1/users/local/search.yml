declaration:

  version: "1.0"
  description: "Search/list users filtered by own organisation (local scope)"
  namespace: users
  allowlist:
    params:
      - field: q
        type: string
        description: "Search by name or personal code"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    search: "${incoming.params.q ?? ''}"
    page: "${Number(incoming.params.page ?? 1)}"
    page_size: "${Number(incoming.params.pageSize ?? 20)}"
    sorting: "${incoming.params.sorting ?? 'status asc'}"
    organisation_id: "${auth_user.organisationid}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getUsers

getUsers:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/list_users"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: ${organisation_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_users_list"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: setResultCount

setResultCount:
  assign:
    result_count: ${mapped.response.body.total}
  next: setDefaults

setDefaults:
  assign:
    view_description: "Kasutajate nimekiri, leht ${page}, tulemusi 0"
    view_log_content: "{\"page\":${page},\"pageSize\":${page_size},\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"displayedPersonalCodes\":[],\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id}}"
  next: checkSearch

checkSearch:
  switch:
    - condition: ${search.length >= 3}
      next: logSearchEvent
  next: extractPersonalCodes

logSearchEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user.list.search"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: "Otsing '${search}'"
    log_content: "{\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id}}"
  result: audit_result
  next: extractPersonalCodes

extractPersonalCodes:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_personal_codes"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: personal_codes_result
  next: setPersonalCode

setPersonalCode:
  assign:
    personal_codes: "${personal_codes_result.response.body}"
  next: checkResultCount

checkResultCount:
  switch:
    - condition: ${result_count > 0}
      next: setDescriptionAndLogContent
  next: logViewEvent

setDescriptionAndLogContent:
  assign:
    view_description: "Kasutajate nimekiri, leht ${page}, tulemusi ${result_count}: ${personal_codes}"
    view_log_content: "{\"page\":${page},\"pageSize\":${page_size},\"searchTerm\":\"${search}\",\"resultCount\":${result_count},\"displayedPersonalCodes\":\"${personal_codes}\",\"scope\":\"ownOrganisation\",\"organisationId\":${organisation_id}}"
  next: logViewEvent

logViewEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user.list.view"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${view_description}
    log_content: ${view_log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
