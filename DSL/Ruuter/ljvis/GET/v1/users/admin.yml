declaration:

  version: "1.0"
  description: "Get a single user by ID (admin scope — all organisations)"
  namespace: users
  allowlist:
    params:
      - field: q
        type: string
        description: "User UUID"

get_user_context:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    organisation_id: null
  next: getUser

getUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${id}
      organisation_id: ${organisation_id}
  result: res
  next: buildAuditLog

buildAuditLog:
  assign:
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    user_first_name: "${res.response.body[0].firstName || ''}"
    user_last_name: "${res.response.body[0].lastName || ''}"
    user_personal_code: "${res.response.body[0].personalCode || ''}"
  next: buildAuditContent

buildAuditContent:
  assign:
    view_description: "Kasutaja vaatamine: ${user_first_name} ${user_last_name} (${user_personal_code})"
    view_log_content: "{\"targetPersonalCode\":\"${user_personal_code}\",\"targetName\":\"${user_first_name} ${user_last_name}\",\"scope\":\"allOrganisations\",\"organisationId\":null}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "user.view"
    event_category: "user_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${view_description}
    log_content: ${view_log_content}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
