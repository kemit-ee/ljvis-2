declaration:
  description: "Arenduse mock: GET /v1/users/admin/groups/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - userGroupId: "1"
          name: "Super Admin Group"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
