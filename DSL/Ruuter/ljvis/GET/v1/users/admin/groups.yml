declaration:

  version: "1.0"
  description: "Get groups assigned to a user"
  namespace: users
  allowlist:
    params:
      - field: q
        type: string
        description: "User UUID"

extractRequestData:
  assign:
    user_id: "${incoming.params.q}"
  next: getUserGroups

getUserGroups:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_groups"
    headers:
      type: json
    body:
      user_id: ${user_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_assigned_groups"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
