declaration:
  call: declare
  version: 0.1
  description: "Get next serial number for a foreign violation form"
  method: get
  accepts: json
  returns: json
  namespace: forms

getSerialNumber:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/forms/foreign-violation/get_serial_number"
    headers:
      type: json
    body: {}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body[0].serialNumber}
  next: end
