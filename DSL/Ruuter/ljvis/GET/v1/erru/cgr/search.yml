declaration:
  version: "1.0"
  description: "Paginated, filtered list of OUTGOING CGR requests only (LJVIS2-140) — 'väljaminevad päringud' per the task specification, unlike the CTUD list which covers both directions; direction is hard-coded to 'outgoing' in search.sql, not exposed as a filter. All eight filters are optional and AND-combined, including tmFirstName/tmFamilyName (separate fields, not an OR-group like CTUD's search criteria). Method is GET per docs/rest-api-design-guide.md section 2.3, which lists POST-based list retrieval as a forbidden pattern; the task specification's POST /erru/cgr/list is deliberately not followed, mirroring the CTUD precedent. Audited on every load because the list exposes transport manager and handler names."
  namespace: erru
  allowlist:
    params:
      - field: businessCaseId
        type: string
      - field: tmFirstName
        type: string
      - field: tmFamilyName
        type: string
      - field: sentFrom
        type: string
      - field: sentUntil
        type: string
      - field: cgrTo
        type: string
      - field: status
        type: string
      - field: handlerPersonalCode
        type: string
      - field: sorting
        type: string
      - field: page
        type: string
      - field: pageSize
        type: string

extractRequestData:
  assign:
    business_case_id: "${incoming.params.businessCaseId || ''}"
    tm_first_name: "${incoming.params.tmFirstName || ''}"
    tm_family_name: "${incoming.params.tmFamilyName || ''}"
    sent_from: "${incoming.params.sentFrom || ''}"
    sent_until: "${incoming.params.sentUntil || ''}"
    cgr_to: "${incoming.params.cgrTo || ''}"
    status: "${incoming.params.status || ''}"
    handler_personal_code: "${incoming.params.handlerPersonalCode || ''}"
    sorting: "${incoming.params.sorting || 'sent_at desc'}"
    page: "${incoming.params.page || '1'}"
    page_size: "${incoming.params.pageSize || '20'}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: searchRequests

searchRequests:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/cgr/search"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      sentFrom: ${sent_from}
      sentUntil: ${sent_until}
      cgrTo: ${cgr_to}
      status: ${status}
      handlerPersonalCode: ${handler_personal_code}
      sorting: ${sorting}
      page: ${page}
      page_size: ${page_size}
  result: res
  next: buildFilterSummary

# Filter summary for the audit description. Built with concat instead of an object
# literal because a literal brace inside ${...} truncates the Ruuter expression.
buildFilterSummary:
  assign:
    result_count: "${res.response.body.length}"
    filter_summary: "${'businessCaseId=' + business_case_id + '; tmFirstName=' + tm_first_name + '; tmFamilyName=' + tm_family_name + '; sentFrom=' + sent_from + '; sentUntil=' + sent_until + '; cgrTo=' + cgr_to + '; status=' + status + '; handler=' + handler_personal_code}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/erru/cgr/log-cgr-list-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    filters: ${filter_summary}
    result_count: ${result_count}
    page: ${page}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_cgr_list"
    headers:
      type: json
    body:
      requests: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
