declaration:
  version: "1.0"
  description: "Paginated, filtered RSI message list — both incoming and outgoing (LJVIS2-149). Unlike
    the CGR list (outgoing-only), the specification includes both directions. ID and vehicleRegistrationNumber
    filters are OR-combined with each other and AND-combined with all other filters. Audited on every
    load because the list exposes handler names and vehicle registration numbers (personal-data footprint).
    Sits under the existing GET/v1/erru/rsi/.guard (rsi.read) — no new guard file needed."
  method: get
  accepts: json
  returns: json
  namespace: erru
  allowlist:
    params:
      - field: businessCaseId
        type: string
      - field: vehicleRegistrationNumber
        type: string
      - field: sentFrom
        type: string
      - field: sentUntil
        type: string
      - field: rsiFrom
        type: string
      - field: rsiTo
        type: string
      - field: status
        type: string
      - field: direction
        type: string
      - field: handlerPersonalCode
        type: string
      - field: sorting
        type: string
      - field: pageSize
        type: string
      - field: page
        type: string

extractRequestData:
  assign:
    business_case_id: "${incoming.params.businessCaseId || ''}"
    vehicle_registration_number: "${incoming.params.vehicleRegistrationNumber || ''}"
    sent_from: "${incoming.params.sentFrom || ''}"
    sent_until: "${incoming.params.sentUntil || ''}"
    rsi_from: "${incoming.params.rsiFrom || ''}"
    rsi_to: "${incoming.params.rsiTo || ''}"
    status: "${incoming.params.status || ''}"
    direction: "${incoming.params.direction || ''}"
    handler_personal_code: "${incoming.params.handlerPersonalCode || ''}"
    sorting: "${incoming.params.sorting || 'sent_at desc'}"
    page: "${incoming.params.page || '1'}"
    page_size: "${incoming.params.pageSize || '20'}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: searchMessages

searchMessages:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/rsi/search"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      vehicleRegistrationNumber: ${vehicle_registration_number}
      sentFrom: ${sent_from}
      sentUntil: ${sent_until}
      rsiFrom: ${rsi_from}
      rsiTo: ${rsi_to}
      status: ${status}
      direction: ${direction}
      handlerPersonalCode: ${handler_personal_code}
      sorting: ${sorting}
      page: ${page}
      page_size: ${page_size}
  result: res
  next: buildFilterSummary

buildFilterSummary:
  assign:
    result_count: "${res.response.body.length}"
    filter_summary: "${'businessCaseId=' + business_case_id + '; vehicleRegistrationNumber=' + vehicle_registration_number + '; sentFrom=' + sent_from + '; sentUntil=' + sent_until + '; rsiFrom=' + rsi_from + '; rsiTo=' + rsi_to + '; status=' + status + '; direction=' + direction + '; handler=' + handler_personal_code}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/erru/rsi/log-rsi-list-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    filters: ${filter_summary}
    result_count: ${result_count}
    page: ${page}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_rsi_list"
    headers:
      type: json
    body:
      messages: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
