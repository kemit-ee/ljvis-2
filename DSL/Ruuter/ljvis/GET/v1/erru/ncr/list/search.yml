declaration:
  internal: false
  version: "1.0"
  description: "Paginated, filtered NCR case list - both incoming and outgoing (LJVIS2-65).
    One row per CASE (ncr_message_key), latest snapshot. All filters are plain AND (no
    OR-pair - NCR has only one text filter, businessCaseId, unlike RSI/CGR). hasInfringement
    drives the pink row highlight and needsAttention (incoming + infringement + unresolved) the
    left danger border on the frontend; eventAt is sent date (outgoing) or arrival date (incoming). Protected by the new ncr.list permission
    (list/.guard), distinct from ncr.read which protects get.yml. Audited on every load
    because the list exposes transport undertaking and handler names."
  namespace: erru
  allowlist:
    params:
      - field: businessCaseId
        type: string
      - field: dateFrom
        type: string
      - field: dateUntil
        type: string
      - field: ncrFrom
        type: string
      - field: ncrTo
        type: string
      - field: status
        type: string
      - field: direction
        type: string
      - field: handlerPersonalCode
        type: string
      - field: automatic
        type: string
      - field: needsAttention
        type: string
      - field: sorting
        type: string
      - field: pageSize
        type: string
      - field: page
        type: string
    headers:
      - field: cookie
        type: string

extractRequestData:
  assign:
    business_case_id: "${incoming.params.businessCaseId || ''}"
    date_from: "${incoming.params.dateFrom || ''}"
    date_until: "${incoming.params.dateUntil || ''}"
    ncr_from: "${incoming.params.ncrFrom || ''}"
    ncr_to: "${incoming.params.ncrTo || ''}"
    status: "${incoming.params.status || ''}"
    direction: "${incoming.params.direction || ''}"
    handler_personal_code: "${incoming.params.handlerPersonalCode || ''}"
    automatic: "${incoming.params.automatic || ''}"
    needs_attention: "${incoming.params.needsAttention || ''}"
    sorting: "${incoming.params.sorting || 'attention'}"
    page: "${incoming.params.page || '1'}"
    page_size: "${incoming.params.pageSize || '20'}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: searchCases

searchCases:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/search"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      businessCaseId: ${business_case_id}
      dateFrom: ${date_from}
      dateUntil: ${date_until}
      ncrFrom: ${ncr_from}
      ncrTo: ${ncr_to}
      status: ${status}
      direction: ${direction}
      handlerPersonalCode: ${handler_personal_code}
      automatic: ${automatic}
      needsAttention: ${needs_attention}
      sorting: ${sorting}
      page: ${page}
      page_size: ${page_size}
  result: res
  next: buildFilterSummary

buildFilterSummary:
  assign:
    result_count: "${res.response.body.length}"
    filter_summary: "${'businessCaseId=' + business_case_id + '; dateFrom=' + date_from + '; dateUntil=' + date_until + '; ncrFrom=' + ncr_from + '; ncrTo=' + ncr_to + '; status=' + status + '; direction=' + direction + '; handler=' + handler_personal_code + '; needsAttention=' + needs_attention}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/erru/ncr/log-ncr-list-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    filters: ${filter_summary}
    result_count: ${result_count}
    page: ${page}
  result: audit_result
  next: mapResponse

mapResponse:
  assign:
    paged: "${({ content: res.response.body, total: res.response.body.length > 0 ? res.response.body[0].total : 0 })}"
  next: returnSuccess

returnSuccess:
  return: ${paged}
  next: end
