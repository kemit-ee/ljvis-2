declaration:
  version: "1.0"
  description: "Paginated, filtered list of CTUD requests, outgoing and incoming in one table (LJVIS2-145). All eleven filters are optional; the three search-criteria filters (undertaking name, community licence number, vehicle registration number) are OR-combined with each other and AND-combined with the rest — that logic lives in search.sql. Method is GET per docs/rest-api-design-guide.md section 2.3, which lists POST-based list retrieval as a forbidden pattern; the task specification's POST /erru/ctud/list is deliberately not followed. Audited on every load because the list exposes undertaking and handler names."
  namespace: erru
  allowlist:
    params:
      - field: businessCaseId
        type: string
      - field: sentFrom
        type: string
      - field: sentUntil
        type: string
      - field: ctudFrom
        type: string
      - field: ctudTo
        type: string
      - field: transportUndertakingName
        type: string
      - field: communityLicenceNumber
        type: string
      - field: vehicleRegistrationNumber
        type: string
      - field: handlerPersonalCode
        type: string
      - field: status
        type: string
      - field: direction
        type: string
      - field: sorting
        type: string
      - field: page
        type: string
      - field: pageSize
        type: string

extractRequestData:
  assign:
    business_case_id: "${incoming.params.businessCaseId || ''}"
    sent_from: "${incoming.params.sentFrom || ''}"
    sent_until: "${incoming.params.sentUntil || ''}"
    ctud_from: "${incoming.params.ctudFrom || ''}"
    ctud_to: "${incoming.params.ctudTo || ''}"
    transport_undertaking_name: "${incoming.params.transportUndertakingName || ''}"
    community_licence_number: "${incoming.params.communityLicenceNumber || ''}"
    vehicle_registration_number: "${incoming.params.vehicleRegistrationNumber || ''}"
    handler_personal_code: "${incoming.params.handlerPersonalCode || ''}"
    status: "${incoming.params.status || ''}"
    direction: "${incoming.params.direction || ''}"
    sorting: "${incoming.params.sorting || 'sent_at desc'}"
    page: "${incoming.params.page || '1'}"
    page_size: "${incoming.params.pageSize || '20'}"
    actor_personal_code: "${u.personalcode || ''}"
    actor_name: "${(u.firstname || '') + ' ' + (u.lastname || '')}"
  next: searchRequests

searchRequests:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ctud/search"
    headers:
      type: json
    body:
      businessCaseId: ${business_case_id}
      sentFrom: ${sent_from}
      sentUntil: ${sent_until}
      ctudFrom: ${ctud_from}
      ctudTo: ${ctud_to}
      transportUndertakingName: ${transport_undertaking_name}
      communityLicenceNumber: ${community_licence_number}
      vehicleRegistrationNumber: ${vehicle_registration_number}
      handlerPersonalCode: ${handler_personal_code}
      status: ${status}
      direction: ${direction}
      sorting: ${sorting}
      page: ${page}
      page_size: ${page_size}
  result: res
  next: buildFilterSummary

# Filter summary for the audit description. Built with concat instead of an object
# literal because a literal brace inside ${...} truncates the Ruuter expression.
buildFilterSummary:
  assign:
    result_count: "${res.response.body.length}"
    filter_summary: "${'businessCaseId=' + business_case_id + '; sentFrom=' + sent_from + '; sentUntil=' + sent_until + '; ctudFrom=' + ctud_from + '; ctudTo=' + ctud_to + '; name=' + transport_undertaking_name + '; licence=' + community_licence_number + '; vehicle=' + vehicle_registration_number + '; handler=' + handler_personal_code + '; status=' + status + '; direction=' + direction}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/erru/ctud/log-ctud-list-view"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    filters: ${filter_summary}
    result_count: ${result_count}
    page: ${page}
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
  result: audit_result
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_ctud_list"
    headers:
      type: json
    body:
      requests: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end


