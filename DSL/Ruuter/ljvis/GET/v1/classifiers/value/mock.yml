declaration:
  description: "Arenduse mock: GET /v1/classifiers/value/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - classifierId: "1"
          classifierValueId: "101"
          classifierCode: "AMETIKOHT"
          code: "ARENDAJA"
          name: "Arendaja"
          validFrom: "2024-01-01"
          validUntil: ""
          isValid: true
          total: 1
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
