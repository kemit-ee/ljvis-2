declaration:
  description: "Arenduse mock: GET /v1/classifiers/classifier/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      items:
        - id: "1"
          code: "AMETIKOHT"
          name: "Ametikoht"
          description: "Ametikohad"
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body.items}
  next: end
