declaration:

  version: "1.0"
  description: "List of all counties (fixed set)"
  namespace: classifiers
  allowlist:
    params: []

getCountries:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ehak/list_counties"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
