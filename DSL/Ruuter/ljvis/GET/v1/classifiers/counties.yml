declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "List of all counties (fixed set)"
  namespace: classifiers
  allowlist:
    params: []

getCountries:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ehak/list_counties"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
