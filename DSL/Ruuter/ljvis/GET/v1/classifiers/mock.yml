declaration:
  description: "Arenduse mock: GET /v1/classifiers/mock tagastab etteantud näidisvastuse (päris taustasüsteemi ei kutsuta)."
  internal: false
  allowlist:
    params: []

mock_step:
  call: reflect.mock
  args:
    response:
      content:
        - id: "1"
          code: "AMETIKOHT"
          name: "Ametikoht"
          description: "Ametikohad"
        - id: "2"
          code: "STRUKTUURIUKSUS"
          name: "Struktuuriüksus"
          description: "Struktuuriüksused"
      total: 2
  result: mock_data

returnSuccess:
  return: ${mock_data.response.body}
  next: end
