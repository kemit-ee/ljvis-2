declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Get classifier values by classifier ID"
  namespace: classifiers
  allowlist:
    params:
      - field: classifierId
        type: string
        description: "Classifier ID"
      - field: search
        type: string
      - field: page
        description: "Page number"
      - field: pageSize
        description: "Items per page"
      - field: sorting
        type: string
        description: "Sort column and direction"

extractRequestData:
  assign:
    classifierId: "${incoming.params.classifierId}"
    search: "${incoming.params.search ?? ''}"
    page: "${incoming.params.page ?? 1}"
    pageSize: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'isValid desc'}"
  next: getClassifierValues

getClassifierValues:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_values"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      classifierId: ${classifierId}
      search: ${search}
      page: ${page}
      pageSize: ${pageSize}
      sorting: ${sorting}
  result: res
  next: mapResponse

mapResponse:
  assign:
    paged: "${({ content: res.response.body, total: res.response.body.length > 0 ? res.response.body[0].total : 0 })}"
  next: returnSuccess

returnSuccess:
  return: ${paged}
  next: end
