declaration:
  call: declare
  version: 0.1
  description: "Get classifier values by classifier ID"
  method: get
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    params:
      - field: classifierId
        type: string
        description: "Classifier ID"
      - field: search
        type: string
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Items per page"
      - field: sorting
        type: string
        description: "Sort column and direction"

extractRequestData:
  assign:
    classifierId: "${incoming.params.classifierId}"
    search: "${incoming.params.search ?? ''}"
    page: "${incoming.params.page ?? 1}"
    pageSize: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'isValid desc'}"
  next: getClassifierValues

getClassifierValues:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_values"
    headers:
      type: json
    body:
      classifierId: ${classifierId}
      search: ${search}
      page: ${page}
      pageSize: ${pageSize}
      sorting: ${sorting}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_classifier_value"
    headers:
      type: json
    body:
      classifierValues: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
