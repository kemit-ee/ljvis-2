declaration:

  version: "1.0"
  description: "Get all classifiers with all their values in one bulk response, for FE app-state bootstrapping (e.g. DRIVING_VIOLATION, TRANSPORT_TYPE)"
  method: get
  accepts: json
  returns: json
  namespace: classifiers

getClassifiersBundle:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifiers_bundle"
    headers:
      type: json
    body: {}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_classifiers_bundle"
    headers:
      type: json
    body:
      values: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
