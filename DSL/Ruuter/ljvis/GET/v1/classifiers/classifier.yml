declaration:

  version: "1.0"
  description: "Get a single classifier by ID"
  namespace: classifiers
  allowlist:
    params:
      - field: q
        type: string
        description: "Classifier ID"

get_user_context:
  template: "templates/check-user-authority"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: extractRequestData

extractRequestData:
  assign:
    id: "${incoming.params.q}"
    created_by: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
    actor_personal_code: "${auth_user.personalcode || ''}"
    actor_name: "${auth_user.firstname || ''} ${auth_user.lastname || ''}"
  next: getClassifier

getClassifier:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: buildAuditData

buildAuditData:
  assign:
    classifier_code: "${res.response.body[0].code || ''}"
  next: buildAuditContent

buildAuditContent:
  assign:
    description: "Klassifikaator '${classifier_code}' (ID ${id}) vaatamine"
    log_content: "{\"classifierId\":\"${id}\",\"classifierCode\":\"${classifier_code}\"}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  body:
    event_type: "classifier.view"
    event_category: "classifier_management"
    actor_name: ${actor_name}
    actor_personal_code: ${actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: audit_result
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
