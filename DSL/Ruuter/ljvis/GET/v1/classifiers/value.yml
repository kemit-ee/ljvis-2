declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Get a single classifier value by ID"
  namespace: classifiers
  allowlist:
    params:
      - field: valueId
        type: string
        description: "Classifier Value ID"

extractRequestData:
  assign:
    classifier_value_id: "${incoming.params.valueId}"
  next: getClassifierValue

getClassifierValue:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_value"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      classifier_value_id: ${classifier_value_id}
  result: res
  next: checkFound

checkFound:
  switch:
    - condition: ${res.response.body.length > 0}
      next: returnSuccess
  next: notFound

notFound:
  status: 404
  return: "Not found"
  next: end

returnSuccess:
  return: ${res.response.body[0]}
  next: end
