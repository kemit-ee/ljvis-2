declaration:

  version: "1.0"
  description: "Get audit log details by id"
  method: get
  accepts: json
  returns: json
  namespace: logs
  allowlist:
    params:
      - field: q
        type: string
        description: "Audit log id"

extractRequestData:
  assign:
    id: "${incoming.params.q}"
  next: getLog

getLog:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/get_audit_event"
    headers:
      type: json
    body:
      id: ${id}
  result: res
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
