declaration:

  version: "1.0"
  description: "Export audit logs as CSV"
  method: get
  accepts: json
  returns: json
  namespace: logs
  allowlist:
    params:
      - field: search
        type: string
        description: "Search by event type, description or actor name"
      - field: sorting
        type: string
        description: "Sorting"

extractRequestData:
  assign:
    search: "${incoming.params.search ?? ''}"
    sorting: "${incoming.params.sorting ?? 'createdAt desc'}"
  next: getLogs

getLogs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/list_logs_csv"
    headers:
      type: json
    body:
      search: ${search}
      sorting: ${sorting}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_logs_list_csv"
    headers:
      type: json
    body:
      logs: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
