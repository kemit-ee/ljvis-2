# Nõutav õigus: audit.read,audit.read.local. auth_user tuleb projektiülesest guardist (ljvis/.guard.yml).
check:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('audit.read') || auth_user.permissions.includes('audit.read.local'))}
      next: allow
  next: deny

allow:
  status: 200
  return: "ok"
  next: end

deny:
  status: 403
  return: "forbidden"
  next: end
