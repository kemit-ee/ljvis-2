declaration:
  call: declare
  version: 0.1
  description: "List all audit logs"
  method: get
  accepts: json
  returns: json
  namespace: logs
  allowlist:
    params:
      - field: search
        type: string
        description: "Search by event type, description or actor name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

extractRequestData:
  assign:
    search: "${incoming.params.search ?? ''}"
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'createdAt desc'}"
  next: getLogs

getLogs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/list_logs"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_logs_list"
    headers:
      type: json
    body:
      logs: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end
