declaration:

  version: "1.0"
  description: "List audit logs. audit.read sees all organisations; only audit.read.local restricts to the caller's own organisation."
  namespace: logs
  allowlist:
    params:
      - field: search
        type: string
        description: "Search by event type, description or actor name"
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Page size"
      - field: sorting
        type: string
        description: "Sorting"

getContext:
  # auth_user tuleb projektiülesest guardist (ljvis/.guard.yml) — eraldi autentimist ei vaja
  assign:
    auth_user: ${auth_user}
  next: checkAuditPermission

checkAuditPermission:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.includes('audit.read') || auth_user.permissions.includes('audit.read.local'))}
      next: extractRequestData
  next: returnForbidden

extractRequestData:
  assign:
    search: "${incoming.params.search ?? ''}"
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 20}"
    sorting: "${incoming.params.sorting ?? 'createdAt desc'}"
    organisation_filter: "${(auth_user.permissions != null && auth_user.permissions.includes('audit.read')) ? '' : String(auth_user.organisationid ?? '')}"
  next: getLogs

getLogs:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/list_logs"
    headers:
      type: json
    body:
      search: ${search}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
      organisation_id: ${organisation_filter}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_logs_list"
    headers:
      type: json
    body:
      logs: ${res.response.body}
  result: mapped
  next: returnSuccess

returnSuccess:
  return: ${mapped.response.body}
  next: end

returnForbidden:
  status: 403
  return: "forbidden"
  next: end
