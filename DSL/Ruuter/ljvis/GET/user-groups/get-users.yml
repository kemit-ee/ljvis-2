declaration:
  call: declare
  version: 0.1
  description: "Get users belonging to a user group"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    params:
      - field: id
        type: string
        description: "User group UUID"
      - field: search
        type: string
        description: "Search by first or last name"

extractRequestData:
  assign:
    user_group_id: "${incoming.params.id}"
    search: "${incoming.params.search ?? ''}"

getUsers:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/get_user_group_users"
    query:
      user_group_id: ${user_group_id}
      search: ${search}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group_users"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
