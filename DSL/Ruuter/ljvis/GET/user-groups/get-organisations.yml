declaration:
  call: declare
  version: 0.1
  description: "Get organisations linked to a user group"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    params:
      - field: id
        type: string
        description: "User group UUID"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('user_group.read.admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('user_group.read.local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    user_group_id: "${incoming.params.id}"

getOrganisations:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/get_user_group_organisations"
    query:
      user_group_id: ${user_group_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_group_organisations"
    headers:
      type: json
    body:
      organisations: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
