declaration:
  call: declare
  version: 0.1
  description: "List all user groups with organisations"
  method: get
  accepts: json
  returns: json
  namespace: user-groups
  allowlist:
    query:
      - field: search
        type: string
        description: "Search by group name"
      - field: organisationSearch
        type: string
        description: "Filter by organisation name"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_group_list_admin') >= 0}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('perm_user_group_list_local') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    search: "${incoming.params.search ?? ''}"
    organisation_search: "${incoming.params.organisationSearch ?? ''}"

getUserGroups:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user_group/list_user_groups"
    query:
      search: ${search}
      organisation_search: ${organisation_search}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
