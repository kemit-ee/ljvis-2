declaration:
  call: declare
  version: 0.1
  description: "Get classifier values by classifier ID"
  method: get
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    params:
      - field: classifierId
        type: string
        description: "Classifier ID"
      - field: search
        type: string
      - field: page
        type: number
        description: "Page number"
      - field: pageSize
        type: number
        description: "Items per page"
      - field: sorting
        type: string
        description: "Sort column and direction"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('classifier.read') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    classifierId: ${incoming.params.classifierId}
    search: ${incoming.params.search ?? ''}
    page: ${incoming.params.page ?? 1}
    pageSize: ${incoming.params.pageSize ?? 20}
    sorting: ${incoming.params.sorting ?? 'isValid desc'}
  next: getClassifierValues

getClassifierValues:
  call: http.get
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_values"
    query:
      classifierId: ${classifierId}
      search: ${search}
      page: ${page}
      pageSize: ${pageSize}
      sorting: ${sorting}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_classifier_value"
    headers:
      type: json
    body:
      classifierValues: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
