declaration:
  call: declare
  version: 0.1
  description: "Get a single classifier value by ID"
  method: get
  accepts: json
  returns: json
  namespace: classifiers
  allowlist:
    params:
      - field: classifierValueId
        type: string
        description: "Classifier Value ID"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && auth_user.permissions.indexOf('classifier.read') >= 0}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    classifier_value_id: ${incoming.params.classifierValueId}
  next: getClassifierValue

getClassifierValue:
  call: http.get
  args:
    url: "[#LJVIS_RESQL]/classifier/get_classifier_value"
    query:
      classifier_value_id: ${classifier_value_id}
  result: res
  next: mapResponse

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_classifier_value"
    headers:
      type: json
    body:
      classifierValues: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
