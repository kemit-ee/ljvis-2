declaration:
  call: declare
  version: 0.1
  description: "Get groups assigned to a user"
  method: get
  accepts: json
  returns: json
  namespace: users
  allowlist:
    params:
      - field: userId
        type: string
        description: "User UUID"

authenticate:
  template: "[#LJVIS_PROJECT_LAYER]/check-user-authority"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: auth_user
  next: check_permission

check_permission:
  switch:
    - condition: ${auth_user.permissions != null && (auth_user.permissions.indexOf('user.read.admin') >= 0 || auth_user.permissions.indexOf('user.edit.admin') >= 0)}
      next: extractRequestData
    - condition: ${auth_user.permissions != null && (auth_user.permissions.indexOf('user.read.local') >= 0 || auth_user.permissions.indexOf('user.edit.local') >= 0)}
      next: extractRequestData
  next: return_forbidden

extractRequestData:
  assign:
    user_id: "${incoming.params.userId}"

getUserGroups:
  call: http.get
  args:
    url: "[#LJVIS_RESQL]/user/get_user_groups"
    query:
      user_id: ${user_id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user_assigned_groups"
    headers:
      type: json
    body:
      groups: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end

return_forbidden:
  status: 403
  return: "insufficient permissions"
  next: end
