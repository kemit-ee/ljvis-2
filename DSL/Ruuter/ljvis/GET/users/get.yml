declaration:
  call: declare
  version: 0.1
  description: "Get a single user by ID"
  method: get
  accepts: json
  returns: json
  namespace: users
  allowlist:
    params:
      - field: id
        type: string
        description: "User UUID"

extractRequestData:
  assign:
    id: "${incoming.params.id}"

getUser:
  call: http.get
  args:
    url: "[#LJVIS_USERS_RESQL]/user/get_user"
    query:
      id: ${id}
  result: res

mapResponse:
  call: http.post
  args:
    url: "[#LJVIS_DMAPPER_HBS]/map_user"
    headers:
      type: json
    body:
      users: ${res.response.body}
  result: mapped

returnSuccess:
  return: ${mapped.response.body}
  next: end
