  next: end

returnInspectionDatetimeRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"inspectionDatetime","code":"required"}'
  next: end

returnInspectionAuthorityRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"inspectionAuthorityOrName","code":"required"}'
  next: end

returnInspectionAuthorityMaxLengthError:
  return: '{"type":"VALIDATION_ERROR","field":"inspectionAuthorityOrName","code":"max_length_exceeded"}'
  next: end

returnInspectionPassedRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"inspectionPassed","code":"required"}'
  next: end

returnPtiRequestedRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"ptiRequested","code":"required"}'
  next: end

