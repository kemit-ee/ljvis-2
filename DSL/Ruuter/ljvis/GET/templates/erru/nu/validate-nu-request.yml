declaration:
  internal: false
  version: "1.0"
  description: "Validate required NU fields and ERRU length limits before saving or sending."
  namespace: service
  allowlist:

# Shared Ruuter/Ruuter.internal rules: erru.nu_validate (docs/integrations/erru-nu-exchange.md).
validate:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/validate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
    body:
      payload: "${JSON.stringify(incoming.body)}"
      kind: "outgoing"
  result: validation
  next: returnResult

returnResult:
  return: "${JSON.stringify(JSON.parse(validation.response.body[0].result))}"
  next: end
