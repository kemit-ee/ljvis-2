declaration:
  version: "1.0"
  description: "Validate required NU fields and ERRU length limits before saving or sending."
  namespace: service
  allowlist:
    body:
      - field: nuTo
        type: string
      - field: originatingAuthority
        type: string
      - field: requestSource
        type: string
      - field: requestPurpose
        type: string
      - field: unfitStartDate
        type: string
      - field: tmFirstName
        type: string
      - field: tmFamilyName
        type: string
      - field: tmPlaceOfBirth
        type: string
      - field: certificateNumber
        type: string
      - field: certificateIssueCountry
        type: string
      - field: tmDateOfBirth
        type: string
      - field: certificateIssueDate
        type: string

# Shared Ruuter/Ruuter.internal rules: erru.nu_validate (docs/integrations/erru-nu-exchange.md).
validate:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/validate"
    body:
      payload: "${JSON.stringify(incoming.body)}"
      kind: "outgoing"
  result: validation
  next: returnResult

returnResult:
  return: "${JSON.stringify(JSON.parse(validation.response.body[0].result))}"
  next: end
