declaration:

  version: "1.0"
  description: "Audit: user update event (accepts pre-built description and log_content)"
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: description
        type: string
      - field: log_content
        type: string

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "user.update"
    event_category: "user_management"
    description: ${incoming.body.description}
    log_content: ${incoming.body.log_content}
  result: res
  next: end
