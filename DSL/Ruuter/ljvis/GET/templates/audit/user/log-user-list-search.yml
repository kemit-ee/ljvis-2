declaration:

  version: "1.0"
  description: "Audit: user list search event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: search
        type: string
      - field: result_count
        type: number
      - field: scope
        type: string
      - field: organisation_id
        type: string

buildAudit:
  assign:
    description: "Otsing '${incoming.body.search}'"
    log_content: "{\"searchTerm\":\"${incoming.body.search}\",\"resultCount\":${incoming.body.result_count},\"scope\":\"${incoming.body.scope}\",\"organisationId\":${incoming.body.organisation_id}}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "user.list.search"
    event_category: "user_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
