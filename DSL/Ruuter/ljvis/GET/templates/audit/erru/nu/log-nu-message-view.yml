declaration:
  version: "1.0"
  description: "NU log nu message view."
  namespace: service
  strict: true
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: direction
        type: string
      - field: status
        type: string
      - field: snapshot_id
        type: string
      - field: snapshot_version
        type: string

buildAudit:
  assign:
    description: "NU sobimatusteate vaatamine: juhtumi number ${incoming.body.business_case_id || '-'}, suund ${incoming.body.direction || '-'}, staatus ${incoming.body.status || '-'}, versioon ${incoming.body.snapshot_version || '-'}, vaataja ${session_personal_code || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['direction', incoming.body.direction || null], ['status', incoming.body.status || null], ['snapshotId', incoming.body.snapshot_id || null], ['version', incoming.body.snapshot_version || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "nu.message.view"
    event_category: "erru_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
