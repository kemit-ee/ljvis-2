declaration:
  version: "1.0"
  description: "NU log nu list view."
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: filters
        type: string
      - field: result_count
        type: string
      - field: page
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "NU sobimatusteadete loendi vaatamine: filtrid ${incoming.body.filters || '-'}, kuvatud teateid ${incoming.body.result_count || '0'}, lehekülg ${incoming.body.page || '1'}"
    log_content: "${JSON.stringify(Object.fromEntries([['filters', incoming.body.filters || null], ['resultCount', incoming.body.result_count || '0'], ['page', incoming.body.page || '1']]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "nu.list.view"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
