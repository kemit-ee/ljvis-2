declaration:
  internal: false
  version: "1.0"
  description: "Audit: CGR request draft saved (LJVIS2-138). Logged on every draft save — initial create, revision, and creation-as-copy ('Kopeeri päring', LJVIS2-140). The description carries the request identifier, the source request identifier when created as a copy, the list of changed fields and the resulting status."
  namespace: service
  strict: true
  allowlist:
    headers:
      - field: cookie
        type: string
      - field: content-type
        type: string
    body:
      - field: business_case_id
        type: string
      - field: source_business_case_id
        type: string
      - field: changed_fields
        type: string
      - field: status
        type: string
      - field: version
        type: string

buildAudit:
  assign:
    description: "CGR mainepäringu mustandi salvestamine: päring ${incoming.body.business_case_id || '-'}, lähtepäring ${incoming.body.source_business_case_id || '-'}, muudetud väljad ${incoming.body.changed_fields || '-'}, staatus ${incoming.body.status || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['sourceBusinessCaseId', incoming.body.source_business_case_id || null], ['changedFields', incoming.body.changed_fields || null], ['status', incoming.body.status || null], ['version', incoming.body.version || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "cgr.request.save"
    event_category: "erru_message_exchange"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
