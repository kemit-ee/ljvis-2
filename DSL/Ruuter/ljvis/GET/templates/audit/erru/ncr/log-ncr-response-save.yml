declaration:
  version: "1.0"
  description: "Audit: NCR response draft to an incoming message saved (LJVIS2-63). Logged on
    every response draft save. Description carries the case identifier, changed fields and the
    resulting status."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: changed_fields
        type: string
      - field: status
        type: string
      - field: version
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "NCR vastuse mustandi salvestamine: juhtum ${incoming.body.business_case_id || '-'}, muudetud väljad ${incoming.body.changed_fields || '-'}, staatus ${incoming.body.status || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['changedFields', incoming.body.changed_fields || null], ['status', incoming.body.status || null], ['version', incoming.body.version || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "ncr.response.save"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
