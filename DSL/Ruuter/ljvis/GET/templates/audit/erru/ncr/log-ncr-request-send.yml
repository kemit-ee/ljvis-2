declaration:
  version: "1.0"
  description: "Audit: outgoing NCR request send attempt (LJVIS2-64 §4.2). Logged on every
    send attempt, whether it results in acknowledged or error."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: ncr_to
        type: string
      - field: result_status
        type: string
      - field: ack_status_code
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "NCR päringu saatmine: juhtum ${incoming.body.business_case_id || '-'}, sihtriik ${incoming.body.ncr_to || '-'}, tulemus ${incoming.body.result_status || '-'}, kinnituse kood ${incoming.body.ack_status_code || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['ncrTo', incoming.body.ncr_to || null], ['resultStatus', incoming.body.result_status || null], ['ackStatusCode', incoming.body.ack_status_code || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "ncr.request.send"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
