declaration:
  internal: false
  version: "1.0"
  description: "Audit: NCR case viewed (LJVIS2-63). Logged on EVERY case open because the case
    shows transport undertaking and handler personal data. Description carries the case
    identifier, the number of snapshots shown and the acting handler's personal code."
  namespace: service
  strict: true
  allowlist:
    headers:
      - field: cookie
        type: string
      - field: content-type
        type: string
    body:
      - field: business_case_id
        type: string
      - field: message_count
        type: string

buildAudit:
  assign:
    description: "NCR juhtumi vaatamine: juhtum ${incoming.body.business_case_id || '-'}, kuvatud teated ${incoming.body.message_count || '0'}, menetleja isikukood ${session_personal_code || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['messageCount', incoming.body.message_count || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "ncr.case.view"
    event_category: "erru_message_exchange"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
