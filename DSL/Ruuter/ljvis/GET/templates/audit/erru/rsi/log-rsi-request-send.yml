declaration:
  version: "1.0"
  description: "Audit: RSI notification sent or failed to the ERRU hub (LJVIS2-148). Logged on every send attempt, successful (sent) or not (error). The description carries the business case identifier, the target member state, the result status, and the inspected vehicle registration number, making the event traceable. Unlike CGR, RSI does not carry personal name data in the send path — the vehicle registration number is the primary identifying field."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: business_case_id
        type: string
      - field: rsi_to
        type: string
      - field: result_status
        type: string
      - field: vehicle_registration_number
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "RSI teavituse saatmine: päringu tunnus ${incoming.body.business_case_id || '-'}, sihtriik ${incoming.body.rsi_to || '-'}, tulemus ${incoming.body.result_status || '-'}, sőiduk ${incoming.body.vehicle_registration_number || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['businessCaseId', incoming.body.business_case_id || null], ['rsiTo', incoming.body.rsi_to || null], ['resultStatus', incoming.body.result_status || null], ['vehicleRegistrationNumber', incoming.body.vehicle_registration_number || null]]))}"
  next: writeAudit

writeAudit:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "rsi.request.send"
    event_category: "erru_message_exchange"
    actor_name: ${incoming.body.actor_name || ''}
    actor_personal_code: ${incoming.body.actor_personal_code || ''}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
