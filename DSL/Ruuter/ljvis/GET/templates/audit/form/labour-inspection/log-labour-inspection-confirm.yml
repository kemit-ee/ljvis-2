declaration:

  version: "1.0"
  description: "Audit: labour inspection form (labour_inspection_form) confirm event."
  namespace: service
  strict: true
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: akti_voti
        type: string
      - field: form_number
        type: string
      - field: version
        type: string
      - field: isikukood
        type: string

buildAudit:
  assign:
    description: "Kinnitati tööinspektsiooni kontrollakt ${incoming.body.form_number}, karistatud isikukood: ${incoming.body.isikukood || '-'}"
    log_content: "${JSON.stringify(Object.fromEntries([['aktiVoti', incoming.body.akti_voti || null], ['vormiNumber', incoming.body.vormi_number || null], ['karistatudIsikukood', incoming.body.isikukood || null]]))}"

  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.labour_inspection.confirm"
    event_category: "control_form_management"
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
