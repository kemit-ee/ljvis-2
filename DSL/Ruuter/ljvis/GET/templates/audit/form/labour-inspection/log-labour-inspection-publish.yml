declaration:

  version: "1.0"
  description: "Audit: labour inspection form (labour_inspection_form) publish event."
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: akti_voti
        type: string
      - field: form_number
        type: string
      - field: version
        type: string
      - field: isikukood
        type: string
      - field: old_status
        type: string
      - field: new_status
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string

buildAudit:
  assign:
    description: "Avalikustati tööinspektsiooni kontrollakt ${incoming.body.form_number}, karistatud isikukood: ${incoming.body.isikukood || '-'}, olek: ${incoming.body.old_status} → ${incoming.body.new_status}"
    log_content: "${JSON.stringify(Object.fromEntries([['aktiVoti', incoming.body.akti_voti || null], ['vormiNumber', incoming.body.form_number || null], ['karistatudIsikukood', incoming.body.isikukood || null], ['oldStatus', incoming.body.old_status || null], ['newStatus', incoming.body.new_status || null]]))}"

  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.labour_inspection.publish"
    event_category: "control_form_management"
    actor_name: ${incoming.body.actor_name}
    actor_personal_code: ${incoming.body.actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
