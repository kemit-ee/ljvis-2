declaration:

  version: "1.0"
  description: "Audit: good repute form update event"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
    body:
      - field: good_repute_form_key
        type: number
      - field: personal_code
        type: string
      - field: actor_name
        type: string
      - field: actor_personal_code
        type: string
      - field: changed_fields
        type: string

buildAudit:
  assign:
    changed_fields_json: ${JSON.stringify(incoming.body.changed_fields)}
  next: buildAuditStrings

buildAuditStrings:
  assign:
    description: "Muudeti hea maine vormi, vormi võti: ${incoming.body.good_repute_form_key}, isikukood: ${incoming.body.personal_code}, muudetud väljad: ${changed_fields_json}"
    log_content: "{\"goodReputeFormKey\":\"${incoming.body.good_repute_form_key}\",\"personalCode\":\"${incoming.body.personal_code}\",\"changedFields\":${changed_fields_json}}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.good_repute_form.update"
    event_category: "control_form"
    actor_name: ${incoming.body.actor_name}
    actor_personal_code: ${incoming.body.actor_personal_code}
    description: ${description}
    log_content: ${log_content}
  result: res
  next: end
