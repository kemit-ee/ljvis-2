declaration:

  version: "1.0"
  description: "Get presigned download URL for a file attachment. Expects: id"
  namespace: templates
  strict: true
  allowlist:
    body:
      - field: id
        type: string
      - field: form_type
        type: string
      - field: form_number_prefix
        type: string
      - field: attachment_form_type
        type: string
      - field: access_form_type
        type: string

getAttachmentRecord:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/files/get_form_attachment_by_id"
    headers:
      type: json
    body:
      id: ${incoming.body.id}
      form_number_prefix: ${incoming.body.form_number_prefix}
      attachment_form_type: ${incoming.body.attachment_form_type || ""}
  result: dbResult
  next: checkRecordExists

checkRecordExists:
  switch:
    - condition: ${dbResult.response.body.length === 0}
      next: returnNotFound
  next: checkReadAccess

returnNotFound:
  status: 404
  return: '{"error": "File not found or has been deleted"}'
  next: end

# Omand (epic #502 A2 read): manuse allalaadimine järgib vormi lugemisreeglit. `access_form_type` on
# wrapperi konstant; vormi number tuleb manuse kirjest (mitte kliendilt). Keeld = tekst `FORBIDDEN`,
# mille wrapper teeb 403-ks (staatus ei ületa `template:` kutset).
checkReadAccess:
  template: "templates/form/check-read-access"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: ${incoming.body.access_form_type || ""}
    form_key: ""
    form_number: ${dbResult.response.body[0].formNumber || dbResult.response.body[0].form_number}
  result: readAccess
  next: evalReadAccess

evalReadAccess:
  switch:
    - condition: ${readAccess == "allow"}
      next: getPresignedUrl
  next: returnForbidden

returnForbidden:
  return: "FORBIDDEN"
  status: 403
  next: end

getPresignedUrl:
  call: http.get
  args:
    url: "[#S3_PROXY]/presign"
    headers:
      Authorization: "Bearer [#S3_PROXY_API_KEY]"
      type: json
    query:
      key: ${dbResult.response.body[0].s3Key || dbResult.response.body[0].s3_key}
  result: presignResult
  next: checkPresignResult

checkPresignResult:
  switch:
    - condition: ${presignResult.response.status >= 400}
      next: returnPresignError
  next: logAuditEvent

returnPresignError:
  status: ${presignResult.response.status}
  return: ${presignResult.response.body}
  next: end

logAuditEvent:
  template: "templates/audit/form/files/log-file-download"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: ${incoming.body.form_type}
    form_number: ${dbResult.response.body[0].formNumber || dbResult.response.body[0].form_number}
    file_id: ${incoming.body.id}
    file_name: ${dbResult.response.body[0].fileName || dbResult.response.body[0].file_name}
  result: auditResult
  next: returnSuccess

returnSuccess:
  return: ${presignResult.response.body}
  status: 200
