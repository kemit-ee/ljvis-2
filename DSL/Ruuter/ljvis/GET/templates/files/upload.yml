declaration:

  version: "1.0"
  description: "Upload a file to S3 and record it in the DB. Expects: form_type, form_number_prefix, form_number, file_name, file_base64, mimetype. The actor is the TARA session (guard variable session_personal_code), never the request body"
  namespace: templates
  strict: true
  allowlist:
    body:
      - field: form_type
        type: string
      - field: form_number_prefix
        type: string
      - field: form_number
        type: string
      - field: file_name
        type: string
      - field: file_base64
        type: string
      - field: mimetype
        type: string

# Omand: vormi tüüp (ja seega prefiks) on serveri teada konstant (wrapper), `form_number` on kliendi
# sisend. Ilma kontrollita saaks kasutaja lisada manuse teise vormitüübi numbri alla või (`..`, `/`)
# kirjutada S3-s teise kaustapuusse. Kontroll enne S3 kirjutamist; Resql kordab sama kontrolli.
checkFormNumber:
  switch:
    - condition: ${incoming.body.form_number_prefix == null || incoming.body.form_number_prefix === '' || incoming.body.form_number == null || !String(incoming.body.form_number).startsWith(incoming.body.form_number_prefix) || !/^[A-Za-z0-9-]+$/.test(String(incoming.body.form_number))}
      next: returnInvalidFormNumber
  next: buildS3Folder

returnInvalidFormNumber:
  status: 400
  return: '{"error": "INVALID_FORM_NUMBER"}'
  next: end

buildS3Folder:
  assign:
    s3_folder: ${incoming.body.form_type + "/" + incoming.body.form_number}
  next: uploadToS3

uploadToS3:
  call: http.post
  args:
    url: "[#S3_PROXY]/upload"
    headers:
      Authorization: "Bearer [#S3_PROXY_API_KEY]"
      type: json
    body:
      key_folder: ${s3_folder}
      file_name: ${incoming.body.file_name}
      content_base64: ${incoming.body.file_base64}
      content_type: ${incoming.body.mimetype}
  result: s3Result
  next: checkS3Result

checkS3Result:
  switch:
    - condition: ${s3Result.response.status >= 400}
      next: returnS3Error
  next: insertFileToDB

returnS3Error:
  status: ${s3Result.response.status}
  return: ${s3Result.response.body}
  next: end

insertFileToDB:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/files/insert_form_attachment"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      form_number: ${incoming.body.form_number}
      form_number_prefix: ${incoming.body.form_number_prefix}
      file_name: ${incoming.body.file_name}
      s3_key: ${s3Result.response.body.key}
      created_by: ${session_personal_code}
  result: dbResult
  next: checkInsert

checkInsert:
  switch:
    - condition: ${dbResult.response.body == null || dbResult.response.body.length === 0}
      next: returnInvalidFormNumber
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/files/log-file-upload"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: ${incoming.body.form_type}
    form_number: ${incoming.body.form_number}
    file_name: ${incoming.body.file_name}
    s3_key: ${s3Result.response.body.key}
  result: auditResult
  next: returnSuccess

returnSuccess:
  return: ${dbResult.response.body}
  status: 200
