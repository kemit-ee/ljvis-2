declaration:
  internal: false

  version: "1.0"
  description: "Soft-delete a file attachment record in the DB (appends a status=deleted tombstone row; the active row is kept). Expects: id, form_type. The actor is the TARA session (guard variable session_personal_code), never the request body"
  namespace: templates
  strict: true
  allowlist:
    body:
      - field: id
        type: string
      - field: form_type
        type: string
      - field: form_number_prefix
        type: string
      - field: attachment_form_type
        type: string
    headers:
      - field: cookie
        type: string
      - field: content-type
        type: string

getAttachmentRecord:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/files/get_form_attachment_by_id"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${incoming.body.id}
      form_number_prefix: ${incoming.body.form_number_prefix}
      attachment_form_type: ${incoming.body.attachment_form_type || ""}
  result: attachmentRecord
  next: checkAttachmentInScope

checkAttachmentInScope:
  switch:
    - condition: ${attachmentRecord.response.body == null || attachmentRecord.response.body.length === 0}
      next: returnNotFound
  next: deleteFileInDB

returnNotFound:
  status: 404
  return: '{"error": "File not found or has been deleted"}'
  next: end

deleteFileInDB:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/files/delete_form_attachment"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${incoming.body.id}
      form_number_prefix: ${incoming.body.form_number_prefix}
      attachment_form_type: ${incoming.body.attachment_form_type || ""}
      created_by: ${session_personal_code}
  result: dbResult
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/form/files/log-file-delete"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    form_type: ${incoming.body.form_type}
    form_number: ${attachmentRecord.response.body[0].formNumber || attachmentRecord.response.body[0].form_number}
    file_id: ${incoming.body.id}
    file_name: ${attachmentRecord.response.body[0].fileName || attachmentRecord.response.body[0].file_name}
  result: auditResult
  next: returnSuccess

returnSuccess:
  return: ${dbResult.response.body}
  status: 200
