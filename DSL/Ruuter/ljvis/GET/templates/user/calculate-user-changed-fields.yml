declaration:

  version: "1.0"
  description: "Calculate changed fields for user including SQL lookup"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: user_account_id
        type: string
      - field: first_name
        type: string
      - field: last_name
        type: string
      - field: organisation_id
        type: string
      - field: structural_unit_name
        type: string
      - field: job_title_name
        type: string
      - field: email
        type: string
      - field: phone
        type: string
      - field: access_start
        type: string
      - field: access_end
        type: string

getUser:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user"
    headers:
      type: json
    body:
      id: ${incoming.body.user_account_id}
      organisation_id: ""
  result: res
  next: buildAuditData

buildAuditData:
  assign:
    old_first_name: "${res.response.body[0].firstName || ''}"
    old_last_name: "${res.response.body[0].lastName || ''}"
    old_organisation_id: "${res.response.body[0].organisationId || ''}"
    old_structural_unit: "${res.response.body[0].structuralUnit || ''}"
    old_job_title: "${res.response.body[0].jobTitle || ''}"
    old_email: "${res.response.body[0].email || ''}"
    old_phone: "${res.response.body[0].phone || ''}"
    old_access_start: "${res.response.body[0].accessStart || ''}"
    old_access_end: "${res.response.body[0].accessEnd || ''}"
    new_first_name: ${incoming.body.first_name}
    new_last_name: ${incoming.body.last_name}
    new_personal_code: ${incoming.body.personalCode}
    new_organisation_id: ${incoming.body.organisation_id}
    new_structural_unit: ${incoming.body.structural_unit_name}
    new_job_title: ${incoming.body.job_title_name}
    new_email: ${incoming.body.email}
    new_phone: ${incoming.body.phone}
    new_access_start: ${incoming.body.access_start}
    new_access_end: ${incoming.body.access_end}
    changed_fields: "[]"
  next: calculateChangeFlags

calculateChangeFlags:
  assign:
    first_name_changed: ${new_first_name != old_first_name}
    last_name_changed: ${new_last_name != old_last_name}
    organisation_id_changed: ${new_organisation_id != old_organisation_id}
    structural_unit_changed: ${new_structural_unit != old_structural_unit}
    job_title_changed: ${new_job_title != old_job_title}
    email_changed: ${new_email != old_email}
    phone_changed: ${new_phone != old_phone}
    access_start_changed: ${new_access_start != old_access_start}
    access_end_changed: ${new_access_end != old_access_end}
  next: checkFirstName

checkFirstName:
  switch:
    - condition: ${first_name_changed}
      next: addFirstName
  next: checkLastName

addFirstName:
  assign:
    changed_fields: "[\"first_name\"]"
  next: checkLastName

checkLastName:
  switch:
    - condition: ${last_name_changed}
      next: addLastName
  next: checkOrganisationId

addLastName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"last_name\"]" : "[\"last_name\"]"}'
  next: checkOrganisationId

checkOrganisationId:
  switch:
    - condition: ${organisation_id_changed}
      next: addOrganisationId
  next: checkStructuralUnit

addOrganisationId:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"organisation_id\"]" : "[\"organisation_id\"]"}'
  next: checkStructuralUnit

checkStructuralUnit:
  switch:
    - condition: ${structural_unit_changed}
      next: addStructuralUnit
  next: checkJobTitle

addStructuralUnit:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"structural_unit\"]" : "[\"structural_unit\"]"}'
  next: checkJobTitle

checkJobTitle:
  switch:
    - condition: ${job_title_changed}
      next: addJobTitle
  next: checkEmail

addJobTitle:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"job_title\"]" : "[\"job_title\"]"}'
  next: checkEmail

checkEmail:
  switch:
    - condition: ${email_changed}
      next: addEmail
  next: checkPhone

addEmail:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"email\"]" : "[\"email\"]"}'
  next: checkPhone

checkPhone:
  switch:
    - condition: ${phone_changed}
      next: addPhone
  next: checkAccessStart

addPhone:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"phone\"]" : "[\"phone\"]"}'
  next: checkAccessStart

checkAccessStart:
  switch:
    - condition: ${access_start_changed}
      next: addAccessStart
  next: checkAccessEnd

addAccessStart:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"access_start\"]" : "[\"access_start\"]"}'
  next: checkAccessEnd

checkAccessEnd:
  switch:
    - condition: ${access_end_changed}
      next: addAccessEnd
  next: returnResult

addAccessEnd:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"access_end\"]" : "[\"access_end\"]"}'
  next: returnResult

returnResult:
  return: "{\"changed_fields\":${changed_fields},\"old_organisation_id\":\"${old_organisation_id}\"}"
  next: end
