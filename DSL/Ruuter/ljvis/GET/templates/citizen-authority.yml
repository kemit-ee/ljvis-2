declaration:

  version: "1.0"
  description: "Validate JWT cookie via TIM and return citizen representation claims (personalCode/activeRole/activeRegistryCode/representedCompanies) — no users.user_account lookup, unlike templates/check-user-authority."
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

check_for_cookie:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.cookie == null}
      next: return_unauthorized
  next: get_userinfo

get_userinfo:
  call: http.get
  args:
    url: "[#LJVIS_TIM]/jwt/userinfo"
    headers:
      cookie: ${incoming.headers.cookie}
  result: userinfo_res
  next: check_userinfo

check_userinfo:
  switch:
    - condition: "${userinfo_res.response.status < 200 || userinfo_res.response.status >= 300}"
      next: return_unauthorized
  next: extract_claims

extract_claims:
  assign:
    personal_code: "${userinfo_res.response.body.userinfo?.claims?.personalCode ?? userinfo_res.response.body.userinfo?.subject ?? ''}"
    active_role: "${userinfo_res.response.body.userinfo?.claims?.activeRole ?? 'citizen-self'}"
    active_registry_code: "${userinfo_res.response.body.userinfo?.claims?.activeRegistryCode ?? null}"
    represented_companies: "${userinfo_res.response.body.userinfo?.claims?.representedCompanies ?? []}"
  next: check_personal_code

check_personal_code:
  switch:
    - condition: "${!personal_code}"
      next: return_unauthorized
  next: return_authority_result

return_authority_result:
  return: >-
    ${({
      personalCode: personal_code,
      activeRole: active_role,
      activeRegistryCode: active_registry_code,
      representedCompanies: represented_companies
    })}
  next: end

return_unauthorized:
  status: 403
  return: "false"
  next: end
