    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"vehicle_reg_nr\"]" : "[\"vehicle_reg_nr\"]"}'
  next: checkVehicleMake

checkVehicleMake:
  switch:
    - condition: ${vehicle_make_changed}
      next: addVehicleMake
  next: checkVehicleModel

