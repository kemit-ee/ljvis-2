  next: checkCompanyActivityLicenceCopyNumber

checkCompanyActivityLicenceCopyNumber:
  switch:
    - condition: ${company_activity_licence_copy_number_changed}
      next: addCompanyActivityLicenceCopyNumber
  next: checkInspectorFirstName

addCompanyActivityLicenceCopyNumber:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"company_activity_licence_copy_number\"]" : "[\"company_activity_licence_copy_number\"]"}'
  next: checkInspectorFirstName

checkInspectorFirstName:
  switch:
    - condition: ${inspector_first_name_changed}
      next: addInspectorFirstName
  next: checkInspectorLastName

addInspectorFirstName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_first_name\"]" : "[\"inspector_first_name\"]"}'
  next: checkInspectorLastName

checkInspectorLastName:
  switch:
    - condition: ${inspector_last_name_changed}
      next: addInspectorLastName
  next: checkInspectorOrganisationId

addInspectorLastName:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_last_name\"]" : "[\"inspector_last_name\"]"}'
  next: checkInspectorOrganisationId

checkInspectorOrganisationId:
  switch:
    - condition: ${inspector_organisation_id_changed}
      next: addInspectorOrganisationId
  next: checkInspectorUnit

addInspectorOrganisationId:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_organisation_id\"]" : "[\"inspector_organisation_id\"]"}'
  next: checkInspectorUnit

checkInspectorUnit:
  switch:
    - condition: ${inspector_unit_changed}
      next: addInspectorUnit
  next: checkInspectorProfession

addInspectorUnit:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_unit\"]" : "[\"inspector_unit\"]"}'
  next: checkInspectorProfession

checkInspectorProfession:
  switch:
    - condition: ${inspector_profession_changed}
      next: addInspectorProfession
  next: returnResult

addInspectorProfession:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"inspector_profession\"]" : "[\"inspector_profession\"]"}'
  next: returnResult

returnResult:
  return: "{\"changed_fields\":${changed_fields}}"
  next: end
