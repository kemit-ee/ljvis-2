checkVehicleCountryCode:
  switch:
    - condition: ${vehicle_country_code_changed}
      next: addVehicleCountryCode
  next: checkVehicleVin

addVehicleCountryCode:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"vehicle_country_code\"]" : "[\"vehicle_country_code\"]"}'
  next: checkVehicleVin

checkVehicleVin:
