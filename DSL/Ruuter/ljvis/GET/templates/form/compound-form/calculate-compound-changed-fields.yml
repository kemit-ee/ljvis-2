  next: checkRoad

checkRoad:
  switch:
    - condition: ${road_changed}
      next: addRoad
  next: checkRoadOther

addRoad:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"road\"]" : "[\"road\"]"}'
  next: checkRoadOther

checkRoadOther:
  switch:
    - condition: ${road_other_changed}
      next: addRoadOther
  next: checkKilometer

addRoadOther:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"road_other\"]" : "[\"road_other\"]"}'
  next: checkKilometer

checkKilometer:
  switch:
    - condition: ${kilometer_changed}
      next: addKilometer
  next: checkAddress

addKilometer:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"kilometer\"]" : "[\"kilometer\"]"}'
  next: checkAddress

checkAddress:
  switch:
    - condition: ${address_changed}
      next: addAddress
  next: checkRoadType

addAddress:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"address\"]" : "[\"address\"]"}'
  next: checkRoadType

checkRoadType:
  switch:
    - condition: ${road_type_changed}
      next: addRoadType
  next: checkRoadTaxStatus

addRoadType:
  assign:
