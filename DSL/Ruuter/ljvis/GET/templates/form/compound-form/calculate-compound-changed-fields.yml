declaration:

  version: "1.0"
  description: "Calculate changed fields for compound form including SQL lookup"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: form_id
        type: string
      - field: control_date
        type: string
      - field: control_time
        type: string
      - field: control_country_code
        type: string
      - field: county
        type: string
      - field: city
        type: string
      - field: road
        type: string
      - field: road_other
        type: string
      - field: kilometer
        type: string
      - field: address
        type: string
      - field: road_type
        type: string
      - field: road_tax_status
        type: string
      - field: road_tax_notes
        type: string
      - field: vehicle_reg_nr
        type: string
      - field: vehicle_make
        type: string
      - field: vehicle_model
        type: string
      - field: vehicle_country_code
        type: string
      - field: vehicle_vin
        type: string
      - field: vehicle_first_registration
        type: string
      - field: vehicle_body_type
        type: string
      - field: vehicle_category_code
        type: string
      - field: vehicle_category_other
        type: string
      - field: vehicle_mileage
        type: string
      - field: trailers
        type: string
      - field: drivers
        type: string
      - field: company_reg_code
        type: string
      - field: company_name
        type: string
      - field: company_country_code
        type: string
      - field: company_county
        type: string
      - field: company_city
        type: string
      - field: company_address_line1
        type: string
      - field: company_postal_code
        type: string
      - field: company_owner_first_name
        type: string
      - field: company_owner_last_name
        type: string
      - field: company_activity_licence_copy_number
        type: string
      - field: inspector_first_name
        type: string
      - field: inspector_last_name
        type: string
      - field: inspector_organisation_id
        type: string
      - field: inspector_unit
        type: string
      - field: inspector_profession
        type: string

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${incoming.body.form_id}
  result: res
  next: debugDrivers

debugDrivers:
  assign:
    debug_old_drivers: "${res.response.body[0].drivers || 'NULL'}"
    debug_new_drivers: "${incoming.body.drivers || 'NULL'}"
    debug_old_trailers: "${res.response.body[0].trailers || 'NULL'}"
    debug_new_trailers: "${incoming.body.trailers || 'NULL'}"
  next: buildAuditData

buildAuditData:
  assign:
    old_control_date: "${res.response.body[0].controlDate || ''}"
    old_control_time: "${res.response.body[0].controlTime || ''}"
    old_control_country_code: "${res.response.body[0].controlCountryCode || ''}"
    old_county: "${res.response.body[0].county || ''}"
    old_city: "${res.response.body[0].city || ''}"
    old_road: "${res.response.body[0].road || ''}"
    old_road_other: "${res.response.body[0].roadOther || ''}"
    old_kilometer: "${res.response.body[0].kilometer || ''}"
    old_address: "${res.response.body[0].address || ''}"
    old_road_type: "${res.response.body[0].roadType || ''}"
    old_road_tax_status: "${res.response.body[0].roadTaxStatus || ''}"
    old_road_tax_notes: "${res.response.body[0].roadTaxNotes || ''}"
    old_vehicle_reg_nr: "${res.response.body[0].vehicleRegNr || ''}"
    old_vehicle_make: "${res.response.body[0].vehicleMake || ''}"
    old_vehicle_model: "${res.response.body[0].vehicleModel || ''}"
    old_vehicle_country_code: "${res.response.body[0].vehicleCountryCode || ''}"
    old_vehicle_vin: "${res.response.body[0].vehicleVin || ''}"
    old_vehicle_first_registration: "${res.response.body[0].vehicleFirstRegistration || ''}"
    old_vehicle_body_type: "${res.response.body[0].vehicleBodyType || ''}"
    old_vehicle_category_code: "${res.response.body[0].vehicleCategoryCode || ''}"
    old_vehicle_category_other: "${res.response.body[0].vehicleCategoryOther || ''}"
    old_vehicle_mileage: "${res.response.body[0].vehicleMileage || ''}"
    old_trailers: ${JSON.stringify(JSON.parse(res.response.body[0].trailers || '[]'))}
    old_drivers: ${JSON.stringify(JSON.parse(res.response.body[0].drivers || '[]'))}
    old_company_reg_code: "${res.response.body[0].companyRegCode || ''}"
    old_company_name: "${res.response.body[0].companyName || ''}"
    old_company_country_code: "${res.response.body[0].companyCountryCode || ''}"
    old_company_county: "${res.response.body[0].companyCounty || ''}"
    old_company_city: "${res.response.body[0].companyCity || ''}"
    old_company_address_line1: "${res.response.body[0].companyAddress || ''}"
    old_company_postal_code: "${res.response.body[0].companyPostalCode || ''}"
    old_company_owner_first_name: "${res.response.body[0].companyOwnerFirstName || ''}"
    old_company_owner_last_name: "${res.response.body[0].companyOwnerLastName || ''}"
    old_company_activity_licence_copy_number: "${res.response.body[0].companyActivityLicenceCopyNumber || ''}"
    old_inspector_first_name: "${res.response.body[0].inspectorFirstName || ''}"
    old_inspector_last_name: "${res.response.body[0].inspectorLastName || ''}"
    old_inspector_organisation_id: "${res.response.body[0].inspectorOrganisationId || ''}"
    old_inspector_unit: "${res.response.body[0].inspectorUnit || ''}"
    old_inspector_profession: "${res.response.body[0].inspectorProfession || ''}"
    new_control_date: ${incoming.body.control_date}
    new_control_time: ${incoming.body.control_time}
    new_control_country_code: ${incoming.body.control_country_code}
    new_county: ${incoming.body.county}
    new_city: ${incoming.body.city}
    new_road: ${incoming.body.road}
    new_road_other: ${incoming.body.road_other}
    new_kilometer: ${incoming.body.kilometer}
    new_address: ${incoming.body.address}
    new_road_type: ${incoming.body.road_type}
    new_road_tax_status: ${incoming.body.road_tax_status}
    new_road_tax_notes: ${incoming.body.road_tax_notes}
    new_vehicle_reg_nr: ${incoming.body.vehicle_reg_nr}
    new_vehicle_make: ${incoming.body.vehicle_make}
    new_vehicle_model: ${incoming.body.vehicle_model}
    new_vehicle_country_code: ${incoming.body.vehicle_country_code}
    new_vehicle_vin: ${incoming.body.vehicle_vin}
    new_vehicle_first_registration: ${incoming.body.vehicle_first_registration}
    new_vehicle_body_type: ${incoming.body.vehicle_body_type}
    new_vehicle_category_code: ${incoming.body.vehicle_category_code}
    new_vehicle_category_other: ${incoming.body.vehicle_category_other}
    new_vehicle_mileage: ${incoming.body.vehicle_mileage}
    new_trailers: ${incoming.body.trailers}
    new_drivers: ${incoming.body.drivers}
    new_company_reg_code: ${incoming.body.company_reg_code}
    new_company_name: ${incoming.body.company_name}
    new_company_country_code: ${incoming.body.company_country_code}
    new_company_county: ${incoming.body.company_county}
    new_company_city: ${incoming.body.company_city}
    new_company_address_line1: ${incoming.body.company_address_line1}
    new_company_postal_code: ${incoming.body.company_postal_code}
    new_company_owner_first_name: ${incoming.body.company_owner_first_name}
    new_company_owner_last_name: ${incoming.body.company_owner_last_name}
    new_company_activity_licence_copy_number: ${incoming.body.company_activity_licence_copy_number}
    new_inspector_first_name: ${incoming.body.inspector_first_name}
    new_inspector_last_name: ${incoming.body.inspector_last_name}
    new_inspector_organisation_id: ${incoming.body.inspector_organisation_id}
    new_inspector_unit: ${incoming.body.inspector_unit}
    new_inspector_profession: ${incoming.body.inspector_profession}
    changed_fields: "[]"
  next: calculateChangeFlags

calculateChangeFlags:
  assign:
    control_date_changed: ${new_control_date != old_control_date}
    control_time_changed: ${new_control_time != old_control_time}
    control_country_code_changed: ${new_control_country_code != old_control_country_code}
    county_changed: ${new_county != old_county}
    city_changed: ${new_city != old_city}
    road_changed: ${new_road != old_road}
    road_other_changed: ${new_road_other != old_road_other}
    kilometer_changed: ${new_kilometer != old_kilometer}
    address_changed: ${new_address != old_address}
    road_type_changed: ${new_road_type != old_road_type}
    road_tax_status_changed: ${new_road_tax_status != old_road_tax_status}
    road_tax_notes_changed: ${new_road_tax_notes != old_road_tax_notes}
    vehicle_reg_nr_changed: ${new_vehicle_reg_nr != old_vehicle_reg_nr}
    vehicle_make_changed: ${new_vehicle_make != old_vehicle_make}
    vehicle_model_changed: ${new_vehicle_model != old_vehicle_model}
    vehicle_country_code_changed: ${new_vehicle_country_code != old_vehicle_country_code}
    vehicle_vin_changed: ${new_vehicle_vin != old_vehicle_vin}
    vehicle_first_registration_changed: ${new_vehicle_first_registration != old_vehicle_first_registration}
    vehicle_body_type_changed: ${new_vehicle_body_type != old_vehicle_body_type}
    vehicle_category_code_changed: ${new_vehicle_category_code != old_vehicle_category_code}
    vehicle_category_other_changed: ${new_vehicle_category_other != old_vehicle_category_other}
    vehicle_mileage_changed: ${new_vehicle_mileage != old_vehicle_mileage}
    trailers_changed: ${new_trailers != old_trailers}
    drivers_changed: ${new_drivers != old_drivers}
    company_reg_code_changed: ${new_company_reg_code != old_company_reg_code}
    company_name_changed: ${new_company_name != old_company_name}
    company_country_code_changed: ${new_company_country_code != old_company_country_code}
    company_county_changed: ${new_company_county != old_company_county}
    company_city_changed: ${new_company_city != old_company_city}
    company_address_line1_changed: ${new_company_address_line1 != old_company_address_line1}
    company_postal_code_changed: ${new_company_postal_code != old_company_postal_code}
    company_owner_first_name_changed: ${new_company_owner_first_name != old_company_owner_first_name}
    company_owner_last_name_changed: ${new_company_owner_last_name != old_company_owner_last_name}
    company_activity_licence_copy_number_changed: ${new_company_activity_licence_copy_number != old_company_activity_licence_copy_number}
    inspector_first_name_changed: ${new_inspector_first_name != old_inspector_first_name}
    inspector_last_name_changed: ${new_inspector_last_name != old_inspector_last_name}
    inspector_organisation_id_changed: ${new_inspector_organisation_id != old_inspector_organisation_id}
    inspector_unit_changed: ${new_inspector_unit != old_inspector_unit}
    inspector_profession_changed: ${new_inspector_profession != old_inspector_profession}
  next: checkControlDate


checkControlDate:
  switch:
    - condition: ${control_date_changed}
      next: addControlDate
  next: checkControlTime

addControlDate:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"control_date\"]" : "[\"control_date\"]"}'
  next: checkControlTime

checkControlTime:
  switch:
    - condition: ${control_time_changed}
      next: addControlTime
  next: checkControlCountryCode

addControlTime:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"control_time\"]" : "[\"control_time\"]"}'
  next: checkControlCountryCode

checkControlCountryCode:
  switch:
    - condition: ${control_country_code_changed}
      next: addControlCountryCode
  next: checkCounty

addControlCountryCode:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"control_country_code\"]" : "[\"control_country_code\"]"}'
  next: checkCounty

checkCounty:
  switch:
    - condition: ${county_changed}
      next: addCounty
  next: checkCity

addCounty:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"county\"]" : "[\"county\"]"}'
  next: checkCity

