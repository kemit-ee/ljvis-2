  next: checkVehicleBodyType

addVehicleFirstRegistration:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"vehicle_first_registration\"]" : "[\"vehicle_first_registration\"]"}'
