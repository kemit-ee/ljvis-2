checkTrailers:
  switch:
    - condition: ${trailers_changed}
      next: addTrailers
  next: checkDrivers

addTrailers:
  template: "templates/form/compound-form/calculate-compound-trailer-changed-fields"
  requestType: GET
  body:
    old_trailers: ${old_trailers}
    new_trailers: ${new_trailers}
    changed_fields: ${changed_fields}
  result: trailerResult
  next: extractTrailerResult

extractTrailerResult:
  assign:
    changed_fields: ${JSON.stringify(JSON.parse(trailerResult).changed_fields)}
  next: checkDrivers

checkDrivers:
  switch:
    - condition: ${drivers_changed}
      next: addDrivers
  next: checkCompanyRegCode

addDrivers:
  template: "templates/form/compound-form/calculate-compound-driver-changed-fields"
  requestType: GET
  body:
    old_drivers: ${old_drivers}
    new_drivers: ${new_drivers}
    changed_fields: ${changed_fields}
