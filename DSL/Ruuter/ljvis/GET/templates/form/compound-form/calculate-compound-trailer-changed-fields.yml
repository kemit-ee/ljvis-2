declaration:

  version: "1.0"
  description: "Calculate changed fields for trailers array - compares up to three trailers"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: old_trailers
        type: string
      - field: new_trailers
        type: string
      - field: changed_fields
        type: string

parseInputs:
  assign:
    old_trailers: ${incoming.body.old_trailers}
