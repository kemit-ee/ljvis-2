declaration:
  internal: false

  version: "1.0"
  description: "Publish (avalikusta) the compound form and return the outcome as JSON (`{outcome, body}`). Shared by compound-form/edit/publish and by the sub-form publish handlers, which auto-publish the general part server-side once the last active sub-form is published (only_if_confirmed=true limits that to a confirmed compound form). Form field values are taken from the current database record."
  namespace: service
  strict: true
  allowlist:
    body:
      - field: id
        type: string
      - field: only_if_confirmed
        type: string
    headers:
      - field: cookie
        type: string
      - field: content-type
        type: string

extractRequestData:
  assign:
    id: "${incoming.body.id}"
    only_if_confirmed: "${incoming.body.only_if_confirmed === 'true'}"
    created_by: "${session_personal_code || ''}"
  next: checkId

checkId:
  switch:
    - condition: ${id == null || id === ''}
      next: returnSkipped
  next: getCurrentForm

getCurrentForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      id: ${id}
  result: currentFormRes
  next: checkFound

checkFound:
  switch:
    - condition: ${currentFormRes.response.body == null || currentFormRes.response.body.length !== 1}
      next: returnNotFound
    - condition: ${only_if_confirmed && currentFormRes.response.body[0].status !== 'confirmed'}
      next: returnSkipped
    - condition: ${currentFormRes.response.body[0].status === 'published'}
      next: returnAlreadyPublished
  next: getSubFormPublishState

# Üldosa avalikustub ainult siis, kui viimane alamvorm on avalikustatud:
# ükski aktiivne alamvorm pole avalikustamata. Alamvormideta koondvormi
# avalikustamist see ei piira, aga automaatavalikustamine (only_if_confirmed)
# nõuab vähemalt ühte alamvormi.
getSubFormPublishState:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get-subform-publish-state"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      compoundFormKey: ${id}
  result: subFormStateRes
  next: checkSubFormsPublished

checkSubFormsPublished:
  switch:
    - condition: ${subFormStateRes.response == null || subFormStateRes.response.status < 200 || subFormStateRes.response.status >= 300 || subFormStateRes.response.body == null || subFormStateRes.response.body.length !== 1}
      next: returnWriteError
    - condition: ${Number(subFormStateRes.response.body[0].unpublishedCount) > 0}
      next: returnSubFormsNotPublished
    - condition: ${only_if_confirmed && Number(subFormStateRes.response.body[0].totalCount) === 0}
      next: returnSkipped
  next: extractCurrentFormData

extractCurrentFormData:
  assign:
    control_date: "${currentFormRes.response.body[0].controlDate || ''}"
    control_time: "${currentFormRes.response.body[0].controlTime || ''}"
    control_country_code: "${currentFormRes.response.body[0].controlCountryCode || ''}"
    county: "${currentFormRes.response.body[0].county || ''}"
    city: "${currentFormRes.response.body[0].city || ''}"
    road: "${currentFormRes.response.body[0].road || ''}"
    road_other: "${currentFormRes.response.body[0].roadOther || ''}"
    # `!= null ? String(x) : ''` — mitte `|| ''`, sest 0 on legitiimne
    # kilomeetrinäit ja `0 || ''` annaks '' -> SQL NULL (vaikne andmekadu).
    kilometer: "${currentFormRes.response.body[0].kilometer != null ? String(currentFormRes.response.body[0].kilometer) : ''}"
    address: "${currentFormRes.response.body[0].address || ''}"
    road_type: "${currentFormRes.response.body[0].road_type || ''}"
    road_tax_status: "${currentFormRes.response.body[0].roadTaxStatus || ''}"
    road_tax_notes: "${currentFormRes.response.body[0].roadTaxNotes || ''}"
    vehicle_reg_nr: "${currentFormRes.response.body[0].vehicleRegNr || ''}"
    vehicle_make: "${currentFormRes.response.body[0].vehicleMake || ''}"
    vehicle_model: "${currentFormRes.response.body[0].vehicleModel || ''}"
    vehicle_country_code: "${currentFormRes.response.body[0].vehicleCountryCode || ''}"
    vehicle_vin: "${currentFormRes.response.body[0].vehicleVin || ''}"
    vehicle_first_registration: "${currentFormRes.response.body[0].vehicleFirstRegistration || ''}"
    vehicle_body_type: "${currentFormRes.response.body[0].vehicleBodyType || ''}"
    vehicle_category_code: "${currentFormRes.response.body[0].vehicleCategoryCode || ''}"
    vehicle_category_other: "${currentFormRes.response.body[0].vehicleCategoryOther || ''}"
    vehicle_mileage: "${currentFormRes.response.body[0].vehicleMileage != null ? String(currentFormRes.response.body[0].vehicleMileage) : ''}"
    trailers: "${currentFormRes.response.body[0].trailers || '[]'}"
    company_reg_code: "${currentFormRes.response.body[0].companyRegCode || ''}"
    company_name: "${currentFormRes.response.body[0].companyName || ''}"
    company_country_code: "${currentFormRes.response.body[0].companyCountryCode || ''}"
    company_county: "${currentFormRes.response.body[0].companyCounty || ''}"
    company_city: "${currentFormRes.response.body[0].companyCity || ''}"
    company_address_line1: "${currentFormRes.response.body[0].companyAddressLine1 || ''}"
    company_postal_code: "${currentFormRes.response.body[0].companyPostalCode || ''}"
    company_owner_first_name: "${currentFormRes.response.body[0].companyOwnerFirstName || ''}"
    company_owner_last_name: "${currentFormRes.response.body[0].companyOwnerLastName || ''}"
    company_activity_licence_copy_number: "${currentFormRes.response.body[0].companyActivityLicenceCopyNumber || ''}"
    drivers: "${currentFormRes.response.body[0].drivers || '[]'}"
    inspector_first_name: "${currentFormRes.response.body[0].inspectorFirstName || ''}"
    inspector_last_name: "${currentFormRes.response.body[0].inspectorLastName || ''}"
    inspector_organisation_id: "${currentFormRes.response.body[0].inspectorOrganisationId || ''}"
    inspector_unit: "${currentFormRes.response.body[0].inspectorUnit || ''}"
    inspector_profession: "${currentFormRes.response.body[0].inspectorProfession || ''}"
  next: publishForm

publishForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/update"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      key: ${id}
      expected_revision: "${String(currentFormRes.response.body[0].revision ?? '')}"  # publish kopeerib get-vastuse andmed: lukk selle revision'i vastu
      status: published
      controlDate: ${control_date}
      controlTime: ${control_time}
      controlCountryCode: ${control_country_code}
      county: ${county}
      city: ${city}
      road: ${road}
      roadOther: ${road_other}
      kilometer: ${kilometer}
      address: ${address}
      road_type: ${road_type}
      roadTaxStatus: ${road_tax_status}
      roadTaxNotes: ${road_tax_notes}
      vehicleRegNr: ${vehicle_reg_nr}
      vehicleMake: ${vehicle_make}
      vehicleModel: ${vehicle_model}
      vehicleCountryCode: ${vehicle_country_code}
      vehicleVin: ${vehicle_vin}
      vehicleFirstRegistration: ${vehicle_first_registration}
      vehicleBodyType: ${vehicle_body_type}
      vehicleCategoryCode: ${vehicle_category_code}
      vehicleCategoryOther: ${vehicle_category_other}
      vehicleMileage: ${vehicle_mileage}
      trailers: ${trailers}
      companyRegCode: ${company_reg_code}
      companyName: ${company_name}
      companyCountryCode: ${company_country_code}
      companyCounty: ${company_county}
      companyCity: ${company_city}
      companyAddressLine1: ${company_address_line1}
      companyPostalCode: ${company_postal_code}
      companyOwnerFirstName: ${company_owner_first_name}
      companyOwnerLastName: ${company_owner_last_name}
      companyActivityLicenceCopyNumber: ${company_activity_licence_copy_number}
      drivers: ${drivers}
      inspectorFirstName: ${inspector_first_name}
      inspectorLastName: ${inspector_last_name}
      inspectorOrganisationId: ${inspector_organisation_id}
      inspectorUnit: ${inspector_unit}
      inspectorProfession: ${inspector_profession}
      created_by: ${created_by}
  result: publishRes
  next: checkPublishConflict

# Optimistlik lukk: kui vorm muutus pärast get-päringut (nt e-toimiku cron avalikustas selle),
# lisab update.sql 0 rida — see on konflikt, mitte salvestusviga.
checkPublishConflict:
  switch:
    - condition: ${publishRes.response != null && publishRes.response.status >= 200 && publishRes.response.status < 300 && Array.isArray(publishRes.response.body) && publishRes.response.body.length === 0 && currentFormRes.response.body[0].revision != null}
      next: returnFormModifiedError
  next: check_publishRes_persisted

returnFormModifiedError:
  status: 409
  return: '{"type":"CONFLICT","code":"form_modified"}'
  next: end


check_publishRes_persisted:
  switch:
    - condition: ${publishRes.response == null || publishRes.response.status < 200 || publishRes.response.status >= 300 || publishRes.response.body == null || publishRes.response.body.length == null || publishRes.response.body.length === 0}
      next: returnWriteError
  next: buildLogDescription

buildLogDescription:
  assign:
    compound_form_key: "${publishRes.response.body[0].id || ''}"
    form_number: "${publishRes.response.body[0].formNumber || ''}"
    description: "Koondvorm avalikustatud, vormi võti=${id}, vormi number=${publishRes.response.body[0].formNumber}/${publishRes.response.body[0].version}"
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: "control_form.compound_form.publish"
    event_category: "control_form"
    description: ${description}
    log_content: "{\"compoundFormKey\":${compound_form_key},\"formNumber\":\"${form_number}\"}"
  result: audit_result
  next: triggerRiskRecalculate


triggerRiskRecalculate:
  switch:
    - condition: "${!/^[0-9]{8}$/.test('' + (company_reg_code || ''))}"
      next: returnPublished
  next: callRiskRecalculate

callRiskRecalculate:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/risk-scores/recalculate"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      company_reg_code: ${company_reg_code}
      calculation_trigger: "kontrollvorm"
  result: recalc_result
  error: returnPublished
  next: returnPublished


returnPublished:
  return: "${JSON.stringify({ outcome: 'published', body: publishRes.response.body })}"
  next: end

# Idempotentne: alamvormi avalikustamine avalikustab üldosa juba serveris ja
# brauser proovib seda pärast uuesti; teist versiooni ei looda.
returnAlreadyPublished:
  return: "${JSON.stringify({ outcome: 'published', body: currentFormRes.response.body })}"
  next: end

returnSkipped:
  return: '{"outcome":"skipped"}'
  next: end

returnNotFound:
  return: '{"outcome":"not_found"}'
  next: end

returnWriteError:
  return: '{"outcome":"write_error"}'
  next: end

returnSubFormsNotPublished:
  return: '{"outcome":"subforms_not_published"}'
  next: end
