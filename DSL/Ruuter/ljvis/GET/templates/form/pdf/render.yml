declaration:
  internal: false
  returns: []
  version: "1.0"
  description: "Render an allow-listed control-form PDF and record the print audit event."
  namespace: service
  strict: true
  allowlist:
    body:
      - field: templateCode
        type: string
      - field: blank
        type: boolean
      - field: fields
        type: json
      - field: eventType
        type: string
      - field: description
        type: string
      - field: logContent
        type: string
    headers:
      - field: cookie
        type: string
      - field: content-type
        type: string

# Koondvormi maakond/linn on salvestatud EHAK klassifikaatori võtmena; PDF-i jaoks lahendame nimeks.
collectPlaceIds:
  assign:
    place_ids: "${(function(c) { return c ? [c.county, c.city, c.companyCounty, c.companyCity].filter(function(x) { return /^[0-9]+$/.test(String(x || '')); }).join(',') : ''; })(incoming.body.fields && incoming.body.fields.compoundForm)}"
  next: getPlaceNames

getPlaceNames:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/ehak/get_names"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      type: json
    body:
      ids: ${place_ids}
  result: placeNamesRes
  next: getRoadNames

# Kontrolli koha tee on salvestatud ROAD_NAME klassifikaatori koodina (nt tallinn_narva);
# PDF-is näidatakse selle nimetust (TALLINN - NARVA), nagu kasutajaliideseski. Best-effort:
# vea korral jääb PDF-i kood.
getRoadNames:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/roads/list_roads"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      type: json
    body: {}
  result: roadNamesRes
  error: buildPdfFields
  next: buildPdfFields

buildPdfFields:
  assign:
    pdf_fields: "${Object.assign({}, incoming.body.fields, {labels: {ehak: ((placeNamesRes.response && placeNamesRes.response.body) || []).reduce(function(m, r) { m[r.id] = r.name; return m; }, {}), roads: ((typeof roadNamesRes !== 'undefined' && roadNamesRes && roadNamesRes.response && Array.isArray(roadNamesRes.response.body) && roadNamesRes.response.body) || []).reduce(function(m, r) { if (r.code) { m[r.code] = r.name; } return m; }, {})}})}"
  next: renderPdf

renderPdf:
  call: http.post
  args:
    url: "[#LJVIS_PDF_CREATOR]/v1/render"
    headers:
      type: json
      Authorization: "Bearer [#PDF_CREATOR_API_KEY]"
    body:
      templateCode: ${incoming.body.templateCode}
      blank: ${incoming.body.blank}
      fields: ${pdf_fields}
      output: "base64"
  result: pdfRes
  next: checkPdfResult

checkPdfResult:
  switch:
    - condition: ${pdfRes.response == null || pdfRes.response.status < 200 || pdfRes.response.status >= 300 || pdfRes.response.body == null}
      next: returnRenderError
  next: logAuditEvent

logAuditEvent:
  template: "templates/audit/log-audit-event"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    event_type: ${incoming.body.eventType}
    event_category: "control_form"
    description: ${incoming.body.description}
    log_content: ${incoming.body.logContent}
  result: auditResult
  next: returnSuccess

returnSuccess:
  return: ${pdfRes.response.body}
  next: end

returnRenderError:
  status: 502
  return: '{"error":"PDF_RENDER_FAILED"}'
  next: end
