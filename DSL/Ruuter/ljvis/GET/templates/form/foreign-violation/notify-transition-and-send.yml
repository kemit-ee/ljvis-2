declaration:

  version: "1.0"
  description: >-
    Välisriigi kontrollkaardi teavituste (vedaja / tööinspektor) saatmine
    Postkast 2.0 kaudu. Kutsub AINULT edit/publish.yml - salvestamine ja
    kinnitamine teavitusi ei saada. Vedaja linnuke (notifyCarrier) võetakse
    pärast edukat saatmist maha (kutsuja teeb seda tagastatud carrierSent
    põhjal), nii et kordussaatmiseks tuleb see muudatuse korral uuesti
    märkida. Tööinspektori linnuke (notifyLaborInspector) jääb püsivaks.

    sendGateMet: kutsuja kinnitus, et saatmine on lubatud (publish.yml
    annab alati 'true' - avalikustamine ise on saatmise hetk).

    Äriregistri e-posti otsingu VIGA: kui jagatud
    lookup-carrier-registry-email template ebaõnnestub (transpordi tase),
    ei jäeta sendCarrierNotification'it vahele - kutsutakse ikka, tühja
    recipient_email'iga, et send-postkast.yml (checkRecipientFormat /
    markInvalidRecipient) looks korrektse "error" rea notifications.outbound_log-i.
    Nii ei kao kasutaja saatmissoov jäljetult.

    Tagastusväärtus: '{"carrierSent":"true|false"}' - "true" ainult siis, kui
    send-postkast võttis vedaja teavituse vastu (staatus ei ole "error").
  namespace: service
  allowlist:
    body:
      - field: formId
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: formNumber
        type: string
      - field: violations
        type: string
      - field: violationDescription
        type: string
      - field: inspectionDate
        type: string
      - field: inspectionTime
        type: string
      - field: inspectionCountryCode
        type: string
      - field: vehicleRegNr
        type: string
      - field: vehicleMake
        type: string
      - field: vehicleModel
        type: string
      - field: vehicleVin
        type: string
      - field: createdBy
        type: string
      - field: newNotifyCarrier
        type: string
      - field: newNotifyLaborInspector
        type: string
      - field: sendGateMet
        type: string

extractInputs:
  assign:
    form_id: "${incoming.body.formId || ''}"
    company_reg_code: "${incoming.body.companyRegCode || ''}"
    company_name: "${incoming.body.companyName || ''}"
    notification_form_number: "${incoming.body.formNumber || ''}"
    violation_description: "${incoming.body.violationDescription || ''}"
    violation_severities: >-
      ${(() => {
        try {
          var rows = JSON.parse(incoming.body.violations || '[]');
          var values = rows.map(function(v) {
            var match = String(v.code || '').match(/^(MSI|VSI|SI)/);
            return match ? match[1] : '';
          }).filter(Boolean);
          return Array.from(new Set(values)).join(', ');
        } catch (e) { return ''; }
      })()}
    violation_codes: >-
      ${(() => {
        try {
          var rows = JSON.parse(incoming.body.violations || '[]');
          var codes = rows.map(function(v) { return String(v.code || '').toUpperCase().replace(/[ _-]/g, ''); })
            .filter(function(c) { return /^(MSI|VSI|SI)[0-9]+$/.test(c); });
          return Array.from(new Set(codes)).join(',');
        } catch (e) { return ''; }
      })()}
    inspection_date_time: >-
      ${((incoming.body.inspectionDate || '') + ' ' + (incoming.body.inspectionTime || '')).trim()}
    inspection_country_code: "${incoming.body.inspectionCountryCode || ''}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr || ''}"
    vehicle_make: "${incoming.body.vehicleMake || ''}"
    vehicle_model: "${incoming.body.vehicleModel || ''}"
    vehicle_vin: "${incoming.body.vehicleVin || ''}"
    created_by: "${incoming.body.createdBy || 'system'}"
    send_carrier: "${incoming.body.newNotifyCarrier === 'true' && incoming.body.sendGateMet === 'true'}"
    send_labor_inspector: "${incoming.body.newNotifyLaborInspector === 'true' && incoming.body.sendGateMet === 'true'}"
    carrier_sent: "false"
    inspection_country: "${incoming.body.inspectionCountryCode || ''}"
  next: lookupInspectionCountry

# Kontrolli koha riigi nimetus COUNTRY klassifikaatorist (kood -> nimi). Kui
# otsing ebaõnnestub või koodi ei leita, jäetakse väärtuseks kood ise.
lookupInspectionCountry:
  switch:
    - condition: ${inspection_country === ''}
      next: callGetViolationNames
  next: callGetCountryName

callGetCountryName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_country_name"
    headers:
      type: json
    body:
      code: ${inspection_country}
  result: countryNameRes
  error: callGetViolationNames
  next: applyCountryName

applyCountryName:
  assign:
    inspection_country: "${(countryNameRes.response.body && countryNameRes.response.body[0] && countryNameRes.response.body[0].name) || inspection_country}"
  next: callGetViolationNames

# Rikkumiskoodide nimetused klassifikaatoritest; leidmata koodi puhul näidatakse ainult koodi.
callGetViolationNames:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_violation_names"
    headers:
      type: json
    body:
      codes: ${violation_codes}
  result: violationNamesRes
  error: buildViolationList
  next: buildViolationList

# Rikkumised raskusastme kaupa (MSIViolationsList / VSIViolationsList / SIViolationsList),
# üks rikkumine rea kohta „kood — nimetus", ridade vahel <br>.
buildViolationList:
  assign:
    MSIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^MSI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
    VSIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^VSI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
    SIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^SI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
  next: checkSendCarrier

checkSendCarrier:
  switch:
    - condition: ${send_carrier}
      next: lookupCarrierEmail
  next: checkSendLaborInspector

lookupCarrierEmail:
  template: "templates/xroad/lookup-carrier-registry-email"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    companyRegCode: ${company_reg_code}
    sourceType: "foreign_violation_form"
    sourceRecordId: ${form_id}
  result: carrierLookupResult
  error: markCarrierEmailLookupFailed
  next: parseCarrierLookupResult

parseCarrierLookupResult:
  assign:
    carrier_email: >-
      ${(() => {
        try { return (JSON.parse(carrierLookupResult) || {}).email || ''; }
        catch (e) { return ''; }
      })()}
  next: sendCarrierNotification

# review leid 4: lookup ebaõnnestumisel (transpordi tase — template'i enda
# error haru) EI jäeta sendCarrierNotification'it vahele, vaid kutsutakse
# tühja aadressiga — send-postkast.yml logib selle korrektselt "error"-rea.
markCarrierEmailLookupFailed:
  assign:
    carrier_email: ""
  next: sendCarrierNotification

sendCarrierNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "carrier_violation"
      recipient_email: ${carrier_email}
      language: "et"
      send_time: ""
      related_entity_type: "foreign_violation_form"
      related_entity_id: ${form_id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: notification_form_number, companyName: company_name, companyRegCode: company_reg_code, inspectionDateTime: inspection_date_time, inspectionCountryCode: inspection_country_code, inspectionCountry: inspection_country, vehicleRegNr: vehicle_reg_nr, violationSeverities: violation_severities, violationDescription: violation_description, MSIViolationsList: MSIViolationsList, VSIViolationsList: VSIViolationsList, SIViolationsList: SIViolationsList } }"
  result: carrierNotifRes
  error: checkSendLaborInspector
  next: markCarrierSent

markCarrierSent:
  assign:
    carrier_sent: "${(carrierNotifRes.response != null && carrierNotifRes.response.status >= 200 && carrierNotifRes.response.status < 300 && carrierNotifRes.response.body != null && carrierNotifRes.response.body.status !== 'error') ? 'true' : 'false'}"
  next: checkSendLaborInspector

checkSendLaborInspector:
  switch:
    - condition: ${send_labor_inspector}
      next: sendLaborInspectorNotification
  next: returnResult

# Taaskasutab 'labor_foreign_proposal' malli/adressaati (tööinspektor) —
# sama teavituse liik, mida varem päästis foreignAuthorityProposal fakt,
# nüüd päästab eraldiseisev notifyLaborInspector checkbox (p.5).
sendLaborInspectorNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "labor_foreign_proposal"
      language: "et"
      send_time: ""
      related_entity_type: "foreign_violation_form"
      related_entity_id: ${form_id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: notification_form_number, companyName: company_name, companyRegCode: company_reg_code, vehicleRegNr: vehicle_reg_nr, vehicleMake: vehicle_make, vehicleModel: vehicle_model, vehicleVin: vehicle_vin, inspectionCountry: inspection_country, inspectionDate: incoming.body.inspectionDate || '', inspectionTime: incoming.body.inspectionTime || '' } }"
  result: laborInspectorNotifRes
  error: returnResult
  next: returnResult

returnResult:
  return: '${JSON.stringify({ carrierSent: carrier_sent })}'
  next: end
