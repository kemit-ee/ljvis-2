declaration:
  internal: false
  returns: []

  version: "1.0"
  description: "Single source of truth for foreign violation form field validation - shared by save.yml (insert + update) and confirm.yml. Mirrors the frontend Yup schema. Returns '{\"valid\":true}' when all checks pass, otherwise a VALIDATION_ERROR shape ready to be forwarded to the client as-is."
  namespace: service
  allowlist:
    body:
      - field: reportingCountryCode
        type: string
      - field: reportingAuthority
        type: string
      - field: inspectionDate
        type: string
      - field: sanctionCode
        type: string
      - field: recommendedMeasureCode
        type: string
      - field: recommendedMeasureNotes
        type: string
      - field: dataEntryDate
        type: string
      - field: inspectorFirstName
        type: string
      - field: inspectorLastName
        type: string
      - field: inspectorOrganisationId
        type: string
      - field: inspectorProfession
        type: string
      - field: inspectionAddressLine1
        type: string
      - field: inspectionAddressLine2
        type: string
      - field: inspectionRegion
        type: string
      - field: inspectionCity
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: companyAddressLine1
        type: string
      - field: companyAddressLine2
        type: string
      - field: companyCity
        type: string
      - field: companyPostalCode
        type: string
      - field: driverFirstName
        type: string
      - field: driverLastName
        type: string
      - field: vehicleRegNr
        type: string
      - field: vehicleMake
        type: string
      - field: vehicleModel
        type: string
      - field: vehicleVin
        type: string
      - field: licenceCopyNumber
        type: string
      - field: inspectorUnit
        type: string
      - field: sanctionNotes
        type: string
      - field: violationDescription
        type: string
      - field: adminProcedureDecision
        type: string

extractFields:
  assign:
    reporting_country_code: "${incoming.body.reportingCountryCode || ''}"
    reporting_authority: "${incoming.body.reportingAuthority || ''}"
    inspection_date: "${incoming.body.inspectionDate || ''}"
    sanction_code: "${incoming.body.sanctionCode || ''}"
    recommended_measure_code: "${incoming.body.recommendedMeasureCode || ''}"
    recommended_measure_notes: "${incoming.body.recommendedMeasureNotes || ''}"
    data_entry_date: "${incoming.body.dataEntryDate || ''}"
    inspector_first_name: "${incoming.body.inspectorFirstName || ''}"
    inspector_last_name: "${incoming.body.inspectorLastName || ''}"
    inspector_organisation_id: "${incoming.body.inspectorOrganisationId != null ? String(incoming.body.inspectorOrganisationId) : ''}"
    inspector_profession: "${incoming.body.inspectorProfession || ''}"
    inspection_address_line1: "${incoming.body.inspectionAddressLine1 || ''}"
    inspection_address_line2: "${incoming.body.inspectionAddressLine2 || ''}"
    inspection_region: "${incoming.body.inspectionRegion || ''}"
    inspection_city: "${incoming.body.inspectionCity || ''}"
    company_reg_code: "${incoming.body.companyRegCode || ''}"
    company_name: "${incoming.body.companyName || ''}"
    company_address_line1: "${incoming.body.companyAddressLine1 || ''}"
    company_address_line2: "${incoming.body.companyAddressLine2 || ''}"
    company_city: "${incoming.body.companyCity || ''}"
    company_postal_code: "${incoming.body.companyPostalCode || ''}"
    driver_first_name: "${incoming.body.driverFirstName || ''}"
    driver_last_name: "${incoming.body.driverLastName || ''}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr || ''}"
    vehicle_make: "${incoming.body.vehicleMake || ''}"
    vehicle_model: "${incoming.body.vehicleModel || ''}"
    vehicle_vin: "${incoming.body.vehicleVin || ''}"
    licence_copy_number: "${incoming.body.licenceCopyNumber || ''}"
    inspector_unit: "${incoming.body.inspectorUnit || ''}"
    sanction_notes: "${incoming.body.sanctionNotes || ''}"
    violation_description: "${incoming.body.violationDescription || ''}"
    admin_procedure_decision: "${incoming.body.adminProcedureDecision || ''}"
  next: validate

validate:
  switch:
    - condition: ${!reporting_country_code || reporting_country_code.trim() === ''}
      next: returnReportingCountryCodeRequiredError
    - condition: ${!reporting_authority || reporting_authority.trim() === ''}
      next: returnReportingAuthorityRequiredError
    - condition: ${!inspection_date || inspection_date.trim() === ''}
      next: returnInspectionDateRequiredError
    - condition: ${!sanction_code || sanction_code.trim() === ''}
      next: returnSanctionCodeRequiredError
    - condition: ${!recommended_measure_code || recommended_measure_code.trim() === ''}
      next: returnRecommendedMeasureCodeRequiredError
    - condition: ${!data_entry_date || data_entry_date.trim() === ''}
      next: returnDataEntryDateRequiredError
    - condition: ${!inspector_first_name || inspector_first_name.trim() === ''}
      next: returnInspectorFirstNameRequiredError
    - condition: ${!inspector_last_name || inspector_last_name.trim() === ''}
      next: returnInspectorLastNameRequiredError
    - condition: ${!inspector_organisation_id || inspector_organisation_id.trim() === ''}
      next: returnInspectorOrganisationIdRequiredError
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspection_address_line1)}'
      next: returnInvalidCharactersInspectionAddressLine1
    - condition: ${inspection_address_line1.length > 300}
      next: returnMaxLengthInspectionAddressLine1
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspection_address_line2)}'
      next: returnInvalidCharactersInspectionAddressLine2
    - condition: ${inspection_address_line2.length > 300}
      next: returnMaxLengthInspectionAddressLine2
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspection_region)}'
      next: returnInvalidCharactersInspectionRegion
    - condition: ${inspection_region.length > 100}
      next: returnMaxLengthInspectionRegion
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspection_city)}'
      next: returnInvalidCharactersInspectionCity
    - condition: ${inspection_city.length > 100}
      next: returnMaxLengthInspectionCity
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_reg_code)}'
      next: returnInvalidCharactersCompanyRegCode
    - condition: ${company_reg_code.length > 20}
      next: returnMaxLengthCompanyRegCode
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_name)}'
      next: returnInvalidCharactersCompanyName
    - condition: ${company_name.length > 300}
      next: returnMaxLengthCompanyName
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_address_line1)}'
      next: returnInvalidCharactersCompanyAddressLine1
    - condition: ${company_address_line1.length > 300}
      next: returnMaxLengthCompanyAddressLine1
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_address_line2)}'
      next: returnInvalidCharactersCompanyAddressLine2
    - condition: ${company_address_line2.length > 300}
      next: returnMaxLengthCompanyAddressLine2
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_city)}'
      next: returnInvalidCharactersCompanyCity
    - condition: ${company_city.length > 100}
      next: returnMaxLengthCompanyCity
    - condition: '${/[\u0000-\u001F\u007F]/.test(company_postal_code)}'
      next: returnInvalidCharactersCompanyPostalCode
    - condition: ${company_postal_code.length > 20}
      next: returnMaxLengthCompanyPostalCode
    - condition: '${/[\u0000-\u001F\u007F]/.test(driver_first_name)}'
      next: returnInvalidCharactersDriverFirstName
    - condition: ${driver_first_name.length > 100}
      next: returnMaxLengthDriverFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(driver_last_name)}'
      next: returnInvalidCharactersDriverLastName
    - condition: ${driver_last_name.length > 100}
      next: returnMaxLengthDriverLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(vehicle_reg_nr)}'
      next: returnInvalidCharactersVehicleRegNr
    - condition: ${vehicle_reg_nr.length > 20}
      next: returnMaxLengthVehicleRegNr
    - condition: '${/[\u0000-\u001F\u007F]/.test(vehicle_make)}'
      next: returnInvalidCharactersVehicleMake
    - condition: ${vehicle_make.length > 100}
      next: returnMaxLengthVehicleMake
    - condition: '${/[\u0000-\u001F\u007F]/.test(vehicle_model)}'
      next: returnInvalidCharactersVehicleModel
    - condition: ${vehicle_model.length > 100}
      next: returnMaxLengthVehicleModel
    - condition: '${/[\u0000-\u001F\u007F]/.test(vehicle_vin)}'
      next: returnInvalidCharactersVehicleVin
    - condition: ${vehicle_vin.length > 30}
      next: returnMaxLengthVehicleVin
    - condition: '${/[\u0000-\u001F\u007F]/.test(licence_copy_number)}'
      next: returnInvalidCharactersLicenceCopyNumber
    - condition: ${licence_copy_number.length > 100}
      next: returnMaxLengthLicenceCopyNumber
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspector_first_name)}'
      next: returnInvalidCharactersInspectorFirstName
    - condition: ${inspector_first_name.length > 100}
      next: returnMaxLengthInspectorFirstName
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspector_last_name)}'
      next: returnInvalidCharactersInspectorLastName
    - condition: ${inspector_last_name.length > 100}
      next: returnMaxLengthInspectorLastName
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspector_unit)}'
      next: returnInvalidCharactersInspectorUnit
    - condition: ${inspector_unit.length > 200}
      next: returnMaxLengthInspectorUnit
    - condition: '${/[\u0000-\u001F\u007F]/.test(inspector_profession)}'
      next: returnInvalidCharactersInspectorProfession
    - condition: ${inspector_profession.length > 200}
      next: returnMaxLengthInspectorProfession
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(recommended_measure_notes)}'
      next: returnInvalidCharactersRecommendedMeasureNotes
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(sanction_notes)}'
      next: returnInvalidCharactersSanctionNotes
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(violation_description)}'
      next: returnInvalidCharactersViolationDescription
    - condition: '${/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(admin_procedure_decision)}'
      next: returnInvalidCharactersAdminProcedureDecision
  next: returnValid

returnValid:
  return: '{"valid":true}'
  next: end

returnReportingCountryCodeRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"reportingCountryCode","code":"required"}'
  next: end

returnReportingAuthorityRequiredError:
  return: '{"type":"VALIDATION_ERROR","field":"reportingAuthority","code":"required"}'
