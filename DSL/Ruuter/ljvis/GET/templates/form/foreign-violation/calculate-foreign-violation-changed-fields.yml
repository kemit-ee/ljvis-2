    old_recommended_measure_notes: "${res.response.body[0].recommendedMeasureNotes || ''}"
    old_recommended_measure_general_notes: "${res.response.body[0].recommendedMeasureGeneralNotes || ''}"
    old_inspector_first_name: "${res.response.body[0].inspectorFirstName || ''}"
    old_inspector_last_name: "${res.response.body[0].inspectorLastName || ''}"
    old_inspector_organisation_id: "${res.response.body[0].inspectorOrganisationId || ''}"
    old_inspector_unit: "${res.response.body[0].inspectorUnit || ''}"
    old_inspector_profession: "${res.response.body[0].inspectorProfession || ''}"
