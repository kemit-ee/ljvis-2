    new_inspection_address_line1: ${incoming.body.inspection_address_line1}
    new_inspection_address_line2: ${incoming.body.inspection_address_line2}
    new_inspection_region: ${incoming.body.inspection_region}
    new_inspection_city: ${incoming.body.inspection_city}
    new_company_reg_code: ${incoming.body.company_reg_code}
    new_company_name: ${incoming.body.company_name}
    new_company_country_code: ${incoming.body.company_country_code}
    new_company_address_line1: ${incoming.body.company_address_line1}
    new_company_address_line2: ${incoming.body.company_address_line2}
    new_company_city: ${incoming.body.company_city}
    new_company_postal_code: ${incoming.body.company_postal_code}
    new_driver_first_name: ${incoming.body.driver_first_name}
    new_driver_last_name: ${incoming.body.driver_last_name}
    new_vehicle_reg_nr: ${incoming.body.vehicle_reg_nr}
    new_vehicle_make: ${incoming.body.vehicle_make}
    new_vehicle_model: ${incoming.body.vehicle_model}
    new_vehicle_country_code: ${incoming.body.vehicle_country_code}
    new_vehicle_vin: ${incoming.body.vehicle_vin}
