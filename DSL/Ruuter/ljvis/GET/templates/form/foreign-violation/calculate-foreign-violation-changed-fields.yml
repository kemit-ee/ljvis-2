    new_minor_violations_count: ${incoming.body.minor_violations_count}
    new_sanction_code: ${incoming.body.sanction_code}
    new_sanction_notes: ${incoming.body.sanction_notes}
    new_recommended_measure_code: ${incoming.body.recommended_measure_code}
    new_recommended_measure_notes: ${incoming.body.recommended_measure_notes}
    new_recommended_measure_general_notes: ${incoming.body.recommended_measure_general_notes}
    new_inspector_first_name: ${incoming.body.inspector_first_name}
    new_inspector_last_name: ${incoming.body.inspector_last_name}
    new_inspector_organisation_id: ${incoming.body.inspector_organisation_id}
    new_inspector_unit: ${incoming.body.inspector_unit}
