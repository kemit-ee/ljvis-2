calculateChangeFlags:
  assign:
    reporting_country_code_changed: ${new_reporting_country_code != old_reporting_country_code}
    reporting_authority_changed: ${new_reporting_authority != old_reporting_authority}
    inspection_country_code_changed: ${new_inspection_country_code != old_inspection_country_code}
    inspection_date_changed: ${new_inspection_date != old_inspection_date}
    inspection_time_changed: ${new_inspection_time != old_inspection_time}
    inspection_address_line1_changed: ${new_inspection_address_line1 != old_inspection_address_line1}
    inspection_address_line2_changed: ${new_inspection_address_line2 != old_inspection_address_line2}
    inspection_region_changed: ${new_inspection_region != old_inspection_region}
    inspection_city_changed: ${new_inspection_city != old_inspection_city}
    company_reg_code_changed: ${new_company_reg_code != old_company_reg_code}
    company_name_changed: ${new_company_name != old_company_name}
    company_country_code_changed: ${new_company_country_code != old_company_country_code}
    company_address_line1_changed: ${new_company_address_line1 != old_company_address_line1}
    company_address_line2_changed: ${new_company_address_line2 != old_company_address_line2}
    company_city_changed: ${new_company_city != old_company_city}
    company_postal_code_changed: ${new_company_postal_code != old_company_postal_code}
    driver_first_name_changed: ${new_driver_first_name != old_driver_first_name}
    driver_last_name_changed: ${new_driver_last_name != old_driver_last_name}
    vehicle_reg_nr_changed: ${new_vehicle_reg_nr != old_vehicle_reg_nr}
    vehicle_make_changed: ${new_vehicle_make != old_vehicle_make}
    vehicle_model_changed: ${new_vehicle_model != old_vehicle_model}
    vehicle_country_code_changed: ${new_vehicle_country_code != old_vehicle_country_code}
    vehicle_vin_changed: ${new_vehicle_vin != old_vehicle_vin}
    vehicle_first_registration_changed: ${new_vehicle_first_registration != old_vehicle_first_registration}
    vehicle_body_type_changed: ${new_vehicle_body_type != old_vehicle_body_type}
    licence_copy_number_changed: ${new_licence_copy_number != old_licence_copy_number}
    violation_description_changed: ${new_violation_description != old_violation_description}
    minor_violations_count_changed: ${new_minor_violations_count != old_minor_violations_count}
    sanction_code_changed: ${new_sanction_code != old_sanction_code}
    sanction_notes_changed: ${new_sanction_notes != old_sanction_notes}
    recommended_measure_code_changed: ${new_recommended_measure_code != old_recommended_measure_code}
    recommended_measure_notes_changed: ${new_recommended_measure_notes != old_recommended_measure_notes}
    recommended_measure_general_notes_changed: ${new_recommended_measure_general_notes != old_recommended_measure_general_notes}
    inspector_first_name_changed: ${new_inspector_first_name != old_inspector_first_name}
    inspector_last_name_changed: ${new_inspector_last_name != old_inspector_last_name}
    inspector_organisation_id_changed: ${new_inspector_organisation_id != old_inspector_organisation_id}
    inspector_unit_changed: ${new_inspector_unit != old_inspector_unit}
    inspector_profession_changed: ${new_inspector_profession != old_inspector_profession}
  next: checkReportingCountryCode


checkReportingCountryCode:
  switch:
    - condition: ${reporting_country_code_changed}
      next: addReportingCountryCode
  next: checkReportingAuthority

addReportingCountryCode:
  assign:
    changed_fields: '${changed_fields.length > 2 ? changed_fields.substring(0, changed_fields.length - 1) + ",\"reporting_country_code\"]" : "[\"reporting_country_code\"]"}'
  next: checkReportingAuthority

checkReportingAuthority:
