declaration:

  version: "1.0"
  description: "Calculate changed fields for foreign violation form including SQL lookup"
  method: post
  accepts: json
  returns: json
  namespace: service
  allowlist:
    body:
      - field: form_id
        type: string
      - field: reporting_country_code
        type: string
      - field: reporting_authority
        type: string
      - field: inspection_country_code
        type: string
      - field: inspection_date
        type: string
      - field: inspection_time
        type: string
      - field: inspection_address_line1
        type: string
      - field: inspection_address_line2
        type: string
      - field: inspection_region
        type: string
      - field: inspection_city
        type: string
      - field: company_reg_code
        type: string
      - field: company_name
        type: string
      - field: company_country_code
        type: string
      - field: company_address_line1
        type: string
      - field: company_address_line2
        type: string
      - field: company_city
        type: string
      - field: company_postal_code
        type: string
      - field: driver_first_name
        type: string
      - field: driver_last_name
        type: string
      - field: vehicle_reg_nr
        type: string
      - field: vehicle_make
        type: string
      - field: vehicle_model
        type: string
      - field: vehicle_country_code
        type: string
      - field: vehicle_vin
        type: string
      - field: vehicle_first_registration
        type: string
      - field: vehicle_body_type
        type: string
      - field: licence_copy_number
        type: string
      - field: violation_description
        type: string
      - field: minor_violations_count
        type: string
      - field: sanction_code
        type: string
      - field: sanction_notes
        type: string
      - field: recommended_measure_code
        type: string
      - field: recommended_measure_notes
        type: string
      - field: recommended_measure_general_notes
        type: string
      - field: inspector_first_name
        type: string
      - field: inspector_last_name
        type: string
      - field: inspector_organisation_id
        type: string
      - field: inspector_unit
        type: string
      - field: inspector_profession
        type: string

getForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/foreign-violation-form/get"
    headers:
      type: json
    body:
      id: ${incoming.body.form_id}
  result: res
  next: buildAuditData

buildAuditData:
  assign:
    old_reporting_country_code: "${res.response.body[0].reportingCountryCode || ''}"
    old_reporting_authority: "${res.response.body[0].reportingAuthorityName || ''}"
    old_inspection_country_code: "${res.response.body[0].inspectionCountryCode || ''}"
    old_inspection_date: "${res.response.body[0].inspectionDate || ''}"
    old_inspection_time: "${res.response.body[0].inspectionTime || ''}"
    old_inspection_address_line1: "${res.response.body[0].inspectionAddressLine1 || ''}"
    old_inspection_address_line2: "${res.response.body[0].inspectionAddressLine2 || ''}"
    old_inspection_region: "${res.response.body[0].inspectionRegion || ''}"
    old_inspection_city: "${res.response.body[0].inspectionCity || ''}"
    old_company_reg_code: "${res.response.body[0].companyRegCode || ''}"
    old_company_name: "${res.response.body[0].companyName || ''}"
    old_company_country_code: "${res.response.body[0].companyCountryCode || ''}"
    old_company_address_line1: "${res.response.body[0].companyAddressLine1 || ''}"
    old_company_address_line2: "${res.response.body[0].companyAddressLine2 || ''}"
    old_company_city: "${res.response.body[0].companyCity || ''}"
    old_company_postal_code: "${res.response.body[0].companyPostalCode || ''}"
    old_driver_first_name: "${res.response.body[0].driverFirstName || ''}"
    old_driver_last_name: "${res.response.body[0].driverLastName || ''}"
    old_vehicle_reg_nr: "${res.response.body[0].vehicleRegNr || ''}"
    old_vehicle_make: "${res.response.body[0].vehicleMake || ''}"
    old_vehicle_model: "${res.response.body[0].vehicleModel || ''}"
    old_vehicle_country_code: "${res.response.body[0].vehicleCountryCode || ''}"
    old_vehicle_vin: "${res.response.body[0].vehicleVin || ''}"
    old_vehicle_first_registration: "${res.response.body[0].vehicleFirstRegistration || ''}"
    old_vehicle_body_type: "${res.response.body[0].vehicleBodyType || ''}"
    old_licence_copy_number: "${res.response.body[0].licenceCopyNumber || ''}"
    old_violation_description: "${res.response.body[0].violationDescription || ''}"
    old_minor_violations_count: "${res.response.body[0].minorViolationsCount || ''}"
