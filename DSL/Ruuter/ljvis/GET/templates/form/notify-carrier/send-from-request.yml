declaration:

  version: "1.0"
  description: >-
    Vedajale raske rikkumise teavituse saatmine PPA (sõidu-puhkeaeg, TRAM-kaart)
    ja Transpordiameti (tehnovormid) kontrollvormidelt. Kasutaja märgib linnukese
    vormi KINNITAMISEL (notifications.carrier_notification_request), saatmine
    toimub avalikustamisel. Kutsutakse iga avalikustamise järel; kui vormil ei
    ole avatud tellimust või rikkumistes ei ole MSI/VSI/SI koodi, ei tee
    midagi (tellimus jääb avatuks, kuni sobiv avalikustamine saabub).
    Saatmine: sama 'carrier_violation' Postkasti mall ja aadress (äriregistri
    e-post) mis välisriigi kontrollkaardil. Viga saatmisel logitakse
    outbound_log-i error-reana, tellimus jääb avatuks ja avalikustamist ei
    tühistata. Tellimus märgitakse saadetuks ainult edukal saatmisel.

    Ettevõtte, sõiduki ja kontrolli andmed võetakse koondvormilt
    (compoundFormKey); TRAM-kaardil, millel koondvormi pole, annab need kutsuja
    (companyRegCode, companyName, controlDate, controlTime, controlCountryCode,
    vehicleRegNr, trailers).

    Tagastab JSON-stringi: {"sent":"true|false"}.
  namespace: service
  allowlist:
    body:
      - field: entityType
        type: string
      - field: entityId
        type: string
      - field: compoundFormKey
        type: string
      - field: formNumber
        type: string
      - field: violations
        type: string
      - field: createdBy
        type: string
      - field: companyRegCode
        type: string
      - field: companyName
        type: string
      - field: controlDate
        type: string
      - field: controlTime
        type: string
      - field: controlCountryCode
        type: string
      - field: vehicleRegNr
        type: string
      - field: trailers
        type: string

extractInputs:
  assign:
    entity_type: "${incoming.body.entityType || ''}"
    entity_id: "${incoming.body.entityId || ''}"
    compound_form_key: "${incoming.body.compoundFormKey || ''}"
    form_number: "${incoming.body.formNumber || ''}"
    violations: "${incoming.body.violations || ''}"
    created_by: "${incoming.body.createdBy || 'system'}"
    company_reg_code: "${(incoming.body.companyRegCode || '').trim()}"
    company_name: "${incoming.body.companyName || ''}"
    control_date: "${incoming.body.controlDate || ''}"
    control_time: "${incoming.body.controlTime || ''}"
    control_country_code: "${incoming.body.controlCountryCode || ''}"
    vehicle_reg_nr: "${incoming.body.vehicleRegNr || ''}"
    trailers: "${incoming.body.trailers || '[]'}"
    sent: "false"
  next: checkEntity

checkEntity:
  switch:
    - condition: ${entity_type === '' || entity_id === ''}
      next: returnResult
  next: getOpenRequest

getOpenRequest:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/notification/get_open_carrier_request"
    headers:
      type: json
    body:
      entity_type: ${entity_type}
      entity_id: ${entity_id}
  result: openRequestRes
  error: returnResult
  next: checkOpenRequest

checkOpenRequest:
  switch:
    - condition: ${openRequestRes.response.body == null || openRequestRes.response.body.length === 0}
      next: returnResult
  next: extractSeverities

# Teavitatakse ainult raskete rikkumiste (MSI, VSI, SI) korral; MI ei kuulu siia.
# violations on JSON (rikkumiste massiivid, sh sisemised massiivid) — arvesse
# lähevad ainult tuvastatud read (isDetected != false). Kui JSON-it ei saa
# lugeda, otsitakse koode tekstist.
extractSeverities:
  assign:
    request_id: "${openRequestRes.response.body[0].id}"
    violation_codes: >-
      ${(() => {
        var out = [];
        function walk(x) {
          if (x == null) return;
          if (Array.isArray(x)) { x.forEach(walk); return; }
          if (typeof x === 'string') {
            var p;
            try { p = JSON.parse(x); } catch (e) { out.push(x); return; }
            if (p !== x) { walk(p); } else { out.push(x); }
            return;
          }
          if (typeof x === 'object') {
            if (x.isDetected === false || x.isDetected === 'false') return;
            var c = x.violationCode || x.code;
            if (c) out.push(String(c));
          }
        }
        walk(String(violations));
        var codes = out.map(function(c) { return String(c).toUpperCase().replace(/[ _-]/g, ''); })
          .filter(function(c) { return /^(MSI|VSI|SI)[0-9]+$/.test(c); });
        if (codes.length === 0) {
          codes = (String(violations).toUpperCase().match(/(?:^|[^A-Z])(?:MSI|VSI|SI)[ _-]*[0-9]+/g) || [])
            .map(function(c) { return c.replace(/^[^A-Z]/, '').replace(/[ _-]/g, ''); });
        }
        return Array.from(new Set(codes)).join(',');
      })()}
    violation_severities: >-
      ${(() => {
        var sev = String(violation_codes).split(',').filter(Boolean)
          .map(function(c) { return c.match(/^(MSI|VSI|SI)/)[1]; });
        return Array.from(new Set(sev)).join(', ');
      })()}
  next: checkSeriousViolation

checkSeriousViolation:
  switch:
    - condition: ${violation_severities === ''}
      next: returnResult
  next: checkLoadCompound

checkLoadCompound:
  switch:
    - condition: ${compound_form_key !== '' && company_reg_code === ''}
      next: getCompoundForm
  next: buildMessageData

getCompoundForm:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/compound-form/get"
    headers:
      type: json
    body:
      id: ${compound_form_key}
  result: compoundRes
  error: buildMessageData
  next: applyCompound

applyCompound:
  assign:
    company_reg_code: "${(compoundRes.response.body && compoundRes.response.body[0] && ('' + (compoundRes.response.body[0].companyRegCode || '')).trim()) || ''}"
    company_name: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].companyName) || ''}"
    control_date: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].controlDate) || ''}"
    control_time: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].controlTime) || ''}"
    control_country_code: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].controlCountryCode) || ''}"
    vehicle_reg_nr: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].vehicleRegNr) || ''}"
    trailers: "${(compoundRes.response.body && compoundRes.response.body[0] && compoundRes.response.body[0].trailers) || '[]'}"
  next: buildMessageData

# Sõiduki ja haagiste registreerimisnumbrid ühes loetelus (komaga eraldatud).
buildMessageData:
  assign:
    vehicle_and_trailers: >-
      ${(() => {
        var list = [String(vehicle_reg_nr || '').trim()];
        try {
          JSON.parse(trailers || '[]').forEach(function(t) { list.push(String((t && t.regNr) || '').trim()); });
        } catch (e) {}
        return list.filter(Boolean).join(', ');
      })()}
    inspection_date_time: "${(String(control_date || '') + ' ' + String(control_time || '')).trim()}"
    inspection_country: "${control_country_code}"
  next: checkCountry

checkCountry:
  switch:
    - condition: ${inspection_country === ''}
      next: callGetViolationNames
  next: callGetCountryName

callGetCountryName:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_country_name"
    headers:
      type: json
    body:
      code: ${inspection_country}
  result: countryNameRes
  error: callGetViolationNames
  next: applyCountryName

applyCountryName:
  assign:
    inspection_country: "${(countryNameRes.response.body && countryNameRes.response.body[0] && countryNameRes.response.body[0].name) || inspection_country}"
  next: callGetViolationNames

# Rikkumiskoodide nimetused klassifikaatoritest; leidmata koodi puhul näidatakse ainult koodi.
callGetViolationNames:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/classifier/get_violation_names"
    headers:
      type: json
    body:
      codes: ${violation_codes}
  result: violationNamesRes
  error: buildViolationList
  next: buildViolationList

# Rikkumised raskusastme kaupa: MSIViolationsList / VSIViolationsList / SIViolationsList.
# Üks rikkumine rea kohta („VSI869 — nimetus"), ridade vahel <br> (Postkasti mall on HTML).
# Raskusastmel rikkumisi ei ole -> tühi string.
buildViolationList:
  assign:
    MSIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^MSI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
    VSIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^VSI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
    SIViolationsList: >-
      ${(() => {
        var names = {};
        var rows = (violationNamesRes && violationNamesRes.response && violationNamesRes.response.body) || [];
        rows.forEach(function(r) { names[r.code] = r.name; });
        function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        return String(violation_codes).split(',').filter(function(c) { return /^SI[0-9]/.test(c); }).map(function(c) {
          return names[c] ? esc(c) + ' — ' + esc(names[c]) : esc(c);
        }).join('<br>');
      })()}
  next: lookupCarrierEmail

lookupCarrierEmail:
  template: "templates/xroad/lookup-carrier-registry-email"
  requestType: GET
  headers:
    cookie: ${incoming.headers.cookie}
  body:
    companyRegCode: ${company_reg_code}
    sourceType: ${entity_type}
    sourceRecordId: ${entity_id}
  result: carrierLookupResult
  error: markCarrierEmailLookupFailed
  next: parseCarrierLookupResult

parseCarrierLookupResult:
  assign:
    carrier_email: >-
      ${(() => {
        try { return (JSON.parse(carrierLookupResult) || {}).email || ''; }
        catch (e) { return ''; }
      })()}
  next: sendCarrierNotification

# Otsingu viga: kutsutakse ikka tühja aadressiga, et send-postkast.yml logiks
# korrektse "error" rea outbound_log-i (sama muster mis VR-kaardil).
markCarrierEmailLookupFailed:
  assign:
    carrier_email: ""
  next: sendCarrierNotification

sendCarrierNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-postkast"
    headers:
      type: json
    body:
      notification_type: "carrier_violation"
      recipient_email: ${carrier_email}
      language: "et"
      send_time: ""
      related_entity_type: ${entity_type}
      related_entity_id: ${entity_id}
      original_log_id: ""
      created_by: ${created_by}
      template_variables: "${ { formNumber: form_number, companyName: company_name, companyRegCode: company_reg_code, inspectionDateTime: inspection_date_time, inspectionCountryCode: control_country_code, inspectionCountry: inspection_country, vehicleRegNr: vehicle_and_trailers, violationSeverities: violation_severities, violationDescription: (MSIViolationsList + (MSIViolationsList && (VSIViolationsList || SIViolationsList) ? '<br>' : '') + VSIViolationsList + (VSIViolationsList && SIViolationsList ? '<br>' : '') + SIViolationsList), MSIViolationsList: MSIViolationsList, VSIViolationsList: VSIViolationsList, SIViolationsList: SIViolationsList } }"
  result: carrierNotifRes
  error: returnResult
  next: checkCarrierSent

checkCarrierSent:
  switch:
    - condition: ${carrierNotifRes.response != null && carrierNotifRes.response.status >= 200 && carrierNotifRes.response.status < 300 && carrierNotifRes.response.body != null && carrierNotifRes.response.body.status !== 'error'}
      next: markRequestSent
  next: returnResult

markRequestSent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/notification/mark_carrier_request_sent"
    headers:
      type: json
    body:
      id: ${request_id}
  result: markSentRes
  error: returnResult
  next: setSent

setSent:
  assign:
    sent: "true"
  next: returnResult

returnResult:
  return: '${JSON.stringify({ sent: sent })}'
  next: end
