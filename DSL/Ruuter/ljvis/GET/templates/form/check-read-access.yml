declaration:

  version: "1.0"
  description: "Read-ownership decision for one form (epic #502, A2 read). Returns the plain string `allow` or `deny`. The caller is the authenticated TARA session (guard variable session_personal_code); permissions and organisation are looked up server-side and are NEVER accepted from the request. Rule: the creator can always read their own form regardless of status; a published form is readable with the form type's read permission; an unpublished form is also readable by an authorised colleague or a holder of control_form.view_unpublished. A form that does not exist yet answers `allow` so the calling handler can return 404 or fall back to the archive."
  namespace: service
  strict: true
  allowlist:
    body:
      - field: form_type
        type: string
      - field: form_key
        type: string
      - field: form_number
        type: string

validateInput:
  assign:
    form_key: "${incoming.body.form_key == null ? '' : String(incoming.body.form_key)}"
    form_number: "${incoming.body.form_number == null ? '' : String(incoming.body.form_number)}"
  next: checkInput

checkInput:
  switch:
    - condition: ${['adr-form','compound-form','drive-rest-form/driver','drive-rest-form/teammate','foreign-violation-form','good-repute','labour-inspection','trailer-technical','tram-card','transport-interruption','vehicle-technical'].indexOf(incoming.body.form_type) === -1}
      next: deny
    - condition: ${form_key === '' && form_number === ''}
      next: deny
    - condition: ${form_key !== '' && !/^[0-9]+$/.test(form_key)}
      next: deny
    - condition: ${form_number !== '' && !/^[A-Za-z0-9-]+$/.test(form_number)}
      next: deny
    - condition: ${session_personal_code == null || session_personal_code === ''}
      next: deny
  next: lookupCaller

lookupCaller:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/get_user_permissions_by_personal_code"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      personal_code: ${session_personal_code}
  result: caller_res
  next: checkCaller

checkCaller:
  switch:
    - condition: ${caller_res.response.body == null || caller_res.response.body.length === 0}
      next: deny
  next: assignCaller

assignCaller:
  assign:
    caller_org: "${caller_res.response.body[0].organisationid == null ? '' : String(caller_res.response.body[0].organisationid)}"
    caller_view_unpublished: "${(caller_res.response.body[0].permissions || []).includes('control_form.view_unpublished') ? 'true' : 'false'}"
    caller_view_organisation: "${(caller_res.response.body[0].permissions || []).includes('control_form.view_organisation') ? 'true' : 'false'}"
  next: resolveReadPermission

resolveReadPermission:
  assign:
    required_read_permission: "${({'adr-form':'adr_form.read','compound-form':'compound_form.read','drive-rest-form/driver':'sp_driver_form.read','drive-rest-form/teammate':'sp_teammate_form.read','foreign-violation-form':'foreign_violation_form.read','good-repute':'good_repute_form.read','labour-inspection':'labour_inspection_form.read','trailer-technical':'trailer_technical_form.read','tram-card':'tram_driver_form.read','transport-interruption':'transport_interruption_form.read','vehicle-technical':'vehicle_technical_form.read'})[incoming.body.form_type] || '__no_such_permission__'}"
  next: resolveCallerReadPermission

resolveCallerReadPermission:
  assign:
    caller_can_read_type: "${(caller_res.response.body[0].permissions || []).includes(required_read_permission) ? 'true' : 'false'}"
  next: checkAccess

checkAccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/check-read-access"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      form_type: ${incoming.body.form_type}
      form_key: ${form_key}
      form_number: ${form_number}
      caller_personal_code: ${session_personal_code}
      caller_organisation_id: ${caller_org}
      caller_can_read_type: ${caller_can_read_type}
      caller_view_unpublished: ${caller_view_unpublished}
      caller_view_organisation: ${caller_view_organisation}
  result: access_res
  next: evaluate

evaluate:
  switch:
    - condition: ${access_res?.response?.body != null && access_res.response.body.length === 0}
      next: allow
    - condition: ${String(access_res?.response?.body?.[0]?.allowed) === 'true'}
      next: allow
  next: deny

allow:
  return: "allow"
  status: 200
  next: end

deny:
  return: "deny"
  status: 200
  next: end
