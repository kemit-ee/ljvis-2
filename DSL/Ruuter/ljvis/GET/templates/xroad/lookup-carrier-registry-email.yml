declaration:

  version: "1.0"
  description: >-
    Ühine äriregistri (arireg.detailandmed_v1) e-posti otsingu + logimise
    tee (NCR->välisriigi kontrollkaart andmeülekande testimise plaan, p.8).
    Varem kutsuti XTR-i otse mitmes kohas (foreign-violation-form/edit/publish.yml
    lookupCarrierRegistryData, ja punkt 6 UI jaoks planeeritud uus otspunkt)
    igaüks oma käsitsi lisatud xroad.xroad_integration_log kirjega — see
    template koondab loogika ÜHTE kohta, et kõik kutsujad (save.yml,
    carrier-registry-email.yml GET otspunkt) logiksid täpselt samamoodi ja
    samale service_code'ile ('arireg.detailandmed_v1.v1'), nagu ka
    DSL/Ruuter/ljvis/POST/v1/xroad/arireg/detailandmed.yml kasutab.
    NB: erinevalt detailandmed.yml-ist, mis logib response_xml tühjana,
    logib SEE template reaalse vastuse (JSON.stringify) — kliendi kaebus
    "ei näe logikirjet" tuleneb tõenäoliselt sellest, et vastust ise ei
    saanud kunagi kontrollida, ainult see, et kutse üldse toimus.
    Tagastab JSON-stringina: {"email":"...","found":true|false}.
  namespace: service
  allowlist:
    body:
      - field: companyRegCode
        type: string
      - field: sourceType
        type: string
      - field: sourceRecordId
        type: string

extractParams:
  assign:
    company_reg_code: "${(incoming.body.companyRegCode || '').trim()}"
    source_type: "${incoming.body.sourceType || ''}"
    source_record_id: "${incoming.body.sourceRecordId || ''}"
    start_time: "${new Date().getTime()}"
  next: checkRegCode

checkRegCode:
  switch:
    - condition: ${company_reg_code === ''}
      next: returnEmpty
  next: callXtr

callXtr:
  call: http.post
  args:
    url: "[#LJVIS_XTR]/ar/detailandmed_v1"
    headers:
      type: json
    body:
      reg_code: ${company_reg_code}
  result: carrierRegistryRes
  error: logNetworkFailure
  next: checkStatus

checkStatus:
  switch:
    - condition: >-
        ${carrierRegistryRes.response == null || carrierRegistryRes.response.status == null || carrierRegistryRes.response.status < 200 || carrierRegistryRes.response.status >= 300}
      next: logStatusFailure
  next: logSuccess

logSuccess:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.detailandmed_v1.v1"
      request_xml: "${'regCode=' + company_reg_code}"
      response_xml: "${JSON.stringify(carrierRegistryRes.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: true
      error_message: ""
      person_identifier: ""
      source_type: ${source_type}
      source_record_id: ${source_record_id}
  result: logRes
  error: extractEmail
  next: extractEmail

logStatusFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.detailandmed_v1.v1"
      request_xml: "${'regCode=' + company_reg_code}"
      response_xml: "${JSON.stringify(carrierRegistryRes.response.body)}"
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "${'XTR HTTP ' + carrierRegistryRes.response.status}"
      person_identifier: ""
      source_type: ${source_type}
      source_record_id: ${source_record_id}
  result: logFailRes
  error: returnNotFound
  next: returnNotFound

logNetworkFailure:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/log_integration"
    headers:
      type: json
    body:
      service_code: "arireg.detailandmed_v1.v1"
      request_xml: "${'regCode=' + company_reg_code}"
      response_xml: ""
      duration_ms: "${new Date().getTime() - start_time}"
      success: false
      error_message: "Äriregister ei ole kättesaadav või päring aegus"
      person_identifier: ""
      source_type: ${source_type}
      source_record_id: ${source_record_id}
  result: logNetFailRes
  error: returnNotFound
  next: returnNotFound

# Päris X-tee (arireg.detailandmed_v1) SOAP->JSON vastus mähib kõik väljad
# ümber 'ns1:detailandmed_v1Response.ns1:keha...' ja iga võti on 'ns1:'
# prefiksiga (nt 'ns1:sidevahendid', mitte 'sidevahendid') — algne loogika
# eeldas prefiksita võtmeid ja mängis seetõttu alati tühja, mistõttu email
# jäi alati "määramata", kuigi äriregistris oli olemas.
# 'g' loeb välja nii prefiksiga kui ilma, et see toimiks ka vanade
# testide/mockide prefiksita näidisandmetega.
# XTR ise tagastab oma HTTP vastuse kujul {"body": {...ns1 sisu...},
# "headers": {...}} — carrierRegistryRes.response.body ON SEE ÜMBRIS, mitte
# ns1 sisu ise, mistõttu tegelik sisu on üks tase sügavamal
# (carrierRegistryRes.response.body.body). Ilma selle lahtipakkimiseta
# kukub 'g' kett vaikimisi alati oma sisendile tagasi ja email jääb tühjaks,
# kuigi äriregistris on kehtiv e-post olemas (nt Askend Estonia OÜ, reg 14133207).
extractEmail:
  assign:
    carrier_email: >-
      ${(() => {
        var body = carrierRegistryRes.response && carrierRegistryRes.response.body && carrierRegistryRes.response.body.body;
        if (!body) return '';
        var g = function(obj, name) {
          if (!obj) return undefined;
          return obj[name] !== undefined ? obj[name] : obj['ns1:' + name];
        };
        var resp = g(body, 'detailandmed_v1Response') || body;
        var keha = g(resp, 'keha') || resp;
        var ettevotjad = g(keha, 'ettevotjad') || keha;
        var itemNode = g(ettevotjad, 'item') || ettevotjad;
        var company = Array.isArray(itemNode) ? itemNode[0] : itemNode;
        if (!company) return '';
        var yld = g(company, 'yldandmed') || company;
        var sv = g(yld, 'sidevahendid') || g(company, 'sidevahendid');
        var svItem = sv ? (g(sv, 'item') || sv) : null;
        var svList = Array.isArray(svItem) ? svItem : (svItem ? [svItem] : []);
        var matches = svList.filter(function(s) {
          var liik = g(s, 'liik');
          return s && typeof liik === 'string' && liik.toUpperCase().indexOf('EMAIL') !== -1;
        });
        // eelista kirjet, millel ei ole lõppkuupäeva (praegu kehtiv)
        var active = matches.find(function(s) { return !g(s, 'lopp_kpv'); });
        var match = active || matches[0];
        if (!match) return '';
        return g(match, 'sisu') || g(match, 'vaartus') || g(match, 'value') || '';
      })()}
  next: returnResult

returnResult:
  return: "${JSON.stringify({ email: carrier_email, found: carrier_email !== '' })}"
  next: end

returnNotFound:
  return: '{"email":"","found":false}'
  next: end

returnEmpty:
  return: '{"email":"","found":false}'
  next: end
