# LJVIS2-12: nightly deactivation of users whose access_end has passed.
# Logic lives in DSL/Ruuter.internal/ljvis/POST/users/deactivate-expired.yml
# + DSL/Resql/ljvis/POST/user/deactivate_expired_users.sql — this file only
# schedules the call.
#
# Runs at 02:00 Tallinn time (TZ pinned in docker-compose.yml).
deactivate_expired_users:
  trigger: "0 0 2 * * ?"
  type: exec
  command: curl -sf --retry 2 --retry-delay 60 -X POST "${RUUTER_INTERNAL}/ljvis/users/deactivate-expired" || true
  allowedEnvs:
    - RUUTER_INTERNAL
