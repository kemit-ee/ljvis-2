# Generated by scripts/generate-erru-xtr-requests.py.
erru_xtr_async_requests:
  trigger: "*/1 * * * * ?"
  type: http
  method: POST
  url: http://ruuter-internal:8080/ljvis/cron/erru-xtr-async-requests
  headerEnvs:
    x-internal-service-token: INTERNAL_COMMUNICATION_KEY
  retryCount: 0
  ignoreFailures: true
