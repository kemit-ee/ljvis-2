# LJVIS2-135/58/23: hourly sync of extraordinary technical inspection
# status. Logic lives in DSL/Ruuter.internal/ljvis/POST/cron/yvkehtivus-sync.yml
# (candidate selection, X-Road query, in-place field write, audit).
#
# Runs at minute 5 of every hour (offset from :00 to avoid contending with
# other on-the-hour jobs). Trigger is Quartz-cron, evaluated in the
# container's local time — set TZ=Europe/Tallinn if needed.
yvkehtivus_sync:
  trigger: "0 5 * * * ?"
  type: http
  method: POST
  url: http://ruuter-internal:8080/ljvis/cron/yvkehtivus-sync
  retryCount: 2
  retryDelay: 60000
  ignoreFailures: true
