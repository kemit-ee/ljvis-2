# ADR-010: kolib kustutatud kontrollvormid töö-baasist eraldi arhiiv-andmebaasi
# (copy → verify → real delete). Vt DSL/Ruuter.internal/ljvis/POST/cron/archive-deleted-forms.yml.
#
# PR A: trigger on INERTNE (2099) — voog ja SQL on valmis ja testitav käsitsi
# (POST http://ruuter-internal:8080/ljvis/cron/archive-deleted-forms), aga
# automaatset kustutamist veel ei toimu. Aktiveeritakse PR B-s: trigger: "0 0 0/2 * * ?"
# (iga 2h täistunnil, Europe/Tallinn).
archive_deleted_forms:
  trigger: "0 0 0 1 1 ? 2099"
  type: http
  method: POST
  url: http://ruuter-internal:8080/ljvis/cron/archive-deleted-forms
  retryCount: 2
  retryDelay: 60000
  ignoreFailures: true
