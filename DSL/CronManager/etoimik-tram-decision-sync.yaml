# Runs at 01:15 Tallinn time (TZ pinned in docker-compose.yml) — between the
# labour-inspection e-toimik sync (01:00) and the PPA sp-driver sync (01:30) to
# avoid XTR contention.
etoimik_tram_decision_sync:
  trigger: "0 15 1 * * ?"
  type: exec
  command: ./scripts/ljvis/call-ruuter-internal.sh /cron/etoimik-tram-decision-sync
  retryCount: 2
  retryDelay: 60000
  ignoreFailures: true
