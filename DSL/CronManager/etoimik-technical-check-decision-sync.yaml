# LJVIS2-72 15 ettepanekut p9: nightly sync of vehicle/trailer technical-check
# enforcement decisions from e-toimik. Logic lives in
# DSL/Ruuter.internal/ljvis/POST/cron/etoimik-technical-check-decision-sync.yml
# (candidate selection, X-Road query, in-place field write, audit).
#
# Runs every 3 hours (00:08, 03:08, ...) Tallinn time (TZ pinned in docker-compose.yml).
# Staggered against the other e-toimik syncs to avoid XTR contention.
etoimik_technical_check_decision_sync:
  trigger: "0 8 */3 * * ?"
  type: http
  method: POST
  url: http://ruuter-internal:8080/ljvis/cron/etoimik-technical-check-decision-sync
  headerEnvs:
    x-internal-service-token: INTERNAL_COMMUNICATION_KEY
  retryCount: 2
  retryDelay: 60000
  ignoreFailures: true
