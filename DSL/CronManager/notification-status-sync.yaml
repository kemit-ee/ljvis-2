# LJVIS2-47: Postkast 2.0 ei push'i saatmise lõpptulemust ise (12-1 §"Saatmis-
# staatuse värskendamine") — see töö küsib iga 5 min lõppstaatuseta ('queued' /
# 'in_progress') teavituste saatmisoperatsioonide seisu X-tee kaudu ja
# värskendab notifications.outbound_log staatuseid.
notification_status_sync:
  trigger: "0 */5 * * * ?"
  type: http
  method: POST
  url: http://ruuter-internal:8080/ljvis/cron/notification-status-sync
  retryCount: 2
  retryDelay: 30000
  ignoreFailures: true
