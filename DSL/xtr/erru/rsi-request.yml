# RoadSideInspection_Request — notifies the ERRU MOVEHUB of a failed roadside inspection.
#
# Service: RSI ReqRes (separate from the main ERRU ReqRes endpoint).
#
# technicalId/workflowId are generated by Ruuter (send.yml) BEFORE this call and stored
# for correlation — see ctud-request.yml comment for the same rationale.
#
# IdentificationDetails is a choice in the ERRU 3.5 XSD: either TransportUndertakingDetails
# (a company operating the vehicle under a community licence) or HolderDetails (the vehicle's
# registered holder — a Company or a NaturalPerson — when there is no transport undertaking).
# The branch is picked from the officer's explicit form choice, passed by Ruuter as the
# `isTuHolder` / `isCompanyHolder` flags ('true' or ''). Do NOT infer it from whether a name
# is present: a transport undertaking without a real community licence is legitimately
# recorded with a placeholder (e.g. "N/A", seen in real inbound RSI traffic), which a
# truthiness check would read as "present".
#
# checkedItems is a JSON array param (built in Ruuter's convertCheckedItems step) rendered
# with the `{{#each}}` loop below — keep it that way, do NOT build the fragment as a string
# in Ruuter. The 3.5 schemas declare elementFormDefault="qualified" and the erru namespace is
# only bound on soapenv:Envelope, so every element (CheckedItem, FailedChecks, FailedCheck)
# must carry the erru: prefix or MOVEHUB rejects the envelope. The loop also lets `xml_attr`
# handle attribute escaping.
#
# Endpoint URLs:
#   Acceptance: https://webgate.acceptance.ec.testa.eu/move-hub/RSI/soap/ReqRes/RSI.svc
#   Production:  https://webgate.ec.testa.eu/move-hub/RSI/soap/ReqRes/RSI.svc

params:
  - rsiTo
  - businessCaseId
  - technicalId
  - workflowId
  - originatingAuthority
  - requestSource
  - requestPurpose
  - vehicleRegistrationNumber
  - vehicleRegistrationCountry
  - vehicleCategory
  - vehicleIdentificationNumber
  - odometerReading
  - inspectionIdentifier
  - inspectionLocation
  - inspectionDatetime
  - inspectionAuthorityOrName
  - inspectionPassed
  - ptiRequested
  - vehicleProhibitionOrRestriction
  - driverFirstName
  - driverFamilyName
  - driverLicenceNumber
  - driverLicenceCountry
  - isTuHolder
  - isCompanyHolder
  - transportUndertakingName
  - communityLicenceNumber
  - holderRegistrationCertificate
  - holderCompanyName
  - holderFirstName
  - holderFamilyName
  - tuAddress
  - tuPostCode
  - tuCity
  - tuCountry
  - checkedItems
  - sentAt

method: POST

service: https://webgate.acceptance.ec.testa.eu/move-hub/RSI/soap/ReqRes/RSI.svc

soap_action: RoadSideInspection_Request

envelope: >
  <?xml version="1.0" encoding="UTF-8"?>
  <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                    xmlns:erru="https://webgate.ec.testa.eu/move-hub/erru/3.5">
    <soapenv:Header/>
    <soapenv:Body>
      <erru:RoadSideInspection_Request>
        <erru:Header version="3.5"
                     technicalId="{{#if technicalId}}{{technicalId}}{{else}}{{generate.uuid}}{{/if}}"
                     workflowId="{{#if workflowId}}{{workflowId}}{{else}}{{generate.uuid}}{{/if}}"
                     sentAt="{{sentAt}}"
                     from="EE"
                     to="{{rsiTo}}"/>
        <erru:Body businessCaseId="{{businessCaseId}}"
                   originatingAuthority="{{originatingAuthority}}"
                   requestSource="{{requestSource}}"
                   requestPurpose="{{requestPurpose}}">
          <erru:InspectionDetails {{#if inspectionIdentifier}}inspectionIdentifier="{{inspectionIdentifier}}"{{/if}}
                                  inspectionLocation="{{inspectionLocation}}"
                                  inspectionDateTime="{{inspectionDatetime}}"
                                  inspectionAuthorityOrName="{{inspectionAuthorityOrName}}">
            <erru:InspectionResult inspectionPassed="{{inspectionPassed}}"
                                   vehicleProhibitionOrRestriction="{{vehicleProhibitionOrRestriction}}"
                                   ptiRequested="{{ptiRequested}}"/>
          </erru:InspectionDetails>
          <erru:IdentificationDetails>
            <erru:VehicleDetails vehicleRegistrationNumber="{{vehicleRegistrationNumber}}"
                                 vehicleRegistrationCountry="{{vehicleRegistrationCountry}}"
                                 vehicleIdentificationNumber="{{vehicleIdentificationNumber}}"
                                 vehicleCategory="{{vehicleCategory}}"
                                 odometerReading="{{#if odometerReading}}{{odometerReading}}{{else}}0{{/if}}"/>
            <erru:DriverDetails firstName="{{#if driverFirstName}}{{driverFirstName}}{{else}}Unknown{{/if}}"
                                familyName="{{#if driverFamilyName}}{{driverFamilyName}}{{else}}Unknown{{/if}}"
                                {{#if driverLicenceNumber}}drivingLicenceNumber="{{driverLicenceNumber}}"{{/if}}
                                {{#if driverLicenceCountry}}drivingLicenceCountry="{{driverLicenceCountry}}"{{/if}}/>
            {{#if isTuHolder}}
            <erru:TransportUndertakingDetails transportUndertakingName="{{transportUndertakingName}}"
                                              communityLicenceNumber="{{communityLicenceNumber}}">
              <erru:TransportUndertakingAddress address="{{tuAddress}}"
                                                postCode="{{tuPostCode}}"
                                                city="{{tuCity}}"
                                                country="{{tuCountry}}"/>
            </erru:TransportUndertakingDetails>
            {{else}}
            <erru:HolderDetails {{#if holderRegistrationCertificate}}registrationCertificate="{{holderRegistrationCertificate}}"{{/if}}>
              {{#if isCompanyHolder}}
              <erru:Company companyName="{{#if holderCompanyName}}{{holderCompanyName}}{{else}}Unknown{{/if}}"
                            address="{{#if tuAddress}}{{tuAddress}}{{else}}Unknown{{/if}}"
                            postCode="{{#if tuPostCode}}{{tuPostCode}}{{else}}00000{{/if}}"
                            city="{{#if tuCity}}{{tuCity}}{{else}}Unknown{{/if}}"
                            country="{{#if tuCountry}}{{tuCountry}}{{else}}EE{{/if}}"/>
              {{else}}
              <erru:NaturalPerson firstName="{{#if holderFirstName}}{{holderFirstName}}{{else}}Unknown{{/if}}"
                                  familyName="{{#if holderFamilyName}}{{holderFamilyName}}{{else}}Unknown{{/if}}"
                                  address="{{#if tuAddress}}{{tuAddress}}{{else}}Unknown{{/if}}"
                                  postCode="{{#if tuPostCode}}{{tuPostCode}}{{else}}00000{{/if}}"
                                  city="{{#if tuCity}}{{tuCity}}{{else}}Unknown{{/if}}"
                                  country="{{#if tuCountry}}{{tuCountry}}{{else}}EE{{/if}}"/>
              {{/if}}
            </erru:HolderDetails>
            {{/if}}
          </erru:IdentificationDetails>
          <erru:CheckedItems>
            {{#each checkedItems}}
            <erru:CheckedItem itemType="{{xml_attr this.itemType}}" itemFailed="{{xml_attr this.itemFailed}}">
              {{#if this.failedChecks}}
              <erru:FailedChecks>
                {{#each this.failedChecks}}
                <erru:FailedCheck failedReason="{{xml_attr this.failedReason}}" failedAssessment="{{xml_attr this.failedAssessment}}"/>
                {{/each}}
              </erru:FailedChecks>
              {{/if}}
            </erru:CheckedItem>
            {{/each}}
          </erru:CheckedItems>
        </erru:Body>
      </erru:RoadSideInspection_Request>
    </soapenv:Body>
  </soapenv:Envelope>
