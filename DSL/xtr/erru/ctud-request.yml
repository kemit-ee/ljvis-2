# CheckTransportUndertakingData_Request — sends a CTUD query to the ERRU MOVEHUB.
#
# Because `service:` is set, XTR posts this envelope straight to the MOVEHUB over
# s-TESTA — no X-Road Security Server, no client certificate (server-side TLS only).
# The host must therefore have s-TESTA network access.
#
# technicalId/workflowId are generated by Ruuter (send.yml) BEFORE this call and stored,
# so the async ACK/response can be correlated by workflowId. The {{generate.uuid}}
# fallback below only fires if Ruuter forwards an empty value.
#
# Endpoint URLs:
#   Acceptance: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc
#   Production:  https://webgate.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

params:
  - ctudTo
  - businessCaseId
  - technicalId
  - workflowId
  - originatingAuthority
  - requestSource
  - requestPurpose
  - transportUndertakingName
  - communityLicenceNumber
  - vehicleRegistrationNumber
  - vehicleRegistrationCountry
  - requestAllVehicles
  - sentAt

method: POST

service: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

# Required by MOVEHUB's SOAP 1.1 WSDL binding (ERRU-ReqRes-WSDL-Acceptance.xml).
soap_action: CheckTransportUndertakingData_Request

envelope: >
  <?xml version="1.0" encoding="UTF-8"?>
  <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                    xmlns:erru="https://webgate.ec.testa.eu/move-hub/erru/3.5">
    <soapenv:Header/>
    <soapenv:Body>
      <erru:CheckTransportUndertakingData_Request>
        <erru:Header version="3.5"
                     technicalId="{{#if technicalId}}{{technicalId}}{{else}}{{generate.uuid}}{{/if}}"
                     workflowId="{{#if workflowId}}{{workflowId}}{{else}}{{generate.uuid}}{{/if}}"
                     sentAt="{{sentAt}}"
                     from="EE"
                     to="{{ctudTo}}"/>
        <erru:Body businessCaseId="{{businessCaseId}}"
                   originatingAuthority="{{originatingAuthority}}"
                   requestSource="{{requestSource}}"
                   requestPurpose="{{requestPurpose}}">
          <erru:SearchedCompany requestAllVehicles="{{requestAllVehicles}}">
            {{#if transportUndertakingName}}
              {{#if communityLicenceNumber}}
                <erru:SearchByLicenceAndName transportUndertakingName="{{transportUndertakingName}}"
                                             communityLicenceNumber="{{communityLicenceNumber}}">
                  {{#if vehicleRegistrationNumber}}
                  <erru:Vehicle vehicleRegistrationNumber="{{vehicleRegistrationNumber}}"
                                vehicleRegistrationCountry="{{vehicleRegistrationCountry}}"/>
                  {{/if}}
                </erru:SearchByLicenceAndName>
              {{else}}
                <erru:SearchByNameAndVehicle transportUndertakingName="{{transportUndertakingName}}">
                  <erru:Vehicle vehicleRegistrationNumber="{{vehicleRegistrationNumber}}"
                                vehicleRegistrationCountry="{{vehicleRegistrationCountry}}"/>
                </erru:SearchByNameAndVehicle>
              {{/if}}
            {{else}}
              <erru:SearchByLicenceAndVehicle communityLicenceNumber="{{communityLicenceNumber}}">
                <erru:Vehicle vehicleRegistrationNumber="{{vehicleRegistrationNumber}}"
                              vehicleRegistrationCountry="{{vehicleRegistrationCountry}}"/>
              </erru:SearchByLicenceAndVehicle>
            {{/if}}
          </erru:SearchedCompany>
        </erru:Body>
      </erru:CheckTransportUndertakingData_Request>
    </soapenv:Body>
  </soapenv:Envelope>
