# CheckGoodRepute_Request — sends a CGR query to the ERRU MOVEHUB.
#
# SOAP service: ERRU ReqRes (same endpoint as CTUD/NCR/NU).
#
# technicalId/workflowId are generated by Ruuter (send.yml) BEFORE this call and stored
# for correlation — see ctud-request.yml comment for the same rationale.
#
# Search mode is selected by Handlebars conditionals:
#  - tmFirstName/tmFamilyName present  →  TransportManagerNameDetails  (+optional certificate)
#  - only certificateNumber present    →  TransportManagerCertificateDetails only
#
# Endpoint URLs:
#   Acceptance: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc
#   Production:  https://webgate.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

params:
  - cgrTo
  - businessCaseId
  - technicalId
  - workflowId
  - originatingAuthority
  - requestSource
  - requestPurpose
  - tmFirstName
  - tmFamilyName
  - tmDateOfBirth
  - tmPlaceOfBirth
  - tmFirstNameSearchKey
  - tmFamilyNameSearchKey
  - certificateNumber
  - certificateIssueDate
  - certificateIssueCountry
  - sentAt

method: POST

service: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

soap_action: CheckGoodRepute_Request

envelope: >
  <?xml version="1.0" encoding="UTF-8"?>
  <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                    xmlns:erru="https://webgate.ec.testa.eu/move-hub/erru/3.5">
    <soapenv:Header/>
    <soapenv:Body>
      <erru:CheckGoodRepute_Request>
        <erru:Header version="3.5"
                     technicalId="{{#if technicalId}}{{technicalId}}{{else}}{{generate.uuid}}{{/if}}"
                     workflowId="{{#if workflowId}}{{workflowId}}{{else}}{{generate.uuid}}{{/if}}"
                     sentAt="{{sentAt}}"
                     from="EE"
                     to="{{cgrTo}}"/>
        <erru:Body businessCaseId="{{businessCaseId}}"
                   originatingAuthority="{{originatingAuthority}}"
                   requestSource="{{requestSource}}"
                   requestPurpose="{{requestPurpose}}">
          <erru:SearchedTransportManager>
            {{#if tmFirstName}}
              <erru:TransportManagerNameDetails firstName="{{tmFirstName}}"
                                                familyName="{{tmFamilyName}}"
                                                dateOfBirth="{{tmDateOfBirth}}"
                                                {{#if tmPlaceOfBirth}}placeOfBirth="{{tmPlaceOfBirth}}"{{/if}}
                                                {{#if tmFamilyNameSearchKey}}familyNameSearchKey="{{tmFamilyNameSearchKey}}"{{/if}}
                                                {{#if tmFirstNameSearchKey}}firstNameSearchKey="{{tmFirstNameSearchKey}}"{{/if}}/>
              {{#if certificateNumber}}
              <erru:TransportManagerCertificateDetails certificateNumber="{{certificateNumber}}"
                                                       certificateIssueDate="{{certificateIssueDate}}"
                                                       certificateIssueCountry="{{certificateIssueCountry}}"/>
              {{/if}}
            {{else}}
              <erru:TransportManagerCertificateDetails certificateNumber="{{certificateNumber}}"
                                                       certificateIssueDate="{{certificateIssueDate}}"
                                                       certificateIssueCountry="{{certificateIssueCountry}}"/>
            {{/if}}
          </erru:SearchedTransportManager>
        </erru:Body>
      </erru:CheckGoodRepute_Request>
    </soapenv:Body>
  </soapenv:Envelope>
