# NotifyCheckResult_Response — sends Estonia's response to an incoming NCR from another MS.
#
# When another country notifies Estonia of an infringement by an Estonian transport
# undertaking, Estonia stores the incoming NCR and later sends back this response.
#
# The `ncrTo` param is the ORIGINATING country (the one that sent the request),
# since after processing Estonia sends the response BACK to them via the hub.
# `workflowId` MUST be the workflowId of the incoming request (Ruuter fetches it from
# the stored inbound case — see response-send.yml) so the hub can correlate the reply.
# `technicalId` is a fresh UUID generated by Ruuter for this outbound message.
#
# TransportUndertaking and PenaltiesImposed are `minOccurs="0"` in the 3.5 XSD, so the
# response is schema-valid without them; they are emitted whenever Ruuter has a
# transportUndertakingName, which the officer's response form always collects.
#
# penaltiesImposed is a JSON array param (built in Ruuter's buildPenaltiesImposed step)
# rendered with the `{{#each}}` loop below — keep it that way, do NOT build the fragment as a
# string in Ruuter. The 3.5 schemas declare elementFormDefault="qualified" and the erru
# namespace is only bound on soapenv:Envelope, so PenaltyImposed must carry the erru: prefix
# or MOVEHUB rejects the envelope. The loop also lets `xml_attr` handle attribute escaping.
#
# Endpoint URLs:
#   Acceptance: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc
#   Production:  https://webgate.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

params:
  - ncrTo
  - businessCaseId
  - technicalId
  - workflowId
  - originatingAuthority
  - respondingAuthority
  - responseStatusCode
  - transportUndertakingName
  - communityLicenceNumber
  - numberOfVehicles
  - communityLicenceStatus
  - tuAddress
  - tuPostCode
  - tuCity
  - tuCountry
  - penaltiesImposed
  - sentAt

method: POST

service: https://webgate.acceptance.ec.testa.eu/move-hub/ERRU/soap/ReqRes/ERRU.svc

soap_action: NotifyCheckResult_Response

envelope: >
  <?xml version="1.0" encoding="UTF-8"?>
  <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                    xmlns:erru="https://webgate.ec.testa.eu/move-hub/erru/3.5">
    <soapenv:Header/>
    <soapenv:Body>
      <erru:NotifyCheckResult_Response>
        <erru:Header version="3.5"
                     technicalId="{{#if technicalId}}{{technicalId}}{{else}}{{generate.uuid}}{{/if}}"
                     workflowId="{{#if workflowId}}{{workflowId}}{{else}}{{generate.uuid}}{{/if}}"
                     sentAt="{{sentAt}}"
                     from="EE"
                     to="{{ncrTo}}"/>
        <erru:Body businessCaseId="{{businessCaseId}}"
                   originatingAuthority="{{originatingAuthority}}"
                   respondingAuthority="{{respondingAuthority}}"
                   statusCode="{{responseStatusCode}}">
          {{#if transportUndertakingName}}
          <erru:TransportUndertaking transportUndertakingName="{{transportUndertakingName}}"
                                     numberOfVehicles="{{#if numberOfVehicles}}{{numberOfVehicles}}{{else}}0{{/if}}"
                                     communityLicenceNumber="{{communityLicenceNumber}}"
                                     communityLicenceStatus="{{#if communityLicenceStatus}}{{communityLicenceStatus}}{{else}}Active{{/if}}">
            <erru:TransportUndertakingAddress address="{{tuAddress}}"
                                              postCode="{{tuPostCode}}"
                                              city="{{tuCity}}"
                                              country="{{tuCountry}}"/>
          </erru:TransportUndertaking>
          {{/if}}
          {{#if penaltiesImposed}}
          <erru:PenaltiesImposed>
            {{#each penaltiesImposed}}
            <erru:PenaltyImposed penaltyRequestedIdentifier="{{xml_attr this.penaltyRequestedIdentifier}}"
                                 authorityImposingPenalty="{{xml_attr this.authorityImposingPenalty}}"
                                 isImposed="{{xml_attr this.isImposed}}"
                                 penaltyTypeImposed="{{xml_attr this.penaltyTypeImposed}}"
                                 {{#if this.startDate}}startDate="{{xml_attr this.startDate}}"{{/if}}
                                 {{#if this.endDate}}endDate="{{xml_attr this.endDate}}"{{/if}}
                                 {{#if this.reason}}reason="{{xml_attr this.reason}}"{{/if}}/>
            {{/each}}
          </erru:PenaltiesImposed>
          {{/if}}
        </erru:Body>
      </erru:NotifyCheckResult_Response>
    </soapenv:Body>
  </soapenv:Envelope>
