declaration:
  internal: false

  version: "1.0"
  description: >-
    AJ usagePeriod - ajavahemik, mille kohta saab kasutusteavet pärida
    (Andmejälgija kasutusteabe esitamise protokoll v1.6.1 §6.2, X-tee teenus
    findUsage, otspunkt /v2/usagePeriod). periodStart on MIN(logtime) tabelis,
    tühja tabeli korral praegune ajahetk (väli on kohustuslik). Resql tagastab
    veeru period_start camelCase kujul periodStart. periodEnd jäetakse
    välja - kirjeid saab küsida kuni praeguse ajani.
  namespace: xroad-aj
  allowlist:
    params: []

queryPeriod:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/xroad/aj/usage_period"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: periodResult
  next: checkStatus

checkStatus:
  switch:
    - condition: "${periodResult.response.status < 200 || periodResult.response.status >= 300}"
      next: returnServerError
    - condition: "${!periodResult.response.body || !periodResult.response.body[0] || !periodResult.response.body[0].periodStart}"
      next: returnServerError
  next: buildResponse

buildResponse:
  assign:
    response_body:
      periodStart: "${periodResult.response.body[0].periodStart}"
  next: returnOk

returnOk:
  status: 200
  wrapper: false
  return: ${response_body}
  next: end

returnServerError:
  status: 500
  wrapper: false
  return:
    error: SERVER_ERROR
    message: Internal error
  next: end
