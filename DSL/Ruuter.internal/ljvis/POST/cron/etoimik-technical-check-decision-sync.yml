returnSummary:
  status: 200
  return: "${({ vehicleCandidatesChecked: vehicleCandidates.length, vehicleDecisionsApplied: vehicleResults.filter(r => r.applied).length, trailerCandidatesChecked: trailerCandidates.length, trailerDecisionsApplied: trailerResults.filter(r => r.applied).length, failures: vehicleResults.filter(r => !r.success).length + trailerResults.filter(r => !r.success).length })}"
  next: end
