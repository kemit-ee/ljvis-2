declaration:
  internal: false
  returns: []

  version: "1.0"
  description: >-
    Nightly batch (ADR-002 otsus 3): for every confirmed forms.tram_control_card
    with a väärteomenetlus reference number + an Estonian driver personal code
    and no enforcement_decision yet, ask e-toimik (AnnaIsikuKvalifikatsioonid)
    whether a decision has entered into force. If it has, a new published
    snapshot is appended (auto-publish); otherwise a no-op. Mirrors the
    labour-inspection sync (etoimik-decision-sync.yml). Called by CronManager at
    01:15 Europe/Tallinn (DSL/CronManager/etoimik-tram-decision-sync.yaml).
  namespace: cron
  allowlist:
    body: []

fetchCandidates:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/control-forms/tram-card/select_etoimik_candidates"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: candidatesRes
  next: assignCandidates

assignCandidates:
  assign:
    candidates: "${candidatesRes.response.body || []}"
  next: processCandidates

# `iterate`'s `do:` runs as a flat sequence - `next:` inside it is ignored,
# and `return` would abort the whole batch, not just this candidate. So
# every branch (XTR failure / not found / found) is folded into the single
# `decision` assign below, and the write calls after it always fire;
# apply_etoimik_decision.sql itself no-ops when found=false.
processCandidates:
  iterate:
    over: "${candidates}"
    as: candidate
    max_items: 1000
    do:
      - assign:
          candidate_key: "${String(candidate.id)}"
          reference_number: "${candidate.proceedingReferenceNumber || candidate.proceeding_reference_number || ''}"
          driver_personal_code: "${candidate.driverPersonalCode || candidate.driver_personal_code || ''}"
          person_first_name: "${candidate.personFirstName || candidate.person_first_name || ''}"
          person_last_name: "${candidate.personLastName || candidate.person_last_name || ''}"
          person_birth_date: "${String(candidate.personBirthDate || candidate.person_birth_date || '').substring(0, 10)}"

      # Otsing käib ühe sisemise lõpp-punkti kaudu: isikukoodiga päring, ja kui see
      # midagi ei leia ning nimi + sünniaeg on olemas, teine päring nime ja sünniajaga
      # (XSD-choice: isikukoodi ja nime ühes päringus ei saada). Logimine toimub seal.
      - call: http.post
        args:
          url: "[#LJVIS_RUUTER_INTERNAL]/etoimik/lookup-decision"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            case_number: "${['YLD', 'general'].includes(candidate.proceedingType || candidate.proceeding_type || '') ? reference_number : ''}"
            reference_number: "${['YLD', 'general'].includes(candidate.proceedingType || candidate.proceeding_type || '') ? '' : reference_number}"
            personal_code: ${driver_personal_code}
            first_name: ${person_first_name}
            last_name: ${person_last_name}
            birth_date: ${person_birth_date}
            service_code: "etoimik.AnnaIsikuKvalifikatsioonid.v6.cron.tram"
            source_type: "tram_control_card"
            source_record_id: ${candidate_key}
        result: lookupRes

      - assign:
          decision: "${lookupRes.response != null && lookupRes.response.status >= 200 && lookupRes.response.status < 300 && lookupRes.response.body && lookupRes.response.body.response ? lookupRes.response.body.response : { success: false, found: false, resultStatus: 'error', enforcementDecision: '', proceedingClosureBasis: '', errorMessage: 'etoimik/lookup-decision ebaõnnestus', rawResponse: '' }}"

      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/control-forms/tram-card/apply_etoimik_decision"
          headers:
            Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            key: ${candidate_key}
            found: "${decision.found ? 'true' : 'false'}"
            enforcementDecision: "${decision.enforcementDecision}"
            proceedingClosureBasis: "${decision.proceedingClosureBasis}"
            created_by: "eToimik öine uuendus"
        result: applyRes

      # apply_etoimik_decision.sql returns 0 rows unless found=true (and its
      # own status='confirmed' guard passes), so published_now tells us
      # whether a publish actually happened - needed because the audit
      # write below always fires (same no-branching constraint as above).
      - assign:
          published_now: "${!!(applyRes.response.body && applyRes.response.body[0])}"
          published_form_number: "${(applyRes.response.body && applyRes.response.body[0] && (applyRes.response.body[0].formNumber || applyRes.response.body[0].form_number)) || ''}"

      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/control-forms/tram-card/log_etoimik_publish_audit"
          headers:
            Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            found: "${published_now ? 'true' : 'false'}"
            key: ${candidate_key}
            form_number: ${published_form_number}
            driver_personal_code: ${driver_personal_code}
        result: auditRes

      # Automaatne avalikustamine ei käi läbi edit/publish.yml-i: saada vedajale raske rikkumise
      # teavitus, kui kasutaja märkis kinnitamisel „Teavita vedajat". Teenus ei tee midagi, kui
      # tellimust ei ole või vorm ei ole avalikustatud (tingimusteta kutse, vt ülaltoodud muster).
      - call: http.post
        args:
          url: "[#LJVIS_RUUTER_INTERNAL]/notification/send-carrier-from-request"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            entity_type: "tram_control_card"
            entity_id: ${candidate_key}
            created_by: "eToimik öine uuendus"
        result: carrierNotifRes
      - call: http.post
        args:
          url: "[#LJVIS_RUUTER_INTERNAL]/risk-scores/recalculate/from-form"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            form_type: "tram_control_card"
            form_key: "${String(candidate_key)}"
        result: riskRecalcRes

    collect: "${({ id: candidate.id, found: decision.found, published: published_now, success: decision.success && riskRecalcRes.response != null && riskRecalcRes.response.status >= 200 && riskRecalcRes.response.status < 300 })}"
    into: results
  next: returnSummary

returnSummary:
  status: 200
  return: "${({ total: candidates.length, succeeded: results.filter(r => r.success).length, candidatesChecked: candidates.length, decisionsApplied: results.filter(r => r.found).length, published: results.filter(r => r.published).length, failures: results.filter(r => !r.success).length })}"
  next: end
