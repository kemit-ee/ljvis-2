declaration:
  internal: false

  version: "1.0"
  description: >-
    Öine partii (LJVIS2-64): iga AVALIKUSTATUD autojuhi / meeskonnaliikme
    sõidu- ja puhkeaja alamvormi kohta, mille kontrolli tulemus on KORRAS
    (result_type='ok') ja mille sõiduk on välisriigi oma, ehitab ja saadab
    automaatselt NCR (NotifyCheckResult) teate sõiduki registreerimisriiki.

    Iga kandidaadi kohta: eeltäida NCR mustand (erru/ncr/build - sama loogika
    mis käsitsi „Lisa NCR vorm", ncrTo = compound_form.vehicle_country_code,
    originatingAuthority eeltäidetakse build.sql-is kontrollkaardi inspektori
    asutusest), loe valmis kirje
    (erru/ncr/get), reserveeri ümbrik (erru/ncr/begin-send), saada ERRU 3.5 XML-ina
    läbi adapteri ([#ERRU_XML_ADAPTER]) ja salvesta üleminek (sending → sent, → error või
    → send_unknown). Kinnitus ja vastus tulevad hiljem (ncr/inbound-ack, ncr/inbound-response).
    Iga katse - õnnestunud või mitte - kirjutab ühe rea
    erru.ncr_autodispatch_log tabelisse; see hoiab partii idempotentsena
    (select-autodispatch-candidates.sql välistab juba logitud alamvormid).
    Kindla tagasilükkamise korral jääb NCR olekusse error ja ametnik saadab selle
    käsitsi uuesti (send.yml). Ebaselge tulemus (send_unknown) jääb samuti ametniku
    kontrollida. Cron ei proovi kunagi uuesti.

    Kutsub CronManager 02:00 Europe/Tallinn
    (DSL/CronManager/erru-ncr-autodispatch.yaml). Sama „lame iterate-jada"
    muster nagu cron/etoimik-sp-driver-decision-sync.yml - do: sees ei ole
    next:/return, kõik harud on koondatud arvutatud assign'idesse ja
    kirjutuskutsed käivituvad alati (no-op halva sisendiga).

    Kandidaadi täpsed eeldused (millised kontrollkaardi väljad peavad olema
    täidetud) ja tehtud otsused on loetletud select-autodispatch-candidates.sql
    päises (#328 p3 / #329). requestPurpose="Control" ja requestSource="RSI" on
    väljaminevate NCR teadete ERRU-spetsi süsteemikonstandid.
  namespace: cron
  allowlist:
    body: []

fetchCandidates:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/select-autodispatch-candidates"
    headers:
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body: {}
  result: candidatesRes
  next: assignCandidates

assignCandidates:
  assign:
    candidates: "${candidatesRes.response.body || []}"
  next: processCandidates

processCandidates:
  iterate:
    over: "${candidates}"
    as: candidate
    max_items: 1000
    do:
      - assign:
          sp_form_key: "${String(candidate.id)}"
          sp_form_type: "${candidate.spFormType || candidate.sp_form_type || ''}"
          ncr_to: "${((candidate.ncrTo || candidate.ncr_to || '') + '').toUpperCase()}"
          case_start: "${new Date().getTime()}"

      # 1) Eeltäida NCR mustand (initiated). build.sql tuletab kõik väljad
      #    SP alamvormist + compound_form'ist; ncrTo anname siit.
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/build"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            spFormKey: ${sp_form_key}
            spFormType: ${sp_form_type}
            # tühi -> build.sql eeltäidab kontrollkaardi inspektori asutusest (#328 p3)
            originatingAuthority: ""
            requestSource: "RSI"
            requestPurpose: "Control"
            ncrTo: ${ncr_to}
            handlerPersonalCode: ""
            handlerName: "Automaatne (CronManager)"
            created_by: "erru-cron"
        result: buildRes

      - assign:
          build_ok: "${!!(buildRes.response && buildRes.response.body && buildRes.response.body.length === 1)}"
          business_case_id: "${(buildRes.response && buildRes.response.body && buildRes.response.body[0] && (buildRes.response.body[0].businessCaseId || buildRes.response.body[0].business_case_id)) || ''}"

      # 2) Loe valmis kirje (hub-päringu keha, nagu send.yml).
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/get"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            businessCaseId: ${business_case_id}
        result: caseRes

      - assign:
          current: "${(caseRes.response && caseRes.response.body && caseRes.response.body.length) ? caseRes.response.body[caseRes.response.body.length - 1] : {}}"

      # originating_authority (build.sql pani kontrollkaardi inspektori asutuse
      # koodi, nt PPA) -> ERRU hub'i jaoks inglisekeelne nimi, sama mäpp mis
      # send.yml originating_authority_out.
      - assign:
          authority_code: "${current.originatingAuthority || current.originating_authority || ''}"
      - assign:
          authority_out: >-
            ${authority_code === 'KLIM' ? 'Ministry of Climate'
              : authority_code === 'PPA' ? 'Estonian Police and Border Guard Board'
              : authority_code === 'TRAM' ? 'Estonian Transport Administration'
              : authority_code === 'TI' ? 'Estonian Labour Inspectorate'
              : authority_code === 'MTA' ? 'Estonian Tax and Customs Board'
              : (authority_code || '[#ERRU_NCR_ORIGINATING_AUTHORITY]')}

      # 3) Reserveeri ümbrik (initiated|error -> sending). Kui build ebaõnnestus, on
      #    business_case_id tühi ja reserveering ei anna rida (no-op).
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/begin-send"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            businessCaseId: "${build_ok ? business_case_id : ''}"
            created_by: "erru-cron"
        result: reserveRes

      - assign:
          reserved: "${!!(reserveRes.response && reserveRes.response.body && reserveRes.response.body.length === 1)}"
          technical_id: "${(reserveRes.response && reserveRes.response.body && reserveRes.response.body[0] && reserveRes.response.body[0].technicalId) || ''}"
          workflow_id: "${(reserveRes.response && reserveRes.response.body && reserveRes.response.body[0] && reserveRes.response.body[0].workflowId) || ''}"
          sent_at: "${(reserveRes.response && reserveRes.response.body && reserveRes.response.body[0] && reserveRes.response.body[0].sentAt) || ''}"

      # 4) Saada ERRU 3.5 XML-ina läbi adapteri. Ilma reserveeringuta on identifikaatorid
      #    tühjad, adapter vastab 422 ega saada midagi.
      - call: http.post
        args:
          url: "[#ERRU_XML_ADAPTER]/internal/ncr/send"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            ncrTo: ${ncr_to}
            businessCaseId: ${business_case_id}
            technicalId: ${technical_id}
            workflowId: ${workflow_id}
            sentAt: ${sent_at}
            originatingAuthority: ${authority_out}
            requestSource: "${current.requestSource || current.request_source || ''}"
            requestPurpose: "${current.requestPurpose || current.request_purpose || ''}"
            transportUndertakingName: "${current.transportUndertakingName || current.transport_undertaking_name || ''}"
            communityLicenceNumber: "${current.communityLicenceNumber || current.community_licence_number || ''}"
            vehicleRegistrationNumber: "${current.vehicleRegistrationNumber || current.vehicle_registration_number || ''}"
            vehicleRegistrationCountry: "${current.vehicleRegistrationCountry || current.vehicle_registration_country || ''}"
            checkResult: "${current.checkResult || current.check_result || ''}"
            checkDate: "${current.checkDate || current.check_date || ''}"
            minorInfringement: "${current.minorInfringement || current.minor_infringement || ''}"
            seriousInfringements: "${current.seriousInfringements || current.serious_infringements || ''}"
        result: erruRes

      # 5) Arvuta tulemus. Ainult Hubi HTTP 202 on 'sent'; kindel tagasilükkamine on 'error'
      #    (ametnik saadab käsitsi uuesti); ebaselge tulemus on 'send_unknown' (EI saadeta uuesti).
      - assign:
          result: >-
            ${(function(){
              if (!build_ok) {
                return { outcome: 'build_failed', errorMessage: 'erru/ncr/build tagastas 0 rida - SP alamvorm või compound_form kadus vahepeal', raw: JSON.stringify(buildRes.response && buildRes.response.body) };
              }
              if (!reserved) {
                return { outcome: 'error', errorMessage: 'NCR ei olnud reserveeritav (olek ei luba saatmist)', raw: '' };
              }
              var res = erruRes && erruRes.response;
              var body = res && res.body;
              if (res != null && res.status === 200 && body != null && body.status === 'accepted' && body.httpStatus === 202 && body.technicalId === technical_id && body.workflowId === workflow_id) {
                return { outcome: 'sent', errorMessage: '', raw: JSON.stringify(body) };
              }
              if (body != null && body.status === 'rejected') {
                return { outcome: 'error', errorMessage: 'ERRU lükkas NCR päringu tagasi (' + (body.code || body.httpStatus || 'rejected') + ')', raw: JSON.stringify(body) };
              }
              return { outcome: 'send_unknown', errorMessage: 'NCR saatmise tulemus on teadmata, ära saada uuesti', raw: JSON.stringify(body || '') };
            })()}

      # 6a) Hubi 202 -> 'sent' (kinnitus ja vastus tulevad hiljem; sending -> acknowledged võib olla
      #     juba salvestatud, siis on see no-op).
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            businessCaseId: "${result.outcome === 'sent' ? business_case_id : ''}"
            newStatus: "sent"
            ackStatusCode: ""
            ackStatusMessage: ""
            respondingAuthority: ""
            transportUndertakingName: ""
            responseStatusCode: ""
            responseStatusMessage: ""
            responseNumberOfVehicles: ""
            responseCommunityLicenceStatus: ""
            responseAddress: ""
            responsePenaltiesImposed: ""
            errorMessage: ""
            created_by: "erru-cron"
        result: sentRes

      # 6b) Kindel tagasilükkamine -> 'error'.
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            businessCaseId: "${result.outcome === 'error' && reserved ? business_case_id : ''}"
            newStatus: "error"
            ackStatusCode: ""
            ackStatusMessage: ""
            respondingAuthority: ""
            transportUndertakingName: ""
            responseStatusCode: ""
            responseStatusMessage: ""
            responseNumberOfVehicles: ""
            responseCommunityLicenceStatus: ""
            responseAddress: ""
            responsePenaltiesImposed: ""
            errorMessage: "${result.errorMessage || 'ERRU NCR viga'}"
            created_by: "erru-cron"
        result: errRes

      # 6c) Ebaselge tulemus -> 'send_unknown'.
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/append-transition"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            businessCaseId: "${result.outcome === 'send_unknown' ? business_case_id : ''}"
            newStatus: "send_unknown"
            ackStatusCode: ""
            ackStatusMessage: ""
            respondingAuthority: ""
            transportUndertakingName: ""
            responseStatusCode: ""
            responseStatusMessage: ""
            responseNumberOfVehicles: ""
            responseCommunityLicenceStatus: ""
            responseAddress: ""
            responsePenaltiesImposed: ""
            errorMessage: "${result.errorMessage || 'NCR saatmise tulemus on teadmata'}"
            created_by: "erru-cron"
        result: unknownRes

      # 7) Dispatch-logi rida (idempotentsuse võti).
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/erru/ncr/log-autodispatch"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            spFormKey: ${sp_form_key}
            spFormType: ${sp_form_type}
            businessCaseId: ${business_case_id}
            ncrTo: ${ncr_to}
            outcome: ${result.outcome}
            errorMessage: "${result.errorMessage || ''}"
            created_by: "erru-cron"
        result: logRes

      # 8) X-Road integratsioonilogi (nagu teised cronid).
      - call: http.post
        args:
          url: "[#LJVIS_RESQL]/xroad/log_integration"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            service_code: "erru.ncr.autodispatch.v1.cron"
            request_xml: "${'spFormKey=' + sp_form_key + ';spFormType=' + sp_form_type + ';ncrTo=' + ncr_to + ';businessCaseId=' + business_case_id}"
            response_xml: "${result.raw || ''}"
            duration_ms: "${new Date().getTime() - case_start}"
            success: ${result.outcome === 'sent'}
            error_message: "${result.errorMessage || ''}"
            person_identifier: ""
            source_type: "${sp_form_type === 'teammate' ? 'sp_teammate_form' : 'sp_driver_form'}"
            source_record_id: ${sp_form_key}
        result: xroadLogRes
    collect: "${({ id: candidate.id, type: sp_form_type, outcome: result.outcome, businessCaseId: business_case_id })}"
    into: results
  next: returnSummary

returnSummary:
  status: 200
  return: "${({ candidatesChecked: candidates.length, sent: results.filter(r => r.outcome === 'sent').length, sendUnknown: results.filter(r => r.outcome === 'send_unknown').length, errors: results.filter(r => r.outcome === 'error').length, buildFailed: results.filter(r => r.outcome === 'build_failed').length })}"
  next: end
