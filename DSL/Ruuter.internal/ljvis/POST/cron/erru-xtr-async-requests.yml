  error: returnDone
  next: parseOneWay

parseOneWay:
  assign:
    oneway: "${oneway_res.response.body != null && Array.isArray(oneway_res.response.body) ? oneway_res.response.body.map(function(r) { return JSON.parse(r.result); }) : []}"
  next: replayOneWay

replayOneWay:
  iterate:
    over: "${oneway}"
    as: pending
    max_items: 3
    do:
      - call: http.post
        args:
          url: "${'[#LJVIS_RUUTER_INTERNAL]/erru/xtr/inbound/' + pending.messageType}"
