    claims: "${claim_res.response.body != null && Array.isArray(claim_res.response.body) ? claim_res.response.body.map(function(r) { return JSON.parse(r.result); }) : []}"
  next: decideClaims

decideClaims:
  switch:
    - condition: ${claims.length === 0}
      next: dueOneWay
  next: processClaims

# Up to 3 rows per tick, one after the other (each holds a 6 minute lease from the claim; one worker run is bounded by
# its 45 s inbound + 25 s /xml-out timeouts). A failing call ends the run: the remaining rows are recovered when their lease expires.
processClaims:
  iterate:
    over: "${claims}"
    as: claimed
    max_items: 3
    do:
      - call: http.post
        args:
          url: "${'[#LJVIS_RUUTER_INTERNAL]/erru/xtr/worker/' + claimed.messageType}"
          headers:
            x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
            type: json
          body:
            inboxId: ${claimed.inboxId}
            attempts: ${claimed.attempts}
            requestJson: ${claimed.requestJson}
            rawXml: ${claimed.rawXml}
            receivedAt: ${claimed.receivedAt}
            deadlineAtMs: ${claimed.deadlineAtMs}
            responseTechnicalId: ${claimed.responseTechnicalId}
            errorTechnicalId: ${claimed.errorTechnicalId}
        result: worker_res
        timeout: 150000
  next: dueOneWay

# Recovery of the one-way messages (acknowledgements and responses): a row the inbound flow sent back for a retry (status received,
# next_attempt_at due) is replayed through the same xtr/inbound/<message> route (its accept takes the claim over), at most 3 per tick.
dueOneWay:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/xml-inbox/due-oneway"
    headers:
      Authorization: "Bearer [#RESQL_INTER_SERVICE_TOKEN]"
      x-internal-service-token: "[#INTERNAL_COMMUNICATION_KEY]"
      type: json
    body:
      messageTypes: "NotifyUnfitness_Acknowledgement,NotifyCheckResult_Acknowledgement,NotifyCheckResult_Response,RoadSideInspection_Response,CheckGoodRepute_Response,CheckTransportUndertakingData_Response"
