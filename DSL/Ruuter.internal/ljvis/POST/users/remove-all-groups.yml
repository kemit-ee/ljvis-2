declaration:
  call: declare
  version: 0.1
  description: "Remove all group memberships for a user (internal, used when org changes)"
  method: post
  accepts: json
  returns: json
  namespace: users
  allowlist:
    body:
      - field: userId
        type: string

extractRequestData:
  assign:
    user_id: "${incoming.body.userId}"

removeGroups:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/remove_all_groups_for_user"
    headers:
      type: json
    body:
      user_id: ${user_id}
  result: res

returnSuccess:
  return: "ok"
  next: end
