declaration:
  call: declare
  version: 0.1
  description: "Deactivate expired users - removes groups and sets status to inactive (called by cron)"
  method: post
  accepts: json
  returns: json
  namespace: users

extractRequestData:
  assign:
    created_by: "system"
  next: deactivateExpired

deactivateExpired:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/deactivate_expired_users"
    headers:
      type: json
    body:
      created_by: ${created_by}
  result: res
  next: checkDeactivated

checkDeactivated:
  switch:
    - condition: "${res.response.body.length == 0}"
      next: returnSuccess
  next: rebuildLatest

rebuildLatest:
  call: http.post
  args:
    url: "[#LJVIS_USERS_RESQL]/user/rebuild_user_account_latest"
    headers:
      type: json
    body:
      user_account_ids: "${res.response.body.map(r => r.id).join(',')}"
      created_by: ${created_by}
  result: latestRes
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
