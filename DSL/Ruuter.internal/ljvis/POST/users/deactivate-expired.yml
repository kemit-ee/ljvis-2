declaration:

  version: "1.1"
  description: >-
    Nightly cron (LJVIS2-12 AC#4). Deactivates every user whose access_end
    has passed — see deactivate_expired_users.sql for what "deactivate"
    means (status='inactive' + user_groups cleared, both in one snapshot
    row).
    Writes one aggregate audit event when at least one user was
    deactivated (no-op otherwise). Called by CronManager
    (DSL/CronManager/deactivate-expired-users.yaml).
  namespace: users

extractRequestData:
  assign:
    created_by: "system"
  next: deactivateExpired

deactivateExpired:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/user/deactivate_expired_users"
    headers:
      type: json
    body:
      created_by: ${created_by}
  result: res
  next: checkDeactivated

checkDeactivated:
  switch:
    - condition: "${res.response.body.length == 0}"
      next: returnSuccess
  next: logAuditEvent

# Direct call to the generic audit insert (not the GET templates/audit/
# log-audit-event chain) — that chain lives on public Ruuter and expects a
# session cookie, which this Ruuter.internal, cron-triggered endpoint never
# has (same reasoning as cron/etoimik-decision-sync.yml).
logAuditEvent:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/log/insert_audit_event"
    headers:
      type: json
    body:
      event_id: ""
      event_type: "user.deactivate"
      event_category: "user_management"
      actor_name: "system"
      actor_personal_code: ""
      description: "${'Öine protsess deaktiveeris ' + res.response.body.length + ' kasutaja(t) (ligipääsu lõpu kuupäev möödas)'}"
      log_content: "${JSON.stringify({ deactivatedCount: res.response.body.length, deactivatedUserAccountKeys: res.response.body.map(r => r.id), deactivatedPersonalCodes: res.response.body.map(r => r.personalCode || r.personal_code) })}"
      organisation_id: ""
      created_by: "system"
      trace_id: ""
      span_id: ""
  result: auditRes
  next: returnSuccess

returnSuccess:
  return: ${res.response.body}
  next: end
