declaration:
  version: "1.0"
  description: |
    Receive an INCOMING NCR (NotifyCheckResult) request from another member state and
    acknowledge it synchronously (LJVIS2-64 §4.4). Fully automatic: no user is involved, no
    ncr.* permission is required. Flow:
      1. Validate required ERRU envelope fields (technicalId, workflowId, from,
         businessCaseId, originatingAuthority, requestSource, requestPurpose,
         transportUndertakingName, communityLicenceNumber, vehicleRegistrationNumber,
         vehicleRegistrationCountry, checkResult, checkDate).
      2. Store a 'received' snapshot (append-inbound.sql, idempotent via partial unique
         index uq_ncr_inbound_technical_id).
      3. Read the persisted snapshot, including on duplicate delivery.
      4. Restore the idempotent notification for the stored check result and write one audit event through
         erru.record_inbound_audit. A failed side effect returns HTTP 502 for retry.
      5. Return NCRN_Ack only after both side effects have completed.

    minorInfringement/seriousInfringements arrive as JSON text, already split into
    category+infringementType (matching the request/save.yml convention).

    TODO(M2M): OAuth2 machine-token auth as per spec. Until Ruuter supports
    client_credentials this runs on ruuter-internal (port 8089, allowedIPs 127.0.0.1
    only) following the CGR/CTUD/RSI inbound-request precedent.
  namespace: erru
  allowlist:
    body:
      - field: technicalId
        type: string
      - field: workflowId
        type: string
      - field: sentAt
        type: string
      - field: from
        type: string
      - field: businessCaseId
        type: string
      - field: originatingAuthority
        type: string
      - field: requestSource
        type: string
      - field: requestPurpose
        type: string
      - field: transportUndertakingName
        type: string
      - field: communityLicenceNumber
        type: string
      - field: vehicleRegistrationNumber
        type: string
      - field: vehicleRegistrationCountry
        type: string
      - field: checkResult
        type: string
      - field: checkDate
        type: string
      - field: minorInfringement
        type: string
      - field: seriousInfringements
        type: string

validateEnvelope:
  switch:
    - condition: ${!(('' + (incoming.body.technicalId || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.workflowId || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.from || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.businessCaseId || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.originatingAuthority || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.requestSource || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.requestPurpose || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.transportUndertakingName || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.communityLicenceNumber || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.vehicleRegistrationNumber || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.vehicleRegistrationCountry || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.checkResult || '')).trim())}
      next: returnInvalidData
    - condition: ${!(('' + (incoming.body.checkDate || '')).trim())}
      next: returnInvalidData
  next: extractRequestData

extractRequestData:
  assign:
    technical_id: "${('' + (incoming.body.technicalId || '')).trim()}"
    workflow_id: "${('' + (incoming.body.workflowId || '')).trim()}"
    sent_at: "${('' + (incoming.body.sentAt || '')).trim()}"
    ncr_from: "${('' + (incoming.body.from || '')).trim().toUpperCase()}"
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    originating_authority: "${('' + (incoming.body.originatingAuthority || '')).trim()}"
    request_source: "${('' + (incoming.body.requestSource || '')).trim()}"
    request_purpose: "${('' + (incoming.body.requestPurpose || '')).trim()}"
    transport_undertaking_name: "${('' + (incoming.body.transportUndertakingName || '')).trim()}"
    community_licence_number: "${('' + (incoming.body.communityLicenceNumber || '')).trim()}"
    vehicle_registration_number: "${('' + (incoming.body.vehicleRegistrationNumber || '')).trim().toUpperCase()}"
    vehicle_registration_country: "${('' + (incoming.body.vehicleRegistrationCountry || '')).trim().toUpperCase()}"
    check_result: "${('' + (incoming.body.checkResult || '')).trim()}"
    check_date: "${('' + (incoming.body.checkDate || '')).trim()}"
    minor_infringement: "${('' + (incoming.body.minorInfringement || '')).trim()}"
    serious_infringements: "${('' + (incoming.body.seriousInfringements || '[]')).trim()}"
  next: storeReceived

storeReceived:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/append-inbound"
    headers:
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      ncrFrom: ${ncr_from}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      transportUndertakingName: ${transport_undertaking_name}
      communityLicenceNumber: ${community_licence_number}
      vehicleRegistrationNumber: ${vehicle_registration_number}
      vehicleRegistrationCountry: ${vehicle_registration_country}
      checkResult: ${check_result}
      checkDate: ${check_date}
      minorInfringement: ${minor_infringement}
      seriousInfringements: ${serious_infringements}
      created_by: "system"
  result: received_res
  next: checkStored

checkStored:
  switch:
    - condition: ${received_res.response == null || received_res.response.status >= 400}
      next: returnUnavailable
  next: lookupExisting

# checkResult on ERRU 3.5 XSD (NotifyCheckResult_Types) järgi 'Pass' | 'Fail' | 'CleanCheck'
# (chk_ncr_check_result). 'Fail' tähendab XSD dokumentatsiooni järgi rikkumise avastamist —
# sellele luuakse ncr_violation, Pass/CleanCheck korral ncr_ok.
# Teavitus on kohustuslik: salvestusviga annab 502, kordus on event_key järgi ohutu.
checkViolation:
  switch:
    - condition: ${check_result === 'Fail'}
      next: createNcrViolationNotification
    - condition: ${check_result === 'Pass' || check_result === 'CleanCheck'}
      next: createNcrOkNotification
  next: returnInvalidData

createNcrViolationNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      type: json
    body:
      type: "ncr_violation"
      required_permission: "ncr.read"
      related_entity_type: "ncr"
      related_entity_id: ${business_case_id}
      event_key: ${technical_id}
      title_et: "${'Saabus ERRU NCR rikkumisega kontrolli teade vedaja „' + transport_undertaking_name + '“ kohta'}"
      body_et: "${'Teate saatnud riik: ' + ncr_from}"
      created_by: "system"
  result: notifRes
  error: returnUnavailable
  next: checkNotification

createNcrOkNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      type: json
    body:
      type: "ncr_ok"
      required_permission: "ncr.read"
      related_entity_type: "ncr"
      related_entity_id: ${business_case_id}
      event_key: ${technical_id}
      title_et: "${'Saabus ERRU NCR „Korras“ kontrolli teade vedaja „' + transport_undertaking_name + '“ kohta'}"
      body_et: "${'Teate saatnud riik: ' + ncr_from}"
      created_by: "system"
  result: notifRes
  error: returnUnavailable
  next: checkNotification

checkNotification:
  switch:
    - condition: ${notifRes.response == null || notifRes.response.status >= 400}
      next: returnUnavailable
  next: buildAudit

lookupExisting:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/ncr/get-by-technical-id"
    headers:
      type: json
    body:
      technical_id: ${technical_id}
  result: existing_res
  next: checkExisting

checkExisting:
  switch:
    - condition: ${existing_res.response == null || existing_res.response.status >= 400 || existing_res.response.body == null || existing_res.response.body.length != 1}
      next: returnUnavailable
  next: restoreStoredMessage

restoreStoredMessage:
  assign:
    message_key: "${'' + existing_res.response.body[0].id}"
    business_case_id: "${existing_res.response.body[0].businessCaseId}"
    ncr_from: "${existing_res.response.body[0].ncrFrom}"
    transport_undertaking_name: "${existing_res.response.body[0].transportUndertakingName}"
    check_result: "${existing_res.response.body[0].checkResult}"
  next: checkViolation

buildAudit:
  assign:
    audit_description: "NCR sissetuleva päringu teenindamine: juhtum ${business_case_id}, saatnud riik ${ncr_from}, veoettevõtja ${transport_undertaking_name}, kontrolli tulemus ${check_result}"
    audit_log_content: "${JSON.stringify({businessCaseId: business_case_id || null, ncrFrom: ncr_from || null, transportUndertakingName: transport_undertaking_name || null, checkResult: check_result || null})}"
  next: logAudit

logAudit:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/record-inbound-audit"
    headers:
      type: json
    body:
      event_type: "ncr.inbound_request.serve"
      message_key: ${message_key}
      description: ${audit_description}
      log_content: ${audit_log_content}
  result: audit_result
  error: returnUnavailable
  next: checkAuditSaved

checkAuditSaved:
  switch:
    - condition: ${audit_result.response == null || audit_result.response.status >= 400 || !audit_result.response.body || audit_result.response.body.length !== 1}
      next: returnUnavailable
  next: returnAck

returnAck:
  return: '{"acknowledgementType":"NCRN_Ack","statusCode":"OK","statusMessage":""}'
  next: end

returnInvalidData:
  status: 400
  return: '{"acknowledgementType":"NCRN_Ack","statusCode":"InvalidData","statusMessage":"Request does not satisfy the ERRU NCR requirements"}'
  next: end

returnUnavailable:
  status: 502
  return: '{"statusCode":"ServerError","statusMessage":"Inbound notification processing is incomplete"}'
  next: end
