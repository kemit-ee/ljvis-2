declaration:
  version: "1.0"
  description: >-
    Receive and acknowledge NU messages idempotently. Internal endpoint.
    TODO(M2M): OAuth2 machine-token auth. Pending platform client_credentials support,
    following the CGR/CTUD/RSI/NCR inbound precedent.
  namespace: erru
  allowlist:
    body:
      - field: technicalId
        type: string
      - field: workflowId
        type: string
      - field: sentAt
        type: string
      - field: from
        type: string
      - field: businessCaseId
        type: string
      - field: originatingAuthority
        type: string
      - field: requestSource
        type: string
      - field: requestPurpose
        type: string
      - field: tmFirstName
        type: string
      - field: tmFamilyName
        type: string
      - field: tmDateOfBirth
        type: string
      - field: tmPlaceOfBirth
        type: string
      - field: tmFirstNameSearchKey
        type: string
      - field: tmFamilyNameSearchKey
        type: string
      - field: certificateNumber
        type: string
      - field: certificateIssueDate
        type: string
      - field: certificateIssueCountry
        type: string
      - field: unfitStartDate
        type: string
      - field: receivedAt
        type: string

# Shared Ruuter/Ruuter.internal rules: erru.nu_validate (docs/integrations/erru-nu-exchange.md).
validateEnvelope:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/validate"
    body:
      payload: "${JSON.stringify(incoming.body)}"
      kind: "inbound"
  result: validation
  next: checkValidation

checkValidation:
  switch:
    - condition: ${JSON.parse(validation.response.body[0].result).valid !== true}
      next: returnInvalidData
    - condition: ${incoming.body.requestPurpose === 'Heartbeat'}
      next: returnHeartbeatAck
  next: extractRequestData

extractRequestData:
  assign:
    technical_id: "${('' + (incoming.body.technicalId || '')).trim()}"
    workflow_id: "${('' + (incoming.body.workflowId || '')).trim()}"
    sent_at: "${('' + (incoming.body.sentAt || '')).trim()}"
    nu_from: "${('' + (incoming.body.from || '')).trim().toUpperCase()}"
    business_case_id: "${('' + (incoming.body.businessCaseId || '')).trim()}"
    originating_authority: "${('' + (incoming.body.originatingAuthority || '')).trim()}"
    request_source: "${('' + (incoming.body.requestSource || '')).trim()}"
    request_purpose: "${('' + (incoming.body.requestPurpose || '')).trim()}"
    tm_first_name: "${('' + (incoming.body.tmFirstName || '')).trim()}"
    tm_family_name: "${('' + (incoming.body.tmFamilyName || '')).trim()}"
    tm_date_of_birth: "${('' + (incoming.body.tmDateOfBirth || '')).trim()}"
    tm_place_of_birth: "${('' + (incoming.body.tmPlaceOfBirth || '')).trim()}"
    tm_first_name_search_key: "${('' + (incoming.body.tmFirstNameSearchKey || '')).trim()}"
    tm_family_name_search_key: "${('' + (incoming.body.tmFamilyNameSearchKey || '')).trim()}"
    certificate_number: "${('' + (incoming.body.certificateNumber || '')).trim()}"
    certificate_issue_date: "${('' + (incoming.body.certificateIssueDate || '')).trim()}"
    certificate_issue_country: "${('' + (incoming.body.certificateIssueCountry || '')).trim().toUpperCase()}"
    unfit_start_date: "${('' + (incoming.body.unfitStartDate || '')).trim()}"
    received_at: "${('' + (incoming.body.receivedAt || '')).trim()}"
  next: storeAtomic

storeAtomic:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/append-inbound"
    headers:
      type: json
    body:
      technicalId: ${technical_id}
      workflowId: ${workflow_id}
      sentAt: ${sent_at}
      nuFrom: ${nu_from}
      businessCaseId: ${business_case_id}
      originatingAuthority: ${originating_authority}
      requestSource: ${request_source}
      requestPurpose: ${request_purpose}
      tmFirstName: ${tm_first_name}
      tmFamilyName: ${tm_family_name}
      tmDateOfBirth: ${tm_date_of_birth}
      tmPlaceOfBirth: ${tm_place_of_birth}
      tmFirstNameSearchKey: ${tm_first_name_search_key}
      tmFamilyNameSearchKey: ${tm_family_name_search_key}
      certificateNumber: ${certificate_number}
      certificateIssueDate: ${certificate_issue_date}
      certificateIssueCountry: ${certificate_issue_country}
      unfitStartDate: ${unfit_start_date}
      receivedAt: ${received_at}
      created_by: "system"
  result: stored_res
  next: checkStored
checkStored:
  switch:
    - condition: ${stored_res.response == null || stored_res.response.status >= 400}
      next: returnUnavailable
    - condition: ${stored_res.response.body == null || stored_res.response.body.length != 1}
      next: lookupExisting
  next: extractStored

extractStored:
  assign:
    message_key: "${stored_res.response.body[0].id}"
    # Resql returns camelCase field names regardless of the snake_case `returns:` declaration.
    unfit_start_date: "${stored_res.response.body[0].unfitStartDate}"
  next: createNuNotification

lookupExisting:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/get-by-technical-id"
    headers:
      type: json
    body:
      technical_id: ${technical_id}
  result: existing_res
  next: checkExisting

checkExisting:
  switch:
    - condition: ${existing_res.response == null || existing_res.response.status >= 400 || existing_res.response.body == null || existing_res.response.body.length != 1}
      next: returnUnavailable
  next: checkAuditExists

# Resume side effects when the business snapshots committed before notification/audit.
# The audit lookup also recognises legacy events that predate the separate deduplication
# key table. A saved audit marks the completed path; otherwise restore the notification
# (idempotent by event_key) and write the audit through record-inbound-audit.
checkAuditExists:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/audit-event-exists"
    headers:
      type: json
    body:
      message_key: "${'' + existing_res.response.body[0].id}"
  result: audit_check
  next: checkAuditExistsResult

checkAuditExistsResult:
  switch:
    - condition: ${audit_check.response.body && audit_check.response.body[0] && audit_check.response.body[0].exists === true}
      next: getSavedAck
  next: resumeExtractExisting

resumeExtractExisting:
  # Resql returns camelCase field names (businessCaseId, nuFrom, ...) regardless of the
  # snake_case `returns:` declaration in the .sql file.
  assign:
    # storeAtomic has already run on this path too (with an empty result), so stored_res is
    # defined here; afterLogAudit needs an explicit flag to tell the resume path apart.
    is_resume: true
    message_key: "${existing_res.response.body[0].id}"
    business_case_id: "${existing_res.response.body[0].businessCaseId}"
    nu_from: "${('' + (existing_res.response.body[0].nuFrom || '')).trim()}"
    request_source: "${('' + (existing_res.response.body[0].requestSource || '')).trim()}"
    request_purpose: "${('' + (existing_res.response.body[0].requestPurpose || '')).trim()}"
    tm_first_name: "${('' + (existing_res.response.body[0].tmFirstName || '')).trim()}"
    tm_family_name: "${('' + (existing_res.response.body[0].tmFamilyName || '')).trim()}"
    tm_date_of_birth: "${('' + (existing_res.response.body[0].tmDateOfBirth || '')).trim()}"
    certificate_number: "${('' + (existing_res.response.body[0].certificateNumber || '')).trim()}"
    unfit_start_date: "${('' + (existing_res.response.body[0].unfitStartDate || '')).trim()}"
  next: createNuNotification
createNuNotification:
  call: http.post
  args:
    url: "[#LJVIS_RUUTER_INTERNAL]/notification/create"
    headers:
      type: json
    body:
      type: "nu_inbound_received"
      required_permission: "nu.read"
      related_entity_type: "nu"
      related_entity_id: "${'' + message_key}"
      event_key: ${technical_id}
      title_et: "Saabus uus NU sobimatusteade"
      body_et: "${'Saabus sobimatusteade ' + business_case_id + ' riigist ' + nu_from + '.'}"
      created_by: "system"
  result: notifRes
  error: returnUnavailable
  next: checkNotification

checkNotification:
  switch:
    - condition: ${notifRes.response == null || notifRes.response.status >= 400}
      next: returnUnavailable
  next: buildAudit

buildAudit:
  assign:
    audit_description: "NU sissetuleva sobimatusteate salvestamine: teate number ${business_case_id}, saatjariik ${nu_from}, päringu allikas ${request_source}, päringu eesmärk ${request_purpose}, veokorraldusjuht ${tm_family_name} ${tm_first_name} (${tm_date_of_birth}), tunnistuse number ${certificate_number}, sobimatuse algus ${unfit_start_date}"
    # nuMessageKey lets erru/nu/audit-event-exists.sql correlate the audit event with its NU
    # message; audit.audit_event has no foreign key to nu_message by design.
    audit_log_content: "${JSON.stringify(Object.fromEntries([['nuMessageKey', '' + message_key], ['businessCaseId', business_case_id || null], ['nuFrom', nu_from || null], ['requestSource', request_source || null], ['requestPurpose', request_purpose || null], ['tmFirstName', tm_first_name || null], ['tmFamilyName', tm_family_name || null], ['certificateNumber', certificate_number || null], ['unfitStartDate', unfit_start_date || null]]))}"
  next: logAudit

logAudit:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/record-inbound-audit"
    headers:
      type: json
    body:
      event_type: "nu.inbound_request.store"
      message_key: "${'' + message_key}"
      description: ${audit_description}
      log_content: ${audit_log_content}
  result: audit_result
  error: returnUnavailable
  next: checkAuditSaved

checkAuditSaved:
  switch:
    - condition: ${audit_result.response == null || audit_result.response.status >= 400 || !audit_result.response.body || audit_result.response.body.length !== 1}
      next: returnUnavailable
  next: afterLogAudit

# createNuNotification/buildAudit/logAudit are shared by two paths: the fresh insert returns
# stored_res's own acknowledgement; the resume path (is_resume) returns the already-saved ACK.
afterLogAudit:
  switch:
    - condition: ${typeof is_resume !== 'undefined' && is_resume === true}
      next: getSavedAck
  next: returnAck

returnAck:
  return: "${stored_res.response.body[0].acknowledgement}"
  next: end

getSavedAck:
  call: http.post
  args:
    url: "[#LJVIS_RESQL]/erru/nu/get-ack"
    body:
      key: ${existing_res.response.body[0].id}
  result: savedAck
  next: returnReplayedAck

returnReplayedAck:
  return: "${savedAck.response.body.length === 1 ? savedAck.response.body[0].result : JSON.stringify({statusCode: 'ServerError'})}"
  next: end

returnHeartbeatAck:
  return: '{"acknowledgementType":"NotifyUnfitness_Acknowledgement","statusCode":"OK","statusMessage":""}'
  next: end

returnInvalidData:
  status: 400
  return: '{"acknowledgementType":"NotifyUnfitness_Acknowledgement","statusCode":"InvalidData","statusMessage":"Request does not satisfy the ERRU 3.5 NU requirements"}'
  next: end

returnUnavailable:
  status: 502
  return: '{"statusCode":"ServerError","statusMessage":"Inbound notification processing is incomplete"}'
  next: end
